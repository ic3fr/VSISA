:"Parallele Diagonalen, leicht zu erkennen: Meshtastic und MeshCore auf 869,525 MHz oder 433 MHz, LoRaWAN-Sensoren (Blätter 13, 23 und 24)."},"sstv":{"t":"SSTV: Bilder als Ton","h":"Ein Synchronimpuls auf 1200 Hz, dann folgt die Frequenz der Helligkeit der Zeile, von 1500 (schwarz) bis 2300 Hz (weiß).","l":"Regelmäßige Synchronstriche und eine Wolke, die sich mit dem Bild ändert; ein „zwitschernder“ Ton für ein bis zwei Minuten. 14,230 MHz, ISS auf 145,800 MHz (Blatt 37).","r":[["Rahmen","VIS-Kopf, dann Zeilen: Synchron 1200 Hz, Grün, Blau, Rot; hier 20 Zeilen eines Testbilds"],["Dekodierung","QSSTV, MMSSTV, Robot36 auf dem Smartphone"]]},"fax":{"nm":"Wetterfax","t":"Wetterfax: 1500 Hz schwarz, 2300 Hz weiß","h":"Die Frequenz geht stufenlos von Schwarz nach Weiß, 120 Zeilen pro Minute.","l":"Zwei feste Bänder auf 1500 und 2300 Hz (800 Hz Abstand), ein regelmäßiges „Tick-Tack“. Veröffentlicht wird die Trägerfrequenz: in USB 1,9 kHz tiefer hören (Blatt 38).","r":[["Rahmen","Startton 300 Hz, Phasenzeilen (weißer Impuls), dann die Karte"],["Dekodierung","fldigi, JWX, HamFax"]]},"elt":{"nm":"ELT-Sirene","t":"ELT- / PLB-Sirene auf 121,5 MHz","h":"Eine AM, deren Ton zwei- bis viermal pro Sekunde von 1600 auf 300 Hz fällt.","l":"Ein fester Träger und fächerartig gleitende Seitenbänder: das „Wu-wu“ der Notsender, auch auf 121,375 MHz für Übungen (Blätter 27 und 28)."},"406":{"nm":"406-Bake","t":"406-MHz-Bake: BPSK-Paket","h":"Eine halbe Sekunde Sendung: 160 ms reiner Träger, dann kippt die Phase um ±1,1 Radiant mit 400 bit/s.","l":"Ein kleiner kurzer Strich, der alle 50 s wiederkommt, zwischen 406,0 und 406,1 MHz; nichts Nützliches zu hören, ein Dekoder ist nötig (EPIRB 406, Blatt 28)."},"adsb":{"t":"ADS-B / Mode S (1090 MHz): Impulse","h":"Impulse von 0,5 µs, deren Lage die Bits trägt (PPM); hier ist die Zeitachse stark verlangsamt.","l":"Sehr kurze waagerechte Striche über die ganze Breite, Hunderte pro Sekunde nahe einem Flughafen; ein SDR-Stick ist nötig (Blatt 15).","n":"Zeitachse stark verlangsamt"},"acars":{"t":"ACARS: AM und MSK-Daten","h":"Eine AM, die zwei Töne trägt, 1200 und 2400 Hz, mit 2400 bit/s.","l":"Halbsekündige Pakete mit Träger und Seitenbändern, auf 131,525, 131,725 oder 131,825 MHz in Europa: ein „brrrt“ im Ohr (Blatt 16)."},"ais":{"t":"AIS: GMSK 9600 Baud auf zwei Kanälen","h":"Eine geglättete FSK (GMSK) in Paketen von 26 ms, einmal auf 161,975 MHz, einmal auf 162,025 MHz (verkleinert).","l":"Zwei Spalten kurzer Striche, 50 kHz auseinander, ein regelmäßiges Klacken; je mehr Schiffe, desto dichter (Blatt 19).","n":"verkleinert"},"navtex":{"t":"NAVTEX und DSC auf Mittel- und Kurzwelle: FSK 170 Hz","h":"Wie RTTY: zwei Frequenzen mit 170 Hz Abstand, aber mit 100 Baud.","l":"Zwei parallele Striche, durchgehend während der Meldung, auf 518 und 490 kHz (NAVTEX) oder 2187,5 kHz (digitaler Selektivruf) (Blatt 20).","r":[["Code","SITOR-B, CCIR 476: 7 Bit mit vier „1“, mit FEC-Wiederholung"],["Dekodierung","fldigi, YaND"]]},"hfdl":{"t":"HFDL: Flugzeuge auf Kurzwelle","h":"Eine PSK mit 1800 Baud auf einem 1440-Hz-Hilfsträger.","l":"Pakete von etwa 2,4 kHz zwischen 2,9 und 22 MHz; ein Modemrauschen, das kommt und geht (Blatt 17)."},"ctcss":{"t":"CTCSS: Subton unter der Stimme","h":"Ein tiefer Dauerton (67 bis 254 Hz, hier 88,5 Hz) wird der Stimme hinzugefügt.","l":"Im Ton des FM-Empfängers: ein fester Strich ganz unten, unter der Stimme; er öffnet die Rauschsperre von Relais und Handfunkgeräten (Blatt 10)."},"dtmf":{"sh":"2 Töne","t":"DTMF: zwei Töne pro Taste","h":"Jede Taste sendet gleichzeitig einen tiefen (697 bis 941 Hz) und einen hohen Ton (1209 bis 1633 Hz).","l":"Punktpaare auf acht festen Spalten; das „Piep-Piep“ von Telefonnummern und Relaisbefehlen (Blatt 10).","r":[["Folge","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 Töne","t":"Selcall CCIR: Tonfolge","h":"Fünf Töne von 100 ms nacheinander, einer pro Ziffer.","l":"Eine kleine Treppe aus Punkten, wiederholt; ein schnelles „tululululu“, um ein bestimmtes Gerät zu rufen (Blatt 33).","r":[["Folge","1 2 3 4 5, zweimal; auch von der SelCall-App des UV-K1 dekodiert"]]},"pocsag":{"sh":"Pager","t":"POCSAG und FLEX: Pager","h":"Eine FSK mit ±4,5 kHz; eine Präambel 1010…, dann die Daten (verkleinert).","l":"Zwei saubere Striche während der Präambel, dann ein volles Band; ein schrilles „brrrrt“. 466,075 MHz, DAPNET 439,9875 MHz (Blatt 45).","n":"verkleinert"},"ale":{"sh":"8 Töne","t":"ALE: automatischer Verbindungsaufbau auf Kurzwelle","h":"Acht Töne von 750 bis 2500 Hz, 125 Baud, in Paketen.","l":"Ein Block von etwa 2 kHz aus kleinen Punkten, ein bis zwei Sekunden, manchmal auf mehreren benachbarten Frequenzen; ein hohes Zwitschern (Blatt 34)."},"rs41":{"nm":"Radiosonde RS41","t":"Radiosonde RS41: Dauer-GFSK","h":"Eine geglättete FSK mit 4800 Baud, ohne Pause; die Frequenz driftet langsam, wenn die Sonde steigt und abkühlt.","l":"Ein Band von etwa 10 kHz, das während des ganzen Flugs schräg wandert, zwischen 400 und 406 MHz (Blatt 21)."},"ook":{"nm":"433-Sensoren","t":"433-MHz-Sensoren: OOK","h":"Der Träger geht in kurzen oder langen Impulsen an und aus (Ein-Aus-Tastung); die Nachricht wird dreimal wiederholt.","l":"Pakete kleiner Punkte, oft dreifach, auf 433,92 MHz: Wetterstationen, Temperaturfühler, Fernbedienungen (Blatt 22)."},"fhss":{"t":"Bluetooth: Frequenzsprungverfahren (FHSS)","h":"Die Frequenz wechselt 1600-mal pro Sekunde unter 79 Kanälen (verkleinert).","l":"Kleine Striche überall verstreut auf 80 MHz Breite, nie an derselben Stelle, um 2,4 GHz (Blatt 25).","n":"verkleinert"},"wspr":{"t":"WSPR: Ausbreitungsbaken","h":"Vier Töne im Abstand von 1,46 Hz, 0,68 s pro Symbol, 110,6 s lang.","l":"Ein sehr feiner Strich von etwa 6 Hz, der fast zwei Minuten dauert, zu jeder geraden Minute: man muss stark heranzoomen (Blatt 29).","n":"Auszug von 24 s (eine Sendung dauert 110,6 s)"},"qrss":{"t":"QRSS: sehr langsames Morse","h":"Ein ein- und ausgeschalteter Träger mit Punkten von 3 bis 10 s, oft auf zwei benachbarten Frequenzen (DFCW).","l":"Striche von wenigen Hz Breite, auf einem Zehn-Minuten-Bildschirm gelesen; mit dem Ohr nicht hörbar (Blatt 30).","n":"beschleunigt: Punkt 0,6 s statt 3 bis 10 s"},"texte":{"nm":"Text im Wasserfall","t":"Text im Wasserfall","h":"Jede Zeile eines Bildes wird zu einer Gruppe von Tönen: der Klang ähnelt Rauschen.","l":"Text oder Zeichnung erscheinen direkt auf dem SDR-Bildschirm (Blatt 40).","r":[["Hinweis","Von unten nach oben gesendet: aufrecht im Live-Wasserfall, kopfüber im Abdruck (von oben nach unten gelesen)"]]},"vara":{"t":"Moderne KW-Daten: VARA, Pactor, ARDOP","h":"Lange volle Pakete (OFDM oder PSK) und dazwischen kurze Antworten der Gegenstation.","l":"Ein Rechteck von etwa 2,4 kHz, das stoppt und neu startet, mit einer kleinen Quittung dazwischen; ein abgehacktes Rauschen (Blatt 29)."},"chirp":{"nm":"Ionosonde","t":"Ionosonde (Chirp-Sounder)","h":"Eine langsame Frequenzrampe quer durch das ganze KW-Band; die Echos der Ionosphäre kommen etwas später.","l":"Eine Diagonale über den Bildschirm, begleitet von parallelen Strichen (den Echos); ein „ffuit“, das in Sekundenbruchteilen vorbeizieht."},"oth":{"nm":"Überhorizontradar","t":"Überhorizontradar („Woodpecker“)","h":"Impulse, 10- bis 50-mal pro Sekunde wiederholt, jeder mehrere kHz breit.","l":"Ein breiter gestreifter Block, der ganze Bänder bedeckt; ein sehr regelmäßiges Specht-Klopfen auf Kurzwelle."},"parasites":{"nm":"Störungen","sh":"Netzteil","t":"Störungen eines Schaltnetzteils","h":"Ein Rechtecksignal: seine Frequenz und alle Oberwellen kommen gleichzeitig heraus.","l":"Ein Kamm regelmäßiger Linien, die zusammen driften, auf Rauschgrund: mit NOISE FIND oder einem tragbaren Empfänger suchen (Blatt K22)."},"mpx":{"nm":"UKW-Stereo und RDS","t":"UKW-Stereo und RDS","h":"Der demodulierte Ton (Multiplex) enthält den L+R-Kanal, einen Pilotton bei 19 kHz, den L-R-Kanal um 38 kHz und RDS bei 57 kHz.","l":"Von 0 bis 60 kHz nach der Demodulation: ein tiefer Block, ein feiner Strich bei 19 kHz, ein schwächerer Block in der Mitte und RDS ganz oben (Blatt 12).","n":"Maßstab ÷ 20; Stereoton","r":[["Hören","Mit Kopfhörer: 4 s mono (der mittlere Block, L-R, verschwindet), dann 4 s stereo, die Melodie links und die Akkorde rechts."]]},"dcf77":{"t":"Zeitsignal DCF77 (77,5 kHz)","h":"Ein Träger, der zu Beginn jeder Sekunde für 0,1 s (Bit 0) oder 0,2 s (Bit 1) auf 15 % absinkt.","l":"Ein fester Strich mit einer schwarzen Lücke jede Sekunde; die 59. Sekunde hat keine, um die Minute zu markieren (Blatt 12).","r":[["Hinweis","Hier liegt der Träger auf 1000 Hz; die 6. Sekunde hat keine Lücke, wie die 59. Sekunde jeder Minute"]]},"ofdm":{"t":"OFDM: Dutzende Unterträger","h":"Viele eng gepackte Träger, jeder langsam: die Summe sieht aus wie Rauschen.","l":"Ein flaches Rechteck mit scharfen Kanten, immer da: DRM auf Kurzwelle (10 kHz), DAB+ (1,5 MHz), DVB-T, WLAN. Ein gleichmäßiges Rauschen im Ohr (Blätter 12 und 25)."},"dsss":{"t":"Spreizspektrum (DSSS): GPS, WLAN 802.11b","h":"Die Daten werden mit einem sehr schnellen Code gemischt: die Energie verteilt sich über eine große Breite.","l":"Ein breiter Buckel, kaum über dem Rauschen; GPS liegt sogar unter dem Rauschen und ist ohne Verarbeitung nicht zu sehen (Blätter 25 und 26)."},"hline":{"nm":"Wasserstofflinie","sh":"1420 MHz","t":"21-cm-Wasserstofflinie (1420,405 MHz)","h":"Kalter Wasserstoff der Milchstraße sendet ein sehr schwaches Rauschen auf 1420,405 MHz. Die Bewegung der Spiralarme verschiebt es durch den Dopplereffekt: man sieht mehrere kleine Buckel.","l":"Im Wasserfall von Sekunde zu Sekunde fast nichts: man muss lange mitteln, bis die Buckel aus dem Rauschen auftauchen. Hier im angehaltenen Zustand das mittlere Spektrum ansehen. Eine Schüssel oder ein Horn, ein Vorverstärker und ein SDR-Stick genügen.","n":"Signal stark übertrieben"},"sun":{"nm":"Sonne","sh":"Bursts","t":"Sonne: Radiobursts vom Typ III","h":"Von einem Flare ausgeschleuderte Elektronen durchqueren die Sonnenkorona und lassen sie immer tiefer senden, je weiter sie sich entfernen.","l":"Striche, die in weniger als einer Sekunde schräg von oben nach unten durch das Spektrum fallen, über solarem Rauschen; ein anschwellendes „schhhh“. Etwa 10 bis 400 MHz, auch auf Kurzwelle um 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter: Dekameter-Bursts (L und S)","h":"Jupiters Magnetfeld und sein Mond Io erzeugen starke Emissionen zwischen 15 und 40 MHz: langsame L-Bursts und sehr kurze S-Bursts, die schnell nach unten gleiten.","l":"Zuerst Rauschwellen (L, wie Brandung), dann Folgen kleiner „Pops“ (S) in engen Diagonalen. Um 20,1 MHz nachts, mit einem einfachen Dipol, wenn Io gut steht."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Ein rotierender Neutronenstern überstreicht die Erde mit einem Radiostrahl, hier alle 0,714 s. Das interstellare Gas verzögert die tiefen Frequenzen: jeder Impuls kommt zuerst oben im Spektrum an.","l":"Ein regelmäßiges „Tick“; im Wasserfall ist jeder Impuls eine abfallende Kurve (Dispersion). Das echte Signal liegt unter dem Rauschen: man braucht eine große Antenne und muss die Impulse über ihre Periode aufaddieren.","n":"Signal stark übertrieben"},"meteor":{"nm":"Meteore","sh":"GRAVES","t":"Meteorechos vom GRAVES-Radar (143,050 MHz)","h":"Das französische GRAVES-Radar sendet ununterbrochen auf 143,050 MHz. Ionisiert eine Sternschnuppe die Luft, wirft ihre Spur etwas von diesem Signal zu deinem Empfänger, für Sekundenbruchteile bis einige Sekunden.","l":"In USB auf 143,049 MHz: kurze „Pings“ um 1000 Hz, manchmal ein gleitendes Echo (der Meteorkopf, Dopplereffekt) oder ein lang anhaltendes. Viel mehr während der Schauer (Perseiden, Geminiden) (Blatt 1)."},"whistler":{"nm":"Whistler","sh":"VLF","t":"VLF-Whistler (Pfeiftöne)","h":"Ein Blitz erzeugt einen Radioknack; ein Teil folgt den Feldlinien des Erdmagnetfelds bis zur anderen Halbkugel und zurück, die hohen Töne zuerst.","l":"Ein „Tjiuuu“, das in ein bis zwei Sekunden von hoch nach tief fällt, direkt nach einem Knack; überall Knistern (Sferics). Unter 10 kHz, mit einem VLF-Empfänger fern von Stromleitungen."},"chorus":{"nm":"Morgenchor","sh":"VLF","t":"Morgenchor (Dawn Chorus)","h":"Bei einem Magnetsturm senden in der Magnetosphäre gefangene Elektronen kleine aufsteigende Töne, vor allem bei Sonnenaufgang.","l":"Sich überlagernde, aufsteigende Zwitschertöne wie Vögel, etwa 1 bis 4 kHz. Gleiche Ausrüstung wie für Whistler."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"Der erste künstliche Satellit sendete drei Wochen lang Pieptöne von etwa 0,3 s abwechselnd auf 20,005 und 40,002 MHz.","l":"Ein regelmäßig unterbrochener Strich: „Piep… Piep…“, der Klang, dem im Oktober 1957 die ganze Welt lauschte (Nachbildung)."},"doppler":{"nm":"Dopplereffekt","sh":"Satellit","t":"Satellitenbake und Dopplereffekt","h":"Ein Satellit in niedriger Bahn nähert sich und entfernt sich wieder: die Empfangsfrequenz sinkt während des Überflugs, um etwa ±3 kHz bei 145 MHz und ±10 kHz bei 435 MHz.","l":"Ein S-förmig abfallender Strich: erst langsam, schnell beim nächsten Punkt, dann wieder langsam (Blatt 41).","n":"10-min-Überflug auf 12 s verkürzt"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA-Satelliten: APT-Bilder (historisch)","h":"Ein 2400-Hz-Hilfsträger, vom Bild amplitudenmoduliert, zwei Zeilen pro Sekunde, mit einem Synchronimpuls am Anfang jeder Zeile. 2025 abgeschaltet; heute senden die Meteor-M-Satelliten LRPT.","l":"Ein Strich bei 2400 Hz mit Seitenbändern, die sich mit dem Bild ändern, und das berühmte „Tick-Tack“ zweimal pro Sekunde (Blatt 41)."},"eme":{"nm":"Mondecho","sh":"EME","t":"Mondecho (EME)","h":"Ein zum Mond gesendetes Signal kommt etwa 2,5 s später zurück, enorm geschwächt, etwas verbreitert und durch Doppler verschoben.","l":"Man hört das eigene „Piep“ und 2,5 s später sein schwaches, leicht verwaschenes Echo. Funkamateure machen das in CW oder JT65, ab 144 MHz (Blatt 1).","n":"Echo stark übertrieben"},"msk144":{"nm":"MSK144","sh":"Meteore","t":"MSK144: die Digitalbetriebsart für Meteorscatter","h":"Zwei Töne, 1000 und 2000 Hz, mit 2000 Baud, in Rahmen von 72 ms ohne Pause wiederholt: jede Meteorspur lässt einige davon durch.","l":"Pakete von 0,1 bis 1 s, etwa 2,4 kHz breit, die mit dem „Ping“ des Meteors erscheinen und verlöschen. Auf 50 und 144 MHz, mit WSJT-X."},"jt65":{"nm":"JT65","sh":"65 Töne","t":"JT65: 65 Töne, sehr langsam","h":"Ein Synchronton und 64 Datentöne im Abstand von 2,7 Hz (JT65A), 0,37 s pro Symbol, 47 s Sendung pro Minute.","l":"Eine Leiter kleiner Striche über etwa 180 Hz, mit einem Synchronstrich, der immer an dieselbe Stelle zurückkehrt. Für Mondreflexion (JT65B und C) und sehr schwache Signale.","n":"Auszug von 20 s (eine Sendung dauert 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: professioneller Digitalfunk","h":"Phasenmodulation π/4-DQPSK mit 18 000 Symbolen pro Sekunde, vier Zeitschlitze, in 25-kHz-Kanälen.","l":"Ein voller Block mit runden Flanken, nahe einer Basisstation ständig da; ein raues Rauschen. Verschlüsselt: nicht abhörbar (Blatt 46).","n":"verkleinert"},"ndb":{"nm":"NDB-Funkfeuer","sh":"190–535 kHz","t":"NDB: ungerichtetes Funkfeuer","h":"Ein fester Träger auf Langwelle mit einer Morsekennung aus zwei oder drei Buchstaben, auf einem Ton gesendet (oft 1020 Hz).","l":"Ein fester Strich in der Mitte und während der Kennung zwei kleine Striche links und rechts. Etwa 190 bis 535 kHz, in SSB oder CW (Blatt 12)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: UKW-Drehfunkfeuer","h":"In AM: ein richtungsabhängiges 30-Hz-Signal, ein mit 30 Hz frequenzmodulierter 9960-Hz-Hilfsträger (die Referenz) und die Morsekennung auf 1020 Hz.","l":"Im demodulierten Ton: ein tiefes 30-Hz-Brummen, ein breiter, welliger Strich um 10 kHz und ab und zu die Kennung (Blatt 18).","n":"demodulierter Ton, Maßstab ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: Landeführung (Localizer)","h":"In AM zwei Töne von 90 und 150 Hz; ihr Verhältnis sagt dem Flugzeug, ob es links oder rechts der Achse ist. Die Morsekennung beginnt mit I.","l":"Im demodulierten Ton: zwei sehr tiefe Striche bei 90 und 150 Hz und die Kennung auf 1020 Hz. Zwischen 108,1 und 112 MHz; der Gleitweg liegt um 330 MHz (Blatt 18)."},"m10":{"nm":"Sonden M10 / M20","sh":"Meteomodem","t":"Radiosonden M10 und M20 (Meteomodem)","h":"Ein Rahmen pro Sekunde in schneller FSK (etwa 9600 Baud): breiter als die RS41. In Frankreich von Météo-France gestartet.","l":"Jede Sekunde ein breites Paket, das während des Flugs langsam driftet; zwischen 400 und 406 MHz (Blatt 21)."},"tpms":{"nm":"Reifen (TPMS)","sh":"433 MHz","t":"Reifendrucksensoren (TPMS)","h":"Jedes Rad sendet ab und zu ein FSK-Paket von einigen Millisekunden: Druck, Temperatur, Kennung.","l":"Kleine einzelne Pakete auf 433,92 MHz (oder 315 MHz), oft paarweise, wenn ein Auto vorbeifährt. Von rtl_433 dekodiert."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Zeitsignal ALS162 (Allouis, 162 kHz)","h":"Der Träger der früheren Langwelle von France Inter; die Zeit ist in kleinen, unhörbaren Phasenmodulationen codiert.","l":"Ein fester Strich, in Frankreich sehr stark, am Anfang jeder Sekunde kaum verbreitert; zum Lesen der Zeit braucht man einen Dekoder (Blatt 12)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Zeitsignal WWV (Colorado)","h":"In AM: jede Sekunde ein 5-ms-„Tick“ auf 1000 Hz, ein 500- oder 600-Hz-Ton, ein Zeitcode auf 100 Hz und eine Stimme, die UTC ansagt.","l":"Im demodulierten Ton: ein 500-Hz-Strich, jede Sekunde unterbrochen, der Tick auf 1000 Hz und ganz unten der Code auf 100 Hz (Blatt 12)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Zeitsignal MSF (Anthorn, 60 kHz)","h":"Der Träger wird am Anfang jeder Sekunde je nach Bits für 0,1, 0,2 oder 0,3 s abgeschaltet, und für 0,5 s zur Minutenmarke.","l":"Ein fester Strich mit vollständig schwarzen Lücken jede Sekunde, länger als bei DCF77 (Blatt 12)."},"type2":{"nm":"Sonne Typ II","sh":"Stoßwelle","t":"Sonne: Radiobursts vom Typ II","h":"Die Stoßwelle eines koronalen Massenauswurfs lässt das Plasma langsam immer tiefer senden, oft in zwei Bändern (Grundwelle und Doppeltes).","l":"Zwei parallele Rauschbänder, die über mehrere Minuten sanft nach unten wandern. Zum Vergleich: Typ-III-Bursts sind viel schneller.","n":"mehrere Minuten auf 6 s verkürzt"},"tweeks":{"nm":"Tweeks","sh":"VLF","t":"Tweeks: die nächtlichen VLF-„Pings“","h":"Nachts prallt der Knack eines fernen Blitzes zwischen Boden und Ionosphäre hin und her; Frequenzen nahe der Grenzfrequenz (um 1,7 kHz) kommen zuletzt an.","l":"Ein kleines „Ping“, das abfällt und um 1,7 kHz endet, manchmal mit einem Echo bei der doppelten Frequenz; überall Knistern. Unter 10 kHz, nachts."},"hiss":{"nm":"VLF-Rauschen","sh":"Hiss","t":"VLF-Rauschen (Hiss)","h":"Ein breites Rauschen der Elektronen in der Plasmasphäre, das mit der magnetischen Aktivität steigt und fällt.","l":"Ein Rauschband von einigen hundert Hz bis einigen kHz, ohne Muster, das langsam anschwillt und abklingt."},"aurora":{"nm":"Radio-Aurora","sh":"Au","t":"Aurora-Ausbreitung (Au)","h":"Ein Polarlicht reflektiert UKW-Wellen, schüttelt sie aber sehr schnell: jedes Signal wird über einige hundert Hz verteilt.","l":"CW wird zu einem rauen, wie geflüsterten Rauschen; man hört keinen Ton mehr. Auf 50 und 144 MHz, Richtung Norden bei Magnetstürmen."},"galactic":{"nm":"Galaktisches Rauschen","sh":"20–40 MHz","t":"Rauschen der Milchstraße","h":"Das Zentrum der Galaxis sendet ein Radiorauschen, das Karl Jansky 1932 um 20 MHz entdeckte. Es steigt und fällt mit der Erddrehung.","l":"Ein Grundrauschen, das langsam steigt und wieder fällt, jeden Tag etwa 4 Minuten früher. Mit einem einfachen Dipol zwischen 20 und 40 MHz sichtbar.","n":"ein Tag auf 12 s verkürzt"},"cubesat":{"nm":"CubeSat","sh":"9600 Bd","t":"CubeSat-Telemetrie","h":"Kleinsatelliten senden regelmäßig ihre Messwerte (Batterie, Temperaturen) in FSK oder GMSK mit 1200 oder 9600 Baud um 435–438 MHz.","l":"Regelmäßige Pakete, die während des Überflugs durch den Dopplereffekt jedes Mal etwas tiefer liegen (Blatt 41).","n":"verkleinert, Überflug beschleunigt"},"issfm":{"nm":"ISS in FM","sh":"145,800 MHz","t":"Raumstation (ISS): Sprache in FM","h":"Astronauten sprechen mit Schulen und Funkamateuren in FM auf 145,800 MHz. Die Station fliegt mit 28 000 km/h: während des Überflugs wandert die Empfangsfrequenz von etwa +3,5 kHz auf −3,5 kHz.","l":"Ein FM-Sprachband, das während des 10-minütigen Überflugs langsam von rechts nach links wandert (Blatt 41).","n":"10-min-Überflug auf 10 s verkürzt"},"buzzer":{"nm":"UVB-76 „The Buzzer“","sh":"4625 kHz","t":"UVB-76, „The Buzzer“ (4625 kHz)","h":"Ein russischer Militärsender, der seit Jahrzehnten ein etwa einsekündiges Summen sendet, etwa 25-mal pro Minute, manchmal unterbrochen von einer Sprachnachricht.","l":"Ein fester Träger und bei jedem Summen eine Säule dichter Linien von oben nach unten. Leicht auf 4625 kHz in USB zu finden."},"pip":{"nm":"„The Pip“","sh":"3756 / 5448 kHz","t":"„The Pip“: endlose Pieptöne","h":"Eine weitere russische Militärbake auf Kurzwelle, die Tag und Nacht kurze Pieptöne wiederholt, manchmal von Nachrichten unterbrochen.","l":"Ein fester Strich, etwa 50-mal pro Minute von einem kurzen Piep unterbrochen; im Ohr ein gleichmäßiges „Pip… pip…“, das nie aufhört.","n":"Rhythmus angenähert"},"squeaky":{"nm":"„Squeaky Wheel“","sh":"KW","t":"„Squeaky Wheel“: das quietschende Rad","h":"Eine russische Militärbake auf Kurzwelle, von Hörern nach ihrem wiederholten Klangmuster benannt.","l":"Ein kleines Muster aus zwei Tönen, einer davon steigend, in Schleife wiederholt: wie ein quietschendes Rad.","n":"angenäherte Nachahmung"},"codar":{"nm":"CODAR","sh":"Meeresradar","t":"CODAR: Radare für Meeresströmungen","h":"Küstenradare überstreichen ein- oder zweimal pro Sekunde ein Frequenzband, um Strömungen und Wellen zu messen.","l":"Regelmäßige parallele Diagonalen und ein wiederholtes „Swish“; um 4,5–5,5 MHz, 13 MHz und 25 MHz, oft Tag und Nacht.","n":"verkleinert"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Militärmodem STANAG 4285","h":"8-PSK-Phasenmodulation mit 2400 Baud auf einem 1800-Hz-Träger, mit einer Testsequenz alle 107 ms zur Kanalverfolgung.","l":"Ein voller Block von etwa 3 kHz; im Ohr ein Rauschen mit regelmäßigem Summen (Blatt 43)."},"link11":{"nm":"Link-11","sh":"16 Töne","t":"Link-11: Marine-Datenverbindung","h":"Sechzehn Töne von 605 bis 2915 Hz gleichzeitig, jeder 75-mal pro Sekunde phasenmoduliert.","l":"Ein Kamm aus vierzehn regelmäßigen Linien von 935 bis 2365 Hz, dazu zwei abseits liegende Linien bei 605 und 2915 Hz; im Ohr ein musikalisches Brummen (Blatt 43)."},"numbers":{"nm":"Zahlensender","sh":"Stimme","t":"Zahlensender","h":"Zu fester Zeit eine kurze Erkennungsmelodie, dann liest eine (oft synthetische) Stimme Gruppen von fünf Ziffern, in AM oder SSB.","l":"Die Melodie als einzelne Töne, dann regelmäßige Silbengruppen mit Pausen dazwischen (Blatt 43).","n":"nachgeahmte Stimme, keine echten Ziffern"},"rttydwd":{"nm":"DWD-Wetter-RTTY","sh":"50 Bd / 450 Hz","t":"Wetter-RTTY des DWD (Deutschland)","h":"Wie das RTTY der Funkamateure, aber mit 50 Baud und 450 Hz Abstand: der Deutsche Wetterdienst sendet seine Berichte und Seewettervorhersagen im Klartext.","l":"Zwei viel weiter auseinanderliegende Striche und ein etwas schnellerer Rhythmus. Zwischen den Berichten der Anruf „CQ CQ CQ DE DDK2 DDH7 DDK9“, dann RYRYRY. Auf 4583, 7646 und 10 100,8 kHz, auch 147,3 kHz (Blatt 32)."},"mfsk16":{"nm":"MFSK16","sh":"16 Töne","t":"MFSK16: sechzehn Töne","h":"Sechzehn Töne im Abstand von 15,625 Hz, immer nur einer, 15,625-mal pro Sekunde; jeder Ton trägt vier Bit, durch Fehlerkorrektur geschützt.","l":"Ein 316 Hz breites Band aus kleinen Stufen, die ständig springen, nach einem festen Ton am Anfang. Im Ohr eine schnelle kleine Melodie, wie eine Flöte. Dient auch zum Senden kleiner Bilder."},"sitora":{"nm":"SITOR-A (ARQ)","sh":"Telex","t":"SITOR-A: Seefunk-Telex in ARQ","h":"Die Station sendet alle 450 ms Blöcke aus drei Zeichen (210 ms, 100 Baud, 170 Hz Abstand); dazwischen antwortet die Gegenstation mit einem kurzen Signal für „empfangen“ oder „wiederholen“.","l":"Kurze regelmäßige Pakete mit einer kleinen, schwächeren Antwort dazwischen: ein Grillen-„Tschirp-tschirp“. Auf Kurzwelle selten geworden."},"dscvhf":{"nm":"UKW-DSC (Kanal 70)","sh":"DSC","t":"DSC: digitaler Selektivruf auf Kanal 70","h":"Ein Paket von etwa einer halben Sekunde mit 1200 Baud auf zwei Tönen, 1300 und 2100 Hz: es enthält die MMSI-Nummer des Schiffs, die Art des Anrufs und im Notfall die Position.","l":"Ein kurzes, hohes „brrrt“ auf 156,525 MHz, das mit einer Folge wechselnder Bits beginnt. Auf Mittel- und Kurzwelle ist DSC eine FSK mit 100 Baud, wie NAVTEX (Blatt 20)."},"selcal":{"nm":"SELCAL Luftfahrt","sh":"4 Töne","t":"SELCAL: Selektivruf für Flugzeuge auf Kurzwelle","h":"Die Flugsicherung ruft ein bestimmtes Flugzeug mit zwei Impulsen von etwa einer Sekunde, jeder aus zwei von sechzehn Tönen (312,6 bis 1479,1 Hz). Im Flugzeug gehen eine Lampe und ein Gong an: die Besatzung muss nicht ständig mithören.","l":"Zwei Akkorde nacheinander, „Bing-Bong“, zwischen den Sprachmeldungen auf den Flugfunkfrequenzen in SSB, zum Beispiel 5616 oder 8864 kHz."},"dcs":{"nm":"DCS","sh":"134,4 bit/s","t":"DCS: der digitale Subton","h":"Statt eines Dauertons wie bei CTCSS sendet das Gerät unter der Stimme ein 23-Bit-Wort, pausenlos wiederholt, mit 134,4 Bit pro Sekunde. Am Ende schließt ein 134,4-Hz-Ton die Rauschsperre geräuschlos.","l":"Im Ton des FM-Empfängers: ein unregelmäßiges Band ganz unten, unter 300 Hz, und ein dumpfes Brummen, wenn das Filter des Geräts es durchlässt (Blatt 10)."},"t1750":{"nm":"1750-Hz-Ton","sh":"Relais","t":"1750-Hz-Ton: ein Relais öffnen","h":"Ein kurzer 1750-Hz-Ton (etwa 0,5 bis 1 s) am Anfang der Sendung öffnet noch manche europäische Amateurfunkrelais; das Relais antwortet beim Loslassen oft mit einem Piep.","l":"Ein kurzer Strich bei 1750 Hz, dann die Stimme, dann der Piep des Relais (Blatt 10)."},"ncdxf":{"nm":"NCDXF-Baken","sh":"14,100 MHz","t":"NCDXF-/IARU-Baken: Ausbreitung testen","h":"Achtzehn Baken weltweit senden reihum je zehn Sekunden auf 14,100, 18,110, 21,150, 24,930 und 28,200 MHz: das Rufzeichen in Morse, dann vier Striche von je einer Sekunde mit 100 W, 10 W, 1 W und 0,1 W.","l":"Ein Rufzeichen, dann vier immer schwächere Striche: hörst du noch den letzten, ist die Ausbreitung zu dieser Bake ausgezeichnet. Hier 4U1UN (New York), dann VE8AT (Kanada) (Blatt 30)."},"lrpt":{"nm":"Meteor-M LRPT","sh":"137,9 MHz","t":"Meteor-M-Satelliten: LRPT-Bilder","h":"Die russischen Wettersatelliten Meteor-M senden ihre Bilder digital: Vierphasenmodulation (QPSK), 72 000 Symbole pro Sekunde, etwa 120 kHz breit.","l":"Ein voller Block mit runden Kanten, der während des Überflugs langsam wandert (Dopplereffekt); im Ohr nur ein Rauschen. Auf 137,9 oder 137,1 MHz, dekodiert mit SatDump (Blatt 41).","n":"verkleinert"},"quindar":{"nm":"Quindar-Töne","sh":"NASA","t":"Quindar-Töne: die Apollo-Pieptöne","h":"Drückt Houston die Sprechtaste, schaltet ein 2525-Hz-Piep (250 ms) die Sender der Bodenstationen ein; beim Loslassen schaltet ein 2475-Hz-Piep sie aus.","l":"Ein hoher Piep vor jedem Satz und ein etwas tieferer danach: der berühmte Klang der Aufnahmen der Apollo-Missionen."},"wow":{"nm":"„Wow!“-Signal","sh":"1977","t":"Das „Wow!“-Signal (15. August 1977)","h":"Das Radioteleskop Big Ear (Ohio) empfing 72 Sekunden lang ein schmales, sehr starkes Signal nahe der Wasserstofflinie, bei etwa 1420,456 MHz. Der Astronom Jerry Ehman schrieb „Wow!“ auf den Ausdruck. Es wurde nie wieder gesehen, und sein Ursprung ist bis heute umstritten.","l":"Ein feiner Strich, der aus dem Rauschen auftaucht, stärker wird und wieder verschwindet: die Form einer festen Quelle, die durch die Antennenkeule wandert. Dies ist eine Nachbildung: eine Tonaufnahme gibt es nicht.","n":"72 s auf 12 s verkürzt"},"frb":{"nm":"Schneller Radioblitz","sh":"FRB","t":"Schneller Radioblitz (FRB)","h":"Ein Radioblitz von wenigen Millisekunden aus einer anderen Galaxie; der erste wurde 2007 entdeckt. Das durchquerte Gas verzögert die tiefen Frequenzen stark: der Blitz kommt gedehnt an, die hohen Töne zuerst.","l":"Eine einzige Kurve, die von oben nach unten durch das Spektrum fällt, dann nichts mehr. Manche wiederholen sich; die meisten sieht man nur einmal.","n":"stark verlangsamt und übertrieben"},"letterb":{"nm":"Ein-Buchstaben-Baken","sh":"D, P, S, C…","t":"Ein-Buchstaben-Baken","h":"Sender der russischen Marine wiederholen endlos einen einzigen Morsebuchstaben, jeder 100 Hz neben dem Nachbarn: D, P, S, C, A, F, K oder M je nach Standort.","l":"Parallele gepunktete Linien, sehr dicht beieinander, jede mit eigenem Rhythmus. Um 4558, 5154, 7039, 10 872, 13 528 und 16 332 kHz, in CW."},"sid":{"nm":"Sonneneruption auf VLF","sh":"SID","t":"Sonneneruption auf VLF gesehen (SID)","h":"Die VLF-Sender der Marinen (20,9 kHz in Frankreich, 23,4 kHz in Deutschland…) breiten sich zwischen Boden und Ionosphäre aus. Trifft eine Sonneneruption ein, verändern ihre Röntgenstrahlen die untere Ionosphäre in wenigen Minuten und der Empfangspegel springt.","l":"Ein schmales, gleichmäßiges Band (das MSK-Signal des Senders), das plötzlich stärker wird und dann langsam zum Normalwert zurückkehrt. Eine Drahtschleife und eine Soundkarte genügen: ein Klassiker der Astronomievereine.","n":"eine Stunde auf 12 s verkürzt"},"qrn":{"nm":"Gewitterstörungen","sh":"QRN","t":"Gewitterstörungen (QRN)","h":"Jeder Blitz ist ein sehr starker Sender, der alle Frequenzen zugleich überdeckt. Auf Mittel- und Kurzwelle hört man Gewitter in Tausenden Kilometern Entfernung, vor allem im Sommer und auf den tiefen Bändern.","l":"Unregelmäßige waagerechte Striche über die ganze Breite; trockenes Krachen im Ohr. Der Störaustaster (NB) hilft etwas, eine Rahmenantenne hilft mehr."},"fading":{"nm":"Selektiver Schwund","sh":"QSB","t":"Selektiver Schwund (QSB)","h":"Auf Kurzwelle kommt das Signal auf mehreren Wegen durch die Ionosphäre. Je nach Frequenz addieren sie sich oder löschen sich aus: eine schmale Senke wandert durch das Signal.","l":"Eine dunkle Zone, die langsam durch den AM-Sender wandert. Läuft sie über den Träger in der Mitte, klingt der Ton einige Sekunden rau und verzerrt; Synchrondetektor oder SSB-Empfang beheben das."},"plc":{"nm":"Powerline (PLC)","sh":"2–30 MHz","t":"PLC: Internet über die Steckdose","h":"Powerline-Adapter schicken die Daten über die Hausleitungen, auf Hunderten Trägern zwischen 2 und 30 MHz (bei neueren Modellen höher), einer alle 24,4 kHz. Die Leitungen strahlen wie eine Antenne.","l":"Ein Kamm regelmäßiger Linien, der paketweise flackert, mit Lücken auf den Amateurfunkbändern (von der Norm verlangte Kerben); im Ohr ein Prasseln, das dem Internetverkehr folgt (Blatt 43).","n":"verkleinert"},"fence":{"nm":"Weidezaun","sh":"tack… tack…","t":"Elektrischer Weidezaun","h":"Das Weidezaungerät schickt etwa einmal pro Sekunde einen Impuls von mehreren tausend Volt in den Draht. Berührt Gras den Draht oder ist ein Isolator beschädigt, springt ein Funke über und strahlt auf allen Frequenzen.","l":"Ein sehr feiner waagerechter Strich über die ganze Breite, in völlig regelmäßigem Abstand; ein „Tack… tack…“ von Langwelle bis UKW. Der gleichmäßige Takt unterscheidet ihn vom Gewitter."},"gsm":{"nm":"GSM-Handy","sh":"217 Hz","t":"GSM-Handy neben einem Lautsprecher","h":"Ein 2G-Handy sendet in Paketen von 0,577 ms, 217-mal pro Sekunde. Ein schlecht abgeschirmter Audioverstärker demoduliert diese Pakete und macht sie hörbar.","l":"Ein Kamm von Linien alle 217 Hz; das bekannte „Dit-dit-didit“ kurz bevor das Handy klingelt, dann ein Dauerbrummen während des Gesprächs. Wird selten: die 2G-Netze werden abgeschaltet."},"jjy":{"nm":"JJY","sh":"40 / 60 kHz","t":"Zeitsignal JJY (Japan, 40 und 60 kHz)","h":"In jeder Sekunde sendet der Träger 0,8 s (Bit 0), 0,5 s (Bit 1) oder 0,2 s (Marke) mit voller Leistung und fällt dann auf 10 %. Umgekehrt wie bei DCF77, das am Sekundenanfang absenkt.","l":"Ein fester Strich, der am Ende jeder Sekunde früher oder später schwächer wird. Sender in Fukushima (40 kHz) und Saga-Fukuoka (60 kHz), für die Funkuhren in Japan."},"rwm":{"nm":"RWM","sh":"4996 kHz","t":"Zeitsignal RWM (Moskau)","h":"In Telegrafie auf 4996, 9996 und 14 996 kHz: jede Sekunde ein Impuls von 100 ms, in anderen Minuten zehn Impulse pro Sekunde. Das Rufzeichen RWM wird zweimal pro Stunde gemorst.","l":"Das Rufzeichen, dann ein Strich aus regelmäßigen „Ticks“, dann aus schnellen Punkten. In CW oder SSB hören.","n":"geraffter Auszug"},"bpm":{"nm":"BPM","sh":"2,5–15 MHz","t":"Zeitsignal BPM (China)","h":"Die Station Pucheng (Shaanxi) sendet in AM auf 2,5, 5, 10 und 15 MHz: jede Sekunde ein Tick von 10 ms auf 1000 Hz (300 ms zur Minute) und in bestimmten Minuten Ticks von 100 ms für die Zeit UT1. Das Rufzeichen BPM kommt in Morse, dann als Ansage.","l":"Im demodulierten Ton: das Rufzeichen, dann sehr kurze Striche auf 1000 Hz, einer pro Sekunde, mit einem längeren zur Minute. Oft mit WWV auf denselben Frequenzen gemischt.","n":"geraffter Auszug"},"humpback":{"nm":"Buckelwal","sh":"Gesang","t":"Der Gesang des Buckelwals","h":"Im Winter singen die Männchen in den Paarungsgebieten: eine Folge aus Stöhnen, Brummen und Rufen, die ein Thema bildet, stundenlang gleich wiederholt wird und sich von Saison zu Saison ändert. Hydrofone hören ihn noch in Dutzenden Kilometern Entfernung.","l":"Dicke Spuren mit ihren Oberwellen, die zwischen 100 Hz und einigen kHz langsam steigen oder fallen; dieselbe Folge kehrt nach einigen Sekunden wieder. Echos von Oberfläche und Meeresboden verlängern jeden Ton."},"bluewhale":{"nm":"Blauwal","sh":"×10","t":"Der Blauwal: der tiefste Ruf","h":"Das größte Tier der Erde stößt sehr tiefe (10 bis 40 Hz) und sehr laute Rufe aus, 10 bis 20 Sekunden lang und stundenlang wiederholt; sie tragen Hunderte Kilometer weit. Damit man sie hört, wird die Aufnahme zehnfach beschleunigt.","l":"Ein gepulster Teil, dann ein langer, kaum fallender Ton mit seinen Oberwellen darüber; die Folge wiederholt sich. Die Skala zeigt die echten Frequenzen.","n":"10-fach beschleunigt"},"finwhale":{"nm":"Finnwal","sh":"20 Hz","t":"Der Finnwal: die 20-Hz-Impulse","h":"Der Finnwal sendet etwa eine Sekunde lange Impulse, die von rund 25 auf 18 Hz fallen, in regelmäßigen Abständen, manchmal tagelang. In den 1950er- und 60er-Jahren rätselten die Horchnetze der US-Marine über diese „20-Hz-Signale“, bevor man sie diesem Wal zuordnete.","l":"Kurze, gleiche Striche, in regelmäßiger Folge oder paarweise, wie die Schläge eines sehr langsamen Herzens; jeder fällt leicht in der Frequenz. Die Skala zeigt die echten Frequenzen.","n":"10-fach beschleunigt"},"sperm":{"nm":"Pottwal","sh":"Klicks","t":"Die Klicks des Pottwals","h":"Der Pottwal jagt bei tiefen Tauchgängen mit seinem Sonar: sehr starke Klicks, etwa einer pro Sekunde, die sich beim Annähern an die Beute zu einem „Knarren“ beschleunigen. Untereinander tauschen Pottwale „Codas“ aus, kurze Klickfolgen, deren Rhythmus von Clan zu Clan verschieden ist.","l":"Waagerechte Striche über die ganze Breite, regelmäßig verteilt, dann dicht gedrängt zu einem Summen (das Knarren), dann ein kleines rhythmisches Muster: die Coda. Jeder Klick besteht aus mehreren dicht aufeinanderfolgenden Impulsen, die durch Reflexionen im Kopf des Tieres entstehen."},"dolphin":{"nm":"Großer Tümmler","sh":"Pfiffe","t":"Pfiffe und Klicks des Delfins","h":"Der Große Tümmler pfeift zwischen etwa 5 und 20 kHz; jedes Tier hat einen „Signaturpfiff“, der ihm als Name dient. Zum Jagen und zur Orientierung sendet er außerdem Folgen sehr kurzer Klicks, bis zu mehrere Hundert pro Sekunde.","l":"Feine Kurven, die steigen und wieder fallen, oft gleich wiederholt, und Salven waagerechter Striche für die Echoortung. Die Frequenzen sind durch 3 geteilt, damit man sie hört; die Skala zeigt die echten Werte.","n":"3-mal tiefer abgespielt"},"orca":{"nm":"Orca","sh":"Pulsrufe","t":"Die Pulsrufe des Orcas","h":"Orcas verständigen sich mit gepulsten Rufen: Impulsfolgen, so schnell (500 bis 2000 pro Sekunde), dass man sie als Ton hört, mit einem plötzlichen Tonhöhensprung. Jede Familiengruppe hat ihren eigenen „Dialekt“.","l":"Ein Stapel paralleler Spuren (die Oberwellen), die gemeinsam steigen oder fallen, mit einem deutlichen Knick in der Mitte des Rufs; manchmal ein feiner, höherer Pfiff."},"bseal":{"nm":"Bartrobbe","sh":"Triller","t":"Der Triller der Bartrobbe","h":"Im Frühjahr stößt das Männchen unter dem arktischen Packeis lange Triller aus, die spiralförmig von mehreren kHz bis auf einige Hundert Hertz fallen, manchmal eine ganze Minute lang. Sie verteidigen ein Revier und locken Weibchen an.","l":"Eine wellige Kurve, die von oben nach unten über die Skala gleitet wie eine Feder, die sich entspannt, dann ein tiefer Ton am Ende.","n":"gekürzt"},"shrimp":{"nm":"Knallkrebse","sh":"Riff","t":"Knallkrebse (Pistolenkrebse)","h":"Wenn der Knallkrebs seine große Schere zuschnappen lässt, schießt er einen so schnellen Wasserstrahl ab, dass eine Kavitationsblase entsteht; beim Zusammenfallen knallt sie wie ein Schuss. Tausende Krebse bilden das Hintergrundgeräusch der Riffe und können Sonare stören.","l":"Ein Regen aus Punkten und kurzen waagerechten Strichen über die ganze Breite, ganz ohne Ordnung; im Kopfhörer ein ständiges Knistern wie Braten in der Pfanne."},"sonar":{"nm":"Aktivsonar","sh":"Ping","t":"Der Ping eines Aktivsonars","h":"Ein Schiff sendet einen starken Schallimpuls (hier um 3,5 kHz, der Bereich der Rumpfsonare von Fregatten) und horcht auf das Echo: Die Laufzeit ergibt die Entfernung, die Frequenzverschiebung (Doppler-Effekt) die Geschwindigkeit des Ziels. Der Schall kommt auch als Nachhall von Boden und Oberfläche zurück.","l":"Ein kurzer, starker Strich, ein Nachhall, der verklingt, dann das Echo, viel schwächer und leicht in der Frequenz verschoben. Der zweite Ping ist ein Frequenzdurchlauf (Chirp), der die Entfernung besser misst."},"propeller":{"nm":"Schiffsschraube","sh":"Kavitation","t":"Die Schraube eines vorbeifahrenden Schiffs","h":"Die Propellerflügel erzeugen Kavitationsblasen, die zerplatzen: ein breites Rauschen, das im Takt der vorbeilaufenden Flügel pulsiert. Die Maschinen fügen feste Linien hinzu. Sonarleute werten diesen Takt aus (DEMON-Analyse), um Flügelzahl und Drehzahl zu bestimmen und das Schiff zu erkennen.","l":"Ein Rauschen über ein breites Band, gestreift mit waagerechten Bändern im Takt der Flügel, dazu einige feste senkrechte Linien (Motor, Getriebe). Alles wird lauter und klingt ab, wenn das Schiff über das Hydrofon fährt."},"uqc":{"nm":"Unterwassertelefon","sh":"UQC 8 kHz","t":"Das Unterwassertelefon (UQC, „Gertrude“)","h":"U-Boote und Schiffe sprechen unter Wasser über ein akustisches Telefon: Die Stimme wird als Einseitenband über einem Träger von 8,0875 kHz übertragen und von einem Schallwandler im Rumpf abgestrahlt. Reichweite: einige Kilometer.","l":"Ein SSB-Sprachband oberhalb von 8 kHz; demoduliert eine ferne Stimme, die durch Echos von Oberfläche und Boden schwankt und hallt. Die Anzeige ist halbiert; die Skala zeigt die echten Frequenzen.","n":"Skala halbiert"},"zevs":{"nm":"ZEVS 82 Hz","sh":"ELF","t":"ZEVS: U-Boot-Funk auf 82 Hz","h":"Funkwellen dringen kaum ins Meerwasser ein, außer bei extrem niedrigen Frequenzen (ELF). Der russische Sender ZEVS auf der Halbinsel Kola sendet auf 82 Hz über Dutzende Kilometer lange Antennenleitungen, um tief getauchte U-Boote zu erreichen. Die Datenrate ist winzig: einige Zeichen pro Minute.","l":"Eine feine Linie bei 82 Hz neben der 50-Hz-Netzlinie und ihren Oberwellen, mit Störungen von Gewittern. Im Kopfhörer ein kaum hörbares tiefes Brummen; empfangbar mit einer großen Rahmenantenne und einer Soundkarte. Das amerikanische Gegenstück auf 76 Hz wurde 2004 abgeschaltet."},"bloop":{"nm":"Der „Bloop“","sh":"1997","t":"Der „Bloop“ (1997)","h":"1997 fingen Hydrofone der NOAA im Pazifik einen sehr tiefen, schnell ansteigenden Ton auf, der Tausende Kilometer weit zu hören war. Lange rätselhaft, wird er seit 2012 einem Eisbeben zugeschrieben: einem riesigen Eisberg, der zerbricht.","l":"Ein breites Band, das in wenigen Sekunden ansteigt, mit seinen Oberwellen, und dann langsam verklingt. Rekonstruktion, 16-fach beschleunigt wie die von der NOAA veröffentlichte Aufnahme.","n":"16-fach beschleunigt"}}},"nl":{"ui":{"title":"VSISA","mystery":"Mysteriegeluid","play":"▶ Luisteren","stop":"■ Stop","noise":"Ruis","volume":"Volume","loop":"Herhalen","specwf":"Spectrum + Waterval","cursor":"cursor","footprint":"Afdruk","dur":"{s} s van boven naar beneden","avg":"gemiddelde over het hele signaal","press":"Druk op Luisteren: het signaal loopt hier voorbij","count":"{n} signalen, in de volgorde van blad 6","myst":"Mysteriemodus","mystTags":"Luister en kijk, kies dan het juiste antwoord","quizH":"Welk signaal is dit?","quizLead":"Start het geluid, bekijk het spectrum, de waterval en de afdruk, en antwoord.","score":"Score","good":"Goed!","bad":"Mis: het was {x}.","next":"Volgend mysteriegeluid","principle":"Principe","screen":"Op het scherm","sheet":"blad","book":"Boek: blad {r}","lang":"Taal","signals":"Signalen","f1":"Signalen gesimuleerd in de pagina (12 000 samples per seconde): die van blad 6 van het boek OpenBookRadio, andere signalen uit het boek en bonussen. Bij radiosignalen (AM, FM, AIS, LoRa…) zie je de gesimuleerde middenfrequentie, zoals op een SDR-scherm; sommige zijn verkleind of versneld, dat staat erbij. Bij AM, SSB, FM, FM-stereo, ISS en fading hoor je het gedemoduleerde geluid, zoals uit de luidspreker van de ontvanger, en toont het scherm het radiosignaal; de stem is synthetisch en zegt geen echte woorden.","f2":"De tijd loopt naar beneden in de waterval en de afdruk. Licentie CC BY-NC-SA 4.0, gratis, niet verkopen.","night":"Nachtmodus","day":"Dagmodus","visits":"bezoeken","plays":"afspelingen","book_dl":"Boek downloaden","book_dl2":"Het boek OpenBookRadio downloaden (gratis, PDF en EPUB, 13 talen)","display":"Weergave","theme_day":"Dag","theme_night":"Nacht (rood)","theme_phos":"Groen fosfor","theme_phosb":"Blauw fosfor","theme_phosa":"Amber fosfor","w3d":"3D-waterval","w3dHint":"sleep om te draaien"},"groups":["Analoge spraak","Telegrafie","Data","Beelden","Luchtvaart, scheepvaart en redding","Oproep, subtonen en paging","Radiosondes, sensoren en verbonden apparaten","HF-modi en curiosa","Omroep en tijd","Breedband","Bonus: geluiden uit de ruimte","Bonus: curiosa op kortegolf","Bonus: onderwatergeluiden"],"modes":{"am":{"sh":"omroep","t":"AM: amplitudemodulatie","h":"De sterkte van de draaggolf volgt het geluid: de curve „zwelt” op en af.","l":"Een vaste streep in het midden (de draaggolf), met aan elke kant een gelijke zijband. Ongeveer 6 tot 9 kHz breed. Omroep op korte en middengolf, luchtvaart (bladen 12 en 14).","r":[["Luisteren","Een jingle, daarna de presentator over achtergrondmuziek. De twee zijbanden zijn elkaars spiegelbeeld: je ziet de melodie en daarna de stem aan weerszijden van de draaggolf."]]},"ssb":{"nm":"SSB","t":"SSB: enkelzijband","h":"Er blijft maar één zijband over, zonder draaggolf: niets als er niet gesproken wordt.","l":"Geen middenstreep, één band van ongeveer 2,7 kHz die alleen leeft als er gesproken wordt. USB boven 10 MHz, LSB eronder (zendamateurs). Slecht afgestemd klinkt de stem als een „eend” (bladen 11 en 29)."},"fm":{"sh":"spraak","t":"FM: frequentiemodulatie","h":"De amplitude blijft gelijk; de trillingen komen met het geluid dichter bij elkaar of verder uiteen.","l":"Het signaal danst rond zijn frequentie, breder bij luid geluid: 12,5 kHz per kanaal bij smalband-FM (portofoons, relais), 200 kHz bij FM-omroep (bladen 2 en 13).","r":[["Luisteren","Aan het eind de korte „ksjj”: de squelch sluit als de zender stopt."]]},"cw":{"t":"CW: morse","h":"De draaggolf gaat aan en uit: strepen en punten.","l":"Een heel dunne streep die in het ritme van morse onderbroken wordt; een piep in het oor. Hier „CQ” (blad 48).","r":[["Snelheid","20 woorden/min, punt van 60 ms, op 700 Hz: „CQ CQ CQ DE F4ABC K”"],["Op het gehoor","Zuivere piepjes, lang en kort, op één toon"],["Decoderen","Op het gehoor, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: twee frequenties","h":"De frequentie springt tussen twee waarden, één voor 0, één voor 1.","l":"Twee evenwijdige strepen: 170 Hz uit elkaar bij zendamateurs (45,45 baud), 450 of 850 Hz bij weerberichten. Een regelmatig „tidilidi” (blad 32).","r":[["Code","Baudot ITA2: 5 bits + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Tekst","RYRYRYRY CQ CQ DE F4ABC"],["Decoderen","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 baud: APRS en packet","h":"Twee audiotonen, 1200 en 2200 Hz, in een FM-zender gestuurd.","l":"Gezien na de FM-ontvanger (luidsprekergeluid): een band van 1200 tot 2200 Hz, in korte pakketjes. In het oor een „grrrt” van een seconde (bladen 35 en 36).","r":[["Frequentie","144,800 MHz in Europa (APRS), FM"],["Frame","Vlaggen 0x7E en daarna AX.25-data in NRZI"],["Decoderen","Direwolf, multimon-ng, KISS-TNC"]]},"psk31":{"t":"PSK31: fasemodulatie","h":"De frequentie blijft gelijk, de fase keert om; bij elke omkering zakt de amplitude.","l":"Een heel dunne streep van ongeveer 60 Hz, een beetje „gevlochten”. Tientallen stations passen in 3 kHz (blad 29).","r":[["Code","Varicode: 0 = fase-omkering, 1 = geen verandering; in rust twee tweelingstrepen"],["Waar te horen","14 070 kHz, 3580 kHz"],["Decoderen","fldigi"]]},"ft8":{"t":"MFSK / FT8: acht tonen","h":"De frequentie gaat op en neer in stapjes van 6,25 Hz, 0,16 s per stap.","l":"Banden van ongeveer 50 Hz die 12,6 s duren en elke 15 s terugkomen, op de klok afgestemd: meerdere stations tegelijk in 3 kHz, bijvoorbeeld op 7,074 MHz (blad 29).","r":[["Frame","79 symbolen van 0,16 s, drie Costas-patronen (begin, midden, eind); hier acht stations"],["Frequenties","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Decoderen","WSJT-X, JTDX (exacte pc-klok)"]]},"ft4":{"t":"FT4: de FT8 voor contests","h":"Vier tonen op 20,8 Hz afstand, 20,8 baud: 105 symbolen in 5 s, in tijdvakken van 7,5 s.","l":"Banden van ongeveer 90 Hz, korter en breder dan FT8, die elke 7,5 s terugkomen. 14 080, 7047,5 kHz (blad 29)."},"olivia":{"t":"Olivia 8/250: acht tonen","h":"Acht tonen op 31,25 Hz afstand, steeds één tegelijk, die willekeurig springen; Walsh-codering en interleaving.","l":"Een blok verspreide puntjes over 250 Hz; decodeert ver onder de ruis. Een klein willekeurig melodietje in het oor (blad 29)."},"hell":{"t":"Feld Hell: schrijven met een draaggolf","h":"De draaggolf gaat punt voor punt aan en uit: elke letter bestaat uit kolommen van 14 punten, van onder naar boven afgetast (245 punten per seconde).","l":"In de waterval een gehakte streep; het programmascherm (fldigi) tekent de letters. Een zacht geknetter in het oor (blad 29)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Vier frequentieniveaus: elk symbool draagt twee bits.","l":"Een rechthoekig blok van 6 tot 12,5 kHz, vol als ruis, vaak in pakketjes (DMR deelt het kanaal in twee tijdsloten). Een schor „frrr” in het oor (blad 46)."},"mt63":{"t":"MT63: noodberichten (NBEMS)","h":"64 tonen tegelijk, elk langzaam gemoduleerd, met veel redundantie.","l":"Een vlak blok van 1 of 2 kHz rond 1500 Hz, met scherpe randen; een regelmatig geruis. Werkt zelfs via een microfoon tegen een luidspreker (blad 31)."},"lora":{"t":"LoRa: frequentiehellingen (chirps)","h":"De frequentie zwiept over de hele breedte en begint dan weer onderaan: de plaats van de sprong draagt de data.","l":"Evenwijdige diagonalen, makkelijk te herkennen: Meshtastic en MeshCore op 869,525 MHz of 433 MHz, LoRaWAN-sensoren (bladen 13, 23 en 24)."},"sstv":{"t":"SSTV: beelden als geluid","h":"Een synchronisatiepuls op 1200 Hz, daarna volgt de frequentie de helderheid van de lijn, van 1500 (zwart) tot 2300 Hz (wit).","l":"Regelmatige synchronisatiestrepen en een wolk die met het beeld verandert; een „tjilpend” geluid gedurende een à twee minuten. 14,230 MHz, ISS op 145,800 MHz (blad 37).","r":[["Frame","VIS-kop, dan lijnen: synchro 1200 Hz, groen, blauw, rood; hier 20 lijnen van een testbeeld"],["Decoderen","QSSTV, MMSSTV, Robot36 op de smartphone"]]},"fax":{"nm":"Weerfax","t":"Weerfax: 1500 Hz zwart, 2300 Hz wit","h":"De frequentie gaat traploos van zwart naar wit, 120 lijnen per minuut.","l":"Twee vaste banden op 1500 en 2300 Hz (800 Hz uit elkaar), een regelmatig „tik-tak”. Gepubliceerde frequenties zijn die van de draaggolf: luister in USB 1,9 kHz lager (blad 38).","r":[["Frame","Starttoon van 300 Hz, faseerlijnen (witte puls), dan de kaart"],["Decoderen","fldigi, JWX, HamFax"]]},"elt":{"nm":"ELT-sirene","t":"ELT- / PLB-sirene op 121,5 MHz","h":"Een AM waarvan de toon twee tot vier keer per seconde van 1600 naar 300 Hz daalt.","l":"Een vaste draaggolf en zijbanden die als een waaier glijden: het „oe-oe” van noodbakens, ook op 121,375 MHz voor oefeningen (bladen 27 en 28)."},"406":{"nm":"406-baken","t":"406 MHz-baken: BPSK-salvo","h":"Een halve seconde uitzending: 160 ms zuivere draaggolf, daarna verspringt de fase ±1,1 radiaal met 400 bit/s.","l":"Een kort streepje dat elke 50 s terugkomt, tussen 406,0 en 406,1 MHz; niets nuttigs te horen, je hebt een decoder nodig (EPIRB 406, blad 28)."},"adsb":{"t":"ADS-B / mode S (1090 MHz): pulsen","h":"Pulsen van 0,5 µs waarvan de positie de bits draagt (PPM); hier is de tijdschaal sterk vertraagd.","l":"Heel korte horizontale streepjes over de hele breedte, honderden per seconde bij een luchthaven; een SDR-stick is nodig (blad 15).","n":"tijdschaal sterk vertraagd"},"acars":{"t":"ACARS: AM en MSK-data","h":"Een AM die twee tonen draagt, 1200 en 2400 Hz, met 2400 bit/s.","l":"Salvo's van een halve seconde met draaggolf en zijbanden, op 131,525, 131,725 of 131,825 MHz in Europa: een „brrrt” in het oor (blad 16)."},"ais":{"t":"AIS: GMSK 9600 baud op twee kanalen","h":"Een afgevlakte FSK (GMSK) in salvo's van 26 ms, eens op 161,975 MHz, eens op 162,025 MHz (verkleind).","l":"Twee kolommen korte streepjes, 50 kHz uit elkaar, een regelmatig geklik; hoe meer schepen, hoe dichter (blad 19).","n":"verkleind"},"navtex":{"t":"NAVTEX en DSC op midden- en kortegolf: FSK 170 Hz","h":"Zoals RTTY: twee frequenties op 170 Hz afstand, maar met 100 baud.","l":"Twee evenwijdige strepen, ononderbroken tijdens het bericht, op 518 en 490 kHz (NAVTEX) of 2187,5 kHz (digitale selectieve oproep) (blad 20).","r":[["Code","SITOR-B, CCIR 476: 7 bits met vier „1”, met FEC-herhaling"],["Decoderen","fldigi, YaND"]]},"hfdl":{"t":"HFDL: vliegtuigen op kortegolf","h":"Een PSK van 1800 baud op een hulpdraaggolf van 1440 Hz.","l":"Salvo's van ongeveer 2,4 kHz tussen 2,9 en 22 MHz; een modemgeruis dat komt en gaat (blad 17)."},"ctcss":{"t":"CTCSS: subtoon onder de stem","h":"Een lage, doorlopende toon (67 tot 254 Hz, hier 88,5 Hz) bij de stem gevoegd.","l":"Gezien in het geluid van de FM-ontvanger: een vaste streep helemaal onderaan, onder de stem; hij opent de squelch van relais en portofoons (blad 10)."},"dtmf":{"sh":"2 tonen","t":"DTMF: twee tonen per toets","h":"Elke toets stuurt tegelijk een lage toon (697 tot 941 Hz) en een hoge (1209 tot 1633 Hz).","l":"Paren puntjes op acht vaste kolommen; het „piep-piep” van telefoonnummers en relaiscommando's (blad 10).","r":[["Reeks","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tonen","t":"Selcall CCIR: tonen na elkaar","h":"Vijf tonen van 100 ms na elkaar, één per cijfer.","l":"Een klein trapje van puntjes, herhaald; een snel „tululululu” om één bepaalde radio op te roepen (blad 33).","r":[["Reeks","1 2 3 4 5, twee keer; ook gedecodeerd door de SelCall-app van de UV-K1"]]},"pocsag":{"sh":"pagers","t":"POCSAG en FLEX: pagers","h":"Een FSK op ±4,5 kHz; een preambule 1010… en dan de data (verkleind).","l":"Twee scherpe strepen tijdens de preambule, daarna een volle band; een schel „brrrrt”. 466,075 MHz, DAPNET 439,9875 MHz (blad 45).","n":"verkleind"},"ale":{"sh":"8 tonen","t":"ALE: automatische oproep op kortegolf","h":"Acht tonen van 750 tot 2500 Hz, 125 baud, in salvo's.","l":"Een blok van ongeveer 2 kHz van kleine puntjes, een à twee seconden, soms op meerdere nabije frequenties; een hoog getjilp (blad 34)."},"rs41":{"nm":"Radiosonde RS41","t":"Radiosonde RS41: doorlopende GFSK","h":"Een afgevlakte FSK van 4800 baud, zonder pauze; de frequentie verloopt langzaam als de sonde stijgt en afkoelt.","l":"Een band van ongeveer 10 kHz die tijdens de hele vlucht schuin verschuift, tussen 400 en 406 MHz (blad 21)."},"ook":{"nm":"433-sensoren","t":"433 MHz-sensoren: OOK","h":"De draaggolf gaat aan en uit in korte of lange pulsen (aan-uit); het bericht wordt drie keer herhaald.","l":"Salvo's van kleine puntjes, vaak in drievoud, op 433,92 MHz: weerstations, temperatuursensoren, afstandsbedieningen (blad 22)."},"fhss":{"t":"Bluetooth: frequentiesprongen (FHSS)","h":"De frequentie wisselt 1600 keer per seconde tussen 79 kanalen (verkleind).","l":"Kleine streepjes overal verspreid over 80 MHz, nooit op dezelfde plek, rond 2,4 GHz (blad 25).","n":"verkleind"},"wspr":{"t":"WSPR: propagatiebakens","h":"Vier tonen op 1,46 Hz afstand, 0,68 s per symbool, gedurende 110,6 s.","l":"Een heel dunne streep van ongeveer 6 Hz die bijna twee minuten duurt, elke even twee minuten: je moet sterk inzoomen (blad 29).","n":"fragment van 24 s (een uitzending duurt 110,6 s)"},"qrss":{"t":"QRSS: heel langzame morse","h":"Een draaggolf die aan en uit gaat, met punten van 3 tot 10 s, vaak op twee nabije frequenties (DFCW).","l":"Strepen van enkele Hz breed, gelezen op een scherm van tien minuten; niet hoorbaar (blad 30).","n":"versneld: punt van 0,6 s in plaats van 3 tot 10 s"},"texte":{"nm":"Tekst in de waterval","t":"Tekst in de waterval","h":"Elke lijn van een afbeelding wordt een groep tonen: het geluid lijkt op ruis.","l":"De tekst of tekening verschijnt rechtstreeks op het SDR-scherm (blad 40).","r":[["Opmerking","Vanaf de onderkant van de afbeelding verzonden: rechtop in de live waterval, ondersteboven in de afdruk (van boven naar beneden gelezen)"]]},"vara":{"t":"Moderne HF-data: VARA, Pactor, ARDOP","h":"Lange volle salvo's (OFDM of PSK) en daartussen korte antwoorden van het andere station.","l":"Een rechthoek van ongeveer 2,4 kHz die stopt en opnieuw begint, met een kleine ontvangstbevestiging ertussen; een gehakt geruis (blad 29)."},"chirp":{"nm":"Ionosfeersonde","t":"Ionosfeersonde (chirp sounder)","h":"Een langzame frequentiehelling door de hele HF-band; de echo's van de ionosfeer komen iets later.","l":"Een diagonaal over het scherm, met evenwijdige strepen (de echo's); een „ffuut” dat in een fractie van een seconde voorbijgaat."},"oth":{"nm":"Over-de-horizonradar","t":"Over-de-horizonradar („woodpecker”)","h":"Pulsen die 10 tot 50 keer per seconde herhaald worden, elk enkele kHz breed.","l":"Een breed gestreept blok dat hele banden bedekt; een heel regelmatig specht-getik op kortegolf."},"parasites":{"nm":"Storing","sh":"voeding","t":"Storing van een schakelende voeding","h":"Een blokgolf: de frequentie en alle harmonischen komen tegelijk naar buiten.","l":"Een kam van regelmatige lijnen die samen verschuiven, op een ruisachtergrond: zoek met NOISE FIND of een draagbare ontvanger (blad K22)."},"mpx":{"nm":"FM-stereo en RDS","t":"FM-stereo en RDS","h":"Het gedemoduleerde geluid (multiplex) bevat het L+R-kanaal, een pilottoon op 19 kHz, het L-R-kanaal rond 38 kHz en RDS op 57 kHz.","l":"Gezien van 0 tot 60 kHz na demodulatie: een laag blok, een dunne streep op 19 kHz, een zwakker blok in het midden en RDS helemaal bovenaan (blad 12).","n":"schaal ÷ 20; stereogeluid","r":[["Luisteren","Met koptelefoon: 4 s mono (het middelste blok, L-R, verdwijnt), daarna 4 s stereo, de melodie links en de akkoorden rechts."]]},"dcf77":{"t":"Tijdsignaal DCF77 (77,5 kHz)","h":"Een draaggolf die aan het begin van elke seconde 0,1 s (bit 0) of 0,2 s (bit 1) tot 15 % daalt.","l":"Een vaste streep met elke seconde een zwart gat; de 59e seconde heeft er geen, om de minuut aan te geven (blad 12).","r":[["Opmerking","Hier ligt de draaggolf op 1000 Hz; de 6e seconde heeft geen gat, net als de 59e seconde van elke minuut"]]},"ofdm":{"t":"OFDM: tientallen subdraaggolven","h":"Veel dicht op elkaar gepakte draaggolven, elk langzaam: de som lijkt op ruis.","l":"Een vlakke rechthoek met scherpe randen, altijd aanwezig: DRM op kortegolf (10 kHz), DAB+ (1,5 MHz), DVB-T, wifi. Een doorlopend geruis in het oor (bladen 12 en 25)."},"dsss":{"t":"Gespreid spectrum (DSSS): gps, wifi 802.11b","h":"De data worden gemengd met een heel snelle code: de energie wordt over een grote breedte verspreid.","l":"Een brede bult, nauwelijks boven de ruis; gps ligt zelfs onder de ruis en is zonder bewerking niet te zien (bladen 25 en 26)."},"hline":{"nm":"Waterstoflijn","sh":"1420 MHz","t":"21 cm-waterstoflijn (1420,405 MHz)","h":"Koud waterstof in de Melkweg zendt een heel zwak geruis uit op 1420,405 MHz. De beweging van de spiraalarmen verschuift het door het dopplereffect: je ziet een paar kleine bulten.","l":"Bijna niets in de waterval van seconde tot seconde: je moet lang middelen om de bulten uit de ruis te zien komen. Kijk hier naar het gemiddelde spectrum in stilstand. Een schotel of hoorn, een voorversterker en een SDR-stick volstaan.","n":"signaal sterk overdreven"},"sun":{"nm":"Zon","sh":"uitbarstingen","t":"Zon: radio-uitbarstingen van type III","h":"Elektronen die door een zonnevlam worden weggeslingerd, gaan door de corona en laten die steeds lager in frequentie zenden naarmate ze verder komen.","l":"Strepen die in minder dan een seconde schuin van boven naar beneden door het spectrum vallen, op een achtergrond van zonneruis; een aanzwellend „sjhhh”. Ongeveer 10 tot 400 MHz, ook op kortegolf rond 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter: decameter-uitbarstingen (L en S)","h":"Het magneetveld van Jupiter en zijn maan Io zorgen voor sterke emissies tussen 15 en 40 MHz: trage L-uitbarstingen en heel korte S-uitbarstingen die snel naar beneden glijden.","l":"Eerst golven van geruis (L, zoals de branding), daarna reeksen kleine „pops” (S) in dichte diagonalen. Rond 20,1 MHz 's nachts, met een eenvoudige dipool, als Io goed staat."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Een draaiende neutronenster veegt met een radiobundel over de aarde, hier elke 0,714 s. Interstellair gas vertraagt de lage frequenties: elke puls komt eerst bovenaan het spectrum aan.","l":"Een regelmatig „tik”; in de waterval is elke puls een dalende curve (dispersie). Het echte signaal zit onder de ruis: je hebt een grote antenne nodig en moet de pulsen over hun periode optellen.","n":"signaal sterk overdreven"},"meteor":{"nm":"Meteoren","sh":"GRAVES","t":"Meteorecho's van de GRAVES-radar (143,050 MHz)","h":"De Franse GRAVES-radar zendt onophoudelijk op 143,050 MHz. Als een vallende ster de lucht ioniseert, kaatst het spoor wat van dat signaal naar je ontvanger, een fractie van een seconde tot enkele seconden.","l":"In USB op 143,049 MHz: korte „pings” rond 1000 Hz, soms een echo die glijdt (de kop van de meteoor, dopplereffect) of die blijft hangen. Veel meer tijdens zwermen (Perseïden, Geminiden) (blad 1)."},"whistler":{"nm":"Fluittonen","sh":"VLF","t":"VLF-fluittonen (whistlers)","h":"Bliksem geeft een radioklik; een deel volgt de veldlijnen van het aardmagnetisch veld naar het andere halfrond en terug, de hoge tonen eerst.","l":"Een „tjiuuu” dat in een à twee seconden van hoog naar laag zakt, vlak na een klik; overal gekraak (sferics). Onder 10 kHz, met een VLF-ontvanger ver van hoogspanningslijnen."},"chorus":{"nm":"Ochtendkoor","sh":"VLF","t":"Ochtendkoor (dawn chorus)","h":"Tijdens een magnetische storm zenden in de magnetosfeer gevangen elektronen kleine stijgende tonen uit, vooral rond zonsopgang.","l":"Stijgende, overlappende kwetteringen, zoals vogels, van ongeveer 1 tot 4 kHz. Dezelfde apparatuur als voor fluittonen."},"sputnik":{"nm":"Spoetnik 1","sh":"1957","t":"Spoetnik 1 (1957)","h":"De eerste kunstmaan zond drie weken lang piepjes van ongeveer 0,3 s uit, afwisselend op 20,005 en 40,002 MHz.","l":"Een regelmatig onderbroken streep: „piep… piep…”, het geluid waar de hele wereld in oktober 1957 naar luisterde (reconstructie)."},"doppler":{"nm":"Dopplereffect","sh":"satelliet","t":"Satellietbaken en dopplereffect","h":"Een satelliet in een lage baan komt dichterbij en gaat weer weg: de ontvangen frequentie daalt tijdens de overgang, ongeveer ±3 kHz op 145 MHz en ±10 kHz op 435 MHz.","l":"Een streep die in een S-vorm daalt: eerst langzaam, snel als de satelliet het dichtst bij is, dan weer langzaam (blad 41).","n":"overgang van 10 min ingekort tot 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA-satellieten: APT-beelden (historisch)","h":"Een hulpdraaggolf van 2400 Hz, in amplitude gemoduleerd door het beeld, twee lijnen per seconde, met een synchronisatiepuls aan het begin van elke lijn. Gestopt in 2025; de Meteor-M-satellieten zenden nu LRPT.","l":"Een streep op 2400 Hz met zijbanden die met het beeld veranderen, en het bekende „tik-tak” twee keer per seconde (blad 41)."},"eme":{"nm":"Maanecho","sh":"EME","t":"Maanecho (EME)","h":"Een signaal naar de maan komt ongeveer 2,5 s later terug, enorm verzwakt, iets verbreed en verschoven door doppler.","l":"Je hoort je eigen „piep” en 2,5 s later de zwakke, wat vage echo. Zendamateurs doen dit in CW of JT65, vanaf 144 MHz (blad 1).","n":"echo sterk overdreven"},"msk144":{"nm":"MSK144","sh":"meteoren","t":"MSK144: de digitale modus voor meteoorscatter","h":"Twee tonen, 1000 en 2000 Hz, met 2000 baud, in frames van 72 ms die zonder pauze herhaald worden: elk meteoorspoor laat er een paar door.","l":"Salvo's van 0,1 tot 1 s, ongeveer 2,4 kHz breed, die met de „ping” van de meteoor opduiken en uitdoven. Op 50 en 144 MHz, met WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tonen","t":"JT65: 65 tonen, heel traag","h":"Eén synchronisatietoon en 64 datatonen op 2,7 Hz afstand (JT65A), 0,37 s per symbool, 47 s uitzending per minuut.","l":"Een ladder van streepjes over ongeveer 180 Hz, met een synchronisatiestreep die steeds op dezelfde plek terugkomt. Gebruikt voor maanreflectie (JT65B en C) en heel zwakke signalen.","n":"fragment van 20 s (een uitzending duurt 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: professioneel digitaal netwerk","h":"Fasemodulatie π/4-DQPSK met 18 000 symbolen per seconde, vier tijdsloten, in kanalen van 25 kHz.","l":"Een vol blok met afgeronde flanken, altijd aanwezig bij een basisstation; een schor geruis. Versleuteld: niet te beluisteren (blad 46).","n":"verkleind"},"ndb":{"nm":"NDB-baken","sh":"190–535 kHz","t":"NDB: niet-gericht radiobaken","h":"Een vaste draaggolf op langegolf, met een morseroepnaam van twee of drie letters op een toon (vaak 1020 Hz).","l":"Een vaste streep in het midden en tijdens de roepnaam twee streepjes aan weerszijden. Ongeveer 190 tot 535 kHz, in SSB of CW (blad 12)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: omnidirectioneel radiobaken","h":"In AM: een richtingsafhankelijk signaal van 30 Hz, een hulpdraaggolf van 9960 Hz die met 30 Hz in frequentie gemoduleerd is (de referentie), en de morseroepnaam op 1020 Hz.","l":"In het gedemoduleerde geluid: een laag gebrom op 30 Hz, een brede golvende streep rond 10 kHz en af en toe de roepnaam (blad 18).","n":"gedemoduleerd geluid, schaal ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: landingsgeleiding (localizer)","h":"In AM twee tonen van 90 en 150 Hz; hun verhouding vertelt het vliegtuig of het links of rechts van de as zit. De morseroepnaam begint met I.","l":"In het gedemoduleerde geluid: twee heel lage strepen op 90 en 150 Hz en de roepnaam op 1020 Hz. Tussen 108,1 en 112 MHz; het glijpad zit rond 330 MHz (blad 18)."},"m10":{"nm":"Sondes M10 / M20","sh":"Meteomodem","t":"Radiosondes M10 en M20 (Meteomodem)","h":"Eén frame per seconde in snelle FSK (ongeveer 9600 baud): breder dan de RS41. In Frankrijk opgelaten door Météo-France.","l":"Elke seconde een breed salvo dat tijdens de vlucht langzaam verschuift; tussen 400 en 406 MHz (blad 21)."},"tpms":{"nm":"Banden (TPMS)","sh":"433 MHz","t":"Bandenspanningssensoren (TPMS)","h":"Elk wiel zendt af en toe een FSK-salvo van enkele milliseconden: druk, temperatuur, identificatie.","l":"Kleine losse salvo's op 433,92 MHz (of 315 MHz), vaak per twee, als er een auto voorbijrijdt. Gedecodeerd door rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Tijdsignaal ALS162 (Allouis, 162 kHz)","h":"De draaggolf van de vroegere langegolfzender van France Inter; de tijd is gecodeerd met kleine, onhoorbare fasemodulaties.","l":"Een vaste streep, heel sterk in Frankrijk, aan het begin van elke seconde nauwelijks verbreed; je hebt een decoder nodig om de tijd te lezen (blad 12)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Tijdsignaal WWV (Colorado)","h":"In AM: elke seconde een „tik” van 5 ms op 1000 Hz, een toon van 500 of 600 Hz, een tijdcode op 100 Hz en een stem die UTC aankondigt.","l":"In het gedemoduleerde geluid: een streep op 500 Hz die elke seconde onderbroken wordt, de tik op 1000 Hz en de code helemaal onderaan op 100 Hz (blad 12)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Tijdsignaal MSF (Anthorn, 60 kHz)","h":"De draaggolf wordt aan het begin van elke seconde 0,1, 0,2 of 0,3 s uitgezet, afhankelijk van de bits, en 0,5 s om de minuut aan te geven.","l":"Een vaste streep met elke seconde volledig zwarte gaten, langer dan bij DCF77 (blad 12)."},"type2":{"nm":"Zon type II","sh":"schokgolf","t":"Zon: radio-uitbarstingen van type II","h":"De schokgolf van een coronale massa-ejectie laat het plasma langzaam steeds lager zenden, vaak in twee banden (de grondtoon en het dubbele).","l":"Twee evenwijdige ruisbanden die enkele minuten lang rustig dalen. Vergelijk met type III, dat veel sneller is.","n":"enkele minuten ingekort tot 6 s"},"tweeks":{"nm":"Tweeks","sh":"VLF","t":"Tweeks: de nachtelijke VLF-„pings”","h":"'s Nachts kaatst de klik van een verre bliksem tussen aarde en ionosfeer heen en weer; frequenties bij de afsnijgrens (rond 1,7 kHz) komen het laatst aan.","l":"Een kleine „ping” die daalt en rond 1,7 kHz stopt, soms met een echo op het dubbele; overal gekraak. Onder 10 kHz, 's nachts."},"hiss":{"nm":"VLF-ruis","sh":"hiss","t":"VLF-ruis (hiss)","h":"Brede ruis van elektronen in de plasmasfeer, die stijgt en daalt met de magnetische activiteit.","l":"Een band van ruis van enkele honderden Hz tot enkele kHz, zonder patroon, die langzaam aanzwelt en wegzakt."},"aurora":{"nm":"Radio-aurora","sh":"Au","t":"Aurorapropagatie (Au)","h":"Het noorderlicht weerkaatst VHF-golven maar schudt ze heel snel door elkaar: elk signaal wordt over enkele honderden Hz uitgesmeerd.","l":"CW wordt een schurend, als gefluisterd geruis; je hoort geen toon meer. Op 50 en 144 MHz, naar het noorden gericht tijdens magnetische stormen."},"galactic":{"nm":"Galactische ruis","sh":"20–40 MHz","t":"Ruis van de Melkweg","h":"Het centrum van de Melkweg zendt een radiogeruis uit dat Karl Jansky in 1932 rond 20 MHz ontdekte. Het stijgt en daalt met de draaiing van de aarde.","l":"Een achtergrondruis die langzaam stijgt en weer daalt, elke dag ongeveer 4 minuten vroeger. Zichtbaar met een eenvoudige dipool tussen 20 en 40 MHz.","n":"een dag ingekort tot 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"CubeSat-telemetrie","h":"Kleine satellieten zenden regelmatig hun metingen (batterij, temperaturen) in FSK of GMSK met 1200 of 9600 baud, rond 435–438 MHz.","l":"Regelmatige salvo's die tijdens de overgang door het dopplereffect telkens wat lager liggen (blad 41).","n":"verkleind, overgang versneld"},"issfm":{"nm":"ISS in FM","sh":"145,800 MHz","t":"Ruimtestation (ISS): spraak in FM","h":"Astronauten praten met scholen en zendamateurs in FM op 145,800 MHz. Het station vliegt 28 000 km/u: tijdens de overgang schuift de ontvangen frequentie van ongeveer +3,5 kHz naar −3,5 kHz.","l":"Een band FM-spraak die tijdens de overgang van 10 minuten langzaam van rechts naar links schuift (blad 41).","n":"overgang van 10 min ingekort tot 10 s"},"buzzer":{"nm":"UVB-76 „The Buzzer”","sh":"4625 kHz","t":"UVB-76, „The Buzzer” (4625 kHz)","h":"Een Russische militaire zender die al tientallen jaren een gezoem van ongeveer een seconde uitzendt, zo'n 25 keer per minuut, soms onderbroken door een gesproken bericht.","l":"Een vaste draaggolf en bij elk gezoem een kolom dichte lijnen van boven naar beneden. Makkelijk te vinden op 4625 kHz in USB."},"pip":{"nm":"„The Pip”","sh":"3756 / 5448 kHz","t":"„The Pip”: eindeloze piepjes","h":"Nog een Russisch militair kortegolfbaken, dat dag en nacht korte piepjes herhaalt, soms onderbroken door berichten.","l":"Een vaste streep die ongeveer 50 keer per minuut door een korte piep onderbroken wordt; in het oor een regelmatig „pip… pip…” dat nooit stopt.","n":"ritme benaderd"},"squeaky":{"nm":"„Squeaky Wheel”","sh":"KG","t":"„Squeaky Wheel”: het piepende wiel","h":"Een Russisch militair kortegolfbaken, door luisteraars genoemd naar zijn herhaalde klankpatroon.","l":"Een klein patroon van twee klanken, waarvan één stijgt, in een lus herhaald: als een piepend wiel.","n":"benaderde nabootsing"},"codar":{"nm":"CODAR","sh":"zeeradar","t":"CODAR: radars voor zeestromingen","h":"Kustradars zwiepen een- of tweemaal per seconde over een frequentieband om stromingen en golven te meten.","l":"Regelmatige evenwijdige diagonalen en een herhaald „swish”; rond 4,5–5,5 MHz, 13 MHz en 25 MHz, vaak dag en nacht.","n":"verkleind"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Militaire modem STANAG 4285","h":"8-PSK-fasemodulatie met 2400 baud op een draaggolf van 1800 Hz, met elke 107 ms een testreeks om het kanaal te volgen.","l":"Een vol blok van ongeveer 3 kHz; in het oor een geruis met een regelmatig gezoem (blad 43)."},"link11":{"nm":"Link-11","sh":"16 tonen","t":"Link-11: datalink van de marine","h":"Zestien tonen van 605 tot 2915 Hz tegelijk, elk 75 keer per seconde in fase gemoduleerd.","l":"Een kam van veertien regelmatige lijnen van 935 tot 2365 Hz, plus twee lijnen apart op 605 en 2915 Hz; in het oor een muzikaal gebrom (blad 43)."},"numbers":{"nm":"Nummerstation","sh":"stem","t":"Nummerstation","h":"Op een vast tijdstip een korte herkenningsmelodie, dan leest een (vaak synthetische) stem groepen van vijf cijfers voor, in AM of SSB.","l":"De melodie als losse noten, dan regelmatige groepen lettergrepen met stiltes ertussen (blad 43).","n":"nagebootste stem, geen echte cijfers"},"rttydwd":{"nm":"DWD-weer-RTTY","sh":"50 Bd / 450 Hz","t":"Weer-RTTY van de DWD (Duitsland)","h":"Zoals de RTTY van zendamateurs, maar met 50 baud en 450 Hz afstand: de Duitse weerdienst verstuurt zijn berichten en zeeweersverwachtingen in gewone tekst.","l":"Twee strepen die veel verder uit elkaar liggen en een iets sneller ritme. Tussen de berichten de oproep „CQ CQ CQ DE DDK2 DDH7 DDK9” en dan RYRYRY. Op 4583, 7646 en 10 100,8 kHz, ook 147,3 kHz (blad 32)."},"mfsk16":{"nm":"MFSK16","sh":"16 tonen","t":"MFSK16: zestien tonen","h":"Zestien tonen op 15,625 Hz afstand, steeds één tegelijk, 15,625 keer per seconde; elke toon draagt vier bits, beschermd door foutcorrectie.","l":"Een band van 316 Hz uit kleine trapjes die voortdurend verspringen, na een vaste toon aan het begin. In het oor een snel deuntje, als een fluit. Wordt ook gebruikt om kleine afbeeldingen te versturen."},"sitora":{"nm":"SITOR-A (ARQ)","sh":"telex","t":"SITOR-A: maritieme telex in ARQ","h":"Het station stuurt elke 450 ms blokken van drie tekens (210 ms, 100 baud, 170 Hz afstand); tussen de blokken antwoordt het andere station met een kort signaal voor „ontvangen” of „herhaal”.","l":"Korte regelmatige salvo's met een klein, zwakker antwoord ertussen: een krekelachtig „tjirp-tjirp”. Tegenwoordig zeldzaam op kortegolf."},"dscvhf":{"nm":"VHF-DSC (kanaal 70)","sh":"DSC","t":"DSC: digitale selectieve oproep op kanaal 70","h":"Een salvo van ongeveer een halve seconde met 1200 baud, op twee tonen van 1300 en 2100 Hz: het bevat het MMSI-nummer van het schip, het soort oproep en bij nood de positie.","l":"Een kort, hoog „brrrt” op 156,525 MHz dat begint met een reeks afwisselende bits. Op midden- en kortegolf is DSC een FSK van 100 baud, zoals NAVTEX (blad 20)."},"selcal":{"nm":"SELCAL luchtvaart","sh":"4 tonen","t":"SELCAL: selectieve oproep van vliegtuigen op kortegolf","h":"De verkeersleiding roept één bepaald vliegtuig op met twee pulsen van ongeveer een seconde, elk uit twee van zestien tonen (312,6 tot 1479,1 Hz). In het vliegtuig gaan een lampje en een gong af: de bemanning hoeft niet voortdurend te luisteren.","l":"Twee akkoorden na elkaar, „bing-bong”, tussen de gesproken berichten op de luchtvaartfrequenties in SSB, bijvoorbeeld 5616 of 8864 kHz."},"dcs":{"nm":"DCS","sh":"134,4 bit/s","t":"DCS: de digitale subtoon","h":"In plaats van een doorlopende toon zoals bij CTCSS stuurt de radio onder de stem een woord van 23 bits dat zonder pauze herhaald wordt, met 134,4 bits per seconde. Aan het eind sluit een toon van 134,4 Hz de squelch geruisloos.","l":"Gezien in het geluid van de FM-ontvanger: een onregelmatige band helemaal onderaan, onder 300 Hz, en een dof gebrom als het filter van de radio het doorlaat (blad 10)."},"t1750":{"nm":"1750 Hz-toon","sh":"relais","t":"1750 Hz-toon: een relais openen","h":"Een korte toon van 1750 Hz (ongeveer 0,5 tot 1 s) aan het begin van de uitzending opent nog sommige Europese amateurrelais; het relais antwoordt vaak met een piep als je loslaat.","l":"Een korte streep op 1750 Hz, dan de stem, dan de piep van het relais (blad 10)."},"ncdxf":{"nm":"NCDXF-bakens","sh":"14,100 MHz","t":"NCDXF-/IARU-bakens: de propagatie testen","h":"Achttien bakens over de hele wereld zenden om beurten, elk tien seconden, op 14,100, 18,110, 21,150, 24,930 en 28,200 MHz: de roepnaam in morse, dan vier strepen van een seconde met 100 W, 10 W, 1 W en 0,1 W.","l":"Een roepnaam en dan vier steeds zwakkere strepen: hoor je de laatste nog, dan is de propagatie naar dat baken uitstekend. Hier 4U1UN (New York) en dan VE8AT (Canada) (blad 30)."},"lrpt":{"nm":"Meteor-M LRPT","sh":"137,9 MHz","t":"Meteor-M-satellieten: LRPT-beelden","h":"De Russische weersatellieten Meteor-M sturen hun beelden digitaal: fasemodulatie met vier toestanden (QPSK), 72 000 symbolen per seconde, ongeveer 120 kHz breed.","l":"Een vol blok met afgeronde randen dat tijdens de overgang langzaam verschuift (dopplereffect); in het oor alleen geruis. Op 137,9 of 137,1 MHz, gedecodeerd met SatDump (blad 41).","n":"verkleind"},"quindar":{"nm":"Quindar-tonen","sh":"NASA","t":"Quindar-tonen: de piepjes van Apollo","h":"Als Houston de microfoontoets indrukt, schakelt een piep van 2525 Hz (250 ms) de zenders van de grondstations in; bij het loslaten schakelt een piep van 2475 Hz ze uit.","l":"Een hoge piep voor elke zin en een iets lagere erna: het beroemde geluid van de opnamen van de Apollo-missies."},"wow":{"nm":"„Wow!”-signaal","sh":"1977","t":"Het „Wow!”-signaal (15 augustus 1977)","h":"De radiotelescoop Big Ear (Ohio) ving 72 seconden lang een smal en zeer sterk signaal op vlak bij de waterstoflijn, rond 1420,456 MHz. Astronoom Jerry Ehman schreef „Wow!” op de uitdraai. Het is nooit meer gezien en de oorsprong blijft omstreden.","l":"Een dunne streep die uit de ruis komt, aanzwelt en weer verdwijnt: de vorm van een vaste bron die door de antennebundel trekt. Dit is een reconstructie: er bestaat geen geluidsopname.","n":"72 s ingekort tot 12 s"},"frb":{"nm":"Snelle radioflits","sh":"FRB","t":"Snelle radioflits (FRB)","h":"Een radioflits van enkele milliseconden uit een ander sterrenstelsel; de eerste werd in 2007 ontdekt. Het gas onderweg vertraagt de lage frequenties sterk: de flits komt uitgesmeerd aan, de hoge tonen eerst.","l":"Eén enkele curve die van boven naar beneden door het spectrum valt, en dan niets meer. Sommige herhalen zich; de meeste zie je maar één keer.","n":"sterk vertraagd en overdreven"},"letterb":{"nm":"Eenletterbakens","sh":"D, P, S, C…","t":"Eenletterbakens","h":"Zenders van de Russische marine herhalen eindeloos één morseletter, elk op 100 Hz van zijn buur: D, P, S, C, A, F, K of M naargelang de plaats.","l":"Evenwijdige stippellijnen, heel dicht bij elkaar, elk met een eigen ritme. Rond 4558, 5154, 7039, 10 872, 13 528 en 16 332 kHz, in CW."},"sid":{"nm":"Zonnevlam op VLF","sh":"SID","t":"Zonnevlam gezien op VLF (SID)","h":"De VLF-zenders van de marines (20,9 kHz in Frankrijk, 23,4 kHz in Duitsland…) planten zich voort tussen de grond en de ionosfeer. Als er een zonnevlam aankomt, verandert de röntgenstraling de onderkant van de ionosfeer in enkele minuten en springt het ontvangen niveau.","l":"Een smalle, regelmatige band (het MSK-signaal van de zender) die plots sterker wordt en dan langzaam weer normaal wordt. Een draadlus en een geluidskaart volstaan: een klassieker bij sterrenkundeclubs.","n":"een uur ingekort tot 12 s"},"qrn":{"nm":"Onweersstoring","sh":"QRN","t":"Onweersstoring (QRN)","h":"Elke bliksem is een heel sterke zender die alle frequenties tegelijk bestrijkt. Op midden- en kortegolf hoor je onweer op duizenden kilometers, vooral in de zomer en op de lage banden.","l":"Onregelmatige horizontale strepen over de hele breedte; droog gekraak in het oor. De noise blanker (NB) helpt een beetje, een raamantenne helpt meer."},"fading":{"nm":"Selectieve fading","sh":"QSB","t":"Selectieve fading (QSB)","h":"Op kortegolf komt het signaal langs meerdere wegen door de ionosfeer. Afhankelijk van de frequentie versterken ze elkaar of doven ze elkaar uit: een smalle dip wandelt door het signaal.","l":"Een donkere zone die langzaam door de AM-zender schuift. Als ze over de draaggolf in het midden gaat, klinkt het geluid enkele seconden schor en vervormd; synchrone detectie of luisteren in SSB lost dat op."},"plc":{"nm":"Powerline (PLC)","sh":"2–30 MHz","t":"PLC: internet via het stopcontact","h":"Powerline-adapters sturen de data over de huisbedrading met honderden draaggolven tussen 2 en 30 MHz (hoger bij recente modellen), één om de 24,4 kHz. De draden stralen als een antenne.","l":"Een kam van regelmatige lijnen die in pakketjes flikkert, met gaten op de amateurbanden (door de norm voorgeschreven inkepingen); in het oor een geknetter dat het internetverkeer volgt (blad 43).","n":"verkleind"},"fence":{"nm":"Schrikdraad","sh":"tik… tik…","t":"Schrikdraad","h":"Het schrikdraadapparaat stuurt ongeveer één keer per seconde een puls van enkele duizenden volt in de draad. Raakt gras de draad of is een isolator beschadigd, dan springt er een vonk over die op alle frequenties straalt.","l":"Een heel dunne horizontale streep over de hele breedte, met een perfect regelmatige tussentijd; een „tik… tik…” van langegolf tot VHF. Het vaste ritme onderscheidt het van onweer."},"gsm":{"nm":"Gsm-telefoon","sh":"217 Hz","t":"Gsm-telefoon naast een luidspreker","h":"Een 2G-telefoon zendt in salvo's van 0,577 ms, 217 keer per seconde. Een slecht afgeschermde audioversterker detecteert die salvo's en maakt ze hoorbaar.","l":"Een kam van lijnen om de 217 Hz; het bekende „ta-ta-tatata” vlak voor de telefoon overgaat, daarna een aanhoudend gezoem tijdens het gesprek. Steeds zeldzamer: de 2G-netwerken worden uitgezet."},"jjy":{"nm":"JJY","sh":"40 / 60 kHz","t":"Tijdsignaal JJY (Japan, 40 en 60 kHz)","h":"Elke seconde staat de draaggolf 0,8 s (bit 0), 0,5 s (bit 1) of 0,2 s (markering) op vol vermogen en zakt dan naar 10 %. Het omgekeerde van DCF77, dat aan het begin van de seconde zakt.","l":"Een vaste streep die aan het eind van elke seconde vroeger of later zwakker wordt. Zenders in Fukushima (40 kHz) en Saga-Fukuoka (60 kHz), voor de radiogestuurde klokken in Japan."},"rwm":{"nm":"RWM","sh":"4996 kHz","t":"Tijdsignaal RWM (Moskou)","h":"In telegrafie op 4996, 9996 en 14 996 kHz: elke seconde een puls van 100 ms en, op andere minuten, tien pulsen per seconde. De roepnaam RWM wordt twee keer per uur in morse gezonden.","l":"De roepnaam, dan een streep in regelmatige „tikken”, dan in snelle puntjes. Luister in CW of SSB.","n":"ingekort fragment"},"bpm":{"nm":
