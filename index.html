    for(let i=0;i<=nx;i++){ let v=0; const x0=i*STEP; for(let j=0;j<STEP&&x0+j<W;j++) v=Math.max(v,row[x0+j]); vals[i]=v; pts[i]=proj(i/nx,d,v); }
    const b0=proj(0,d,0), b1=proj(1,d,0);
    w3c.beginPath(); w3c.moveTo(b0[0],b0[1]); for(const q of pts) w3c.lineTo(q[0],q[1]); w3c.lineTo(b1[0],b1[1]); w3c.closePath(); w3c.fillStyle=bg; w3c.globalAlpha=0.92; w3c.fill(); w3c.globalAlpha=1;
    const hot=k===hr; w3c.lineWidth=hot?2.2:1.1;
    const paths=[]; for(let i=0;i<nx;i++){ const v=Math.max(vals[i],vals[i+1]), b=Math.min(BK-1,Math.floor(v*BK)); (paths[b]||(paths[b]=[])).push(i); }
    paths.forEach((list,b)=>{ if(!list) return; if(hot) w3c.strokeStyle=P().head; else { const c=Math.round((0.18+0.82*(b+0.5)/BK)*255)*3; w3c.strokeStyle="rgb("+LUT[c]+","+LUT[c+1]+","+LUT[c+2]+")"; }
      w3c.beginPath(); for(const i of list){ w3c.moveTo(pts[i][0],pts[i][1]); w3c.lineTo(pts[i+1][0],pts[i+1][1]); } w3c.stroke(); });
  }
  w3c.lineWidth=1;
}
(function(){ let drag=null;
  w3.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY,yaw:w3yaw,tilt:w3tilt}; try{w3.setPointerCapture(e.pointerId);}catch(_){} });
  w3.addEventListener("pointermove",e=>{ if(!drag) return; const r=w3.getBoundingClientRect();
    w3yaw=Math.max(-0.45,Math.min(0.45,drag.yaw+(e.clientX-drag.x)/r.width*0.9)); w3tilt=Math.max(0,Math.min(1,drag.tilt-(e.clientY-drag.y)/r.height*1.2)); if(!playing) w3draw(-1); });
  const end=()=>{ drag=null; }; w3.addEventListener("pointerup",end); w3.addEventListener("pointercancel",end);
})();

/* ================= règle des fréquences ================= */
function ticks(m){ if(!m) return []; const [a,b]=m.span, s=m.scale, w=(b-a)*s, raw=w/6, p=Math.pow(10,Math.floor(Math.log10(raw)));
  let step=p; for(const k of [1,2,2.5,5,10]) if(k*p>=raw){ step=k*p; break; }
  const out=[]; for(let v=Math.ceil(a*s/step)*step; v<=b*s+1e-9; v+=step) out.push({v,p:(v/s-a)/(b-a)}); return out; }
function fmtF(v,m){ const w=(m.span[1]-m.span[0])*m.scale; if(w>=4000) return (v/1000).toLocaleString(LOC,{maximumFractionDigits:2})+" k"; return v.toLocaleString(LOC,{maximumFractionDigits:1}); }
function ruler(id){ const el=document.getElementById(id); el.textContent="";
  for(const t of ticks(current)){ const s=document.createElement("span"); s.style.left=(t.p*100)+"%"; s.textContent=fmtF(t.v,current); if(t.p<0.04) s.className="first"; else if(t.p>0.96) s.className="last"; el.appendChild(s); } }

/* ================= sélection, fiche, quiz ================= */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function spanText(m,hide){ const u=(m.span[1]-m.span[0])*m.scale>=4000?"kHz":"Hz", d=u==="kHz"?1000:1;
  const f=v=>(v*m.scale/d).toLocaleString(LOC,{maximumFractionDigits:2}); const n=hide?"":tx(m).note; return f(m.span[0])+" – "+f(m.span[1])+" "+u+(n?" · "+n:""); }
function select(m,hidden){
  stop(); current=m; signal=buildSignal(m);
  document.querySelectorAll(".mode").forEach(b=>b.setAttribute("aria-pressed",String(!hidden&&b.dataset.id===m.id)));
  setNow(m,hidden);
  document.getElementById("spanLbl").textContent=spanText(m,hidden);
  ruler("ruler1"); ruler("ruler2"); analyse(); blankWaterfall(t("press"));
  hidden?renderQuiz():renderInfo(m);
  try{ if(!hidden) localStorage.setItem("idmr-mode",m.id); }catch(e){}
}
function setNow(m,hidden){ const x=tx(m);
  document.getElementById("nowName").textContent=hidden?t("myst"):x.title;
  document.getElementById("nowTags").textContent=hidden?t("mystTags"):x.group+(m.ref?" · "+t("sheet")+" "+m.ref:""); }
let lastPrefix="";
function renderInfo(m,prefix){ lastPrefix=prefix||""; const x=tx(m);
  const rows=[[t("principle"),x.how],[t("screen"),x.look]].concat(x.rows).filter(r=>r[1]);
  document.getElementById("info").innerHTML=lastPrefix+`<h3>${esc(x.title)}</h3><dl>${rows.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>`+
    (m.ref?`<a class="ref" href="https://github.com/ic3fr/OpenBookRadio/releases" target="_blank" rel="noopener">${esc(t("book").replace("{r}",m.ref))}</a>`:"");
  const ag=document.getElementById("again"); if(ag) ag.addEventListener("click",mystery);
}
function renderQuiz(){ const el=document.getElementById("info");
  el.innerHTML=`<div class="quiz"><h3>${esc(t("quizH"))}</h3><p class="lead">${esc(t("quizLead"))}</p>
    <div class="choices">${quiz.choices.map(c=>`<button class="btn" type="button" data-a="${c.id}">${esc(tx(c).name)}</button>`).join("")}</div><p class="score">${esc(t("score"))} : ${score.ok} / ${score.n}</p></div>`;
  el.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>answer(b.dataset.a))); }
function answer(id){ const good=id===quiz.mode.id; score.n++; if(good) score.ok++; const m=quiz.mode; quiz=null; document.getElementById("spanLbl").textContent=spanText(m);
  setNow(m,false);
  document.querySelectorAll(".mode").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.id===m.id)));
  renderInfo(m,`<div class="quiz" style="margin-bottom:14px"><p class="msg ${good?"ok":"bad"}">${good?esc(t("good")):esc(t("bad").replace("{x}",tx(m).name))}</p><p class="score">${esc(t("score"))} : ${score.ok} / ${score.n}</p><div><button class="btn primary" type="button" id="again">${esc(t("next"))}</button></div></div>`); }
function mystery(){ const m=MODES[ri(MODES.length)]; const others=MODES.filter(x=>x!==m).sort(()=>rnd()-.5).slice(0,3);
  quiz={mode:m,choices:[m,...others].sort(()=>rnd()-.5)}; select(m,true); play(); }

/* ================= audio ================= */
function play(){
  if(!signal) return; stop();
  try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  if(ctx.state==="suspended") ctx.resume();
  const chans=AUD?(AUD.R?[AUD.L,AUD.R]:[AUD.L]):[signal], n=chans[0].length; let buf;
  try{ buf=ctx.createBuffer(chans.length,n,SR); chans.forEach((c,ci)=>buf.getChannelData(ci).set(c)); }
  catch(e){ const k=Math.max(2,Math.round(ctx.sampleRate/SR)); buf=ctx.createBuffer(chans.length,n*k,SR*k);
    chans.forEach((c,ci)=>{ const o=buf.getChannelData(ci); for(let i=0;i<n;i++){ const a=c[i], b=c[i+1<n?i+1:i]; for(let j=0;j<k;j++) o[i*k+j]=a+(b-a)*j/k; } }); }
  src=ctx.createBufferSource(); src.buffer=buf; src.loop=document.getElementById("loop").checked;
  gain=ctx.createGain(); gain.gain.value=document.getElementById("vol").value/100*0.8; src.connect(gain).connect(ctx.destination);
  const me=src; src.onended=()=>{ if(playing&&src===me&&!me.loop){ playing=false; w3draw(-1); fctx.putImageData(fpImage,0,0); restSpectrum(); } };
  if(CNT_ON) cnt("hit/"+CNT_NS+"/plays").then(v=>{ if(v!=null){ stP=v; showStats(); } });
  t0=ctx.currentTime+0.05; src.start(t0); lastRow=0; playing=true; peak=null;
  const img=wctx.createImageData(W,WH); for(let y=0;y<WH;y++) paintRow(img,y,new Float32Array(W)); wctx.putImageData(img,0,0);
  requestAnimationFrame(tick);
}
function stop(){ playing=false; w3last=-2; if(w3rows) w3draw(-1); if(src){ try{src.stop();}catch(e){} src.disconnect(); src=null; } if(fpImage) fctx.putImageData(fpImage,0,0); restSpectrum(); }
function tick(){
  if(!playing||!ctx||!src) return;
  const m=current, dur=signal.length/SR, el=ctx.currentTime-t0;
  if(el>=0){ const target=Math.floor(el*m.rps); let added=0, last=null;
    while(lastRow<target&&added<8){ const tt=lastRow/m.rps, pos=src.loop?tt%dur:tt;
      const row=pos<dur?norm(spectrumRaw(signal,Math.round(pos*SR),m)):new Float32Array(W);
      wctx.drawImage(wf,0,0,W,WH-1,0,1,W,WH-1); const img=wctx.createImageData(W,1); paintRow(img,0,row); wctx.putImageData(img,0,0);
      lastRow++; added++; last=row; }
    if(added===8) lastRow=target;
    if(last){ if(!peak) peak=Float32Array.from(last); else for(let x=0;x<W;x++) peak[x]=Math.max(last[x],peak[x]-0.006); drawSpectrum(last); }
    const p=(src.loop?el%dur:Math.min(el,dur))/dur; fctx.putImageData(fpImage,0,0); fctx.fillStyle=P().head; fctx.fillRect(0,Math.round(p*fp.height),W,2); const hk=Math.floor(p*44); if(hk!==w3last){ w3last=hk; w3draw(p); } }
  requestAnimationFrame(tick);
}

/* ================= interface ================= */
[sp,wf,fp].forEach(cv=>{
  cv.addEventListener("pointermove",e=>{ if(!current) return; const r=cv.getBoundingClientRect(), u=(e.clientX-r.left)/r.width, m=current;
    const f=(m.span[0]+u*(m.span[1]-m.span[0]))*m.scale, w=(m.span[1]-m.span[0])*m.scale;
    document.getElementById("ro1").textContent=w>=4000?(f/1000).toLocaleString(LOC,{maximumFractionDigits:2})+" kHz":f.toLocaleString(LOC,{maximumFractionDigits:w<100?1:0})+" Hz"; });
  cv.addEventListener("pointerleave",()=>document.getElementById("ro1").textContent="—");
});
const aside=document.getElementById("modes");
function buildAside(){ aside.textContent=""; aside.setAttribute("aria-label",t("signals"));
  const cnt=document.createElement("p"); cnt.className="count"; cnt.textContent=MODES.length+" "+t("signals").toLocaleLowerCase(LOC); aside.appendChild(cnt);
  const groups=(I18N[LG]&&I18N[LG].groups)||I18N.fr.groups;
  groups.forEach((g,gi)=>{ const ms=MODES.filter(m=>m.gi===gi); if(!ms.length) return;
    const d=document.createElement("div"); d.className="group"; d.innerHTML=`<h2>${esc(g)}</h2><ul></ul>`;
    ms.forEach(m=>{ const x=tx(m), li=document.createElement("li");
      li.innerHTML=`<button class="mode" type="button" data-id="${m.id}" aria-pressed="${String(!quiz&&current===m)}">${esc(x.name)}<span>${esc(x.short)}</span></button>`;
      li.firstChild.addEventListener("click",()=>{ quiz=null; select(m); play(); }); d.querySelector("ul").appendChild(li); });
    aside.appendChild(d); }); }
function setLang(l,user){ if(!I18N[l]) l="fr"; LG=l; LOC=(LANGS.find(x=>x[0]===l)||LANGS[0])[2]; document.documentElement.lang=l;
  const sel=document.getElementById("lang"); sel.value=l;
  const T={tBook:"book_dl",tBook2:"book_dl2",tTitle:"title",tLang:"lang",mystery:"mystery",play:"play",stop:"stop",tNoise:"noise",tVol:"volume",tLoop:"loop",tSpecwf:"specwf",tCursor:"cursor",tFoot:"footprint",tW3d:"w3d",tW3dHint:"w3dHint",tF1:"f1",tF2:"f2"};
  for(const id in T) document.getElementById(id).textContent=t(T[id]);
  document.getElementById("tTheme").textContent=t("display"); document.getElementById("theme").setAttribute("aria-label",t("display")); sel.setAttribute("aria-label",t("lang"));
  [["day","theme_day"],["night","theme_night"],["phos","theme_phos"],["phosb","theme_phosb"],["phosa","theme_phosa"]].forEach(([v,k])=>{ document.querySelector('#theme option[value="'+v+'"]').textContent=t(k); });
  document.title="VSISA V1.8 · Virtual Simulator identification Signal Audio"; showStats();
  if(user){ try{ localStorage.setItem("idmr-lang",l); }catch(e){} try{ history.replaceState(null,"","#"+l); }catch(e){} }
  buildAside();
  if(current){ setNow(current,!!quiz); document.getElementById("spanLbl").textContent=spanText(current,!!quiz); ruler("ruler1"); ruler("ruler2");
    if(quiz) renderQuiz(); else renderInfo(current,""); if(!playing){ restSpectrum(); blankWaterfall(t("press")); }
    const d=signal.length/SR; document.getElementById("dur").textContent=t("dur").replace("{s}",d.toLocaleString(LOC,{minimumFractionDigits:1,maximumFractionDigits:1})); } }
(function(){ const sel=document.getElementById("lang"); LANGS.forEach(([c,n])=>{ const o=document.createElement("option"); o.value=c; o.textContent=n; sel.appendChild(o); });
  sel.addEventListener("change",()=>setLang(sel.value,true)); })();
function setTheme(th){ if(!PALS[th]) th="day"; THEME=th; LUT=LUTS[th];
  const h=document.documentElement; h.classList.toggle("night",th==="night"); h.classList.toggle("phos",th.startsWith("phos")); h.classList.toggle("blue",th==="phosb"); h.classList.toggle("amber",th==="phosa");
  document.getElementById("theme").value=th;
  try{ localStorage.setItem("idmr-theme",th); }catch(e){}
  if(current&&signal){ analyse(); if(!playing) blankWaterfall(t("press")); } }
document.getElementById("theme").addEventListener("change",e=>setTheme(e.target.value));
document.getElementById("play").addEventListener("click",play);
document.getElementById("stop").addEventListener("click",stop);
document.getElementById("mystery").addEventListener("click",mystery);
document.getElementById("vol").addEventListener("input",e=>{ if(gain) gain.gain.value=e.target.value/100*0.8; });
document.getElementById("loop").addEventListener("change",e=>{ if(src) src.loop=e.target.checked; });
document.getElementById("noise").addEventListener("change",()=>{ if(!current) return; const was=playing, hidden=!!quiz; stop();
  signal=buildSignal(current); analyse(); if(was) play(); else blankWaterfall(t("press")); if(hidden) renderQuiz(); });

function browserLang(){ // langue du navigateur : on parcourt toute la liste de préférences (zh-TW, pt-BR, de-CH… comptent aussi)
  const alias={cz:"cs",ua:"uk",jp:"ja",cn:"zh",be:"ru"};
  const list=[].concat(navigator.languages||[],navigator.language||[],navigator.userLanguage||[]);
  for(const tag of list){ if(!tag) continue; const b=String(tag).toLowerCase().split(/[-_]/)[0], c=alias[b]||b; if(I18N[c]) return c; }
  return "en"; }
let lg0=location.hash.slice(1);
if(!I18N[lg0]){ try{ lg0=localStorage.getItem("idmr-lang")||""; }catch(e){ lg0=""; } }
if(!I18N[lg0]) lg0=browserLang();
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(I18N[h]&&h!==LG) setLang(h); });
let start=MODES.find(m=>m.id==="psk31");
try{ const s=localStorage.getItem("idmr-mode"); const f=MODES.find(m=>m.id===s); if(f) start=f; }catch(e){}
try{ THEME=localStorage.getItem("idmr-theme")||(localStorage.getItem("idmr-night")==="1"?"night":"day"); }catch(e){}
setLang(lg0);
setTheme(THEME);
select(start);
})();
