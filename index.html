desde abajo de la imagen: al derecho en la cascada en directo, al revés en la huella (leída de arriba abajo)"]]},"vara":{"t":"Datos HF modernos: VARA, Pactor, ARDOP","h":"Largas ráfagas llenas (OFDM o PSK) y, entre ellas, respuestas cortas de la otra estación.","l":"Un rectángulo de unos 2,4 kHz que se para y vuelve a empezar, con un pequeño acuse de recibo en medio; un siseo entrecortado (ficha 26)."},"chirp":{"nm":"Sondeador ionosférico","t":"Sondeador ionosférico (chirp sounder)","h":"Una rampa de frecuencia lenta que cruza toda la banda HF; los ecos de la ionosfera llegan un poco después.","l":"Una diagonal que barre la pantalla, acompañada de rayas paralelas (los ecos); un «ffuit» que pasa en una fracción de segundo."},"oth":{"nm":"Radar transhorizonte","t":"Radar transhorizonte («woodpecker»)","h":"Impulsos repetidos de 10 a 50 veces por segundo, cada uno de varios kHz de ancho.","l":"Un bloque ancho y rayado que cubre bandas enteras; un golpeteo de pájaro carpintero muy regular en onda corta."},"parasites":{"nm":"Interferencias","sh":"fuente","t":"Interferencias de una fuente conmutada","h":"Una señal cuadrada: su frecuencia y todos sus armónicos salen a la vez.","l":"Un peine de rayas regulares que derivan juntas sobre un fondo de ruido: búscalo con NOISE FIND o con un receptor portátil (ficha K21b)."},"mpx":{"nm":"FM estéreo y RDS","t":"Radio FM estéreo y RDS","h":"El sonido demodulado (multiplex) contiene la vía L+R, un piloto a 19 kHz, la vía L-R alrededor de 38 kHz y el RDS a 57 kHz.","l":"Visto de 0 a 60 kHz tras la demodulación: un bloque grave, una raya fina a 19 kHz, un bloque más débil en el centro y el RDS arriba del todo (ficha 10).","n":"escala ÷ 20 para la escucha"},"dcf77":{"t":"Señal horaria DCF77 (77,5 kHz)","h":"Una portadora que baja al 15 % durante 0,1 s (bit 0) o 0,2 s (bit 1), al inicio de cada segundo.","l":"Una raya fija con un corte negro cada segundo; el segundo 59 no lo tiene, para marcar el minuto (ficha 10).","r":[["Nota","Aquí la portadora se lleva a 1000 Hz; el 6.º segundo no tiene corte, como el segundo 59 de cada minuto"]]},"ofdm":{"t":"OFDM: decenas de subportadoras","h":"Muchas portadoras muy juntas, cada una lenta: la suma parece ruido.","l":"Un rectángulo plano de bordes nítidos, siempre presente: DRM en onda corta (10 kHz), DAB+ (1,5 MHz), TDT, wifi. Un soplido continuo al oído (fichas 10 y 22)."},"dsss":{"t":"Espectro ensanchado (DSSS): GPS, wifi 802.11b","h":"Los datos se mezclan con un código muy rápido: la energía se reparte en un gran ancho.","l":"Una joroba ancha, apenas por encima del ruido; el GPS está incluso por debajo del ruido y no se ve sin tratamiento (fichas 22 y 23)."},"hline":{"nm":"Línea del hidrógeno","sh":"1420 MHz","t":"Línea del hidrógeno de 21 cm (1420,405 MHz)","h":"El hidrógeno frío de la Vía Láctea emite un soplido muy débil en 1420,405 MHz. El movimiento de los brazos de la galaxia lo desplaza por efecto Doppler: se ven varias jorobas pequeñas.","l":"Casi nada en la cascada de un segundo a otro: hay que promediar mucho tiempo para ver las jorobas salir del ruido. Aquí, mira el espectro medio en pausa. Basta una parábola o una bocina, un preamplificador y una llave SDR.","n":"señal muy exagerada"},"sun":{"nm":"Sol","sh":"ráfagas","t":"Sol: ráfagas de radio de tipo III","h":"Electrones lanzados por una erupción atraviesan la corona solar y la hacen emitir cada vez más bajo en frecuencia a medida que se alejan.","l":"Rayas que caen en diagonal de arriba abajo del espectro en menos de un segundo, sobre un fondo de ruido solar; un «chhhh» que crece. De unos 10 a 400 MHz, también en onda corta hacia 20 MHz."},"jupiter":{"nm":"Júpiter","sh":"20 MHz","t":"Júpiter: ráfagas decamétricas (L y S)","h":"El campo magnético de Júpiter y su luna Ío producen emisiones potentes entre 15 y 40 MHz: ráfagas L lentas y ráfagas S muy cortas que bajan deprisa.","l":"Primero olas de soplido (L, como la resaca del mar), luego trenes de pequeños «pops» (S) en diagonales apretadas. Hacia 20,1 MHz de noche, con un simple dipolo, cuando Ío está bien situada."},"pulsar":{"nm":"Púlsar","sh":"B0329+54","t":"Púlsar PSR B0329+54","h":"Una estrella de neutrones que gira barre la Tierra con un haz de radio, aquí cada 0,714 s. El gas interestelar retrasa las frecuencias bajas: cada impulso llega primero arriba del espectro.","l":"Un «tic» regular; en la cascada, cada impulso es una curva que baja (dispersión). La señal real está bajo el ruido: hace falta una gran antena y sumar los impulsos sobre su período.","n":"señal muy exagerada"},"meteor":{"nm":"Meteoros","sh":"GRAVES","t":"Ecos de meteoros del radar GRAVES (143,050 MHz)","h":"El radar francés GRAVES emite sin parar en 143,050 MHz. Cuando una estrella fugaz ioniza el aire, su estela devuelve un poco de esa señal a tu receptor, de una fracción de segundo a unos segundos.","l":"En USB en 143,049 MHz: «pings» breves hacia 1000 Hz, a veces un eco que se desliza (la cabeza del meteoro, efecto Doppler) o que dura. Muchos más durante las lluvias (Perseidas, Gemínidas) (ficha 1)."},"whistler":{"nm":"Silbidos","sh":"VLF","t":"Silbidos VLF (whistlers)","h":"Un rayo crea un chasquido de radio; una parte sigue las líneas del campo magnético terrestre hasta el otro hemisferio y vuelve, los agudos primero.","l":"Un «fiuuu» que baja de agudo a grave en uno o dos segundos, justo tras un chasquido; crujidos (sferics) por todas partes. Por debajo de 10 kHz, con un receptor VLF lejos de las líneas eléctricas."},"chorus":{"nm":"Coro del amanecer","sh":"VLF","t":"Coro del amanecer (dawn chorus)","h":"Durante una tormenta magnética, electrones atrapados en la magnetosfera emiten pequeñas notas ascendentes, sobre todo al amanecer.","l":"Gorjeos ascendentes que se solapan, como pájaros, de 1 a 4 kHz aproximadamente. El mismo equipo que para los silbidos."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"El primer satélite artificial emitía pitidos de unos 0,3 s en 20,005 y 40,002 MHz, alternando, durante tres semanas.","l":"Una raya cortada con regularidad: «bip… bip…», el sonido que escuchó todo el mundo en octubre de 1957 (reconstrucción)."},"doppler":{"nm":"Efecto Doppler","sh":"satélite","t":"Baliza de satélite y efecto Doppler","h":"Un satélite en órbita baja se acerca y luego se aleja: la frecuencia recibida baja durante el pase, unos ±3 kHz en 145 MHz y ±10 kHz en 435 MHz.","l":"Una raya que baja en forma de S: despacio al principio, deprisa cuando el satélite pasa más cerca, y otra vez despacio (ficha 34).","n":"pase de 10 min reducido a 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satélites NOAA: imágenes APT (histórico)","h":"Una subportadora de 2400 Hz modulada en amplitud por la imagen, dos líneas por segundo, con un pulso de sincronía al inicio de cada línea. Se apagó en 2025; hoy los Meteor-M emiten en LRPT.","l":"Una raya en 2400 Hz con bandas laterales que cambian con la imagen, y el famoso «tic-tac» dos veces por segundo (ficha 34)."},"eme":{"nm":"Eco de la Luna","sh":"EME","t":"Eco de la Luna (EME)","h":"Una señal enviada a la Luna vuelve unos 2,5 s después, muchísimo más débil, algo ensanchada y desplazada por el Doppler.","l":"Se oye el propio «bip» y luego su eco débil y algo borroso 2,5 s después. Los radioaficionados lo hacen en CW o JT65, en 144 MHz y más arriba (ficha 1).","n":"eco muy exagerado"},"msk144":{"nm":"MSK144","sh":"meteoros","t":"MSK144: el modo digital de los meteoros","h":"Dos tonos, 1000 y 2000 Hz, a 2000 baudios, en tramas de 72 ms repetidas sin parar: cada estela de meteoro deja pasar algunas.","l":"Ráfagas de 0,1 a 1 s, de unos 2,4 kHz de ancho, que aparecen y se apagan con el «ping» del meteoro. En 50 y 144 MHz, con WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tonos","t":"JT65: 65 tonos, muy lento","h":"Un tono de sincronía y 64 tonos de datos separados 2,7 Hz (JT65A), 0,37 s por símbolo, 47 s de emisión por minuto.","l":"Una escalera de rayitas sobre unos 180 Hz, con una raya de sincronía que vuelve siempre al mismo sitio. Se usa para el rebote lunar (JT65B y C) y señales muy débiles.","n":"extracto de 20 s (una emisión dura 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: red digital profesional","h":"Modulación de fase π/4-DQPSK a 18 000 símbolos por segundo, cuatro canales repartidos en el tiempo, en canales de 25 kHz.","l":"Un bloque lleno de flancos redondeados, siempre presente cerca de un repetidor; un soplido ronco. Cifrado: no se puede escuchar (ficha 38).","n":"escala reducida"},"ndb":{"nm":"Radiofaro NDB","sh":"190–535 kHz","t":"NDB: radiofaro no direccional","h":"Una portadora fija en onda larga, con un indicativo Morse de dos o tres letras enviado sobre un tono (a menudo 1020 Hz).","l":"Una raya fija en el centro y, durante el indicativo, dos rayitas a cada lado. De unos 190 a 535 kHz, en BLU o CW (ficha 10)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: radiofaro omnidireccional","h":"En AM: una señal de 30 Hz que depende de la dirección, una subportadora de 9960 Hz modulada en frecuencia a 30 Hz (la referencia) y el indicativo Morse en 1020 Hz.","l":"En el sonido demodulado: un zumbido grave de 30 Hz, una raya ancha ondulante hacia 10 kHz y el indicativo de vez en cuando (ficha 15).","n":"sonido demodulado, escala ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: guiado de aterrizaje (localizador)","h":"En AM, dos tonos de 90 y 150 Hz; su relación indica al avión si está a la izquierda o a la derecha del eje. El indicativo Morse empieza por I.","l":"En el sonido demodulado: dos rayas muy graves en 90 y 150 Hz y el indicativo en 1020 Hz. Entre 108,1 y 112 MHz; la senda de planeo está hacia 330 MHz (ficha 15)."},"m10":{"nm":"Sondas M10 / M20","sh":"Meteomodem","t":"Radiosondas M10 y M20 (Meteomodem)","h":"Una trama por segundo en FSK rápida (unos 9600 baudios): más ancha que la RS41. Las lanza en Francia Météo-France.","l":"Una ráfaga ancha cada segundo que deriva despacio durante el vuelo; entre 400 y 406 MHz (ficha 18)."},"tpms":{"nm":"Neumáticos (TPMS)","sh":"433 MHz","t":"Sensores de presión de neumáticos (TPMS)","h":"Cada rueda envía de vez en cuando una ráfaga FSK de pocos milisegundos: presión, temperatura, identificador.","l":"Pequeñas ráfagas aisladas en 433,92 MHz (o 315 MHz), a menudo de dos en dos, al pasar un coche. Las decodifica rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Señal horaria ALS162 (Allouis, 162 kHz)","h":"La portadora de la antigua onda larga de France Inter; la hora se codifica con pequeñas modulaciones de fase, inaudibles.","l":"Una raya fija, muy fuerte en Francia, apenas ensanchada al inicio de cada segundo; hace falta un decodificador para leer la hora (ficha 10)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Señal horaria WWV (Colorado)","h":"En AM: un «tic» de 5 ms a 1000 Hz cada segundo, un tono de 500 o 600 Hz, un código horario en 100 Hz y una voz que anuncia la hora UTC.","l":"En el sonido demodulado: una raya en 500 Hz cortada cada segundo, el tic en 1000 Hz y el código abajo del todo en 100 Hz (ficha 10)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Señal horaria MSF (Anthorn, 60 kHz)","h":"La portadora se corta al inicio de cada segundo durante 0,1, 0,2 o 0,3 s según los bits, y 0,5 s para marcar el minuto.","l":"Una raya fija con huecos negros completos cada segundo, más largos que con DCF77 (ficha 10)."},"type2":{"nm":"Sol tipo II","sh":"onda de choque","t":"Sol: ráfagas de radio de tipo II","h":"La onda de choque de una eyección de masa coronal hace emitir al plasma cada vez más bajo, despacio, a menudo en dos bandas (la fundamental y su doble).","l":"Dos bandas de ruido paralelas que bajan suavemente durante varios minutos. Compáralas con las de tipo III, mucho más rápidas.","n":"varios minutos reducidos a 6 s"},"tweeks":{"nm":"Tweeks","sh":"VLF","t":"Tweeks: los «pings» nocturnos en VLF","h":"De noche, el chasquido de un rayo lejano rebota entre el suelo y la ionosfera; las frecuencias cercanas al corte (hacia 1,7 kHz) llegan las últimas.","l":"Un pequeño «ping» que baja y se detiene hacia 1,7 kHz, a veces con un eco al doble; crujidos por todas partes. Por debajo de 10 kHz, de noche."},"hiss":{"nm":"Soplido VLF","sh":"hiss","t":"Soplido VLF (hiss)","h":"Un ruido ancho producido por los electrones de la plasmasfera, que sube y baja con la actividad magnética.","l":"Una banda de soplido de unos cientos de Hz a unos kHz, sin patrón, que crece y decae despacio."},"aurora":{"nm":"Aurora radio","sh":"Au","t":"Propagación auroral (Au)","h":"Una aurora boreal refleja las ondas VHF, pero las agita muy deprisa: cada señal se reparte sobre varios cientos de Hz.","l":"La CW se vuelve un soplido áspero, como susurrado; ya no se oye la nota. En 50 y 144 MHz, apuntando al norte durante las tormentas magnéticas."},"galactic":{"nm":"Ruido galáctico","sh":"20–40 MHz","t":"Ruido de la Vía Láctea","h":"El centro de la galaxia emite un soplido de radio que Karl Jansky descubrió en 1932 hacia 20 MHz. Sube y baja con la rotación de la Tierra.","l":"Un ruido de fondo que sube despacio y vuelve a bajar, cada día unos 4 minutos antes. Visible con un simple dipolo entre 20 y 40 MHz.","n":"un día reducido a 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"Telemetría de CubeSat","h":"Los pequeños satélites envían con regularidad sus medidas (batería, temperaturas) en FSK o GMSK a 1200 o 9600 baudios, hacia 435–438 MHz.","l":"Ráfagas regulares que bajan un poco cada vez, por efecto Doppler, durante el pase (ficha 34).","n":"escala reducida, pase acelerado"},"issfm":{"nm":"ISS en FM","sh":"145,800 MHz","t":"Estación espacial (ISS): voz en FM","h":"Los astronautas hablan con colegios y radioaficionados en FM en 145,800 MHz. La estación va a 28 000 km/h: la frecuencia recibida baja unos 3,5 kHz durante el pase.","l":"Una banda de voz FM que se desplaza despacio de derecha a izquierda durante los 10 minutos del pase (ficha 34).","n":"pase de 10 min reducido a 10 s"},"buzzer":{"nm":"UVB-76 «The Buzzer»","sh":"4625 kHz","t":"UVB-76, «The Buzzer» (4625 kHz)","h":"Una estación militar rusa que emite desde hace décadas un zumbido de un segundo repetido unas 25 veces por minuto, a veces interrumpido por un mensaje de voz.","l":"Una portadora fija y, en cada zumbido, una columna de rayas apretadas de arriba abajo. Fácil de encontrar en 4625 kHz en USB."},"pip":{"nm":"«The Pip»","sh":"3756 / 5448 kHz","t":"«The Pip»: pitidos sin fin","h":"Otra baliza militar rusa de onda corta que repite pequeños pitidos breves, día y noche, a veces interrumpidos por mensajes.","l":"Una raya fija cortada en puntos muy juntos; al oído, un pip-pip-pip rápido que nunca para.","n":"ritmo aproximado"},"squeaky":{"nm":"«Squeaky Wheel»","sh":"OC","t":"«Squeaky Wheel»: la rueda que chirría","h":"Una baliza militar rusa de onda corta, bautizada por los escuchas según su motivo sonoro repetido.","l":"Un pequeño motivo de dos sonidos, uno de ellos ascendente, repetido en bucle: como una rueda que chirría.","n":"imitación aproximada"},"codar":{"nm":"CODAR","sh":"radar oceánico","t":"CODAR: radares de corrientes marinas","h":"Radares costeros barren una banda de frecuencias una o dos veces por segundo para medir corrientes y olas.","l":"Diagonales paralelas regulares y un «swish» repetido; hacia 4,5–5,5 MHz, 13 MHz y 25 MHz, a menudo día y noche.","n":"escala reducida"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Módem militar STANAG 4285","h":"Modulación de fase 8-PSK a 2400 baudios sobre una portadora de 1800 Hz, con una secuencia de prueba cada 107 ms para seguir el canal.","l":"Un bloque lleno de unos 3 kHz; al oído, un soplido con un zumbido regular (ficha 35 bis)."},"link11":{"nm":"Link-11","sh":"16 tonos","t":"Link-11: enlace de datos naval","h":"Dieciséis tonos de 605 a 2915 Hz emitidos juntos, cada uno modulado en fase 75 veces por segundo.","l":"Un peine de rayas regulares sobre 2,3 kHz, más una raya algo apartada; al oído, un zumbido musical (ficha 35 bis)."},"numbers":{"nm":"Estación de números","sh":"voz","t":"Estación de números","h":"A hora fija, una pequeña melodía de llamada y luego una voz (a menudo sintética) que lee grupos de cinco cifras, en AM o BLU.","l":"La melodía en notas sueltas y después grupos regulares de sílabas separados por silencios (ficha 35 bis).","n":"voz imitada, sin cifras reales"}}},"de":{"ui":{"title":"Funkbetriebsarten-Erkenner","mystery":"Rätselton","play":"▶ Anhören","stop":"■ Stopp","noise":"Rauschen","volume":"Lautstärke","loop":"Schleife","specwf":"Spektrum + Wasserfall","cursor":"Cursor","footprint":"Abdruck","dur":"{s} s von oben nach unten","avg":"Mittelwert über das ganze Signal","press":"Drücke Anhören: das Signal läuft hier durch","count":"{n} Signale, in der Reihenfolge von Blatt 5 bis","myst":"Rätselmodus","mystTags":"Hören und schauen, dann die richtige Antwort wählen","quizH":"Welches Signal ist das?","quizLead":"Starte die Wiedergabe, beobachte Spektrum, Wasserfall und Abdruck, dann antworte.","score":"Punkte","good":"Richtig!","bad":"Leider nein: es war {x}.","next":"Nächster Rätselton","principle":"Prinzip","screen":"Auf dem Bildschirm","sheet":"Blatt","book":"Buch: Blatt {r}","lang":"Sprache","signals":"Signale","f1":"Im Browser simulierte Signale (12 000 Abtastwerte pro Sekunde), nach den Signalen von Blatt 5 bis des Buchs OpenBookRadio, dazu Olivia, FT4 und Feld Hell (Blatt 26). Bei Funksignalen (AM, FM, AIS, LoRa…) sieht man die simulierte Zwischenfrequenz wie auf einem SDR-Bildschirm; manche sind verkleinert oder beschleunigt, das ist angegeben.","f2":"Die Zeit läuft im Wasserfall und im Abdruck nach unten. Lizenz CC BY-NC-SA 4.0, kostenlos, nicht verkaufen.","night":"Nachtmodus","day":"Tagmodus"},"groups":["Analoge Sprache","Telegrafie","Daten","Bilder","Luftfahrt, Seefahrt und Rettung","Ruf, Subtöne und Funkruf","Radiosonden, Sensoren und vernetzte Geräte","KW-Betriebsarten und Kuriositäten","Rundfunk und Zeit","Breitband","Bonus: Klänge aus dem All","Bonus: Kuriositäten der Kurzwelle"],"modes":{"am":{"sh":"Sprache","t":"AM: Amplitudenmodulation","h":"Die Stärke des Trägers folgt dem Ton: die Kurve „schwillt“ an und ab.","l":"Ein fester Strich in der Mitte (der Träger), mit zwei gleichen Seitenbändern links und rechts. Etwa 6 bis 9 kHz breit. Rundfunk auf Kurz- und Mittelwelle, Flugfunk (Blätter 10 und 12)."},"ssb":{"nm":"SSB / ESB","t":"SSB: Einseitenband","h":"Nur ein Seitenband bleibt, ohne Träger: nichts, wenn niemand spricht.","l":"Kein Mittelstrich, ein einziges Band von etwa 2,7 kHz, das nur beim Sprechen lebt. USB über 10 MHz, LSB darunter (Funkamateure). Falsch abgestimmt klingt die Stimme wie eine „Ente“ (Blätter 9 und 26)."},"fm":{"sh":"Sprache","t":"FM: Frequenzmodulation","h":"Die Amplitude bleibt gleich; die Schwingungen rücken mit dem Ton zusammen oder auseinander.","l":"Das Signal tanzt um seine Frequenz, breiter bei lautem Ton: 12,5 kHz pro Kanal bei Schmalband-FM (Handfunkgeräte, Relais), 200 kHz beim UKW-Rundfunk (Blätter 2 und 11)."},"cw":{"t":"CW: Morse","h":"Der Träger wird ein- und ausgeschaltet: Striche und Punkte.","l":"Ein sehr feiner Strich, der im Rhythmus des Morsecodes unterbrochen wird; ein Piepen im Ohr. Hier „CQ“ (Blatt 39).","r":[["Tempo","20 Wörter/min, Punkt 60 ms, auf 700 Hz: „CQ CQ CQ DE F4ABC K“"],["Mit dem Ohr","Reine Pieptöne, lang und kurz, auf einem Ton"],["Dekodierung","Nach Gehör, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: zwei Frequenzen","h":"Die Frequenz springt zwischen zwei Werten, einem für 0, einem für 1.","l":"Zwei parallele Striche: 170 Hz Abstand bei Funkamateuren (45,45 Baud), 450 oder 850 Hz bei Wetterberichten. Ein regelmäßiges „tidilidi“ (Blatt 27).","r":[["Code","Baudot ITA2: 5 Bit + Start + 1,5 Stopp; Mark 2125 Hz, Space 2295 Hz"],["Text","RYRYRYRY CQ CQ DE F4ABC"],["Dekodierung","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 Baud: APRS und Packet","h":"Zwei Tonfrequenzen, 1200 und 2200 Hz, in einen FM-Sender gegeben.","l":"Hinter dem FM-Empfänger (Lautsprecherton): ein Band von 1200 bis 2200 Hz, in kurzen Paketen. Im Ohr ein einsekündiges „grrrt“ (Blätter 29 und 30).","r":[["Frequenz","144,800 MHz in Europa (APRS), FM"],["Rahmen","Flags 0x7E, dann AX.25-Daten in NRZI"],["Dekodierung","Direwolf, multimon-ng, KISS-TNC"]]},"psk31":{"t":"PSK31: Phasenmodulation","h":"Die Frequenz bleibt, die Phase kehrt sich um; bei jeder Umkehr sinkt die Amplitude.","l":"Ein sehr feiner Strich von etwa 60 Hz, leicht „geflochten“. Dutzende Stationen passen in 3 kHz (Blatt 26).","r":[["Code","Varicode: 0 = Phasenumkehr, 1 = keine Änderung; im Leerlauf zwei Zwillingsstriche"],["Wo hören","14 070 kHz, 3580 kHz"],["Dekodierung","fldigi"]]},"ft8":{"t":"MFSK / FT8: acht Töne","h":"Die Frequenz steigt und fällt in Stufen von 6,25 Hz, 0,16 s pro Stufe.","l":"Bänder von etwa 50 Hz, die 12,6 s dauern und alle 15 s wiederkommen, nach der Uhrzeit getaktet: mehrere Stationen gleichzeitig in 3 kHz, zum Beispiel auf 7,074 MHz (Blatt 26).","r":[["Rahmen","79 Symbole zu 0,16 s, drei Costas-Muster (Anfang, Mitte, Ende); hier acht Stationen"],["Frequenzen","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Dekodierung","WSJT-X, JTDX (genaue PC-Uhr)"]]},"ft4":{"t":"FT4: das FT8 für Conteste","h":"Vier Töne im Abstand von 20,8 Hz, 20,8 Baud: 105 Symbole in 5 s, in Zeitfenstern von 7,5 s.","l":"Bänder von etwa 90 Hz, kürzer und breiter als FT8, alle 7,5 s wieder. 14 080, 7047,5 kHz (Blatt 26)."},"olivia":{"t":"Olivia 8/250: acht Töne","h":"Acht Töne im Abstand von 31,25 Hz, immer nur einer, die zufällig springen; Walsh-Codierung und Verschachtelung.","l":"Ein Block verstreuter Punkte über 250 Hz; dekodiert weit unter dem Rauschen. Eine kleine Zufallsmelodie im Ohr (Blatt 26)."},"hell":{"t":"Feld Hell: Schreiben mit einem Träger","h":"Der Träger wird Punkt für Punkt ein- und ausgeschaltet: jeder Buchstabe besteht aus Spalten von 14 Punkten, von unten nach oben abgetastet (245 Punkte pro Sekunde).","l":"Im Wasserfall ein zerhackter Strich; erst der Programmbildschirm (fldigi) zeichnet die Buchstaben. Ein sanftes Knistern im Ohr (Blatt 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Vier Frequenzstufen: jedes Symbol trägt zwei Bit.","l":"Ein rechteckiger Block von 6 bis 12,5 kHz, voll wie Rauschen, oft in Paketen (DMR teilt den Kanal in zwei Zeitschlitze). Ein raues „frrr“ im Ohr (Blatt 38)."},"mt63":{"t":"MT63: Notfunknachrichten (NBEMS)","h":"64 Töne gleichzeitig, jeder langsam moduliert, mit viel Redundanz.","l":"Ein flacher Block von 1 oder 2 kHz um 1500 Hz, mit scharfen Kanten; ein gleichmäßiges Rauschen. Geht sogar über ein Mikrofon am Lautsprecher (Blatt 26 ter)."},"lora":{"t":"LoRa: Frequenzrampen (Chirps)","h":"Die Frequenz durchläuft die ganze Breite und beginnt dann wieder unten: die Lage des Sprungs trägt die Daten.","l":"Parallele Diagonalen, leicht zu erkennen: Meshtastic und MeshCore auf 869,525 MHz oder 433 MHz, LoRaWAN-Sensoren (Blätter 11, 20 und 21)."},"sstv":{"t":"SSTV: Bilder als Ton","h":"Ein Synchronimpuls auf 1200 Hz, dann folgt die Frequenz der Helligkeit der Zeile, von 1500 (schwarz) bis 2300 Hz (weiß).","l":"Regelmäßige Synchronstriche und eine Wolke, die sich mit dem Bild ändert; ein „zwitschernder“ Ton für ein bis zwei Minuten. 14,230 MHz, ISS auf 145,800 MHz (Blatt 31).","r":[["Rahmen","VIS-Kopf, dann Zeilen: Synchron 1200 Hz, Grün, Blau, Rot; hier 20 Zeilen eines Testbilds"],["Dekodierung","QSSTV, MMSSTV, Robot36 auf dem Smartphone"]]},"fax":{"nm":"Wetterfax","t":"Wetterfax: 1500 Hz schwarz, 2300 Hz weiß","h":"Die Frequenz geht stufenlos von Schwarz nach Weiß, 120 Zeilen pro Minute.","l":"Zwei feste Bänder auf 1500 und 2300 Hz (800 Hz Abstand), ein regelmäßiges „Tick-Tack“. Veröffentlicht wird die Trägerfrequenz: in USB 1,9 kHz tiefer hören (Blatt 32).","r":[["Rahmen","Startton 300 Hz, Phasenzeilen (weißer Impuls), dann die Karte"],["Dekodierung","fldigi, JWX, HamFax"]]},"elt":{"nm":"ELT-Sirene","t":"ELT- / PLB-Sirene auf 121,5 MHz","h":"Eine AM, deren Ton zwei- bis viermal pro Sekunde von 1600 auf 300 Hz fällt.","l":"Ein fester Träger und fächerartig gleitende Seitenbänder: das „Wu-wu“ der Notsender, auch auf 121,375 MHz für Übungen (Blätter 24 und 25)."},"406":{"nm":"406-Bake","t":"406-MHz-Bake: BPSK-Paket","h":"Eine halbe Sekunde Sendung: 160 ms reiner Träger, dann kippt die Phase um ±1,1 Radiant mit 400 bit/s.","l":"Ein kleiner kurzer Strich, der alle 50 s wiederkommt, zwischen 406,0 und 406,1 MHz; nichts Nützliches zu hören, ein Dekoder ist nötig (EPIRB 406, Blatt 25)."},"adsb":{"t":"ADS-B / Mode S (1090 MHz): Impulse","h":"Impulse von 0,5 µs, deren Lage die Bits trägt (PPM); hier ist die Zeitachse stark verlangsamt.","l":"Sehr kurze waagerechte Striche über die ganze Breite, Hunderte pro Sekunde nahe einem Flughafen; ein SDR-Stick ist nötig (Blatt 13).","n":"Zeitachse stark verlangsamt"},"acars":{"t":"ACARS: AM und MSK-Daten","h":"Eine AM, die zwei Töne trägt, 1200 und 2400 Hz, mit 2400 bit/s.","l":"Halbsekündige Pakete mit Träger und Seitenbändern, auf 131,525, 131,725 oder 131,825 MHz in Europa: ein „brrrt“ im Ohr (Blatt 14)."},"ais":{"t":"AIS: GMSK 9600 Baud auf zwei Kanälen","h":"Eine geglättete FSK (GMSK) in Paketen von 26 ms, einmal auf 161,975 MHz, einmal auf 162,025 MHz (verkleinert).","l":"Zwei Spalten kurzer Striche, 50 kHz auseinander, ein regelmäßiges Klacken; je mehr Schiffe, desto dichter (Blatt 16).","n":"verkleinert"},"navtex":{"t":"NAVTEX und DSC auf Mittel- und Kurzwelle: FSK 170 Hz","h":"Wie RTTY: zwei Frequenzen mit 170 Hz Abstand, aber mit 100 Baud.","l":"Zwei parallele Striche, durchgehend während der Meldung, auf 518 und 490 kHz (NAVTEX) oder 2187,5 kHz (digitaler Selektivruf) (Blatt 17).","r":[["Code","SITOR-B, CCIR 476: 7 Bit mit vier „1“, mit FEC-Wiederholung"],["Dekodierung","fldigi, YaND"]]},"hfdl":{"t":"HFDL: Flugzeuge auf Kurzwelle","h":"Eine PSK mit 1800 Baud auf einem 1440-Hz-Hilfsträger.","l":"Pakete von etwa 2,4 kHz zwischen 2,9 und 22 MHz; ein Modemrauschen, das kommt und geht (Blatt 14 bis)."},"ctcss":{"t":"CTCSS: Subton unter der Stimme","h":"Ein tiefer Dauerton (67 bis 254 Hz, hier 88,5 Hz) wird der Stimme hinzugefügt.","l":"Im Ton des FM-Empfängers: ein fester Strich ganz unten, unter der Stimme; er öffnet die Rauschsperre von Relais und Handfunkgeräten (Blatt 8)."},"dtmf":{"sh":"2 Töne","t":"DTMF: zwei Töne pro Taste","h":"Jede Taste sendet gleichzeitig einen tiefen (697 bis 941 Hz) und einen hohen Ton (1209 bis 1633 Hz).","l":"Punktpaare auf acht festen Spalten; das „Piep-Piep“ von Telefonnummern und Relaisbefehlen (Blatt 8).","r":[["Folge","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 Töne","t":"Selcall CCIR: Tonfolge","h":"Fünf Töne von 100 ms nacheinander, einer pro Ziffer.","l":"Eine kleine Treppe aus Punkten, wiederholt; ein schnelles „tululululu“, um ein bestimmtes Gerät zu rufen (Blatt 28).","r":[["Folge","1 2 3 4 5, zweimal; auch von der SelCall-App des UV-K1 dekodiert"]]},"pocsag":{"sh":"Pager","t":"POCSAG und FLEX: Pager","h":"Eine FSK mit ±4,5 kHz; eine Präambel 1010…, dann die Daten (verkleinert).","l":"Zwei saubere Striche während der Präambel, dann ein volles Band; ein schrilles „brrrrt“. 466,075 MHz, DAPNET 439,9875 MHz (Blatt 37).","n":"verkleinert"},"ale":{"sh":"8 Töne","t":"ALE: automatischer Verbindungsaufbau auf Kurzwelle","h":"Acht Töne von 750 bis 2500 Hz, 125 Baud, in Paketen.","l":"Ein Block von etwa 2 kHz aus kleinen Punkten, ein bis zwei Sekunden, manchmal auf mehreren benachbarten Frequenzen; ein hohes Zwitschern (Blatt 28 bis)."},"rs41":{"nm":"Radiosonde RS41","t":"Radiosonde RS41: Dauer-GFSK","h":"Eine geglättete FSK mit 4800 Baud, ohne Pause; die Frequenz driftet langsam, wenn die Sonde steigt und abkühlt.","l":"Ein Band von etwa 10 kHz, das während des ganzen Flugs schräg wandert, zwischen 400 und 406 MHz (Blatt 18)."},"ook":{"nm":"433-Sensoren","t":"433-MHz-Sensoren: OOK","h":"Der Träger geht in kurzen oder langen Impulsen an und aus (Ein-Aus-Tastung); die Nachricht wird dreimal wiederholt.","l":"Pakete kleiner Punkte, oft dreifach, auf 433,92 MHz: Wetterstationen, Temperaturfühler, Fernbedienungen (Blatt 19)."},"fhss":{"t":"Bluetooth: Frequenzsprungverfahren (FHSS)","h":"Die Frequenz wechselt 1600-mal pro Sekunde unter 79 Kanälen (verkleinert).","l":"Kleine Striche überall verstreut auf 80 MHz Breite, nie an derselben Stelle, um 2,4 GHz (Blatt 22).","n":"verkleinert"},"wspr":{"t":"WSPR: Ausbreitungsbaken","h":"Vier Töne im Abstand von 1,46 Hz, 0,68 s pro Symbol, 110,6 s lang.","l":"Ein sehr feiner Strich von etwa 6 Hz, der fast zwei Minuten dauert, zu jeder geraden Minute: man muss stark heranzoomen (Blatt 26).","n":"Auszug von 24 s (eine Sendung dauert 110,6 s)"},"qrss":{"t":"QRSS: sehr langsames Morse","h":"Ein ein- und ausgeschalteter Träger mit Punkten von 3 bis 10 s, oft auf zwei benachbarten Frequenzen (DFCW).","l":"Striche von wenigen Hz Breite, auf einem Zehn-Minuten-Bildschirm gelesen; mit dem Ohr nicht hörbar (Blatt 26 bis).","n":"beschleunigt: Punkt 0,6 s statt 3 bis 10 s"},"texte":{"nm":"Text im Wasserfall","t":"Text im Wasserfall","h":"Jede Zeile eines Bildes wird zu einer Gruppe von Tönen: der Klang ähnelt Rauschen.","l":"Text oder Zeichnung erscheinen direkt auf dem SDR-Bildschirm (Blatt 33).","r":[["Hinweis","Von unten nach oben gesendet: aufrecht im Live-Wasserfall, kopfüber im Abdruck (von oben nach unten gelesen)"]]},"vara":{"t":"Moderne KW-Daten: VARA, Pactor, ARDOP","h":"Lange volle Pakete (OFDM oder PSK) und dazwischen kurze Antworten der Gegenstation.","l":"Ein Rechteck von etwa 2,4 kHz, das stoppt und neu startet, mit einer kleinen Quittung dazwischen; ein abgehacktes Rauschen (Blatt 26)."},"chirp":{"nm":"Ionosonde","t":"Ionosonde (Chirp-Sounder)","h":"Eine langsame Frequenzrampe quer durch das ganze KW-Band; die Echos der Ionosphäre kommen etwas später.","l":"Eine Diagonale über den Bildschirm, begleitet von parallelen Strichen (den Echos); ein „ffuit“, das in Sekundenbruchteilen vorbeizieht."},"oth":{"nm":"Überhorizontradar","t":"Überhorizontradar („Woodpecker“)","h":"Impulse, 10- bis 50-mal pro Sekunde wiederholt, jeder mehrere kHz breit.","l":"Ein breiter gestreifter Block, der ganze Bänder bedeckt; ein sehr regelmäßiges Specht-Klopfen auf Kurzwelle."},"parasites":{"nm":"Störungen","sh":"Netzteil","t":"Störungen eines Schaltnetzteils","h":"Ein Rechtecksignal: seine Frequenz und alle Oberwellen kommen gleichzeitig heraus.","l":"Ein Kamm regelmäßiger Linien, die zusammen driften, auf Rauschgrund: mit NOISE FIND oder einem tragbaren Empfänger suchen (Blatt K21b)."},"mpx":{"nm":"UKW-Stereo und RDS","t":"UKW-Stereo und RDS","h":"Der demodulierte Ton (Multiplex) enthält den L+R-Kanal, einen Pilotton bei 19 kHz, den L-R-Kanal um 38 kHz und RDS bei 57 kHz.","l":"Von 0 bis 60 kHz nach der Demodulation: ein tiefer Block, ein feiner Strich bei 19 kHz, ein schwächerer Block in der Mitte und RDS ganz oben (Blatt 10).","n":"Maßstab ÷ 20 zum Anhören"},"dcf77":{"t":"Zeitsignal DCF77 (77,5 kHz)","h":"Ein Träger, der zu Beginn jeder Sekunde für 0,1 s (Bit 0) oder 0,2 s (Bit 1) auf 15 % absinkt.","l":"Ein fester Strich mit einer schwarzen Lücke jede Sekunde; die 59. Sekunde hat keine, um die Minute zu markieren (Blatt 10).","r":[["Hinweis","Hier liegt der Träger auf 1000 Hz; die 6. Sekunde hat keine Lücke, wie die 59. Sekunde jeder Minute"]]},"ofdm":{"t":"OFDM: Dutzende Unterträger","h":"Viele eng gepackte Träger, jeder langsam: die Summe sieht aus wie Rauschen.","l":"Ein flaches Rechteck mit scharfen Kanten, immer da: DRM auf Kurzwelle (10 kHz), DAB+ (1,5 MHz), DVB-T, WLAN. Ein gleichmäßiges Rauschen im Ohr (Blätter 10 und 22)."},"dsss":{"t":"Spreizspektrum (DSSS): GPS, WLAN 802.11b","h":"Die Daten werden mit einem sehr schnellen Code gemischt: die Energie verteilt sich über eine große Breite.","l":"Ein breiter Buckel, kaum über dem Rauschen; GPS liegt sogar unter dem Rauschen und ist ohne Verarbeitung nicht zu sehen (Blätter 22 und 23)."},"hline":{"nm":"Wasserstofflinie","sh":"1420 MHz","t":"21-cm-Wasserstofflinie (1420,405 MHz)","h":"Kalter Wasserstoff der Milchstraße sendet ein sehr schwaches Rauschen auf 1420,405 MHz. Die Bewegung der Spiralarme verschiebt es durch den Dopplereffekt: man sieht mehrere kleine Buckel.","l":"Im Wasserfall von Sekunde zu Sekunde fast nichts: man muss lange mitteln, bis die Buckel aus dem Rauschen auftauchen. Hier im angehaltenen Zustand das mittlere Spektrum ansehen. Eine Schüssel oder ein Horn, ein Vorverstärker und ein SDR-Stick genügen.","n":"Signal stark übertrieben"},"sun":{"nm":"Sonne","sh":"Bursts","t":"Sonne: Radiobursts vom Typ III","h":"Von einem Flare ausgeschleuderte Elektronen durchqueren die Sonnenkorona und lassen sie immer tiefer senden, je weiter sie sich entfernen.","l":"Striche, die in weniger als einer Sekunde schräg von oben nach unten durch das Spektrum fallen, über solarem Rauschen; ein anschwellendes „schhhh“. Etwa 10 bis 400 MHz, auch auf Kurzwelle um 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter: Dekameter-Bursts (L und S)","h":"Jupiters Magnetfeld und sein Mond Io erzeugen starke Emissionen zwischen 15 und 40 MHz: langsame L-Bursts und sehr kurze S-Bursts, die schnell nach unten gleiten.","l":"Zuerst Rauschwellen (L, wie Brandung), dann Folgen kleiner „Pops“ (S) in engen Diagonalen. Um 20,1 MHz nachts, mit einem einfachen Dipol, wenn Io gut steht."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Ein rotierender Neutronenstern überstreicht die Erde mit einem Radiostrahl, hier alle 0,714 s. Das interstellare Gas verzögert die tiefen Frequenzen: jeder Impuls kommt zuerst oben im Spektrum an.","l":"Ein regelmäßiges „Tick“; im Wasserfall ist jeder Impuls eine abfallende Kurve (Dispersion). Das echte Signal liegt unter dem Rauschen: man braucht eine große Antenne und muss die Impulse über ihre Periode aufaddieren.","n":"Signal stark übertrieben"},"meteor":{"nm":"Meteore","sh":"GRAVES","t":"Meteorechos vom GRAVES-Radar (143,050 MHz)","h":"Das französische GRAVES-Radar sendet ununterbrochen auf 143,050 MHz. Ionisiert eine Sternschnuppe die Luft, wirft ihre Spur etwas von diesem Signal zu deinem Empfänger, für Sekundenbruchteile bis einige Sekunden.","l":"In USB auf 143,049 MHz: kurze „Pings“ um 1000 Hz, manchmal ein gleitendes Echo (der Meteorkopf, Dopplereffekt) oder ein lang anhaltendes. Viel mehr während der Schauer (Perseiden, Geminiden) (Blatt 1)."},"whistler":{"nm":"Whistler","sh":"VLF","t":"VLF-Whistler (Pfeiftöne)","h":"Ein Blitz erzeugt einen Radioknack; ein Teil folgt den Feldlinien des Erdmagnetfelds bis zur anderen Halbkugel und zurück, die hohen Töne zuerst.","l":"Ein „Tjiuuu“, das in ein bis zwei Sekunden von hoch nach tief fällt, direkt nach einem Knack; überall Knistern (Sferics). Unter 10 kHz, mit einem VLF-Empfänger fern von Stromleitungen."},"chorus":{"nm":"Morgenchor","sh":"VLF","t":"Morgenchor (Dawn Chorus)","h":"Bei einem Magnetsturm senden in der Magnetosphäre gefangene Elektronen kleine aufsteigende Töne, vor allem bei Sonnenaufgang.","l":"Sich überlagernde, aufsteigende Zwitschertöne wie Vögel, etwa 1 bis 4 kHz. Gleiche Ausrüstung wie für Whistler."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"Der erste künstliche Satellit sendete drei Wochen lang Pieptöne von etwa 0,3 s abwechselnd auf 20,005 und 40,002 MHz.","l":"Ein regelmäßig unterbrochener Strich: „Piep… Piep…“, der Klang, dem im Oktober 1957 die ganze Welt lauschte (Nachbildung)."},"doppler":{"nm":"Dopplereffekt","sh":"Satellit","t":"Satellitenbake und Dopplereffekt","h":"Ein Satellit in niedriger Bahn nähert sich und entfernt sich wieder: die Empfangsfrequenz sinkt während des Überflugs, um etwa ±3 kHz bei 145 MHz und ±10 kHz bei 435 MHz.","l":"Ein S-förmig abfallender Strich: erst langsam, schnell beim nächsten Punkt, dann wieder langsam (Blatt 34).","n":"10-min-Überflug auf 12 s verkürzt"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA-Satelliten: APT-Bilder (historisch)","h":"Ein 2400-Hz-Hilfsträger, vom Bild amplitudenmoduliert, zwei Zeilen pro Sekunde, mit einem Synchronimpuls am Anfang jeder Zeile. 2025 abgeschaltet; heute senden die Meteor-M-Satelliten LRPT.","l":"Ein Strich bei 2400 Hz mit Seitenbändern, die sich mit dem Bild ändern, und das berühmte „Tick-Tack“ zweimal pro Sekunde (Blatt 34)."},"eme":{"nm":"Mondecho","sh":"EME","t":"Mondecho (EME)","h":"Ein zum Mond gesendetes Signal kommt etwa 2,5 s später zurück, enorm geschwächt, etwas verbreitert und durch Doppler verschoben.","l":"Man hört das eigene „Piep“ und 2,5 s später sein schwaches, leicht verwaschenes Echo. Funkamateure machen das in CW oder JT65, ab 144 MHz (Blatt 1).","n":"Echo stark übertrieben"},"msk144":{"nm":"MSK144","sh":"Meteore","t":"MSK144: die Digitalbetriebsart für Meteorscatter","h":"Zwei Töne, 1000 und 2000 Hz, mit 2000 Baud, in Rahmen von 72 ms ohne Pause wiederholt: jede Meteorspur lässt einige davon durch.","l":"Pakete von 0,1 bis 1 s, etwa 2,4 kHz breit, die mit dem „Ping“ des Meteors erscheinen und verlöschen. Auf 50 und 144 MHz, mit WSJT-X."},"jt65":{"nm":"JT65","sh":"65 Töne","t":"JT65: 65 Töne, sehr langsam","h":"Ein Synchronton und 64 Datentöne im Abstand von 2,7 Hz (JT65A), 0,37 s pro Symbol, 47 s Sendung pro Minute.","l":"Eine Leiter kleiner Striche über etwa 180 Hz, mit einem Synchronstrich, der immer an dieselbe Stelle zurückkehrt. Für Mondreflexion (JT65B und C) und sehr schwache Signale.","n":"Auszug von 20 s (eine Sendung dauert 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: professioneller Digitalfunk","h":"Phasenmodulation π/4-DQPSK mit 18 000 Symbolen pro Sekunde, vier Zeitschlitze, in 25-kHz-Kanälen.","l":"Ein voller Block mit runden Flanken, nahe einer Basisstation ständig da; ein raues Rauschen. Verschlüsselt: nicht abhörbar (Blatt 38).","n":"verkleinert"},"ndb":{"nm":"NDB-Funkfeuer","sh":"190–535 kHz","t":"NDB: ungerichtetes Funkfeuer","h":"Ein fester Träger auf Langwelle mit einer Morsekennung aus zwei oder drei Buchstaben, auf einem Ton gesendet (oft 1020 Hz).","l":"Ein fester Strich in der Mitte und während der Kennung zwei kleine Striche links und rechts. Etwa 190 bis 535 kHz, in SSB oder CW (Blatt 10)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: UKW-Drehfunkfeuer","h":"In AM: ein richtungsabhängiges 30-Hz-Signal, ein mit 30 Hz frequenzmodulierter 9960-Hz-Hilfsträger (die Referenz) und die Morsekennung auf 1020 Hz.","l":"Im demodulierten Ton: ein tiefes 30-Hz-Brummen, ein breiter, welliger Strich um 10 kHz und ab und zu die Kennung (Blatt 15).","n":"demodulierter Ton, Maßstab ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: Landeführung (Localizer)","h":"In AM zwei Töne von 90 und 150 Hz; ihr Verhältnis sagt dem Flugzeug, ob es links oder rechts der Achse ist. Die Morsekennung beginnt mit I.","l":"Im demodulierten Ton: zwei sehr tiefe Striche bei 90 und 150 Hz und die Kennung auf 1020 Hz. Zwischen 108,1 und 112 MHz; der Gleitweg liegt um 330 MHz (Blatt 15)."},"m10":{"nm":"Sonden M10 / M20","sh":"Meteomodem","t":"Radiosonden M10 und M20 (Meteomodem)","h":"Ein Rahmen pro Sekunde in schneller FSK (etwa 9600 Baud): breiter als die RS41. In Frankreich von Météo-France gestartet.","l":"Jede Sekunde ein breites Paket, das während des Flugs langsam driftet; zwischen 400 und 406 MHz (Blatt 18)."},"tpms":{"nm":"Reifen (TPMS)","sh":"433 MHz","t":"Reifendrucksensoren (TPMS)","h":"Jedes Rad sendet ab und zu ein FSK-Paket von einigen Millisekunden: Druck, Temperatur, Kennung.","l":"Kleine einzelne Pakete auf 433,92 MHz (oder 315 MHz), oft paarweise, wenn ein Auto vorbeifährt. Von rtl_433 dekodiert."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Zeitsignal ALS162 (Allouis, 162 kHz)","h":"Der Träger der früheren Langwelle von France Inter; die Zeit ist in kleinen, unhörbaren Phasenmodulationen codiert.","l":"Ein fester Strich, in Frankreich sehr stark, am Anfang jeder Sekunde kaum verbreitert; zum Lesen der Zeit braucht man einen Dekoder (Blatt 10)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Zeitsignal WWV (Colorado)","h":"In AM: jede Sekunde ein 5-ms-„Tick“ auf 1000 Hz, ein 500- oder 600-Hz-Ton, ein Zeitcode auf 100 Hz und eine Stimme, die UTC ansagt.","l":"Im demodulierten Ton: ein 500-Hz-Strich, jede Sekunde unterbrochen, der Tick auf 1000 Hz und ganz unten der Code auf 100 Hz (Blatt 10)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Zeitsignal MSF (Anthorn, 60 kHz)","h":"Der Träger wird am Anfang jeder Sekunde je nach Bits für 0,1, 0,2 oder 0,3 s abgeschaltet, und für 0,5 s zur Minutenmarke.","l":"Ein fester Strich mit vollständig schwarzen Lücken jede Sekunde, länger als bei DCF77 (Blatt 10)."},"type2":{"nm":"Sonne Typ II","sh":"Stoßwelle","t":"Sonne: Radiobursts vom Typ II","h":"Die Stoßwelle eines koronalen Massenauswurfs lässt das Plasma langsam immer tiefer senden, oft in zwei Bändern (Grundwelle und Doppeltes).","l":"Zwei parallele Rauschbänder, die über mehrere Minuten sanft nach unten wandern. Zum Vergleich: Typ-III-Bursts sind viel schneller.","n":"mehrere Minuten auf 6 s verkürzt"},"tweeks":{"nm":"Tweeks","sh":"VLF","t":"Tweeks: die nächtlichen VLF-„Pings“","h":"Nachts prallt der Knack eines fernen Blitzes zwischen Boden und Ionosphäre hin und her; Frequenzen nahe der Grenzfrequenz (um 1,7 kHz) kommen zuletzt an.","l":"Ein kleines „Ping“, das abfällt und um 1,7 kHz endet, manchmal mit einem Echo bei der doppelten Frequenz; überall Knistern. Unter 10 kHz, nachts."},"hiss":{"nm":"VLF-Rauschen","sh":"Hiss","t":"VLF-Rauschen (Hiss)","h":"Ein breites Rauschen der Elektronen in der Plasmasphäre, das mit der magnetischen Aktivität steigt und fällt.","l":"Ein Rauschband von einigen hundert Hz bis einigen kHz, ohne Muster, das langsam anschwillt und abklingt."},"aurora":{"nm":"Radio-Aurora","sh":"Au","t":"Aurora-Ausbreitung (Au)","h":"Ein Polarlicht reflektiert UKW-Wellen, schüttelt sie aber sehr schnell: jedes Signal wird über einige hundert Hz verteilt.","l":"CW wird zu einem rauen, wie geflüsterten Rauschen; man hört keinen Ton mehr. Auf 50 und 144 MHz, Richtung Norden bei Magnetstürmen."},"galactic":{"nm":"Galaktisches Rauschen","sh":"20–40 MHz","t":"Rauschen der Milchstraße","h":"Das Zentrum der Galaxis sendet ein Radiorauschen, das Karl Jansky 1932 um 20 MHz entdeckte. Es steigt und fällt mit der Erddrehung.","l":"Ein Grundrauschen, das langsam steigt und wieder fällt, jeden Tag etwa 4 Minuten früher. Mit einem einfachen Dipol zwischen 20 und 40 MHz sichtbar.","n":"ein Tag auf 12 s verkürzt"},"cubesat":{"nm":"CubeSat","sh":"9600 Bd","t":"CubeSat-Telemetrie","h":"Kleinsatelliten senden regelmäßig ihre Messwerte (Batterie, Temperaturen) in FSK oder GMSK mit 1200 oder 9600 Baud um 435–438 MHz.","l":"Regelmäßige Pakete, die während des Überflugs durch den Dopplereffekt jedes Mal etwas tiefer liegen (Blatt 34).","n":"verkleinert, Überflug beschleunigt"},"issfm":{"nm":"ISS in FM","sh":"145,800 MHz","t":"Raumstation (ISS): Sprache in FM","h":"Astronauten sprechen mit Schulen und Funkamateuren in FM auf 145,800 MHz. Die Station fliegt mit 28 000 km/h: die Empfangsfrequenz sinkt während des Überflugs um etwa 3,5 kHz.","l":"Ein FM-Sprachband, das während des 10-minütigen Überflugs langsam von rechts nach links wandert (Blatt 34).","n":"10-min-Überflug auf 10 s verkürzt"},"buzzer":{"nm":"UVB-76 „The Buzzer“","sh":"4625 kHz","t":"UVB-76, „The Buzzer“ (4625 kHz)","h":"Ein russischer Militärsender, der seit Jahrzehnten ein etwa einsekündiges Summen sendet, etwa 25-mal pro Minute, manchmal unterbrochen von einer Sprachnachricht.","l":"Ein fester Träger und bei jedem Summen eine Säule dichter Linien von oben nach unten. Leicht auf 4625 kHz in USB zu finden."},"pip":{"nm":"„The Pip“","sh":"3756 / 5448 kHz","t":"„The Pip“: endlose Pieptöne","h":"Eine weitere russische Militärbake auf Kurzwelle, die Tag und Nacht kurze Pieptöne wiederholt, manchmal von Nachrichten unterbrochen.","l":"Ein fester Strich, in sehr dichte Punkte zerhackt; im Ohr ein schnelles Pip-pip-pip ohne Ende.","n":"Rhythmus angenähert"},"squeaky":{"nm":"„Squeaky Wheel“","sh":"KW","t":"„Squeaky Wheel“: das quietschende Rad","h":"Eine russische Militärbake auf Kurzwelle, von Hörern nach ihrem wiederholten Klangmuster benannt.","l":"Ein kleines Muster aus zwei Tönen, einer davon steigend, in Schleife wiederholt: wie ein quietschendes Rad.","n":"angenäherte Nachahmung"},"codar":{"nm":"CODAR","sh":"Meeresradar","t":"CODAR: Radare für Meeresströmungen","h":"Küstenradare überstreichen ein- oder zweimal pro Sekunde ein Frequenzband, um Strömungen und Wellen zu messen.","l":"Regelmäßige parallele Diagonalen und ein wiederholtes „Swish“; um 4,5–5,5 MHz, 13 MHz und 25 MHz, oft Tag und Nacht.","n":"verkleinert"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Militärmodem STANAG 4285","h":"8-PSK-Phasenmodulation mit 2400 Baud auf einem 1800-Hz-Träger, mit einer Testsequenz alle 107 ms zur Kanalverfolgung.","l":"Ein voller Block von etwa 3 kHz; im Ohr ein Rauschen mit regelmäßigem Summen (Blatt 35 bis)."},"link11":{"nm":"Link-11","sh":"16 Töne","t":"Link-11: Marine-Datenverbindung","h":"Sechzehn Töne von 605 bis 2915 Hz gleichzeitig, jeder 75-mal pro Sekunde phasenmoduliert.","l":"Ein Kamm regelmäßiger Linien über 2,3 kHz, dazu eine etwas abseits liegende Linie; im Ohr ein musikalisches Brummen (Blatt 35 bis)."},"numbers":{"nm":"Zahlensender","sh":"Stimme","t":"Zahlensender","h":"Zu fester Zeit eine kurze Erkennungsmelodie, dann liest eine (oft synthetische) Stimme Gruppen von fünf Ziffern, in AM oder SSB.","l":"Die Melodie als einzelne Töne, dann regelmäßige Silbengruppen mit Pausen dazwischen (Blatt 35 bis).","n":"nachgeahmte Stimme, keine echten Ziffern"}}},"nl":{"ui":{"title":"Radiomodus-herkenner","mystery":"Mysteriegeluid","play":"▶ Luisteren","stop":"■ Stop","noise":"Ruis","volume":"Volume","loop":"Herhalen","specwf":"Spectrum + Waterval","cursor":"cursor","footprint":"Afdruk","dur":"{s} s van boven naar beneden","avg":"gemiddelde over het hele signaal","press":"Druk op Luisteren: het signaal loopt hier voorbij","count":"{n} signalen, in de volgorde van blad 5 bis","myst":"Mysteriemodus","mystTags":"Luister en kijk, kies dan het juiste antwoord","quizH":"Welk signaal is dit?","quizLead":"Start het geluid, bekijk het spectrum, de waterval en de afdruk, en antwoord.","score":"Score","good":"Goed!","bad":"Mis: het was {x}.","next":"Volgend mysteriegeluid","principle":"Principe","screen":"Op het scherm","sheet":"blad","book":"Boek: blad {r}","lang":"Taal","signals":"Signalen","f1":"Signalen gesimuleerd in de pagina (12 000 samples per seconde), naar de signalen van blad 5 bis van het boek OpenBookRadio, plus Olivia, FT4 en Feld Hell (blad 26). Bij radiosignalen (AM, FM, AIS, LoRa…) zie je de gesimuleerde middenfrequentie, zoals op een SDR-scherm; sommige zijn verkleind of versneld, dat staat erbij.","f2":"De tijd loopt naar beneden in de waterval en de afdruk. Licentie CC BY-NC-SA 4.0, gratis, niet verkopen.","night":"Nachtmodus","day":"Dagmodus"},"groups":["Analoge spraak","Telegrafie","Data","Beelden","Luchtvaart, scheepvaart en redding","Oproep, subtonen en paging","Radiosondes, sensoren en verbonden apparaten","HF-modi en curiosa","Omroep en tijd","Breedband","Bonus: geluiden uit de ruimte","Bonus: curiosa op kortegolf"],"modes":{"am":{"sh":"spraak","t":"AM: amplitudemodulatie","h":"De sterkte van de draaggolf volgt het geluid: de curve „zwelt” op en af.","l":"Een vaste streep in het midden (de draaggolf), met aan elke kant een gelijke zijband. Ongeveer 6 tot 9 kHz breed. Omroep op korte en middengolf, luchtvaart (bladen 10 en 12)."},"ssb":{"nm":"SSB","t":"SSB: enkelzijband","h":"Er blijft maar één zijband over, zonder draaggolf: niets als er niet gesproken wordt.","l":"Geen middenstreep, één band van ongeveer 2,7 kHz die alleen leeft als er gesproken wordt. USB boven 10 MHz, LSB eronder (zendamateurs). Slecht afgestemd klinkt de stem als een „eend” (bladen 9 en 26)."},"fm":{"sh":"spraak","t":"FM: frequentiemodulatie","h":"De amplitude blijft gelijk; de trillingen komen met het geluid dichter bij elkaar of verder uiteen.","l":"Het signaal danst rond zijn frequentie, breder bij luid geluid: 12,5 kHz per kanaal bij smalband-FM (portofoons, relais), 200 kHz bij FM-omroep (bladen 2 en 11)."},"cw":{"t":"CW: morse","h":"De draaggolf gaat aan en uit: strepen en punten.","l":"Een heel dunne streep die in het ritme van morse onderbroken wordt; een piep in het oor. Hier „CQ” (blad 39).","r":[["Snelheid","20 woorden/min, punt van 60 ms, op 700 Hz: „CQ CQ CQ DE F4ABC K”"],["Op het gehoor","Zuivere piepjes, lang en kort, op één toon"],["Decoderen","Op het gehoor, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: twee frequenties","h":"De frequentie springt tussen twee waarden, één voor 0, één voor 1.","l":"Twee evenwijdige strepen: 170 Hz uit elkaar bij zendamateurs (45,45 baud), 450 of 850 Hz bij weerberichten. Een regelmatig „tidilidi” (blad 27).","r":[["Code","Baudot ITA2: 5 bits + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Tekst","RYRYRYRY CQ CQ DE F4ABC"],["Decoderen","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 baud: APRS en packet","h":"Twee audiotonen, 1200 en 2200 Hz, in een FM-zender gestuurd.","l":"Gezien na de FM-ontvanger (luidsprekergeluid): een band van 1200 tot 2200 Hz, in korte pakketjes. In het oor een „grrrt” van een seconde (bladen 29 en 30).","r":[["Frequentie","144,800 MHz in Europa (APRS), FM"],["Frame","Vlaggen 0x7E en daarna AX.25-data in NRZI"],["Decoderen","Direwolf, multimon-ng, KISS-TNC"]]},"psk31":{"t":"PSK31: fasemodulatie","h":"De frequentie blijft gelijk, de fase keert om; bij elke omkering zakt de amplitude.","l":"Een heel dunne streep van ongeveer 60 Hz, een beetje „gevlochten”. Tientallen stations passen in 3 kHz (blad 26).","r":[["Code","Varicode: 0 = fase-omkering, 1 = geen verandering; in rust twee tweelingstrepen"],["Waar te horen","14 070 kHz, 3580 kHz"],["Decoderen","fldigi"]]},"ft8":{"t":"MFSK / FT8: acht tonen","h":"De frequentie gaat op en neer in stapjes van 6,25 Hz, 0,16 s per stap.","l":"Banden van ongeveer 50 Hz die 12,6 s duren en elke 15 s terugkomen, op de klok afgestemd: meerdere stations tegelijk in 3 kHz, bijvoorbeeld op 7,074 MHz (blad 26).","r":[["Frame","79 symbolen van 0,16 s, drie Costas-patronen (begin, midden, eind); hier acht stations"],["Frequenties","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Decoderen","WSJT-X, JTDX (exacte pc-klok)"]]},"ft4":{"t":"FT4: de FT8 voor contests","h":"Vier tonen op 20,8 Hz afstand, 20,8 baud: 105 symbolen in 5 s, in tijdvakken van 7,5 s.","l":"Banden van ongeveer 90 Hz, korter en breder dan FT8, die elke 7,5 s terugkomen. 14 080, 7047,5 kHz (blad 26)."},"olivia":{"t":"Olivia 8/250: acht tonen","h":"Acht tonen op 31,25 Hz afstand, steeds één tegelijk, die willekeurig springen; Walsh-codering en interleaving.","l":"Een blok verspreide puntjes over 250 Hz; decodeert ver onder de ruis. Een klein willekeurig melodietje in het oor (blad 26)."},"hell":{"t":"Feld Hell: schrijven met een draaggolf","h":"De draaggolf gaat punt voor punt aan en uit: elke letter bestaat uit kolommen van 14 punten, van onder naar boven afgetast (245 punten per seconde).","l":"In de waterval een gehakte streep; het programmascherm (fldigi) tekent de letters. Een zacht geknetter in het oor (blad 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Vier frequentieniveaus: elk symbool draagt twee bits.","l":"Een rechthoekig blok van 6 tot 12,5 kHz, vol als ruis, vaak in pakketjes (DMR deelt het kanaal in twee tijdsloten). Een schor „frrr” in het oor (blad 38)."},"mt63":{"t":"MT63: noodberichten (NBEMS)","h":"64 tonen tegelijk, elk langzaam gemoduleerd, met veel redundantie.","l":"Een vlak blok van 1 of 2 kHz rond 1500 Hz, met scherpe randen; een regelmatig geruis. Werkt zelfs via een microfoon tegen een luidspreker (blad 26 ter)."},"lora":{"t":"LoRa: frequentiehellingen (chirps)","h":"De frequentie zwiept over de hele breedte en begint dan weer onderaan: de plaats van de sprong draagt de data.","l":"Evenwijdige diagonalen, makkelijk te herkennen: Meshtastic en MeshCore op 869,525 MHz of 433 MHz, LoRaWAN-sensoren (bladen 11, 20 en 21)."},"sstv":{"t":"SSTV: beelden als geluid","h":"Een synchronisatiepuls op 1200 Hz, daarna volgt de frequentie de helderheid van de lijn, van 1500 (zwart) tot 2300 Hz (wit).","l":"Regelmatige synchronisatiestrepen en een wolk die met het beeld verandert; een „tjilpend” geluid gedurende een à twee minuten. 14,230 MHz, ISS op 145,800 MHz (blad 31).","r":[["Frame","VIS-kop, dan lijnen: synchro 1200 Hz, groen, blauw, rood; hier 20 lijnen van een testbeeld"],["Decoderen","QSSTV, MMSSTV, Robot36 op de smartphone"]]},"fax":{"nm":"Weerfax","t":"Weerfax: 1500 Hz zwart, 2300 Hz wit","h":"De frequentie gaat traploos van zwart naar wit, 120 lijnen per minuut.","l":"Twee vaste banden op 1500 en 2300 Hz (800 Hz uit elkaar), een regelmatig „tik-tak”. Gepubliceerde frequenties zijn die van de draaggolf: luister in USB 1,9 kHz lager (blad 32).","r":[["Frame","Starttoon van 300 Hz, faseerlijnen (witte puls), dan de kaart"],["Decoderen","fldigi, JWX, HamFax"]]},"elt":{"nm":"ELT-sirene","t":"ELT- / PLB-sirene op 121,5 MHz","h":"Een AM waarvan de toon twee tot vier keer per seconde van 1600 naar 300 Hz daalt.","l":"Een vaste draaggolf en zijbanden die als een waaier glijden: het „oe-oe” van noodbakens, ook op 121,375 MHz voor oefeningen (bladen 24 en 25)."},"406":{"nm":"406-baken","t":"406 MHz-baken: BPSK-salvo","h":"Een halve seconde uitzending: 160 ms zuivere draaggolf, daarna verspringt de fase ±1,1 radiaal met 400 bit/s.","l":"Een kort streepje dat elke 50 s terugkomt, tussen 406,0 en 406,1 MHz; niets nuttigs te horen, je hebt een decoder nodig (EPIRB 406, blad 25)."},"adsb":{"t":"ADS-B / mode S (1090 MHz): pulsen","h":"Pulsen van 0,5 µs waarvan de positie de bits draagt (PPM); hier is de tijdschaal sterk vertraagd.","l":"Heel korte horizontale streepjes over de hele breedte, honderden per seconde bij een luchthaven; een SDR-stick is nodig (blad 13).","n":"tijdschaal sterk vertraagd"},"acars":{"t":"ACARS: AM en MSK-data","h":"Een AM die twee tonen draagt, 1200 en 2400 Hz, met 2400 bit/s.","l":"Salvo's van een halve seconde met draaggolf en zijbanden, op 131,525, 131,725 of 131,825 MHz in Europa: een „brrrt” in het oor (blad 14)."},"ais":{"t":"AIS: GMSK 9600 baud op twee kanalen","h":"Een afgevlakte FSK (GMSK) in salvo's van 26 ms, eens op 161,975 MHz, eens op 162,025 MHz (verkleind).","l":"Twee kolommen korte streepjes, 50 kHz uit elkaar, een regelmatig geklik; hoe meer schepen, hoe dichter (blad 16).","n":"verkleind"},"navtex":{"t":"NAVTEX en DSC op midden- en kortegolf: FSK 170 Hz","h":"Zoals RTTY: twee frequenties op 170 Hz afstand, maar met 100 baud.","l":"Twee evenwijdige strepen, ononderbroken tijdens het bericht, op 518 en 490 kHz (NAVTEX) of 2187,5 kHz (digitale selectieve oproep) (blad 17).","r":[["Code","SITOR-B, CCIR 476: 7 bits met vier „1”, met FEC-herhaling"],["Decoderen","fldigi, YaND"]]},"hfdl":{"t":"HFDL: vliegtuigen op kortegolf","h":"Een PSK van 1800 baud op een hulpdraaggolf van 1440 Hz.","l":"Salvo's van ongeveer 2,4 kHz tussen 2,9 en 22 MHz; een modemgeruis dat komt en gaat (blad 14 bis)."},"ctcss":{"t":"CTCSS: subtoon onder de stem","h":"Een lage, doorlopende toon (67 tot 254 Hz, hier 88,5 Hz) bij de stem gevoegd.","l":"Gezien in het geluid van de FM-ontvanger: een vaste streep helemaal onderaan, onder de stem; hij opent de squelch van relais en portofoons (blad 8)."},"dtmf":{"sh":"2 tonen","t":"DTMF: twee tonen per toets","h":"Elke toets stuurt tegelijk een lage toon (697 tot 941 Hz) en een hoge (1209 tot 1633 Hz).","l":"Paren puntjes op acht vaste kolommen; het „piep-piep” van telefoonnummers en relaiscommando's (blad 8).","r":[["Reeks","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tonen","t":"Selcall CCIR: tonen na elkaar","h":"Vijf tonen van 100 ms na elkaar, één per cijfer.","l":"Een klein trapje van puntjes, herhaald; een snel „tululululu” om één bepaalde radio op te roepen (blad 28).","r":[["Reeks","1 2 3 4 5, twee keer; ook gedecodeerd door de SelCall-app van de UV-K1"]]},"pocsag":{"sh":"pagers","t":"POCSAG en FLEX: pagers","h":"Een FSK op ±4,5 kHz; een preambule 1010… en dan de data (verkleind).","l":"Twee scherpe strepen tijdens de preambule, daarna een volle band; een schel „brrrrt”. 466,075 MHz, DAPNET 439,9875 MHz (blad 37).","n":"verkleind"},"ale":{"sh":"8 tonen","t":"ALE: automatische oproep op kortegolf","h":"Acht tonen van 750 tot 2500 Hz, 125 baud, in salvo's.","l":"Een blok van ongeveer 2 kHz van kleine puntjes, een à twee seconden, soms op meerdere nabije frequenties; een hoog getjilp (blad 28 bis)."},"rs41":{"nm":"Radiosonde RS41","t":"Radiosonde RS41: doorlopende GFSK","h":"Een afgevlakte FSK van 4800 baud, zonder pauze; de frequentie verloopt langzaam als de sonde stijgt en afkoelt.","l":"Een band van ongeveer 10 kHz die tijdens de hele vlucht schuin verschuift, tussen 400 en 406 MHz (blad 18)."},"ook":{"nm":"433-sensoren","t":"433 MHz-sensoren: OOK","h":"De draaggolf gaat aan en uit in korte of lange pulsen (aan-uit); het bericht wordt drie keer herhaald.","l":"Salvo's van kleine puntjes, vaak in drievoud, op 433,92 MHz: weerstations, temperatuursensoren, afstandsbedieningen (blad 19)."},"fhss":{"t":"Bluetooth: frequentiesprongen (FHSS)","h":"De frequentie wisselt 1600 keer per seconde tussen 79 kanalen (verkleind).","l":"Kleine streepjes overal verspreid over 80 MHz, nooit op dezelfde plek, rond 2,4 GHz (blad 22).","n":"verkleind"},"wspr":{"t":"WSPR: propagatiebakens","h":"Vier tonen op 1,46 Hz afstand, 0,68 s per symbool, gedurende 110,6 s.","l":"Een heel dunne streep van ongeveer 6 Hz die bijna twee minuten duurt, elke even twee minuten: je moet sterk inzoomen (blad 26).","n":"fragment van 24 s (een uitzending duurt 110,6 s)"},"qrss":{"t":"QRSS: heel langzame morse","h":"Een draaggolf die aan en uit gaat, met punten van 3 tot 10 s, vaak op twee nabije frequenties (DFCW).","l":"Strepen van enkele Hz breed, gelezen op een scherm van tien minuten; niet hoorbaar (blad 26 bis).","n":"versneld: punt van 0,6 s in plaats van 3 tot 10 s"},"texte":{"nm":"Tekst in de waterval","t":"Tekst in de waterval","h":"Elke lijn van een afbeelding wordt een groep tonen: het geluid lijkt op ruis.","l":"De tekst of tekening verschijnt rechtstreeks op het SDR-scherm (blad 33).","r":[["Opmerking","Vanaf de onderkant van de afbeelding verzonden: rechtop in de live waterval, ondersteboven in de afdruk (van boven naar beneden gelezen)"]]},"vara":{"t":"Moderne HF-data: VARA, Pactor, ARDOP","h":"Lange volle salvo's (OFDM of PSK) en daartussen korte antwoorden van het andere station.","l":"Een rechthoek van ongeveer 2,4 kHz die stopt en opnieuw begint, met een kleine ontvangstbevestiging ertussen; een gehakt geruis (blad 26)."},"chirp":{"nm":"Ionosfeersonde","t":"Ionosfeersonde (chirp sounder)","h":"Een langzame frequentiehelling door de hele HF-band; de echo's van de ionosfeer komen iets later.","l":"Een diagonaal over het scherm, met evenwijdige strepen (de echo's); een „ffuut” dat in een fractie van een seconde voorbijgaat."},"oth":{"nm":"Over-de-horizonradar","t":"Over-de-horizonradar („woodpecker”)","h":"Pulsen die 10 tot 50 keer per seconde herhaald worden, elk enkele kHz breed.","l":"Een breed gestreept blok dat hele banden bedekt; een heel regelmatig specht-getik op kortegolf."},"parasites":{"nm":"Storing","sh":"voeding","t":"Storing van een schakelende voeding","h":"Een blokgolf: de frequentie en alle harmonischen komen tegelijk naar buiten.","l":"Een kam van regelmatige lijnen die samen verschuiven, op een ruisachtergrond: zoek met NOISE FIND of een draagbare ontvanger (blad K21b)."},"mpx":{"nm":"FM-stereo en RDS","t":"FM-stereo en RDS","h":"Het gedemoduleerde geluid (multiplex) bevat het L+R-kanaal, een pilottoon op 19 kHz, het L-R-kanaal rond 38 kHz en RDS op 57 kHz.","l":"Gezien van 0 tot 60 kHz na demodulatie: een laag blok, een dunne streep op 19 kHz, een zwakker blok in het midden en RDS helemaal bovenaan (blad 10).","n":"schaal ÷ 20 om te beluisteren"},"dcf77":{"t":"Tijdsignaal DCF77 (77,5 kHz)","h":"Een draaggolf die aan het begin van elke seconde 0,1 s (bit 0) of 0,2 s (bit 1) tot 15 % daalt.","l":"Een vaste streep met elke seconde een zwart gat; de 59e seconde heeft er geen, om de minuut aan te geven (blad 10).","r":[["Opmerking","Hier ligt de draaggolf op 1000 Hz; de 6e seconde heeft geen gat, net als de 59e seconde van elke minuut"]]},"ofdm":{"t":"OFDM: tientallen subdraaggolven","h":"Veel dicht op elkaar gepakte draaggolven, elk langzaam: de som lijkt op ruis.","l":"Een vlakke rechthoek met scherpe randen, altijd aanwezig: DRM op kortegolf (10 kHz), DAB+ (1,5 MHz), DVB-T, wifi. Een doorlopend geruis in het oor (bladen 10 en 22)."},"dsss":{"t":"Gespreid spectrum (DSSS): gps, wifi 802.11b","h":"De data worden gemengd met een heel snelle code: de energie wordt over een grote breedte verspreid.","l":"Een brede bult, nauwelijks boven de ruis; gps ligt zelfs onder de ruis en is zonder bewerking niet te zien (bladen 22 en 23)."},"hline":{"nm":"Waterstoflijn","sh":"1420 MHz","t":"21 cm-waterstoflijn (1420,405 MHz)","h":"Koud waterstof in de Melkweg zendt een heel zwak geruis uit op 1420,405 MHz. De beweging van de spiraalarmen verschuift het door het dopplereffect: je ziet een paar kleine bulten.","l":"Bijna niets in de waterval van seconde tot seconde: je moet lang middelen om de bulten uit de ruis te zien komen. Kijk hier naar het gemiddelde spectrum in stilstand. Een schotel of hoorn, een voorversterker en een SDR-stick volstaan.","n":"signaal sterk overdreven"},"sun":{"nm":"Zon","sh":"uitbarstingen","t":"Zon: radio-uitbarstingen van type III","h":"Elektronen die door een zonnevlam worden weggeslingerd, gaan door de corona en laten die steeds lager in frequentie zenden naarmate ze verder komen.","l":"Strepen die in minder dan een seconde schuin van boven naar beneden door het spectrum vallen, op een achtergrond van zonneruis; een aanzwellend „sjhhh”. Ongeveer 10 tot 400 MHz, ook op kortegolf rond 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter: decameter-uitbarstingen (L en S)","h":"Het magneetveld van Jupiter en zijn maan Io zorgen voor sterke emissies tussen 15 en 40 MHz: trage L-uitbarstingen en heel korte S-uitbarstingen die snel naar beneden glijden.","l":"Eerst golven van geruis (L, zoals de branding), daarna reeksen kleine „pops” (S) in dichte diagonalen. Rond 20,1 MHz 's nachts, met een eenvoudige dipool, als Io goed staat."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Een draaiende neutronenster veegt met een radiobundel over de aarde, hier elke 0,714 s. Interstellair gas vertraagt de lage frequenties: elke puls komt eerst bovenaan het spectrum aan.","l":"Een regelmatig „tik”; in de waterval is elke puls een dalende curve (dispersie). Het echte signaal zit onder de ruis: je hebt een grote antenne nodig en moet de pulsen over hun periode optellen.","n":"signaal sterk overdreven"},"meteor":{"nm":"Meteoren","sh":"GRAVES","t":"Meteorecho's van de GRAVES-radar (143,050 MHz)","h":"De Franse GRAVES-radar zendt onophoudelijk op 143,050 MHz. Als een vallende ster de lucht ioniseert, kaatst het spoor wat van dat signaal naar je ontvanger, een fractie van een seconde tot enkele seconden.","l":"In USB op 143,049 MHz: korte „pings” rond 1000 Hz, soms een echo die glijdt (de kop van de meteoor, dopplereffect) of die blijft hangen. Veel meer tijdens zwermen (Perseïden, Geminiden) (blad 1)."},"whistler":{"nm":"Fluittonen","sh":"VLF","t":"VLF-fluittonen (whistlers)","h":"Bliksem geeft een radioklik; een deel volgt de veldlijnen van het aardmagnetisch veld naar het andere halfrond en terug, de hoge tonen eerst.","l":"Een „tjiuuu” dat in een à twee seconden van hoog naar laag zakt, vlak na een klik; overal gekraak (sferics). Onder 10 kHz, met een VLF-ontvanger ver van hoogspanningslijnen."},"chorus":{"nm":"Ochtendkoor","sh":"VLF","t":"Ochtendkoor (dawn chorus)","h":"Tijdens een magnetische storm zenden in de magnetosfeer gevangen elektronen kleine stijgende tonen uit, vooral rond zonsopgang.","l":"Stijgende, overlappende kwetteringen, zoals vogels, van ongeveer 1 tot 4 kHz. Dezelfde apparatuur als voor fluittonen."},"sputnik":{"nm":"Spoetnik 1","sh":"1957","t":"Spoetnik 1 (1957)","h":"De eerste kunstmaan zond drie weken lang piepjes van ongeveer 0,3 s uit, afwisselend op 20,005 en 40,002 MHz.","l":"Een regelmatig onderbroken streep: „piep… piep…”, het geluid waar de hele wereld in oktober 1957 naar luisterde (reconstructie)."},"doppler":{"nm":"Dopplereffect","sh":"satelliet","t":"Satellietbaken en dopplereffect","h":"Een satelliet in een lage baan komt dichterbij en gaat weer weg: de ontvangen frequentie daalt tijdens de overgang, ongeveer ±3 kHz op 145 MHz en ±10 kHz op 435 MHz.","l":"Een streep die in een S-vorm daalt: eerst langzaam, snel als de satelliet het dichtst bij is, dan weer langzaam (blad 34).","n":"overgang van 10 min ingekort tot 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA-satellieten: APT-beelden (historisch)","h":"Een hulpdraaggolf van 2400 Hz, in amplitude gemoduleerd door het beeld, twee lijnen per seconde, met een synchronisatiepuls aan het begin van elke lijn. Gestopt in 2025; de Meteor-M-satellieten zenden nu LRPT.","l":"Een streep op 2400 Hz met zijbanden die met het beeld veranderen, en het bekende „tik-tak” twee keer per seconde (blad 34)."},"eme":{"nm":"Maanecho","sh":"EME","t":"Maanecho (EME)","h":"Een signaal naar de maan komt ongeveer 2,5 s later terug, enorm verzwakt, iets verbreed en verschoven door doppler.","l":"Je hoort je eigen „piep” en 2,5 s later de zwakke, wat vage echo. Zendamateurs doen dit in CW of JT65, vanaf 144 MHz (blad 1).","n":"echo sterk overdreven"},"msk144":{"nm":"MSK144","sh":"meteoren","t":"MSK144: de digitale modus voor meteoorscatter","h":"Twee tonen, 1000 en 2000 Hz, met 2000 baud, in frames van 72 ms die zonder pauze herhaald worden: elk meteoorspoor laat er een paar door.","l":"Salvo's van 0,1 tot 1 s, ongeveer 2,4 kHz breed, die met de „ping” van de meteoor opduiken en uitdoven. Op 50 en 144 MHz, met WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tonen","t":"JT65: 65 tonen, heel traag","h":"Eén synchronisatietoon en 64 datatonen op 2,7 Hz afstand (JT65A), 0,37 s per symbool, 47 s uitzending per minuut.","l":"Een ladder van streepjes over ongeveer 180 Hz, met een synchronisatiestreep die steeds op dezelfde plek terugkomt. Gebruikt voor maanreflectie (JT65B en C) en heel zwakke signalen.","n":"fragment van 20 s (een uitzending duurt 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: professioneel digitaal netwerk","h":"Fasemodulatie π/4-DQPSK met 18 000 symbolen per seconde, vier tijdsloten, in kanalen van 25 kHz.","l":"Een vol blok met afgeronde flanken, altijd aanwezig bij een basisstation; een schor geruis. Versleuteld: niet te beluisteren (blad 38).","n":"verkleind"},"ndb":{"nm":"NDB-baken","sh":"190–535 kHz","t":"NDB: niet-gericht radiobaken","h":"Een vaste draaggolf op langegolf, met een morseroepnaam van twee of drie letters op een toon (vaak 1020 Hz).","l":"Een vaste streep in het midden en tijdens de roepnaam twee streepjes aan weerszijden. Ongeveer 190 tot 535 kHz, in SSB of CW (blad 10)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: omnidirectioneel radiobaken","h":"In AM: een richtingsafhankelijk signaal van 30 Hz, een hulpdraaggolf van 9960 Hz die met 30 Hz in frequentie gemoduleerd is (de referentie), en de morseroepnaam op 1020 Hz.","l":"In het gedemoduleerde geluid: een laag gebrom op 30 Hz, een brede golvende streep rond 10 kHz en af en toe de roepnaam (blad 15).","n":"gedemoduleerd geluid, schaal ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: landingsgeleiding (localizer)","h":"In AM twee tonen van 90 en 150 Hz; hun verhouding vertelt het vliegtuig of het links of rechts van de as zit. De morseroepnaam begint met I.","l":"In het gedemoduleerde geluid: twee heel lage strepen op 90 en 150 Hz en de roepnaam op 1020 Hz. Tussen 108,1 en 112 MHz; het glijpad zit rond 330 MHz (blad 15)."},"m10":{"nm":"Sondes M10 / M20","sh":"Meteomodem","t":"Radiosondes M10 en M20 (Meteomodem)","h":"Eén frame per seconde in snelle FSK (ongeveer 9600 baud): breder dan de RS41. In Frankrijk opgelaten door Météo-France.","l":"Elke seconde een breed salvo dat tijdens de vlucht langzaam verschuift; tussen 400 en 406 MHz (blad 18)."},"tpms":{"nm":"Banden (TPMS)","sh":"433 MHz","t":"Bandenspanningssensoren (TPMS)","h":"Elk wiel zendt af en toe een FSK-salvo van enkele milliseconden: druk, temperatuur, identificatie.","l":"Kleine losse salvo's op 433,92 MHz (of 315 MHz), vaak per twee, als er een auto voorbijrijdt. Gedecodeerd door rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Tijdsignaal ALS162 (Allouis, 162 kHz)","h":"De draaggolf van de vroegere langegolfzender van France Inter; de tijd is gecodeerd met kleine, onhoorbare fasemodulaties.","l":"Een vaste streep, heel sterk in Frankrijk, aan het begin van elke seconde nauwelijks verbreed; je hebt een decoder nodig om de tijd te lezen (blad 10)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Tijdsignaal WWV (Colorado)","h":"In AM: elke seconde een „tik” van 5 ms op 1000 Hz, een toon van 500 of 600 Hz, een tijdcode op 100 Hz en een stem die UTC aankondigt.","l":"In het gedemoduleerde geluid: een streep op 500 Hz die elke seconde onderbroken wordt, de tik op 1000 Hz en de code helemaal onderaan op 100 Hz (blad 10)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Tijdsignaal MSF (Anthorn, 60 kHz)","h":"De draaggolf wordt aan het begin van elke seconde 0,1, 0,2 of 0,3 s uitgezet, afhankelijk van de bits, en 0,5 s om de minuut aan te geven.","l":"Een vaste streep met elke seconde volledig zwarte gaten, langer dan bij DCF77 (blad 10)."},"type2":{"nm":"Zon type II","sh":"schokgolf","t":"Zon: radio-uitbarstingen van type II","h":"De schokgolf van een coronale massa-ejectie laat het plasma langzaam steeds lager zenden, vaak in twee banden (de grondtoon en het dubbele).","l":"Twee evenwijdige ruisbanden die enkele minuten lang rustig dalen. Vergelijk met type III, dat veel sneller is.","n":"enkele minuten ingekort tot 6 s"},"tweeks":{"nm":"Tweeks","sh":"VLF","t":"Tweeks: de nachtelijke VLF-„pings”","h":"'s Nachts kaatst de klik van een verre bliksem tussen aarde en ionosfeer heen en weer; frequenties bij de afsnijgrens (rond 1,7 kHz) komen het laatst aan.","l":"Een kleine „ping” die daalt en rond 1,7 kHz stopt, soms met een echo op het dubbele; overal gekraak. Onder 10 kHz, 's nachts."},"hiss":{"nm":"VLF-ruis","sh":"hiss","t":"VLF-ruis (hiss)","h":"Brede ruis van elektronen in de plasmasfeer, die stijgt en daalt met de magnetische activiteit.","l":"Een band van ruis van enkele honderden Hz tot enkele kHz, zonder patroon, die langzaam aanzwelt en wegzakt."},"aurora":{"nm":"Radio-aurora","sh":"Au","t":"Aurorapropagatie (Au)","h":"Het noorderlicht weerkaatst VHF-golven maar schudt ze heel snel door elkaar: elk signaal wordt over enkele honderden Hz uitgesmeerd.","l":"CW wordt een schurend, als gefluisterd geruis; je hoort geen toon meer. Op 50 en 144 MHz, naar het noorden gericht tijdens magnetische stormen."},"galactic":{"nm":"Galactische ruis","sh":"20–40 MHz","t":"Ruis van de Melkweg","h":"Het centrum van de Melkweg zendt een radiogeruis uit dat Karl Jansky in 1932 rond 20 MHz ontdekte. Het stijgt en daalt met de draaiing van de aarde.","l":"Een achtergrondruis die langzaam stijgt en weer daalt, elke dag ongeveer 4 minuten vroeger. Zichtbaar met een eenvoudige dipool tussen 20 en 40 MHz.","n":"een dag ingekort tot 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"CubeSat-telemetrie","h":"Kleine satellieten zenden regelmatig hun metingen (batterij, temperaturen) in FSK of GMSK met 1200 of 9600 baud, rond 435–438 MHz.","l":"Regelmatige salvo's die tijdens de overgang door het dopplereffect telkens wat lager liggen (blad 34).","n":"verkleind, overgang versneld"},"issfm":{"nm":"ISS in FM","sh":"145,800 MHz","t":"Ruimtestation (ISS): spraak in FM","h":"Astronauten praten met scholen en zendamateurs in FM op 145,800 MHz. Het station vliegt 28 000 km/u: de ontvangen frequentie daalt tijdens de overgang met ongeveer 3,5 kHz.","l":"Een band FM-spraak die tijdens de overgang van 10 minuten langzaam van rechts naar links schuift (blad 34).","n":"overgang van 10 min ingekort tot 10 s"},"buzzer":{"nm":"UVB-76 „The Buzzer”","sh":"4625 kHz","t":"UVB-76, „The Buzzer” (4625 kHz)","h":"Een Russische militaire zender die al tientallen jaren een gezoem van ongeveer een seconde uitzendt, zo'n 25 keer per minuut, soms onderbroken door een gesproken bericht.","l":"Een vaste draaggolf en bij elk gezoem een kolom dichte lijnen van boven naar beneden. Makkelijk te vinden op 4625 kHz in USB."},"pip":{"nm":"„The Pip”","sh":"3756 / 5448 kHz","t":"„The Pip”: eindeloze piepjes","h":"Nog een Russisch militair kortegolfbaken, dat dag en nacht korte piepjes herhaalt, soms onderbroken door berichten.","l":"Een vaste streep die in heel dichte puntjes gehakt is; in het oor een snel pip-pip-pip dat nooit stopt.","n":"ritme benaderd"},"squeaky":{"nm":"„Squeaky Wheel”","sh":"KG","t":"„Squeaky Wheel”: het piepende wiel","h":"Een Russisch militair kortegolfbaken, door luisteraars genoemd naar zijn herhaalde klankpatroon.","l":"Een klein patroon van twee klanken, waarvan één stijgt, in een lus herhaald: als een piepend wiel.","n":"benaderde nabootsing"},"codar":{"nm":"CODAR","sh":"zeeradar","t":"CODAR: radars voor zeestromingen","h":"Kustradars zwiepen een- of tweemaal per seconde over een frequentieband om stromingen en golven te meten.","l":"Regelmatige evenwijdige diagonalen en een herhaald „swish”; rond 4,5–5,5 MHz, 13 MHz en 25 MHz, vaak dag en nacht.","n":"verkleind"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Militaire modem STANAG 4285","h":"8-PSK-fasemodulatie met 2400 baud op een draaggolf van 1800 Hz, met elke 107 ms een testreeks om het kanaal te volgen.","l":"Een vol blok van ongeveer 3 kHz; in het oor een geruis met een regelmatig gezoem (blad 35 bis)."},"link11":{"nm":"Link-11","sh":"16 tonen","t":"Link-11: datalink van de marine","h":"Zestien tonen van 605 tot 2915 Hz tegelijk, elk 75 keer per seconde in fase gemoduleerd.","l":"Een kam van regelmatige lijnen over 2,3 kHz, plus één lijn wat apart; in het oor een muzikaal gebrom (blad 35 bis)."},"numbers":{"nm":"Nummerstation","sh":"stem","t":"Nummerstation","h":"Op een vast tijdstip een korte herkenningsmelodie, dan leest een (vaak synthetische) stem groepen van vijf cijfers voor, in AM of SSB.","l":"De melodie als losse noten, dan regelmatige groepen lettergrepen met stiltes ertussen (blad 35 bis).","n":"nagebootste stem, geen echte cijfers"}}},"cs":{"ui":{"title":"Rozpoznávač rádiových druhů provozu","mystery":"Záhadný zvuk","play":"▶ Poslouchat","stop":"■ Stop","noise":"Šum","volume":"Hlasitost","loop":"Opakovat","specwf":"Spektrum + vodopád","cursor":"kurzor","footprint":"Otisk","dur":"{s} s shora dolů","avg":"průměr za celý signál","press":"Stiskni Poslouchat: signál poběží tady","count":"{n} signálů v pořadí listu 5 bis","myst":"Záhadný režim","mystTags":"Poslouchej a dívej se, pak vyber správnou odpověď","quizH":"Který je to signál?","quizLead":"Spusť poslech, sleduj spektrum, vodopád a otisk a odpověz.","score":"Skóre","good":"Správně!","bad":"Vedle: byl to {x}.","next":"Další záhadný zvuk","principle":"Princip","screen":"Na obrazovce","sheet":"list","book":"Kniha: list {r}","lang":"Jazyk","signals":"Signály","f1":"Signály simulované přímo ve stránce (12 000 vzorků za sekundu) podle signálů listu 5 bis knihy OpenBookRadio, navíc Olivia, FT4 a Feld Hell (list 26). U rádiových signálů (AM, FM, AIS, LoRa…) je vidět simulovaný mezifrekvenční kmitočet jako na obrazovce SDR; některé jsou zmenšené nebo zrychlené, je to uvedeno.","f2":"Čas ve vodopádu i v otisku běží dolů. Licence CC BY-NC-SA 4.0, zdarma, neprodávat.","night":"Noční režim","day":"Denní režim"},"groups":["Analogový hlas","Telegrafie","Data","Obrázky","Letectví, námořnictví a záchrana","Volání, subtóny a pagery","Radiosondy, senzory a připojená zařízení","KV druhy provozu a zajímavosti","Vysílání a čas","Široké pásmo","Bonus: zvuky z vesmíru","Bonus: kuriozity krátkých vln"],"modes":{"am":{"sh":"hlas","t":"AM: amplitudová modulace","h":"Síla nosné sleduje zvuk: křivka se „nafukuje“ a „splaskává“.","l":"Pevná čára uprostřed (nosná) a po obou stranách dvě stejná postranní pásma. Šířka asi 6 až 9 kHz. Rozhlas na krátkých a středních vlnách, letectví (listy 10 a 12)."},"ssb":{"t":"SSB: jedno postranní pásmo","h":"Zbude jen jedno postranní pásmo, bez nosné: když nikdo nemluví, není nic.","l":"Žádná středová čára, jediné pásmo asi 2,7 kHz, které žije jen při řeči. USB nad 10 MHz, LSB pod (radioamatéři). Špatně naladěný hlas zní jako „kachna“ (listy 9 a 26)."},"fm":{"sh":"hlas","t":"FM: kmitočtová modulace","h":"Amplituda zůstává stejná; kmity se se zvukem zhušťují nebo řídnou.","l":"Signál tančí kolem svého kmitočtu, při hlasitém zvuku je širší: 12,5 kHz na kanál u úzkopásmové FM (vysílačky, převáděče), 200 kHz u rozhlasu FM (listy 2 a 11)."},"cw":{"t":"CW: Morseova abeceda","h":"Nosná se zapíná a vypíná: čárky a tečky.","l":"Velmi tenká čára přerušovaná v rytmu morseovky; pípání v uchu. Zde „CQ“ (list 39).","r":[["Rychlost","20 slov/min, tečka 60 ms, na 700 Hz: „CQ CQ CQ DE F4ABC K“"],["Sluchem","Čistá pípnutí, dlouhá a krátká, jediný tón"],["Dekódování","Sluchem, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: dva kmitočty","h":"Kmitočet skáče mezi dvěma hodnotami, jednou pro 0, druhou pro 1.","l":"Dvě rovnoběžné čáry: 170 Hz od sebe u radioamatérů (45,45 Bd), 450 nebo 850 Hz u meteozpráv. Pravidelné „tidilidi“ (list 27).","r":[["Kód","Baudot ITA2: 5 bitů + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Text","RYRYRYRY CQ CQ DE F4ABC"],["Dekódování","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 Bd: APRS a packet","h":"Dva zvukové tóny, 1200 a 2200 Hz, přivedené do FM vysílače.","l":"Za FM přijímačem (zvuk z reproduktoru): pásmo od 1200 do 2200 Hz v krátkých dávkách. V uchu sekundové „grrrt“ (listy 29 a 30).","r":[["Kmitočet","144,800 MHz v Evropě (APRS), FM"],["Rámec","Příznaky 0x7E, pak data AX.25 v NRZI"],["Dekódování","Direwolf, multimon-ng, KISS TNC"]]},"psk31":{"t":"PSK31: fázová modulace","h":"Kmitočet se nemění, obrací se fáze; při každém obratu amplituda poklesne.","l":"Velmi tenká čára asi 60 Hz, trochu „spletená“. Do 3 kHz se vejdou desítky stanic (list 26).","r":[["Kód","Varicode: 0 = obrat fáze, 1 = beze změny; v klidu dvě dvojčata čar"],["Kde poslouchat","14 070 kHz, 3580 kHz"],["Dekódování","fldigi"]]},"ft8":{"t":"MFSK / FT8: osm tónů","h":"Kmitočet stoupá a klesá po krocích 6,25 Hz, 0,16 s na krok.","l":"Pásy asi 50 Hz, které trvají 12,6 s a vracejí se každých 15 s podle hodin: několik stanic najednou ve 3 kHz, například na 7,074 MHz (list 26).","r":[["Rámec","79 symbolů po 0,16 s, tři vzory Costas (začátek, střed, konec); zde osm stanic"],["Kmitočty","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Dekódování","WSJT-X, JTDX (přesný čas PC)"]]},"ft4":{"t":"FT4: FT8 pro závody","h":"Čtyři tóny 20,8 Hz od sebe, 20,8 Bd: 105 symbolů za 5 s v časových oknech 7,5 s.","l":"Pásy asi 90 Hz, kratší a širší než FT8, vracejí se každých 7,5 s. 14 080, 7047,5 kHz (list 26)."},"olivia":{"t":"Olivia 8/250: osm tónů","h":"Osm tónů 31,25 Hz od sebe, vždy jen jeden, náhodně skáčou; Walshovo kódování a prokládání.","l":"Blok rozptýlených teček na 250 Hz; dekóduje hluboko pod šumem. V uchu malá náhodná melodie (list 26)."},"hell":{"t":"Feld Hell: psaní nosnou","h":"Nosná se zapíná a vypíná bod po bodu: každé písmeno tvoří sloupce po 14 bodech, snímané zdola nahoru (245 bodů za sekundu).","l":"Ve vodopádu přerušovaná čára; písmena vykreslí až obrazovka programu (fldigi). V uchu jemné praskání (list 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Čtyři úrovně kmitočtu: každý symbol nese dva bity.","l":"Obdélníkový blok 6 až 12,5 kHz, plný jako šum, často v dávkách (DMR dělí kanál na dva časové sloty). V uchu chraplavé „frrr“ (list 38)."},"mt63":{"t":"MT63: tísňové zprávy (NBEMS)","h":"64 tónů najednou, každý pomalu modulovaný, s velkou nadbytečností.","
