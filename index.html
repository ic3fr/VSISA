MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 bodów: APRS i packet","h":"Dwa tony akustyczne, 1200 i 2200 Hz, podane do nadajnika FM.","l":"Za odbiornikiem FM (dźwięk z głośnika): pasmo od 1200 do 2200 Hz w krótkich paczkach. Na słuch sekundowe „grrrt” (karty 29 i 30).","r":[["Częstotliwość","144,800 MHz w Europie (APRS), FM"],["Ramka","Flagi 0x7E, potem dane AX.25 w NRZI"],["Dekodowanie","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"t":"PSK31: modulacja fazy","h":"Częstotliwość się nie zmienia, odwraca się faza; przy każdym odwróceniu amplituda spada.","l":"Bardzo cienka kreska około 60 Hz, lekko „pleciona”. W 3 kHz mieszczą się dziesiątki stacji (karta 26).","r":[["Kod","Varicode: 0 = odwrócenie fazy, 1 = bez zmiany; w spoczynku dwie bliźniacze kreski"],["Gdzie słuchać","14 070 kHz, 3580 kHz"],["Dekodowanie","fldigi"]]},"ft8":{"t":"MFSK / FT8: osiem tonów","h":"Częstotliwość rośnie i maleje skokami po 6,25 Hz, 0,16 s na skok.","l":"Pasma około 50 Hz, które trwają 12,6 s i wracają co 15 s, zsynchronizowane z zegarem: kilka stacji naraz w 3 kHz, np. na 7,074 MHz (karta 26).","r":[["Ramka","79 symboli po 0,16 s, trzy wzory Costasa (początek, środek, koniec); tutaj osiem stacji"],["Częstotliwości","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Dekodowanie","WSJT-X, JTDX (dokładny zegar PC)"]]},"ft4":{"t":"FT4: FT8 do zawodów","h":"Cztery tony co 20,8 Hz, 20,8 bodów: 105 symboli w 5 s, w okienkach 7,5 s.","l":"Pasma około 90 Hz, krótsze i szersze niż FT8, wracające co 7,5 s. 14 080, 7047,5 kHz (karta 26)."},"olivia":{"t":"Olivia 8/250: osiem tonów","h":"Osiem tonów co 31,25 Hz, zawsze jeden naraz, przeskakujących losowo; kodowanie Walsha i przeplot.","l":"Blok rozsianych kropek na 250 Hz; dekoduje głęboko pod szumem. Na słuch mała losowa melodia (karta 26)."},"hell":{"t":"Feld Hell: pisanie nośną","h":"Nośna jest włączana i wyłączana punkt po punkcie: każda litera to kolumny po 14 punktów, skanowane od dołu do góry (245 punktów na sekundę).","l":"W wodospadzie poszarpana kreska; dopiero ekran programu (fldigi) rysuje litery. Na słuch delikatne trzeszczenie (karta 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Cztery poziomy częstotliwości: każdy symbol niesie dwa bity.","l":"Prostokątny blok 6–12,5 kHz, pełny jak szum, często w paczkach (DMR dzieli kanał na dwie szczeliny czasowe). Na słuch chrapliwe „frrr” (karta 38)."},"mt63":{"t":"MT63: wiadomości alarmowe (NBEMS)","h":"64 tony naraz, każdy powoli modulowany, z dużą nadmiarowością.","l":"Płaski blok 1 lub 2 kHz wokół 1500 Hz, o ostrych brzegach; równy szum. Przechodzi nawet przez mikrofon przyłożony do głośnika (karta 26 ter)."},"lora":{"t":"LoRa: rampy częstotliwości (chirpy)","h":"Częstotliwość przemiata całą szerokość i zaczyna od dołu: położenie skoku niesie dane.","l":"Równoległe przekątne, łatwe do rozpoznania: Meshtastic i MeshCore na 869,525 MHz lub 433 MHz, czujniki LoRaWAN (karty 11, 20 i 21)."},"sstv":{"t":"SSTV: obrazy w dźwięku","h":"Impuls synchronizacji na 1200 Hz, potem częstotliwość podąża za jasnością linii, od 1500 (czarny) do 2300 Hz (biały).","l":"Regularne kreski synchronizacji i chmura zmieniająca się z obrazem; „ćwierkający” dźwięk przez minutę lub dwie. 14,230 MHz, ISS na 145,800 MHz (karta 31).","r":[["Ramka","Nagłówek VIS, potem linie: synchro 1200 Hz, zielony, niebieski, czerwony; tutaj 20 linii planszy testowej"],["Dekodowanie","QSSTV, MMSSTV, Robot36 na smartfonie"]]},"fax":{"nm":"Faks pogodowy","t":"Faks pogodowy: 1500 Hz czarny, 2300 Hz biały","h":"Częstotliwość płynnie przechodzi od czerni do bieli, 120 linii na minutę.","l":"Dwa stałe pasma na 1500 i 2300 Hz (800 Hz odstępu), regularne „tik-tak”. Publikowane są częstotliwości nośnej: słuchaj w USB 1,9 kHz niżej (karta 32).","r":[["Ramka","Ton startowy 300 Hz, linie fazujące (biały impuls), potem mapa"],["Dekodowanie","fldigi, JWX, HamFax"]]},"elt":{"nm":"Syrena ELT","t":"Syrena ELT / PLB na 121,5 MHz","h":"AM, której ton opada z 1600 do 300 Hz dwa do czterech razy na sekundę.","l":"Stała nośna i wstęgi boczne przesuwające się wachlarzem: „łuu-łuu” radiolatarni ratunkowych, także na 121,375 MHz do ćwiczeń (karty 24 i 25)."},"406":{"nm":"Radiolatarnia 406","t":"Radiolatarnia 406 MHz: paczka BPSK","h":"Pół sekundy nadawania: 160 ms czystej nośnej, potem faza przełącza się o ±1,1 radiana z szybkością 400 bit/s.","l":"Krótka kreseczka powracająca co 50 s, między 406,0 a 406,1 MHz; nic użytecznego do usłyszenia, potrzebny dekoder (EPIRB 406, karta 25)."},"adsb":{"t":"ADS-B / mod S (1090 MHz): impulsy","h":"Impulsy 0,5 µs, których położenie niesie bity (PPM); tutaj skala czasu jest mocno spowolniona.","l":"Bardzo krótkie poziome kreski na całej szerokości, setki na sekundę blisko lotniska; potrzebny klucz SDR (karta 13).","n":"skala czasu mocno spowolniona"},"acars":{"t":"ACARS: AM i dane MSK","h":"AM niosąca dwa tony, 1200 i 2400 Hz, z szybkością 2400 bit/s.","l":"Półsekundowe paczki z nośną i wstęgami bocznymi, na 131,525, 131,725 lub 131,825 MHz w Europie: na słuch „brrrt” (karta 14)."},"ais":{"t":"AIS: GMSK 9600 bodów na dwóch kanałach","h":"Wygładzone FSK (GMSK) w paczkach po 26 ms, raz na 161,975 MHz, raz na 162,025 MHz (skala zmniejszona).","l":"Dwie kolumny krótkich kresek 50 kHz od siebie, regularne klikanie; im więcej statków, tym gęściej (karta 16).","n":"skala zmniejszona"},"navtex":{"t":"NAVTEX i DSC na falach średnich i krótkich: FSK 170 Hz","h":"Jak RTTY: dwie częstotliwości 170 Hz od siebie, ale 100 bodów.","l":"Dwie równoległe kreski, ciągłe podczas komunikatu, na 518 i 490 kHz (NAVTEX) lub 2187,5 kHz (cyfrowe wywołanie selektywne) (karta 17).","r":[["Kod","SITOR-B, CCIR 476: 7 bitów z czterema „1”, z powtórzeniem FEC"],["Dekodowanie","fldigi, YaND"]]},"hfdl":{"t":"HFDL: samoloty na falach krótkich","h":"PSK 1800 bodów na podnośnej 1440 Hz.","l":"Paczki około 2,4 kHz między 2,9 a 22 MHz; szum modemu, który przychodzi i odchodzi (karta 14 bis)."},"ctcss":{"t":"CTCSS: podton pod głosem","h":"Niski ciągły ton (67–254 Hz, tutaj 88,5 Hz) dodany do głosu.","l":"W dźwięku odbiornika FM: stała kreska na samym dole, pod głosem; otwiera blokadę szumów przemienników i krótkofalówek (karta 8)."},"dtmf":{"sh":"2 tony","t":"DTMF: dwa tony na klawisz","h":"Każdy klawisz wysyła jednocześnie ton niski (697–941 Hz) i wysoki (1209–1633 Hz).","l":"Pary kropek ułożone w ośmiu stałych kolumnach; „pip-pip” numerów telefonów i poleceń przemienników (karta 8).","r":[["Sekwencja","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tonów","t":"Selcall CCIR: tony po kolei","h":"Pięć tonów po 100 ms jeden po drugim, jeden na cyfrę.","l":"Małe schodki z kropek, powtarzane; szybkie „tululululu”, by wywołać jedno konkretne radio (karta 28).","r":[["Sekwencja","1 2 3 4 5, dwa razy; dekoduje ją też aplikacja SelCall dla UV-K1"]]},"pocsag":{"sh":"pagery","t":"POCSAG i FLEX: pagery","h":"FSK ±4,5 kHz; preambuła 1010…, potem dane (skala zmniejszona).","l":"Dwie wyraźne kreski podczas preambuły, potem pełne pasmo; przenikliwe „brrrrt”. 466,075 MHz, DAPNET 439,9875 MHz (karta 37).","n":"skala zmniejszona"},"ale":{"sh":"8 tonów","t":"ALE: automatyczne nawiązywanie łączności na KF","h":"Osiem tonów od 750 do 2500 Hz, 125 bodów, w paczkach.","l":"Blok około 2 kHz z drobnych kropek, sekunda lub dwie, czasem na kilku sąsiednich częstotliwościach; wysokie ćwierkanie (karta 28 bis)."},"rs41":{"nm":"Radiosonda RS41","t":"Radiosonda RS41: ciągłe GFSK","h":"Wygładzone FSK 4800 bodów bez przerwy; częstotliwość powoli dryfuje, gdy sonda wznosi się i stygnie.","l":"Pasmo około 10 kHz przesuwające się ukośnie przez cały lot, między 400 a 406 MHz (karta 18)."},"ook":{"nm":"Czujniki 433","t":"Czujniki 433 MHz: OOK","h":"Nośna włącza się i wyłącza krótkimi lub długimi impulsami (wszystko albo nic); komunikat powtarza się trzy razy.","l":"Paczki drobnych kropek, często potrójne, na 433,92 MHz: stacje pogodowe, czujniki temperatury, piloty (karta 19)."},"fhss":{"t":"Bluetooth: skoki częstotliwości (FHSS)","h":"Częstotliwość zmienia się 1600 razy na sekundę wśród 79 kanałów (skala zmniejszona).","l":"Drobne kreski rozsiane wszędzie na 80 MHz, nigdy w tym samym miejscu, w okolicy 2,4 GHz (karta 22).","n":"skala zmniejszona"},"wspr":{"t":"WSPR: radiolatarnie propagacyjne","h":"Cztery tony co 1,46 Hz, 0,68 s na symbol, przez 110,6 s.","l":"Bardzo cienka kreska około 6 Hz trwająca prawie dwie minuty, co parzyste dwie minuty: trzeba mocno powiększyć (karta 26).","n":"fragment 24 s (emisja trwa 110,6 s)"},"qrss":{"t":"QRSS: bardzo wolny Morse","h":"Nośna włączana i wyłączana, kropki od 3 do 10 s, często na dwóch sąsiednich częstotliwościach (DFCW).","l":"Kreski szerokie na kilka Hz, czytane na dziesięciominutowym ekranie; niesłyszalne (karta 26 bis).","n":"przyspieszone: kropka 0,6 s zamiast 3–10 s"},"texte":{"nm":"Tekst w wodospadzie","t":"Tekst w wodospadzie","h":"Każda linia obrazu staje się grupą tonów: dźwięk przypomina szum.","l":"Tekst lub rysunek pojawia się bezpośrednio na ekranie SDR (karta 33).","r":[["Uwaga","Nadawany od dołu obrazu: prosto w wodospadzie na żywo, do góry nogami w odcisku (czytanym z góry na dół)"]]},"vara":{"t":"Nowoczesne dane KF: VARA, Pactor, ARDOP","h":"Długie pełne paczki (OFDM lub PSK), a między nimi krótkie odpowiedzi drugiej stacji.","l":"Prostokąt około 2,4 kHz, który zatrzymuje się i rusza, z małym potwierdzeniem pośrodku; poszarpany szum (karta 26)."},"chirp":{"nm":"Jonosonda","t":"Jonosonda (chirp sounder)","h":"Powolna rampa częstotliwości przez całe pasmo KF; echa jonosfery przychodzą nieco później.","l":"Przekątna przemiatająca ekran, z równoległymi kreskami (echami); „ffuit”, które mija w ułamku sekundy."},"oth":{"nm":"Radar pozahoryzontalny","t":"Radar pozahoryzontalny („woodpecker”)","h":"Impulsy powtarzane 10 do 50 razy na sekundę, każdy szeroki na kilka kHz.","l":"Szeroki prążkowany blok pokrywający całe pasma; bardzo regularne stukanie dzięcioła na falach krótkich."},"parasites":{"nm":"Zakłócenia","sh":"zasilacz","t":"Zakłócenia z zasilacza impulsowego","h":"Sygnał prostokątny: jego częstotliwość i wszystkie harmoniczne wychodzą naraz.","l":"Grzebień regularnych prążków dryfujących razem na tle szumu: szukaj z NOISE FIND lub przenośnym odbiornikiem (karta K21b)."},"mpx":{"nm":"FM stereo i RDS","t":"Radio FM stereo i RDS","h":"Zdemodulowany dźwięk (multipleks) zawiera kanał L+R, pilot 19 kHz, kanał L-R wokół 38 kHz i RDS na 57 kHz.","l":"Od 0 do 60 kHz po demodulacji: niski blok, cienka kreska na 19 kHz, słabszy blok pośrodku i RDS na samej górze (karta 10).","n":"skala ÷ 20 do odsłuchu"},"dcf77":{"t":"Sygnał czasu DCF77 (77,5 kHz)","h":"Nośna spadająca do 15 % na 0,1 s (bit 0) lub 0,2 s (bit 1) na początku każdej sekundy.","l":"Stała kreska z czarną przerwą co sekundę; 59. sekunda jej nie ma, by zaznaczyć minutę (karta 10).","r":[["Uwaga","Tutaj nośna jest przeniesiona na 1000 Hz; 6. sekunda nie ma przerwy, jak 59. sekunda każdej minuty"]]},"ofdm":{"t":"OFDM: dziesiątki podnośnych","h":"Wiele gęsto upakowanych nośnych, każda wolna: suma wygląda jak szum.","l":"Płaski prostokąt o ostrych brzegach, zawsze obecny: DRM na KF (10 kHz), DAB+ (1,5 MHz), DVB-T, Wi-Fi. Na słuch ciągły szum (karty 10 i 22)."},"dsss":{"t":"Widmo rozproszone (DSSS): GPS, Wi-Fi 802.11b","h":"Dane miesza się z bardzo szybkim kodem: energia rozkłada się na dużą szerokość.","l":"Szeroki garb ledwo ponad szumem; GPS jest nawet pod szumem i bez obróbki go nie widać (karty 22 i 23)."},"hline":{"nm":"Linia wodoru","sh":"1420 MHz","t":"Linia wodoru 21 cm (1420,405 MHz)","h":"Zimny wodór w Drodze Mlecznej emituje bardzo słaby szum na 1420,405 MHz. Ruch ramion galaktyki przesuwa go przez efekt Dopplera: widać kilka małych garbów.","l":"W wodospadzie z sekundy na sekundę prawie nic: trzeba długo uśredniać, by garby wyłoniły się z szumu. Tutaj spójrz na średnie widmo po zatrzymaniu. Wystarczy czasza lub tuba, przedwzmacniacz i klucz SDR.","n":"sygnał mocno przesadzony"},"sun":{"nm":"Słońce","sh":"rozbłyski","t":"Słońce: rozbłyski radiowe typu III","h":"Elektrony wyrzucone przez rozbłysk przechodzą przez koronę słoneczną i sprawiają, że emituje coraz niżej, w miarę jak się oddalają.","l":"Kreski spadające ukośnie z góry na dół widma w mniej niż sekundę, na tle szumu słonecznego; narastające „szszsz”. Od około 10 do 400 MHz, także na falach krótkich w okolicy 20 MHz."},"jupiter":{"nm":"Jowisz","sh":"20 MHz","t":"Jowisz: rozbłyski dekametrowe (L i S)","h":"Pole magnetyczne Jowisza i jego księżyc Io wytwarzają silną emisję między 15 a 40 MHz: powolne rozbłyski L i bardzo krótkie rozbłyski S, które szybko zjeżdżają w dół.","l":"Najpierw fale szumu (L, jak przybój), potem serie drobnych „pyknięć” (S) w gęstych przekątnych. Okolice 20,1 MHz nocą, z prostym dipolem, gdy Io jest dobrze ustawiona."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Wirująca gwiazda neutronowa omiata Ziemię wiązką radiową, tutaj co 0,714 s. Gaz międzygwiazdowy opóźnia niskie częstotliwości: każdy impuls dociera najpierw na górę widma.","l":"Regularne „tik”; w wodospadzie każdy impuls to opadająca krzywa (dyspersja). Prawdziwy sygnał jest pod szumem: potrzeba dużej anteny i sumowania impulsów w ich okresie.","n":"sygnał mocno przesadzony"},"meteor":{"nm":"Meteory","sh":"GRAVES","t":"Echa meteorów z radaru GRAVES (143,050 MHz)","h":"Francuski radar GRAVES nadaje bez przerwy na 143,050 MHz. Gdy spadająca gwiazda jonizuje powietrze, jej ślad odbija trochę tego sygnału do twojego odbiornika, na ułamek sekundy do kilku sekund.","l":"W USB na 143,049 MHz: krótkie „pingi” około 1000 Hz, czasem echo, które się przesuwa (głowa meteoru, efekt Dopplera) albo trwa dłużej. O wiele więcej podczas rojów (Perseidy, Geminidy) (karta 1)."},"whistler":{"nm":"Gwizdy","sh":"VLF","t":"Gwizdy VLF (whistlery)","h":"Piorun wytwarza radiowy trzask; część biegnie wzdłuż linii ziemskiego pola magnetycznego na drugą półkulę i z powrotem, wysokie tony najpierw.","l":"„Fiuuu” opadające od wysokich do niskich tonów w sekundę lub dwie, tuż po trzasku; wszędzie trzaski (sferyki). Poniżej 10 kHz, z odbiornikiem VLF z dala od linii energetycznych."},"chorus":{"nm":"Chór świtu","sh":"VLF","t":"Chór świtu (dawn chorus)","h":"Podczas burzy magnetycznej elektrony uwięzione w magnetosferze wydają małe rosnące nuty, głównie o świcie.","l":"Nakładające się, wznoszące ćwierkania, jak ptaki, od około 1 do 4 kHz. Ten sam sprzęt co do gwizdów."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"Pierwszy sztuczny satelita przez trzy tygodnie nadawał piknięcia po około 0,3 s, na przemian na 20,005 i 40,002 MHz.","l":"Regularnie przerywana kreska: „pip… pip…”, dźwięk, którego w październiku 1957 słuchał cały świat (rekonstrukcja)."},"doppler":{"nm":"Efekt Dopplera","sh":"satelita","t":"Radiolatarnia satelity i efekt Dopplera","h":"Satelita na niskiej orbicie zbliża się, a potem oddala: odbierana częstotliwość spada podczas przelotu, o około ±3 kHz na 145 MHz i ±10 kHz na 435 MHz.","l":"Kreska opadająca w kształcie litery S: najpierw powoli, szybko w chwili największego zbliżenia, potem znów powoli (karta 34).","n":"przelot 10 min skrócony do 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satelity NOAA: obrazy APT (historia)","h":"Podnośna 2400 Hz modulowana amplitudowo obrazem, dwie linie na sekundę, z impulsem synchronizacji na początku każdej linii. Wyłączone w 2025; dziś satelity Meteor-M nadają LRPT.","l":"Kreska na 2400 Hz ze wstęgami bocznymi zmieniającymi się z obrazem i słynne „tik-tak” dwa razy na sekundę (karta 34)."},"eme":{"nm":"Echo od Księżyca","sh":"EME","t":"Echo od Księżyca (EME)","h":"Sygnał wysłany w stronę Księżyca wraca po około 2,5 s, ogromnie osłabiony, nieco poszerzony i przesunięty przez Dopplera.","l":"Słychać własne „pip”, a po 2,5 s jego słabe, nieco rozmyte echo. Krótkofalowcy robią to w CW lub JT65, od 144 MHz w górę (karta 1).","n":"echo mocno przesadzone"},"msk144":{"nm":"MSK144","sh":"meteory","t":"MSK144: emisja cyfrowa do łączności przez meteory","h":"Dwa tony, 1000 i 2000 Hz, 2000 bodów, w ramkach po 72 ms powtarzanych bez przerwy: każdy ślad meteoru przepuszcza kilka z nich.","l":"Paczki od 0,1 do 1 s, szerokie na około 2,4 kHz, które pojawiają się i gasną z „pingiem” meteoru. Na 50 i 144 MHz, z WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tonów","t":"JT65: 65 tonów, bardzo wolno","h":"Jeden ton synchronizacji i 64 tony danych co 2,7 Hz (JT65A), 0,37 s na symbol, 47 s nadawania na minutę.","l":"Drabinka drobnych kresek na około 180 Hz, z kreską synchronizacji, która wraca stale w to samo miejsce. Używana do odbić od Księżyca (JT65B i C) i bardzo słabych sygnałów.","n":"fragment 20 s (emisja trwa 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: profesjonalna sieć cyfrowa","h":"Modulacja fazy π/4-DQPSK, 18 000 symboli na sekundę, cztery szczeliny czasowe, w kanałach 25 kHz.","l":"Pełny blok o zaokrąglonych bokach, stale obecny przy stacji bazowej; chrapliwy szum. Szyfrowane: nie da się słuchać (karta 38).","n":"skala zmniejszona"},"ndb":{"nm":"Radiolatarnia NDB","sh":"190–535 kHz","t":"NDB: bezkierunkowa radiolatarnia","h":"Stała nośna na falach długich ze znakiem Morse'a z dwóch lub trzech liter nadawanym tonem (często 1020 Hz).","l":"Stała kreska pośrodku, a w czasie znaku dwie kreseczki po bokach. Około 190–535 kHz, w SSB lub CW (karta 10)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: radiolatarnia ogólnokierunkowa","h":"W AM: sygnał 30 Hz zależny od kierunku, podnośna 9960 Hz modulowana częstotliwościowo 30 Hz (odniesienie) i znak Morse'a na 1020 Hz.","l":"W zdemodulowanym dźwięku: niskie buczenie 30 Hz, szeroka falująca kreska w okolicy 10 kHz i co jakiś czas znak (karta 15).","n":"dźwięk zdemodulowany, skala ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: naprowadzanie do lądowania (localizer)","h":"W AM dwa tony 90 i 150 Hz; ich stosunek mówi samolotowi, czy jest na lewo, czy na prawo od osi. Znak Morse'a zaczyna się od I.","l":"W zdemodulowanym dźwięku: dwie bardzo niskie kreski na 90 i 150 Hz oraz znak na 1020 Hz. Między 108,1 a 112 MHz; ścieżka schodzenia około 330 MHz (karta 15)."},"m10":{"nm":"Sondy M10 / M20","sh":"Meteomodem","t":"Radiosondy M10 i M20 (Meteomodem)","h":"Jedna ramka na sekundę w szybkim FSK (około 9600 bodów): szersza niż RS41. We Francji wypuszcza je Météo-France.","l":"Co sekundę szeroka paczka, która powoli dryfuje w czasie lotu; między 400 a 406 MHz (karta 18)."},"tpms":{"nm":"Opony (TPMS)","sh":"433 MHz","t":"Czujniki ciśnienia w oponach (TPMS)","h":"Każde koło od czasu do czasu wysyła paczkę FSK trwającą kilka milisekund: ciśnienie, temperatura, identyfikator.","l":"Małe pojedyncze paczki na 433,92 MHz (lub 315 MHz), często parami, gdy przejeżdża samochód. Dekoduje je rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Sygnał czasu ALS162 (Allouis, 162 kHz)","h":"Nośna dawnych fal długich France Inter; czas jest kodowany małymi, niesłyszalnymi zmianami fazy.","l":"Stała kreska, bardzo silna we Francji, ledwo poszerzona na początku każdej sekundy; do odczytu czasu potrzebny dekoder (karta 10)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Sygnał czasu WWV (Kolorado)","h":"W AM: co sekundę „tyk” 5 ms na 1000 Hz, ton 500 lub 600 Hz, kod czasu na 100 Hz i głos podający czas UTC.","l":"W zdemodulowanym dźwięku: kreska na 500 Hz przerywana co sekundę, tyknięcie na 1000 Hz i kod na samym dole na 100 Hz (karta 10)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Sygnał czasu MSF (Anthorn, 60 kHz)","h":"Nośna jest wyłączana na początku każdej sekundy na 0,1, 0,2 lub 0,3 s zależnie od bitów, a na 0,5 s dla oznaczenia minuty.","l":"Stała kreska z całkiem czarnymi przerwami co sekundę, dłuższymi niż w DCF77 (karta 10)."},"type2":{"nm":"Słońce typ II","sh":"fala uderzeniowa","t":"Słońce: rozbłyski radiowe typu II","h":"Fala uderzeniowa koronalnego wyrzutu masy sprawia, że plazma emituje powoli coraz niżej, często w dwóch pasmach (podstawowym i podwojonym).","l":"Dwa równoległe pasma szumu, które przez kilka minut łagodnie opadają. Porównaj z typem III, znacznie szybszym.","n":"kilka minut skrócone do 6 s"},"tweeks":{"nm":"Tweeki","sh":"VLF","t":"Tweeki: nocne „pingi” VLF","h":"Nocą trzask odległego pioruna odbija się między ziemią a jonosferą; częstotliwości bliskie odcięcia (około 1,7 kHz) docierają ostatnie.","l":"Małe „ping”, które opada i zatrzymuje się około 1,7 kHz, czasem z echem na podwójnej częstotliwości; wszędzie trzaski. Poniżej 10 kHz, nocą."},"hiss":{"nm":"Szum VLF","sh":"hiss","t":"Szum VLF (hiss)","h":"Szeroki szum wytwarzany przez elektrony plazmasfery, rosnący i malejący z aktywnością magnetyczną.","l":"Pasmo szumu od kilkuset Hz do kilku kHz, bez wzoru, powoli narastające i opadające."},"aurora":{"nm":"Zorza radiowa","sh":"Au","t":"Propagacja zorzowa (Au)","h":"Zorza polarna odbija fale UKF, ale bardzo szybko nimi potrząsa: każdy sygnał rozmywa się na kilkaset Hz.","l":"CW zmienia się w szorstki, jakby szeptany szum; nie słychać już tonu. Na 50 i 144 MHz, z anteną na północ podczas burz magnetycznych."},"galactic":{"nm":"Szum galaktyczny","sh":"20–40 MHz","t":"Szum Drogi Mlecznej","h":"Centrum Galaktyki emituje szum radiowy, który Karl Jansky odkrył w 1932 roku około 20 MHz. Rośnie i maleje wraz z obrotem Ziemi.","l":"Szum tła, który powoli rośnie i znów opada, każdego dnia około 4 minut wcześniej. Widoczny z prostym dipolem między 20 a 40 MHz.","n":"jeden dzień skrócony do 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"Telemetria CubeSata","h":"Małe satelity regularnie wysyłają pomiary (bateria, temperatury) w FSK lub GMSK 1200 lub 9600 bodów, w okolicy 435–438 MHz.","l":"Regularne paczki, które za każdym razem schodzą trochę niżej przez efekt Dopplera, w czasie przelotu (karta 34).","n":"skala zmniejszona, przelot przyspieszony"},"issfm":{"nm":"ISS w FM","sh":"145,800 MHz","t":"Stacja kosmiczna (ISS): głos w FM","h":"Astronauci rozmawiają ze szkołami i krótkofalowcami w FM na 145,800 MHz. Stacja leci 28 000 km/h: odbierana częstotliwość spada w czasie przelotu o około 3,5 kHz.","l":"Pasmo głosu FM, które w czasie 10-minutowego przelotu powoli przesuwa się z prawej na lewą (karta 34).","n":"przelot 10 min skrócony do 10 s"},"buzzer":{"nm":"UVB-76 „The Buzzer”","sh":"4625 kHz","t":"UVB-76, „The Buzzer” (4625 kHz)","h":"Rosyjska stacja wojskowa, która od dziesięcioleci nadaje około sekundowe brzęczenie, mniej więcej 25 razy na minutę, czasem przerywane komunikatem głosowym.","l":"Stała nośna, a przy każdym brzęczeniu kolumna gęstych prążków z góry na dół. Łatwo ją znaleźć na 4625 kHz w USB."},"pip":{"nm":"„The Pip”","sh":"3756 / 5448 kHz","t":"„The Pip”: niekończące się piknięcia","h":"Kolejna rosyjska wojskowa radiolatarnia krótkofalowa, która dzień i noc powtarza krótkie piknięcia, czasem przerywane komunikatami.","l":"Stała kreska pocięta na bardzo gęste kropki; na słuch szybkie pip-pip-pip, które nigdy nie milknie.","n":"rytm przybliżony"},"squeaky":{"nm":"„Squeaky Wheel”","sh":"KF","t":"„Squeaky Wheel”: skrzypiące koło","h":"Rosyjska wojskowa radiolatarnia krótkofalowa, nazwana przez nasłuchowców od powtarzanego wzoru dźwięku.","l":"Mały wzór dwóch dźwięków, z których jeden rośnie, powtarzany w pętli: jak skrzypiące koło.","n":"przybliżona imitacja"},"codar":{"nm":"CODAR","sh":"radar oceaniczny","t":"CODAR: radary prądów morskich","h":"Radary przybrzeżne raz lub dwa razy na sekundę przemiatają pasmo częstotliwości, by mierzyć prądy i fale.","l":"Regularne równoległe przekątne i powtarzane „swish”; w okolicy 4,5–5,5 MHz, 13 MHz i 25 MHz, często dzień i noc.","n":"skala zmniejszona"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Modem wojskowy STANAG 4285","h":"Modulacja fazy 8-PSK, 2400 bodów, na nośnej 1800 Hz, z sekwencją testową co 107 ms do śledzenia kanału.","l":"Pełny blok około 3 kHz; na słuch szum z regularnym brzęczeniem (karta 35 bis)."},"link11":{"nm":"Link-11","sh":"16 tonów","t":"Link-11: morskie łącze danych","h":"Szesnaście tonów od 605 do 2915 Hz nadawanych razem, każdy modulowany fazowo 75 razy na sekundę.","l":"Grzebień regularnych prążków na 2,3 kHz i jeden prążek nieco z boku; na słuch muzyczne buczenie (karta 35 bis)."},"numbers":{"nm":"Stacja numeryczna","sh":"głos","t":"Stacja numeryczna","h":"O stałej porze krótka melodia wywoławcza, potem głos (często syntetyczny) czyta grupy po pięć cyfr, w AM lub SSB.","l":"Melodia w osobnych nutach, potem regularne grupy sylab rozdzielone ciszą (karta 35 bis).","n":"głos naśladowany, bez prawdziwych cyfr"}}},"ru":{"ui":{"title":"Определитель видов радиосигналов","mystery":"Загадочный звук","play":"▶ Слушать","stop":"■ Стоп","noise":"Шум","volume":"Громкость","loop":"По кругу","specwf":"Спектр + водопад","cursor":"курсор","footprint":"Отпечаток","dur":"{s} с сверху вниз","avg":"среднее по всему сигналу","press":"Нажми «Слушать»: сигнал побежит здесь","count":"{n} сигналов, в порядке листа 5 bis","myst":"Загадка","mystTags":"Слушай и смотри, затем выбери правильный ответ","quizH":"Что это за сигнал?","quizLead":"Включи звук, посмотри на спектр, водопад и отпечаток, затем ответь.","score":"Счёт","good":"Верно!","bad":"Мимо: это был {x}.","next":"Следующий загадочный звук","principle":"Принцип","screen":"На экране","sheet":"лист","book":"Книга: лист {r}","lang":"Язык","signals":"Сигналы","f1":"Сигналы смоделированы прямо на странице (12 000 отсчётов в секунду) по сигналам листа 5 bis книги OpenBookRadio, плюс Olivia, FT4 и Feld Hell (лист 26). Для радиосигналов (AM, FM, AIS, LoRa…) показана смоделированная промежуточная частота, как на экране SDR; некоторые уменьшены или ускорены, это указано.","f2":"Время в водопаде и отпечатке идёт вниз. Лицензия CC BY-NC-SA 4.0, бесплатно, не для продажи.","night":"Ночной режим","day":"Дневной режим"},"groups":["Аналоговый голос","Телеграф","Данные","Изображения","Авиация, флот и спасение","Вызов, субтоны и пейджинг","Радиозонды, датчики и устройства","Режимы КВ и диковинки","Вещание и время","Широкая полоса","Бонус: звуки космоса","Бонус: диковинки коротких волн"],"modes":{"am":{"sh":"голос","t":"AM: амплитудная модуляция","h":"Сила несущей следует за звуком: кривая «раздувается» и «сдувается».","l":"Неподвижная линия в центре (несущая) и по бокам две одинаковые боковые полосы. Ширина около 6–9 кГц. Вещание на КВ и СВ, авиация (листы 10 и 12)."},"ssb":{"nm":"ОБП / SSB","t":"SSB: одна боковая полоса","h":"Остаётся одна боковая полоса без несущей: когда молчат, ничего нет.","l":"Нет центральной линии, одна полоса около 2,7 кГц, живая только во время речи. USB выше 10 МГц, LSB ниже (радиолюбители). При плохой настройке голос звучит как «утка» (листы 9 и 26)."},"fm":{"sh":"голос","t":"FM: частотная модуляция","h":"Амплитуда постоянна; колебания сгущаются или разрежаются вместе со звуком.","l":"Сигнал пляшет вокруг своей частоты и шире при громком звуке: 12,5 кГц на канал в узкополосной FM (рации, ретрансляторы), 200 кГц в FM-вещании (листы 2 и 11)."},"cw":{"t":"CW: азбука Морзе","h":"Несущая включается и выключается: тире и точки.","l":"Очень тонкая линия, прерываемая в ритме Морзе; писк в ухе. Здесь «CQ» (лист 39).","r":[["Скорость","20 слов/мин, точка 60 мс, на 700 Гц: «CQ CQ CQ DE F4ABC K»"],["На слух","Чистые писки, длинные и короткие, на одной ноте"],["Декодирование","На слух, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: две частоты","h":"Частота прыгает между двумя значениями: одно для 0, другое для 1.","l":"Две параллельные линии: 170 Гц у радиолюбителей (45,45 Бод), 450 или 850 Гц у метеосводок. Ровное «тидилиди» (лист 27).","r":[["Код","Бодо ITA2: 5 бит + старт + 1,5 стоп; mark 2125 Гц, space 2295 Гц"],["Текст","RYRYRYRY CQ CQ DE F4ABC"],["Декодирование","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 Бод: APRS и пакет","h":"Два звуковых тона, 1200 и 2200 Гц, подаются в FM-передатчик.","l":"После FM-приёмника (звук динамика): полоса от 1200 до 2200 Гц короткими пачками. На слух секундное «грррт» (листы 29 и 30).","r":[["Частота","144,800 МГц в Европе (APRS), FM"],["Кадр","Флаги 0x7E, затем данные AX.25 в NRZI"],["Декодирование","Direwolf, multimon-ng, KISS TNC"]]},"psk31":{"t":"PSK31: фазовая модуляция","h":"Частота не меняется, меняется фаза; при каждой смене амплитуда проседает.","l":"Очень тонкая линия около 60 Гц, слегка «плетёная». В 3 кГц помещаются десятки станций (лист 26).","r":[["Код","Varicode: 0 = смена фазы, 1 = без изменений; в покое две линии-близнеца"],["Где слушать","14 070 кГц, 3580 кГц"],["Декодирование","fldigi"]]},"ft8":{"t":"MFSK / FT8: восемь тонов","h":"Частота ходит вверх-вниз ступеньками по 6,25 Гц, 0,16 с на ступеньку.","l":"Полосы около 50 Гц длительностью 12,6 с, повторяются каждые 15 с по часам: несколько станций сразу в 3 кГц, например на 7,074 МГц (лист 26).","r":[["Кадр","79 символов по 0,16 с, три шаблона Костаса (начало, середина, конец); здесь восемь станций"],["Частоты","14 074, 7074, 3573, 10 136, 21 074, 28 074 кГц"],["Декодирование","WSJT-X, JTDX (точное время ПК)"]]},"ft4":{"t":"FT4: FT8 для соревнований","h":"Четыре тона через 20,8 Гц, 20,8 Бод: 105 символов за 5 с, в окнах по 7,5 с.","l":"Полосы около 90 Гц, короче и шире, чем у FT8, повторяются каждые 7,5 с. 14 080, 7047,5 кГц (лист 26)."},"olivia":{"t":"Olivia 8/250: восемь тонов","h":"Восемь тонов через 31,25 Гц, по одному за раз, прыгают случайно; кодирование Уолша и перемежение.","l":"Россыпь точек на 250 Гц; декодируется глубоко под шумом. На слух маленькая случайная мелодия (лист 26)."},"hell":{"t":"Feld Hell: письмо несущей","h":"Несущая включается и выключается по точкам: каждая буква — столбцы по 14 точек, развёрнутые снизу вверх (245 точек в секунду).","l":"В водопаде рваная линия; буквы рисует экран программы (fldigi). На слух мягкое потрескивание (лист 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Четыре уровня частоты: каждый символ несёт два бита.","l":"Прямоугольный блок шириной 6–12,5 кГц, заполненный как шум, часто пачками (DMR делит канал на два тайм-слота). На слух хриплое «фррр» (лист 38)."},"mt63":{"t":"MT63: аварийные сообщения (NBEMS)","h":"64 тона одновременно, каждый модулирован медленно, с большой избыточностью.","l":"Плоский блок 1 или 2 кГц вокруг 1500 Гц с чёткими краями; ровное шипение. Проходит даже через микрофон у динамика (лист 26 ter)."},"lora":{"t":"LoRa: частотные пилы (чирпы)","h":"Частота пробегает всю ширину и начинает снова снизу: положение скачка несёт данные.","l":"Параллельные диагонали, их легко узнать: Meshtastic и MeshCore на 869,525 МГц или 433 МГц, датчики LoRaWAN (листы 11, 20 и 21)."},"sstv":{"t":"SSTV: изображения в звуке","h":"Синхроимпульс на 1200 Гц, затем частота следует яркости строки: от 1500 (чёрный) до 2300 Гц (белый).","l":"Регулярные линии синхронизации и облако, меняющееся с картинкой; «щебечущий» звук одну-две минуты. 14,230 МГц, МКС на 145,800 МГц (лист 31).","r":[["Кадр","Заголовок VIS, затем строки: синхро 1200 Гц, зелёный, синий, красный; здесь 20 строк испытательной таблицы"],["Декодирование","QSSTV, MMSSTV, Robot36 на смартфоне"]]},"fax":{"nm":"Метеофакс","t":"Метеофакс: 1500 Гц чёрный, 2300 Гц белый","h":"Частота плавно идёт от чёрного к белому, 120 строк в минуту.","l":"Две неподвижные полосы на 1500 и 2300 Гц (800 Гц разнос), ровное «тик-так». Публикуются частоты несущей: слушай в USB на 1,9 кГц ниже (лист 32).","r":[["Кадр","Стартовый тон 300 Гц, строки фазирования (белый импульс), затем карта"],["Декодирование","fldigi, JWX, HamFax"]]},"elt":{"nm":"Сирена ELT","t":"Сирена ELT / PLB на 121,5 МГц","h":"AM, тон которой падает с 1600 до 300 Гц два-четыре раза в секунду.","l":"Неподвижная несущая и боковые полосы, скользящие веером: «уу-уу» аварийных маяков, также на 121,375 МГц для учений (листы 24 и 25)."},"406":{"nm":"Маяк 406","t":"Маяк 406 МГц: пачка BPSK","h":"Полсекунды передачи: 160 мс чистой несущей, затем фаза качается на ±1,1 радиана со скоростью 400 бит/с.","l":"Короткая чёрточка каждые 50 с, между 406,0 и 406,1 МГц; слушать нечего, нужен декодер (EPIRB 406, лист 25)."},"adsb":{"t":"ADS-B / режим S (1090 МГц): импульсы","h":"Импульсы 0,5 мкс, положение которых несёт биты (PPM); здесь шкала времени сильно замедлена.","l":"Очень короткие горизонтальные чёрточки по всей ширине, сотни в секунду возле аэропорта; нужен SDR-донгл (лист 13).","n":"шкала времени сильно замедлена"},"acars":{"t":"ACARS: AM и данные MSK","h":"AM, несущая два тона, 1200 и 2400 Гц, со скоростью 2400 бит/с.","l":"Пачки по полсекунды с несущей и боковыми полосами, на 131,525, 131,725 или 131,825 МГц в Европе: на слух «бррт» (лист 14)."},"ais":{"t":"AIS: GMSK 9600 Бод на двух каналах","h":"Сглаженная FSK (GMSK) пачками по 26 мс, то на 161,975 МГц, то на 162,025 МГц (в уменьшенном масштабе).","l":"Два столбца коротких чёрточек в 50 кГц друг от друга, ровное щёлканье; чем больше судов, тем гуще (лист 16).","n":"уменьшенный масштаб"},"navtex":{"t":"NAVTEX и ЦИВ на СВ и КВ: FSK 170 Гц","h":"Как RTTY: две частоты с разносом 170 Гц, но 100 Бод.","l":"Две параллельные линии без перерыва во время сводки, на 518 и 490 кГц (NAVTEX) или 2187,5 кГц (цифровой избирательный вызов) (лист 17).","r":[["Код","SITOR-B, CCIR 476: 7 бит с четырьмя «1», с повтором FEC"],["Декодирование","fldigi, YaND"]]},"hfdl":{"t":"HFDL: самолёты на КВ","h":"PSK 1800 Бод на поднесущей 1440 Гц.","l":"Пачки около 2,4 кГц между 2,9 и 22 МГц; шипение модема, которое то появляется, то пропадает (лист 14 bis)."},"ctcss":{"t":"CTCSS: субтон под голосом","h":"Низкий непрерывный тон (67–254 Гц, здесь 88,5 Гц), добавленный к голосу.","l":"В звуке FM-приёмника: неподвижная линия в самом низу, под голосом; открывает шумоподавитель ретрансляторов и раций (лист 8)."},"dtmf":{"sh":"2 тона","t":"DTMF: два тона на клавишу","h":"Каждая клавиша одновременно посылает низкий тон (697–941 Гц) и высокий (1209–1633 Гц).","l":"Пары точек на восьми неподвижных столбцах; «пи-пи» телефонных номеров и команд ретрансляторов (лист 8).","r":[["Последовательность","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 тонов","t":"Selcall CCIR: тоны по очереди","h":"Пять тонов по 100 мс подряд, по одному на цифру.","l":"Маленькая лесенка из точек, повторяется; быстрое «тулулулу», чтобы вызвать одну конкретную рацию (лист 28).","r":[["Последовательность","1 2 3 4 5, дважды; декодируется и приложением SelCall для UV-K1"]]},"pocsag":{"sh":"пейджеры","t":"POCSAG и FLEX: пейджеры","h":"FSK ±4,5 кГц; преамбула 1010…, затем данные (уменьшенный масштаб).","l":"Две чёткие линии во время преамбулы, затем сплошная полоса; пронзительное «брррт». 466,075 МГц, DAPNET 439,9875 МГц (лист 37).","n":"уменьшенный масштаб"},"ale":{"sh":"8 тонов","t":"ALE: автоматическое установление связи на КВ","h":"Восемь тонов от 750 до 2500 Гц, 125 Бод, пачками.","l":"Блок около 2 кГц из мелких точек, одна-две секунды, иногда на нескольких соседних частотах; высокое щебетание (лист 28 bis)."},"rs41":{"nm":"Радиозонд RS41","t":"Радиозонд RS41: непрерывная GFSK","h":"Сглаженная FSK 4800 Бод без остановки; частота медленно уходит, когда зонд поднимается и остывает.","l":"Полоса около 10 кГц, ползущая наискосок весь полёт, между 400 и 406 МГц (лист 18)."},"ook":{"nm":"Датчики 433","t":"Датчики 433 МГц: OOK","h":"Несущая включается и выключается короткими или длинными импульсами (всё или ничего); сообщение повторяется трижды.","l":"Пачки мелких точек, часто по три, на 433,92 МГц: метеостанции, датчики температуры, пульты (лист 19)."},"fhss":{"t":"Bluetooth: прыжки частоты (FHSS)","h":"Частота меняется 1600 раз в секунду среди 79 каналов (уменьшенный масштаб).","l":"Мелкие чёрточки разбросаны по всем 80 МГц, никогда в одном месте, около 2,4 ГГц (лист 22).","n":"уменьшенный масштаб"},"wspr":{"t":"WSPR: маяки прохождения","h":"Четыре тона через 1,46 Гц, 0,68 с на символ, в течение 110,6 с.","l":"Очень тонкая линия около 6 Гц длиной почти две минуты, каждые чётные две минуты: нужно сильно увеличить (лист 26).","n":"фрагмент 24 с (передача длится 110,6 с)"},"qrss":{"t":"QRSS: очень медленная морзянка","h":"Несущая включается и выключается, точки по 3–10 с, часто на двух соседних частотах (DFCW).","l":"Линии шириной в несколько Гц, читаются на десятиминутном экране; на слух не воспринимается (лист 26 bis).","n":"ускорено: точка 0,6 с вместо 3–10 с"},"texte":{"nm":"Текст в водопаде","t":"Текст в водопаде","h":"Каждая строка картинки становится группой тонов: звук похож на шум.","l":"Текст или рисунок появляется прямо на экране SDR (лист 33).","r":[["Примечание","Передаётся с низа картинки: прямо в живом водопаде, вверх ногами в отпечатке (читается сверху вниз)"]]},"vara":{"t":"Современные данные КВ: VARA, Pactor, ARDOP","h":"Длинные сплошные пачки (OFDM или PSK), а между ними короткие ответы другой станции.","l":"Прямоугольник около 2,4 кГц, который останавливается и снова начинается, с маленьким подтверждением посередине; рваное шипение (лист 26)."},"chirp":{"nm":"Ионозонд","t":"Ионозонд (ЛЧМ-зондирование)","h":"Медленная частотная пила через весь КВ-диапазон; эхо от ионосферы приходит чуть позже.","l":"Диагональ через экран вместе с параллельными линиями (эхо); «ффьють», пролетающий за долю секунды."},"oth":{"nm":"Загоризонтный радар","t":"Загоризонтный радар («дятел»)","h":"Импульсы повторяются 10–50 раз в секунду, каждый шириной несколько кГц.","l":"Широкий полосатый блок, перекрывающий целые диапазоны; очень ровный стук дятла на КВ."},"parasites":{"nm":"Помехи","sh":"блок питания","t":"Помехи от импульсного блока питания","h":"Прямоугольный сигнал: его частота и все гармоники выходят одновременно.","l":"Гребёнка ровных линий, дрейфующих вместе, на фоне шума: ищи с NOISE FIND или переносным приёмником (лист K21b)."},"mpx":{"nm":"FM-стерео и RDS","t":"FM-стерео и RDS","h":"Демодулированный звук (мультиплекс) содержит канал L+R, пилот 19 кГц, канал L-R около 38 кГц и RDS на 57 кГц.","l":"От 0 до 60 кГц после демодуляции: низкий блок, тонкая линия на 19 кГц, более слабый блок в середине и RDS на самом верху (лист 10).","n":"масштаб ÷ 20 для прослушивания"},"dcf77":{"t":"Сигнал времени DCF77 (77,5 кГц)","h":"Несущая падает до 15 % на 0,1 с (бит 0) или 0,2 с (бит 1) в начале каждой секунды.","l":"Неподвижная линия с чёрным провалом каждую секунду; на 59-й секунде провала нет, это отметка минуты (лист 10).","r":[["Примечание","Здесь несущая перенесена на 1000 Гц; на 6-й секунде провала нет, как на 59-й секунде каждой минуты"]]},"ofdm":{"t":"OFDM: десятки поднесущих","h":"Много плотно уложенных несущих, каждая медленная: сумма похожа на шум.","l":"Плоский прямоугольник с чёткими краями, всегда на месте: DRM на КВ (10 кГц), DAB+ (1,5 МГц), DVB-T, Wi-Fi. На слух ровное шипение (листы 10 и 22)."},"dsss":{"t":"Расширенный спектр (DSSS): GPS, Wi-Fi 802.11b","h":"Данные смешиваются с очень быстрым кодом: энергия размазывается по широкой полосе.","l":"Широкий горб чуть выше шума; GPS даже ниже шума и без обработки не виден (листы 22 и 23)."},"hline":{"nm":"Линия водорода","sh":"1420 МГц","t":"Линия водорода 21 см (1420,405 МГц)","h":"Холодный водород Млечного Пути излучает очень слабый шум на 1420,405 МГц. Движение спиральных рукавов смещает его эффектом Доплера: видно несколько маленьких горбов.","l":"В водопаде от секунды к секунде почти ничего: нужно долго усреднять, чтобы горбы вышли из шума. Здесь посмотри на средний спектр в остановке. Достаточно тарелки или рупора, малошумящего усилителя и SDR-донгла.","n":"сигнал сильно преувеличен"},"sun":{"nm":"Солнце","sh":"всплески","t":"Солнце: радиовсплески III типа","h":"Электроны, выброшенные вспышкой, проходят через солнечную корону и заставляют её излучать всё ниже по частоте по мере удаления.","l":"Линии, падающие наискосок сверху вниз по спектру меньше чем за секунду, на фоне солнечного шума; нарастающее «шшшш». Примерно от 10 до 400 МГц, также на КВ около 20 МГц."},"jupiter":{"nm":"Юпитер","sh":"20 МГц","t":"Юпитер: декаметровые всплески (L и S)","h":"Магнитное поле Юпитера и его спутник Ио дают мощное излучение между 15 и 40 МГц: медленные L-всплески и очень короткие S-всплески, быстро скользящие вниз.","l":"Сначала волны шума (L, как прибой), затем серии маленьких «хлопков» (S) плотными диагоналями. Около 20,1 МГц ночью, на простой диполь, когда Ио в удачном положении."},"pulsar":{"nm":"Пульсар","sh":"B0329+54","t":"Пульсар PSR B0329+54","h":"Вращающаяся нейтронная звезда проводит по Земле радиолучом, здесь каждые 0,714 с. Межзвёздный газ задерживает низкие частоты: каждый импульс приходит сначала в верх спектра.","l":"Ровное «тик»; в водопаде каждый импульс — нисходящая кривая (дисперсия). Настоящий сигнал под шумом: нужна большая антенна и сложение импульсов по их периоду.","n":"сигнал сильно преувеличен"},"meteor":{"nm":"Метеоры","sh":"GRAVES","t":"Метеорные отражения радара GRAVES (143,050 МГц)","h":"Французский радар GRAVES непрерывно излучает на 143,050 МГц. Когда падающая звезда ионизирует воздух, её след отражает немного сигнала к твоему приёмнику — на долю секунды или несколько секунд.","l":"В USB на 143,049 МГц: короткие «пинги» около 1000 Гц, иногда скользящее эхо (голова метеора, эффект Доплера) или долгое. Гораздо больше во время потоков (Персеиды, Геминиды) (лист 1)."},"whistler":{"nm":"Свисты","sh":"ОНЧ","t":"ОНЧ-свисты (вистлеры)","h":"Молния даёт радиощелчок; часть его уходит вдоль силовых линий магнитного поля Земли в другое полушарие и обратно, высокие тона первыми.","l":"«Фьююю», спускающееся от высоких к низким за одну-две секунды сразу после щелчка; повсюду треск (сферики). Ниже 10 кГц, на ОНЧ-приёмник вдали от линий электропередачи."},"chorus":{"nm":"Утренний хор","sh":"ОНЧ","t":"Утренний хор (dawn chorus)","h":"Во время магнитной бури электроны, захваченные магнитосферой, издают маленькие восходящие ноты, особенно на рассвете.","l":"Перекрывающееся восходящее щебетание, как птицы, примерно от 1 до 4 кГц. То же оборудование, что для свистов."},"sputnik":{"nm":"Спутник-1","sh":"1957","t":"Спутник-1 (1957)","h":"Первый искусственный спутник три недели передавал сигналы около 0,3 с поочерёдно на 20,005 и 40,002 МГц.","l":"Регулярно прерываемая линия: «бип… бип…» — звук, который в октябре 1957 года слушал весь мир (реконструкция)."},"doppler":{"nm":"Эффект Доплера","sh":"спутник","t":"Маяк спутника и эффект Доплера","h":"Спутник на низкой орбите приближается, затем удаляется: принимаемая частота во время пролёта падает примерно на ±3 кГц на 145 МГц и ±10 кГц на 435 МГц.","l":"Линия, спадающая S-образно: сначала медленно, быстро в точке наибольшего сближения, затем снова медленно (лист 34).","n":"пролёт 10 мин сжат до 12 с"},"apt":{"nm":"NOAA APT","sh":"137 МГц","t":"Спутники NOAA: изображения APT (история)","h":"Поднесущая 2400 Гц, амплитудно модулированная изображением, две строки в секунду, с синхроимпульсом в начале каждой строки. Отключено в 2025 году; сейчас спутники «Метеор-М» передают LRPT.","l":"Линия на 2400 Гц с боковыми полосами, меняющимися вместе с изображением, и знаменитое «тик-так» дважды в секунду (лист 34)."},"eme":{"nm":"Эхо от Луны","sh":"EME","t":"Эхо от Луны (EME)","h":"Сигнал, посланный к Луне, возвращается примерно через 2,5 с, чрезвычайно ослабленный, немного размытый и сдвинутый Доплером.","l":"Слышишь своё «бип», а через 2,5 с его слабое, чуть размытое эхо. Радиолюбители делают это в CW или JT65, от 144 МГц и выше (лист 1).","n":"эхо сильно преувеличено"},"msk144":{"nm":"MSK144","sh":"метеоры","t":"MSK144: цифровой вид связи через метеоры","h":"Два тона, 1000 и 2000 Гц, 2000 Бод, кадры по 72 мс повторяются без перерыва: каждый метеорный след пропускает несколько из них.","l":"Пачки от 0,1 до 1 с шириной около 2,4 кГц, появляющиеся и гаснущие вместе с «пингом» метеора. На 50 и 144 МГц, с WSJT-X."},"jt65":{"nm":"JT65","sh":"65 тонов","t":"JT65: 65 тонов, очень медленно","h":"Один синхротон и 64 тона данных через 2,7 Гц (JT65A), 0,37 с на символ, 47 с передачи в минуту.","l":"Лесенка мелких чёрточек на 180 Гц с линией синхронизации, которая постоянно возвращается на одно место. Используется для связи через Луну (JT65B и C) и очень слабых сигналов.","n":"фрагмент 20 с (передача длится 47 с)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: профессиональная цифровая сеть","h":"Фазовая модуляция π/4-DQPSK, 18 000 символов в секунду, четыре тайм-слота, каналы по 25 кГц.","l":"Сплошной блок со скруглёнными краями, постоянно присутствует рядом с базовой станцией; хриплое шипение. Зашифровано: прослушать нельзя (лист 38).","n":"уменьшенный масштаб"},"ndb":{"nm":"Маяк NDB (ПРС)","sh":"190–535 кГц","t":"NDB: ненаправленный радиомаяк","h":"Неподвижная несущая на длинных волнах с позывным Морзе из двух-трёх букв, передаваемым тоном (часто 1020 Гц).","l":"Неподвижная линия в центре и во время позывного две чёрточки по бокам. Примерно 190–535 кГц, в SSB или CW (лист 10)."},"vor":{"nm":"VOR","sh":"108–118 МГц","t":"VOR: всенаправленный радиомаяк","h":"В AM: сигнал 30 Гц, зависящий от направления, поднесущая 9960 Гц с частотной модуляцией 30 Гц (опорный сигнал) и позывной Морзе на 1020 Гц.","l":"В демодулированном звуке: низкий гул 30 Гц, широкая волнистая линия около 10 кГц и время от времени позывной (лист 15).","n":"демодулированный звук, масштаб ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Гц","t":"ILS: курсовой маяк системы посадки","h":"В AM два тона, 90 и 150 Гц; их соотношение говорит самолёту, левее он оси или правее. Позывной Морзе начинается с I.","l":"В демодулированном звуке: две очень низкие линии на 90 и 150 Гц и позывной на 1020 Гц. Между 108,1 и 112 МГц; глиссадный маяк около 330 МГц (лист 15)."},"m10":{"nm":"Зонды M10 / M20","sh":"Meteomodem","t":"Радиозонды M10 и M20 (Meteomodem)","h":"Один кадр в секунду, быстрая FSK (около 9600 Бод): шире, чем у RS41. Во Франции их запускает Météo-France.","l":"Каждую секунду широкая пачка, медленно дрейфующая во время полёта; между 400 и 406 МГц (лист 18)."},"tpms":{"nm":"Шины (TPMS)","sh":"433 МГц","t":"Датчики давления в шинах (TPMS)","h":"Каждое колесо время от времени посылает FSK-пачку в несколько миллисекунд: давление, температура, идентификатор.","l":"Маленькие одиночные пачки на 433,92 МГц (или 315 МГц), часто парами, когда проезжает машина. Декодируются rtl_433."},"als162":{"nm":"ALS162","sh":"162 кГц","t":"Сигнал времени ALS162 (Аллуи, 162 кГц)","h":"Несущая бывшего длинноволнового вещания France Inter; время закодировано небольшими неслышимыми изменениями фазы.","l":"Неподвижная линия, очень сильная во Франции, чуть расширенная в начале каждой секунды; чтобы прочитать время, нужен декодер (лист 10)."},"wwv":{"nm":"WWV","sh":"2,5–20 МГц","t":"Сигнал времени WWV (Колорадо)","h":"В AM: каждую секунду «тик» 5 мс на 1000 Гц, тон 500 или 600 Гц, код времени на 100 Гц и голос, объявляющий время UTC.","l":"В демодулированном звуке: линия 500 Гц, прерываемая каждую секунду, тик на 1000 Гц и код в самом низу на 100 Гц (лист 10)."},"msf":{"nm":"MSF","sh":"60 кГц","t":"Сигнал времени MSF (Анторн, 60 кГц)","h":"Несущая выключается в начале каждой секунды на 0,1, 0,2 или 0,3 с в зависимости от битов и на 0,5 с для отметки минуты.","l":"Неподвижная линия с полностью чёрными провалами каждую секунду, длиннее, чем у DCF77 (лист 10)."},"type2":{"nm":"Солнце, II тип","sh":"ударная волна","t":"Солнце: радиовсплески II типа","h":"Ударная волна корональной эмиссии массы заставляет плазму медленно излучать всё ниже, часто в двух полосах (основной и удвоенной).","l":"Две параллельные полосы шума, плавно опускающиеся несколько минут. Сравни со всплесками III типа, гораздо более быстрыми.","n":"несколько минут сжаты до 6 с"},"tweeks":{"nm":"Твики","sh":"ОНЧ","t":"Твики: ночные ОНЧ-«пинги»","h":"Ночью щелчок далёкой молнии отражается между землёй и ионосферой; частоты у критической (около 1,7 кГц) приходят последними.","l":"Короткий «пинг», спускающийся и обрывающийся около 1,7 кГц, иногда с эхом на удвоенной частоте; повсюду треск. Ниже 10 кГц, ночью."},"hiss":{"nm":"ОНЧ-шипение","sh":"hiss","t":"ОНЧ-шипение (hiss)","h":"Широкополосный шум электронов плазмосферы, усиливающийся и ослабевающий с магнитной активностью.","l":"Полоса шипения от нескольких сотен Гц до нескольких кГц, без рисунка, медленно нарастающая и спадающая."},"aurora":{"nm":"Радиоаврора","sh":"Au","t":"Авроральное прохождение (Au)","h":"Полярное сияние отражает УКВ, но очень быстро их трясёт: каждый сигнал размазывается на несколько сотен Гц.","l":"CW превращается в шершавое шипение, будто шёпот; тона больше не слышно. На 50 и 144 МГц, антенна на север во время магнитных бурь."},"galactic":{"nm":"Галактический шум","sh":"20–40 МГц","t":"Шум Млечного Пути","h":"Центр Галактики излучает радиошум, который Карл Янский открыл в 1932 году около 20 МГц. Он растёт и падает с вращением Земли.","l":"Фоновый шум, медленно растущий и снова спадающий, каждый день примерно на 4 минуты раньше. Виден на простой диполь между 20 и 40 МГц.","n":"сутки сжаты до 12 с"},"cubesat":{"nm":"CubeSat","sh":"9600 Бод","t":"Телеметрия кубсата","h":"Малые спутники регулярно передают свои измерения (батарея, температуры) в FSK или GMSK со скоростью 1200 или 9600 Бод около 435–438 МГц.","l":"Регулярные пачки, каждый раз чуть ниже из-за эффекта Доплера во время пролёта (лист 34).","n":"уменьшенный масштаб, пролёт ускорен"},"issfm":{"nm":"МКС в FM","sh":"145,800 МГц","t":"Космическая станция (МКС): голос в FM","h":"Космонавты говорят со школами и радиолюбителями в FM на 145,800 МГц. Станция летит со скоростью 28 000 км/ч: принимаемая частота за пролёт падает примерно на 3,5 кГц.","l":"Полоса FM-голоса, медленно смещающаяся справа налево за 10 минут пролёта (лист 34).","n":"пролёт 10 мин сжат до 10 с"},"buzzer":{"nm":"УВБ-76 «Жужжалка»","sh":"4625 кГц","t":"УВБ-76, «Жужжалка» (The Buzzer, 4625 кГц)","h":"Российская военная станция, которая десятилетиями передаёт жужжание около секунды примерно 25 раз в минуту, иногда прерываемое голосовым сообщением.","l":"Неподвижная несущая и при каждом жужжании столбец плотных линий сверху вниз. Легко найти на 4625 кГц в USB."},"pip":{"nm":"«The Pip»","sh":"3756 / 5448 кГц","t":"«The Pip»: бесконечные писки","h":"Ещё один российский военный коротковолновый маяк, день и ночь повторяющий короткие писки, иногда прерываемые сообщениями.","l":"Неподвижная линия, порезанная на очень частые точки; на слух быстрое пип-пип-пип без конца.","n":"ритм приблизительный"},"squeaky":{"nm":"«Squeaky Wheel»","sh":"КВ","t":"«Squeaky Wheel»: скрипучее колесо","h":"Российский военный коротковолновый маяк, названный слушателями по повторяющемуся звуковому рисунку.","l":"Маленький рисунок из двух звуков, один из которых поднимается, повторяется по кругу: как скрипучее колесо.","n":"приблизительная имитация"},"codar":{"nm":"CODAR","sh":"морской радар","t":"CODAR: радары морских течений","h":"Береговые радары один-два раза в секунду пробегают полосу частот, чтобы измерять течения и волны.","l":"Регулярные параллельные диагонали и повторяющееся «свиш»; около 4,5–5,5 МГц, 13 МГц и 25 МГц, часто круглосуточно.","n":"уменьшенный масштаб"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Военный модем STANAG 4285","h":"Фазовая модуляция 8-PSK, 2400 Бод, на несущей 1800 Гц, с тестовой последовательностью каждые 107 мс для отслеживания канала.","l":"Сплошной блок около 3 кГц; на слух шипение с ровным жужжанием (лист 35 bis)."},"link11":{"nm":"Link-11","sh":"16 тонов","t":"Link-11: морская линия передачи данных","h":"Шестнадцать тонов от 605 до 2915 Гц одновременно, каждый с фазовой модуляцией 75 раз в секунду.","l":"Гребёнка ровных линий на 2,3 кГц и одна линия чуть в стороне; на слух музыкальный гул (лист 35 bis)."},"numbers":{"nm":"Номерная станция","sh":"голос","t":"Номерная станция","h":"В определённое время короткая позывная мелодия, затем голос (часто синтезированный) читает группы по пять цифр, в AM или SSB.","l":"Мелодия отдельными нотами, затем ровные группы слогов, разделённые паузами (лист 35 bis).","n":"имитация голоса, без настоящих цифр"}}},"uk":{"ui":{"title":"Визначник видів радіосигналів","mystery":"Загадковий звук","play":"▶ Слухати","stop":"■ Стоп","noise":"Шум","volume":"Гучність","loop":"По колу","specwf":"Спектр + водоспад","cursor":"курсор","footprint":"Відбиток","dur":"{s} с згори донизу","avg":"середнє по всьому сигналу","press":"Натисни «Слухати»: сигнал побіжить тут","count":"{n} сигналів, у порядку аркуша 5 bis","myst":"Загадка","mystTags":"Слухай і дивись, потім обери правильну відповідь","quizH":"Що це за сигнал?","quizLead":"Увімкни звук, подивись на спектр, водоспад і відбиток, потім відповідай.","score":"Рахунок","good":"Правильно!","bad":"Ні: це був {x}.","next":"Наступний загадковий звук","principle":"Принцип","screen":"На екрані","sheet":"аркуш","book":"Книга: аркуш {r}","lang":"Мова","signals":"Сигнали","f1":"Сигнали змодельовано просто на сторінці (12 000 відліків за секунду) за сигналами аркуша 5 bis книги OpenBookRadio, а також Olivia, FT4 і Feld Hell (аркуш 26). Для радіосигналів (AM, FM, AIS, LoRa…) показано змодельовану проміжну частоту, як на екрані SDR; деякі зменшено або прискорено, це вказано.","f2":"Час у водоспаді й відбитку йде донизу. Ліцензія CC BY-NC-SA 4.0, безкоштовно, не для продажу.","night":"Нічний режим","day":"Денний режим"},"groups":["Аналоговий голос","Телеграф","Дані","Зображення","Авіація, флот і рятування","Виклик, субтони й пейджинг","Радіозонди, датчики й пристрої","Режими КХ і дивовижі","Мовлення і час","Широка смуга","Бонус: звуки космосу","Бонус: дивовижі коротких хвиль"],"modes":{"am":{"sh":"голос","t":"AM: амплітудна модуляція","h":"Сила несучої йде за звуком: крива «надувається» і «здувається».","l":"Нерухома лінія в центрі (несуча) і з боків дві однакові бічні смуги. Ширина близько 6–9 кГц. Мовлення на КХ і СХ, авіація (аркуші 10 і 12)."},"ssb":{"nm":"ОБС / SSB","t":"SSB: одна бічна смуга","h":"Лишається одна бічна смуга без несучої: коли мовчать, нічого немає.","l":"Немає центральної лінії, одна смуга близько 2,7 кГц, жива лише під час мови. USB вище 10 МГц, LSB нижче (радіоаматори). При поганому налаштуванні голос звучить як «качка» (аркуші 9 і 26)."},"fm":{"sh":"голос","t":"FM: частотна модуляція","h":"Амплітуда стала; коливання згущуються або рідшають разом зі звуком.","l":"Сигнал танцює навколо своєї частоти і ширшає при гучному звуці: 12,5 кГц на канал у вузькосмуговій FM (рації, ретранслятори), 200 кГц у FM-мовленні (аркуші 2 і 11)."},"cw":{"t":"CW: абетка Морзе","h":"Несуча вмикається й вимикається: тире і крапки.","l":"Дуже тонка лінія, що переривається в ритмі Морзе; пищання у вусі. Тут «CQ» (аркуш 39).","r":[["Швидкість","20 слів/хв, крапка 60 мс, на 700 Гц: «CQ CQ CQ DE F4ABC K»"],["На слух","Чисті писки, довгі й короткі, на одній ноті"],["Декодування","На слух, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: дві частоти","h":"Частота стрибає між двома значеннями: одне для 0, інше для 1.","l":"Дві паралельні лінії: 170 Гц у радіоаматорів (45,45 Бод), 450 або 850 Гц у метеозведеннях. Рівне «тидиліди» (аркуш 27).","r":[["Код","Бодо ITA2: 5 біт + старт + 1,5 стоп; mark 2125 Гц, space 2295 Гц"],["Текст","RYRYRYRY CQ CQ DE F4ABC"],["Декодування","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 Бод: APRS і пакет","h":"Два звукові тони, 1200 і 2200 Гц, подаються у FM-передавач.","l":"Після FM-приймача (звук динаміка): смуга від 1200 до 2200 Гц короткими пачками. На слух секундне «грррт» (аркуші 29 і 30).","r":[["Частота","144,800 МГц у Європі (APRS), FM"],["Кадр","Прапорці 0x7E, потім дані AX.25 у NRZI"],["Декодування","Direwolf, multimon-ng, KISS TNC"]]},"psk31":{"t":"PSK31: фазова модуляція","h":"Частота не змінюється, змінюється фаза; при кожній зміні амплітуда просідає.","l":"Дуже тонка лінія близько 60 Гц, трохи «плетена». У 3 кГц вміщуються десятки станцій (аркуш 26).","r":[["Код","Varicode: 0 = зміна фази, 1 = без змін; у спокої дві лінії-близнюки"],["Де слухати","14 070 кГц, 3580 кГц"],["Декодування","fldigi"]]},"ft8":{"t":"MFSK / FT8: вісім тонів","h":"Частота ходить угору-вниз сходинками по 6,25 Гц, 0,16 с на сходинку.","l":"Смуги близько 50 Гц тривалістю 12,6 с, повторюються кожні 15 с за годинником: кілька станцій водночас у 3 кГц, наприклад на 7,074 МГц (аркуш 26).","r":[["Кадр","79 символів по 0,16 с, три шаблони Костаса (початок, середина, кінець); тут вісім станцій"],["Частоти","14 074, 7074, 3573, 10 136, 21 074, 28 074 кГц"],["Декодування","WSJT-X, JTDX (точний час ПК)"]]},"ft4":{"t":"FT4: FT8 для змагань","h":"Чотири тони через 20,8 Гц, 20,8 Бод: 105 символів за 5 с, у вікнах по 7,5 с.","l":"Смуги близько 90 Гц, коротші й ширші за FT8, повторюються кожні 7,5 с. 14 080, 7047,5 кГц (аркуш 26)."},"olivia":{"t":"Olivia 8/250: вісім тонів","h":"Вісім тонів через 31,25 Гц, по одному за раз, стрибають випадково; кодування Волша і перемежування.","l":"Розсип точок на 250 Гц; декодується глибоко під шумом. На слух маленька випадкова мелодія (аркуш 26)."},"hell":{"t":"Feld Hell: письмо несучою","h":"Несуча вмикається й вимикається по точках: кожна літера — стовпці по 14 точок, розгорнуті знизу вгору (245 точок за секунду).","l":"У водоспаді рвана лінія; літери малює екран програми (fldigi). На слух м'яке потріскування (аркуш 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Чотири рівні частоти: кожен символ несе два біти.","l":"Прямокутний блок шириною 6–12,5 кГц, заповнений як шум, часто пачками (DMR ділить канал на два тайм-слоти). На слух хрипке «фррр» (аркуш 38)."},"mt63":{"t":"MT63: аварійні повідомлення (NBEMS)","h":"64 тони одночасно, кожен модульований повільно, з великою надлишковістю.","l":"Плаский блок 1 або 2 кГц навколо 1500 Гц з чіткими краями; рівне шипіння. Проходить навіть через мікрофон біля динаміка (аркуш 26 ter)."},"lora":{"t":"LoRa: частотні пилки (чирпи)","h":"Частота пробігає всю ширину й починає знову знизу: положення стрибка несе дані.","l":"Паралельні діагоналі, їх легко впізнати: Meshtastic і MeshCore на 869,525 МГц або 433 МГц, датчики LoRaWAN (аркуші 11, 20 і 21)."},"sstv":{"t":"SSTV: зображення у звуці","h":"Синхроімпульс на 1200 Гц, далі частота йде за яскравістю рядка: від 1500 (чорний) до 2300 Гц (білий).","l":"Регулярні лінії синхронізації й хмара, що змінюється з картинкою; «щебетливий» звук одну-дві хвилини. 14,230 МГц, МКС на 145,800 МГц (аркуш 31).","r":[["Кадр","Заголовок VIS, далі рядки: синхро 1200 Гц, зелений, синій, червоний; тут 20 рядків випробувальної таблиці"],["Декодування","QSSTV, MMSSTV, Robot36 на смартфоні"]]},"fax":{"nm":"Метеофакс","t":"Метеофакс: 1500 Гц чорний, 2300 Гц білий","h":"Частота плавно йде від чорного до білого, 120 рядків за хвилину.","l":"Дві нерухомі смуги на 1500 і 2300 Гц (800 Гц рознесення), рівне «тік-так». Публікуються частоти несучої: слухай в USB на 1,9 кГц нижче (аркуш 32).","r":[["Кадр","Стартовий тон 300 Гц, рядки фазування (білий імпульс), потім карта"],["Декодування","fldigi, JWX, HamFax"]]},"elt":{"nm":"Сирена ELT","t":"Сирена ELT / PLB на 121,5 МГц","h":"AM, тон якої падає з 1600 до 300 Гц два-чотири рази на секунду.","l":"Нерухома несуча й бічні смуги, що ковзають віялом: «уу-уу» аварійних маяків, також на 121,375 МГц для навчань (аркуші 24 і 25)."},"406":{"nm":"Маяк 406","t":"Маяк 406 МГц: пачка BPSK","h":"Півсекунди передачі: 160 мс чистої несучої, потім фаза гойдається на ±1,1 радіана зі швидкістю 400 біт/с.","l":"Коротка рисочка кожні 50 с, між 406,0 і 406,1 МГц; слухати нічого, потрібен декодер (EPIRB 406, аркуш 25)."},"adsb":{"t":"ADS-B / режим S (1090 МГц): імпульси","h":"Імпульси 0,5 мкс, положення яких несе біти (PPM); тут шкала часу сильно сповільнена.","l":"Дуже короткі горизонтальні рисочки по всій ширині, сотні за секунду біля аеропорту; потрібен SDR-донгл (аркуш 13).","n":"шкала часу сильно сповільнена"},"acars":{"t":"ACARS: AM і дані MSK","h":"AM, що несе два тони, 1200 і 2400 Гц, зі швидкістю 2400 біт/с.","l":"Пачки по півсекунди з несучою й бічними смугами, на 131,525, 131,725 або 131,825 МГц у Європі: на слух «бррт» (аркуш 14)."},"ais":{"t":"AIS: GMSK 9600 Бод на двох каналах","h":"Згладжена FSK (GMSK) пачками по 26 мс, то на 161,975 МГц, то на 162,025 МГц (у зменшеному масштабі).","l":"Два стовпці коротких рисочок за 50 кГц одна від одної, рівне клацання; що більше суден, то густіше (аркуш 16).","n":"зменшений масштаб"},"navtex":{"t":"NAVTEX і ЦВВ на СХ і КХ: FSK 170 Гц","h":"Як RTTY: дві частоти з рознесенням 170 Гц, але 100 Бод.","l":"Дві паралельні лінії без перерви під час зведення, на 518 і 490 кГц (NAVTEX) або 2187,5 кГц (цифровий вибірковий виклик) (аркуш 17).","r":[["Код","SITOR-B, CCIR 476: 7 біт із чотирма «1», з повтором FEC"],["Декодування","fldigi, YaND"]]},"hfdl":{"t":"HFDL: літаки на КХ","h":"PSK 1800 Бод на піднесучій 1440 Гц.","l":"Пачки близько 2,4 кГц між 2,9 і 22 МГц; шипіння модема, що то з'являється, то зникає (аркуш 14 bis)."},"ctcss":{"t":"CTCSS: субтон під голосом","h":"Низький безперервний тон (67–254 Гц, тут 88,5 Гц), доданий до голосу.","l":"У звуці FM-приймача: нерухома лінія в самому низу, під голосом; відкриває шумоподавлювач ретрансляторів і рацій (аркуш 8)."},"dtmf":{"sh":"2 тони","t":"DTMF: два тони на клавішу","h":"Кожна клавіша одночасно надсилає низький тон (697–941 Гц) і високий (1209–1633 Гц).","l":"Пари точок на восьми нерухомих стовпцях; «пі-пі» телефонних номерів і команд ретрансляторів (аркуш 8).","r":[["Послідовність","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 тонів","t":"Selcall CCIR: тони по черзі","h":"П'ять тонів по 100 мс поспіль, по одному на цифру.","l":"Маленька драбинка з точок, повторюється; швидке «тулулулу», щоб викликати одну певну рацію (аркуш 28).","r":[["Послідовність","1 2 3 4 5, двічі; декодує і застосунок SelCall для UV-K1"]]},"pocsag":{"sh":"пейджери","t":"POCSAG і FLEX: пейджери","h":"FSK ±4,5 кГц; преамбула 1010…, потім дані (зменшений масштаб).","l":"Дві чіткі лінії під час преамбули, далі суцільна смуга; пронизливе «брррт». 466,075 МГц, DAPNET 439,9875 МГц (аркуш 37).","n":"зменшений масштаб"},"ale":{"sh":"8 тонів","t":"ALE: автоматичне встановлення зв'язку на КХ","h":"Вісім тонів від 750 до 2500 Гц, 125 Бод, пачками.","l":"Блок близько 2 кГц із дрібних точок, одна-дві секунди, іноді на кількох сусідніх частотах; високе щебетання (аркуш 28 bis)."},"rs41":{"nm":"Радіозонд RS41","t":"Радіозонд RS41: безперервна GFSK","h":"Згладжена FSK 4800 Бод без зупинки; частота повільно дрейфує, коли зонд піднімається й холоне.","l":"Смуга близько 10 кГц, що повзе навскіс увесь політ, між 400 і 406 МГц (аркуш 18)."},"ook":{"nm":"Датчики 433","t":"Датчики 433 МГц: OOK","h":"Несуча вмикається й вимикається короткими або довгими імпульсами (усе або нічого); повідомлення повторюється тричі.","l":"Пачки дрібних точок, часто по три, на 433,92 МГц: метеостанції, датчики температури, пульти (аркуш 19)."},"fhss":{"t":"Bluetooth: стрибки частоти (FHSS)","h":"Частота змінюється 1600 разів на секунду серед 79 каналів (зменшений масштаб).","l":"Дрібні рисочки розкидані по всіх 80 МГц, ніколи в одному місці, біля 2,4 ГГц (аркуш 22).","n":"зменшений масштаб"},"wspr":{"t":"WSPR: маяки проходження","h":"Чотири тони через 1,46 Гц, 0,68 с на символ, протягом 110,6 с.","l":"Дуже тонка лінія близько 6 Гц завдовжки майже дві хвилини, кожні парні дві хвилини: треба сильно збільшити (аркуш 26).","n":"фрагмент 24 с (передача триває 110,6 с)"},"qrss":{"t":"QRSS: дуже повільна морзянка","h":"Несуча вмикається й вимикається, крапки по 3–10 с, часто на двох сусідніх частотах (DFCW).","l":"Лінії шириною кілька Гц, читаються на десятихвилинному екрані; на слух не сприймається (аркуш 26 bis).","n":"прискорено: крапка 0,6 с замість 3–10 с"},"texte":{"nm":"Текст у водоспаді","t":"Текст у водоспаді","h":"Кожен рядок картинки стає групою тонів: звук схожий на шум.","l":"Текст або малюнок з'являється просто на екрані SDR (аркуш 33).","r":[["Примітка","Передається з низу картинки: рівно в живому водоспаді, догори дриґом у відбитку (читається згори донизу)"]]},"vara":{"t":"Сучасні дані КХ: VARA, Pactor, ARDOP","h":"Довгі суцільні пачки (OFDM або PSK), а між ними короткі відповіді іншої станції.","l":"Прямокутник близько 2,4 кГц, що зупиняється й починається знову, з маленьким підтвердженням посередині; рване шипіння (аркуш 26)."},"chirp":{"nm":"Іонозонд","t":"Іонозонд (ЛЧМ-зондування)","h":"Повільна частотна пилка через увесь КХ-діапазон; відлуння від іоносфери приходить трохи пізніше.","l":"Діагональ через екран разом із паралельними лініями (відлуння); «ффюїть», що пролітає за частку секунди."},"oth":{"nm":"Загоризонтний радар","t":"Загоризонтний радар («дятел»)","h":"Імпульси повторюються 10–50 разів на секунду, кожен шириною кілька кГц.","l":"Широкий смугастий блок, що перекриває цілі діапазони; дуже рівний стукіт дятла на КХ."},"parasites":{"nm":"Завади","sh":"блок живлення","t":"Завади від імпульсного блока живлення","h":"Прямокутний сигнал: його частота й усі гармоніки виходять одночасно.","l":"Гребінка рівних ліній, що дрейфують разом, на тлі шуму: шукай з NOISE FIND або переносним приймачем (аркуш K21b)."},"mpx":{"nm":"FM-стерео і RDS","t":"FM-стерео і RDS","h":"Демодульований звук (мультиплекс) містить канал L+R, пілот 19 кГц, канал L-R біля 38 кГц і RDS на 57 кГц.","l":"Від 0 до 60 кГц після демодуляції: низький блок, тонка лінія на 19 кГц, слабший блок посередині й RDS на самому верху (аркуш 10).","n":"масштаб ÷ 20 для прослуховування"},"dcf77":{"t":"Сигнал часу DCF77 (77,5 кГц)","h":"Несуча падає до 15 % на 0,1 с (біт 0) або 0,2 с (біт 1) на початку кожної секунди.","l":"Нерухома лінія з чорним провалом щосекунди; на 59-й секунді провалу немає, це позначка хвилини (аркуш 10).","r":[["Примітка","Тут несучу перенесено на 1000 Гц; на 6-й секунді провалу немає, як на 59-й секунді кожної хвилини"]]},"ofdm":{"t":"OFDM: десятки піднесучих","h":"Багато щільно укладених несучих, кожна повільна: сума схожа на шум.","l":"Плаский прямокутник із чіткими краями, завжди на місці: DRM на КХ (10 кГц), DAB+ (1,5 МГц), DVB-T, Wi-Fi. На слух рівне шипіння (аркуші 10 і 22)."},"dsss":{"t":"Розширений спектр (DSSS): GPS, Wi-Fi 802.11b","h":"Дані змішуються з дуже швидким кодом: енергія розмазується по широкій смузі.","l":"Широкий горб ледь над шумом; GPS навіть нижче шуму й без обробки не видно (аркуші 22 і 23)."},"hline":{"nm":"Лінія водню","sh":"1420 МГц","t":"Лінія водню 21 см (1420,405 МГц)","h":"Холодний водень Чумацького Шляху випромінює дуже слабкий шум на 1420,405 МГц. Рух спіральних рукавів зсуває його ефектом Доплера: видно кілька маленьких горбів.","l":"У водоспаді від секунди до секунди майже нічого: треба довго усереднювати, щоб горби вийшли з шуму. Тут подивись на середній спектр у зупинці. Досить тарілки або рупора, малошумного підсилювача та SDR-донгла.","n":"сигнал дуже перебільшено"},"sun":{"nm":"Сонце","sh":"сплески","t":"Сонце: радіосплески III типу","h":"Електрони, викинуті спалахом, проходять крізь сонячну корону й змушують її випромінювати дедалі нижче за частотою, віддаляючись.","l":"Лінії, що падають навскіс згори донизу спектра менш ніж за секунду, на тлі сонячного шуму; наростаюче «шшшш». Приблизно від 10 до 400 МГц, також на КХ біля 20 МГц."},"jupiter":{"nm":"Юпітер","sh":"20 МГц","t":"Юпітер: декаметрові сплески (L і S)","h":"Магнітне поле Юпітера та його супутник Іо дають потужне випромінювання між 15 і 40 МГц: повільні L-сплески та дуже короткі S-сплески, що швидко ковзають донизу.","l":"Спершу хвилі шуму (L, як прибій), потім серії маленьких «хлопків» (S) щільними діагоналями. Біля 20,1 МГц уночі, на простий диполь, коли Іо вдало розташована."},"pulsar":{"nm":"Пульсар","sh":"B0329+54","t":"Пульсар PSR B0329+54","h":"Нейтронна зоря, що обертається, проводить по Землі радіопроменем, тут кожні 0,714 с. Міжзоряний газ затримує низькі частоти: кожен імпульс приходить спершу вгорі спектра.","l":"Рівне «тік»; у водоспаді кожен імпульс — низхідна крива (дисперсія). Справжній сигнал під шумом: потрібна велика антена й додавання імпульсів за їхнім періодом.","n":"сигнал дуже перебільшено"},"meteor":{"nm":"Метеори","sh":"GRAVES","t":"Метеорні відбиття радара GRAVES (143,050 МГц)","h":"Французький радар GRAVES безперервно випромінює на 143,050 МГц. Коли падаюча зоря іонізує повітря, її слід відбиває трохи сигналу до твого приймача — на частку секунди чи кілька секунд.","l":"В USB на 143,049 МГц: короткі «пінги» біля 1000 Гц, іноді ковзне відлуння (голова метеора, ефект Доплера) або довге. Значно більше під час потоків (Персеїди, Гемініди) (аркуш 1)."},"whistler":{"nm":"Свисти","sh":"ННЧ","t":"ННЧ-свисти (вістлери)","h":"Блискавка дає радіоклацання; частина його йде вздовж силових ліній магнітного поля Землі в іншу півкулю й назад, високі тони першими.","l":"«Фʼюююю», що спускається від високих до низьких за одну-дві секунди одразу після клацання; усюди тріск (сферики). Нижче 10 кГц, на ННЧ-приймач далеко від ліній електропередачі."},"chorus":{"nm":"Ранковий хор","sh":"ННЧ","t":"Ранковий хор (dawn chorus)","h":"Під час магнітної бурі електрони, захоплені магнітосферою, видають маленькі висхідні ноти, особливо на світанку.","l":"Висхідне щебетання, що накладається, як птахи, приблизно від 1 до 4 кГц. Те саме обладнання, що й для свистів."},"sputnik":{"nm":"Супутник-1","sh":"1957","t":"Супутник-1 (1957)","h":"Перший штучний супутник три тижні передавав сигнали близько 0,3 с почергово на 20,005 і 40,002 МГц.","l":"Регулярно перервана лінія: «біп… біп…» — звук, який у жовтні 1957 року слухав увесь світ (реконструкція)."},"doppler":{"nm":"Ефект Доплера","sh":"супутник","t":"Маяк супутника й ефект Доплера","h":"Супутник на низькій орбіті наближається, потім віддаляється: прийнята частота під час прольоту падає приблизно на ±3 кГц на 145 МГц і ±10 кГц на 435 МГц.","l":"Лінія, що спадає S-подібно: спершу повільно, швидко в точці найбільшого зближення, потім знову повільно (аркуш 34).","n":"проліт 10 хв стиснуто до 12 с"},"apt":{"nm":"NOAA APT","sh":"137 МГц","t":"Супутники NOAA: зображення APT (історія)","h":"Піднесуча 2400 Гц, амплітудно модульована зображенням, два рядки за секунду, із синхроімпульсом на початку кожного рядка. Вимкнено у 2025 році; тепер супутники «Метеор-М» передають LRPT.","l":"Лінія на 2400 Гц із бічними смугами, що змінюються разом із зображенням, і знамените «тік-так» двічі на секунду (аркуш 34)."},"eme":{"nm":"Відлуння від Місяця","sh":"EME","t":"Відлуння від Місяця (EME)","h":"Сигнал, надісланий до Місяця, повертається приблизно за 2,5 с, надзвичайно ослаблений, трохи розмитий і зсунутий Доплером.","l":"Чуєш своє «біп», а за 2,5 с його слабке, трохи розмите відлуння. Радіоаматори роблять це в CW або JT65, від 144 МГц і вище (аркуш 1).","n":"відлуння дуже перебільшено"},"msk144":{"nm":"MSK144","sh":"метеори","t":"MSK144: цифровий вид зв'язку через метеори","h":"Два тони, 1000 і 2000 Гц, 2000 Бод, кадри по 72 мс повторюються без перерви: кожен метеорний слід пропускає кілька з них.","l":"Пачки від 0,1 до 1 с завширшки близько 2,4 кГц, що з'являються й гаснуть разом із «пінгом» метеора. На 50 і 144 МГц, з WSJT-X."},"jt65":{"nm":"JT65","sh":"65 тонів","t":"JT65: 65 тонів, дуже повільно","h":"Один синхротон і 64 тони даних через 2,7 Гц (JT65A), 0,37 с на символ, 47 с передачі за хвилину.","l":"Драбинка дрібних рисочок на 180 Гц із лінією синхронізації, що весь час повертається на те саме місце. Використовується для зв'язку через Місяць (JT65B і C) і дуже слабких сигналів.","n":"фрагмент 20 с (передача триває 47 с)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: професійна цифрова мережа","h":"Фазова модуляція π/4-DQPSK, 18 000 символів за секунду, чотири тайм-слоти, канали по 25 кГц.","l":"Суцільний блок із заокругленими краями, постійно присутній біля базової станції; хрипке шипіння. Зашифровано: прослухати не можна (аркуш 38).","n":"зменшений масштаб"},"ndb":{"nm":"Маяк NDB","sh":"190–535 кГц","t":"NDB: ненаправлений радіомаяк","h":"Нерухома несуча на довгих хвилях із позивним Морзе з двох-трьох літер, що передається тоном (часто 1020 Гц).","l":"Нерухома лінія в центрі, а під час позивного дві рисочки з боків. Приблизно 190–535 кГц, в SSB або CW (аркуш 10)."},"vor":{"nm":"VOR","sh":"108–118 МГц","t":"VOR: всеспрямований радіомаяк","h":"В AM: сигнал 30 Гц, що залежить від напрямку, піднесуча 9960 Гц із частотною модуляцією 30 Гц (опорний сигнал) і позивний Морзе на 1020 Гц.","l":"У демодульованому звуці: низький гул 30 Гц, широка хвиляста лінія біля 10 кГц і час від часу позивний (аркуш 15).","n":"демодульований звук, масштаб ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Гц","t":"ILS: курсовий маяк системи посадки","h":"В AM два тони, 90 і 150 Гц; їхнє співвідношення каже літаку, лівіше він від осі чи правіше. Позивний Морзе починається з I.","l":"У демодульованому звуці: дві дуже низькі лінії на 90 і 150 Гц і позивний на 1020 Гц. Між 108,1 і 112 МГц; глісадний маяк біля 330 МГц (аркуш 15)."},"m10":{"nm":"Зонди M10 / M20","sh":"Meteomodem","t":"Радіозонди M10 і M20 (Meteomodem)","h":"Один кадр за секунду, швидка FSK (близько 9600 Бод): ширше, ніж у RS41. У Франції їх запускає Météo-France.","l":"Щосекунди широка пачка, що повільно дрейфує під час польоту; між 400 і 406 МГц (аркуш 18)."},"tpms":{"nm":"Шини (TPMS)","sh":"433 МГц","t":"Датчики тиску в шинах (TPMS)","h":"Кожне колесо час від часу надсилає FSK-пачку в кілька мілісекунд: тиск, температура, ідентифікатор.","l":"Маленькі поодинокі пачки на 433,92 МГц (або 315 МГц), часто парами, коли проїжджає авто. Декодуються rtl_433."},"als162":{"nm":"ALS162","sh":"162 кГц","t":"Сигнал часу ALS162 (Аллуї, 162 кГц)","h":"Несуча колишнього довгохвильового мовлення France Inter; час закодовано невеликими нечутними змінами фази.","l":"Нерухома лінія, дуже сильна у Франції, ледь розширена на початку кожної секунди; щоб прочитати час, потрібен декодер (аркуш 10)."},"wwv":{"nm":"WWV","sh":"2,5–20 МГц","t":"Сигнал часу WWV (Колорадо)","h":"В AM: щосекунди «тік» 5 мс на 1000 Гц, тон 500 або 600 Гц, код часу на 100 Гц і голос, що оголошує час UTC.","l":"У демодульованому звуці: лінія 500 Гц, перервана щосекунди, тік на 1000 Гц і код у самому низу на 100 Гц (аркуш 10)."},"msf":{"nm":"MSF","sh":"60 кГц","t":"Сигнал часу MSF (Анторн, 60 кГц)","h":"Несучу вимикають на початку кожної секунди на 0,1, 0,2 або 0,3 с залежно від бітів і на 0,5 с для позначки хвилини.","l":"Нерухома лінія з повністю чорними провалами щосекунди, довшими, ніж у DCF77 (аркуш 10)."},"type2":{"nm":"Сонце, II тип","sh":"ударна хвиля","t":"Сонце: радіосплески II типу","h":"Ударна хвиля корональних викидів маси змушує плазму повільно випромінювати дедалі нижче, часто у двох смугах (основній і подвоєній).","l":"Дві паралельні смуги шуму, що плавно опускаються кілька хвилин. Порівняй зі сплесками III типу, значно швидшими.","n":"кілька хвилин стиснуто до 6 с"},"tweeks":{"nm":"Твіки","sh":"ННЧ","t":"Твіки: нічні ННЧ-«пінги»","h":"Уночі клацання далекої блискавки відбивається між землею й іоносферою; частоти біля критичної (близько 1,7 кГц) приходять останніми.","l":"Короткий «пінг», що спускається й уривається біля 1,7 кГц, іноді з відлунням на подвоєній частоті; усюди тріск. Нижче 10 кГц, уночі."},"hiss":{"nm":"ННЧ-шипіння","sh":"hiss","t":"ННЧ-шипіння (hiss)","h":"Широкосмуговий шум електронів плазмосфери, що посилюється й слабне з магнітною активністю.","l":"Смуга шипіння від кількох сотень Гц до кількох кГц, без малюнка, що повільно наростає й спадає."},"aurora":{"nm":"Радіоаврора","sh":"Au","t":"Авроральне проходження (Au)","h":"Полярне сяйво відбиває УКХ, але дуже швидко їх трясе: кожен сигнал розмазується на кілька сотень Гц.","l":"CW перетворюється на шорстке шипіння, ніби шепіт; тону вже не чути. На 50 і 144 МГц, антена на північ під час магнітних бур."},"galactic":{"nm":"Галактичний шум","sh":"20–40 МГц","t":"Шум Чумацького Шляху","h":"Центр Галактики випромінює радіошум, який Карл Янський відкрив 1932 року біля 20 МГц. Він зростає й спадає з обертанням Землі.","l":"Фоновий шум, що повільно зростає й знову спадає, щодня приблизно на 4 хвилини раніше. Видно на простий диполь між 20 і 40 МГц.","n":"добу стиснуто до 12 с"},"cubesat":{"nm":"CubeSat","sh":"9600 Бод","t":"Телеметрія кубсата","h":"Малі супутники регулярно передають свої вимірювання (батарея, температури) у FSK або GMSK зі швидкістю 1200 або 9600 Бод біля 435–438 МГц.","l":"Регулярні пачки, щоразу трохи нижчі через ефект Доплера під час прольоту (аркуш 34).","n":"зменшений масштаб, проліт прискорено"},"issfm":{"nm":"МКС у FM","sh":"145,800 МГц","t":"Космічна станція (МКС): голос у FM","h":"Астронавти говорять зі школами й радіоаматорами у FM на 145,800 МГц. Станція летить зі швидкістю 28 000 км/год: прийнята частота за проліт падає приблизно на 3,5 кГц.","l":"Смуга FM-голосу, що повільно зсувається справа наліво за 10 хвилин прольоту (аркуш 34).","n":"проліт 10 хв стиснуто до 10 с"},"buzzer":{"nm":"УВБ-76 «Дзижчалка»","sh":"4625 кГц","t":"УВБ-76, «Дзижчалка» (The Buzzer, 4625 кГц)","h":"Російська військова станція, яка десятиліттями передає дзижчання близько секунди приблизно 25 разів на хвилину, іноді переривається голосовим повідомленням.","l":"Нерухома несуча й за кожного дзижчання стовпець щільних ліній згори донизу. Легко знайти на 4625 кГц в USB."},"pip":{"nm":"«The Pip»","sh":"3756 / 5448 кГц","t":"«The Pip»: нескінченні писки","h":"Ще один російський військовий короткохвильовий маяк, що вдень і вночі повторює короткі писки, іноді перервані повідомленнями.","l":"Нерухома лінія, порізана на дуже часті точки; на слух швидке піп-піп-піп без кінця.","n":"ритм приблизний"},"squeaky":{"nm":"«Squeaky Wheel»","sh":"КХ","t":"«Squeaky Wheel»: рипуче колесо","h":"Російський військовий короткохвильовий маяк, названий слухачами за повторюваним звуковим малюнком.","l":"Маленький малюнок із двох звуків, один із яких піднімається, повторюється по колу: як рипуче колесо.","n":"приблизна імітація"},"codar":{"nm":"CODAR","sh":"морський радар","t":"CODAR: радари морських течій","h":"Берегові радари один-два рази на секунду пробігають смугу частот, щоб вимірювати течії та хвилі.","l":"Регулярні паралельні діагоналі й повторюване «свіш»; біля 4,5–5,5 МГц, 13 МГц і 25 МГц, часто цілодобово.","n":"зменшений масштаб"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Військовий модем STANAG 4285","h":"Фазова модуляція 8-PSK, 2400 Бод, на несучій 1800 Гц, із тестовою послідовністю кожні 107 мс для відстеження каналу.","l":"Суцільний блок близько 3 кГц; на слух шипіння з рівним дзижчанням (аркуш 35 bis)."},"link11":{"nm":"Link-11","sh":"16 тонів","t":"Link-11: морська лінія передачі даних","h":"Шістнадцять тонів від 605 до 2915 Гц одночасно, кожен із фазовою модуляцією 75 разів на секунду.","l":"Гребінка рівних ліній на 2,3 кГц і одна лінія трохи осторонь; на слух музичний гул (аркуш 35 bis)."},"numbers":{"nm":"Номерна станція","sh":"голос","t":"Номерна станція","h":"У визначений час коротка позивна мелодія, потім голос (часто синтезований) читає групи з п'яти цифр, в AM або SSB.","l":"Мелодія окремими нотами, потім рівні групи складів, розділені паузами (аркуш 35 bis).","n":"імітація голосу, без справжніх цифр"}}},"zh":{"ui":{"title":"无线电模式识别器","mystery":"神秘声音","play":"▶ 收听","stop":"■ 停止","noise":"噪声","volume":"音量","loop":"循环","specwf":"频谱 + 瀑布图","cursor":"光标","footprint":"信号指纹","dur":"自上而下 {s} 秒","avg":"整个信号的平均值","press":"按“收听”：信号会在这里滚动","count":"{n} 种信号，按第 5 bis 页的顺序排列","myst":"神秘模式","mystTags":"边听边看，然后选出正确答案","quizH":"这是什么信号？","quizLead":"开始收听，观察频谱、瀑布图和信号指纹，然后作答。","score":"得分","good":"答对了！","bad":"答错了：这是 {x}。","next":"下一个神秘声音","principle":"原理","screen":"屏幕上","sheet":"页","book":"书中：第 {r} 页","lang":"语言","signals":"信号","f1":"信号在页面中模拟生成（每秒 12000 个采样），依据 OpenBookRadio 一书第 5 bis 页的信号，另加 Olivia、FT4 和 Feld Hell（第 26 页）。对于无线电信号（AM、FM、AIS、LoRa……），显示的是模拟的中频，就像 SDR 屏幕上那样；部分信号按比例缩小或加速，均有标注。","f2":"瀑布图和信号指纹中时间向下流动。许可协议 CC BY-NC-SA 4.0，免费，禁止出售。","night":"夜间模式","day":"日间模式"},"groups":["模拟语音","电报","数据","图像","航空、航海与救援","呼叫、亚音与寻呼","探空仪、传感器与联网设备","短波模式与奇特信号","广播与授时","宽带","彩蛋：来自太空的声音","彩蛋：短波奇闻"],"modes":{"am":{"nm":"AM 调幅","sh":"语音","t":"AM：幅度调制","h":"载波强度随声音变化：曲线时而“鼓起”，时而“瘪下”。","l":"中间一条固定的线（载波），两侧各有一条相同的边带。宽约 6 至 9 kHz。短波和中波广播、航空（第 10 和 12 页）。"},"ssb":{"nm":"SSB 单边带","t":"SSB：单边带","h":"只保留一条边带，没有载波：没人说话时什么都没有。","l":"没有中心线，只有一条约 2.7 kHz 宽的频带，只在说话时出现。10 MHz 以上用 USB，以下用 LSB（业余无线电）。调谐不准时，声音像“鸭子叫”（第 9 和 26 页）。"},"fm":{"nm":"FM 调频","sh":"语音","t":"FM：频率调制","h":"幅度保持不变；振荡随声音变密或变疏。","l":"信号在其频率附近跳动，声音越大越宽：窄带 FM 每信道 12.5 kHz（对讲机、中继），FM 广播 200 kHz（第 2 和 11 页）。"},"cw":{"nm":"CW 摩尔斯","t":"CW：摩尔斯电码","h":"载波开开关关：划和点。","l":"一条很细的线，按摩尔斯节奏断断续续；耳中是“嘀嘀”声。这里是“CQ”（第 39 页）。","r":[["速度","每分钟 20 词，点长 60 ms，700 Hz：“CQ CQ CQ DE F4ABC K”"],["听感","纯净的长短嘀声，同一
