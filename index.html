,"sh":"EME","t":"Moon echo (EME)","h":"A signal sent to the Moon comes back about 2.5 s later, hugely weakened, slightly smeared and shifted by Doppler.","l":"You hear your own \"beep\", then its faint, slightly blurred echo 2.5 s later. Radio amateurs do it in CW or JT65, on 144 MHz and above (sheet 1).","n":"echo greatly exaggerated"},"msk144":{"nm":"MSK144","sh":"meteors","t":"MSK144: the meteor-scatter digital mode","h":"Two tones, 1000 and 2000 Hz, at 2000 baud, in 72 ms frames repeated non-stop: each meteor trail lets a few of them through.","l":"Bursts of 0.1 to 1 s, about 2.4 kHz wide, that appear and fade with the meteor's \"ping\". On 50 and 144 MHz, with WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tones","t":"JT65: 65 tones, very slow","h":"One sync tone and 64 data tones spaced 2.7 Hz (JT65A), 0.37 s per symbol, 47 s of transmission per minute.","l":"A ladder of small lines over about 180 Hz, with a sync line that keeps returning to the same place. Used for Moon bounce (JT65B and C) and very weak signals.","n":"20 s excerpt (a transmission lasts 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: professional digital network","h":"π/4-DQPSK phase modulation at 18,000 symbols per second, four time-shared channels, in 25 kHz channels.","l":"A full block with rounded edges, always there near a base station; a hoarse hiss. Encrypted: you cannot listen to it (sheet 46).","n":"reduced scale"},"ndb":{"nm":"NDB beacon","sh":"190–535 kHz","t":"NDB: non-directional beacon","h":"A fixed carrier on long wave, with a two- or three-letter Morse identifier sent on a tone (often 1020 Hz).","l":"A fixed line in the centre and, during the identifier, two small lines on either side. Roughly 190 to 535 kHz, in SSB or CW (sheet 12)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: omnidirectional radio range","h":"In AM: a 30 Hz signal that depends on direction, a 9960 Hz subcarrier frequency-modulated at 30 Hz (the reference), and the Morse identifier on 1020 Hz.","l":"In the demodulated sound: a low 30 Hz hum, a wide wavy line near 10 kHz, and the identifier now and then (sheet 18).","n":"demodulated sound, scale ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: landing guidance (localizer)","h":"In AM, two tones of 90 and 150 Hz; their ratio tells the aircraft whether it is left or right of the centreline. The Morse identifier starts with I.","l":"In the demodulated sound: two very low lines at 90 and 150 Hz, and the identifier on 1020 Hz. Between 108.1 and 112 MHz; the glide slope is around 330 MHz (sheet 18)."},"m10":{"nm":"M10 / M20 sondes","sh":"Meteomodem","t":"M10 and M20 radiosondes (Meteomodem)","h":"One frame per second, in fast FSK (about 9600 baud): wider than the RS41. Launched in France by Météo-France.","l":"A wide burst every second that drifts slowly during the flight; between 400 and 406 MHz (sheet 21)."},"tpms":{"nm":"Tyres (TPMS)","sh":"433 MHz","t":"Tyre pressure sensors (TPMS)","h":"Each wheel now and then sends an FSK burst of a few milliseconds: pressure, temperature, identifier.","l":"Small isolated bursts on 433.92 MHz (or 315 MHz), often in pairs, as a car passes. Decoded by rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"ALS162 time signal (Allouis, 162 kHz)","h":"The carrier of France Inter's former long-wave service; the time is coded by small, inaudible phase modulations.","l":"A fixed line, very strong in France, barely widened at the start of each second; a decoder is needed to read the time (sheet 12)."},"wwv":{"nm":"WWV","sh":"2.5–20 MHz","t":"WWV time signal (Colorado)","h":"In AM: a 5 ms \"tick\" at 1000 Hz every second, a 500 or 600 Hz tone, a time code on 100 Hz and a voice announcing UTC.","l":"In the demodulated sound: a 500 Hz line broken every second, the 1000 Hz tick, and the code at the very bottom on 100 Hz (sheet 12)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"MSF time signal (Anthorn, 60 kHz)","h":"The carrier is switched off at the start of each second for 0.1, 0.2 or 0.3 s depending on the bits, and for 0.5 s to mark the minute.","l":"A fixed line with complete black gaps every second, longer than with DCF77 (sheet 12)."},"type2":{"nm":"Sun type II","sh":"shock wave","t":"Sun: type II radio bursts","h":"The shock wave of a coronal mass ejection makes the plasma emit lower and lower, slowly, often in two bands (the fundamental and its double).","l":"Two parallel noise bands drifting down gently for several minutes. Compare with type III bursts, which are much faster.","n":"several minutes squeezed into 6 s"},"tweeks":{"nm":"Tweeks","sh":"VLF","t":"Tweeks: the night-time VLF \"pings\"","h":"At night, the click of distant lightning bounces between the ground and the ionosphere; frequencies near the cut-off (around 1.7 kHz) arrive last.","l":"A small \"ping\" that falls and stops around 1.7 kHz, sometimes with an echo at double frequency; crackles everywhere. Below 10 kHz, at night."},"hiss":{"nm":"VLF hiss","sh":"hiss","t":"VLF hiss","h":"Wideband noise produced by electrons in the plasmasphere, rising and falling with magnetic activity.","l":"A band of hiss from a few hundred Hz to a few kHz, with no pattern, slowly swelling and fading."},"aurora":{"nm":"Radio aurora","sh":"Au","t":"Auroral propagation (Au)","h":"The aurora reflects VHF waves but shakes them very fast: each signal is spread over several hundred Hz.","l":"CW turns into a raspy hiss, as if whispered; you no longer hear a note. On 50 and 144 MHz, beaming north during magnetic storms."},"galactic":{"nm":"Galactic noise","sh":"20–40 MHz","t":"Noise from the Milky Way","h":"The centre of the galaxy emits a radio hiss that Karl Jansky discovered in 1932 around 20 MHz. It rises and falls as the Earth turns.","l":"A background noise that slowly rises then falls again, about 4 minutes earlier each day. Visible with a simple dipole between 20 and 40 MHz.","n":"one day squeezed into 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"CubeSat telemetry","h":"Small satellites regularly send their measurements (battery, temperatures) in FSK or GMSK at 1200 or 9600 baud, around 435–438 MHz.","l":"Regular bursts sliding lower each time, by the Doppler effect, during the pass (sheet 41).","n":"reduced scale, pass sped up"},"issfm":{"nm":"ISS on FM","sh":"145.800 MHz","t":"Space station (ISS): FM voice","h":"Astronauts talk with schools and radio amateurs in FM on 145.800 MHz. The station flies at 28,000 km/h: during the pass, the received frequency slides from about +3.5 kHz to −3.5 kHz.","l":"A band of FM voice slowly moving from right to left during the 10-minute pass (sheet 41).","n":"10 min pass squeezed into 10 s"},"buzzer":{"nm":"UVB-76 \"The Buzzer\"","sh":"4625 kHz","t":"UVB-76, \"The Buzzer\" (4625 kHz)","h":"A Russian military station that has sent, for decades, a buzz of about one second repeated about 25 times a minute, sometimes interrupted by a voice message.","l":"A fixed carrier and, at each buzz, a column of tight lines from top to bottom. Easy to find on 4625 kHz in USB."},"pip":{"nm":"\"The Pip\"","sh":"3756 / 5448 kHz","t":"\"The Pip\": endless beeps","h":"Another Russian military shortwave beacon, repeating short little beeps day and night, sometimes interrupted by messages.","l":"A fixed line cut by a short beep about 50 times a minute; to the ear, a steady \"pip… pip…\" that never stops.","n":"approximate rhythm"},"squeaky":{"nm":"\"Squeaky Wheel\"","sh":"HF","t":"\"Squeaky Wheel\"","h":"A Russian military shortwave beacon, named by listeners after its repeated sound pattern.","l":"A small pattern of two sounds, one of them rising, repeated in a loop: like a squeaking wheel.","n":"approximate imitation"},"codar":{"nm":"CODAR","sh":"ocean radar","t":"CODAR: ocean current radars","h":"Coastal radars sweep a band of frequencies once or twice a second to measure currents and waves.","l":"Regular parallel diagonals and a repeated \"swish\"; around 4.5–5.5 MHz, 13 MHz and 25 MHz, often day and night.","n":"reduced scale"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"STANAG 4285 military modem","h":"8-PSK phase modulation at 2400 baud on an 1800 Hz carrier, with a probe sequence every 107 ms to track the channel.","l":"A full block about 3 kHz wide; to the ear, a hiss with a regular buzz (sheet 43)."},"link11":{"nm":"Link-11","sh":"16 tones","t":"Link-11: naval data link","h":"Sixteen tones from 605 to 2915 Hz sent together, each phase-modulated 75 times per second.","l":"A comb of fourteen regular lines from 935 to 2365 Hz, plus two lines set apart at 605 and 2915 Hz; to the ear, a musical drone (sheet 43)."},"numbers":{"nm":"Numbers station","sh":"voice","t":"Numbers station","h":"At a fixed time, a short call melody, then a voice (often synthetic) reads groups of five digits, in AM or SSB.","l":"The melody as separate notes, then regular groups of syllables separated by silences (sheet 43).","n":"imitated voice, no real digits"},"rttydwd":{"nm":"DWD weather RTTY","sh":"50 Bd / 450 Hz","t":"DWD weather RTTY (Germany)","h":"Like amateur RTTY, but at 50 baud with a 450 Hz shift: the German weather service sends its bulletins and marine forecasts in plain text.","l":"Two lines much further apart, and a slightly faster rhythm. Between bulletins, the call \"CQ CQ CQ DE DDK2 DDH7 DDK9\" then RYRYRY. On 4583, 7646 and 10,100.8 kHz, also 147.3 kHz (sheet 32)."},"mfsk16":{"nm":"MFSK16","sh":"16 tones","t":"MFSK16: sixteen tones","h":"Sixteen tones spaced 15.625 Hz, one at a time, 15.625 times per second; each tone carries four bits, protected by error correction.","l":"A 316 Hz band made of small steps that keep jumping, after a steady tone at the start. To the ear, a quick little tune, like a flute. Also used to send small pictures."},"sitora":{"nm":"SITOR-A (ARQ)","sh":"telex","t":"SITOR-A: maritime telex in ARQ","h":"The station sends blocks of three characters (210 ms, 100 baud, 170 Hz shift) every 450 ms; between blocks, the other station answers with a short signal meaning \"received\" or \"repeat\".","l":"Short regular bursts with a small, weaker reply in between: a cricket-like \"chirp-chirp\". Now rare on shortwave."},"dscvhf":{"nm":"VHF DSC (channel 70)","sh":"DSC","t":"DSC: digital selective calling on channel 70","h":"A burst of about half a second at 1200 baud, on two tones of 1300 and 2100 Hz: it carries the ship's MMSI number, the type of call and, in distress, its position.","l":"A short, high-pitched \"brrrt\" on 156.525 MHz that starts with a run of alternating bits. On medium and short waves, DSC is 100 baud FSK, like NAVTEX (sheet 20)."},"selcal":{"nm":"Aviation SELCAL","sh":"4 tones","t":"SELCAL: selective calling of aircraft on shortwave","h":"Air traffic control calls one particular aircraft with two pulses of about one second, each made of two tones out of sixteen (312.6 to 1479.1 Hz). In the aircraft a light and a chime go off: the crew does not have to listen all the time.","l":"Two successive chords, \"bing-bong\", between the voice messages on aeronautical SSB frequencies, for example 5616 or 8864 kHz."},"dcs":{"nm":"DCS","sh":"134.4 bit/s","t":"DCS: the digital sub-tone","h":"Instead of a continuous tone like CTCSS, the radio sends under the voice a 23-bit word repeated non-stop at 134.4 bits per second. At the end, a 134.4 Hz tone closes the squelch silently.","l":"Seen in the FM receiver audio: an irregular band at the very bottom, below 300 Hz, and a dull rumble if the radio's filter lets it through (sheet 10)."},"t1750":{"nm":"1750 Hz tone","sh":"repeater","t":"1750 Hz tone: opening a repeater","h":"A short 1750 Hz tone (about 0.5 to 1 s) at the start of a transmission still opens some European amateur repeaters; the repeater often answers with a beep when you release.","l":"A short line at 1750 Hz, then the voice, then the repeater's beep (sheet 10)."},"ncdxf":{"nm":"NCDXF beacons","sh":"14.100 MHz","t":"NCDXF / IARU beacons: testing propagation","h":"Eighteen beacons around the world transmit in turn, ten seconds each, on 14.100, 18.110, 21.150, 24.930 and 28.200 MHz: the call sign in Morse, then four one-second dashes at 100 W, 10 W, 1 W and 0.1 W.","l":"A call sign, then four dashes getting weaker and weaker: if you can still hear the last one, propagation to that beacon is excellent. Here 4U1UN (New York) then VE8AT (Canada) (sheet 30)."},"lrpt":{"nm":"Meteor-M LRPT","sh":"137.9 MHz","t":"Meteor-M satellites: LRPT images","h":"The Russian Meteor-M weather satellites send their images digitally: four-state phase modulation (QPSK), 72,000 symbols per second, about 120 kHz wide.","l":"A full block with rounded edges that slides slowly during the pass (Doppler effect); to the ear, just a hiss. On 137.9 or 137.1 MHz, decoded with SatDump (sheet 41).","n":"reduced scale"},"quindar":{"nm":"Quindar tones","sh":"NASA","t":"Quindar tones: the Apollo beeps","h":"When Houston presses the microphone key, a 2525 Hz beep (250 ms) switches on the ground station transmitters; on release, a 2475 Hz beep switches them off.","l":"A high beep before each sentence and another, slightly lower, after it: the famous sound of the Apollo mission recordings."},"wow":{"nm":"\"Wow!\" signal","sh":"1977","t":"The \"Wow!\" signal (15 August 1977)","h":"The Big Ear radio telescope (Ohio) picked up, for 72 seconds, a narrow and very strong signal near the hydrogen line, around 1420.456 MHz. Astronomer Jerry Ehman wrote \"Wow!\" on the printout. It was never seen again and its origin is still debated.","l":"A thin line that rises out of the noise, grows and fades: the shape of a fixed source drifting through the antenna beam. This is a reconstruction: no sound recording exists.","n":"72 s squeezed into 12 s"},"frb":{"nm":"Fast radio burst","sh":"FRB","t":"Fast radio burst (FRB)","h":"A radio flash lasting a few milliseconds, coming from another galaxy; the first one was discovered in 2007. The gas it crosses delays the low frequencies a lot: the burst arrives smeared, high notes first.","l":"A single curve falling from the top to the bottom of the spectrum, then nothing. Some repeat; most are seen only once.","n":"greatly slowed down and exaggerated"},"letterb":{"nm":"Single-letter beacons","sh":"D, P, S, C…","t":"Single-letter beacons","h":"Russian navy transmitters endlessly repeat a single Morse letter, each 100 Hz from its neighbour: D, P, S, C, A, F, K or M depending on the site.","l":"Parallel dotted lines, very close together, each with its own rhythm. Around 4558, 5154, 7039, 10,872, 13,528 and 16,332 kHz, in CW."},"sid":{"nm":"Solar flare on VLF","sh":"SID","t":"Solar flare seen on VLF (SID)","h":"Navy VLF transmitters (20.9 kHz in France, 23.4 kHz in Germany…) travel between the ground and the ionosphere. When a solar flare arrives, its X-rays change the bottom of the ionosphere within minutes and the received level jumps.","l":"A narrow, steady band (the transmitter's MSK signal) that suddenly gets stronger, then slowly returns to normal. A wire loop and a sound card are enough: a classic astronomy-club project.","n":"one hour squeezed into 12 s"},"qrn":{"nm":"Thunderstorm static","sh":"QRN","t":"Thunderstorm static (QRN)","h":"Every lightning stroke is a very powerful transmitter covering all frequencies at once. On medium and short waves you can hear storms thousands of kilometres away, mostly in summer and on the low bands.","l":"Irregular horizontal lines across the whole width; sharp crashes to the ear. The noise blanker (NB) helps a little, a loop antenna helps more."},"fading":{"nm":"Selective fading","sh":"QSB","t":"Selective fading (QSB)","h":"On shortwave the signal arrives by several paths through the ionosphere. Depending on the frequency they add up or cancel out: a narrow dip wanders through the signal.","l":"A dark zone drifting slowly through the AM station. When it crosses the carrier, in the centre, the sound turns harsh and distorted for a few seconds; synchronous detection or listening in SSB cures it."},"plc":{"nm":"Powerline (PLC)","sh":"2–30 MHz","t":"PLC: Internet through the mains sockets","h":"Powerline adapters send data over the house wiring on hundreds of carriers between 2 and 30 MHz (higher for recent models), one every 24.4 kHz. The wires radiate like an antenna.","l":"A comb of regular lines flickering in packets, with gaps on the amateur bands (notches required by the standard); to the ear, a crackle that follows the Internet traffic (sheet 43).","n":"reduced scale"},"fence":{"nm":"Electric fence","sh":"tick… tick…","t":"Electric fence","h":"The energiser sends a pulse of several thousand volts into the wire about once a second. If grass touches the wire or an insulator is damaged, a spark jumps and radiates on all frequencies.","l":"A very thin horizontal line across the whole width, at a perfectly regular interval; a \"tick… tick…\" from long wave up to VHF. Its steady rhythm tells it apart from storm static."},"gsm":{"nm":"GSM phone","sh":"217 Hz","t":"GSM phone next to a loudspeaker","h":"A 2G phone transmits in bursts of 0.577 ms, 217 times per second. A poorly shielded audio amplifier detects these bursts and makes them audible.","l":"A comb of lines every 217 Hz; the famous \"dit-dit-di-di-dit\" just before the phone rings, then a steady buzz during the call. Getting rare: 2G networks are being switched off."},"jjy":{"nm":"JJY","sh":"40 / 60 kHz","t":"JJY time signal (Japan, 40 and 60 kHz)","h":"Each second the carrier is at full power for 0.8 s (bit 0), 0.5 s (bit 1) or 0.2 s (marker), then drops to 10 %. It is the reverse of DCF77, which drops at the start of the second.","l":"A fixed line that weakens at the end of each second, sooner or later. Transmitters in Fukushima (40 kHz) and Saga-Fukuoka (60 kHz), for Japan's radio-controlled clocks."},"rwm":{"nm":"RWM","sh":"4996 kHz","t":"RWM time signal (Moscow)","h":"In telegraphy on 4996, 9996 and 14,996 kHz: one 100 ms pulse every second, then, at other minutes, ten pulses per second. The call sign RWM is sent in Morse twice an hour.","l":"The call sign, then a line cut into regular \"ticks\", then into fast dots. Listen in CW or SSB.","n":"condensed excerpt"},"bpm":{"nm":"BPM","sh":"2.5–15 MHz","t":"BPM time signal (China)","h":"The Pucheng station (Shaanxi) transmits in AM on 2.5, 5, 10 and 15 MHz: a 10 ms tick at 1000 Hz every second (300 ms on the minute) and, at certain minutes, 100 ms ticks for UT1 time. The call sign BPM is given in Morse, then by a voice.","l":"In the demodulated sound: the call sign, then very short lines at 1000 Hz, one per second, with a longer one on the minute. Often mixed with WWV on the same frequencies.","n":"condensed excerpt"},"humpback":{"nm":"Humpback whale","sh":"song","t":"The humpback whale's song","h":"In winter, on the breeding grounds, the males sing: a sequence of moans, groans and cries forming a theme that is repeated identically for hours and changes from one season to the next. Hydrophones pick it up tens of kilometres away.","l":"Thick traces with their harmonics, slowly rising or falling between 100 Hz and a few kHz; the same sequence comes back after a few seconds. Echoes from the surface and the seabed stretch every note."},"bluewhale":{"nm":"Blue whale","sh":"×10","t":"The blue whale: the deepest call","h":"The largest animal on Earth makes very low (10 to 40 Hz) and very powerful calls, 10 to 20 seconds long and repeated for hours: they carry for hundreds of kilometres. To hear them, the recording is sped up ten times.","l":"A pulsed part, then a long note that barely falls, with its harmonics above; the sequence repeats. The scale shows the real frequencies.","n":"sped up 10×"},"finwhale":{"nm":"Fin whale","sh":"20 Hz","t":"The fin whale: the 20 Hz pulses","h":"The fin whale makes pulses about one second long that fall from roughly 25 to 18 Hz, at regular intervals, sometimes for days. In the 1950s and 60s these “20 Hz signals” puzzled US Navy listening networks before being traced to this whale.","l":"Short dashes, all alike, in a regular series or in pairs, like the beats of a very slow heart; each one falls slightly in frequency. The scale shows the real frequencies.","n":"sped up 10×"},"sperm":{"nm":"Sperm whale","sh":"clicks","t":"Sperm whale clicks","h":"The sperm whale hunts on deep dives using sonar: very powerful clicks, about one per second, that speed up into a “creak” as it closes in on prey. Between dives, sperm whales exchange “codas”, short series of clicks whose rhythm differs from clan to clan.","l":"Horizontal lines across the full width, evenly spaced, then crowded into a buzz (the creak), then a small rhythmic pattern: the coda. Each click is made of several closely spaced pulses, caused by reflections inside the animal's head."},"dolphin":{"nm":"Bottlenose dolphin","sh":"whistles","t":"Dolphin whistles and clicks","h":"The bottlenose dolphin whistles between about 5 and 20 kHz; each animal has a “signature whistle” that works as its name. To hunt and find its way it also sends trains of very short clicks, up to several hundred per second.","l":"Thin curves that rise and fall back, often repeated identically, and bursts of horizontal lines for echolocation. Frequencies are divided by 3 to stay audible; the scale shows the real values.","n":"played 3× lower"},"orca":{"nm":"Orca","sh":"pulsed calls","t":"Orca pulsed calls","h":"Orcas communicate with pulsed calls: trains of pulses so fast (500 to 2000 per second) that they are heard as a note, with a sudden jump in pitch. Each family group has its own “dialect”.","l":"A stack of parallel traces (the harmonics) rising or falling together, with a sharp break in the middle of the call; sometimes a thin, higher whistle."},"bseal":{"nm":"Bearded seal","sh":"trill","t":"The bearded seal's trill","h":"In spring, under the Arctic sea ice, the male makes long trills that spiral down from several kHz to a few hundred hertz, sometimes for a whole minute. They defend a territory and attract females.","l":"A wavy curve gliding from the top of the scale to the bottom, like a spring uncoiling, then a low note at the end.","n":"shortened"},"shrimp":{"nm":"Snapping shrimp","sh":"reef","t":"Snapping shrimp (pistol shrimp)","h":"When it snaps its big claw shut, the shrimp shoots out a jet of water so fast that it forms a cavitation bubble; when the bubble collapses it cracks like a gunshot. Thousands of shrimp make the background noise of reefs and can disturb sonar.","l":"A shower of dots and short lines across the full width, with no order at all; in headphones, a continuous crackle like frying."},"sonar":{"nm":"Active sonar","sh":"ping","t":"An active sonar ping","h":"A ship sends a powerful sound pulse (here near 3.5 kHz, the range of frigate hull sonars) and listens for the echo: the delay gives the range, the frequency shift (Doppler effect) the target's speed. Sound also comes back as a tail from the seabed and the surface: reverberation.","l":"A short, strong trace, a tail that fades away, then the echo, much weaker and slightly shifted in frequency. The second ping is a frequency sweep (chirp), which measures range better."},"propeller":{"nm":"Ship propeller","sh":"cavitation","t":"The propeller of a passing ship","h":"The propeller blades create cavitation bubbles that collapse: a wide hiss, beating at the rate the blades go by. The machinery adds fixed lines. Sonar operators analyse this rhythm (DEMON analysis) to count the blades and the shaft speed, and identify the ship.","l":"A hiss over a wide band, striped with horizontal bands at the blade rate, with a few fixed vertical lines (engine, gearbox). It all grows, then dies away as the ship passes over the hydrophone."},"uqc":{"nm":"Underwater telephone","sh":"UQC 8 kHz","t":"The underwater telephone (UQC, “Gertrude”)","h":"Submarines and ships talk underwater with an acoustic telephone: the voice is sent as single sideband above an 8.0875 kHz carrier, radiated by a transducer in the hull. Range: a few kilometres.","l":"An SSB voice band above 8 kHz; demodulated, a distant voice that wobbles and rings because of echoes from the surface and the seabed. The display is halved; the scale shows the real frequencies.","n":"scale halved"},"zevs":{"nm":"ZEVS 82 Hz","sh":"ELF","t":"ZEVS: submarine radio at 82 Hz","h":"Radio waves barely penetrate seawater, except at extremely low frequencies (ELF). The Russian ZEVS transmitter on the Kola Peninsula sends at 82 Hz through antenna lines tens of kilometres long to reach deeply submerged submarines. The data rate is tiny: a few characters per minute.","l":"A thin line at 82 Hz next to the 50 Hz mains line and its harmonics, with static from thunderstorms. In headphones, a barely audible low hum; it can be received with a large loop and a sound card. The American equivalent, at 76 Hz, shut down in 2004."},"bloop":{"nm":"The “Bloop”","sh":"1997","t":"The “Bloop” (1997)","h":"In 1997, NOAA hydrophones in the Pacific picked up a very low sound that rose quickly, heard thousands of kilometres away. Long a mystery, since 2012 it has been put down to an icequake: a huge iceberg cracking.","l":"A wide band that rises within a few seconds, with its harmonics, then slowly dies away. A reconstruction, sped up 16 times like the recording NOAA released.","n":"sped up 16×"}}},"es":{"ui":{"title":"VSISA","mystery":"Sonido misterioso","play":"▶ Escuchar","stop":"■ Parar","noise":"Ruido","volume":"Volumen","loop":"En bucle","specwf":"Espectro + Cascada","cursor":"cursor","footprint":"Huella","dur":"{s} s de arriba abajo","avg":"media de toda la señal","press":"Pulsa Escuchar: la señal se desplaza aquí","count":"{n} señales, en el orden de la ficha 6","myst":"Modo misterioso","mystTags":"Escucha y observa, luego elige la respuesta correcta","quizH":"¿Qué señal es?","quizLead":"Pon la escucha, observa el espectro, la cascada y la huella, y responde.","score":"Puntuación","good":"¡Correcto!","bad":"Fallo: era {x}.","next":"Siguiente sonido misterioso","principle":"Principio","screen":"En pantalla","sheet":"ficha","book":"Libro: ficha {r}","lang":"Idioma","signals":"Señales","f1":"Señales simuladas en la página (12 000 muestras por segundo): las de la ficha 6 del libro OpenBookRadio, otras señales del libro y extras. Para las señales de radio (AM, FM, AIS, LoRa…) se ve la frecuencia intermedia simulada, como en la pantalla de un SDR; algunas están a escala reducida o acelerada, y se indica. En AM, BLU, FM, FM estéreo, ISS y desvanecimiento se oye el sonido demodulado, como en el altavoz del receptor, y la pantalla muestra la señal de radio; la voz es sintética y no dice palabras reales.","f2":"El tiempo baja en la cascada y en la huella. Licencia CC BY-NC-SA 4.0, gratis, prohibida la venta.","night":"Modo noche","day":"Modo día","visits":"visitas","plays":"escuchas","book_dl":"Descargar el libro","book_dl2":"Descargar el libro OpenBookRadio (gratis, PDF y EPUB, 13 idiomas)","display":"Pantalla","theme_day":"Día","theme_night":"Noche (rojo)","theme_phos":"Fósforo verde","theme_phosb":"Fósforo azul","theme_phosa":"Fósforo ámbar","w3d":"Cascada 3D","w3dHint":"arrastra para girar"},"groups":["Voz analógica","Telegrafía","Datos","Imágenes","Aviación, marina y rescate","Llamada, subtonos y mensajería","Radiosondas, sensores y objetos conectados","Modos HF y curiosidades","Radiodifusión y hora","Banda ancha","Bonus: sonidos del espacio","Bonus: curiosidades de onda corta","Bonus: sonidos submarinos"],"modes":{"am":{"sh":"radio","t":"AM: modulación de amplitud","h":"La fuerza de la portadora sigue al sonido: la curva se «hincha» y se «deshincha».","l":"Una raya fija en el centro (la portadora), con dos bandas laterales idénticas a cada lado. Unos 6 a 9 kHz de ancho. Radio en onda corta y onda media, aviación (fichas 12 y 14).","r":[["Escucha","Una sintonía y luego el locutor sobre un fondo musical. Las dos bandas laterales son simétricas: se ve la melodía y luego la voz a cada lado de la portadora."]]},"ssb":{"t":"BLU / SSB: banda lateral única","h":"Solo queda una banda lateral, sin portadora: nada cuando nadie habla.","l":"Sin raya central, una sola banda de unos 2,7 kHz que solo vive cuando se habla. USB por encima de 10 MHz, LSB por debajo (radioaficionados). Mal sintonizada, la voz suena a «pato» (fichas 11 y 29)."},"fm":{"sh":"voz","t":"FM: modulación de frecuencia","h":"La amplitud se mantiene fija; las oscilaciones se juntan o se separan con el sonido.","l":"La señal baila alrededor de su frecuencia, más ancha cuando el sonido es fuerte: 12,5 kHz por canal en FM estrecha (walkies, repetidores), 200 kHz en radio FM (fichas 2 y 13).","r":[["Escucha","Al final, el pequeño «kchh»: el silenciador se cierra cuando el emisor se detiene."]]},"cw":{"t":"CW: Morse","h":"La portadora se enciende y se apaga: rayas y puntos.","l":"Una raya muy fina que se corta al ritmo del Morse; un pitido al oído. Aquí «CQ» (ficha 48).","r":[["Velocidad","20 palabras/min, punto de 60 ms, a 700 Hz: «CQ CQ CQ DE F4ABC K»"],["Al oído","Pitidos puros, largos y cortos, de una sola nota"],["Decodificación","De oído, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: dos frecuencias","h":"La frecuencia salta entre dos valores, uno para 0 y otro para 1.","l":"Dos rayas paralelas: 170 Hz de separación entre radioaficionados (45,45 baudios), 450 u 850 Hz para los boletines meteorológicos. Un «tidilidi» regular (ficha 32).","r":[["Código","Baudot ITA2: 5 bits + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Texto","RYRYRYRY CQ CQ DE F4ABC"],["Decodificación","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 baudios: APRS y packet","h":"Dos tonos de audio, 1200 y 2200 Hz, enviados a un transmisor FM.","l":"Vista tras el receptor FM (sonido del altavoz): una banda de 1200 a 2200 Hz, en ráfagas cortas. Al oído, un «grrrt» de un segundo (fichas 35 y 36).","r":[["Frecuencia","144,800 MHz en Europa (APRS), FM"],["Trama","Banderas 0x7E y datos AX.25 en NRZI"],["Decodificación","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"t":"PSK31: modulación de fase","h":"La frecuencia no se mueve, es la fase la que se invierte; la amplitud baja en cada inversión.","l":"Una raya muy fina de unos 60 Hz, algo «trenzada». Decenas de estaciones caben en 3 kHz (ficha 29).","r":[["Código","Varicode: 0 = inversión de fase, 1 = sin cambio; en reposo, dos rayas gemelas"],["Dónde oírla","14 070 kHz, 3580 kHz"],["Decodificación","fldigi"]]},"ft8":{"t":"MFSK / FT8: ocho tonos","h":"La frecuencia sube y baja en escalones de 6,25 Hz, 0,16 s por escalón.","l":"Bandas de unos 50 Hz que duran 12,6 s y vuelven cada 15 s, sincronizadas con la hora: varias estaciones a la vez en 3 kHz, por ejemplo en 7,074 MHz (ficha 29).","r":[["Trama","79 símbolos de 0,16 s, tres patrones Costas (inicio, centro, final); aquí ocho estaciones"],["Frecuencias","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Decodificación","WSJT-X, JTDX (hora del PC exacta)"]]},"ft4":{"t":"FT4: el FT8 de los concursos","h":"Cuatro tonos separados 20,8 Hz, 20,8 baudios: 105 símbolos en 5 s, en turnos de 7,5 s.","l":"Bandas de unos 90 Hz, más cortas y anchas que el FT8, que vuelven cada 7,5 s. 14 080, 7047,5 kHz (ficha 29)."},"olivia":{"t":"Olivia 8/250: ocho tonos","h":"Ocho tonos separados 31,25 Hz, uno cada vez, que saltan al azar; codificación Walsh y entrelazado.","l":"Un bloque de puntos dispersos sobre 250 Hz; decodifica muy por debajo del ruido. Una pequeña melodía aleatoria al oído (ficha 29)."},"hell":{"t":"Feld Hell: escribir con una portadora","h":"La portadora se enciende y se apaga punto a punto: cada letra son columnas de 14 puntos, barridas de abajo arriba (245 puntos por segundo).","l":"En la cascada, una raya entrecortada; la pantalla del programa (fldigi) redibuja las letras. Un crepitar suave al oído (ficha 29)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Cuatro niveles de frecuencia: cada símbolo lleva dos bits.","l":"Un bloque rectangular de 6 a 12,5 kHz, lleno como el ruido, a menudo en ráfagas (el DMR reparte el canal en dos intervalos). Un «frrr» ronco al oído (ficha 46)."},"mt63":{"t":"MT63: mensajes de emergencia (NBEMS)","h":"64 tonos a la vez, cada uno modulado lentamente, con mucha redundancia.","l":"Un bloque plano de 1 o 2 kHz centrado en 1500 Hz, de bordes nítidos; un soplido regular. Pasa incluso por un micrófono pegado a un altavoz (ficha 31)."},"lora":{"t":"LoRa: rampas de frecuencia (chirps)","h":"La frecuencia barre todo el ancho y vuelve a empezar desde abajo: la posición del salto lleva los datos.","l":"Diagonales paralelas, fáciles de reconocer: Meshtastic y MeshCore en 869,525 MHz o 433 MHz, sensores LoRaWAN (fichas 13, 23 y 24)."},"sstv":{"t":"SSTV: imágenes en audio","h":"Un pulso de sincronía a 1200 Hz y luego la frecuencia sigue el brillo de la línea, de 1500 (negro) a 2300 Hz (blanco).","l":"Rayas de sincronía regulares y una nube que cambia con la imagen; un sonido que «gorjea» durante uno o dos minutos. 14,230 MHz, ISS en 145,800 MHz (ficha 37).","r":[["Trama","Cabecera VIS y luego líneas: sincronía 1200 Hz, verde, azul, rojo; aquí 20 líneas de una carta de ajuste"],["Decodificación","QSSTV, MMSSTV, Robot36 en el móvil"]]},"fax":{"nm":"Fax meteorológico","t":"Fax meteorológico: 1500 Hz negro, 2300 Hz blanco","h":"La frecuencia pasa del negro al blanco de forma continua, 120 líneas por minuto.","l":"Dos bandas fijas en 1500 y 2300 Hz (800 Hz de separación), un «tic-tac» regular. Las frecuencias publicadas son las de la portadora: escucha en USB 1,9 kHz más abajo (ficha 38).","r":[["Trama","Tono de inicio de 300 Hz, líneas de fase (pulso blanco) y luego el mapa"],["Decodificación","fldigi, JWX, HamFax"]]},"elt":{"nm":"Sirena ELT","t":"Sirena ELT / PLB en 121,5 MHz","h":"Una AM cuyo tono baja de 1600 a 300 Hz, de dos a cuatro veces por segundo.","l":"Una portadora fija y bandas laterales que se deslizan en abanico: el «uu-uu» de las radiobalizas de socorro, también en 121,375 MHz para ejercicios (fichas 27 y 28)."},"406":{"nm":"Baliza 406","t":"Baliza 406 MHz: ráfaga BPSK","h":"Medio segundo de emisión: 160 ms de portadora pura, luego la fase oscila ±1,1 radián a 400 bit/s.","l":"Una rayita corta que vuelve cada 50 s, entre 406,0 y 406,1 MHz; nada útil que oír, hace falta un decodificador (EPIRB 406, ficha 28)."},"adsb":{"t":"ADS-B / modo S (1090 MHz): impulsos","h":"Impulsos de 0,5 µs cuya posición lleva los bits (PPM); aquí la escala de tiempo está muy ralentizada.","l":"Rayas horizontales muy cortas en todo el ancho, cientos por segundo cerca de un aeropuerto; hace falta una llave SDR (ficha 15).","n":"escala de tiempo muy ralentizada"},"acars":{"t":"ACARS: AM y datos MSK","h":"Una AM que transporta dos tonos, 1200 y 2400 Hz, a 2400 bit/s.","l":"Ráfagas de medio segundo con portadora y bandas laterales, en 131,525, 131,725 o 131,825 MHz en Europa: un «brrrt» al oído (ficha 16)."},"ais":{"t":"AIS: GMSK 9600 baudios en dos canales","h":"Una FSK suavizada (GMSK) en ráfagas de 26 ms, una vez en 161,975 MHz, otra en 162,025 MHz (escala reducida).","l":"Dos columnas de rayitas breves, a 50 kHz, un chasquido regular; cuantos más barcos, más denso (ficha 19).","n":"escala reducida"},"navtex":{"t":"NAVTEX y LSD en onda media y corta: FSK 170 Hz","h":"Como el RTTY: dos frecuencias separadas 170 Hz, pero a 100 baudios.","l":"Dos rayas paralelas continuas durante el boletín, en 518 y 490 kHz (NAVTEX) o 2187,5 kHz (llamada selectiva digital) (ficha 20).","r":[["Código","SITOR-B, CCIR 476: 7 bits con cuatro «1», con repetición FEC"],["Decodificación","fldigi, YaND"]]},"hfdl":{"t":"HFDL: los aviones en onda corta","h":"Una PSK de 1800 baudios sobre una subportadora de 1440 Hz.","l":"Ráfagas de unos 2,4 kHz entre 2,9 y 22 MHz; un siseo de módem que va y viene (ficha 17)."},"ctcss":{"t":"CTCSS: subtono bajo la voz","h":"Un tono grave y continuo (67 a 254 Hz, aquí 88,5 Hz) añadido a la voz.","l":"Visto en el sonido del receptor FM: una raya fija abajo del todo, bajo la voz; abre el silenciador de repetidores y walkies (ficha 10)."},"dtmf":{"sh":"2 tonos","t":"DTMF: dos tonos por tecla","h":"Cada tecla envía un tono grave (697 a 941 Hz) y uno agudo (1209 a 1633 Hz) a la vez.","l":"Pares de puntos alineados en ocho columnas fijas; el «bip-bip» de los números de teléfono y de los mandos de repetidores (ficha 10).","r":[["Secuencia","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tonos","t":"Selcall CCIR: tonos en secuencia","h":"Cinco tonos de 100 ms uno tras otro, uno por cifra.","l":"Una pequeña escalera de puntos, repetida; un «tululululu» rápido para llamar a una radio concreta (ficha 33).","r":[["Secuencia","1 2 3 4 5, dos veces; también lo decodifica la app SelCall del UV-K1"]]},"pocsag":{"sh":"buscas","t":"POCSAG y FLEX: buscapersonas","h":"Una FSK a ±4,5 kHz; un preámbulo 1010… y luego los datos (escala reducida).","l":"Dos rayas nítidas durante el preámbulo y luego una banda llena; un «brrrrt» estridente. 466,075 MHz, DAPNET 439,9875 MHz (ficha 45).","n":"escala reducida"},"ale":{"sh":"8 tonos","t":"ALE: llamada automática en onda corta","h":"Ocho tonos de 750 a 2500 Hz, 125 baudios, en ráfagas.","l":"Un bloque de unos 2 kHz hecho de puntitos, de uno a dos segundos, a veces en varias frecuencias vecinas; un gorjeo agudo (ficha 34)."},"rs41":{"nm":"Radiosonda RS41","t":"Radiosonda RS41: GFSK continua","h":"Una FSK suavizada a 4800 baudios, sin parar; la frecuencia deriva despacio cuando la sonda sube y se enfría.","l":"Una banda de unos 10 kHz que se desliza en diagonal durante todo el vuelo, entre 400 y 406 MHz (ficha 21)."},"ook":{"nm":"Sensores 433","t":"Sensores 433 MHz: OOK","h":"La portadora se enciende y se apaga en impulsos cortos o largos (todo o nada); el mensaje se repite tres veces.","l":"Ráfagas de puntitos, a menudo por triplicado, en 433,92 MHz: estaciones meteorológicas, sondas de temperatura, mandos a distancia (ficha 22)."},"fhss":{"t":"Bluetooth: saltos de frecuencia (FHSS)","h":"La frecuencia cambia 1600 veces por segundo entre 79 canales (escala reducida).","l":"Rayitas esparcidas por todas partes en 80 MHz de ancho, nunca en el mismo sitio, hacia 2,4 GHz (ficha 25).","n":"escala reducida"},"wspr":{"t":"WSPR: balizas de propagación","h":"Cuatro tonos separados 1,46 Hz, 0,68 s por símbolo, durante 110,6 s.","l":"Una raya muy fina de unos 6 Hz que dura casi dos minutos, cada dos minutos pares: hay que ampliar mucho (ficha 29).","n":"extracto de 24 s (una emisión dura 110,6 s)"},"qrss":{"t":"QRSS: Morse muy lento","h":"Una portadora encendida y apagada, con puntos de 3 a 10 s, a menudo en dos frecuencias vecinas (DFCW).","l":"Rayas de pocos Hz de ancho que se leen en una pantalla de diez minutos; inaudible al oído (ficha 30).","n":"acelerado: punto de 0,6 s en lugar de 3 a 10 s"},"texte":{"nm":"Texto en la cascada","t":"Texto en la cascada","h":"Cada línea de una imagen se convierte en un grupo de tonos: el sonido parece ruido.","l":"El texto o el dibujo aparece directamente en la pantalla del SDR (ficha 40).","r":[["Nota","Emitido desde abajo de la imagen: al derecho en la cascada en directo, al revés en la huella (leída de arriba abajo)"]]},"vara":{"t":"Datos HF modernos: VARA, Pactor, ARDOP","h":"Largas ráfagas llenas (OFDM o PSK) y, entre ellas, respuestas cortas de la otra estación.","l":"Un rectángulo de unos 2,4 kHz que se para y vuelve a empezar, con un pequeño acuse de recibo en medio; un siseo entrecortado (ficha 29)."},"chirp":{"nm":"Sondeador ionosférico","t":"Sondeador ionosférico (chirp sounder)","h":"Una rampa de frecuencia lenta que cruza toda la banda HF; los ecos de la ionosfera llegan un poco después.","l":"Una diagonal que barre la pantalla, acompañada de rayas paralelas (los ecos); un «ffuit» que pasa en una fracción de segundo."},"oth":{"nm":"Radar transhorizonte","t":"Radar transhorizonte («woodpecker»)","h":"Impulsos repetidos de 10 a 50 veces por segundo, cada uno de varios kHz de ancho.","l":"Un bloque ancho y rayado que cubre bandas enteras; un golpeteo de pájaro carpintero muy regular en onda corta."},"parasites":{"nm":"Interferencias","sh":"fuente","t":"Interferencias de una fuente conmutada","h":"Una señal cuadrada: su frecuencia y todos sus armónicos salen a la vez.","l":"Un peine de rayas regulares que derivan juntas sobre un fondo de ruido: búscalo con NOISE FIND o con un receptor portátil (ficha K22)."},"mpx":{"nm":"FM estéreo y RDS","t":"Radio FM estéreo y RDS","h":"El sonido demodulado (multiplex) contiene la vía L+R, un piloto a 19 kHz, la vía L-R alrededor de 38 kHz y el RDS a 57 kHz.","l":"Visto de 0 a 60 kHz tras la demodulación: un bloque grave, una raya fina a 19 kHz, un bloque más débil en el centro y el RDS arriba del todo (ficha 12).","n":"escala ÷ 20; sonido estéreo","r":[["Escucha","Con auriculares: 4 s en mono (el bloque del centro, L-R, desaparece) y luego 4 s en estéreo, la melodía a la izquierda y los acordes a la derecha."]]},"dcf77":{"t":"Señal horaria DCF77 (77,5 kHz)","h":"Una portadora que baja al 15 % durante 0,1 s (bit 0) o 0,2 s (bit 1), al inicio de cada segundo.","l":"Una raya fija con un corte negro cada segundo; el segundo 59 no lo tiene, para marcar el minuto (ficha 12).","r":[["Nota","Aquí la portadora se lleva a 1000 Hz; el 6.º segundo no tiene corte, como el segundo 59 de cada minuto"]]},"ofdm":{"t":"OFDM: decenas de subportadoras","h":"Muchas portadoras muy juntas, cada una lenta: la suma parece ruido.","l":"Un rectángulo plano de bordes nítidos, siempre presente: DRM en onda corta (10 kHz), DAB+ (1,5 MHz), TDT, wifi. Un soplido continuo al oído (fichas 12 y 25)."},"dsss":{"t":"Espectro ensanchado (DSSS): GPS, wifi 802.11b","h":"Los datos se mezclan con un código muy rápido: la energía se reparte en un gran ancho.","l":"Una joroba ancha, apenas por encima del ruido; el GPS está incluso por debajo del ruido y no se ve sin tratamiento (fichas 25 y 26)."},"hline":{"nm":"Línea del hidrógeno","sh":"1420 MHz","t":"Línea del hidrógeno de 21 cm (1420,405 MHz)","h":"El hidrógeno frío de la Vía Láctea emite un soplido muy débil en 1420,405 MHz. El movimiento de los brazos de la galaxia lo desplaza por efecto Doppler: se ven varias jorobas pequeñas.","l":"Casi nada en la cascada de un segundo a otro: hay que promediar mucho tiempo para ver las jorobas salir del ruido. Aquí, mira el espectro medio en pausa. Basta una parábola o una bocina, un preamplificador y una llave SDR.","n":"señal muy exagerada"},"sun":{"nm":"Sol","sh":"ráfagas","t":"Sol: ráfagas de radio de tipo III","h":"Electrones lanzados por una erupción atraviesan la corona solar y la hacen emitir cada vez más bajo en frecuencia a medida que se alejan.","l":"Rayas que caen en diagonal de arriba abajo del espectro en menos de un segundo, sobre un fondo de ruido solar; un «chhhh» que crece. De unos 10 a 400 MHz, también en onda corta hacia 20 MHz."},"jupiter":{"nm":"Júpiter","sh":"20 MHz","t":"Júpiter: ráfagas decamétricas (L y S)","h":"El campo magnético de Júpiter y su luna Ío producen emisiones potentes entre 15 y 40 MHz: ráfagas L lentas y ráfagas S muy cortas que bajan deprisa.","l":"Primero olas de soplido (L, como la resaca del mar), luego trenes de pequeños «pops» (S) en diagonales apretadas. Hacia 20,1 MHz de noche, con un simple dipolo, cuando Ío está bien situada."},"pulsar":{"nm":"Púlsar","sh":"B0329+54","t":"Púlsar PSR B0329+54","h":"Una estrella de neutrones que gira barre la Tierra con un haz de radio, aquí cada 0,714 s. El gas interestelar retrasa las frecuencias bajas: cada impulso llega primero arriba del espectro.","l":"Un «tic» regular; en la cascada, cada impulso es una curva que baja (dispersión). La señal real está bajo el ruido: hace falta una gran antena y sumar los impulsos sobre su período.","n":"señal muy exagerada"},"meteor":{"nm":"Meteoros","sh":"GRAVES","t":"Ecos de meteoros del radar GRAVES (143,050 MHz)","h":"El radar francés GRAVES emite sin parar en 143,050 MHz. Cuando una estrella fugaz ioniza el aire, su estela devuelve un poco de esa señal a tu receptor, de una fracción de segundo a unos segundos.","l":"En USB en 143,049 MHz: «pings» breves hacia 1000 Hz, a veces un eco que se desliza (la cabeza del meteoro, efecto Doppler) o que dura. Muchos más durante las lluvias (Perseidas, Gemínidas) (ficha 1)."},"whistler":{"nm":"Silbidos","sh":"VLF","t":"Silbidos VLF (whistlers)","h":"Un rayo crea un chasquido de radio; una parte sigue las líneas del campo magnético terrestre hasta el otro hemisferio y vuelve, los agudos primero.","l":"Un «fiuuu» que baja de agudo a grave en uno o dos segundos, justo tras un chasquido; crujidos (sferics) por todas partes. Por debajo de 10 kHz, con un receptor VLF lejos de las líneas eléctricas."},"chorus":{"nm":"Coro del amanecer","sh":"VLF","t":"Coro del amanecer (dawn chorus)","h":"Durante una tormenta magnética, electrones atrapados en la magnetosfera emiten pequeñas notas ascendentes, sobre todo al amanecer.","l":"Gorjeos ascendentes que se solapan, como pájaros, de 1 a 4 kHz aproximadamente. El mismo equipo que para los silbidos."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"El primer satélite artificial emitía pitidos de unos 0,3 s en 20,005 y 40,002 MHz, alternando, durante tres semanas.","l":"Una raya cortada con regularidad: «bip… bip…», el sonido que escuchó todo el mundo en octubre de 1957 (reconstrucción)."},"doppler":{"nm":"Efecto Doppler","sh":"satélite","t":"Baliza de satélite y efecto Doppler","h":"Un satélite en órbita baja se acerca y luego se aleja: la frecuencia recibida baja durante el pase, unos ±3 kHz en 145 MHz y ±10 kHz en 435 MHz.","l":"Una raya que baja en forma de S: despacio al principio, deprisa cuando el satélite pasa más cerca, y otra vez despacio (ficha 41).","n":"pase de 10 min reducido a 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satélites NOAA: imágenes APT (histórico)","h":"Una subportadora de 2400 Hz modulada en amplitud por la imagen, dos líneas por segundo, con un pulso de sincronía al inicio de cada línea. Se apagó en 2025; hoy los Meteor-M emiten en LRPT.","l":"Una raya en 2400 Hz con bandas laterales que cambian con la imagen, y el famoso «tic-tac» dos veces por segundo (ficha 41)."},"eme":{"nm":"Eco de la Luna","sh":"EME","t":"Eco de la Luna (EME)","h":"Una señal enviada a la Luna vuelve unos 2,5 s después, muchísimo más débil, algo ensanchada y desplazada por el Doppler.","l":"Se oye el propio «bip» y luego su eco débil y algo borroso 2,5 s después. Los radioaficionados lo hacen en CW o JT65, en 144 MHz y más arriba (ficha 1).","n":"eco muy exagerado"},"msk144":{"nm":"MSK144","sh":"meteoros","t":"MSK144: el modo digital de los meteoros","h":"Dos tonos, 1000 y 2000 Hz, a 2000 baudios, en tramas de 72 ms repetidas sin parar: cada estela de meteoro deja pasar algunas.","l":"Ráfagas de 0,1 a 1 s, de unos 2,4 kHz de ancho, que aparecen y se apagan con el «ping» del meteoro. En 50 y 144 MHz, con WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tonos","t":"JT65: 65 tonos, muy lento","h":"Un tono de sincronía y 64 tonos de datos separados 2,7 Hz (JT65A), 0,37 s por símbolo, 47 s de emisión por minuto.","l":"Una escalera de rayitas sobre unos 180 Hz, con una raya de sincronía que vuelve siempre al mismo sitio. Se usa para el rebote lunar (JT65B y C) y señales muy débiles.","n":"extracto de 20 s (una emisión dura 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: red digital profesional","h":"Modulación de fase π/4-DQPSK a 18 000 símbolos por segundo, cuatro canales repartidos en el tiempo, en canales de 25 kHz.","l":"Un bloque lleno de flancos redondeados, siempre presente cerca de un repetidor; un soplido ronco. Cifrado: no se puede escuchar (ficha 46).","n":"escala reducida"},"ndb":{"nm":"Radiofaro NDB","sh":"190–535 kHz","t":"NDB: radiofaro no direccional","h":"Una portadora fija en onda larga, con un indicativo Morse de dos o tres letras enviado sobre un tono (a menudo 1020 Hz).","l":"Una raya fija en el centro y, durante el indicativo, dos rayitas a cada lado. De unos 190 a 535 kHz, en BLU o CW (ficha 12)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: radiofaro omnidireccional","h":"En AM: una señal de 30 Hz que depende de la dirección, una subportadora de 9960 Hz modulada en frecuencia a 30 Hz (la referencia) y el indicativo Morse en 1020 Hz.","l":"En el sonido demodulado: un zumbido grave de 30 Hz, una raya ancha ondulante hacia 10 kHz y el indicativo de vez en cuando (ficha 18).","n":"sonido demodulado, escala ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: guiado de aterrizaje (localizador)","h":"En AM, dos tonos de 90 y 150 Hz; su relación indica al avión si está a la izquierda o a la derecha del eje. El indicativo Morse empieza por I.","l":"En el sonido demodulado: dos rayas muy graves en 90 y 150 Hz y el indicativo en 1020 Hz. Entre 108,1 y 112 MHz; la senda de planeo está hacia 330 MHz (ficha 18)."},"m10":{"nm":"Sondas M10 / M20","sh":"Meteomodem","t":"Radiosondas M10 y M20 (Meteomodem)","h":"Una trama por segundo en FSK rápida (unos 9600 baudios): más ancha que la RS41. Las lanza en Francia Météo-France.","l":"Una ráfaga ancha cada segundo que deriva despacio durante el vuelo; entre 400 y 406 MHz (ficha 21)."},"tpms":{"nm":"Neumáticos (TPMS)","sh":"433 MHz","t":"Sensores de presión de neumáticos (TPMS)","h":"Cada rueda envía de vez en cuando una ráfaga FSK de pocos milisegundos: presión, temperatura, identificador.","l":"Pequeñas ráfagas aisladas en 433,92 MHz (o 315 MHz), a menudo de dos en dos, al pasar un coche. Las decodifica rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Señal horaria ALS162 (Allouis, 162 kHz)","h":"La portadora de la antigua onda larga de France Inter; la hora se codifica con pequeñas modulaciones de fase, inaudibles.","l":"Una raya fija, muy fuerte en Francia, apenas ensanchada al inicio de cada segundo; hace falta un decodificador para leer la hora (ficha 12)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Señal horaria WWV (Colorado)","h":"En AM: un «tic» de 5 ms a 1000 Hz cada segundo, un tono de 500 o 600 Hz, un código horario en 100 Hz y una voz que anuncia la hora UTC.","l":"En el sonido demodulado: una raya en 500 Hz cortada cada segundo, el tic en 1000 Hz y el código abajo del todo en 100 Hz (ficha 12)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Señal horaria MSF (Anthorn, 60 kHz)","h":"La portadora se corta al inicio de cada segundo durante 0,1, 0,2 o 0,3 s según los bits, y 0,5 s para marcar el minuto.","l":"Una raya fija con huecos negros completos cada segundo, más largos que con DCF77 (ficha 12)."},"type2":{"nm":"Sol tipo II","sh":"onda de choque","t":"Sol: ráfagas de radio de tipo II","h":"La onda de choque de una eyección de masa coronal hace emitir al plasma cada vez más bajo, despacio, a menudo en dos bandas (la fundamental y su doble).","l":"Dos bandas de ruido paralelas que bajan suavemente durante varios minutos. Compáralas con las de tipo III, mucho más rápidas.","n":"varios minutos reducidos a 6 s"},"tweeks":{"nm":"Tweeks","sh":"VLF","t":"Tweeks: los «pings» nocturnos en VLF","h":"De noche, el chasquido de un rayo lejano rebota entre el suelo y la ionosfera; las frecuencias cercanas al corte (hacia 1,7 kHz) llegan las últimas.","l":"Un pequeño «ping» que baja y se detiene hacia 1,7 kHz, a veces con un eco al doble; crujidos por todas partes. Por debajo de 10 kHz, de noche."},"hiss":{"nm":"Soplido VLF","sh":"hiss","t":"Soplido VLF (hiss)","h":"Un ruido ancho producido por los electrones de la plasmasfera, que sube y baja con la actividad magnética.","l":"Una banda de soplido de unos cientos de Hz a unos kHz, sin patrón, que crece y decae despacio."},"aurora":{"nm":"Aurora radio","sh":"Au","t":"Propagación auroral (Au)","h":"Una aurora boreal refleja las ondas VHF, pero las agita muy deprisa: cada señal se reparte sobre varios cientos de Hz.","l":"La CW se vuelve un soplido áspero, como susurrado; ya no se oye la nota. En 50 y 144 MHz, apuntando al norte durante las tormentas magnéticas."},"galactic":{"nm":"Ruido galáctico","sh":"20–40 MHz","t":"Ruido de la Vía Láctea","h":"El centro de la galaxia emite un soplido de radio que Karl Jansky descubrió en 1932 hacia 20 MHz. Sube y baja con la rotación de la Tierra.","l":"Un ruido de fondo que sube despacio y vuelve a bajar, cada día unos 4 minutos antes. Visible con un simple dipolo entre 20 y 40 MHz.","n":"un día reducido a 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"Telemetría de CubeSat","h":"Los pequeños satélites envían con regularidad sus medidas (batería, temperaturas) en FSK o GMSK a 1200 o 9600 baudios, hacia 435–438 MHz.","l":"Ráfagas regulares que bajan un poco cada vez, por efecto Doppler, durante el pase (ficha 41).","n":"escala reducida, pase acelerado"},"issfm":{"nm":"ISS en FM","sh":"145,800 MHz","t":"Estación espacial (ISS): voz en FM","h":"Los astronautas hablan con colegios y radioaficionados en FM en 145,800 MHz. La estación va a 28 000 km/h: durante el pase, la frecuencia recibida se desliza de unos +3,5 kHz a −3,5 kHz.","l":"Una banda de voz FM que se desplaza despacio de derecha a izquierda durante los 10 minutos del pase (ficha 41).","n":"pase de 10 min reducido a 10 s"},"buzzer":{"nm":"UVB-76 «The Buzzer»","sh":"4625 kHz","t":"UVB-76, «The Buzzer» (4625 kHz)","h":"Una estación militar rusa que emite desde hace décadas un zumbido de un segundo repetido unas 25 veces por minuto, a veces interrumpido por un mensaje de voz.","l":"Una portadora fija y, en cada zumbido, una columna de rayas apretadas de arriba abajo. Fácil de encontrar en 4625 kHz en USB."},"pip":{"nm":"«The Pip»","sh":"3756 / 5448 kHz","t":"«The Pip»: pitidos sin fin","h":"Otra baliza militar rusa de onda corta que repite pequeños pitidos breves, día y noche, a veces interrumpidos por mensajes.","l":"Una raya fija cortada por un pitido breve unas 50 veces por minuto; al oído, un «pip… pip…» regular que nunca para.","n":"ritmo aproximado"},"squeaky":{"nm":"«Squeaky Wheel»","sh":"OC","t":"«Squeaky Wheel»: la rueda que chirría","h":"Una baliza militar rusa de onda corta, bautizada por los escuchas según su motivo sonoro repetido.","l":"Un pequeño motivo de dos sonidos, uno de ellos ascendente, repetido en bucle: como una rueda que chirría.","n":"imitación aproximada"},"codar":{"nm":"CODAR","sh":"radar oceánico","t":"CODAR: radares de corrientes marinas","h":"Radares costeros barren una banda de frecuencias una o dos veces por segundo para medir corrientes y olas.","l":"Diagonales paralelas regulares y un «swish» repetido; hacia 4,5–5,5 MHz, 13 MHz y 25 MHz, a menudo día y noche.","n":"escala reducida"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Módem militar STANAG 4285","h":"Modulación de fase 8-PSK a 2400 baudios sobre una portadora de 1800 Hz, con una secuencia de prueba cada 107 ms para seguir el canal.","l":"Un bloque lleno de unos 3 kHz; al oído, un soplido con un zumbido regular (ficha 43)."},"link11":{"nm":"Link-11","sh":"16 tonos","t":"Link-11: enlace de datos naval","h":"Dieciséis tonos de 605 a 2915 Hz emitidos juntos, cada uno modulado en fase 75 veces por segundo.","l":"Un peine de catorce rayas regulares de 935 a 2365 Hz, más dos rayas apartadas en 605 y 2915 Hz; al oído, un zumbido musical (ficha 43)."},"numbers":{"nm":"Estación de números","sh":"voz","t":"Estación de números","h":"A hora fija, una pequeña melodía de llamada y luego una voz (a menudo sintética) que lee grupos de cinco cifras, en AM o BLU.","l":"La melodía en notas sueltas y después grupos regulares de sílabas separados por silencios (ficha 43).","n":"voz imitada, sin cifras reales"},"rttydwd":{"nm":"RTTY meteo DWD","sh":"50 Bd / 450 Hz","t":"RTTY meteorológico del DWD (Alemania)","h":"Como el RTTY de los radioaficionados, pero a 50 baudios con 450 Hz de separación: el servicio meteorológico alemán envía sus boletines y previsiones marinas en texto claro.","l":"Dos rayas mucho más separadas y un ritmo algo más rápido. Entre boletines, la llamada «CQ CQ CQ DE DDK2 DDH7 DDK9» y luego RYRYRY. En 4583, 7646 y 10 100,8 kHz, también 147,3 kHz (ficha 32)."},"mfsk16":{"nm":"MFSK16","sh":"16 tonos","t":"MFSK16: dieciséis tonos","h":"Dieciséis tonos separados 15,625 Hz, uno cada vez, 15,625 veces por segundo; cada tono lleva cuatro bits, protegidos por un código corrector.","l":"Una banda de 316 Hz hecha de pequeños escalones que saltan sin parar, tras un tono fijo al principio. Al oído, una musiquilla rápida, como una flauta. También sirve para enviar pequeñas imágenes."},"sitora":{"nm":"SITOR-A (ARQ)","sh":"télex","t":"SITOR-A: el télex marítimo en ARQ","h":"La estación envía bloques de tres caracteres (210 ms, 100 baudios, 170 Hz de separación) cada 450 ms; entre bloques, la otra estación responde con una señal breve que significa «recibido» o «repite».","l":"Ráfagas cortas y regulares con una pequeña respuesta más débil entre ellas: un «chip-chip» de grillo. Hoy es raro en onda corta."},"dscvhf":{"nm":"LSD VHF (canal 70)","sh":"DSC","t":"LSD / DSC: llamada selectiva digital en el canal 70","h":"Una ráfaga de medio segundo aproximadamente a 1200 baudios, con dos tonos de 1300 y 2100 Hz: lleva el número MMSI del barco, el tipo de llamada y, en caso de socorro, su posición.","l":"Un «brrrt» breve y agudo en 156,525 MHz, que empieza con una serie de bits alternos. En onda media y corta, la LSD es FSK a 100 baudios, como el NAVTEX (ficha 20)."},"selcal":{"nm":"SELCAL aviación","sh":"4 tonos","t":"SELCAL: llamada selectiva de aviones en onda corta","h":"El control llama a un avión concreto con dos impulsos de un segundo aproximadamente, cada uno formado por dos tonos de entre dieciséis (de 312,6 a 1479,1 Hz). En el avión se encienden un testigo y un timbre: la tripulación no tiene que escuchar todo el tiempo.","l":"Dos acordes seguidos, «bing-bong», entre los mensajes de voz de las frecuencias aeronáuticas en BLU, por ejemplo 5616 u 8864 kHz."},"dcs":{"nm":"DCS","sh":"134,4 bit/s","t":"DCS: el subtono digital","h":"En lugar de un tono continuo como el CTCSS, la radio envía bajo la voz una palabra de 23 bits repetida sin parar, a 134,4 bits por segundo. Al final, un tono de 134,4 Hz cierra el silenciador sin ruido.","l":"Visto en el sonido del receptor FM: una banda irregular abajo del todo, por debajo de 300 Hz, y un zumbido sordo si el filtro de la radio lo deja pasar (ficha 10)."},"t1750":{"nm":"Tono de 1750 Hz","sh":"repetidor","t":"Tono de 1750 Hz: abrir un repetidor","h":"Un tono breve de 1750 Hz (de 0,5 a 1 s) al inicio de la emisión abre todavía algunos repetidores de radioaficionados europeos; el repetidor suele responder con un pitido al soltar.","l":"Una raya corta en 1750 Hz, luego la voz y después el pitido del repetidor (ficha 10)."},"ncdxf":{"nm":"Balizas NCDXF","sh":"14,100 MHz","t":"Balizas NCDXF / IARU: probar la propagación","h":"Dieciocho balizas en todo el mundo emiten por turnos, diez segundos cada una, en 14,100, 18,110, 21,150, 24,930 y 28,200 MHz: el indicativo en Morse y luego cuatro rayas de un segundo a 100 W, 10 W, 1 W y 0,1 W.","l":"Un indicativo y cuatro rayas cada vez más débiles: si aún oyes la última, la propagación hacia esa baliza es excelente. Aquí 4U1UN (Nueva York) y luego VE8AT (Canadá) (ficha 30)."},"lrpt":{"nm":"Meteor-M LRPT","sh":"137,9 MHz","t":"Satélites Meteor-M: imágenes LRPT","h":"Los satélites meteorológicos rusos Meteor-M envían sus imágenes en digital: modulación de fase de cuatro estados (QPSK), 72 000 símbolos por segundo, unos 120 kHz de ancho.","l":"Un bloque lleno de bordes redondeados que se desliza despacio durante el pase (efecto Doppler); al oído, un simple soplido. En 137,9 o 137,1 MHz, decodificado con SatDump (ficha 41).","n":"escala reducida"},"quindar":{"nm":"Tonos Quindar","sh":"NASA","t":"Tonos Quindar: los pitidos del Apolo","h":"Cuando el control de Houston pulsa el micrófono, un pitido de 2525 Hz (250 ms) enciende los transmisores de las estaciones de tierra; al soltar, un pitido de 2475 Hz los apaga.","l":"Un pitido agudo antes de cada frase y otro, algo más grave, después: el célebre sonido de las grabaciones de las misiones Apolo."},"wow":{"nm":"Señal «Wow!»","sh":"1977","t":"La señal «Wow!» (15 de agosto de 1977)","h":"El radiotelescopio Big Ear (Ohio) captó durante 72 segundos una señal estrecha y muy fuerte cerca de la línea del hidrógeno, hacia 1420,456 MHz. El astrónomo Jerry Ehman escribió «Wow!» en el listado. Nunca se ha vuelto a ver y su origen sigue en discusión.","l":"Una raya fina que sale del ruido, crece y se apaga: la forma del paso de una fuente fija por el haz de la antena. Es una reconstrucción: no existe ninguna grabación sonora.","n":"72 s reducidos a 12 s"},"frb":{"nm":"Ráfaga rápida de radio","sh":"FRB","t":"Ráfaga rápida de radio (FRB)","h":"Un destello de radio de pocos milisegundos llegado de otra galaxia; el primero se descubrió en 2007. El gas que atraviesa retrasa mucho las frecuencias bajas: la ráfaga llega estirada, los agudos primero.","l":"Una sola curva que cae de arriba abajo del espectro, y luego nada. Algunas se repiten; la mayoría solo se ve una vez.","n":"muy ralentizado y exagerado"},"letterb":{"nm":"Balizas de una letra","sh":"D, P, S, C…","t":"Balizas de una letra","h":"Transmisores de la marina rusa repiten sin fin una sola letra en Morse, cada uno a 100 Hz de su vecino: D, P, S, C, A, F, K o M según el lugar.","l":"Líneas de puntos paralelas, muy juntas, cada una con su ritmo. Hacia 4558, 5154, 7039, 10 872, 13 528 y 16 332 kHz, en CW."},"sid":{"nm":"Fulguración solar en VLF","sh":"SID","t":"Fulguración solar vista en VLF (SID)","h":"Los emisores VLF de las marinas (20,9 kHz en Francia, 23,4 kHz en Alemania…) se propagan entre el suelo y la ionosfera. Cuando llega una fulguración solar, sus rayos X cambian la parte baja de la ionosfera en pocos minutos y el nivel recibido salta de golpe.","l":"Una banda estrecha y regular (la señal MSK del emisor) que de pronto se hace más fuerte y luego vuelve despacio a la normalidad. Bastan un bucle de cable y una tarjeta de sonido: un montaje clásico de los clubes de astronomía.","n":"una hora reducida a 12 s"},"qrn":{"nm":"Estática de tormenta","sh":"QRN","t":"Estática de tormenta (QRN)","h":"Cada rayo es un emisor muy potente que cubre todas las frecuencias a la vez. En onda media y corta se oyen tormentas a miles de kilómetros, sobre todo en verano y en las bandas bajas.","l":"Rayas horizontales irregulares en todo el ancho; chasquidos secos al oído. El supresor de ruido (NB) ayuda un poco, una antena de cuadro ayuda más."},"fading":{"nm":"Desvanecimiento selectivo","sh":"QSB","t":"Desvanecimiento selectivo (QSB)","h":"En onda corta la señal llega por varios caminos a través de la ionosfera. Según la frecuencia, se suman o se anulan: un hueco estrecho se pasea por la señal.","l":"Una zona oscura que se mueve despacio dentro de la emisora de AM. Cuando pasa por la portadora, en el centro, el sonido se vuelve ronco y deformado unos segundos; la detección síncrona o la escucha en BLU lo corrigen."},"plc":{"nm":"PLC","sh":"2–30 MHz","t":"PLC: Internet por los enchufes","h":"Los adaptadores PLC envían los datos por los cables de la casa con cientos de portadoras entre 2 y 30 MHz (más arriba en los modelos recientes), una cada 24,4 kHz. Los cables radian como una antena.","l":"Un peine de rayas regulares que parpadea por paquetes, con huecos en las bandas de radioaficionados (muescas previstas por la norma); al oído, un crepitar que sigue el tráfico de Internet (ficha 43).","n":"escala reducida"},"fence":{"nm":"Cerca eléctrica","sh":"tac… tac…","t":"Cerca eléctrica","h":"El pastor eléctrico envía al cable un impulso de varios miles de voltios, más o menos una vez por segundo. Si la hierba toca el cable o un aislador está dañado, salta una chispa que radia en todas las frecuencias.","l":"Una raya horizontal muy fina en todo el ancho, a intervalos perfectamente regulares; un «tac… tac…» desde la onda larga hasta VHF. Su ritmo regular lo distingue de la tormenta."},"gsm":{"nm":"Teléfono GSM","sh":"217 Hz","t":"Teléfono GSM junto a un altavoz","h":"Un teléfono 2G emite en ráfagas de 0,577 ms, 217 veces por segundo. Un amplificador de audio mal apantallado detecta esas ráfagas y las hace audibles.","l":"Un peine de rayas cada 217 Hz; el famoso «ta-ta-tatata» justo antes de que suene el teléfono y luego un zumbido continuo durante la llamada. Cada vez más raro: las redes 2G se van apagando."},"jjy":{"nm":"JJY","sh":"40 / 60 kHz","t":"Señal horaria JJY (Japón, 40 y 60 kHz)","h":"En cada segundo la portadora está a plena potencia durante 0,8 s (bit 0), 0,5 s (bit 1) o 0,2 s (marca) y luego cae al 10 %. Es lo contrario de DCF77, que baja al inicio del segundo.","l":"Una raya fija que se debilita al final de cada segundo, antes o después. Emisores de Fukushima (40 kHz) y Saga-Fukuoka (60 kHz), para los relojes radiocontrolados de Japón."},"rwm":{"nm":"RWM","sh":"4996 kHz","t":"Señal horaria RWM (Moscú)","h":"En telegrafía en 4996, 9996 y 14 996 kHz: un impulso de 100 ms cada segundo y, en otros minutos, diez impulsos por segundo. El indicativo RWM se envía en Morse dos veces por hora.","l":"El indicativo, luego una raya cortada en «tics» regulares y después en puntos rápidos. Se escucha en CW o BLU.","n":"extracto condensado"},"bpm":{"nm":"BPM","sh":"2,5–15 MHz","t":"Señal horaria BPM (China)","h":"La estación de Pucheng (Shaanxi) emite en AM en 2,5, 5, 10 y 15 MHz: un tic de 10 ms a 1000 Hz cada segundo (300 ms en el minuto) y, en ciertos minutos, tics de 100 ms para el tiempo UT1. El indicativo BPM se da en Morse y luego con una voz.","l":"En el sonido demodulado: el indicativo y luego rayas muy cortas a 1000 Hz, una por segundo, con una más larga en el minuto. A menudo mezclada con WWV en las mismas frecuencias.","n":"extracto condensado"},"humpback":{"nm":"Ballena jorobada","sh":"canto","t":"El canto de la ballena jorobada","h":"En invierno, en las zonas de reproducción, los machos cantan: una serie de gemidos, gruñidos y gritos que forma un tema, repetido igual durante horas y que cambia de una temporada a otra. Los hidrófonos lo oyen a decenas de kilómetros.","l":"Trazos gruesos con sus armónicos, que suben o bajan lentamente entre 100 Hz y unos kHz; la misma serie vuelve a los pocos segundos. El eco en la superficie y el fondo alarga cada nota."},"bluewhale":{"nm":"Ballena azul","sh":"×10","t":"La ballena azul: la llamada más grave","h":"El animal más grande del mundo emite llamadas muy graves (10 a 40 Hz) y muy potentes, de 10 a 20 segundos, repetidas durante horas: llegan a cientos de kilómetros. Para oírlas, la grabación se acelera diez veces.","l":"Una parte pulsada y luego una nota larga que apenas baja, con sus armónicos encima; la secuencia se repite. La escala muestra las frecuencias reales.","n":"acelerado 10 veces"},"finwhale":{"nm":"Rorcual común","sh":"20 Hz","t":"El rorcual común: los pulsos de 20 Hz","h":"El rorcual común emite pulsos de un segundo que bajan de unos 25 a 18 Hz, a intervalos regulares, a veces durante días. En los años 1950-60 estas «señales de 20 Hz» intrigaron a las redes de escucha de la marina estadounidense antes de atribuirse a este rorcual.","l":"Trazos cortos, todos iguales, en serie regular o por parejas, como los latidos de un corazón muy lento; cada uno baja un poco de frecuencia. La escala muestra las frecuencias reales.","n":"acelerado 10 veces"},"sperm":{"nm":"Cachalote","sh":"clics","t":"Los clics del cachalote","h":"El cachalote caza en inmersión profunda con su sonar: clics muy potentes, uno por segundo aproximadamente, que se aceleran en un «crujido» al acercarse a la presa. Entre ellos intercambian «codas», series cortas de clics cuyo ritmo cambia de un clan a otro.","l":"Trazos horizontales en todo el ancho, regularmente espaciados, luego apretados en un zumbido (el crujido) y por último un pequeño motivo rítmico: la coda. Cada clic está formado por varios pulsos muy juntos, debidos a reflexiones en la cabeza del animal."},"dolphin":{"nm":"Delfín mular","sh":"silbidos","t":"Silbidos y clics del delfín","h":"El delfín mular silba entre unos 5 y 20 kHz; cada individuo tiene un «silbido firma» que le sirve de nombre. Para cazar y orientarse emite también trenes de clics muy breves, hasta varios cientos por segundo.","l":"Curvas finas que suben y vuelven a bajar, a menudo repetidas igual, y ráfagas de trazos horizontales para la ecolocalización. Las frecuencias se dividen entre 3 para que sean audibles; la escala muestra los valores reales.","n":"3 veces más grave"},"orca":{"nm":"Orca","sh":"gritos pulsados","t":"Los gritos pulsados de la orca","h":"Las orcas se comunican con gritos pulsados: trenes de pulsos tan rápidos (500 a 2000 por segundo) que se oyen como una nota, con un salto brusco de tono. Cada grupo familiar tiene su propio «dialecto».","l":"Una pila de trazos paralelos (los armónicos) que suben o bajan juntos, con un quiebro neto en mitad del grito; a veces un silbido fino y más agudo."},"bseal":{"nm":"Foca barbuda","sh":"trino","t":"El trino de la foca barbuda","h":"En primavera, bajo la banquisa ártica, el macho emite largos trinos que bajan en espiral desde varios kHz hasta unos cientos de hercios, a veces durante un minuto. Sirven para defender un territorio y atraer a las hembras.","l":"Una curva ondulada que se desliza de arriba abajo de la escala, como un muelle que se suelta, y una nota grave al final.","n":"acortado"},"shrimp":{"nm":"Camarones pistola","sh":"arrecife","t":"Los camarones pistola (alfeidos)","h":"Al cerrar su gran pinza, el camarón lanza un chorro de agua tan rápido que forma una burbuja de cavitación; al reventar, la burbuja chasquea como un disparo. Miles de camarones forman el ruido de fondo de los arrecifes y pueden molestar a los sonares.","l":"Una lluvia de puntos y trazos horizontales cortos en todo el ancho, sin ningún orden; en auriculares, un crepitar continuo, como una fritura."},"sonar":{"nm":"Sonar activo","sh":"ping","t":"El ping de un sonar activo","h":"Un buque envía un pulso sonoro potente (aquí hacia 3,5 kHz, la gama de los sonares de casco de las fragatas) y escucha el eco: el retardo da la distancia y el desplazamiento de frecuencia (efecto Doppler) la velocidad del blanco. El sonido vuelve también como una cola desde el fondo y la superficie: la reverberación.","l":"Un trazo corto y fuerte, una cola que se apaga y luego el eco, mucho más débil y algo desplazado en frecuencia. El segundo ping es un barrido de frecuencia (chirp), que mide mejor la distancia."},"propeller":{"nm":"Hélice de barco","sh":"cavitación","t":"La hélice de un barco que pasa","h":"Las palas de la hélice crean burbujas de cavitación que revientan: un soplo ancho, que late al ritmo del paso de las palas. Las máquinas añaden rayas fijas. Los operadores de sonar analizan ese ritmo (análisis DEMON) para contar las palas y la velocidad de giro, y reconocer el barco.","l":"Un soplo en una banda ancha, rayado con bandas horizontales al ritmo de las palas, con algunos trazos verticales fijos (motor, reductora). Todo crece y luego se apaga cuando el barco pasa sobre el hidrófono."},"uqc":{"nm":"Teléfono submarino","sh":"UQC 8 kHz","t":"El teléfono submarino (UQC, «Gertrude»)","h":"Submarinos y buques se hablan bajo el agua con un teléfono acústico: la voz se transmite en banda lateral única sobre una portadora de 8,0875 kHz, emitida por un transductor en el casco. Alcance: unos kilómetros.","l":"Una banda de voz BLU por encima de 8 kHz; demodulada, una voz lejana que ondula y resuena por los ecos en la superficie y el fondo. La pantalla está reducida a la mitad; la escala muestra las frecuencias reales.","n":"escala dividida por 2"},"zevs":{"nm":"ZEVS 82 Hz","sh":"ELF","t":"ZEVS: la radio de los submarinos a 82 Hz","h":"Las ondas de radio penetran muy mal en el agua de mar, salvo a frecuencias extremadamente bajas (ELF). El emisor ruso ZEVS, en la península de Kola, emite a 82 Hz con líneas de antena de decenas de kilómetros para llegar a los submarinos en inmersión profunda. La velocidad es mínima: unos pocos caracteres por minuto.","l":"Un trazo fino a 82 Hz junto a la raya de la red a 50 Hz y sus armónicos, con los parásitos de las tormentas. En auriculares, un zumbido grave apenas audible; se capta con un gran cuadro y una tarjeta de sonido. El equivalente estadounidense, a 76 Hz, cerró en 2004."},"bloop":{"nm":"El «Bloop»","sh":"1997","t":"El «Bloop» (1997)","h":"En 1997, los hidrófonos de la NOAA en el Pacífico captaron un sonido muy grave que subía rápidamente, oído a miles de kilómetros. Misterioso durante años, desde 2012 se atribuye a un sismo de hielo: un enorme iceberg que se resquebraja.","l":"Una banda ancha que sube en pocos segundos, con sus armónicos, y luego se apaga lentamente. Reconstrucción, acelerada 16 veces como la grabación difundida por la NOAA.","n":"acelerado 16 veces"}}},"de":{"ui":{"title":"VSISA","mystery":"Rätselton","play":"▶ Anhören","stop":"■ Stopp","noise":"Rauschen","volume":"Lautstärke","loop":"Schleife","specwf":"Spektrum + Wasserfall","cursor":"Cursor","footprint":"Abdruck","dur":"{s} s von oben nach unten","avg":"Mittelwert über das ganze Signal","press":"Drücke Anhören: das Signal läuft hier durch","count":"{n} Signale, in der Reihenfolge von Blatt 6","myst":"Rätselmodus","mystTags":"Hören und schauen, dann die richtige Antwort wählen","quizH":"Welches Signal ist das?","quizLead":"Starte die Wiedergabe, beobachte Spektrum, Wasserfall und Abdruck, dann antworte.","score":"Punkte","good":"Richtig!","bad":"Leider nein: es war {x}.","next":"Nächster Rätselton","principle":"Prinzip","screen":"Auf dem Bildschirm","sheet":"Blatt","book":"Buch: Blatt {r}","lang":"Sprache","signals":"Signale","f1":"Im Browser simulierte Signale (12 000 Abtastwerte pro Sekunde): die von Blatt 6 des Buchs OpenBookRadio, weitere Signale aus dem Buch und Bonus-Signale. Bei Funksignalen (AM, FM, AIS, LoRa…) sieht man die simulierte Zwischenfrequenz wie auf einem SDR-Bildschirm; manche sind verkleinert oder beschleunigt, das ist angegeben. Bei AM, SSB, FM, UKW-Stereo, ISS und Schwund hört man den demodulierten Ton wie aus dem Lautsprecher des Empfängers, der Bildschirm zeigt das Funksignal; die Stimme ist synthetisch und spricht keine echten Wörter.","f2":"Die Zeit läuft im Wasserfall und im Abdruck nach unten. Lizenz CC BY-NC-SA 4.0, kostenlos, nicht verkaufen.","night":"Nachtmodus","day":"Tagmodus","visits":"Besuche","plays":"Wiedergaben","book_dl":"Buch herunterladen","book_dl2":"Das Buch OpenBookRadio herunterladen (kostenlos, PDF und EPUB, 13 Sprachen)","display":"Anzeige","theme_day":"Tag","theme_night":"Nacht (rot)","theme_phos":"Grüner Phosphor","theme_phosb":"Blauer Phosphor","theme_phosa":"Bernstein-Phosphor","w3d":"3D-Wasserfall","w3dHint":"zum Drehen ziehen"},"groups":["Analoge Sprache","Telegrafie","Daten","Bilder","Luftfahrt, Seefahrt und Rettung","Ruf, Subtöne und Funkruf","Radiosonden, Sensoren und vernetzte Geräte","KW-Betriebsarten und Kuriositäten","Rundfunk und Zeit","Breitband","Bonus: Klänge aus dem All","Bonus: Kuriositäten der Kurzwelle","Bonus: Unterwassergeräusche"],"modes":{"am":{"sh":"Rundfunk","t":"AM: Amplitudenmodulation","h":"Die Stärke des Trägers folgt dem Ton: die Kurve „schwillt“ an und ab.","l":"Ein fester Strich in der Mitte (der Träger), mit zwei gleichen Seitenbändern links und rechts. Etwa 6 bis 9 kHz breit. Rundfunk auf Kurz- und Mittelwelle, Flugfunk (Blätter 12 und 14).","r":[["Hören","Ein Jingle, dann der Moderator über Hintergrundmusik. Die beiden Seitenbänder sind spiegelbildlich: man sieht die Melodie, dann die Stimme auf beiden Seiten des Trägers."]]},"ssb":{"nm":"SSB / ESB","t":"SSB: Einseitenband","h":"Nur ein Seitenband bleibt, ohne Träger: nichts, wenn niemand spricht.","l":"Kein Mittelstrich, ein einziges Band von etwa 2,7 kHz, das nur beim Sprechen lebt. USB über 10 MHz, LSB darunter (Funkamateure). Falsch abgestimmt klingt die Stimme wie eine „Ente“ (Blätter 11 und 29)."},"fm":{"sh":"Sprache","t":"FM: Frequenzmodulation","h":"Die Amplitude bleibt gleich; die Schwingungen rücken mit dem Ton zusammen oder auseinander.","l":"Das Signal tanzt um seine Frequenz, breiter bei lautem Ton: 12,5 kHz pro Kanal bei Schmalband-FM (Handfunkgeräte, Relais), 200 kHz beim UKW-Rundfunk (Blätter 2 und 13).","r":[["Hören","Am Ende das kurze „Kschh“: die Rauschsperre schließt, wenn der Sender aufhört."]]},"cw":{"t":"CW: Morse","h":"Der Träger wird ein- und ausgeschaltet: Striche und Punkte.","l":"Ein sehr feiner Strich, der im Rhythmus des Morsecodes unterbrochen wird; ein Piepen im Ohr. Hier „CQ“ (Blatt 48).","r":[["Tempo","20 Wörter/min, Punkt 60 ms, auf 700 Hz: „CQ CQ CQ DE F4ABC K“"],["Mit dem Ohr","Reine Pieptöne, lang und kurz, auf einem Ton"],["Dekodierung","Nach Gehör, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: zwei Frequenzen","h":"Die Frequenz springt zwischen zwei Werten, einem für 0, einem für 1.","l":"Zwei parallele Striche: 170 Hz Abstand bei Funkamateuren (45,45 Baud), 450 oder 850 Hz bei Wetterberichten. Ein regelmäßiges „tidilidi“ (Blatt 32).","r":[["Code","Baudot ITA2: 5 Bit + Start + 1,5 Stopp; Mark 2125 Hz, Space 2295 Hz"],["Text","RYRYRYRY CQ CQ DE F4ABC"],["Dekodierung","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 Baud: APRS und Packet","h":"Zwei Tonfrequenzen, 1200 und 2200 Hz, in einen FM-Sender gegeben.","l":"Hinter dem FM-Empfänger (Lautsprecherton): ein Band von 1200 bis 2200 Hz, in kurzen Paketen. Im Ohr ein einsekündiges „grrrt“ (Blätter 35 und 36).","r":[["Frequenz","144,800 MHz in Europa (APRS), FM"],["Rahmen","Flags 0x7E, dann AX.25-Daten in NRZI"],["Dekodierung","Direwolf, multimon-ng, KISS-TNC"]]},"psk31":{"t":"PSK31: Phasenmodulation","h":"Die Frequenz bleibt, die Phase kehrt sich um; bei jeder Umkehr sinkt die Amplitude.","l":"Ein sehr feiner Strich von etwa 60 Hz, leicht „geflochten“. Dutzende Stationen passen in 3 kHz (Blatt 29).","r":[["Code","Varicode: 0 = Phasenumkehr, 1 = keine Änderung; im Leerlauf zwei Zwillingsstriche"],["Wo hören","14 070 kHz, 3580 kHz"],["Dekodierung","fldigi"]]},"ft8":{"t":"MFSK / FT8: acht Töne","h":"Die Frequenz steigt und fällt in Stufen von 6,25 Hz, 0,16 s pro Stufe.","l":"Bänder von etwa 50 Hz, die 12,6 s dauern und alle 15 s wiederkommen, nach der Uhrzeit getaktet: mehrere Stationen gleichzeitig in 3 kHz, zum Beispiel auf 7,074 MHz (Blatt 29).","r":[["Rahmen","79 Symbole zu 0,16 s, drei Costas-Muster (Anfang, Mitte, Ende); hier acht Stationen"],["Frequenzen","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Dekodierung","WSJT-X, JTDX (genaue PC-Uhr)"]]},"ft4":{"t":"FT4: das FT8 für Conteste","h":"Vier Töne im Abstand von 20,8 Hz, 20,8 Baud: 105 Symbole in 5 s, in Zeitfenstern von 7,5 s.","l":"Bänder von etwa 90 Hz, kürzer und breiter als FT8, alle 7,5 s wieder. 14 080, 7047,5 kHz (Blatt 29)."},"olivia":{"t":"Olivia 8/250: acht Töne","h":"Acht Töne im Abstand von 31,25 Hz, immer nur einer, die zufällig springen; Walsh-Codierung und Verschachtelung.","l":"Ein Block verstreuter Punkte über 250 Hz; dekodiert weit unter dem Rauschen. Eine kleine Zufallsmelodie im Ohr (Blatt 29)."},"hell":{"t":"Feld Hell: Schreiben mit einem Träger","h":"Der Träger wird Punkt für Punkt ein- und ausgeschaltet: jeder Buchstabe besteht aus Spalten von 14 Punkten, von unten nach oben abgetastet (245 Punkte pro Sekunde).","l":"Im Wasserfall ein zerhackter Strich; erst der Programmbildschirm (fldigi) zeichnet die Buchstaben. Ein sanftes Knistern im Ohr (Blatt 29)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Vier Frequenzstufen: jedes Symbol trägt zwei Bit.","l":"Ein rechteckiger Block von 6 bis 12,5 kHz, voll wie Rauschen, oft in Paketen (DMR teilt den Kanal in zwei Zeitschlitze). Ein raues „frrr“ im Ohr (Blatt 46)."},"mt63":{"t":"MT63: Notfunknachrichten (NBEMS)","h":"64 Töne gleichzeitig, jeder langsam moduliert, mit viel Redundanz.","l":"Ein flacher Block von 1 oder 2 kHz um 1500 Hz, mit scharfen Kanten; ein gleichmäßiges Rauschen. Geht sogar über ein Mikrofon am Lautsprecher (Blatt 31)."},"lora":{"t":"LoRa: Frequenzrampen (Chirps)","h":"Die Frequenz durchläuft die ganze Breite und beginnt dann wieder unten: die Lage des Sprungs trägt die Daten.","l"
