o ogni secondo; il 59° secondo non ce l'ha, per segnare il minuto (scheda 10).","r":[["Nota","Qui la portante è portata a 1000 Hz; il 6° secondo non ha buco, come il 59° secondo di ogni minuto"]]},"ofdm":{"t":"OFDM: decine di sottoportanti","h":"Molte portanti fittissime, ognuna lenta: la somma sembra rumore.","l":"Un rettangolo piatto dai bordi netti, sempre presente: DRM in onde corte (10 kHz), DAB+ (1,5 MHz), DVB-T, Wi-Fi. Un soffio continuo all'orecchio (schede 10 e 22)."},"dsss":{"t":"Spettro espanso (DSSS): GPS, Wi-Fi 802.11b","h":"I dati sono mescolati con un codice velocissimo: l'energia si spande su una grande larghezza.","l":"Una gobba larga, appena sopra il rumore; il GPS è persino sotto il rumore e non si vede senza elaborazione (schede 22 e 23)."},"hline":{"nm":"Riga dell'idrogeno","sh":"1420 MHz","t":"Riga dell'idrogeno a 21 cm (1420,405 MHz)","h":"L'idrogeno freddo della Via Lattea emette un soffio debolissimo su 1420,405 MHz. Il moto dei bracci della galassia lo sposta per effetto Doppler: si vedono alcune piccole gobbe.","l":"Quasi nulla nella cascata da un secondo all'altro: bisogna fare la media a lungo per veder emergere le gobbe dal rumore. Qui guarda lo spettro medio a riproduzione ferma. Bastano una parabola o una tromba, un preamplificatore e una chiavetta SDR.","n":"segnale molto esagerato"},"sun":{"nm":"Sole","sh":"burst","t":"Sole: burst radio di tipo III","h":"Elettroni lanciati da un brillamento attraversano la corona solare e la fanno emettere sempre più in basso in frequenza man mano che si allontanano.","l":"Righe che cadono in diagonale dall'alto al basso dello spettro in meno di un secondo, su un fondo di rumore solare; un «shhhh» che cresce. Da circa 10 a 400 MHz, anche in onde corte verso 20 MHz."},"jupiter":{"nm":"Giove","sh":"20 MHz","t":"Giove: burst decametrici (L e S)","h":"Il campo magnetico di Giove e la sua luna Io producono emissioni potenti tra 15 e 40 MHz: burst L lenti e burst S brevissimi che scivolano rapidi verso il basso.","l":"Prima onde di soffio (L, come la risacca), poi raffiche di piccoli «pop» (S) in diagonali fitte. Verso 20,1 MHz di notte, con un semplice dipolo, quando Io è ben posizionata."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Una stella di neutroni che ruota spazza la Terra con un fascio radio, qui ogni 0,714 s. Il gas interstellare ritarda le frequenze basse: ogni impulso arriva prima in cima allo spettro.","l":"Un «tic» regolare; nella cascata ogni impulso è una curva che scende (dispersione). Il segnale vero è sotto il rumore: servono una grande antenna e la somma degli impulsi sul loro periodo.","n":"segnale molto esagerato"},"meteor":{"nm":"Meteore","sh":"GRAVES","t":"Echi di meteore dal radar GRAVES (143,050 MHz)","h":"Il radar francese GRAVES trasmette senza sosta su 143,050 MHz. Quando una stella cadente ionizza l'aria, la sua scia rimanda un po' di quel segnale al tuo ricevitore, da una frazione di secondo a qualche secondo.","l":"In USB su 143,049 MHz: brevi «ping» intorno a 1000 Hz, a volte un eco che scivola (la testa della meteora, effetto Doppler) o che dura. Molti di più durante gli sciami (Perseidi, Geminidi) (scheda 1)."},"whistler":{"nm":"Fischi","sh":"VLF","t":"Fischi VLF (whistler)","h":"Un fulmine crea uno schiocco radio; una parte segue le linee del campo magnetico terrestre fino all'altro emisfero e torna, gli acuti per primi.","l":"Un «fiuuu» che scende dall'acuto al grave in uno o due secondi, subito dopo uno schiocco; scricchiolii (sferics) ovunque. Sotto i 10 kHz, con un ricevitore VLF lontano dalle linee elettriche."},"chorus":{"nm":"Coro dell'alba","sh":"VLF","t":"Coro dell'alba (dawn chorus)","h":"Durante una tempesta magnetica, elettroni intrappolati nella magnetosfera emettono piccole note ascendenti, soprattutto all'alba.","l":"Cinguettii ascendenti che si sovrappongono, come uccelli, da circa 1 a 4 kHz. Stessa attrezzatura dei fischi."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"Il primo satellite artificiale emetteva bip di circa 0,3 s su 20,005 e 40,002 MHz, alternandoli, per tre settimane.","l":"Una riga interrotta con regolarità: «bip… bip…», il suono ascoltato da tutto il mondo nell'ottobre 1957 (ricostruzione)."},"doppler":{"nm":"Effetto Doppler","sh":"satellite","t":"Radiofaro di satellite ed effetto Doppler","h":"Un satellite in orbita bassa si avvicina e poi si allontana: la frequenza ricevuta scende durante il passaggio, di circa ±3 kHz a 145 MHz e ±10 kHz a 435 MHz.","l":"Una riga che scende a forma di S: lentamente all'inizio, veloce quando il satellite è più vicino, poi di nuovo lentamente (scheda 34).","n":"passaggio di 10 min ridotto a 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satelliti NOAA: immagini APT (storico)","h":"Una sottoportante di 2400 Hz modulata in ampiezza dall'immagine, due righe al secondo, con un impulso di sincronismo all'inizio di ogni riga. Spento nel 2025; oggi i Meteor-M trasmettono in LRPT.","l":"Una riga a 2400 Hz con bande laterali che cambiano con l'immagine, e il famoso «tic-tac» due volte al secondo (scheda 34)."},"eme":{"nm":"Eco dalla Luna","sh":"EME","t":"Eco dalla Luna (EME)","h":"Un segnale inviato verso la Luna torna circa 2,5 s dopo, enormemente indebolito, un po' allargato e spostato dal Doppler.","l":"Si sente il proprio «bip», poi 2,5 s dopo il suo eco debole e un po' sfocato. I radioamatori lo fanno in CW o JT65, da 144 MHz in su (scheda 1).","n":"eco molto esagerato"}}},"pl":{"ui":{"title":"Rozpoznawacz emisji radiowych","mystery":"Tajemniczy dźwięk","play":"▶ Słuchaj","stop":"■ Stop","noise":"Szum","volume":"Głośność","loop":"Zapętlaj","specwf":"Widmo + wodospad","cursor":"kursor","footprint":"Odcisk","dur":"{s} s z góry na dół","avg":"średnia z całego sygnału","press":"Naciśnij Słuchaj: sygnał przewija się tutaj","count":"{n} sygnałów, w kolejności karty 5 bis","myst":"Tryb zagadki","mystTags":"Słuchaj i patrz, potem wybierz właściwą odpowiedź","quizH":"Co to za sygnał?","quizLead":"Włącz odsłuch, obserwuj widmo, wodospad i odcisk, potem odpowiedz.","score":"Wynik","good":"Dobrze!","bad":"Pudło: to był {x}.","next":"Następny tajemniczy dźwięk","principle":"Zasada","screen":"Na ekranie","sheet":"karta","book":"Książka: karta {r}","lang":"Język","signals":"Sygnały","f1":"Sygnały symulowane na stronie (12 000 próbek na sekundę), według sygnałów karty 5 bis książki OpenBookRadio, plus Olivia, FT4 i Feld Hell (karta 26). W przypadku sygnałów radiowych (AM, FM, AIS, LoRa…) widać symulowaną częstotliwość pośrednią, jak na ekranie SDR; niektóre są w zmniejszonej skali lub przyspieszone, co jest zaznaczone.","f2":"Czas w wodospadzie i odcisku płynie w dół. Licencja CC BY-NC-SA 4.0, za darmo, nie na sprzedaż."},"groups":["Głos analogowy","Telegrafia","Dane","Obrazy","Lotnictwo, morze i ratownictwo","Wywołanie, podtony i przywoławcze","Radiosondy, czujniki i urządzenia połączone","Emisje KF i ciekawostki","Radiofonia i czas","Szerokie pasmo","Bonus: dźwięki z kosmosu"],"modes":{"am":{"sh":"głos","t":"AM: modulacja amplitudy","h":"Siła nośnej podąża za dźwiękiem: krzywa „puchnie” i „opada”.","l":"Stała kreska pośrodku (nośna) i po obu stronach dwie jednakowe wstęgi boczne. Szerokość około 6–9 kHz. Radiofonia na falach krótkich i średnich, lotnictwo (karty 10 i 12)."},"ssb":{"t":"SSB: jedna wstęga boczna","h":"Zostaje tylko jedna wstęga boczna, bez nośnej: nic, gdy nikt nie mówi.","l":"Brak środkowej kreski, jedno pasmo około 2,7 kHz, które żyje tylko podczas mówienia. USB powyżej 10 MHz, LSB poniżej (krótkofalowcy). Źle dostrojony głos brzmi jak „kaczka” (karty 9 i 26)."},"fm":{"sh":"głos","t":"FM: modulacja częstotliwości","h":"Amplituda się nie zmienia; to drgania zagęszczają się lub rozrzedzają z dźwiękiem.","l":"Sygnał tańczy wokół swojej częstotliwości, szerszy przy głośnym dźwięku: 12,5 kHz na kanał w wąskim FM (krótkofalówki, przemienniki), 200 kHz w radiu FM (karty 2 i 11)."},"cw":{"t":"CW: Morse","h":"Nośna jest włączana i wyłączana: kreski i kropki.","l":"Bardzo cienka kreska przerywana w rytmie Morse'a; piszczenie w uchu. Tutaj „CQ” (karta 39).","r":[["Szybkość","20 słów/min, kropka 60 ms, na 700 Hz: „CQ CQ CQ DE F4ABC K”"],["Na słuch","Czyste piski, długie i krótkie, na jednym tonie"],["Dekodowanie","Na słuch, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: dwie częstotliwości","h":"Częstotliwość przeskakuje między dwiema wartościami, jedną dla 0, drugą dla 1.","l":"Dwie równoległe kreski: 170 Hz odstępu u krótkofalowców (45,45 bodów), 450 lub 850 Hz w komunikatach pogodowych. Regularne „tidilidi” (karta 27).","r":[["Kod","Baudot ITA2: 5 bitów + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Tekst","RYRYRYRY CQ CQ DE F4ABC"],["Dekodowanie","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 bodów: APRS i packet","h":"Dwa tony akustyczne, 1200 i 2200 Hz, podane do nadajnika FM.","l":"Za odbiornikiem FM (dźwięk z głośnika): pasmo od 1200 do 2200 Hz w krótkich paczkach. Na słuch sekundowe „grrrt” (karty 29 i 30).","r":[["Częstotliwość","144,800 MHz w Europie (APRS), FM"],["Ramka","Flagi 0x7E, potem dane AX.25 w NRZI"],["Dekodowanie","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"t":"PSK31: modulacja fazy","h":"Częstotliwość się nie zmienia, odwraca się faza; przy każdym odwróceniu amplituda spada.","l":"Bardzo cienka kreska około 60 Hz, lekko „pleciona”. W 3 kHz mieszczą się dziesiątki stacji (karta 26).","r":[["Kod","Varicode: 0 = odwrócenie fazy, 1 = bez zmiany; w spoczynku dwie bliźniacze kreski"],["Gdzie słuchać","14 070 kHz, 3580 kHz"],["Dekodowanie","fldigi"]]},"ft8":{"t":"MFSK / FT8: osiem tonów","h":"Częstotliwość rośnie i maleje skokami po 6,25 Hz, 0,16 s na skok.","l":"Pasma około 50 Hz, które trwają 12,6 s i wracają co 15 s, zsynchronizowane z zegarem: kilka stacji naraz w 3 kHz, np. na 7,074 MHz (karta 26).","r":[["Ramka","79 symboli po 0,16 s, trzy wzory Costasa (początek, środek, koniec); tutaj osiem stacji"],["Częstotliwości","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Dekodowanie","WSJT-X, JTDX (dokładny zegar PC)"]]},"ft4":{"t":"FT4: FT8 do zawodów","h":"Cztery tony co 20,8 Hz, 20,8 bodów: 105 symboli w 5 s, w okienkach 7,5 s.","l":"Pasma około 90 Hz, krótsze i szersze niż FT8, wracające co 7,5 s. 14 080, 7047,5 kHz (karta 26)."},"olivia":{"t":"Olivia 8/250: osiem tonów","h":"Osiem tonów co 31,25 Hz, zawsze jeden naraz, przeskakujących losowo; kodowanie Walsha i przeplot.","l":"Blok rozsianych kropek na 250 Hz; dekoduje głęboko pod szumem. Na słuch mała losowa melodia (karta 26)."},"hell":{"t":"Feld Hell: pisanie nośną","h":"Nośna jest włączana i wyłączana punkt po punkcie: każda litera to kolumny po 14 punktów, skanowane od dołu do góry (245 punktów na sekundę).","l":"W wodospadzie poszarpana kreska; dopiero ekran programu (fldigi) rysuje litery. Na słuch delikatne trzeszczenie (karta 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Cztery poziomy częstotliwości: każdy symbol niesie dwa bity.","l":"Prostokątny blok 6–12,5 kHz, pełny jak szum, często w paczkach (DMR dzieli kanał na dwie szczeliny czasowe). Na słuch chrapliwe „frrr” (karta 38)."},"mt63":{"t":"MT63: wiadomości alarmowe (NBEMS)","h":"64 tony naraz, każdy powoli modulowany, z dużą nadmiarowością.","l":"Płaski blok 1 lub 2 kHz wokół 1500 Hz, o ostrych brzegach; równy szum. Przechodzi nawet przez mikrofon przyłożony do głośnika (karta 26 ter)."},"lora":{"t":"LoRa: rampy częstotliwości (chirpy)","h":"Częstotliwość przemiata całą szerokość i zaczyna od dołu: położenie skoku niesie dane.","l":"Równoległe przekątne, łatwe do rozpoznania: Meshtastic i MeshCore na 869,525 MHz lub 433 MHz, czujniki LoRaWAN (karty 11, 20 i 21)."},"sstv":{"t":"SSTV: obrazy w dźwięku","h":"Impuls synchronizacji na 1200 Hz, potem częstotliwość podąża za jasnością linii, od 1500 (czarny) do 2300 Hz (biały).","l":"Regularne kreski synchronizacji i chmura zmieniająca się z obrazem; „ćwierkający” dźwięk przez minutę lub dwie. 14,230 MHz, ISS na 145,800 MHz (karta 31).","r":[["Ramka","Nagłówek VIS, potem linie: synchro 1200 Hz, zielony, niebieski, czerwony; tutaj 20 linii planszy testowej"],["Dekodowanie","QSSTV, MMSSTV, Robot36 na smartfonie"]]},"fax":{"nm":"Faks pogodowy","t":"Faks pogodowy: 1500 Hz czarny, 2300 Hz biały","h":"Częstotliwość płynnie przechodzi od czerni do bieli, 120 linii na minutę.","l":"Dwa stałe pasma na 1500 i 2300 Hz (800 Hz odstępu), regularne „tik-tak”. Publikowane są częstotliwości nośnej: słuchaj w USB 1,9 kHz niżej (karta 32).","r":[["Ramka","Ton startowy 300 Hz, linie fazujące (biały impuls), potem mapa"],["Dekodowanie","fldigi, JWX, HamFax"]]},"elt":{"nm":"Syrena ELT","t":"Syrena ELT / PLB na 121,5 MHz","h":"AM, której ton opada z 1600 do 300 Hz dwa do czterech razy na sekundę.","l":"Stała nośna i wstęgi boczne przesuwające się wachlarzem: „łuu-łuu” radiolatarni ratunkowych, także na 121,375 MHz do ćwiczeń (karty 24 i 25)."},"406":{"nm":"Radiolatarnia 406","t":"Radiolatarnia 406 MHz: paczka BPSK","h":"Pół sekundy nadawania: 160 ms czystej nośnej, potem faza przełącza się o ±1,1 radiana z szybkością 400 bit/s.","l":"Krótka kreseczka powracająca co 50 s, między 406,0 a 406,1 MHz; nic użytecznego do usłyszenia, potrzebny dekoder (EPIRB 406, karta 25)."},"adsb":{"t":"ADS-B / mod S (1090 MHz): impulsy","h":"Impulsy 0,5 µs, których położenie niesie bity (PPM); tutaj skala czasu jest mocno spowolniona.","l":"Bardzo krótkie poziome kreski na całej szerokości, setki na sekundę blisko lotniska; potrzebny klucz SDR (karta 13).","n":"skala czasu mocno spowolniona"},"acars":{"t":"ACARS: AM i dane MSK","h":"AM niosąca dwa tony, 1200 i 2400 Hz, z szybkością 2400 bit/s.","l":"Półsekundowe paczki z nośną i wstęgami bocznymi, na 131,525, 131,725 lub 131,825 MHz w Europie: na słuch „brrrt” (karta 14)."},"ais":{"t":"AIS: GMSK 9600 bodów na dwóch kanałach","h":"Wygładzone FSK (GMSK) w paczkach po 26 ms, raz na 161,975 MHz, raz na 162,025 MHz (skala zmniejszona).","l":"Dwie kolumny krótkich kresek 50 kHz od siebie, regularne klikanie; im więcej statków, tym gęściej (karta 16).","n":"skala zmniejszona"},"navtex":{"t":"NAVTEX i DSC na falach średnich i krótkich: FSK 170 Hz","h":"Jak RTTY: dwie częstotliwości 170 Hz od siebie, ale 100 bodów.","l":"Dwie równoległe kreski, ciągłe podczas komunikatu, na 518 i 490 kHz (NAVTEX) lub 2187,5 kHz (cyfrowe wywołanie selektywne) (karta 17).","r":[["Kod","SITOR-B, CCIR 476: 7 bitów z czterema „1”, z powtórzeniem FEC"],["Dekodowanie","fldigi, YaND"]]},"hfdl":{"t":"HFDL: samoloty na falach krótkich","h":"PSK 1800 bodów na podnośnej 1440 Hz.","l":"Paczki około 2,4 kHz między 2,9 a 22 MHz; szum modemu, który przychodzi i odchodzi (karta 14 bis)."},"ctcss":{"t":"CTCSS: podton pod głosem","h":"Niski ciągły ton (67–254 Hz, tutaj 88,5 Hz) dodany do głosu.","l":"W dźwięku odbiornika FM: stała kreska na samym dole, pod głosem; otwiera blokadę szumów przemienników i krótkofalówek (karta 8)."},"dtmf":{"sh":"2 tony","t":"DTMF: dwa tony na klawisz","h":"Każdy klawisz wysyła jednocześnie ton niski (697–941 Hz) i wysoki (1209–1633 Hz).","l":"Pary kropek ułożone w ośmiu stałych kolumnach; „pip-pip” numerów telefonów i poleceń przemienników (karta 8).","r":[["Sekwencja","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tonów","t":"Selcall CCIR: tony po kolei","h":"Pięć tonów po 100 ms jeden po drugim, jeden na cyfrę.","l":"Małe schodki z kropek, powtarzane; szybkie „tululululu”, by wywołać jedno konkretne radio (karta 28).","r":[["Sekwencja","1 2 3 4 5, dwa razy; dekoduje ją też aplikacja SelCall dla UV-K1"]]},"pocsag":{"sh":"pagery","t":"POCSAG i FLEX: pagery","h":"FSK ±4,5 kHz; preambuła 1010…, potem dane (skala zmniejszona).","l":"Dwie wyraźne kreski podczas preambuły, potem pełne pasmo; przenikliwe „brrrrt”. 466,075 MHz, DAPNET 439,9875 MHz (karta 37).","n":"skala zmniejszona"},"ale":{"sh":"8 tonów","t":"ALE: automatyczne nawiązywanie łączności na KF","h":"Osiem tonów od 750 do 2500 Hz, 125 bodów, w paczkach.","l":"Blok około 2 kHz z drobnych kropek, sekunda lub dwie, czasem na kilku sąsiednich częstotliwościach; wysokie ćwierkanie (karta 28 bis)."},"rs41":{"nm":"Radiosonda RS41","t":"Radiosonda RS41: ciągłe GFSK","h":"Wygładzone FSK 4800 bodów bez przerwy; częstotliwość powoli dryfuje, gdy sonda wznosi się i stygnie.","l":"Pasmo około 10 kHz przesuwające się ukośnie przez cały lot, między 400 a 406 MHz (karta 18)."},"ook":{"nm":"Czujniki 433","t":"Czujniki 433 MHz: OOK","h":"Nośna włącza się i wyłącza krótkimi lub długimi impulsami (wszystko albo nic); komunikat powtarza się trzy razy.","l":"Paczki drobnych kropek, często potrójne, na 433,92 MHz: stacje pogodowe, czujniki temperatury, piloty (karta 19)."},"fhss":{"t":"Bluetooth: skoki częstotliwości (FHSS)","h":"Częstotliwość zmienia się 1600 razy na sekundę wśród 79 kanałów (skala zmniejszona).","l":"Drobne kreski rozsiane wszędzie na 80 MHz, nigdy w tym samym miejscu, w okolicy 2,4 GHz (karta 22).","n":"skala zmniejszona"},"wspr":{"t":"WSPR: radiolatarnie propagacyjne","h":"Cztery tony co 1,46 Hz, 0,68 s na symbol, przez 110,6 s.","l":"Bardzo cienka kreska około 6 Hz trwająca prawie dwie minuty, co parzyste dwie minuty: trzeba mocno powiększyć (karta 26).","n":"fragment 24 s (emisja trwa 110,6 s)"},"qrss":{"t":"QRSS: bardzo wolny Morse","h":"Nośna włączana i wyłączana, kropki od 3 do 10 s, często na dwóch sąsiednich częstotliwościach (DFCW).","l":"Kreski szerokie na kilka Hz, czytane na dziesięciominutowym ekranie; niesłyszalne (karta 26 bis).","n":"przyspieszone: kropka 0,6 s zamiast 3–10 s"},"texte":{"nm":"Tekst w wodospadzie","t":"Tekst w wodospadzie","h":"Każda linia obrazu staje się grupą tonów: dźwięk przypomina szum.","l":"Tekst lub rysunek pojawia się bezpośrednio na ekranie SDR (karta 33).","r":[["Uwaga","Nadawany od dołu obrazu: prosto w wodospadzie na żywo, do góry nogami w odcisku (czytanym z góry na dół)"]]},"vara":{"t":"Nowoczesne dane KF: VARA, Pactor, ARDOP","h":"Długie pełne paczki (OFDM lub PSK), a między nimi krótkie odpowiedzi drugiej stacji.","l":"Prostokąt około 2,4 kHz, który zatrzymuje się i rusza, z małym potwierdzeniem pośrodku; poszarpany szum (karta 26)."},"chirp":{"nm":"Jonosonda","t":"Jonosonda (chirp sounder)","h":"Powolna rampa częstotliwości przez całe pasmo KF; echa jonosfery przychodzą nieco później.","l":"Przekątna przemiatająca ekran, z równoległymi kreskami (echami); „ffuit”, które mija w ułamku sekundy."},"oth":{"nm":"Radar pozahoryzontalny","t":"Radar pozahoryzontalny („woodpecker”)","h":"Impulsy powtarzane 10 do 50 razy na sekundę, każdy szeroki na kilka kHz.","l":"Szeroki prążkowany blok pokrywający całe pasma; bardzo regularne stukanie dzięcioła na falach krótkich."},"parasites":{"nm":"Zakłócenia","sh":"zasilacz","t":"Zakłócenia z zasilacza impulsowego","h":"Sygnał prostokątny: jego częstotliwość i wszystkie harmoniczne wychodzą naraz.","l":"Grzebień regularnych prążków dryfujących razem na tle szumu: szukaj z NOISE FIND lub przenośnym odbiornikiem (karta K21b)."},"mpx":{"nm":"FM stereo i RDS","t":"Radio FM stereo i RDS","h":"Zdemodulowany dźwięk (multipleks) zawiera kanał L+R, pilot 19 kHz, kanał L-R wokół 38 kHz i RDS na 57 kHz.","l":"Od 0 do 60 kHz po demodulacji: niski blok, cienka kreska na 19 kHz, słabszy blok pośrodku i RDS na samej górze (karta 10).","n":"skala ÷ 20 do odsłuchu"},"dcf77":{"t":"Sygnał czasu DCF77 (77,5 kHz)","h":"Nośna spadająca do 15 % na 0,1 s (bit 0) lub 0,2 s (bit 1) na początku każdej sekundy.","l":"Stała kreska z czarną przerwą co sekundę; 59. sekunda jej nie ma, by zaznaczyć minutę (karta 10).","r":[["Uwaga","Tutaj nośna jest przeniesiona na 1000 Hz; 6. sekunda nie ma przerwy, jak 59. sekunda każdej minuty"]]},"ofdm":{"t":"OFDM: dziesiątki podnośnych","h":"Wiele gęsto upakowanych nośnych, każda wolna: suma wygląda jak szum.","l":"Płaski prostokąt o ostrych brzegach, zawsze obecny: DRM na KF (10 kHz), DAB+ (1,5 MHz), DVB-T, Wi-Fi. Na słuch ciągły szum (karty 10 i 22)."},"dsss":{"t":"Widmo rozproszone (DSSS): GPS, Wi-Fi 802.11b","h":"Dane miesza się z bardzo szybkim kodem: energia rozkłada się na dużą szerokość.","l":"Szeroki garb ledwo ponad szumem; GPS jest nawet pod szumem i bez obróbki go nie widać (karty 22 i 23)."},"hline":{"nm":"Linia wodoru","sh":"1420 MHz","t":"Linia wodoru 21 cm (1420,405 MHz)","h":"Zimny wodór w Drodze Mlecznej emituje bardzo słaby szum na 1420,405 MHz. Ruch ramion galaktyki przesuwa go przez efekt Dopplera: widać kilka małych garbów.","l":"W wodospadzie z sekundy na sekundę prawie nic: trzeba długo uśredniać, by garby wyłoniły się z szumu. Tutaj spójrz na średnie widmo po zatrzymaniu. Wystarczy czasza lub tuba, przedwzmacniacz i klucz SDR.","n":"sygnał mocno przesadzony"},"sun":{"nm":"Słońce","sh":"rozbłyski","t":"Słońce: rozbłyski radiowe typu III","h":"Elektrony wyrzucone przez rozbłysk przechodzą przez koronę słoneczną i sprawiają, że emituje coraz niżej, w miarę jak się oddalają.","l":"Kreski spadające ukośnie z góry na dół widma w mniej niż sekundę, na tle szumu słonecznego; narastające „szszsz”. Od około 10 do 400 MHz, także na falach krótkich w okolicy 20 MHz."},"jupiter":{"nm":"Jowisz","sh":"20 MHz","t":"Jowisz: rozbłyski dekametrowe (L i S)","h":"Pole magnetyczne Jowisza i jego księżyc Io wytwarzają silną emisję między 15 a 40 MHz: powolne rozbłyski L i bardzo krótkie rozbłyski S, które szybko zjeżdżają w dół.","l":"Najpierw fale szumu (L, jak przybój), potem serie drobnych „pyknięć” (S) w gęstych przekątnych. Okolice 20,1 MHz nocą, z prostym dipolem, gdy Io jest dobrze ustawiona."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Wirująca gwiazda neutronowa omiata Ziemię wiązką radiową, tutaj co 0,714 s. Gaz międzygwiazdowy opóźnia niskie częstotliwości: każdy impuls dociera najpierw na górę widma.","l":"Regularne „tik”; w wodospadzie każdy impuls to opadająca krzywa (dyspersja). Prawdziwy sygnał jest pod szumem: potrzeba dużej anteny i sumowania impulsów w ich okresie.","n":"sygnał mocno przesadzony"},"meteor":{"nm":"Meteory","sh":"GRAVES","t":"Echa meteorów z radaru GRAVES (143,050 MHz)","h":"Francuski radar GRAVES nadaje bez przerwy na 143,050 MHz. Gdy spadająca gwiazda jonizuje powietrze, jej ślad odbija trochę tego sygnału do twojego odbiornika, na ułamek sekundy do kilku sekund.","l":"W USB na 143,049 MHz: krótkie „pingi” około 1000 Hz, czasem echo, które się przesuwa (głowa meteoru, efekt Dopplera) albo trwa dłużej. O wiele więcej podczas rojów (Perseidy, Geminidy) (karta 1)."},"whistler":{"nm":"Gwizdy","sh":"VLF","t":"Gwizdy VLF (whistlery)","h":"Piorun wytwarza radiowy trzask; część biegnie wzdłuż linii ziemskiego pola magnetycznego na drugą półkulę i z powrotem, wysokie tony najpierw.","l":"„Fiuuu” opadające od wysokich do niskich tonów w sekundę lub dwie, tuż po trzasku; wszędzie trzaski (sferyki). Poniżej 10 kHz, z odbiornikiem VLF z dala od linii energetycznych."},"chorus":{"nm":"Chór świtu","sh":"VLF","t":"Chór świtu (dawn chorus)","h":"Podczas burzy magnetycznej elektrony uwięzione w magnetosferze wydają małe rosnące nuty, głównie o świcie.","l":"Nakładające się, wznoszące ćwierkania, jak ptaki, od około 1 do 4 kHz. Ten sam sprzęt co do gwizdów."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"Pierwszy sztuczny satelita przez trzy tygodnie nadawał piknięcia po około 0,3 s, na przemian na 20,005 i 40,002 MHz.","l":"Regularnie przerywana kreska: „pip… pip…”, dźwięk, którego w październiku 1957 słuchał cały świat (rekonstrukcja)."},"doppler":{"nm":"Efekt Dopplera","sh":"satelita","t":"Radiolatarnia satelity i efekt Dopplera","h":"Satelita na niskiej orbicie zbliża się, a potem oddala: odbierana częstotliwość spada podczas przelotu, o około ±3 kHz na 145 MHz i ±10 kHz na 435 MHz.","l":"Kreska opadająca w kształcie litery S: najpierw powoli, szybko w chwili największego zbliżenia, potem znów powoli (karta 34).","n":"przelot 10 min skrócony do 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satelity NOAA: obrazy APT (historia)","h":"Podnośna 2400 Hz modulowana amplitudowo obrazem, dwie linie na sekundę, z impulsem synchronizacji na początku każdej linii. Wyłączone w 2025; dziś satelity Meteor-M nadają LRPT.","l":"Kreska na 2400 Hz ze wstęgami bocznymi zmieniającymi się z obrazem i słynne „tik-tak” dwa razy na sekundę (karta 34)."},"eme":{"nm":"Echo od Księżyca","sh":"EME","t":"Echo od Księżyca (EME)","h":"Sygnał wysłany w stronę Księżyca wraca po około 2,5 s, ogromnie osłabiony, nieco poszerzony i przesunięty przez Dopplera.","l":"Słychać własne „pip”, a po 2,5 s jego słabe, nieco rozmyte echo. Krótkofalowcy robią to w CW lub JT65, od 144 MHz w górę (karta 1).","n":"echo mocno przesadzone"}}},"ru":{"ui":{"title":"Определитель видов радиосигналов","mystery":"Загадочный звук","play":"▶ Слушать","stop":"■ Стоп","noise":"Шум","volume":"Громкость","loop":"По кругу","specwf":"Спектр + водопад","cursor":"курсор","footprint":"Отпечаток","dur":"{s} с сверху вниз","avg":"среднее по всему сигналу","press":"Нажми «Слушать»: сигнал побежит здесь","count":"{n} сигналов, в порядке листа 5 bis","myst":"Загадка","mystTags":"Слушай и смотри, затем выбери правильный ответ","quizH":"Что это за сигнал?","quizLead":"Включи звук, посмотри на спектр, водопад и отпечаток, затем ответь.","score":"Счёт","good":"Верно!","bad":"Мимо: это был {x}.","next":"Следующий загадочный звук","principle":"Принцип","screen":"На экране","sheet":"лист","book":"Книга: лист {r}","lang":"Язык","signals":"Сигналы","f1":"Сигналы смоделированы прямо на странице (12 000 отсчётов в секунду) по сигналам листа 5 bis книги OpenBookRadio, плюс Olivia, FT4 и Feld Hell (лист 26). Для радиосигналов (AM, FM, AIS, LoRa…) показана смоделированная промежуточная частота, как на экране SDR; некоторые уменьшены или ускорены, это указано.","f2":"Время в водопаде и отпечатке идёт вниз. Лицензия CC BY-NC-SA 4.0, бесплатно, не для продажи."},"groups":["Аналоговый голос","Телеграф","Данные","Изображения","Авиация, флот и спасение","Вызов, субтоны и пейджинг","Радиозонды, датчики и устройства","Режимы КВ и диковинки","Вещание и время","Широкая полоса","Бонус: звуки космоса"],"modes":{"am":{"sh":"голос","t":"AM: амплитудная модуляция","h":"Сила несущей следует за звуком: кривая «раздувается» и «сдувается».","l":"Неподвижная линия в центре (несущая) и по бокам две одинаковые боковые полосы. Ширина около 6–9 кГц. Вещание на КВ и СВ, авиация (листы 10 и 12)."},"ssb":{"nm":"ОБП / SSB","t":"SSB: одна боковая полоса","h":"Остаётся одна боковая полоса без несущей: когда молчат, ничего нет.","l":"Нет центральной линии, одна полоса около 2,7 кГц, живая только во время речи. USB выше 10 МГц, LSB ниже (радиолюбители). При плохой настройке голос звучит как «утка» (листы 9 и 26)."},"fm":{"sh":"голос","t":"FM: частотная модуляция","h":"Амплитуда постоянна; колебания сгущаются или разрежаются вместе со звуком.","l":"Сигнал пляшет вокруг своей частоты и шире при громком звуке: 12,5 кГц на канал в узкополосной FM (рации, ретрансляторы), 200 кГц в FM-вещании (листы 2 и 11)."},"cw":{"t":"CW: азбука Морзе","h":"Несущая включается и выключается: тире и точки.","l":"Очень тонкая линия, прерываемая в ритме Морзе; писк в ухе. Здесь «CQ» (лист 39).","r":[["Скорость","20 слов/мин, точка 60 мс, на 700 Гц: «CQ CQ CQ DE F4ABC K»"],["На слух","Чистые писки, длинные и короткие, на одной ноте"],["Декодирование","На слух, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: две частоты","h":"Частота прыгает между двумя значениями: одно для 0, другое для 1.","l":"Две параллельные линии: 170 Гц у радиолюбителей (45,45 Бод), 450 или 850 Гц у метеосводок. Ровное «тидилиди» (лист 27).","r":[["Код","Бодо ITA2: 5 бит + старт + 1,5 стоп; mark 2125 Гц, space 2295 Гц"],["Текст","RYRYRYRY CQ CQ DE F4ABC"],["Декодирование","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 Бод: APRS и пакет","h":"Два звуковых тона, 1200 и 2200 Гц, подаются в FM-передатчик.","l":"После FM-приёмника (звук динамика): полоса от 1200 до 2200 Гц короткими пачками. На слух секундное «грррт» (листы 29 и 30).","r":[["Частота","144,800 МГц в Европе (APRS), FM"],["Кадр","Флаги 0x7E, затем данные AX.25 в NRZI"],["Декодирование","Direwolf, multimon-ng, KISS TNC"]]},"psk31":{"t":"PSK31: фазовая модуляция","h":"Частота не меняется, меняется фаза; при каждой смене амплитуда проседает.","l":"Очень тонкая линия около 60 Гц, слегка «плетёная». В 3 кГц помещаются десятки станций (лист 26).","r":[["Код","Varicode: 0 = смена фазы, 1 = без изменений; в покое две линии-близнеца"],["Где слушать","14 070 кГц, 3580 кГц"],["Декодирование","fldigi"]]},"ft8":{"t":"MFSK / FT8: восемь тонов","h":"Частота ходит вверх-вниз ступеньками по 6,25 Гц, 0,16 с на ступеньку.","l":"Полосы около 50 Гц длительностью 12,6 с, повторяются каждые 15 с по часам: несколько станций сразу в 3 кГц, например на 7,074 МГц (лист 26).","r":[["Кадр","79 символов по 0,16 с, три шаблона Костаса (начало, середина, конец); здесь восемь станций"],["Частоты","14 074, 7074, 3573, 10 136, 21 074, 28 074 кГц"],["Декодирование","WSJT-X, JTDX (точное время ПК)"]]},"ft4":{"t":"FT4: FT8 для соревнований","h":"Четыре тона через 20,8 Гц, 20,8 Бод: 105 символов за 5 с, в окнах по 7,5 с.","l":"Полосы около 90 Гц, короче и шире, чем у FT8, повторяются каждые 7,5 с. 14 080, 7047,5 кГц (лист 26)."},"olivia":{"t":"Olivia 8/250: восемь тонов","h":"Восемь тонов через 31,25 Гц, по одному за раз, прыгают случайно; кодирование Уолша и перемежение.","l":"Россыпь точек на 250 Гц; декодируется глубоко под шумом. На слух маленькая случайная мелодия (лист 26)."},"hell":{"t":"Feld Hell: письмо несущей","h":"Несущая включается и выключается по точкам: каждая буква — столбцы по 14 точек, развёрнутые снизу вверх (245 точек в секунду).","l":"В водопаде рваная линия; буквы рисует экран программы (fldigi). На слух мягкое потрескивание (лист 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Четыре уровня частоты: каждый символ несёт два бита.","l":"Прямоугольный блок шириной 6–12,5 кГц, заполненный как шум, часто пачками (DMR делит канал на два тайм-слота). На слух хриплое «фррр» (лист 38)."},"mt63":{"t":"MT63: аварийные сообщения (NBEMS)","h":"64 тона одновременно, каждый модулирован медленно, с большой избыточностью.","l":"Плоский блок 1 или 2 кГц вокруг 1500 Гц с чёткими краями; ровное шипение. Проходит даже через микрофон у динамика (лист 26 ter)."},"lora":{"t":"LoRa: частотные пилы (чирпы)","h":"Частота пробегает всю ширину и начинает снова снизу: положение скачка несёт данные.","l":"Параллельные диагонали, их легко узнать: Meshtastic и MeshCore на 869,525 МГц или 433 МГц, датчики LoRaWAN (листы 11, 20 и 21)."},"sstv":{"t":"SSTV: изображения в звуке","h":"Синхроимпульс на 1200 Гц, затем частота следует яркости строки: от 1500 (чёрный) до 2300 Гц (белый).","l":"Регулярные линии синхронизации и облако, меняющееся с картинкой; «щебечущий» звук одну-две минуты. 14,230 МГц, МКС на 145,800 МГц (лист 31).","r":[["Кадр","Заголовок VIS, затем строки: синхро 1200 Гц, зелёный, синий, красный; здесь 20 строк испытательной таблицы"],["Декодирование","QSSTV, MMSSTV, Robot36 на смартфоне"]]},"fax":{"nm":"Метеофакс","t":"Метеофакс: 1500 Гц чёрный, 2300 Гц белый","h":"Частота плавно идёт от чёрного к белому, 120 строк в минуту.","l":"Две неподвижные полосы на 1500 и 2300 Гц (800 Гц разнос), ровное «тик-так». Публикуются частоты несущей: слушай в USB на 1,9 кГц ниже (лист 32).","r":[["Кадр","Стартовый тон 300 Гц, строки фазирования (белый импульс), затем карта"],["Декодирование","fldigi, JWX, HamFax"]]},"elt":{"nm":"Сирена ELT","t":"Сирена ELT / PLB на 121,5 МГц","h":"AM, тон которой падает с 1600 до 300 Гц два-четыре раза в секунду.","l":"Неподвижная несущая и боковые полосы, скользящие веером: «уу-уу» аварийных маяков, также на 121,375 МГц для учений (листы 24 и 25)."},"406":{"nm":"Маяк 406","t":"Маяк 406 МГц: пачка BPSK","h":"Полсекунды передачи: 160 мс чистой несущей, затем фаза качается на ±1,1 радиана со скоростью 400 бит/с.","l":"Короткая чёрточка каждые 50 с, между 406,0 и 406,1 МГц; слушать нечего, нужен декодер (EPIRB 406, лист 25)."},"adsb":{"t":"ADS-B / режим S (1090 МГц): импульсы","h":"Импульсы 0,5 мкс, положение которых несёт биты (PPM); здесь шкала времени сильно замедлена.","l":"Очень короткие горизонтальные чёрточки по всей ширине, сотни в секунду возле аэропорта; нужен SDR-донгл (лист 13).","n":"шкала времени сильно замедлена"},"acars":{"t":"ACARS: AM и данные MSK","h":"AM, несущая два тона, 1200 и 2400 Гц, со скоростью 2400 бит/с.","l":"Пачки по полсекунды с несущей и боковыми полосами, на 131,525, 131,725 или 131,825 МГц в Европе: на слух «бррт» (лист 14)."},"ais":{"t":"AIS: GMSK 9600 Бод на двух каналах","h":"Сглаженная FSK (GMSK) пачками по 26 мс, то на 161,975 МГц, то на 162,025 МГц (в уменьшенном масштабе).","l":"Два столбца коротких чёрточек в 50 кГц друг от друга, ровное щёлканье; чем больше судов, тем гуще (лист 16).","n":"уменьшенный масштаб"},"navtex":{"t":"NAVTEX и ЦИВ на СВ и КВ: FSK 170 Гц","h":"Как RTTY: две частоты с разносом 170 Гц, но 100 Бод.","l":"Две параллельные линии без перерыва во время сводки, на 518 и 490 кГц (NAVTEX) или 2187,5 кГц (цифровой избирательный вызов) (лист 17).","r":[["Код","SITOR-B, CCIR 476: 7 бит с четырьмя «1», с повтором FEC"],["Декодирование","fldigi, YaND"]]},"hfdl":{"t":"HFDL: самолёты на КВ","h":"PSK 1800 Бод на поднесущей 1440 Гц.","l":"Пачки около 2,4 кГц между 2,9 и 22 МГц; шипение модема, которое то появляется, то пропадает (лист 14 bis)."},"ctcss":{"t":"CTCSS: субтон под голосом","h":"Низкий непрерывный тон (67–254 Гц, здесь 88,5 Гц), добавленный к голосу.","l":"В звуке FM-приёмника: неподвижная линия в самом низу, под голосом; открывает шумоподавитель ретрансляторов и раций (лист 8)."},"dtmf":{"sh":"2 тона","t":"DTMF: два тона на клавишу","h":"Каждая клавиша одновременно посылает низкий тон (697–941 Гц) и высокий (1209–1633 Гц).","l":"Пары точек на восьми неподвижных столбцах; «пи-пи» телефонных номеров и команд ретрансляторов (лист 8).","r":[["Последовательность","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 тонов","t":"Selcall CCIR: тоны по очереди","h":"Пять тонов по 100 мс подряд, по одному на цифру.","l":"Маленькая лесенка из точек, повторяется; быстрое «тулулулу», чтобы вызвать одну конкретную рацию (лист 28).","r":[["Последовательность","1 2 3 4 5, дважды; декодируется и приложением SelCall для UV-K1"]]},"pocsag":{"sh":"пейджеры","t":"POCSAG и FLEX: пейджеры","h":"FSK ±4,5 кГц; преамбула 1010…, затем данные (уменьшенный масштаб).","l":"Две чёткие линии во время преамбулы, затем сплошная полоса; пронзительное «брррт». 466,075 МГц, DAPNET 439,9875 МГц (лист 37).","n":"уменьшенный масштаб"},"ale":{"sh":"8 тонов","t":"ALE: автоматическое установление связи на КВ","h":"Восемь тонов от 750 до 2500 Гц, 125 Бод, пачками.","l":"Блок около 2 кГц из мелких точек, одна-две секунды, иногда на нескольких соседних частотах; высокое щебетание (лист 28 bis)."},"rs41":{"nm":"Радиозонд RS41","t":"Радиозонд RS41: непрерывная GFSK","h":"Сглаженная FSK 4800 Бод без остановки; частота медленно уходит, когда зонд поднимается и остывает.","l":"Полоса около 10 кГц, ползущая наискосок весь полёт, между 400 и 406 МГц (лист 18)."},"ook":{"nm":"Датчики 433","t":"Датчики 433 МГц: OOK","h":"Несущая включается и выключается короткими или длинными импульсами (всё или ничего); сообщение повторяется трижды.","l":"Пачки мелких точек, часто по три, на 433,92 МГц: метеостанции, датчики температуры, пульты (лист 19)."},"fhss":{"t":"Bluetooth: прыжки частоты (FHSS)","h":"Частота меняется 1600 раз в секунду среди 79 каналов (уменьшенный масштаб).","l":"Мелкие чёрточки разбросаны по всем 80 МГц, никогда в одном месте, около 2,4 ГГц (лист 22).","n":"уменьшенный масштаб"},"wspr":{"t":"WSPR: маяки прохождения","h":"Четыре тона через 1,46 Гц, 0,68 с на символ, в течение 110,6 с.","l":"Очень тонкая линия около 6 Гц длиной почти две минуты, каждые чётные две минуты: нужно сильно увеличить (лист 26).","n":"фрагмент 24 с (передача длится 110,6 с)"},"qrss":{"t":"QRSS: очень медленная морзянка","h":"Несущая включается и выключается, точки по 3–10 с, часто на двух соседних частотах (DFCW).","l":"Линии шириной в несколько Гц, читаются на десятиминутном экране; на слух не воспринимается (лист 26 bis).","n":"ускорено: точка 0,6 с вместо 3–10 с"},"texte":{"nm":"Текст в водопаде","t":"Текст в водопаде","h":"Каждая строка картинки становится группой тонов: звук похож на шум.","l":"Текст или рисунок появляется прямо на экране SDR (лист 33).","r":[["Примечание","Передаётся с низа картинки: прямо в живом водопаде, вверх ногами в отпечатке (читается сверху вниз)"]]},"vara":{"t":"Современные данные КВ: VARA, Pactor, ARDOP","h":"Длинные сплошные пачки (OFDM или PSK), а между ними короткие ответы другой станции.","l":"Прямоугольник около 2,4 кГц, который останавливается и снова начинается, с маленьким подтверждением посередине; рваное шипение (лист 26)."},"chirp":{"nm":"Ионозонд","t":"Ионозонд (ЛЧМ-зондирование)","h":"Медленная частотная пила через весь КВ-диапазон; эхо от ионосферы приходит чуть позже.","l":"Диагональ через экран вместе с параллельными линиями (эхо); «ффьють», пролетающий за долю секунды."},"oth":{"nm":"Загоризонтный радар","t":"Загоризонтный радар («дятел»)","h":"Импульсы повторяются 10–50 раз в секунду, каждый шириной несколько кГц.","l":"Широкий полосатый блок, перекрывающий целые диапазоны; очень ровный стук дятла на КВ."},"parasites":{"nm":"Помехи","sh":"блок питания","t":"Помехи от импульсного блока питания","h":"Прямоугольный сигнал: его частота и все гармоники выходят одновременно.","l":"Гребёнка ровных линий, дрейфующих вместе, на фоне шума: ищи с NOISE FIND или переносным приёмником (лист K21b)."},"mpx":{"nm":"FM-стерео и RDS","t":"FM-стерео и RDS","h":"Демодулированный звук (мультиплекс) содержит канал L+R, пилот 19 кГц, канал L-R около 38 кГц и RDS на 57 кГц.","l":"От 0 до 60 кГц после демодуляции: низкий блок, тонкая линия на 19 кГц, более слабый блок в середине и RDS на самом верху (лист 10).","n":"масштаб ÷ 20 для прослушивания"},"dcf77":{"t":"Сигнал времени DCF77 (77,5 кГц)","h":"Несущая падает до 15 % на 0,1 с (бит 0) или 0,2 с (бит 1) в начале каждой секунды.","l":"Неподвижная линия с чёрным провалом каждую секунду; на 59-й секунде провала нет, это отметка минуты (лист 10).","r":[["Примечание","Здесь несущая перенесена на 1000 Гц; на 6-й секунде провала нет, как на 59-й секунде каждой минуты"]]},"ofdm":{"t":"OFDM: десятки поднесущих","h":"Много плотно уложенных несущих, каждая медленная: сумма похожа на шум.","l":"Плоский прямоугольник с чёткими краями, всегда на месте: DRM на КВ (10 кГц), DAB+ (1,5 МГц), DVB-T, Wi-Fi. На слух ровное шипение (листы 10 и 22)."},"dsss":{"t":"Расширенный спектр (DSSS): GPS, Wi-Fi 802.11b","h":"Данные смешиваются с очень быстрым кодом: энергия размазывается по широкой полосе.","l":"Широкий горб чуть выше шума; GPS даже ниже шума и без обработки не виден (листы 22 и 23)."},"hline":{"nm":"Линия водорода","sh":"1420 МГц","t":"Линия водорода 21 см (1420,405 МГц)","h":"Холодный водород Млечного Пути излучает очень слабый шум на 1420,405 МГц. Движение спиральных рукавов смещает его эффектом Доплера: видно несколько маленьких горбов.","l":"В водопаде от секунды к секунде почти ничего: нужно долго усреднять, чтобы горбы вышли из шума. Здесь посмотри на средний спектр в остановке. Достаточно тарелки или рупора, малошумящего усилителя и SDR-донгла.","n":"сигнал сильно преувеличен"},"sun":{"nm":"Солнце","sh":"всплески","t":"Солнце: радиовсплески III типа","h":"Электроны, выброшенные вспышкой, проходят через солнечную корону и заставляют её излучать всё ниже по частоте по мере удаления.","l":"Линии, падающие наискосок сверху вниз по спектру меньше чем за секунду, на фоне солнечного шума; нарастающее «шшшш». Примерно от 10 до 400 МГц, также на КВ около 20 МГц."},"jupiter":{"nm":"Юпитер","sh":"20 МГц","t":"Юпитер: декаметровые всплески (L и S)","h":"Магнитное поле Юпитера и его спутник Ио дают мощное излучение между 15 и 40 МГц: медленные L-всплески и очень короткие S-всплески, быстро скользящие вниз.","l":"Сначала волны шума (L, как прибой), затем серии маленьких «хлопков» (S) плотными диагоналями. Около 20,1 МГц ночью, на простой диполь, когда Ио в удачном положении."},"pulsar":{"nm":"Пульсар","sh":"B0329+54","t":"Пульсар PSR B0329+54","h":"Вращающаяся нейтронная звезда проводит по Земле радиолучом, здесь каждые 0,714 с. Межзвёздный газ задерживает низкие частоты: каждый импульс приходит сначала в верх спектра.","l":"Ровное «тик»; в водопаде каждый импульс — нисходящая кривая (дисперсия). Настоящий сигнал под шумом: нужна большая антенна и сложение импульсов по их периоду.","n":"сигнал сильно преувеличен"},"meteor":{"nm":"Метеоры","sh":"GRAVES","t":"Метеорные отражения радара GRAVES (143,050 МГц)","h":"Французский радар GRAVES непрерывно излучает на 143,050 МГц. Когда падающая звезда ионизирует воздух, её след отражает немного сигнала к твоему приёмнику — на долю секунды или несколько секунд.","l":"В USB на 143,049 МГц: короткие «пинги» около 1000 Гц, иногда скользящее эхо (голова метеора, эффект Доплера) или долгое. Гораздо больше во время потоков (Персеиды, Геминиды) (лист 1)."},"whistler":{"nm":"Свисты","sh":"ОНЧ","t":"ОНЧ-свисты (вистлеры)","h":"Молния даёт радиощелчок; часть его уходит вдоль силовых линий магнитного поля Земли в другое полушарие и обратно, высокие тона первыми.","l":"«Фьююю», спускающееся от высоких к низким за одну-две секунды сразу после щелчка; повсюду треск (сферики). Ниже 10 кГц, на ОНЧ-приёмник вдали от линий электропередачи."},"chorus":{"nm":"Утренний хор","sh":"ОНЧ","t":"Утренний хор (dawn chorus)","h":"Во время магнитной бури электроны, захваченные магнитосферой, издают маленькие восходящие ноты, особенно на рассвете.","l":"Перекрывающееся восходящее щебетание, как птицы, примерно от 1 до 4 кГц. То же оборудование, что для свистов."},"sputnik":{"nm":"Спутник-1","sh":"1957","t":"Спутник-1 (1957)","h":"Первый искусственный спутник три недели передавал сигналы около 0,3 с поочерёдно на 20,005 и 40,002 МГц.","l":"Регулярно прерываемая линия: «бип… бип…» — звук, который в октябре 1957 года слушал весь мир (реконструкция)."},"doppler":{"nm":"Эффект Доплера","sh":"спутник","t":"Маяк спутника и эффект Доплера","h":"Спутник на низкой орбите приближается, затем удаляется: принимаемая частота во время пролёта падает примерно на ±3 кГц на 145 МГц и ±10 кГц на 435 МГц.","l":"Линия, спадающая S-образно: сначала медленно, быстро в точке наибольшего сближения, затем снова медленно (лист 34).","n":"пролёт 10 мин сжат до 12 с"},"apt":{"nm":"NOAA APT","sh":"137 МГц","t":"Спутники NOAA: изображения APT (история)","h":"Поднесущая 2400 Гц, амплитудно модулированная изображением, две строки в секунду, с синхроимпульсом в начале каждой строки. Отключено в 2025 году; сейчас спутники «Метеор-М» передают LRPT.","l":"Линия на 2400 Гц с боковыми полосами, меняющимися вместе с изображением, и знаменитое «тик-так» дважды в секунду (лист 34)."},"eme":{"nm":"Эхо от Луны","sh":"EME","t":"Эхо от Луны (EME)","h":"Сигнал, посланный к Луне, возвращается примерно через 2,5 с, чрезвычайно ослабленный, немного размытый и сдвинутый Доплером.","l":"Слышишь своё «бип», а через 2,5 с его слабое, чуть размытое эхо. Радиолюбители делают это в CW или JT65, от 144 МГц и выше (лист 1).","n":"эхо сильно преувеличено"}}},"uk":{"ui":{"title":"Визначник видів радіосигналів","mystery":"Загадковий звук","play":"▶ Слухати","stop":"■ Стоп","noise":"Шум","volume":"Гучність","loop":"По колу","specwf":"Спектр + водоспад","cursor":"курсор","footprint":"Відбиток","dur":"{s} с згори донизу","avg":"середнє по всьому сигналу","press":"Натисни «Слухати»: сигнал побіжить тут","count":"{n} сигналів, у порядку аркуша 5 bis","myst":"Загадка","mystTags":"Слухай і дивись, потім обери правильну відповідь","quizH":"Що це за сигнал?","quizLead":"Увімкни звук, подивись на спектр, водоспад і відбиток, потім відповідай.","score":"Рахунок","good":"Правильно!","bad":"Ні: це був {x}.","next":"Наступний загадковий звук","principle":"Принцип","screen":"На екрані","sheet":"аркуш","book":"Книга: аркуш {r}","lang":"Мова","signals":"Сигнали","f1":"Сигнали змодельовано просто на сторінці (12 000 відліків за секунду) за сигналами аркуша 5 bis книги OpenBookRadio, а також Olivia, FT4 і Feld Hell (аркуш 26). Для радіосигналів (AM, FM, AIS, LoRa…) показано змодельовану проміжну частоту, як на екрані SDR; деякі зменшено або прискорено, це вказано.","f2":"Час у водоспаді й відбитку йде донизу. Ліцензія CC BY-NC-SA 4.0, безкоштовно, не для продажу."},"groups":["Аналоговий голос","Телеграф","Дані","Зображення","Авіація, флот і рятування","Виклик, субтони й пейджинг","Радіозонди, датчики й пристрої","Режими КХ і дивовижі","Мовлення і час","Широка смуга","Бонус: звуки космосу"],"modes":{"am":{"sh":"голос","t":"AM: амплітудна модуляція","h":"Сила несучої йде за звуком: крива «надувається» і «здувається».","l":"Нерухома лінія в центрі (несуча) і з боків дві однакові бічні смуги. Ширина близько 6–9 кГц. Мовлення на КХ і СХ, авіація (аркуші 10 і 12)."},"ssb":{"nm":"ОБС / SSB","t":"SSB: одна бічна смуга","h":"Лишається одна бічна смуга без несучої: коли мовчать, нічого немає.","l":"Немає центральної лінії, одна смуга близько 2,7 кГц, жива лише під час мови. USB вище 10 МГц, LSB нижче (радіоаматори). При поганому налаштуванні голос звучить як «качка» (аркуші 9 і 26)."},"fm":{"sh":"голос","t":"FM: частотна модуляція","h":"Амплітуда стала; коливання згущуються або рідшають разом зі звуком.","l":"Сигнал танцює навколо своєї частоти і ширшає при гучному звуці: 12,5 кГц на канал у вузькосмуговій FM (рації, ретранслятори), 200 кГц у FM-мовленні (аркуші 2 і 11)."},"cw":{"t":"CW: абетка Морзе","h":"Несуча вмикається й вимикається: тире і крапки.","l":"Дуже тонка лінія, що переривається в ритмі Морзе; пищання у вусі. Тут «CQ» (аркуш 39).","r":[["Швидкість","20 слів/хв, крапка 60 мс, на 700 Гц: «CQ CQ CQ DE F4ABC K»"],["На слух","Чисті писки, довгі й короткі, на одній ноті"],["Декодування","На слух, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: дві частоти","h":"Частота стрибає між двома значеннями: одне для 0, інше для 1.",  26)."},"hell":{"t":"Feld Hell: письмо несучою","h":"Несуча вмикається й вимикається по точках: кожна літера — стовпці по 14 точок, розгорнуті знизу вгору (245 точок за секунду).","l":"У водоспаді рвана лінія; літери малює екран програми (fldigi). На слух м'яке потріскування (аркуш 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Чотири рівні частоти: кожен символ несе два біти.","l":"Прямокутний блок шириною 6–12,5 кГц, заповнений як шум, часто пачками (DMR ділить канал на два тайм-слоти). На слух хрипке «фррр» (аркуш 38)."},"mt63":{"t":"MT63: аварійні повідомлення (NBEMS)","h":"64 тони одночасно, кожен модульований повільно, з великою надлишковістю.","l":"Плаский блок 1 або 2 кГц навколо 1500 Гц з чіткими краями; рівне шипіння. Проходить навіть через мікрофон біля динаміка (аркуш 26 ter)."},"lora":{"t":"LoRa: частотні пилки (чирпи)","h":"Частота пробігає всю ширину й починає знову знизу: положення стрибка несе дані.","l":"Паралельні діагоналі, їх легко впізнати: Meshtastic і MeshCore на 869,525 МГц або 433 МГц, датчики LoRaWAN (аркуші 11, 20 і 21)."},"sstv":{"t":"SSTV: зображення у звуці","h":"Синхроімпульс на 1200 Гц, далі частота йде за яскравістю рядка: від 1500 (чорний) до 2300 Гц (білий).","l":"Регулярні лінії синхронізації й хмара, що змінюється з картинкою; «щебетливий» звук одну-дві хвилини. 14,230 МГц, МКС на 145,800 МГц (аркуш 31).","r":[["Кадр","Заголовок VIS, далі рядки: синхро 1200 Гц, зелений, синій, червоний; тут 20 рядків випробувальної таблиці"],["Декодування","QSSTV, MMSSTV, Robot36 на смартфоні"]]},"fax":{"nm":"Метеофакс","t":"Метеофакс: 1500 Гц чорний, 2300 Гц білий","h":"Частота плавно йде від чорного до білого, 120 рядків за хвилину.","l":"Дві нерухомі смуги на 1500 і 2300 Гц (800 Гц рознесення), рівне «тік-так». Публікуються частоти несучої: слухай в USB на 1,9 кГц нижче (аркуш 32).","r":[["Кадр","Стартовий тон 300 Гц, рядки фазування (білий імпульс), потім карта"],["Декодування","fldigi, JWX, HamFax"]]},"elt":{"nm":"Сирена ELT","t":"Сирена ELT / PLB на 121,5 МГц","h":"AM, тон якої падає з 1600 до 300 Гц два-чотири рази на секунду.","l":"Нерухома несуча й бічні смуги, що ковзають віялом: «уу-уу» аварійних маяків, також на 121,375 МГц для навчань (аркуші 24 і 25)."},"406":{"nm":"Маяк 406","t":"Маяк 406 МГц: пачка BPSK","h":"Півсекунди передачі: 160 мс чистої несучої, потім фаза гойдається на ±1,1 радіана зі швидкістю 400 біт/с.","l":"Коротка рисочка кожні 50 с, між 406,0 і 406,1 МГц; слухати нічого, потрібен декодер (EPIRB 406, аркуш 25)."},"adsb":{"t":"ADS-B / режим S (1090 МГц): імпульси","h":"Імпульси 0,5 мкс, положення яких несе біти (PPM); тут шкала часу сильно сповільнена.","l":"Дуже короткі горизонтальні рисочки по всій ширині, сотні за секунду біля аеропорту; потрібен SDR-донгл (аркуш 13).","n":"шкала часу сильно сповільнена"},"acars":{"t":"ACARS: AM і дані MSK","h":"AM, що несе два тони, 1200 і 2400 Гц, зі швидкістю 2400 біт/с.","l":"Пачки по півсекунди з несучою й бічними смугами, на 131,525, 131,725 або 131,825 МГц у Європі: на слух «бррт» (аркуш 14)."},"ais":{"t":"AIS: GMSK 9600 Бод на двох каналах","h":"Згладжена FSK (GMSK) пачками по 26 мс, то на 161,975 МГц, то на 162,025 МГц (у зменшеному масштабі).","l":"Два стовпці коротких рисочок за 50 кГц одна від одної, рівне клацання; що більше суден, то густіше (аркуш 16).","n":"зменшений масштаб"},"navtex":{"t":"NAVTEX і ЦВВ на СХ і КХ: FSK 170 Гц","h":"Як RTTY: дві частоти з рознесенням 170 Гц, але 100 Бод.","l":"Дві паралельні лінії без перерви під час зведення, на 518 і 490 кГц (NAVTEX) або 2187,5 кГц (цифровий вибірковий виклик) (аркуш 17).","r":[["Код","SITOR-B, CCIR 476: 7 біт із чотирма «1», з повтором FEC"],["Декодування","fldigi, YaND"]]},"hfdl":{"t":"HFDL: літаки на КХ","h":"PSK 1800 Бод на піднесучій 1440 Гц.","l":"Пачки близько 2,4 кГц між 2,9 і 22 МГц; шипіння модема, що то з'являється, то зникає (аркуш 14 bis)."},"ctcss":{"t":"CTCSS: субтон під голосом","h":"Низький безперервний тон (67–254 Гц, тут 88,5 Гц), доданий до голосу.","l":"У звуці FM-приймача: нерухома лінія в самому низу, під голосом; відкриває шумоподавлювач ретрансляторів і рацій (аркуш 8)."},"dtmf":{"sh":"2 тони","t":"DTMF: два тони на клавішу","h":"Кожна клавіша одночасно надсилає низький тон (697–941 Гц) і високий (1209–1633 Гц).","l":"Пари точок на восьми нерухомих стовпцях; «пі-пі» телефонних номерів і команд ретрансляторів (аркуш 8).","r":[["Послідовність","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 тонів","t":"Selcall CCIR: тони по черзі","h":"П'ять тонів по 100 мс поспіль, по одному на цифру.","l":"Маленька драбинка з точок, повторюється; швидке «тулулулу», щоб викликати одну певну рацію (аркуш 28).","r":[["Послідовність","1 2 3 4 5, двічі; декодує і застосунок SelCall для UV-K1"]]},"pocsag":{"sh":"пейджери","t":"POCSAG і FLEX: пейджери","h":"FSK ±4,5 кГц; преамбула 1010…, потім дані (зменшений масштаб).","l":"Дві чіткі лінії під час преамбули, далі суцільна смуга; пронизливе «брррт». 466,075 МГц, DAPNET 439,9875 МГц (аркуш 37).","n":"зменшений масштаб"},"ale":{"sh":"8 тонів","t":"ALE: автоматичне встановлення зв'язку на КХ","h":"Вісім тонів від 750 до 2500 Гц, 125 Бод, пачками.","l":"Блок близько 2 кГц із дрібних точок, одна-дві секунди, іноді на кількох сусідніх частотах; високе щебетання (аркуш 28 bis)."},"rs41":{"nm":"Радіозонд RS41","t":"Радіозонд RS41: безперервна GFSK","h":"Згладжена FSK 4800 Бод без зупинки; частота повільно дрейфує, коли зонд піднімається й холоне.","l":"Смуга близько 10 кГц, що повзе навскіс увесь політ, між 400 і 406 МГц (аркуш 18)."},"ook":{"nm":"Датчики 433","t":"Датчики 433 МГц: OOK","h":"Несуча вмикається й вимикається короткими або довгими імпульсами (усе або нічого); повідомлення повторюється тричі.","l":"Пачки дрібних точок, часто по три, на 433,92 МГц: метеостанції, датчики температури, пульти (аркуш 19)."},"fhss":{"t":"Bluetooth: стрибки частоти (FHSS)","h":"Частота змінюється 1600 разів на секунду серед 79 каналів (зменшений масштаб).","l":"Дрібні рисочки розкидані по всіх 80 МГц, ніколи в одному місці, біля 2,4 ГГц (аркуш 22).","n":"зменшений масштаб"},"wspr":{"t":"WSPR: маяки проходження","h":"Чотири тони через 1,46 Гц, 0,68 с на символ, протягом 110,6 с.","l":"Дуже тонка лінія близько 6 Гц завдовжки майже дві хвилини, кожні парні дві хвилини: треба сильно збільшити (аркуш 26).","n":"фрагмент 24 с (передача триває 110,6 с)"},"qrss":{"t":"QRSS: дуже повільна морзянка","h":"Несуча вмикається й вимикається, крапки по 3–10 с, часто на двох сусідніх частотах (DFCW).","l":"Лінії шириною кілька Гц, читаються на десятихвилинному екрані; на слух не сприймається (аркуш 26 bis).","n":"прискорено: крапка 0,6 с замість 3–10 с"},"texte":{"nm":"Текст у водоспаді","t":"Текст у водоспаді","h":"Кожен рядок картинки стає групою тонів: звук схожий на шум.","l":"Текст або малюнок з'являється просто на екрані SDR (аркуш 33).","r":[["Примітка","Передається з низу картинки: рівно в живому водоспаді, догори дриґом у відбитку (читається згори донизу)"]]},"vara":{"t":"Сучасні дані КХ: VARA, Pactor, ARDOP","h":"Довгі суцільні пачки (OFDM або PSK), а між ними короткі відповіді іншої станції.","l":"Прямокутник близько 2,4 кГц, що зупиняється й починається знову, з маленьким підтвердженням посередині; рване шипіння (аркуш 26)."},"chirp":{"nm":"Іонозонд","t":"Іонозонд (ЛЧМ-зондування)","h":"Повільна частотна пилка через увесь КХ-діапазон; відлуння від іоносфери приходить трохи пізніше.","l":"Діагональ через екран разом із паралельними лініями (відлуння); «ффюїть», що пролітає за частку секунди."},"oth":{"nm":"Загоризонтний радар","t":"Загоризонтний радар («дятел»)","h":"Імпульси повторюються 10–50 разів на секунду, кожен шириною кілька кГц.","l":"Широкий смугастий блок, що перекриває цілі діапазони; дуже рівний стукіт дятла на КХ."},"parasites":{"nm":"Завади","sh":"блок живлення","t":"Завади від імпульсного блока живлення","h":"Прямокутний сигнал: його частота й усі гармоніки виходять одночасно.","l":"Гребінка рівних ліній, що дрейфують разом, на тлі шуму: шукай з NOISE FIND або переносним приймачем (аркуш K21b)."},"mpx":{"nm":"FM-стерео і RDS","t":"FM-стерео і RDS","h":"Демодульований звук (мультиплекс) містить канал L+R, пілот 19 кГц, канал L-R біля 38 кГц і RDS на 57 кГц.","l":"Від 0 до 60 кГц після демодуляції: низький блок, тонка лінія на 19 кГц, слабший блок посередині й RDS на самому верху (аркуш 10).","n":"масштаб ÷ 20 для прослуховування"},"dcf77":{"t":"Сигнал часу DCF77 (77,5 кГц)","h":"Несуча падає до 15 % на 0,1 с (біт 0) або 0,2 с (біт 1) на початку кожної секунди.","l":"Нерухома лінія з чорним провалом щосекунди; на 59-й секунді провалу немає, це позначка хвилини (аркуш 10).","r":[["Примітка","Тут несучу перенесено на 1000 Гц; на 6-й секунді провалу немає, як на 59-й секунді кожної хвилини"]]},"ofdm":{"t":"OFDM: десятки піднесучих","h":"Багато щільно укладених несучих, кожна повільна: сума схожа на шум.","l":"Плаский прямокутник із чіткими краями, завжди на місці: DRM на КХ (10 кГц), DAB+ (1,5 МГц), DVB-T, Wi-Fi. На слух рівне шипіння (аркуші 10 і 22)."},"dsss":{"t":"Розширений спектр (DSSS): GPS, Wi-Fi 802.11b","h":"Дані змішуються з дуже швидким кодом: енергія розмазується по широкій смузі.","l":"Широкий горб ледь над шумом; GPS навіть нижче шуму й без обробки не видно (аркуші 22 і 23)."},"hline":{"nm":"Лінія водню","sh":"1420 МГц","t":"Лінія водню 21 см (1420,405 МГц)","h":"Холодний водень Чумацького Шляху випромінює дуже слабкий шум на 1420,405 МГц. Рух спіральних рукавів зсуває його ефектом Доплера: видно кілька маленьких горбів.","l":"У водоспаді від секунди до секунди майже нічого: треба довго усереднювати, щоб горби вийшли з шуму. Тут подивись на середній спектр у зупинці. Досить тарілки або рупора, малошумного підсилювача та SDR-донгла.","n":"сигнал дуже перебільшено"},"sun":{"nm":"Сонце","sh":"сплески","t":"Сонце: радіосплески III типу","h":"Електрони, викинуті спалахом, проходять крізь сонячну корону й змушують її випромінювати дедалі нижче за частотою, віддаляючись.","l":"Лінії, що падають навскіс згори донизу спектра менш ніж за секунду, на тлі сонячного шуму; наростаюче «шшшш». Приблизно від 10 до 400 МГц, також на КХ біля 20 МГц."},"jupiter":{"nm":"Юпітер","sh":"20 МГц","t":"Юпітер: декаметрові сплески (L і S)","h":"Магнітне поле Юпітера та його супутник Іо дають потужне випромінювання між 15 і 40 МГц: повільні L-сплески та дуже короткі S-сплески, що швидко ковзають донизу.","l":"Спершу хвилі шуму (L, як прибій), потім серії маленьких «хлопків» (S) щільними діагоналями. Біля 20,1 МГц уночі, на простий диполь, коли Іо вдало розташована."},"pulsar":{"nm":"Пульсар","sh":"B0329+54","t":"Пульсар PSR B0329+54","h":"Нейтронна зоря, що обертається, проводить по Землі радіопроменем, тут кожні 0,714 с. Міжзоряний газ затримує низькі частоти: кожен імпульс приходить спершу вгорі спектра.","l":"Рівне «тік»; у водоспаді кожен імпульс — низхідна крива (дисперсія). Справжній сигнал під шумом: потрібна велика антена й додавання імпульсів за їхнім періодом.","n":"сигнал дуже перебільшено"},"meteor":{"nm":"Метеори","sh":"GRAVES","t":"Метеорні відбиття радара GRAVES (143,050 МГц)","h":"Французький радар GRAVES безперервно випромінює на 143,050 МГц. Коли падаюча зоря іонізує повітря, її слід відбиває трохи сигналу до твого приймача — на частку секунди чи кілька секунд.","l":"В USB на 143,049 МГц: короткі «пінги» біля 1000 Гц, іноді ковзне відлуння (голова метеора, ефект Доплера) або довге. Значно більше під час потоків (Персеїди, Гемініди) (аркуш 1)."},"whistler":{"nm":"Свисти","sh":"ННЧ","t":"ННЧ-свисти (вістлери)","h":"Блискавка дає радіоклацання; частина його йде вздовж силових ліній магнітного поля Землі в іншу півкулю й назад, високі тони першими.","l":"«Фʼюююю», що спускається від високих до низьких за одну-дві секунди одразу після клацання; усюди тріск (сферики). Нижче 10 кГц, на ННЧ-приймач далеко від ліній електропередачі."},"chorus":{"nm":"Ранковий хор","sh":"ННЧ","t":"Ранковий хор (dawn chorus)","h":"Під час магнітної бурі електрони, захоплені магнітосферою, видають маленькі висхідні ноти, особливо на світанку.","l":"Висхідне щебетання, що накладається, як птахи, приблизно від 1 до 4 кГц. Те саме обладнання, що й для свистів."},"sputnik":{"nm":"Супутник-1","sh":"1957","t":"Супутник-1 (1957)","h":"Перший штучний супутник три тижні передавав сигнали близько 0,3 с почергово на 20,005 і 40,002 МГц.","l":"Регулярно перервана лінія: «біп… біп…» — звук, який у жовтні 1957 року слухав увесь світ (реконструкція)."},"doppler":{"nm":"Ефект Доплера","sh":"супутник","t":"Маяк супутника й ефект Доплера","h":"Супутник на низькій орбіті наближається, потім віддаляється: прийнята частота під час прольоту падає приблизно на ±3 кГц на 145 МГц і ±10 кГц на 435 МГц.","l":"Лінія, що спадає S-подібно: спершу повільно, швидко в точці найбільшого зближення, потім знову повільно (аркуш 34).","n":"проліт 10 хв стиснуто до 12 с"},"apt":{"nm":"NOAA APT","sh":"137 МГц","t":"Супутники NOAA: зображення APT (історія)","h":"Піднесуча 2400 Гц, амплітудно модульована зображенням, два рядки за секунду, із синхроімпульсом на початку кожного рядка. Вимкнено у 2025 році; тепер супутники «Метеор-М» передають LRPT.","l":"Лінія на 2400 Гц із бічними смугами, що змінюються разом із зображенням, і знамените «тік-так» двічі на секунду (аркуш 34)."},"eme":{"nm":"Відлуння від Місяця","sh":"EME","t":"Відлуння від Місяця (EME)","h":"Сигнал, надісланий до Місяця, повертається приблизно за 2,5 с, надзвичайно ослаблений, трохи розмитий і зсунутий Доплером.","l":"Чуєш своє «біп», а за 2,5 с його слабке, трохи розмите відлуння. Радіоаматори роблять це в CW або JT65, від 144 МГц і вище (аркуш 1).","n":"відлуння дуже перебільшено"}}},"zh":{"ui":{"title":"无线电模式识别器","mystery":"神秘声音","play":"▶ 收听","stop":"■ 停止","noise":"噪声","volume":"音量","loop":"循环","specwf":"频谱 + 瀑布图","cursor":"光标","footprint":"信号指纹","dur":"自上而下 {s} 秒","avg":"整个信号的平均值","press":"按“收听”：信号会在这里滚动","count":"{n} 种信号，按第 5 bis 页的顺序排列","myst":"神秘模式","mystTags":"边听边看，然后选出正确答案","quizH":"这是什么信号？","quizLead":"开始收听，观察频谱、瀑布图和信号指纹，然后作答。","score":"得分","good":"答对了！","bad":"答错了：这是 {x}。","next":"下一个神秘声音","principle":"原理","screen":"屏幕上","sheet":"页","book":"书中：第 {r} 页","lang":"语言","signals":"信号","f1":"信号在页面中模拟生成（每秒 12000 个采样），依据 OpenBookRadio 一书第 5 bis 页的信号，另加 Olivia、FT4 和 Feld Hell（第 26 页）。对于无线电信号（AM、FM、AIS、LoRa……），显示的是模拟的中频，就像 SDR 屏幕上那样；部分信号按比例缩小或加速，均有标注。","f2":"瀑布图和信号指纹中时间向下流动。许可协议 CC BY-NC-SA 4.0，免费，禁止出售。"},"groups":["模拟语音","电报","数据","图像","航空、航海与救援","呼叫、亚音与寻呼","探空仪、传感器与联网设备","短波模式与奇特信号","广播与授时","宽带","彩蛋：来自太空的声音"],"modes":{"am":{"nm":"AM 调幅","sh":"语音","t":"AM：幅度调制","h":"载波强度随声音变化：曲线时而“鼓起”，时而“瘪下”。","l":"中间一条固定的线（载波），两侧各有一条相同的边带。宽约 6 至 9 kHz。短波和中波广播、航空（第 10 和 12 页）。"},"ssb":{"nm":"SSB 单边带","t":"SSB：单边带","h":"只保留一条边带，没有载波：没人说话时什么都没有。","l":"没有中心线，只有一条约 2.7 kHz 宽的频带，只在说话时出现。10 MHz 以上用 USB，以下用 LSB（业余无线电）。调谐不准时，声音像“鸭子叫”（第 9 和 26 页）。"},"fm":{"nm":"FM 调频","sh":"语音","t":"FM：频率调制","h":"幅度保持不变；振荡随声音变密或变疏。","l":"信号在其频率附近跳动，声音越大越宽：窄带 FM 每信道 12.5 kHz（对讲机、中继），FM 广播 200 kHz（第 2 和 11 页）。"},"cw":{"nm":"CW 摩尔斯","t":"CW：摩尔斯电码","h":"载波开开关关：划和点。","l":"一条很细的线，按摩尔斯节奏断断续续；耳中是“嘀嘀”声。这里是“CQ”（第 39 页）。","r":[["速度","每分钟 20 词，点长 60 ms，700 Hz：“CQ CQ CQ DE F4ABC K”"],["听感","纯净的长短嘀声，同一个音高"],["解码","人耳、fldigi、CW Skimmer"]]},"rtty":{"t":"FSK / RTTY：两个频率","h":"频率在两个值之间跳变，一个代表 0，一个代表 1。","l":"两条平行线：业余无线电间隔 170 Hz（45.45 波特），气象广播 450 或 850 Hz。规律的“滴哩哩”声（第 27 页）。","r":[["编码","博多码 ITA2：5 位 + 起始位 + 1.5 停止位；mark 2125 Hz，space 2295 Hz"],["文本","RYRYRYRY CQ CQ DE F4ABC"],["解码","fldigi、MMTTY、2Tone"]]},"afsk":{"nm":"APRS 分组","t":"AFSK 1200 波特：APRS 与分组无线电","h":"两个音频音调，1200 和 2200 Hz，送入 FM 发射机。","l":"在 FM 接收机之后（扬声器声音）：1200 到 2200 Hz 的频带，短促成串。听起来是一秒钟的“咕噜噜”（第 29 和 30 页）。","r":[["频率","欧洲 144.800 MHz（APRS），FM"],["帧","0x7E 标志，然后是 NRZI 编码的 AX.25 数据"],["解码","Direwolf、multimon-ng、KISS TNC"]]},"psk31":{"t":"PSK31：相位调制","h":"频率不动，是相位在翻转；每次翻转时幅度下陷。","l":"一条约 60 Hz 宽的极细线，略带“编织”纹。3 kHz 内可容纳几十个电台（第 26 页）。","r":[["编码","Varicode：0 = 相位翻转，1 = 不变；空闲时是两条孪生线"],["收听频率","14070 kHz、3580 kHz"],["解码","fldigi"]]},"ft8":{"t":"MFSK / FT8：八个音调","h":"频率以 6.25 Hz 的台阶上下变化，每个台阶 0.16 秒。","l":"约 50 Hz 宽的频带，持续 12.6 秒，每 15 秒按时钟重复：3 kHz 内同时有多个电台，例如 7.074 MHz（第 26 页）。","r":[["帧","79 个 0.16 秒的符号，三组 Costas 同步图案（开头、中间、结尾）；这里有八个电台"],["频率","14074、7074、3573、10136、21074、28074 kHz"],["解码","WSJT-X、JTDX（电脑时间要准确）"]]},"ft4":{"t":"FT4：竞赛用的 FT8","h":"四个音调间隔 20.8 Hz，20.8 波特：5 秒内 105 个符号，按 7.5 秒时隙发送。","l":"约 90 Hz 宽的频带，比 FT8 更短更宽，每 7.5 秒重复。14080、7047.5 kHz（第 26 页）。"},"olivia":{"t":"Olivia 8/250：八个音调","h":"八个间隔 31.25 Hz 的音调，每次一个，随机跳动；Walsh 编码和交织。","l":"在 250 Hz 内散布的一片点；可在远低于噪声时解码。听起来是一段随机的小旋律（第 26 页）。"},"hell":{"nm":"Feld Hell 海尔","t":"Feld Hell：用载波写字","h":"载波逐点开关：每个字母由 14 点一列的若干列组成，从下往上扫描（每秒 245 点）。","l":"瀑布图上是一条断续的线；字母要由软件屏幕（fldigi）画出来。听起来是轻柔的噼啪声（第 26 页）。"},"4fsk":{"t":"4FSK：DMR、C4FM（Fusion）、NXDN、dPMR","h":"四个频率等级：每个符号携带两位。","l":"6 至 12.5 kHz 宽的矩形块，像噪声一样填满，常成串出现（DMR 把信道分成两个时隙）。听起来是沙哑的“呼噜噜”（第 38 页）。"},"mt63":{"t":"MT63：应急消息（NBEMS）","h":"同时发 64 个音调，每个都缓慢调制，冗余度很高。","l":"以 1500 Hz 为中心、宽 1 或 2 kHz 的平坦块，边缘清晰；规律的嘶嘶声。即使把话筒贴在扬声器上也能传（第 26 ter 页）。"},"lora":{"t":"LoRa：频率斜坡（啁啾）","h":"频率扫过整个带宽，然后从底部重新开始：跳变的位置携带数据。","l":"平行的斜线，很容易认出：Meshtastic 和 MeshCore 在 869.525 MHz 或 433 MHz，LoRaWAN 传感器（第 11、20 和 21 页）。"},"sstv":{"nm":"SSTV 慢扫描电视","t":"SSTV：声音里的图像","h":"1200 Hz 的同步脉冲，然后频率跟随一行的亮度，从 1500 Hz（黑）到 2300 Hz（白）。","l":"规律的同步线和随图像变化的一团云；“啾啾”声持续一到两分钟。14.230 MHz，国际空间站 145.800 MHz（第 31 页）。","r":[["帧","VIS 头，然后是各行：1200 Hz 同步，绿、蓝、红；这里是测试图的 20 行"],["解码","QSSTV、MMSSTV、手机上的 Robot36"]]},"fax":{"nm":"气象传真","t":"气象传真：1500 Hz 黑，2300 Hz 白","h":"频率从黑到白连续变化，每分钟 120 行。","l":"1500 和 2300 Hz 两条固定频带（相距 800 Hz），规律的“嘀嗒”声。公布的是载波频率：用 USB 在低 1.9 kHz 处收听（第 32 页）。","r":[["帧","300 Hz 起始音、定相行（白色脉冲），然后是图"],["解码","fldigi、JWX、HamFax"]]},"elt":{"nm":"ELT 警笛","t":"121.5 MHz 上的 ELT / PLB 警笛","h":"一种 AM 信号，其音调每秒两到四次从 1600 Hz 降到 300 Hz。","l":"固定的载波和像扇子一样滑动的边带：遇险信标的“呜—呜”声，演练时也用 121.375 MHz（第 24 和 25 页）。"},"406":{"nm":"406 信标","t":"406 MHz 信标：BPSK 突发","h":"发射半秒：160 ms 纯载波，然后相位以 400 bit/s 在 ±1.1 弧度间切换。","l":"一条每 50 秒出现一次的短线，位于 406.0 至 406.1 MHz 之间；没什么可听的，需要解码器（EPIRB 406，第 25 页）。"},"adsb":{"t":"ADS-B / S 模式（1090 MHz）：脉冲","h":"0.5 微秒的脉冲，其位置携带比特（PPM）；这里的时间轴大大放慢。","l":"横贯全宽的极短横线，机场附近每秒数百条；需要 SDR 接收棒（第 13 页）。","n":"时间轴大大放慢"},"acars":{"t":"ACARS：AM 与 MSK 数据","h":"一种携带两个音调（1200 和 2400 Hz）的 AM 信号，速率 2400 bit/s。","l":"半秒长的突发，带载波和边带，欧洲在 131.525、131.725 或 131.825 MHz：听起来是“噗噜噜”（第 14 页）。"},"ais":{"nm":"AIS 船舶","t":"AIS：两个信道上的 GMSK 9600 波特","h":"平滑的 FSK（GMSK），每次 26 ms 突发，交替在 161.975 MHz 和 162.025 MHz（比例缩小）。","l":"两列短促的小线段，相距 50 kHz，规律的咔哒声；船越多越密（第 16 页）。","n":"比例缩小"},"navtex":{"t":"中波和短波上的 NAVTEX 与 DSC：FSK 170 Hz","h":"与 RTTY 相似：两个相距 170 Hz 的频率，但速率是 100 波特。","l":"播报期间连续的两条平行线，位于 518 和 490 kHz（NAVTEX）或 2187.5 kHz（数字选择呼叫）（第 17 页）。","r":[["编码","SITOR-B，CCIR 476：7 位中有四个“1”，带 FEC 重复"],["解码","fldigi、YaND"]]},"hfdl":{"t":"HFDL：短波上的飞机","h":"在 1440 Hz 副载波上的 1800 波特 PSK。","l":"在 2.9 至 22 MHz 之间约 2.4 kHz 宽的突发；时有时无的调制解调器嘶声（第 14 bis 页）。"},"ctcss":{"nm":"CTCSS 亚音","t":"CTCSS：语音下的亚音","h":"在语音中加入一个低沉的连续音调（67 至 254 Hz，这里是 88.5 Hz）。","l":"在 FM 接收机的声音中：最底部的一条固定线，在语音下方；它用来打开中继和对讲机的静噪（第 8 页）。"},"dtmf":{"nm":"DTMF 双音","sh":"2 个音","t":"DTMF：每个按键两个音调","h":"每个按键同时发出一个低音（697 至 941 Hz）和一个高音（1209 至 1633 Hz）。","l":"成对的点排列在八个固定列上；电话号码和中继命令的“嘀嘀”声（第 8 页）。","r":[["序列","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"nm":"CCIR 选呼","sh":"5 个音","t":"CCIR 选呼：依次发出的音调","h":"五个 100 ms 的音调接连发出，每个数字一个。","l":"一段小小的点状台阶，会重复；快速的“嘟噜噜噜”用来呼叫某一部电台（第 28 页）。","r":[["序列","1 2 3 4 5，两遍；UV-K1 的 SelCall 应用也能解码"]]},"pocsag":{"nm":"POCSAG 寻呼","sh":"寻呼机","t":"POCSAG 与 FLEX：寻呼机","h":"±4.5 kHz 的 FSK；先是 1010… 前导码，然后是数据（比例缩小）。","l":"前导码期间两条清晰的线，然后是一条填满的频带；刺耳的“噗噜噜”。466.075 MHz，DAPNET 439.9875 MHz（第 37 页）。","n":"比例缩小"},"ale":{"sh":"8 个音","t":"ALE：短波自动链路建立","h":"750 至 2500 Hz 的八个音调，125 波特，成串发送。","l":"约 2 kHz 宽、由小点组成的块，持续一到两秒，有时出现在几个相邻频率上；尖细的啁啾声（第 28 bis 页）。"},"rs41":{"nm":"RS41 探空仪","t":"RS41 探空仪：连续 GFSK","h":"4800 波特的平滑 FSK，不停发送；探空仪上升变冷时，频率会慢慢漂移。","l":"一条约 10 kHz 宽的频带，在整个飞行过程中斜着滑动，位于 400 至 406 MHz 之间（第 18 页）。"},"ook":{"nm":"433 传感器","t":"433 MHz 传感器：OOK","h":"载波以长短脉冲开关（通断键控）；同一消息重复三次。","l":"成串的小点，常三次一组，位于 433.92 MHz：气象站、温度探头、遥控器（第 19 页）。"},"fhss":{"nm":"蓝牙","t":"蓝牙：跳频（FHSS）","h":"频率每秒在 79 个信道之间切换 1600 次（比例缩小）。","l":"小线段散布在 80 MHz 宽度内，从不在同一处，位于 2.4 GHz 附近（第 22 页）。","n":"比例缩小"},"wspr":{"t":"WSPR：传播信标","h":"四个间隔 1.46 Hz 的音调，每个符号 0.68 秒，持续 110.6 秒。","l":"一条约 6 Hz 宽的极细线，持续将近两分钟，每逢偶数分钟出现：需要大幅放大（第 26 页）。","n":"24 秒片段（一次发射持续 110.6 秒）"},"qrss":{"t":"QRSS：极慢摩尔斯","h":"载波开开关关，点长 3 至 10 秒，常在两个相邻频率上（DFCW）。","l":"只有几 Hz 宽的线，在十分钟的屏幕上读取；人耳听不出来（第 26 bis 页）。","n":"已加速：点长 0.6 秒，而不是 3 至 10 秒"},"texte":{"nm":"瀑布图文字","t":"瀑布图中的文字","h":"图像的每一行变成一组音调：声音听起来像噪声。","l":"文字或图画直接出现在 SDR 屏幕上（第 33 页）。","r":[["说明","从图像底部开始发送：在实时瀑布图中是正的，在信号指纹中是倒的（自上而下阅读）"]]},"vara":{"t":"现代短波数据：VARA、Pactor、ARDOP","h":"长而饱满的突发（OFDM 或 PSK），中间夹着对方电台的简短应答。","l":"约 2.4 kHz 宽的矩形，停了又起，中间有一个小小的确认；断断续续的嘶声（第 26 页）。"},"chirp":{"nm":"电离层探测","t":"电离层探测仪（啁啾探测）","h":"一条缓慢的频率斜坡穿过整个短波段；电离层的回波稍后到达。","l":"一条扫过屏幕的斜线，旁边伴有平行线（回波）；一声“嗖”，转瞬即逝。"},"oth":{"nm":"超视距雷达","t":"超视距雷达（“啄木鸟”）","h":"脉冲每秒重复 10 到 50 次，每个脉冲宽几 kHz。","l":"覆盖整个波段的宽条纹块；短波上非常规律的啄木鸟敲击声。"},"parasites":{"nm":"干扰","sh":"开关电源","t":"开关电源的干扰","h":"方波：它的频率和所有谐波同时出现。","l":"在噪声背景上一起漂移的规则梳状谱线：可用 NOISE FIND 或便携式接收机查找（第 K21b 页）。"},"mpx":{"nm":"FM 立体声与 RDS","t":"FM 立体声广播与 RDS","h":"解调后的声音（复合信号）包含 L+R 声道、19 kHz 导频、38 kHz 附近的 L-R 声道和 57 kHz 的 RDS。","l":"解调后从 0 到 60 kHz 看：低频块、19 kHz 处的细线、中间较弱的块，以及最上方的 RDS（第 10 页）。","n":"为便于收听缩小 20 倍"},"dcf77":{"nm":"DCF77 授时","t":"DCF77 授时信号（77.5 kHz）","h":"每秒开始时，载波降到 15%，持续 0.1 秒（位 0）或 0.2 秒（位 1）。","l":"一条固定的线，每秒有一个黑色缺口；第 59 秒没有缺口，用来标记整分（第 10 页）。","r":[["说明","这里把载波移到 1000 Hz；第 6 秒没有缺口，就像每分钟的第 59 秒"]]},"ofdm":{"t":"OFDM：几十个子载波","h":"许多排得很密的载波，每个都很慢：叠加起来像噪声。","l":"边缘清晰的平坦矩形，一直都在：短波 DRM（10 kHz）、DAB+（1.5 MHz）、数字电视、Wi-Fi。听起来是持续的嘶声（第 10 和 22 页）。"},"dsss":{"t":"扩频（DSSS）：GPS、Wi-Fi 802.11b","h":"数据与非常快的码相混合：能量分散到很宽的频带上。","l":"一个宽宽的鼓包，勉强高出噪声；GPS 甚至在噪声之下，不经处理看不到（第 22 和 23 页）。"},"hline":{"nm":"氢线","sh":"1420 MHz","t":"21 厘米氢线（1420.405 MHz）","h":"银河系中的冷氢在 1420.405 MHz 上发出极弱的噪声。银河旋臂的运动通过多普勒效应使其频移：可以看到几个小鼓包。","l":"瀑布图里每一秒几乎都看不出什么：要长时间平均，鼓包才会从噪声中浮现。这里请在停止后看平均频谱。一面抛物面天线或喇叭天线、一个前置放大器和一根 SDR 接收棒就够了。","n":"信号已大幅夸大"},"sun":{"nm":"太阳","sh":"射电暴","t":"太阳：III 型射电暴","h":"耀斑抛出的电子穿过日冕，越走越远，使日冕发出的频率越来越低。","l":"在太阳噪声背景上，一条条线在不到一秒内从频谱上方斜着落到下方；越来越响的“嘶——”。约 10 至 400 MHz，短波 20 MHz 附近也能听到。"},"jupiter":{"nm":"木星","sh":"20 MHz","t":"木星：十米波射电暴（L 型和 S 型）","h":"木星的磁场和它的卫星木卫一（Io）在 15 至 40 MHz 之间产生强烈辐射：缓慢的 L 型暴和极短的、快速向下滑动的 S 型暴。","l":"先是一阵阵噪声浪潮（L 型，像海浪），然后是一串串密集斜线状的小“噗”声（S 型）。夜间在 20.1 MHz 附近，用简单的偶极天线即可，前提是木卫一位置合适。"},"pulsar":{"nm":"脉冲星","sh":"B0329+54","t":"脉冲星 PSR B0329+54","h":"一颗自转的中子星用射电波束扫过地球，这里每 0.714 秒一次。星际气体使低频延迟：每个脉冲先到达频谱上方。","l":"规律的“嗒”声；在瀑布图中，每个脉冲是一条向下弯的曲线（色散）。真实信号在噪声之下：需要大天线，并按周期把脉冲叠加起来。","n":"信号已大幅夸大"},"meteor":{"nm":"流星","sh":"GRAVES","t":"GRAVES 雷达的流星回波（143.050 MHz）","h":"法国 GRAVES 雷达在 143.050 MHz 上不停发射。流星电离空气时，其尾迹会把一点信号反射到你的接收机，持续零点几秒到几秒。","l":"在 143.049 MHz 用 USB 收听：1000 Hz 附近短促的“叮”声，有时回波会滑动（流星头，多普勒效应）或持续较久。流星雨期间（英仙座、双子座）多得多（第 1 页）。"},"whistler":{"nm":"哨声","sh":"甚低频","t":"甚低频哨声（whistler）","h":"闪电产生一声射电“咔哒”；其中一部分沿地磁场磁力线传到另一半球再返回，高音先到。","l":"紧跟在一声“咔哒”之后，一个“啾——”在一两秒内从高音降到低音；到处是噼啪声（天电）。低于 10 kHz，用远离电线的甚低频接收机收听。"},"chorus":{"nm":"黎明合唱","sh":"甚低频","t":"黎明合唱（dawn chorus）","h":"磁暴期间，被困在磁层中的电子发出上升的小音符，多在日出时分。","l":"重叠在一起的上升鸣叫声，像鸟儿一样，约 1 至 4 kHz。所需设备与哨声相同。"},"sputnik":{"nm":"斯普特尼克 1 号","sh":"1957","t":"斯普特尼克 1 号（1957）","h":"第一颗人造卫星在 20.005 和 40.002 MHz 上交替发出约 0.3 秒的“哔”声，持续三周。","l":"一条规律断开的线：“哔……哔……”，1957 年 10 月全世界都在收听的声音（复原）。"},"doppler":{"nm":"多普勒效应","sh":"卫星","t":"卫星信标与多普勒效应","h":"低轨卫星先靠近再远离：过境期间接收频率下降，145 MHz 约 ±3 kHz，435 MHz 约 ±10 kHz。","l":"一条呈 S 形下降的线：开始慢，卫星最近时快，之后又变慢（第 34 页）。","n":"10 分钟过境压缩为 12 秒"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA 卫星：APT 图像（历史）","h":"2400 Hz 副载波由图像进行幅度调制，每秒两行，每行开头有同步脉冲。已于 2025 年停止；如今 Meteor-M 卫星发送 LRPT。","l":"2400 Hz 处的一条线，边带随图像变化，还有著名的每秒两次的“嘀嗒”声（第 34 页）。"},"eme":{"nm":"月球回波","sh":"EME","t":"月球回波（EME）","h":"发往月球的信号约 2.5 秒后返回，衰减极大，略微展宽，并有多普勒频移。","l":"先听到自己的“哔”，2.5 秒后听到微弱、略显模糊的回波。业余无线电爱好者用 CW 或 JT65 在 144 MHz 及以上进行（第 1 页）。","n":"回波已大幅夸大"}}},"ja":{"ui":{"title":"無線モード識別器","mystery":"ミステリー音","play":"▶ 聴く","stop":"■ 停止","noise":"ノイズ","volume":"音量","loop":"ループ","specwf":"スペクトラム + ウォーターフォール","cursor":"カーソル","footprint":"信号の全体像","dur":"上から下へ {s} 秒","avg":"信号全体の平均","press":"「聴く」を押すと、ここに信号が流れます","count":"{n} 種類の信号（第 5 bis シートの順）","myst":"ミステリーモード","mystTags":"聴いて見てから、正しい答えを選んでください","quizH":"これはどの信号？","quizLead":"再生して、スペクトラム、ウォーターフォール、全体像を見てから答えてください。","score":"スコア","good":"正解！","bad":"残念：正解は {x} でした。","next":"次のミステリー音","principle":"しくみ","screen":"画面上","sheet":"シート","book":"本：シート {r}","lang":"言語","signals":"信号","f1":"信号はページ内でシミュレートしています（毎秒 12,000 サンプル）。OpenBookRadio の本の第 5 bis シートの信号に、Olivia、FT4、Feld Hell（第 26 シート）を加えました。無線信号（AM、FM、AIS、LoRa など）は SDR の画面と同じく、シミュレートした中間周波数で表示しています。一部は縮小または高速化しており、その旨を表示しています。","f2":"ウォーターフォールと全体像では時間が下へ流れます。ライセンス CC BY-NC-SA 4.0、無料、販売禁止。"},"groups":["アナログ音声","電信","データ","画像","航空・海事・救難","呼出し・サブトーン・ページング","ラジオゾンデ・センサー・IoT機器","HF モードと珍しい信号","放送と時刻","広帯域","ボーナス：宇宙の音"],"modes":{"am":{"sh":"音声","t":"AM：振幅変調","h":"搬送波の強さが音に合わせて変わり、波形が「ふくらんだり」「しぼんだり」します。","l":"中央に固定の線（搬送波）、その両側に同じ側波帯。幅は約 6〜9 kHz。短波・中波放送、航空無線（シート 10 と 12）。"},"ssb":{"t":"SSB：単側波帯","h":"側波帯が一つだけ残り、搬送波はありません。話していないときは何もありません。","l":"中央線がなく、話しているときだけ現れる幅約 2.7 kHz の帯一本。10 MHz 以上は USB、以下は LSB（アマチュア無線）。同調がずれると「アヒル声」になります（シート 9 と 26）。"},"fm":{"sh":"音声","t":"FM：周波数変調","h":"振幅は一定で、音に合わせて振動の間隔が詰まったり広がったりします。","l":"信号は自分の周波数のまわりで揺れ、音が大きいほど広がります。ナローFM は 1 チャンネル 12.5 kHz（トランシーバー、レピーター）、FM 放送は 200 kHz（シート 2 と 11）。"},"cw":{"nm":"CW モールス","t":"CW：モールス符号","h":"搬送波をオン・オフします：長点と短点。","l":"モールスのリズムで途切れるとても細い線。耳には「ピッ」という音。ここでは「CQ」（シート 39）。","r":[["速度","毎分 20 語、短点 60 ms、700 Hz：「CQ CQ CQ DE F4ABC K」"],["耳で","一つの音程の、長短の澄んだビープ音"],["デコード","耳、fldigi、CW Skimmer"]]},"rtty":{"t":"FSK / RTTY：二つの周波数","h":"周波数が二つの値の間を跳びます。一方が 0、もう一方が 1。","l":"平行な二本線：アマチュア無線では 170 Hz 間隔（45.45 ボー）、気象通報では 450 または 850 Hz。規則的な「ティディリディ」（シート 27）。","r":[["符号","ボー ITA2：5 ビット + スタート + 1.5 ストップ；mark 2125 Hz、space 2295 Hz"],["テキスト","RYRYRYRY CQ CQ DE F4ABC"],["デコード","fldigi、MMTTY、2Tone"]]},"afsk":{"nm":"APRS パケット","t":"AFSK 1200 ボー：APRS とパケット通信","h":"1200 Hz と 2200 Hz の二つの可聴音を FM 送信機に入れます。","l":"FM 受信機の後（スピーカーの音）で見ると、1200〜2200 Hz の帯が短いバーストで現れます。耳には 1 秒ほどの「グルルッ」（シート 29 と 30）。","r":[["周波数","ヨーロッパでは 144.800 MHz（APRS）、FM"],["フレーム","0x7E フラグのあと NRZI の AX.25 データ"],["デコード","Direwolf、multimon-ng、KISS TNC"]]},"psk31":{"t":"PSK31：位相変調","h":"周波数は動かず、位相が反転します。反転のたびに振幅が落ち込みます。","l":"幅約 60 Hz のとても細い線で、少し「編んだ」ように見えます。3 kHz に数十局が入ります（シート 26）。","r":[["符号","Varicode：0 = 位相反転、1 = 変化なし；待機中は双子の二本線"],["受信周波数","14,070 kHz、3,580 kHz"],["デコード","fldigi"]]},"ft8":{"t":"MFSK / FT8：八つのトーン","h":"周波数が 6.25 Hz 刻みで上下し、1 段 0.16 秒です。","l":"幅約 50 Hz の帯が 12.6 秒続き、時計に合わせて 15 秒ごとに戻ってきます。3 kHz に同時に何局も入ります（例：7.074 MHz、シート 26）。","r":[["フレーム","0.16 秒の 79 シンボル、3 つの Costas パターン（始め、中央、終わり）；ここでは 8 局"],["周波数","14,074、7,074、3,573、10,136、21,074、28,074 kHz"],["デコード","WSJT-X、JTDX（PC の時刻を正確に）"]]},"ft4":{"t":"FT4：コンテスト向けの FT8","h":"20.8 Hz 間隔の四つのトーン、20.8 ボー：5 秒で 105 シンボル、7.5 秒の時間枠。","l":"幅約 90 Hz の帯で、FT8 より短く広く、7.5 秒ごとに戻ってきます。14,080、7,047.5 kHz（シート 26）。"},"olivia":{"t":"Olivia 8/250：八つのトーン","h":"31.25 Hz 間隔の八つのトーンが一度に一つずつ、ランダムに跳びます。ウォルシュ符号とインターリーブ。","l":"250 Hz に散らばった点の塊。ノイズよりはるかに弱くてもデコードできます。耳には小さなランダムなメロディー（シート 26）。"},"hell":{"t":"Feld Hell：搬送波で文字を書く","h":"搬送波を点ごとにオン・オフします。各文字は 14 点の列でできていて、下から上へ走査します（毎秒 245 点）。","l":"ウォーターフォールでは途切れ途切れの線。文字はソフト（fldigi）の画面が描き直します。耳には柔らかなパチパチ音（シート 26）。"},"4fsk":{"t":"4FSK：DMR、C4FM（Fusion）、NXDN、dPMR","h":"周波数が四段階：1 シンボルで 2 ビットを運びます。","l":"幅 6〜12.5 kHz の長方形のブロックで、ノイズのように埋まっていて、多くはバースト状（DMR はチャンネルを二つのタイムスロットに分けます）。耳にはしゃがれた「フルル」（シート 38）。"},"mt63":{"t":"MT63：非常通信メッセージ（NBEMS）","h":"64 のトーンを同時に、それぞれゆっくり変調し、冗長性を大きくとります。","l":"1500 Hz を中心とした幅 1 または 2 kHz の平らなブロックで、縁がくっきり。一定のシャー音。スピーカーにマイクを当てても通ります（シート 26 ter）。"},"lora":{"t":"LoRa：周波数スイープ（チャープ）","h":"周波数が全幅を掃引して下から再スタート。跳ぶ位置がデータを運びます。","l":"平行な斜め線で見分けやすい：869.525 MHz または 433 MHz の Meshtastic と MeshCore、LoRaWAN センサー（シート 11、20、21）。"},"sstv":{"t":"SSTV：音で送る画像","h":"1200 Hz の同期パルスのあと、周波数が行の明るさに合わせて 1500 Hz（黒）から 2300 Hz（白）まで変わります。","l":"規則的な同期線と、画像とともに変わる雲。1〜2 分間「さえずる」ような音。14.230 MHz、ISS は 145.800 MHz（シート 31）。","r":[["フレーム","VIS ヘッダーのあと各行：1200 Hz 同期、緑、青、赤；ここではテストパターン 20 行"],["デコード","QSSTV、MMSSTV、スマホの Robot36"]]},"fax":{"nm":"気象ファクス","t":"気象ファクス：1500 Hz 黒、2300 Hz 白","h":"周波数が黒から白へ連続して変わります。毎分 120 行。","l":"1500 Hz と 2300 Hz の二本の固定帯（800 Hz 間隔）、規則的な「チクタク」。公表周波数は搬送波なので、USB で 1.9 kHz 下を受信します（シート 32）。","r":[["フレーム","300 Hz の開始音、位相合わせの行（白パルス）、そして天気図"],["デコード","fldigi、JWX、HamFax"]]},"elt":{"nm":"ELT サイレン","t":"121.5 MHz の ELT / PLB サイレン","h":"音程が毎秒 2〜4 回、1600 Hz から 300 Hz へ下がる AM 信号です。","l":"固定の搬送波と、扇のように滑る側波帯。遭難信号ビーコンの「ウーウー」で、訓練用には 121.375 MHz も使います（シート 24 と 25）。"},"406":{"nm":"406 ビーコン","t":"406 MHz ビーコン：BPSK バースト","h":"送信は 0.5 秒：160 ms の無変調搬送波のあと、位相が 400 bit/s で ±1.1 ラジアン振れます。","l":"406.0〜406.1 MHz に 50 秒ごとに現れる短い線。聴いても役に立たず、デコーダーが必要です（EPIRB 406、シート 25）。"},"adsb":{"t":"ADS-B / モード S（1090 MHz）：パルス","h":"位置がビットを表す 0.5 µs のパルス（PPM）。ここでは時間軸を大きく引き伸ばしています。","l":"全幅にわたるごく短い横線で、空港の近くでは毎秒数百本。SDR ドングルが必要です（シート 13）。","n":"時間軸を大きく引き伸ばし"},"acars":{"t":"ACARS：AM と MSK データ","h":"1200 Hz と 2400 Hz の二つのトーンを 2400 bit/s で運ぶ AM 信号です。","l":"搬送波と側波帯をもつ 0.5 秒のバースト。ヨーロッパでは 131.525、131.725、131.825 MHz。耳には「ブルルッ」（シート 14）。"},"ais":{"t":"AIS：二つのチャンネルの GMSK 9600 ボー","h":"なめらかな FSK（GMSK）の 26 ms バーストを、161.975 MHz と 162.025 MHz に交互に送ります（縮小表示）。","l":"50 kHz 離れた短い線の二つの列と、規則的なカチカチ音。船が多いほど密になります（シート 16）。","n":"縮小表示"},"navtex":{"t":"中波・短波の NAVTEX と DSC：FSK 170 Hz","h":"RTTY と同じく 170 Hz 離れた二つの周波数ですが、速度は 100 ボーです。","l":"通報中は途切れない平行な二本線。518 kHz と 490 kHz（NAVTEX）、または 2187.5 kHz（デジタル選択呼出し）（シート 17）。","r":[["符号","SITOR-B、CCIR 476：7 ビット中 4 つが「1」、FEC の繰り返し付き"],["デコード","fldigi、YaND"]]},"hfdl":{"t":"HFDL：短波の航空機データ","h":"1440 Hz のサブキャリアに乗せた 1800 ボーの PSK です。","l":"2.9〜22 MHz に現れる幅約 2.4 kHz のバースト。現れては消えるモデムのシャー音（シート 14 bis）。"},"ctcss":{"t":"CTCSS：声の下のサブトーン","h":"声に低い連続音（67〜254 Hz、ここでは 88.5 Hz）を加えます。","l":"FM 受信機の音で見ると、声の下、いちばん下に固定の線。レピーターやトランシーバーのスケルチを開きます（シート 8）。"},"dtmf":{"sh":"2 トーン","t":"DTMF：キーごとに二つのトーン","h":"各キーが低いトーン（697〜941 Hz）と高いトーン（1209〜1633 Hz）を同時に送ります。","l":"八つの固定列に並ぶ点のペア。電話番号やレピーター操作の「ピポパ」音（シート 8）。","r":[["シーケンス","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 トーン","t":"
