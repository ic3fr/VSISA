 Zeichnung erscheinen direkt auf dem SDR-Bildschirm (Blatt 33).","r":[["Hinweis","Von unten nach oben gesendet: aufrecht im Live-Wasserfall, kopfüber im Abdruck (von oben nach unten gelesen)"]]},"vara":{"t":"Moderne KW-Daten: VARA, Pactor, ARDOP","h":"Lange volle Pakete (OFDM oder PSK) und dazwischen kurze Antworten der Gegenstation.","l":"Ein Rechteck von etwa 2,4 kHz, das stoppt und neu startet, mit einer kleinen Quittung dazwischen; ein abgehacktes Rauschen (Blatt 26)."},"chirp":{"nm":"Ionosonde","t":"Ionosonde (Chirp-Sounder)","h":"Eine langsame Frequenzrampe quer durch das ganze KW-Band; die Echos der Ionosphäre kommen etwas später.","l":"Eine Diagonale über den Bildschirm, begleitet von parallelen Strichen (den Echos); ein „ffuit“, das in Sekundenbruchteilen vorbeizieht."},"oth":{"nm":"Überhorizontradar","t":"Überhorizontradar („Woodpecker“)","h":"Impulse, 10- bis 50-mal pro Sekunde wiederholt, jeder mehrere kHz breit.","l":"Ein breiter gestreifter Block, der ganze Bänder bedeckt; ein sehr regelmäßiges Specht-Klopfen auf Kurzwelle."},"parasites":{"nm":"Störungen","sh":"Netzteil","t":"Störungen eines Schaltnetzteils","h":"Ein Rechtecksignal: seine Frequenz und alle Oberwellen kommen gleichzeitig heraus.","l":"Ein Kamm regelmäßiger Linien, die zusammen driften, auf Rauschgrund: mit NOISE FIND oder einem tragbaren Empfänger suchen (Blatt K21b)."},"mpx":{"nm":"UKW-Stereo und RDS","t":"UKW-Stereo und RDS","h":"Der demodulierte Ton (Multiplex) enthält den L+R-Kanal, einen Pilotton bei 19 kHz, den L-R-Kanal um 38 kHz und RDS bei 57 kHz.","l":"Von 0 bis 60 kHz nach der Demodulation: ein tiefer Block, ein feiner Strich bei 19 kHz, ein schwächerer Block in der Mitte und RDS ganz oben (Blatt 10).","n":"Maßstab ÷ 20 zum Anhören"},"dcf77":{"t":"Zeitsignal DCF77 (77,5 kHz)","h":"Ein Träger, der zu Beginn jeder Sekunde für 0,1 s (Bit 0) oder 0,2 s (Bit 1) auf 15 % absinkt.","l":"Ein fester Strich mit einer schwarzen Lücke jede Sekunde; die 59. Sekunde hat keine, um die Minute zu markieren (Blatt 10).","r":[["Hinweis","Hier liegt der Träger auf 1000 Hz; die 6. Sekunde hat keine Lücke, wie die 59. Sekunde jeder Minute"]]},"ofdm":{"t":"OFDM: Dutzende Unterträger","h":"Viele eng gepackte Träger, jeder langsam: die Summe sieht aus wie Rauschen.","l":"Ein flaches Rechteck mit scharfen Kanten, immer da: DRM auf Kurzwelle (10 kHz), DAB+ (1,5 MHz), DVB-T, WLAN. Ein gleichmäßiges Rauschen im Ohr (Blätter 10 und 22)."},"dsss":{"t":"Spreizspektrum (DSSS): GPS, WLAN 802.11b","h":"Die Daten werden mit einem sehr schnellen Code gemischt: die Energie verteilt sich über eine große Breite.","l":"Ein breiter Buckel, kaum über dem Rauschen; GPS liegt sogar unter dem Rauschen und ist ohne Verarbeitung nicht zu sehen (Blätter 22 und 23)."},"hline":{"nm":"Wasserstofflinie","sh":"1420 MHz","t":"21-cm-Wasserstofflinie (1420,405 MHz)","h":"Kalter Wasserstoff der Milchstraße sendet ein sehr schwaches Rauschen auf 1420,405 MHz. Die Bewegung der Spiralarme verschiebt es durch den Dopplereffekt: man sieht mehrere kleine Buckel.","l":"Im Wasserfall von Sekunde zu Sekunde fast nichts: man muss lange mitteln, bis die Buckel aus dem Rauschen auftauchen. Hier im angehaltenen Zustand das mittlere Spektrum ansehen. Eine Schüssel oder ein Horn, ein Vorverstärker und ein SDR-Stick genügen.","n":"Signal stark übertrieben"},"sun":{"nm":"Sonne","sh":"Bursts","t":"Sonne: Radiobursts vom Typ III","h":"Von einem Flare ausgeschleuderte Elektronen durchqueren die Sonnenkorona und lassen sie immer tiefer senden, je weiter sie sich entfernen.","l":"Striche, die in weniger als einer Sekunde schräg von oben nach unten durch das Spektrum fallen, über solarem Rauschen; ein anschwellendes „schhhh“. Etwa 10 bis 400 MHz, auch auf Kurzwelle um 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter: Dekameter-Bursts (L und S)","h":"Jupiters Magnetfeld und sein Mond Io erzeugen starke Emissionen zwischen 15 und 40 MHz: langsame L-Bursts und sehr kurze S-Bursts, die schnell nach unten gleiten.","l":"Zuerst Rauschwellen (L, wie Brandung), dann Folgen kleiner „Pops“ (S) in engen Diagonalen. Um 20,1 MHz nachts, mit einem einfachen Dipol, wenn Io gut steht."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Ein rotierender Neutronenstern überstreicht die Erde mit einem Radiostrahl, hier alle 0,714 s. Das interstellare Gas verzögert die tiefen Frequenzen: jeder Impuls kommt zuerst oben im Spektrum an.","l":"Ein regelmäßiges „Tick“; im Wasserfall ist jeder Impuls eine abfallende Kurve (Dispersion). Das echte Signal liegt unter dem Rauschen: man braucht eine große Antenne und muss die Impulse über ihre Periode aufaddieren.","n":"Signal stark übertrieben"},"meteor":{"nm":"Meteore","sh":"GRAVES","t":"Meteorechos vom GRAVES-Radar (143,050 MHz)","h":"Das französische GRAVES-Radar sendet ununterbrochen auf 143,050 MHz. Ionisiert eine Sternschnuppe die Luft, wirft ihre Spur etwas von diesem Signal zu deinem Empfänger, für Sekundenbruchteile bis einige Sekunden.","l":"In USB auf 143,049 MHz: kurze „Pings“ um 1000 Hz, manchmal ein gleitendes Echo (der Meteorkopf, Dopplereffekt) oder ein lang anhaltendes. Viel mehr während der Schauer (Perseiden, Geminiden) (Blatt 1)."},"whistler":{"nm":"Whistler","sh":"VLF","t":"VLF-Whistler (Pfeiftöne)","h":"Ein Blitz erzeugt einen Radioknack; ein Teil folgt den Feldlinien des Erdmagnetfelds bis zur anderen Halbkugel und zurück, die hohen Töne zuerst.","l":"Ein „Tjiuuu“, das in ein bis zwei Sekunden von hoch nach tief fällt, direkt nach einem Knack; überall Knistern (Sferics). Unter 10 kHz, mit einem VLF-Empfänger fern von Stromleitungen."},"chorus":{"nm":"Morgenchor","sh":"VLF","t":"Morgenchor (Dawn Chorus)","h":"Bei einem Magnetsturm senden in der Magnetosphäre gefangene Elektronen kleine aufsteigende Töne, vor allem bei Sonnenaufgang.","l":"Sich überlagernde, aufsteigende Zwitschertöne wie Vögel, etwa 1 bis 4 kHz. Gleiche Ausrüstung wie für Whistler."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"Der erste künstliche Satellit sendete drei Wochen lang Pieptöne von etwa 0,3 s abwechselnd auf 20,005 und 40,002 MHz.","l":"Ein regelmäßig unterbrochener Strich: „Piep… Piep…“, der Klang, dem im Oktober 1957 die ganze Welt lauschte (Nachbildung)."},"doppler":{"nm":"Dopplereffekt","sh":"Satellit","t":"Satellitenbake und Dopplereffekt","h":"Ein Satellit in niedriger Bahn nähert sich und entfernt sich wieder: die Empfangsfrequenz sinkt während des Überflugs, um etwa ±3 kHz bei 145 MHz und ±10 kHz bei 435 MHz.","l":"Ein S-förmig abfallender Strich: erst langsam, schnell beim nächsten Punkt, dann wieder langsam (Blatt 34).","n":"10-min-Überflug auf 12 s verkürzt"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA-Satelliten: APT-Bilder (historisch)","h":"Ein 2400-Hz-Hilfsträger, vom Bild amplitudenmoduliert, zwei Zeilen pro Sekunde, mit einem Synchronimpuls am Anfang jeder Zeile. 2025 abgeschaltet; heute senden die Meteor-M-Satelliten LRPT.","l":"Ein Strich bei 2400 Hz mit Seitenbändern, die sich mit dem Bild ändern, und das berühmte „Tick-Tack“ zweimal pro Sekunde (Blatt 34)."},"eme":{"nm":"Mondecho","sh":"EME","t":"Mondecho (EME)","h":"Ein zum Mond gesendetes Signal kommt etwa 2,5 s später zurück, enorm geschwächt, etwas verbreitert und durch Doppler verschoben.","l":"Man hört das eigene „Piep“ und 2,5 s später sein schwaches, leicht verwaschenes Echo. Funkamateure machen das in CW oder JT65, ab 144 MHz (Blatt 1).","n":"Echo stark übertrieben"}}},"nl":{"ui":{"title":"Radiomodus-herkenner","mystery":"Mysteriegeluid","play":"▶ Luisteren","stop":"■ Stop","noise":"Ruis","volume":"Volume","loop":"Herhalen","specwf":"Spectrum + Waterval","cursor":"cursor","footprint":"Afdruk","dur":"{s} s van boven naar beneden","avg":"gemiddelde over het hele signaal","press":"Druk op Luisteren: het signaal loopt hier voorbij","count":"{n} signalen, in de volgorde van blad 5 bis","myst":"Mysteriemodus","mystTags":"Luister en kijk, kies dan het juiste antwoord","quizH":"Welk signaal is dit?","quizLead":"Start het geluid, bekijk het spectrum, de waterval en de afdruk, en antwoord.","score":"Score","good":"Goed!","bad":"Mis: het was {x}.","next":"Volgend mysteriegeluid","principle":"Principe","screen":"Op het scherm","sheet":"blad","book":"Boek: blad {r}","lang":"Taal","signals":"Signalen","f1":"Signalen gesimuleerd in de pagina (12 000 samples per seconde), naar de signalen van blad 5 bis van het boek OpenBookRadio, plus Olivia, FT4 en Feld Hell (blad 26). Bij radiosignalen (AM, FM, AIS, LoRa…) zie je de gesimuleerde middenfrequentie, zoals op een SDR-scherm; sommige zijn verkleind of versneld, dat staat erbij.","f2":"De tijd loopt naar beneden in de waterval en de afdruk. Licentie CC BY-NC-SA 4.0, gratis, niet verkopen."},"groups":["Analoge spraak","Telegrafie","Data","Beelden","Luchtvaart, scheepvaart en redding","Oproep, subtonen en paging","Radiosondes, sensoren en verbonden apparaten","HF-modi en curiosa","Omroep en tijd","Breedband","Bonus: geluiden uit de ruimte"],"modes":{"am":{"sh":"spraak","t":"AM: amplitudemodulatie","h":"De sterkte van de draaggolf volgt het geluid: de curve „zwelt” op en af.","l":"Een vaste streep in het midden (de draaggolf), met aan elke kant een gelijke zijband. Ongeveer 6 tot 9 kHz breed. Omroep op korte en middengolf, luchtvaart (bladen 10 en 12)."},"ssb":{"nm":"SSB","t":"SSB: enkelzijband","h":"Er blijft maar één zijband over, zonder draaggolf: niets als er niet gesproken wordt.","l":"Geen middenstreep, één band van ongeveer 2,7 kHz die alleen leeft als er gesproken wordt. USB boven 10 MHz, LSB eronder (zendamateurs). Slecht afgestemd klinkt de stem als een „eend” (bladen 9 en 26)."},"fm":{"sh":"spraak","t":"FM: frequentiemodulatie","h":"De amplitude blijft gelijk; de trillingen komen met het geluid dichter bij elkaar of verder uiteen.","l":"Het signaal danst rond zijn frequentie, breder bij luid geluid: 12,5 kHz per kanaal bij smalband-FM (portofoons, relais), 200 kHz bij FM-omroep (bladen 2 en 11)."},"cw":{"t":"CW: morse","h":"De draaggolf gaat aan en uit: strepen en punten.","l":"Een heel dunne streep die in het ritme van morse onderbroken wordt; een piep in het oor. Hier „CQ” (blad 39).","r":[["Snelheid","20 woorden/min, punt van 60 ms, op 700 Hz: „CQ CQ CQ DE F4ABC K”"],["Op het gehoor","Zuivere piepjes, lang en kort, op één toon"],["Decoderen","Op het gehoor, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: twee frequenties","h":"De frequentie springt tussen twee waarden, één voor 0, één voor 1.","l":"Twee evenwijdige strepen: 170 Hz uit elkaar bij zendamateurs (45,45 baud), 450 of 850 Hz bij weerberichten. Een regelmatig „tidilidi” (blad 27).","r":[["Code","Baudot ITA2: 5 bits + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Tekst","RYRYRYRY CQ CQ DE F4ABC"],["Decoderen","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 baud: APRS en packet","h":"Twee audiotonen, 1200 en 2200 Hz, in een FM-zender gestuurd.","l":"Gezien na de FM-ontvanger (luidsprekergeluid): een band van 1200 tot 2200 Hz, in korte pakketjes. In het oor een „grrrt” van een seconde (bladen 29 en 30).","r":[["Frequentie","144,800 MHz in Europa (APRS), FM"],["Frame","Vlaggen 0x7E en daarna AX.25-data in NRZI"],["Decoderen","Direwolf, multimon-ng, KISS-TNC"]]},"psk31":{"t":"PSK31: fasemodulatie","h":"De frequentie blijft gelijk, de fase keert om; bij elke omkering zakt de amplitude.","l":"Een heel dunne streep van ongeveer 60 Hz, een beetje „gevlochten”. Tientallen stations passen in 3 kHz (blad 26).","r":[["Code","Varicode: 0 = fase-omkering, 1 = geen verandering; in rust twee tweelingstrepen"],["Waar te horen","14 070 kHz, 3580 kHz"],["Decoderen","fldigi"]]},"ft8":{"t":"MFSK / FT8: acht tonen","h":"De frequentie gaat op en neer in stapjes van 6,25 Hz, 0,16 s per stap.","l":"Banden van ongeveer 50 Hz die 12,6 s duren en elke 15 s terugkomen, op de klok afgestemd: meerdere stations tegelijk in 3 kHz, bijvoorbeeld op 7,074 MHz (blad 26).","r":[["Frame","79 symbolen van 0,16 s, drie Costas-patronen (begin, midden, eind); hier acht stations"],["Frequenties","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Decoderen","WSJT-X, JTDX (exacte pc-klok)"]]},"ft4":{"t":"FT4: de FT8 voor contests","h":"Vier tonen op 20,8 Hz afstand, 20,8 baud: 105 symbolen in 5 s, in tijdvakken van 7,5 s.","l":"Banden van ongeveer 90 Hz, korter en breder dan FT8, die elke 7,5 s terugkomen. 14 080, 7047,5 kHz (blad 26)."},"olivia":{"t":"Olivia 8/250: acht tonen","h":"Acht tonen op 31,25 Hz afstand, steeds één tegelijk, die willekeurig springen; Walsh-codering en interleaving.","l":"Een blok verspreide puntjes over 250 Hz; decodeert ver onder de ruis. Een klein willekeurig melodietje in het oor (blad 26)."},"hell":{"t":"Feld Hell: schrijven met een draaggolf","h":"De draaggolf gaat punt voor punt aan en uit: elke letter bestaat uit kolommen van 14 punten, van onder naar boven afgetast (245 punten per seconde).","l":"In de waterval een gehakte streep; het programmascherm (fldigi) tekent de letters. Een zacht geknetter in het oor (blad 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Vier frequentieniveaus: elk symbool draagt twee bits.","l":"Een rechthoekig blok van 6 tot 12,5 kHz, vol als ruis, vaak in pakketjes (DMR deelt het kanaal in twee tijdsloten). Een schor „frrr” in het oor (blad 38)."},"mt63":{"t":"MT63: noodberichten (NBEMS)","h":"64 tonen tegelijk, elk langzaam gemoduleerd, met veel redundantie.","l":"Een vlak blok van 1 of 2 kHz rond 1500 Hz, met scherpe randen; een regelmatig geruis. Werkt zelfs via een microfoon tegen een luidspreker (blad 26 ter)."},"lora":{"t":"LoRa: frequentiehellingen (chirps)","h":"De frequentie zwiept over de hele breedte en begint dan weer onderaan: de plaats van de sprong draagt de data.","l":"Evenwijdige diagonalen, makkelijk te herkennen: Meshtastic en MeshCore op 869,525 MHz of 433 MHz, LoRaWAN-sensoren (bladen 11, 20 en 21)."},"sstv":{"t":"SSTV: beelden als geluid","h":"Een synchronisatiepuls op 1200 Hz, daarna volgt de frequentie de helderheid van de lijn, van 1500 (zwart) tot 2300 Hz (wit).","l":"Regelmatige synchronisatiestrepen en een wolk die met het beeld verandert; een „tjilpend” geluid gedurende een à twee minuten. 14,230 MHz, ISS op 145,800 MHz (blad 31).","r":[["Frame","VIS-kop, dan lijnen: synchro 1200 Hz, groen, blauw, rood; hier 20 lijnen van een testbeeld"],["Decoderen","QSSTV, MMSSTV, Robot36 op de smartphone"]]},"fax":{"nm":"Weerfax","t":"Weerfax: 1500 Hz zwart, 2300 Hz wit","h":"De frequentie gaat traploos van zwart naar wit, 120 lijnen per minuut.","l":"Twee vaste banden op 1500 en 2300 Hz (800 Hz uit elkaar), een regelmatig „tik-tak”. Gepubliceerde frequenties zijn die van de draaggolf: luister in USB 1,9 kHz lager (blad 32).","r":[["Frame","Starttoon van 300 Hz, faseerlijnen (witte puls), dan de kaart"],["Decoderen","fldigi, JWX, HamFax"]]},"elt":{"nm":"ELT-sirene","t":"ELT- / PLB-sirene op 121,5 MHz","h":"Een AM waarvan de toon twee tot vier keer per seconde van 1600 naar 300 Hz daalt.","l":"Een vaste draaggolf en zijbanden die als een waaier glijden: het „oe-oe” van noodbakens, ook op 121,375 MHz voor oefeningen (bladen 24 en 25)."},"406":{"nm":"406-baken","t":"406 MHz-baken: BPSK-salvo","h":"Een halve seconde uitzending: 160 ms zuivere draaggolf, daarna verspringt de fase ±1,1 radiaal met 400 bit/s.","l":"Een kort streepje dat elke 50 s terugkomt, tussen 406,0 en 406,1 MHz; niets nuttigs te horen, je hebt een decoder nodig (EPIRB 406, blad 25)."},"adsb":{"t":"ADS-B / mode S (1090 MHz): pulsen","h":"Pulsen van 0,5 µs waarvan de positie de bits draagt (PPM); hier is de tijdschaal sterk vertraagd.","l":"Heel korte horizontale streepjes over de hele breedte, honderden per seconde bij een luchthaven; een SDR-stick is nodig (blad 13).","n":"tijdschaal sterk vertraagd"},"acars":{"t":"ACARS: AM en MSK-data","h":"Een AM die twee tonen draagt, 1200 en 2400 Hz, met 2400 bit/s.","l":"Salvo's van een halve seconde met draaggolf en zijbanden, op 131,525, 131,725 of 131,825 MHz in Europa: een „brrrt” in het oor (blad 14)."},"ais":{"t":"AIS: GMSK 9600 baud op twee kanalen","h":"Een afgevlakte FSK (GMSK) in salvo's van 26 ms, eens op 161,975 MHz, eens op 162,025 MHz (verkleind).","l":"Twee kolommen korte streepjes, 50 kHz uit elkaar, een regelmatig geklik; hoe meer schepen, hoe dichter (blad 16).","n":"verkleind"},"navtex":{"t":"NAVTEX en DSC op midden- en kortegolf: FSK 170 Hz","h":"Zoals RTTY: twee frequenties op 170 Hz afstand, maar met 100 baud.","l":"Twee evenwijdige strepen, ononderbroken tijdens het bericht, op 518 en 490 kHz (NAVTEX) of 2187,5 kHz (digitale selectieve oproep) (blad 17).","r":[["Code","SITOR-B, CCIR 476: 7 bits met vier „1”, met FEC-herhaling"],["Decoderen","fldigi, YaND"]]},"hfdl":{"t":"HFDL: vliegtuigen op kortegolf","h":"Een PSK van 1800 baud op een hulpdraaggolf van 1440 Hz.","l":"Salvo's van ongeveer 2,4 kHz tussen 2,9 en 22 MHz; een modemgeruis dat komt en gaat (blad 14 bis)."},"ctcss":{"t":"CTCSS: subtoon onder de stem","h":"Een lage, doorlopende toon (67 tot 254 Hz, hier 88,5 Hz) bij de stem gevoegd.","l":"Gezien in het geluid van de FM-ontvanger: een vaste streep helemaal onderaan, onder de stem; hij opent de squelch van relais en portofoons (blad 8)."},"dtmf":{"sh":"2 tonen","t":"DTMF: twee tonen per toets","h":"Elke toets stuurt tegelijk een lage toon (697 tot 941 Hz) en een hoge (1209 tot 1633 Hz).","l":"Paren puntjes op acht vaste kolommen; het „piep-piep” van telefoonnummers en relaiscommando's (blad 8).","r":[["Reeks","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tonen","t":"Selcall CCIR: tonen na elkaar","h":"Vijf tonen van 100 ms na elkaar, één per cijfer.","l":"Een klein trapje van puntjes, herhaald; een snel „tululululu” om één bepaalde radio op te roepen (blad 28).","r":[["Reeks","1 2 3 4 5, twee keer; ook gedecodeerd door de SelCall-app van de UV-K1"]]},"pocsag":{"sh":"pagers","t":"POCSAG en FLEX: pagers","h":"Een FSK op ±4,5 kHz; een preambule 1010… en dan de data (verkleind).","l":"Twee scherpe strepen tijdens de preambule, daarna een volle band; een schel „brrrrt”. 466,075 MHz, DAPNET 439,9875 MHz (blad 37).","n":"verkleind"},"ale":{"sh":"8 tonen","t":"ALE: automatische oproep op kortegolf","h":"Acht tonen van 750 tot 2500 Hz, 125 baud, in salvo's.","l":"Een blok van ongeveer 2 kHz van kleine puntjes, een à twee seconden, soms op meerdere nabije frequenties; een hoog getjilp (blad 28 bis)."},"rs41":{"nm":"Radiosonde RS41","t":"Radiosonde RS41: doorlopende GFSK","h":"Een afgevlakte FSK van 4800 baud, zonder pauze; de frequentie verloopt langzaam als de sonde stijgt en afkoelt.","l":"Een band van ongeveer 10 kHz die tijdens de hele vlucht schuin verschuift, tussen 400 en 406 MHz (blad 18)."},"ook":{"nm":"433-sensoren","t":"433 MHz-sensoren: OOK","h":"De draaggolf gaat aan en uit in korte of lange pulsen (aan-uit); het bericht wordt drie keer herhaald.","l":"Salvo's van kleine puntjes, vaak in drievoud, op 433,92 MHz: weerstations, temperatuursensoren, afstandsbedieningen (blad 19)."},"fhss":{"t":"Bluetooth: frequentiesprongen (FHSS)","h":"De frequentie wisselt 1600 keer per seconde tussen 79 kanalen (verkleind).","l":"Kleine streepjes overal verspreid over 80 MHz, nooit op dezelfde plek, rond 2,4 GHz (blad 22).","n":"verkleind"},"wspr":{"t":"WSPR: propagatiebakens","h":"Vier tonen op 1,46 Hz afstand, 0,68 s per symbool, gedurende 110,6 s.","l":"Een heel dunne streep van ongeveer 6 Hz die bijna twee minuten duurt, elke even twee minuten: je moet sterk inzoomen (blad 26).","n":"fragment van 24 s (een uitzending duurt 110,6 s)"},"qrss":{"t":"QRSS: heel langzame morse","h":"Een draaggolf die aan en uit gaat, met punten van 3 tot 10 s, vaak op twee nabije frequenties (DFCW).","l":"Strepen van enkele Hz breed, gelezen op een scherm van tien minuten; niet hoorbaar (blad 26 bis).","n":"versneld: punt van 0,6 s in plaats van 3 tot 10 s"},"texte":{"nm":"Tekst in de waterval","t":"Tekst in de waterval","h":"Elke lijn van een afbeelding wordt een groep tonen: het geluid lijkt op ruis.","l":"De tekst of tekening verschijnt rechtstreeks op het SDR-scherm (blad 33).","r":[["Opmerking","Vanaf de onderkant van de afbeelding verzonden: rechtop in de live waterval, ondersteboven in de afdruk (van boven naar beneden gelezen)"]]},"vara":{"t":"Moderne HF-data: VARA, Pactor, ARDOP","h":"Lange volle salvo's (OFDM of PSK) en daartussen korte antwoorden van het andere station.","l":"Een rechthoek van ongeveer 2,4 kHz die stopt en opnieuw begint, met een kleine ontvangstbevestiging ertussen; een gehakt geruis (blad 26)."},"chirp":{"nm":"Ionosfeersonde","t":"Ionosfeersonde (chirp sounder)","h":"Een langzame frequentiehelling door de hele HF-band; de echo's van de ionosfeer komen iets later.","l":"Een diagonaal over het scherm, met evenwijdige strepen (de echo's); een „ffuut” dat in een fractie van een seconde voorbijgaat."},"oth":{"nm":"Over-de-horizonradar","t":"Over-de-horizonradar („woodpecker”)","h":"Pulsen die 10 tot 50 keer per seconde herhaald worden, elk enkele kHz breed.","l":"Een breed gestreept blok dat hele banden bedekt; een heel regelmatig specht-getik op kortegolf."},"parasites":{"nm":"Storing","sh":"voeding","t":"Storing van een schakelende voeding","h":"Een blokgolf: de frequentie en alle harmonischen komen tegelijk naar buiten.","l":"Een kam van regelmatige lijnen die samen verschuiven, op een ruisachtergrond: zoek met NOISE FIND of een draagbare ontvanger (blad K21b)."},"mpx":{"nm":"FM-stereo en RDS","t":"FM-stereo en RDS","h":"Het gedemoduleerde geluid (multiplex) bevat het L+R-kanaal, een pilottoon op 19 kHz, het L-R-kanaal rond 38 kHz en RDS op 57 kHz.","l":"Gezien van 0 tot 60 kHz na demodulatie: een laag blok, een dunne streep op 19 kHz, een zwakker blok in het midden en RDS helemaal bovenaan (blad 10).","n":"schaal ÷ 20 om te beluisteren"},"dcf77":{"t":"Tijdsignaal DCF77 (77,5 kHz)","h":"Een draaggolf die aan het begin van elke seconde 0,1 s (bit 0) of 0,2 s (bit 1) tot 15 % daalt.","l":"Een vaste streep met elke seconde een zwart gat; de 59e seconde heeft er geen, om de minuut aan te geven (blad 10).","r":[["Opmerking","Hier ligt de draaggolf op 1000 Hz; de 6e seconde heeft geen gat, net als de 59e seconde van elke minuut"]]},"ofdm":{"t":"OFDM: tientallen subdraaggolven","h":"Veel dicht op elkaar gepakte draaggolven, elk langzaam: de som lijkt op ruis.","l":"Een vlakke rechthoek met scherpe randen, altijd aanwezig: DRM op kortegolf (10 kHz), DAB+ (1,5 MHz), DVB-T, wifi. Een doorlopend geruis in het oor (bladen 10 en 22)."},"dsss":{"t":"Gespreid spectrum (DSSS): gps, wifi 802.11b","h":"De data worden gemengd met een heel snelle code: de energie wordt over een grote breedte verspreid.","l":"Een brede bult, nauwelijks boven de ruis; gps ligt zelfs onder de ruis en is zonder bewerking niet te zien (bladen 22 en 23)."},"hline":{"nm":"Waterstoflijn","sh":"1420 MHz","t":"21 cm-waterstoflijn (1420,405 MHz)","h":"Koud waterstof in de Melkweg zendt een heel zwak geruis uit op 1420,405 MHz. De beweging van de spiraalarmen verschuift het door het dopplereffect: je ziet een paar kleine bulten.","l":"Bijna niets in de waterval van seconde tot seconde: je moet lang middelen om de bulten uit de ruis te zien komen. Kijk hier naar het gemiddelde spectrum in stilstand. Een schotel of hoorn, een voorversterker en een SDR-stick volstaan.","n":"signaal sterk overdreven"},"sun":{"nm":"Zon","sh":"uitbarstingen","t":"Zon: radio-uitbarstingen van type III","h":"Elektronen die door een zonnevlam worden weggeslingerd, gaan door de corona en laten die steeds lager in frequentie zenden naarmate ze verder komen.","l":"Strepen die in minder dan een seconde schuin van boven naar beneden door het spectrum vallen, op een achtergrond van zonneruis; een aanzwellend „sjhhh”. Ongeveer 10 tot 400 MHz, ook op kortegolf rond 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter: decameter-uitbarstingen (L en S)","h":"Het magneetveld van Jupiter en zijn maan Io zorgen voor sterke emissies tussen 15 en 40 MHz: trage L-uitbarstingen en heel korte S-uitbarstingen die snel naar beneden glijden.","l":"Eerst golven van geruis (L, zoals de branding), daarna reeksen kleine „pops” (S) in dichte diagonalen. Rond 20,1 MHz 's nachts, met een eenvoudige dipool, als Io goed staat."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Een draaiende neutronenster veegt met een radiobundel over de aarde, hier elke 0,714 s. Interstellair gas vertraagt de lage frequenties: elke puls komt eerst bovenaan het spectrum aan.","l":"Een regelmatig „tik”; in de waterval is elke puls een dalende curve (dispersie). Het echte signaal zit onder de ruis: je hebt een grote antenne nodig en moet de pulsen over hun periode optellen.","n":"signaal sterk overdreven"},"meteor":{"nm":"Meteoren","sh":"GRAVES","t":"Meteorecho's van de GRAVES-radar (143,050 MHz)","h":"De Franse GRAVES-radar zendt onophoudelijk op 143,050 MHz. Als een vallende ster de lucht ioniseert, kaatst het spoor wat van dat signaal naar je ontvanger, een fractie van een seconde tot enkele seconden.","l":"In USB op 143,049 MHz: korte „pings” rond 1000 Hz, soms een echo die glijdt (de kop van de meteoor, dopplereffect) of die blijft hangen. Veel meer tijdens zwermen (Perseïden, Geminiden) (blad 1)."},"whistler":{"nm":"Fluittonen","sh":"VLF","t":"VLF-fluittonen (whistlers)","h":"Bliksem geeft een radioklik; een deel volgt de veldlijnen van het aardmagnetisch veld naar het andere halfrond en terug, de hoge tonen eerst.","l":"Een „tjiuuu” dat in een à twee seconden van hoog naar laag zakt, vlak na een klik; overal gekraak (sferics). Onder 10 kHz, met een VLF-ontvanger ver van hoogspanningslijnen."},"chorus":{"nm":"Ochtendkoor","sh":"VLF","t":"Ochtendkoor (dawn chorus)","h":"Tijdens een magnetische storm zenden in de magnetosfeer gevangen elektronen kleine stijgende tonen uit, vooral rond zonsopgang.","l":"Stijgende, overlappende kwetteringen, zoals vogels, van ongeveer 1 tot 4 kHz. Dezelfde apparatuur als voor fluittonen."},"sputnik":{"nm":"Spoetnik 1","sh":"1957","t":"Spoetnik 1 (1957)","h":"De eerste kunstmaan zond drie weken lang piepjes van ongeveer 0,3 s uit, afwisselend op 20,005 en 40,002 MHz.","l":"Een regelmatig onderbroken streep: „piep… piep…”, het geluid waar de hele wereld in oktober 1957 naar luisterde (reconstructie)."},"doppler":{"nm":"Dopplereffect","sh":"satelliet","t":"Satellietbaken en dopplereffect","h":"Een satelliet in een lage baan komt dichterbij en gaat weer weg: de ontvangen frequentie daalt tijdens de overgang, ongeveer ±3 kHz op 145 MHz en ±10 kHz op 435 MHz.","l":"Een streep die in een S-vorm daalt: eerst langzaam, snel als de satelliet het dichtst bij is, dan weer langzaam (blad 34).","n":"overgang van 10 min ingekort tot 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA-satellieten: APT-beelden (historisch)","h":"Een hulpdraaggolf van 2400 Hz, in amplitude gemoduleerd door het beeld, twee lijnen per seconde, met een synchronisatiepuls aan het begin van elke lijn. Gestopt in 2025; de Meteor-M-satellieten zenden nu LRPT.","l":"Een streep op 2400 Hz met zijbanden die met het beeld veranderen, en het bekende „tik-tak” twee keer per seconde (blad 34)."},"eme":{"nm":"Maanecho","sh":"EME","t":"Maanecho (EME)","h":"Een signaal naar de maan komt ongeveer 2,5 s later terug, enorm verzwakt, iets verbreed en verschoven door doppler.","l":"Je hoort je eigen „piep” en 2,5 s later de zwakke, wat vage echo. Zendamateurs doen dit in CW of JT65, vanaf 144 MHz (blad 1).","n":"echo sterk overdreven"}}},"cs":{"ui":{"title":"Rozpoznávač rádiových druhů provozu","mystery":"Záhadný zvuk","play":"▶ Poslouchat","stop":"■ Stop","noise":"Šum","volume":"Hlasitost","loop":"Opakovat","specwf":"Spektrum + vodopád","cursor":"kurzor","footprint":"Otisk","dur":"{s} s shora dolů","avg":"průměr za celý signál","press":"Stiskni Poslouchat: signál poběží tady","count":"{n} signálů v pořadí listu 5 bis","myst":"Záhadný režim","mystTags":"Poslouchej a dívej se, pak vyber správnou odpověď","quizH":"Který je to signál?","quizLead":"Spusť poslech, sleduj spektrum, vodopád a otisk a odpověz.","score":"Skóre","good":"Správně!","bad":"Vedle: byl to {x}.","next":"Další záhadný zvuk","principle":"Princip","screen":"Na obrazovce","sheet":"list","book":"Kniha: list {r}","lang":"Jazyk","signals":"Signály","f1":"Signály simulované přímo ve stránce (12 000 vzorků za sekundu) podle signálů listu 5 bis knihy OpenBookRadio, navíc Olivia, FT4 a Feld Hell (list 26). U rádiových signálů (AM, FM, AIS, LoRa…) je vidět simulovaný mezifrekvenční kmitočet jako na obrazovce SDR; některé jsou zmenšené nebo zrychlené, je to uvedeno.","f2":"Čas ve vodopádu i v otisku běží dolů. Licence CC BY-NC-SA 4.0, zdarma, neprodávat."},"groups":["Analogový hlas","Telegrafie","Data","Obrázky","Letectví, námořnictví a záchrana","Volání, subtóny a pagery","Radiosondy, senzory a připojená zařízení","KV druhy provozu a zajímavosti","Vysílání a čas","Široké pásmo","Bonus: zvuky z vesmíru"],"modes":{"am":{"sh":"hlas","t":"AM: amplitudová modulace","h":"Síla nosné sleduje zvuk: křivka se „nafukuje“ a „splaskává“.","l":"Pevná čára uprostřed (nosná) a po obou stranách dvě stejná postranní pásma. Šířka asi 6 až 9 kHz. Rozhlas na krátkých a středních vlnách, letectví (listy 10 a 12)."},"ssb":{"t":"SSB: jedno postranní pásmo","h":"Zbude jen jedno postranní pásmo, bez nosné: když nikdo nemluví, není nic.","l":"Žádná středová čára, jediné pásmo asi 2,7 kHz, které žije jen při řeči. USB nad 10 MHz, LSB pod (radioamatéři). Špatně naladěný hlas zní jako „kachna“ (listy 9 a 26)."},"fm":{"sh":"hlas","t":"FM: kmitočtová modulace","h":"Amplituda zůstává stejná; kmity se se zvukem zhušťují nebo řídnou.","l":"Signál tančí kolem svého kmitočtu, při hlasitém zvuku je širší: 12,5 kHz na kanál u úzkopásmové FM (vysílačky, převáděče), 200 kHz u rozhlasu FM (listy 2 a 11)."},"cw":{"t":"CW: Morseova abeceda","h":"Nosná se zapíná a vypíná: čárky a tečky.","l":"Velmi tenká čára přerušovaná v rytmu morseovky; pípání v uchu. Zde „CQ“ (list 39).","r":[["Rychlost","20 slov/min, tečka 60 ms, na 700 Hz: „CQ CQ CQ DE F4ABC K“"],["Sluchem","Čistá pípnutí, dlouhá a krátká, jediný tón"],["Dekódování","Sluchem, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: dva kmitočty","h":"Kmitočet skáče mezi dvěma hodnotami, jednou pro 0, druhou pro 1.","l":"Dvě rovnoběžné čáry: 170 Hz od sebe u radioamatérů (45,45 Bd), 450 nebo 850 Hz u meteozpráv. Pravidelné „tidilidi“ (list 27).","r":[["Kód","Baudot ITA2: 5 bitů + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Text","RYRYRYRY CQ CQ DE F4ABC"],["Dekódování","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 Bd: APRS a packet","h":"Dva zvukové tóny, 1200 a 2200 Hz, přivedené do FM vysílače.","l":"Za FM přijímačem (zvuk z reproduktoru): pásmo od 1200 do 2200 Hz v krátkých dávkách. V uchu sekundové „grrrt“ (listy 29 a 30).","r":[["Kmitočet","144,800 MHz v Evropě (APRS), FM"],["Rámec","Příznaky 0x7E, pak data AX.25 v NRZI"],["Dekódování","Direwolf, multimon-ng, KISS TNC"]]},"psk31":{"t":"PSK31: fázová modulace","h":"Kmitočet se nemění, obrací se fáze; při každém obratu amplituda poklesne.","l":"Velmi tenká čára asi 60 Hz, trochu „spletená“. Do 3 kHz se vejdou desítky stanic (list 26).","r":[["Kód","Varicode: 0 = obrat fáze, 1 = beze změny; v klidu dvě dvojčata čar"],["Kde poslouchat","14 070 kHz, 3580 kHz"],["Dekódování","fldigi"]]},"ft8":{"t":"MFSK / FT8: osm tónů","h":"Kmitočet stoupá a klesá po krocích 6,25 Hz, 0,16 s na krok.","l":"Pásy asi 50 Hz, které trvají 12,6 s a vracejí se každých 15 s podle hodin: několik stanic najednou ve 3 kHz, například na 7,074 MHz (list 26).","r":[["Rámec","79 symbolů po 0,16 s, tři vzory Costas (začátek, střed, konec); zde osm stanic"],["Kmitočty","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Dekódování","WSJT-X, JTDX (přesný čas PC)"]]},"ft4":{"t":"FT4: FT8 pro závody","h":"Čtyři tóny 20,8 Hz od sebe, 20,8 Bd: 105 symbolů za 5 s v časových oknech 7,5 s.","l":"Pásy asi 90 Hz, kratší a širší než FT8, vracejí se každých 7,5 s. 14 080, 7047,5 kHz (list 26)."},"olivia":{"t":"Olivia 8/250: osm tónů","h":"Osm tónů 31,25 Hz od sebe, vždy jen jeden, náhodně skáčou; Walshovo kódování a prokládání.","l":"Blok rozptýlených teček na 250 Hz; dekóduje hluboko pod šumem. V uchu malá náhodná melodie (list 26)."},"hell":{"t":"Feld Hell: psaní nosnou","h":"Nosná se zapíná a vypíná bod po bodu: každé písmeno tvoří sloupce po 14 bodech, snímané zdola nahoru (245 bodů za sekundu).","l":"Ve vodopádu přerušovaná čára; písmena vykreslí až obrazovka programu (fldigi). V uchu jemné praskání (list 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Čtyři úrovně kmitočtu: každý symbol nese dva bity.","l":"Obdélníkový blok 6 až 12,5 kHz, plný jako šum, často v dávkách (DMR dělí kanál na dva časové sloty). V uchu chraplavé „frrr“ (list 38)."},"mt63":{"t":"MT63: tísňové zprávy (NBEMS)","h":"64 tónů najednou, každý pomalu modulovaný, s velkou nadbytečností.","l":"Plochý blok 1 nebo 2 kHz kolem 1500 Hz s ostrými okraji; pravidelný šum. Projde i mikrofonem přiloženým k reproduktoru (list 26 ter)."},"lora":{"t":"LoRa: kmitočtové rampy (chirpy)","h":"Kmitočet přejede celou šířku a začne znovu zdola: poloha skoku nese data.","l":"Rovnoběžné úhlopříčky, snadno rozpoznatelné: Meshtastic a MeshCore na 869,525 MHz nebo 433 MHz, senzory LoRaWAN (listy 11, 20 a 21)."},"sstv":{"t":"SSTV: obrázky ve zvuku","h":"Synchronizační impulz na 1200 Hz, pak kmitočet sleduje jas řádku, od 1500 (černá) do 2300 Hz (bílá).","l":"Pravidelné synchronizační čáry a mrak, který se mění s obrázkem; „cvrlikající“ zvuk po jednu až dvě minuty. 14,230 MHz, ISS na 145,800 MHz (list 31).","r":[["Rámec","Hlavička VIS, pak řádky: synchro 1200 Hz, zelená, modrá, červená; zde 20 řádků testovacího obrazce"],["Dekódování","QSSTV, MMSSTV, Robot36 v mobilu"]]},"fax":{"nm":"Meteofax","t":"Meteofax: 1500 Hz černá, 2300 Hz bílá","h":"Kmitočet plynule přechází z černé do bílé, 120 řádků za minutu.","l":"Dvě pevná pásma na 1500 a 2300 Hz (800 Hz od sebe), pravidelné „tik-tak“. Zveřejněné kmitočty jsou kmitočty nosné: poslouchej v USB o 1,9 kHz níž (list 32).","r":[["Rámec","Startovní tón 300 Hz, fázovací řádky (bílý impulz), pak mapa"],["Dekódování","fldigi, JWX, HamFax"]]},"elt":{"nm":"Siréna ELT","t":"Siréna ELT / PLB na 121,5 MHz","h":"AM, jejíž tón klesá z 1600 na 300 Hz dvakrát až čtyřikrát za sekundu.","l":"Pevná nosná a postranní pásma klouzající jako vějíř: „ú-ú“ nouzových majáků, na 121,375 MHz i pro cvičení (listy 24 a 25)."},"406":{"nm":"Maják 406","t":"Maják 406 MHz: dávka BPSK","h":"Půl sekundy vysílání: 160 ms čisté nosné, pak se fáze přepíná o ±1,1 radiánu rychlostí 400 bit/s.","l":"Krátká čárka, která se vrací každých 50 s, mezi 406,0 a 406,1 MHz; nic užitečného k poslechu, je třeba dekodér (EPIRB 406, list 25)."},"adsb":{"t":"ADS-B / mód S (1090 MHz): impulzy","h":"Impulzy 0,5 µs, jejichž poloha nese bity (PPM); zde je časová osa silně zpomalená.","l":"Velmi krátké vodorovné čárky přes celou šířku, stovky za sekundu u letiště; je třeba SDR klíčenka (list 13).","n":"časová osa silně zpomalená"},"acars":{"t":"ACARS: AM a data MSK","h":"AM nesoucí dva tóny, 1200 a 2400 Hz, rychlostí 2400 bit/s.","l":"Půlsekundové dávky s nosnou a postranními pásmy, na 131,525, 131,725 nebo 131,825 MHz v Evropě: v uchu „brrrt“ (list 14)."},"ais":{"t":"AIS: GMSK 9600 Bd na dvou kanálech","h":"Vyhlazená FSK (GMSK) v dávkách 26 ms, jednou na 161,975 MHz, jednou na 162,025 MHz (zmenšeno).","l":"Dva sloupce krátkých čárek 50 kHz od sebe, pravidelné cvakání; čím víc lodí, tím hustší (list 16).","n":"zmenšeno"},"navtex":{"t":"NAVTEX a DSC na středních a krátkých vlnách: FSK 170 Hz","h":"Jako RTTY: dva kmitočty 170 Hz od sebe, ale 100 Bd.","l":"Dvě rovnoběžné čáry, souvislé během zprávy, na 518 a 490 kHz (NAVTEX) nebo 2187,5 kHz (digitální selektivní volání) (list 17).","r":[["Kód","SITOR-B, CCIR 476: 7 bitů se čtyřmi „1“, s opakováním FEC"],["Dekódování","fldigi, YaND"]]},"hfdl":{"t":"HFDL: letadla na krátkých vlnách","h":"PSK 1800 Bd na pomocné nosné 1440 Hz.","l":"Dávky asi 2,4 kHz mezi 2,9 a 22 MHz; šumění modemu, které přichází a odchází (list 14 bis)."},"ctcss":{"t":"CTCSS: subtón pod hlasem","h":"Hluboký trvalý tón (67 až 254 Hz, zde 88,5 Hz) přidaný k hlasu.","l":"Ve zvuku FM přijímače: pevná čára úplně dole, pod hlasem; otevírá squelch převáděčů a vysílaček (list 8)."},"dtmf":{"sh":"2 tóny","t":"DTMF: dva tóny na klávesu","h":"Každá klávesa vyšle zároveň hluboký tón (697 až 941 Hz) a vysoký (1209 až 1633 Hz).","l":"Dvojice teček na osmi pevných sloupcích; „píp-píp“ telefonních čísel a povelů převáděčů (list 8).","r":[["Sekvence","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tónů","t":"Selcall CCIR: tóny za sebou","h":"Pět tónů po 100 ms za sebou, jeden na číslici.","l":"Malé schodiště teček, opakované; rychlé „tululululu“ k zavolání jedné určité stanice (list 28).","r":[["Sekvence","1 2 3 4 5, dvakrát; dekóduje ji i aplikace SelCall pro UV-K1"]]},"pocsag":{"sh":"pagery","t":"POCSAG a FLEX: pagery","h":"FSK ±4,5 kHz; preambule 1010… a pak data (zmenšeno).","l":"Dvě ostré čáry během preambule, pak plné pásmo; pronikavé „brrrrt“. 466,075 MHz, DAPNET 439,9875 MHz (list 37).","n":"zmenšeno"},"ale":{"sh":"8 tónů","t":"ALE: automatické navázání spojení na KV","h":"Osm tónů od 750 do 2500 Hz, 125 Bd, v dávkách.","l":"Blok asi 2 kHz z drobných teček, jednu až dvě sekundy, někdy na několika sousedních kmitočtech; vysoké švitoření (list 28 bis)."},"rs41":{"nm":"Radiosonda RS41","t":"Radiosonda RS41: nepřetržitá GFSK","h":"Vyhlazená FSK 4800 Bd bez přestávky; kmitočet pomalu ujíždí, jak sonda stoupá a chladne.","l":"Pás asi 10 kHz, který během celého letu šikmo klouže, mezi 400 a 406 MHz (list 18)."},"ook":{"nm":"Senzory 433","t":"Senzory 433 MHz: OOK","h":"Nosná se zapíná a vypíná v krátkých nebo dlouhých impulzech (vše nebo nic); zpráva se opakuje třikrát.","l":"Dávky drobných teček, často trojmo, na 433,92 MHz: meteostanice, teplotní čidla, dálková ovládání (list 19)."},"fhss":{"t":"Bluetooth: přeskakování kmitočtu (FHSS)","h":"Kmitočet se mění 1600krát za sekundu mezi 79 kanály (zmenšeno).","l":"Drobné čárky rozházené všude po 80 MHz, nikdy na stejném místě, kolem 2,4 GHz (list 22).","n":"zmenšeno"},"wspr":{"t":"WSPR: šířkové majáky","h":"Čtyři tóny 1,46 Hz od sebe, 0,68 s na symbol, po dobu 110,6 s.","l":"Velmi tenká čára asi 6 Hz, trvá skoro dvě minuty, každou sudou minutu: je třeba hodně přiblížit (list 26).","n":"úryvek 24 s (vysílání trvá 110,6 s)"},"qrss":{"t":"QRSS: velmi pomalá morseovka","h":"Nosná zapínaná a vypínaná, tečky 3 až 10 s, často na dvou sousedních kmitočtech (DFCW).","l":"Čáry široké jen několik Hz, čtené na desetiminutové obrazovce; uchem neslyšitelné (list 26 bis).","n":"zrychleno: tečka 0,6 s místo 3 až 10 s"},"texte":{"nm":"Text ve vodopádu","t":"Text ve vodopádu","h":"Každý řádek obrázku se stane skupinou tónů: zvuk připomíná šum.","l":"Text nebo kresba se objeví přímo na obrazovce SDR (list 33).","r":[["Poznámka","Vysíláno od spodku obrázku: rovně v živém vodopádu, vzhůru nohama v otisku (čteném shora dolů)"]]},"vara":{"t":"Moderní KV data: VARA, Pactor, ARDOP","h":"Dlouhé plné dávky (OFDM nebo PSK) a mezi nimi krátké odpovědi protistanice.","l":"Obdélník asi 2,4 kHz, který se zastaví a znovu rozběhne, s malým potvrzením mezi tím; přerušované šumění (list 26)."},"chirp":{"nm":"Ionosonda","t":"Ionosonda (chirp sounder)","h":"Pomalá kmitočtová rampa přes celé KV pásmo; ozvěny z ionosféry přicházejí o něco později.","l":"Úhlopříčka přes obrazovku doprovázená rovnoběžnými čarami (ozvěnami); „ffuit“, které proletí za zlomek sekundy."},"oth":{"nm":"Radar za horizont","t":"Radar za horizont („woodpecker“)","h":"Impulzy opakované 10 až 50krát za sekundu, každý široký několik kHz.","l":"Široký pruhovaný blok přes celá pásma; velmi pravidelné ťukání datla na krátkých vlnách."},"parasites":{"nm":"Rušení","sh":"zdroj","t":"Rušení ze spínaného zdroje","h":"Obdélníkový signál: jeho kmitočet a všechny harmonické vycházejí zároveň.","l":"Hřeben pravidelných čar, které spolu ujíždějí, na šumovém pozadí: hledej s NOISE FIND nebo přenosným přijímačem (list K21b)."},"mpx":{"nm":"FM stereo a RDS","t":"Rozhlas FM stereo a RDS","h":"Demodulovaný zvuk (multiplex) obsahuje kanál L+R, pilot na 19 kHz, kanál L-R kolem 38 kHz a RDS na 57 kHz.","l":"Od 0 do 60 kHz po demodulaci: hluboký blok, tenká čára na 19 kHz, slabší blok uprostřed a RDS úplně nahoře (list 10).","n":"měřítko ÷ 20 pro poslech"},"dcf77":{"t":"Časový signál DCF77 (77,5 kHz)","h":"Nosná, která na začátku každé sekundy klesne na 15 % na 0,1 s (bit 0) nebo 0,2 s (bit 1).","l":"Pevná čára s černou mezerou každou sekundu; 59. sekunda ji nemá, aby označila minutu (list 10).","r":[["Poznámka","Nosná je zde posunuta na 1000 Hz; 6. sekunda nemá mezeru, jako 59. sekunda každé minuty"]]},"ofdm":{"t":"OFDM: desítky subnosných","h":"Mnoho hustě vedle sebe ležících nosných, každá pomalá: součet vypadá jako šum.","l":"Plochý obdélník s ostrými okraji, stále přítomný: DRM na KV (10 kHz), DAB+ (1,5 MHz), DVB-T, Wi-Fi. V uchu nepřetržitý šum (listy 10 a 22)."},"dsss":{"t":"Rozprostřené spektrum (DSSS): GPS, Wi-Fi 802.11b","h":"Data se smíchají s velmi rychlým kódem: energie se rozprostře do velké šířky.","l":"Široký hrb sotva nad šumem; GPS je dokonce pod šumem a bez zpracování není vidět (listy 22 a 23)."},"hline":{"nm":"Vodíková čára","sh":"1420 MHz","t":"Vodíková čára 21 cm (1420,405 MHz)","h":"Studený vodík v Mléčné dráze vyzařuje velmi slabý šum na 1420,405 MHz. Pohyb ramen galaxie ho posouvá Dopplerovým jevem: je vidět několik malých hrbolků.","l":"Ve vodopádu se ze sekundy na sekundu skoro nic neděje: je třeba dlouho průměrovat, aby se hrbolky vynořily ze šumu. Zde se po zastavení podívej na průměrné spektrum. Stačí parabola nebo trychtýř, předzesilovač a SDR klíčenka.","n":"signál silně zveličen"},"sun":{"nm":"Slunce","sh":"vzplanutí","t":"Slunce: rádiová vzplanutí typu III","h":"Elektrony vymrštěné erupcí procházejí sluneční korónou a nutí ji vyzařovat stále níž, jak se vzdalují.","l":"Čáry, které za méně než sekundu padají šikmo shora dolů spektrem na pozadí slunečního šumu; sílící „šššš“. Zhruba 10 až 400 MHz, i na krátkých vlnách kolem 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter: dekametrová vzplanutí (L a S)","h":"Magnetické pole Jupiteru a jeho měsíc Io vytvářejí silné vyzařování mezi 15 a 40 MHz: pomalá vzplanutí L a velmi krátká vzplanutí S, která rychle klouzají dolů.","l":"Nejdřív vlny šumu (L, jako příboj), pak série drobných „lupnutí“ (S) v hustých úhlopříčkách. Kolem 20,1 MHz v noci, s obyčejným dipólem, když je Io dobře postavená."},"pulsar":{"nm":"Pulzar","sh":"B0329+54","t":"Pulzar PSR B0329+54","h":"Rotující neutronová hvězda přejíždí Zemi rádiovým paprskem, zde každých 0,714 s. Mezihvězdný plyn zpožďuje nízké kmitočty: každý impulz dorazí nejdřív nahoře ve spektru.","l":"Pravidelné „tik“; ve vodopádu je každý impulz klesající křivka (disperze). Skutečný signál je pod šumem: je třeba velká anténa a sčítání impulzů přes jejich periodu.","n":"signál silně zveličen"},"meteor":{"nm":"Meteory","sh":"GRAVES","t":"Meteorické ozvěny radaru GRAVES (143,050 MHz)","h":"Francouzský radar GRAVES vysílá nepřetržitě na 143,050 MHz. Když padající hvězda ionizuje vzduch, její stopa odrazí trochu signálu k tvému přijímači, na zlomek sekundy až několik sekund.","l":"V USB na 143,049 MHz: krátká „pípnutí“ kolem 1000 Hz, někdy klouzající ozvěna (hlava meteoru, Dopplerův jev) nebo dlouhá. Mnohem víc během rojů (Perseidy, Geminidy) (list 1)."},"whistler":{"nm":"Hvizdy","sh":"VLF","t":"VLF hvizdy (whistlery)","h":"Blesk vytvoří rádiové cvaknutí; část putuje podél siločar zemského magnetického pole na druhou polokouli a zpět, výšky napřed.","l":"„Fjúúú“, které za sekundu či dvě sklesne z výšky do hloubky hned po cvaknutí; všude praskání (sferiky). Pod 10 kHz, s VLF přijímačem daleko od elektrického vedení."},"chorus":{"nm":"Ranní sbor","sh":"VLF","t":"Ranní sbor (dawn chorus)","h":"Během magnetické bouře vydávají elektrony zachycené v magnetosféře drobné stoupající tóny, hlavně za úsvitu.","l":"Stoupající švitoření, která se překrývají jako ptáci, zhruba 1 až 4 kHz. Stejné vybavení jako na hvizdy."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"První umělá družice vysílala tři týdny pípnutí asi 0,3 s střídavě na 20,005 a 40,002 MHz.","l":"Pravidelně přerušovaná čára: „píp… píp…“, zvuk, který v říjnu 1957 poslouchal celý svět (rekonstrukce)."},"doppler":{"nm":"Dopplerův jev","sh":"družice","t":"Maják družice a Dopplerův jev","h":"Družice na nízké dráze se přibližuje a pak vzdaluje: přijímaný kmitočet během přeletu klesá, asi o ±3 kHz na 145 MHz a ±10 kHz na 435 MHz.","l":"Čára klesající do tvaru S: nejdřív pomalu, rychle při největším přiblížení, pak zase pomalu (list 34).","n":"přelet 10 min zkrácen na 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Družice NOAA: snímky APT (historie)","h":"Pomocná nosná 2400 Hz amplitudově modulovaná obrazem, dva řádky za sekundu, se synchronizačním impulzem na začátku každého řádku. Vypnuto v roce 2025; dnes vysílají družice Meteor-M v LRPT.","l":"Čára na 2400 Hz s postranními pásmy, která se mění s obrazem, a známé „tik-tak“ dvakrát za sekundu (list 34)."},"eme":{"nm":"Ozvěna od Měsíce","sh":"EME","t":"Ozvěna od Měsíce (EME)","h":"Signál vyslaný k Měsíci se vrátí asi za 2,5 s, nesmírně zeslabený, trochu rozšířený a posunutý Dopplerem.","l":"Slyšíš své vlastní „píp“ a za 2,5 s jeho slabou, trochu rozmazanou ozvěnu. Radioamatéři to dělají v CW nebo JT65, od 144 MHz výš (list 1).","n":"ozvěna silně zveličena"}}},"pt":{"ui":{"title":"Identificador de modos de rádio","mystery":"Som mistério","play":"▶ Ouvir","stop":"■ Parar","noise":"Ruído","volume":"Volume","loop":"Repetir","specwf":"Espetro + Cascata","cursor":"cursor","footprint":"Impressão","dur":"{s} s de cima para baixo","avg":"média de todo o sinal","press":"Carrega em Ouvir: o sinal desfila aqui","count":"{n} sinais, pela ordem da ficha 5 bis","myst":"Modo mistério","mystTags":"Ouve e observa, depois escolhe a resposta certa","quizH":"Que sinal é este?","quizLead":"Põe a ouvir, observa o espetro, a cascata e a impressão, e responde.","score":"Pontuação","good":"Certo!","bad":"Errado: era {x}.","next":"Próximo som mistério","principle":"Princípio","screen":"No ecrã","sheet":"ficha","book":"Livro: ficha {r}","lang":"Idioma","signals":"Sinais","f1":"Sinais simulados na página (12 000 amostras por segundo), segundo os sinais da ficha 5 bis do livro OpenBookRadio, mais Olivia, FT4 e Feld Hell (ficha 26). Nos sinais de rádio (AM, FM, AIS, LoRa…) vê-se a frequência intermédia simulada, como no ecrã de um SDR; alguns estão em escala reduzida ou acelerada, como indicado.","f2":"O tempo desce na cascata e na impressão. Licença CC BY-NC-SA 4.0, gratuito, proibida a venda."},"groups":["Voz analógica","Telegrafia","Dados","Imagens","Aviação, marinha e socorro","Chamada, subtons e mensagens","Radiossondas, sensores e objetos ligados","Modos HF e curiosidades","Radiodifusão e hora","Banda larga","Bónus: sons do espaço"],"modes":{"am":{"sh":"voz","t":"AM: modulação de amplitude","h":"A força da portadora segue o som: a curva «incha» e «desincha».","l":"Um traço fixo no centro (a portadora), com duas bandas laterais iguais de cada lado. Cerca de 6 a 9 kHz de largura. Rádio em onda curta e onda média, aviação (fichas 10 e 12)."},"ssb":{"nm":"BLU / SSB","t":"BLU / SSB: banda lateral única","h":"Só fica uma banda lateral, sem portadora: nada quando ninguém fala.","l":"Sem traço central, uma única banda de cerca de 2,7 kHz que só vive quando se fala. USB acima de 10 MHz, LSB abaixo (radioamadores). Mal sintonizada, a voz parece um «pato» (fichas 9 e 26)."},"fm":{"sh":"voz","t":"FM: modulação de frequência","h":"A amplitude fica fixa; as oscilações aproximam-se ou afastam-se com o som.","l":"O sinal dança à volta da sua frequência, mais largo quando o som é forte: 12,5 kHz por canal em FM estreita (walkie-talkies, repetidores), 200 kHz em rádio FM (fichas 2 e 11)."},"cw":{"t":"CW: Morse","h":"A portadora liga e desliga: traços e pontos.","l":"Um traço muito fino que se interrompe ao ritmo do Morse; um apito ao ouvido. Aqui «CQ» (ficha 39).","r":[["Velocidade","20 palavras/min, ponto de 60 ms, a 700 Hz: «CQ CQ CQ DE F4ABC K»"],["De ouvido","Apitos puros, longos e curtos, de uma só nota"],["Descodificação","De ouvido, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: duas frequências","h":"A frequência salta entre dois valores, um para 0, outro para 1.","l":"Dois traços paralelos: 170 Hz de afastamento nos radioamadores (45,45 bauds), 450 ou 850 Hz nos boletins meteorológicos. Um «tidilidi» regular (ficha 27).","r":[["Código","Baudot ITA2: 5 bits + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Texto","RYRYRYRY CQ CQ DE F4ABC"],["Descodificação","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 bauds: APRS e packet","h":"Dois tons áudio, 1200 e 2200 Hz, enviados para um emissor FM.","l":"Visto depois do recetor FM (som do altifalante): uma banda de 1200 a 2200 Hz, em rajadas curtas. Ao ouvido, um «grrrt» de um segundo (fichas 29 e 30).","r":[["Frequência","144,800 MHz na Europa (APRS), FM"],["Trama","Flags 0x7E e depois dados AX.25 em NRZI"],["Descodificação","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"t":"PSK31: modulação de fase","h":"A frequência não se mexe, é a fase que se inverte; a amplitude cava em cada inversão.","l":"Um traço muito fino de cerca de 60 Hz, um pouco «entrançado». Dezenas de estações cabem em 3 kHz (ficha 26).","r":[["Código","Varicode: 0 = inversão de fase, 1 = sem mudança; em repouso, dois traços gémeos"],["Onde ouvir","14 070 kHz, 3580 kHz"],["Descodificação","fldigi"]]},"ft8":{"t":"MFSK / FT8: oito tons","h":"A frequência sobe e desce em degraus de 6,25 Hz, 0,16 s por degrau.","l":"Bandas de cerca de 50 Hz que duram 12,6 s e voltam a cada 15 s, acertadas pela hora: várias estações ao mesmo tempo em 3 kHz, por exemplo em 7,074 MHz (ficha 26).","r":[["Trama","79 símbolos de 0,16 s, três padrões Costas (início, meio, fim); aqui oito estações"],["Frequências","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Descodificação","WSJT-X, JTDX (hora do PC exata)"]]},"ft4":{"t":"FT4: o FT8 dos concursos","h":"Quatro tons afastados 20,8 Hz, 20,8 bauds: 105 símbolos em 5 s, em períodos de 7,5 s.","l":"Bandas de cerca de 90 Hz, mais curtas e largas que o FT8, que voltam a cada 7,5 s. 14 080, 7047,5 kHz (ficha 26)."},"olivia":{"t":"Olivia 8/250: oito tons","h":"Oito tons afastados 31,25 Hz, um de cada vez, que saltam ao acaso; codificação Walsh e entrelaçamento.","l":"Um bloco de pontos dispersos em 250 Hz; descodifica muito abaixo do ruído. Uma pequena melodia aleatória ao ouvido (ficha 26)."},"hell":{"t":"Feld Hell: escrever com uma portadora","h":"A portadora liga e desliga ponto a ponto: cada letra é feita de colunas de 14 pontos, varridas de baixo para cima (245 pontos por segundo).","l":"Na cascata, um traço picotado; é o ecrã do programa (fldigi) que redesenha as letras. Um crepitar suave ao ouvido (ficha 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Quatro níveis de frequência: cada símbolo leva dois bits.","l":"Um bloco retangular de 6 a 12,5 kHz, cheio como ruído, muitas vezes em rajadas (o DMR divide o canal em dois intervalos). Um «frrr» rouco ao ouvido (ficha 38)."},"mt63":{"t":"MT63: mensagens de emergência (NBEMS)","h":"64 tons ao mesmo tempo, cada um modulado lentamente, com muita redundância.","l":"Um bloco plano de 1 ou 2 kHz centrado em 1500 Hz, de bordas nítidas; um sopro regular. Passa até por um microfone encostado a um altifalante (ficha 26 ter)."},"lora":{"t":"LoRa: rampas de frequência (chirps)","h":"A frequência varre toda a largura e recomeça de baixo: a posição do salto leva os dados.","l":"Diagonais paralelas, fáceis de reconhecer: Meshtastic e MeshCore em 869,525 MHz ou 433 MHz, sensores LoRaWAN (fichas 11, 20 e 21)."},"sstv":{"t":"SSTV: imagens em áudio","h":"Um impulso de sincronismo a 1200 Hz, depois a frequência segue o brilho da linha, de 1500 (preto) a 2300 Hz (branco).","l":"Traços de sincronismo regulares e uma nuvem que muda com a imagem; um som que «chilreia» durante um a dois minutos. 14,230 MHz, ISS em 145,800 MHz (ficha 31).","r":[["Trama","Cabeçalho VIS e depois linhas: sincronismo 1200 Hz, verde, azul, vermelho; aqui 20 linhas de uma mira"],["Descodificação","QSSTV, MMSSTV, Robot36 no telemóvel"]]},"fax":{"nm":"Fax meteorológico","t":"Fax meteorológico: 1500 Hz preto, 2300 Hz branco","h":"A frequência passa do preto ao branco de forma contínua, 120 linhas por minuto.","l":"Duas bandas fixas em 1500 e 2300 Hz (800 Hz de afastamento), um «tique-taque» regular. As frequências publicadas são as da portadora: ouvir em USB 1,9 kHz abaixo (ficha 32).","r":[["Trama","Tom de arranque de 300 Hz, linhas de fase (impulso branco) e depois o mapa"],["Descodificação","fldigi, JWX, HamFax"]]},"elt":{"nm":"Sirene ELT","t":"Sirene ELT / PLB em 121,5 MHz","h":"Uma AM cujo tom desce de 1600 para 300 Hz, duas a quatro vezes por segundo.","l":"Uma portadora fixa e bandas laterais que deslizam em leque: o «uu-uu» das balizas de socorro, também em 121,375 MHz para exercícios (fichas 24 e 25)."},"406":{"nm":"Baliza 406","t":"Baliza 406 MHz: rajada BPSK","h":"Meio segundo de emissão: 160 ms de portadora pura, depois a fase oscila ±1,1 radiano a 400 bit/s.","l":"Um pequeno traço curto que volta a cada 50 s, entre 406,0 e 406,1 MHz; nada útil para ouvir, é preciso um descodificador (EPIRB 406, ficha 25)."},"adsb":{"t":"ADS-B / modo S (1090 MHz): impulsos","h":"Impulsos de 0,5 µs cuja posição leva os bits (PPM); aqui a escala de tempo está muito abrandada.","l":"Traços horizontais muito curtos em toda a largura, centenas por segundo perto de um aeroporto; é preciso uma pen SDR (ficha 13).","n":"escala de tempo muito abrandada"},"acars":{"t":"ACARS: AM e dados MSK","h":"Uma AM que transporta dois tons, 1200 e 2400 Hz, a 2400 bit/s.","l":"Rajadas de meio segundo com portadora e bandas laterais, em 131,525, 131,725 ou 131,825 MHz na Europa: um «brrrt» ao ouvido (ficha 14)."},"ais":{"t":"AIS: GMSK 9600 bauds em dois canais","h":"Uma FSK suavizada (GMSK) em rajadas de 26 ms, uma vez em 161,975 MHz, outra em 162,025 MHz (escala reduzida).","l":"Duas colunas de traços breves, a 50 kHz um do outro, um estalido regular; quanto mais navios, mais denso (ficha 16).","n":"escala reduzida"},"navtex":{"t":"NAVTEX e DSC em onda média e curta: FSK 170 Hz","h":"Como o RTTY: duas frequências a 170 Hz, mas a 100 bauds.","l":"Dois traços paralelos contínuos durante o boletim, em 518 e 490 kHz (NAVTEX) ou 2187,5 kHz (chamada seletiva digital) (ficha 17).","r":[["Código","SITOR-B, CCIR 476: 7 bits com quatro «1», com repetição FEC"],["Descodificação","fldigi, YaND"]]},"hfdl":{"t":"HFDL: os aviões em onda curta","h":"Uma PSK de 1800 bauds numa subportadora de 1440 Hz.","l":"Rajadas de cerca de 2,4 kHz entre 2,9 e 22 MHz; um chiado de modem que vai e vem (ficha 14 bis)."},"ctcss":{"t":"CTCSS: subtom por baixo da voz","h":"Um tom grave e contínuo (67 a 254 Hz, aqui 88,5 Hz) junto à voz.","l":"Visto no som do recetor FM: um traço fixo bem em baixo, por baixo da voz; abre o squelch dos repetidores e walkie-talkies (ficha 8)."},"dtmf":{"sh":"2 tons","t":"DTMF: dois tons por tecla","h":"Cada tecla envia ao mesmo tempo um tom grave (697 a 941 Hz) e um agudo (1209 a 1633 Hz).","l":"Pares de pontos alinhados em oito colunas fixas; o «bip-bip» dos números de telefone e dos comandos de repetidores (ficha 8).","r":[["Sequência","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tons","t":"Selcall CCIR: tons em sequência","h":"Cinco tons de 100 ms seguidos, um por algarismo.","l":"Uma pequena escada de pontos, repetida; um «tululululu» rápido para chamar um rádio preciso (ficha 28).","r":[["Sequência","1 2 3 4 5, duas vezes; também descodificada pela app SelCall do UV-K1"]]},"pocsag":{"sh":"pagers","t":"POCSAG e FLEX: pagers","h":"Uma FSK a ±4,5 kHz; um preâmbulo 1010… e depois os dados (escala reduzida).","l":"Dois traços nítidos durante o preâmbulo, depois uma banda cheia; um «brrrrt» estridente. 466,075 MHz, DAPNET 439,9875 MHz (ficha 37).","n":"escala reduzida"},"ale":{"sh":"8 tons","t":"ALE: chamada automática em onda curta","h":"Oito tons de 750 a 2500 Hz, 125 bauds, em rajadas.","l":"Um bloco de cerca de 2 kHz feito de pontinhos, um a dois segundos, às vezes em várias frequências vizinhas; um chilrear agudo (ficha 28 bis)."},"rs41":{"nm":"Radiossonda RS41","t":"Radiossonda RS41: GFSK contínua","h":"Uma FSK suavizada a 4800 bauds, sem parar; a frequência deriva devagar à medida que a sonda sobe e arrefece.","l":"Uma banda de cerca de 10 kHz que desliza na diagonal durante todo o voo, entre 400 e 406 MHz (ficha 18)."},"ook":{"nm":"Sensores 433","t":"Sensores 433 MHz: OOK","h":"A portadora liga e desliga em impulsos curtos ou longos (tudo ou nada); a mensagem repete-se três vezes.","l":"Rajadas de pontinhos, muitas vezes em triplicado, em 433,92 MHz: estações meteorológicas, sondas de temperatura, comandos à distância (ficha 19)."},"fhss":{"t":"Bluetooth: saltos de frequência (FHSS)","h":"A frequência muda 1600 vezes por segundo entre 79 canais (escala reduzida).","l":"Pequenos traços espalhados por todo o lado em 80 MHz, nunca no mesmo sítio, perto de 2,4 GHz (ficha 22).","n":"escala reduzida"},"wspr":{"t":"WSPR: balizas de propagação","h":"Quatro tons afastados 1,46 Hz, 0,68 s por símbolo, durante 110,6 s.","l":"Um traço muito fino de cerca de 6 Hz que dura quase dois minutos, a cada dois minutos pares: é preciso ampliar muito (ficha 26).","n":"excerto de 24 s (uma emissão dura 110,6 s)"},"qrss":{"t":"QRSS: Morse muito lento","h":"Uma portadora ligada e desligada, com pontos de 3 a 10 s, muitas vezes em duas frequências vizinhas (DFCW).","l":"Traços de poucos Hz de largura, lidos num ecrã de dez minutos; inaudível ao ouvido (ficha 26 bis).","n":"acelerado: ponto de 0,6 s em vez de 3 a 10 s"},"texte":{"nm":"Texto na cascata","t":"Texto na cascata","h":"Cada linha de uma imagem torna-se um grupo de tons: o som parece ruído.","l":"O texto ou o desenho aparece diretamente no ecrã do SDR (ficha 33).","r":[["Nota","Emitido a partir de baixo da imagem: direito na cascata ao vivo, de pernas para o ar na impressão (lida de cima para baixo)"]]},"vara":{"t":"Dados HF modernos: VARA, Pactor, ARDOP","h":"Rajadas longas e cheias (OFDM ou PSK) e, entre elas, respostas curtas da outra estação.","l":"Um retângulo de cerca de 2,4 kHz que para e recomeça, com um pequeno aviso de receção no meio; um chiado entrecortado (ficha 26)."},"chirp":{"nm":"Sondador ionosférico","t":"Sondador ionosférico (chirp sounder)","h":"Uma rampa de frequência lenta que atravessa toda a banda HF; os ecos da ionosfera chegam um pouco depois.","l":"Uma diagonal que varre o ecrã, acompanhada de traços paralelos (os ecos); um «ffuit» que passa numa fração de segundo."},"oth":{"nm":"Radar trans-horizonte","t":"Radar trans-horizonte («woodpecker»)","h":"Impulsos repetidos 10 a 50 vezes por segundo, cada um com vários kHz de largura.","l":"Um bloco largo e riscado que cobre bandas inteiras; um bater de pica-pau muito regular em onda curta."},"parasites":{"nm":"Interferências","sh":"fonte","t":"Interferências de uma fonte comutada","h":"Um sinal quadrado: a sua frequência e todas as harmónicas saem ao mesmo tempo.","l":"Um pente de riscas regulares que derivam juntas sobre um fundo de ruído: procurar com NOISE FIND ou um recetor portátil (ficha K21b)."},"mpx":{"nm":"FM estéreo e RDS","t":"Rádio FM estéreo e RDS","h":"O som desmodulado (multiplex) contém a via L+R, um piloto a 19 kHz, a via L-R à volta de 38 kHz e o RDS a 57 kHz.","l":"Visto de 0 a 60 kHz depois da desmodulação: um bloco grave, um traço fino a 19 kHz, um bloco mais fraco no meio e o RDS lá em cima (ficha 10).","n":"escala ÷ 20 para ouvir"},"dcf77":{"t":"Sinal horário DCF77 (77,5 kHz)","h":"Uma portadora que baixa para 15 % durante 0,1 s (bit 0) ou 0,2 s (bit 1), no início de cada segundo.","l":"Um traço fixo com um corte preto a cada segundo; o segundo 59 não tem, para marcar o minuto (ficha 10).","r":[["Nota","Aqui a portadora é trazida para 1000 Hz; o 6.º segundo não tem corte, como o segundo 59 de cada minuto"]]},"ofdm":{"t":"OFDM: dezenas de subportadoras","h":"Muitas portadoras muito juntas, cada uma lenta: a soma parece ruído.","l":"Um retângulo plano de bordas nítidas, sempre presente: DRM em onda curta (10 kHz), DAB+ (1,5 MHz), TDT, Wi-Fi. Um sopro contínuo ao ouvido (fichas 10 e 22)."},"dsss":{"t":"Espetro espalhado (DSSS): GPS, Wi-Fi 802.11b","h":"Os dados são misturados com um código muito rápido: a energia espalha-se por uma grande largura.","l":"Uma bossa larga, mal acima do ruído; o GPS está mesmo abaixo do ruído e não se vê sem tratamento (fichas 22 e 23)."},"hline":{"nm":"Risca do hidrogénio","sh":"1420 MHz","t":"Risca do hidrogénio de 21 cm (1420,405 MHz)","h":"O hidrogénio frio da Via Láctea emite um sopro muito fraco em 1420,405 MHz. O movimento dos braços da galáxia desloca-o por efeito Doppler: veem-se várias pequenas bossas.","l":"Quase nada na cascata de um segundo para o outro: é preciso fazer a média durante muito tempo para ver as bossas saírem do ruído. Aqui, olha para o espetro médio com a reprodução parada. Basta uma parabólica ou uma corneta, um pré-amplificador e uma pen SDR.","n":"sinal muito exagerado"},"sun":{"nm":"Sol","sh":"explosões","t":"Sol: explosões rádio do tipo III","h":"Eletrões lançados por uma erupção atravessam a coroa solar e fazem-na emitir cada vez mais baixo em frequência à medida que se afastam.","l":"Traços que caem na diagonal de cima para baixo do espetro em menos de um segundo, sobre um fundo de ruído solar; um «chhhh» que cresce. De cerca de 10 a 400 MHz, também em onda curta perto de 20 MHz."},"jupiter":{"nm":"Júpiter","sh":"20 MHz","t":"Júpiter: explosões decamétricas (L e S)","h":"O campo magnético de Júpiter e a sua lua Io produzem emissões fortes entre 15 e 40 MHz: explosões L lentas e explosões S muito curtas que descem depressa.","l":"Primeiro ondas de sopro (L, como a rebentação), depois séries de pequenos «pops» (S) em diagonais apertadas. Perto de 20,1 MHz à noite, com um simples dipolo, quando Io está bem colocada."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Uma estrela de neutrões em rotação varre a Terra com um feixe rádio, aqui a cada 0,714 s. O gás interestelar atrasa as frequências baixas: cada impulso chega primeiro ao topo do espetro.","l":"Um «tique» regular; na cascata, cada impulso é uma curva que desce (dispersão). O sinal real está abaixo do ruído: é preciso uma grande antena e somar os impulsos sobre o seu período.","n":"sinal muito exagerado"},"meteor":{"nm":"Meteoros","sh":"GRAVES","t":"Ecos de meteoros do radar GRAVES (143,050 MHz)","h":"O radar francês GRAVES emite sem parar em 143,050 MHz. Quando uma estrela cadente ioniza o ar, o seu rasto devolve um pouco desse sinal ao teu recetor, de uma fração de segundo a alguns segundos.","l":"Em USB em 143,049 MHz: «pings» curtos perto de 1000 Hz, às vezes um eco que desliza (a cabeça do meteoro, efeito Doppler) ou que dura. Muitos mais durante as chuvas de meteoros (Perseidas, Geminídeas) (ficha 1)."},"whistler":{"nm":"Assobios","sh":"VLF","t":"Assobios VLF (whistlers)","h":"Um relâmpago cria um estalo rádio; parte dele segue as linhas do campo magnético da Terra até ao outro hemisfério e volta, os agudos primeiro.","l":"Um «fiuuu» que desce do agudo ao grave em um ou dois segundos, logo após um estalo; estalidos (sferics) por todo o lado. Abaixo de 10 kHz, com um recetor VLF longe das linhas elétricas."},"chorus":{"nm":"Coro da madrugada","sh":"VLF","t":"Coro da madrugada (dawn chorus)","h":"Durante uma tempestade magnética, eletrões presos na magnetosfera emitem pequenas notas ascendentes, sobretudo ao nascer do sol.","l":"Chilreios ascendentes que se sobrepõem, como pássaros, de 1 a 4 kHz aproximadamente. O mesmo equipamento que para os assobios."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"O primeiro satélite artificial emitia bips de cerca de 0,3 s em 20,005 e 40,002 MHz, alternadamente, durante três semanas.","l":"Um traço cortado com regularidade: «bip… bip…», o som que o mundo inteiro ouviu em outubro de 1957 (reconstituição)."},"doppler":{"nm":"Efeito Doppler","sh":"satélite","t":"Baliza de satélite e efeito Doppler","h":"Um satélite em órbita baixa aproxima-se e depois afasta-se: a frequência recebida desce durante a passagem, cerca de ±3 kHz em 145 MHz e ±10 kHz em 435 MHz.","l":"Um traço que desce em forma de S: devagar ao início, depressa quando o satélite passa mais perto, e de novo devagar (ficha 34).","n":"passagem de 10 min reduzida a 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satélites NOAA: imagens APT (histórico)","h":"Uma subportadora de 2400 Hz modulada em amplitude pela imagem, duas linhas por segundo, com um impulso de sincronismo no início de cada linha. Desligado em 2025; hoje os Meteor-M emitem em LRPT.","l":"Um traço em 2400 Hz com bandas laterais que mudam com a imagem, e o famoso «tique-taque» duas vezes por segundo (ficha 34)."},"eme":{"nm":"Eco da Lua","sh":"EME","t":"Eco da Lua (EME)","h":"Um sinal enviado para a Lua volta cerca de 2,5 s depois, enormemente enfraquecido, um pouco alargado e deslocado pelo Doppler.","l":"Ouve-se o próprio «bip» e, 2,5 s depois, o seu eco fraco e um pouco desfocado. Os radioamadores fazem-no em CW ou JT65, a partir de 144 MHz (ficha 1).","n":"eco muito exagerado"}}},"it":{"ui":{"title":"Identificatore di modi radio","mystery":"Suono misterioso","play":"▶ Ascolta","stop":"■ Stop","noise":"Rumore","volume":"Volume","loop":"Ripeti","specwf":"Spettro + Cascata","cursor":"cursore","footprint":"Impronta","dur":"{s} s dall'alto in basso","avg":"media su tutto il segnale","press":"Premi Ascolta: il segnale scorre qui","count":"{n} segnali, nell'ordine della scheda 5 bis","myst":"Modo misterioso","mystTags":"Ascolta e guarda, poi scegli la risposta giusta","quizH":"Che segnale è?","quizLead":"Avvia l'ascolto, osserva lo spettro, la cascata e l'impronta, poi rispondi.","score":"Punteggio","good":"Giusto!","bad":"Sbagliato: era {x}.","next":"Prossimo suono misterioso","principle":"Principio","screen":"Sullo schermo","sheet":"scheda","book":"Libro: scheda {r}","lang":"Lingua","signals":"Segnali","f1":"Segnali simulati nella pagina (12 000 campioni al secondo), secondo i segnali della scheda 5 bis del libro OpenBookRadio, più Olivia, FT4 e Feld Hell (scheda 26). Per i segnali radio (AM, FM, AIS, LoRa…) si vede la frequenza intermedia simulata, come sullo schermo di un SDR; alcuni sono in scala ridotta o accelerata, come indicato.","f2":"Il tempo scende nella cascata e nell'impronta. Licenza CC BY-NC-SA 4.0, gratuito, non vendere."},"groups":["Voce analogica","Telegrafia","Dati","Immagini","Aviazione, marina e soccorso","Chiamata, subtoni e cercapersone","Radiosonde, sensori e oggetti connessi","Modi HF e curiosità","Radiodiffusione e ora","Banda larga","Bonus: suoni dallo spazio"],"modes":{"am":{"sh":"voce","t":"AM: modulazione di ampiezza","h":"La forza della portante segue il suono: la curva si «gonfia» e si «sgonfia».","l":"Una riga fissa al centro (la portante), con due bande laterali uguali ai lati. Circa 6-9 kHz di larghezza. Radio in onde corte e medie, aviazione (schede 10 e 12)."},"ssb":{"t":"SSB: banda laterale unica","h":"Resta una sola banda laterale, senza portante: niente quando nessuno parla.","l":"Nessuna riga centrale, una sola banda di circa 2,7 kHz che vive solo quando si parla. USB sopra 10 MHz, LSB sotto (radioamatori). Sintonizzata male, la voce sembra una «papera» (schede 9 e 26)."},"fm":{"sh":"voce","t":"FM: modulazione di frequenza","h":"L'ampiezza resta fissa; sono le oscillazioni che si stringono o si allargano con il suono.","l":"Il segnale danza intorno alla sua frequenza, più largo quando il suono è forte: 12,5 kHz per canale in FM stretta (walkie-talkie, ponti), 200 kHz nella radio FM (schede 2 e 11)."},"cw":{"t":"CW: Morse","h":"La portante si accende e si spegne: linee e punti.","l":"Una riga sottilissima che si interrompe al ritmo del Morse; un bip all'orecchio. Qui «CQ» (scheda 39).","r":[["Velocità","20 parole/min, punto di 60 ms, a 700 Hz: «CQ CQ CQ DE F4ABC K»"],["A orecchio","Bip puri, lunghi e corti, su una sola nota"],["Decodifica","A orecchio, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: due frequenze","h":"La frequenza salta tra due valori, uno per 0 e uno per 1.","l":"Due righe parallele: 170 Hz di distanza per i radioamatori (45,45 baud), 450 o 850 Hz per i bollettini meteo. Un «tidilidi» regolare (scheda 27).","r":[["Codice","Baudot ITA2: 5 bit + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Testo","RYRYRYRY CQ CQ DE F4ABC"],["Decodifica","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 baud: APRS e packet","h":"Due toni audio, 1200 e 2200 Hz, inviati in un trasmettitore FM.","l":"Visto dopo il ricevitore FM (suono dell'altoparlante): una banda da 1200 a 2200 Hz, a raffiche brevi. All'orecchio, un «grrrt» di un secondo (schede 29 e 30).","r":[["Frequenza","144,800 MHz in Europa (APRS), FM"],["Trama","Flag 0x7E poi dati AX.25 in NRZI"],["Decodifica","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"t":"PSK31: modulazione di fase","h":"La frequenza non si muove, è la fase che si inverte; l'ampiezza cala a ogni inversione.","l":"Una riga sottilissima di circa 60 Hz, un po' «intrecciata». Decine di stazioni stanno in 3 kHz (scheda 26).","r":[["Codice","Varicode: 0 = inversione di fase, 1 = nessun cambio; a riposo, due righe gemelle"],["Dove ascoltarlo","14 070 kHz, 3580 kHz"],["Decodifica","fldigi"]]},"ft8":{"t":"MFSK / FT8: otto toni","h":"La frequenza sale e scende a gradini di 6,25 Hz, 0,16 s per gradino.","l":"Bande di circa 50 Hz che durano 12,6 s e tornano ogni 15 s, sincronizzate sull'ora: più stazioni insieme in 3 kHz, per esempio su 7,074 MHz (scheda 26).","r":[["Trama","79 simboli di 0,16 s, tre schemi Costas (inizio, metà, fine); qui otto stazioni"],["Frequenze","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Decodifica","WSJT-X, JTDX (ora del PC esatta)"]]},"ft4":{"t":"FT4: l'FT8 dei contest","h":"Quattro toni distanti 20,8 Hz, 20,8 baud: 105 simboli in 5 s, a turni di 7,5 s.","l":"Bande di circa 90 Hz, più corte e larghe dell'FT8, che tornano ogni 7,5 s. 14 080, 7047,5 kHz (scheda 26)."},"olivia":{"t":"Olivia 8/250: otto toni","h":"Otto toni distanti 31,25 Hz, uno alla volta, che saltano a caso; codifica Walsh e interleaving.","l":"Un blocco di punti sparsi su 250 Hz; decodifica molto sotto il rumore. Una piccola melodia casuale all'orecchio (scheda 26)."},"hell":{"t":"Feld Hell: scrivere con una portante","h":"La portante si accende e si spegne punto per punto: ogni lettera è fatta di colonne di 14 punti, scandite dal basso in alto (245 punti al secondo).","l":"Nella cascata, una riga spezzettata; è lo schermo del programma (fldigi) che ridisegna le lettere. Un crepitio leggero all'orecchio (scheda 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Quattro livelli di frequenza: ogni simbolo porta due bit.","l":"Un blocco rettangolare da 6 a 12,5 kHz, pieno come rumore, spesso a raffiche (il DMR divide il canale in due slot). Un «frrr» rauco all'orecchio (scheda 38)."},"mt63":{"t":"MT63: messaggi di emergenza (NBEMS)","h":"64 toni contemporaneamente, ognuno modulato lentamente, con molta ridondanza.","l":"Un blocco piatto di 1 o 2 kHz centrato su 1500 Hz, con bordi netti; un soffio regolare. Passa persino da un microfono appoggiato a un altoparlante (scheda 26 ter)."},"lora":{"t":"LoRa: rampe di frequenza (chirp)","h":"La frequenza spazza tutta la larghezza e riparte dal basso: la posizione del salto porta i dati.","l":"Diagonali parallele, facili da riconoscere: Meshtastic e MeshCore su 869,525 MHz o 433 MHz, sensori LoRaWAN (schede 11, 20 e 21)."},"sstv":{"t":"SSTV: immagini in audio","h":"Un impulso di sincronismo a 1200 Hz, poi la frequenza segue la luminosità della riga, da 1500 (nero) a 2300 Hz (bianco).","l":"Righe di sincronismo regolari e una nuvola che cambia con l'immagine; un suono che «cinguetta» per uno o due minuti. 14,230 MHz, ISS su 145,800 MHz (scheda 31).","r":[["Trama","Intestazione VIS, poi righe: sincronismo 1200 Hz, verde, blu, rosso; qui 20 righe di un monoscopio"],["Decodifica","QSSTV, MMSSTV, Robot36 sullo smartphone"]]},"fax":{"nm":"Fax meteo","t":"Fax meteo: 1500 Hz nero, 2300 Hz bianco","h":"La frequenza passa dal nero al bianco in modo continuo, 120 righe al minuto.","l":"Due bande fisse a 1500 e 2300 Hz (800 Hz di distanza), un «tic-tac» regolare. Le frequenze pubblicate sono quelle della portante: ascolta in USB 1,9 kHz più in basso (scheda 32).","r":[["Trama","Tono di avvio a 300 Hz, righe di fasatura (impulso bianco), poi la carta"],["Decodifica","fldigi, JWX, HamFax"]]},"elt":{"nm":"Sirena ELT","t":"Sirena ELT / PLB su 121,5 MHz","h":"Un'AM il cui tono scende da 1600 a 300 Hz, da due a quattro volte al secondo.","l":"Una portante fissa e bande laterali che scivolano a ventaglio: l'«uu-uu» dei radiofari di soccorso, anche su 121,375 MHz per le esercitazioni (schede 24 e 25)."},"406":{"nm":"Radiofaro 406","t":"Radiofaro 406 MHz: raffica BPSK","h":"Mezzo secondo di trasmissione: 160 ms di portante pura, poi la fase oscilla di ±1,1 radianti a 400 bit/s.","l":"Un trattino breve che torna ogni 50 s, tra 406,0 e 406,1 MHz; niente di utile da ascoltare, serve un decodificatore (EPIRB 406, scheda 25)."},"adsb":{"t":"ADS-B / modo S (1090 MHz): impulsi","h":"Impulsi di 0,5 µs la cui posizione porta i bit (PPM); qui la scala del tempo è molto rallentata.","l":"Trattini orizzontali brevissimi su tutta la larghezza, centinaia al secondo vicino a un aeroporto; serve una chiavetta SDR (scheda 13).","n":"scala del tempo molto rallentata"},"acars":{"t":"ACARS: AM e dati MSK","h":"Un'AM che trasporta due toni, 1200 e 2400 Hz, a 2400 bit/s.","l":"Raffiche di mezzo secondo con portante e bande laterali, su 131,525, 131,725 o 131,825 MHz in Europa: un «brrrt» all'orecchio (scheda 14)."},"ais":{"t":"AIS: GMSK 9600 baud su due canali","h":"Una FSK ammorbidita (GMSK) a raffiche di 26 ms, una volta su 161,975 MHz, una volta su 162,025 MHz (scala ridotta).","l":"Due colonne di trattini brevi, a 50 kHz di distanza, uno schiocco regolare; più navi ci sono, più è fitto (scheda 16).","n":"scala ridotta"},"navtex":{"t":"NAVTEX e DSC in onde medie e corte: FSK 170 Hz","h":"Come l'RTTY: due frequenze a 170 Hz, ma a 100 baud.","l":"Due righe parallele continue durante il bollettino, su 518 e 490 kHz (NAVTEX) o 2187,5 kHz (chiamata selettiva digitale) (scheda 17).","r":[["Codice","SITOR-B, CCIR 476: 7 bit con quattro «1», con ripetizione FEC"],["Decodifica","fldigi, YaND"]]},"hfdl":{"t":"HFDL: gli aerei in onde corte","h":"Una PSK a 1800 baud su una sottoportante di 1440 Hz.","l":"Raffiche di circa 2,4 kHz tra 2,9 e 22 MHz; un fruscio da modem che va e viene (scheda 14 bis)."},"ctcss":{"t":"CTCSS: subtono sotto la voce","h":"Un tono grave e continuo (da 67 a 254 Hz, qui 88,5 Hz) aggiunto alla voce.","l":"Visto nel suono del ricevitore FM: una riga fissa in fondo, sotto la voce; apre lo squelch di ponti e walkie-talkie (scheda 8)."},"dtmf":{"sh":"2 toni","t":"DTMF: due toni per tasto","h":"Ogni tasto invia contemporaneamente un tono grave (697-941 Hz) e uno acuto (1209-1633 Hz).","l":"Coppie di punti allineati su otto colonne fisse; il «bip-bip» dei numeri di telefono e dei comandi dei ponti (scheda 8).","r":[["Sequenza","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 toni","t":"Selcall CCIR: toni in sequenza","h":"Cinque toni di 100 ms uno dopo l'altro, uno per cifra.","l":"Una piccola scala di punti, ripetuta; un «tululululu» rapido per chiamare una radio precisa (scheda 28).","r":[["Sequenza","1 2 3 4 5, due volte; decodificata anche dall'app SelCall dell'UV-K1"]]},"pocsag":{"sh":"cercapersone","t":"POCSAG e FLEX: cercapersone","h":"Una FSK a ±4,5 kHz; un preambolo 1010… poi i dati (scala ridotta).","l":"Due righe nette durante il preambolo, poi una banda piena; un «brrrrt» stridente. 466,075 MHz, DAPNET 439,9875 MHz (scheda 37).","n":"scala ridotta"},"ale":{"sh":"8 toni","t":"ALE: chiamata automatica in onde corte","h":"Otto toni da 750 a 2500 Hz, 125 baud, a raffiche.","l":"Un blocco di circa 2 kHz fatto di puntini, uno o due secondi, a volte su più frequenze vicine; un cinguettio acuto (scheda 28 bis)."},"rs41":{"nm":"Radiosonda RS41","t":"Radiosonda RS41: GFSK continua","h":"Una FSK ammorbidita a 4800 baud, senza sosta; la frequenza deriva lentamente quando la sonda sale e si raffredda.","l":"Una banda di circa 10 kHz che scivola in diagonale per tutto il volo, tra 400 e 406 MHz (scheda 18)."},"ook":{"nm":"Sensori 433","t":"Sensori 433 MHz: OOK","h":"La portante si accende e si spegne a impulsi brevi o lunghi (tutto o niente); il messaggio è ripetuto tre volte.","l":"Raffiche di puntini, spesso tripli, su 433,92 MHz: stazioni meteo, sonde di temperatura, telecomandi (scheda 19)."},"fhss":{"t":"Bluetooth: salti di frequenza (FHSS)","h":"La frequenza cambia 1600 volte al secondo tra 79 canali (scala ridotta).","l":"Trattini sparsi ovunque su 80 MHz, mai nello stesso posto, intorno a 2,4 GHz (scheda 22).","n":"scala ridotta"},"wspr":{"t":"WSPR: radiofari di propagazione","h":"Quattro toni distanti 1,46 Hz, 0,68 s per simbolo, per 110,6 s.","l":"Una riga sottilissima di circa 6 Hz che dura quasi due minuti, ogni due minuti pari: bisogna ingrandire molto (scheda 26).","n":"estratto di 24 s (una trasmissione dura 110,6 s)"},"qrss":{"t":"QRSS: Morse lentissimo","h":"Una portante accesa e spenta, con punti da 3 a 10 s, spesso su due frequenze vicine (DFCW).","l":"Righe larghe pochi Hz, lette su uno schermo di dieci minuti; non udibile (scheda 26 bis).","n":"accelerato: punto di 0,6 s invece di 3-10 s"},"texte":{"nm":"Testo nella cascata","t":"Testo nella cascata","h":"Ogni riga di un'immagine diventa un gruppo di toni: il suono sembra rumore.","l":"Il testo o il disegno appare direttamente sullo schermo dell'SDR (scheda 33).","r":[["Nota","Trasmesso dal basso dell'immagine: dritto nella cascata dal vivo, capovolto nell'impronta (letta dall'alto in basso)"]]},"vara":{"t":"Dati HF moderni: VARA, Pactor, ARDOP","h":"Lunghe raffiche piene (OFDM o PSK) e, tra una e l'altra, brevi risposte dell'altra stazione.","l":"Un rettangolo di circa 2,4 kHz che si ferma e riparte, con una piccola conferma in mezzo; un fruscio spezzettato (scheda 26)."},"chirp":{"nm":"Ionosonda","t":"Ionosonda (chirp sounder)","h":"Una rampa di frequenza lenta che attraversa tutta la banda HF; gli echi della ionosfera arrivano poco dopo.","l":"Una diagonale che spazza lo schermo, affiancata da righe parallele (gli echi); un «ffuit» che passa in una frazione di secondo."},"oth":{"nm":"Radar oltre l'orizzonte","t":"Radar oltre l'orizzonte («woodpecker»)","h":"Impulsi ripetuti da 10 a 50 volte al secondo, ognuno largo diversi kHz.","l":"Un blocco largo e striato che copre bande intere; un picchiettio da picchio molto regolare in onde corte."},"parasites":{"nm":"Disturbi","sh":"alimentatore","t":"Disturbi di un alimentatore switching","h":"Un'onda quadra: la sua frequenza e tutte le armoniche escono insieme.","l":"Un pettine di righe regolari che derivano insieme su un fondo di rumore: cercalo con NOISE FIND o un ricevitore portatile (scheda K21b)."},"mpx":{"nm":"FM stereo e RDS","t":"Radio FM stereo e RDS","h":"Il suono demodulato (multiplex) contiene il canale L+R, un pilota a 19 kHz, il canale L-R intorno a 38 kHz e l'RDS a 57 kHz.","l":"Visto da 0 a 60 kHz dopo la demodulazione: un blocco basso, una riga sottile a 19 kHz, un blocco più debole al centro e l'RDS in cima (scheda 10).","n":"scala ÷ 20 per l'ascolto"},"dcf77":{"t":"Segnale orario DCF77 (77,5 kHz)","h":"Una portante che scende al 15 % per 0,1 s (bit 0) o 0,2 s (bit 1), all'inizio di ogni secondo.","l":"Una riga fissa con un buco ner
