elmi krátké vodorovné čárky přes celou šířku, stovky za sekundu u letiště; je třeba SDR klíčenka (list 13).","n":"časová osa silně zpomalená"},"acars":{"t":"ACARS: AM a data MSK","h":"AM nesoucí dva tóny, 1200 a 2400 Hz, rychlostí 2400 bit/s.","l":"Půlsekundové dávky s nosnou a postranními pásmy, na 131,525, 131,725 nebo 131,825 MHz v Evropě: v uchu „brrrt“ (list 14)."},"ais":{"t":"AIS: GMSK 9600 Bd na dvou kanálech","h":"Vyhlazená FSK (GMSK) v dávkách 26 ms, jednou na 161,975 MHz, jednou na 162,025 MHz (zmenšeno).","l":"Dva sloupce krátkých čárek 50 kHz od sebe, pravidelné cvakání; čím víc lodí, tím hustší (list 16).","n":"zmenšeno"},"navtex":{"t":"NAVTEX a DSC na středních a krátkých vlnách: FSK 170 Hz","h":"Jako RTTY: dva kmitočty 170 Hz od sebe, ale 100 Bd.","l":"Dvě rovnoběžné čáry, souvislé během zprávy, na 518 a 490 kHz (NAVTEX) nebo 2187,5 kHz (digitální selektivní volání) (list 17).","r":[["Kód","SITOR-B, CCIR 476: 7 bitů se čtyřmi „1“, s opakováním FEC"],["Dekódování","fldigi, YaND"]]},"hfdl":{"t":"HFDL: letadla na krátkých vlnách","h":"PSK 1800 Bd na pomocné nosné 1440 Hz.","l":"Dávky asi 2,4 kHz mezi 2,9 a 22 MHz; šumění modemu, které přichází a odchází (list 14 bis)."},"ctcss":{"t":"CTCSS: subtón pod hlasem","h":"Hluboký trvalý tón (67 až 254 Hz, zde 88,5 Hz) přidaný k hlasu.","l":"Ve zvuku FM přijímače: pevná čára úplně dole, pod hlasem; otevírá squelch převáděčů a vysílaček (list 8)."},"dtmf":{"sh":"2 tóny","t":"DTMF: dva tóny na klávesu","h":"Každá klávesa vyšle zároveň hluboký tón (697 až 941 Hz) a vysoký (1209 až 1633 Hz).","l":"Dvojice teček na osmi pevných sloupcích; „píp-píp“ telefonních čísel a povelů převáděčů (list 8).","r":[["Sekvence","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tónů","t":"Selcall CCIR: tóny za sebou","h":"Pět tónů po 100 ms za sebou, jeden na číslici.","l":"Malé schodiště teček, opakované; rychlé „tululululu“ k zavolání jedné určité stanice (list 28).","r":[["Sekvence","1 2 3 4 5, dvakrát; dekóduje ji i aplikace SelCall pro UV-K1"]]},"pocsag":{"sh":"pagery","t":"POCSAG a FLEX: pagery","h":"FSK ±4,5 kHz; preambule 1010… a pak data (zmenšeno).","l":"Dvě ostré čáry během preambule, pak plné pásmo; pronikavé „brrrrt“. 466,075 MHz, DAPNET 439,9875 MHz (list 37).","n":"zmenšeno"},"ale":{"sh":"8 tónů","t":"ALE: automatické navázání spojení na KV","h":"Osm tónů od 750 do 2500 Hz, 125 Bd, v dávkách.","l":"Blok asi 2 kHz z drobných teček, jednu až dvě sekundy, někdy na několika sousedních kmitočtech; vysoké švitoření (list 28 bis)."},"rs41":{"nm":"Radiosonda RS41","t":"Radiosonda RS41: nepřetržitá GFSK","h":"Vyhlazená FSK 4800 Bd bez přestávky; kmitočet pomalu ujíždí, jak sonda stoupá a chladne.","l":"Pás asi 10 kHz, který během celého letu šikmo klouže, mezi 400 a 406 MHz (list 18)."},"ook":{"nm":"Senzory 433","t":"Senzory 433 MHz: OOK","h":"Nosná se zapíná a vypíná v krátkých nebo dlouhých impulzech (vše nebo nic); zpráva se opakuje třikrát.","l":"Dávky drobných teček, často trojmo, na 433,92 MHz: meteostanice, teplotní čidla, dálková ovládání (list 19)."},"fhss":{"t":"Bluetooth: přeskakování kmitočtu (FHSS)","h":"Kmitočet se mění 1600krát za sekundu mezi 79 kanály (zmenšeno).","l":"Drobné čárky rozházené všude po 80 MHz, nikdy na stejném místě, kolem 2,4 GHz (list 22).","n":"zmenšeno"},"wspr":{"t":"WSPR: šířkové majáky","h":"Čtyři tóny 1,46 Hz od sebe, 0,68 s na symbol, po dobu 110,6 s.","l":"Velmi tenká čára asi 6 Hz, trvá skoro dvě minuty, každou sudou minutu: je třeba hodně přiblížit (list 26).","n":"úryvek 24 s (vysílání trvá 110,6 s)"},"qrss":{"t":"QRSS: velmi pomalá morseovka","h":"Nosná zapínaná a vypínaná, tečky 3 až 10 s, často na dvou sousedních kmitočtech (DFCW).","l":"Čáry široké jen několik Hz, čtené na desetiminutové obrazovce; uchem neslyšitelné (list 26 bis).","n":"zrychleno: tečka 0,6 s místo 3 až 10 s"},"texte":{"nm":"Text ve vodopádu","t":"Text ve vodopádu","h":"Každý řádek obrázku se stane skupinou tónů: zvuk připomíná šum.","l":"Text nebo kresba se objeví přímo na obrazovce SDR (list 33).","r":[["Poznámka","Vysíláno od spodku obrázku: rovně v živém vodopádu, vzhůru nohama v otisku (čteném shora dolů)"]]},"vara":{"t":"Moderní KV data: VARA, Pactor, ARDOP","h":"Dlouhé plné dávky (OFDM nebo PSK) a mezi nimi krátké odpovědi protistanice.","l":"Obdélník asi 2,4 kHz, který se zastaví a znovu rozběhne, s malým potvrzením mezi tím; přerušované šumění (list 26)."},"chirp":{"nm":"Ionosonda","t":"Ionosonda (chirp sounder)","h":"Pomalá kmitočtová rampa přes celé KV pásmo; ozvěny z ionosféry přicházejí o něco později.","l":"Úhlopříčka přes obrazovku doprovázená rovnoběžnými čarami (ozvěnami); „ffuit“, které proletí za zlomek sekundy."},"oth":{"nm":"Radar za horizont","t":"Radar za horizont („woodpecker“)","h":"Impulzy opakované 10 až 50krát za sekundu, každý široký několik kHz.","l":"Široký pruhovaný blok přes celá pásma; velmi pravidelné ťukání datla na krátkých vlnách."},"parasites":{"nm":"Rušení","sh":"zdroj","t":"Rušení ze spínaného zdroje","h":"Obdélníkový signál: jeho kmitočet a všechny harmonické vycházejí zároveň.","l":"Hřeben pravidelných čar, které spolu ujíždějí, na šumovém pozadí: hledej s NOISE FIND nebo přenosným přijímačem (list K21b)."},"mpx":{"nm":"FM stereo a RDS","t":"Rozhlas FM stereo a RDS","h":"Demodulovaný zvuk (multiplex) obsahuje kanál L+R, pilot na 19 kHz, kanál L-R kolem 38 kHz a RDS na 57 kHz.","l":"Od 0 do 60 kHz po demodulaci: hluboký blok, tenká čára na 19 kHz, slabší blok uprostřed a RDS úplně nahoře (list 10).","n":"měřítko ÷ 20 pro poslech"},"dcf77":{"t":"Časový signál DCF77 (77,5 kHz)","h":"Nosná, která na začátku každé sekundy klesne na 15 % na 0,1 s (bit 0) nebo 0,2 s (bit 1).","l":"Pevná čára s černou mezerou každou sekundu; 59. sekunda ji nemá, aby označila minutu (list 10).","r":[["Poznámka","Nosná je zde posunuta na 1000 Hz; 6. sekunda nemá mezeru, jako 59. sekunda každé minuty"]]},"ofdm":{"t":"OFDM: desítky subnosných","h":"Mnoho hustě vedle sebe ležících nosných, každá pomalá: součet vypadá jako šum.","l":"Plochý obdélník s ostrými okraji, stále přítomný: DRM na KV (10 kHz), DAB+ (1,5 MHz), DVB-T, Wi-Fi. V uchu nepřetržitý šum (listy 10 a 22)."},"dsss":{"t":"Rozprostřené spektrum (DSSS): GPS, Wi-Fi 802.11b","h":"Data se smíchají s velmi rychlým kódem: energie se rozprostře do velké šířky.","l":"Široký hrb sotva nad šumem; GPS je dokonce pod šumem a bez zpracování není vidět (listy 22 a 23)."},"hline":{"nm":"Vodíková čára","sh":"1420 MHz","t":"Vodíková čára 21 cm (1420,405 MHz)","h":"Studený vodík v Mléčné dráze vyzařuje velmi slabý šum na 1420,405 MHz. Pohyb ramen galaxie ho posouvá Dopplerovým jevem: je vidět několik malých hrbolků.","l":"Ve vodopádu se ze sekundy na sekundu skoro nic neděje: je třeba dlouho průměrovat, aby se hrbolky vynořily ze šumu. Zde se po zastavení podívej na průměrné spektrum. Stačí parabola nebo trychtýř, předzesilovač a SDR klíčenka.","n":"signál silně zveličen"},"sun":{"nm":"Slunce","sh":"vzplanutí","t":"Slunce: rádiová vzplanutí typu III","h":"Elektrony vymrštěné erupcí procházejí sluneční korónou a nutí ji vyzařovat stále níž, jak se vzdalují.","l":"Čáry, které za méně než sekundu padají šikmo shora dolů spektrem na pozadí slunečního šumu; sílící „šššš“. Zhruba 10 až 400 MHz, i na krátkých vlnách kolem 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter: dekametrová vzplanutí (L a S)","h":"Magnetické pole Jupiteru a jeho měsíc Io vytvářejí silné vyzařování mezi 15 a 40 MHz: pomalá vzplanutí L a velmi krátká vzplanutí S, která rychle klouzají dolů.","l":"Nejdřív vlny šumu (L, jako příboj), pak série drobných „lupnutí“ (S) v hustých úhlopříčkách. Kolem 20,1 MHz v noci, s obyčejným dipólem, když je Io dobře postavená."},"pulsar":{"nm":"Pulzar","sh":"B0329+54","t":"Pulzar PSR B0329+54","h":"Rotující neutronová hvězda přejíždí Zemi rádiovým paprskem, zde každých 0,714 s. Mezihvězdný plyn zpožďuje nízké kmitočty: každý impulz dorazí nejdřív nahoře ve spektru.","l":"Pravidelné „tik“; ve vodopádu je každý impulz klesající křivka (disperze). Skutečný signál je pod šumem: je třeba velká anténa a sčítání impulzů přes jejich periodu.","n":"signál silně zveličen"},"meteor":{"nm":"Meteory","sh":"GRAVES","t":"Meteorické ozvěny radaru GRAVES (143,050 MHz)","h":"Francouzský radar GRAVES vysílá nepřetržitě na 143,050 MHz. Když padající hvězda ionizuje vzduch, její stopa odrazí trochu signálu k tvému přijímači, na zlomek sekundy až několik sekund.","l":"V USB na 143,049 MHz: krátká „pípnutí“ kolem 1000 Hz, někdy klouzající ozvěna (hlava meteoru, Dopplerův jev) nebo dlouhá. Mnohem víc během rojů (Perseidy, Geminidy) (list 1)."},"whistler":{"nm":"Hvizdy","sh":"VLF","t":"VLF hvizdy (whistlery)","h":"Blesk vytvoří rádiové cvaknutí; část putuje podél siločar zemského magnetického pole na druhou polokouli a zpět, výšky napřed.","l":"„Fjúúú“, které za sekundu či dvě sklesne z výšky do hloubky hned po cvaknutí; všude praskání (sferiky). Pod 10 kHz, s VLF přijímačem daleko od elektrického vedení."},"chorus":{"nm":"Ranní sbor","sh":"VLF","t":"Ranní sbor (dawn chorus)","h":"Během magnetické bouře vydávají elektrony zachycené v magnetosféře drobné stoupající tóny, hlavně za úsvitu.","l":"Stoupající švitoření, která se překrývají jako ptáci, zhruba 1 až 4 kHz. Stejné vybavení jako na hvizdy."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"První umělá družice vysílala tři týdny pípnutí asi 0,3 s střídavě na 20,005 a 40,002 MHz.","l":"Pravidelně přerušovaná čára: „píp… píp…“, zvuk, který v říjnu 1957 poslouchal celý svět (rekonstrukce)."},"doppler":{"nm":"Dopplerův jev","sh":"družice","t":"Maják družice a Dopplerův jev","h":"Družice na nízké dráze se přibližuje a pak vzdaluje: přijímaný kmitočet během přeletu klesá, asi o ±3 kHz na 145 MHz a ±10 kHz na 435 MHz.","l":"Čára klesající do tvaru S: nejdřív pomalu, rychle při největším přiblížení, pak zase pomalu (list 34).","n":"přelet 10 min zkrácen na 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Družice NOAA: snímky APT (historie)","h":"Pomocná nosná 2400 Hz amplitudově modulovaná obrazem, dva řádky za sekundu, se synchronizačním impulzem na začátku každého řádku. Vypnuto v roce 2025; dnes vysílají družice Meteor-M v LRPT.","l":"Čára na 2400 Hz s postranními pásmy, která se mění s obrazem, a známé „tik-tak“ dvakrát za sekundu (list 34)."},"eme":{"nm":"Ozvěna od Měsíce","sh":"EME","t":"Ozvěna od Měsíce (EME)","h":"Signál vyslaný k Měsíci se vrátí asi za 2,5 s, nesmírně zeslabený, trochu rozšířený a posunutý Dopplerem.","l":"Slyšíš své vlastní „píp“ a za 2,5 s jeho slabou, trochu rozmazanou ozvěnu. Radioamatéři to dělají v CW nebo JT65, od 144 MHz výš (list 1).","n":"ozvěna silně zveličena"},"msk144":{"nm":"MSK144","sh":"meteory","t":"MSK144: digitální provoz přes meteory","h":"Dva tóny, 1000 a 2000 Hz, rychlostí 2000 Bd, v rámcích po 72 ms opakovaných bez přestávky: každá stopa meteoru propustí několik z nich.","l":"Dávky 0,1 až 1 s, široké asi 2,4 kHz, které se objeví a zhasnou s „pípnutím“ meteoru. Na 50 a 144 MHz, s WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tónů","t":"JT65: 65 tónů, velmi pomalé","h":"Jeden synchronizační tón a 64 datových tónů 2,7 Hz od sebe (JT65A), 0,37 s na symbol, 47 s vysílání za minutu.","l":"Žebřík drobných čárek na asi 180 Hz se synchronizační čárou, která se vrací stále na stejné místo. Používá se pro odraz od Měsíce (JT65B a C) a velmi slabé signály.","n":"úryvek 20 s (vysílání trvá 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: profesionální digitální síť","h":"Fázová modulace π/4-DQPSK s 18 000 symboly za sekundu, čtyři časové sloty, v kanálech 25 kHz.","l":"Plný blok se zaoblenými boky, u základnové stanice stále přítomný; chraplavý šum. Šifrováno: nelze poslouchat (list 38).","n":"zmenšeno"},"ndb":{"nm":"Maják NDB","sh":"190–535 kHz","t":"NDB: nesměrový radiomaják","h":"Pevná nosná na dlouhých vlnách s morseovkovou značkou o dvou či třech písmenech vysílanou tónem (často 1020 Hz).","l":"Pevná čára uprostřed a během značky dvě čárky po stranách. Zhruba 190 až 535 kHz, v SSB nebo CW (list 10)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: všesměrový radiomaják","h":"V AM: signál 30 Hz závislý na směru, pomocná nosná 9960 Hz kmitočtově modulovaná 30 Hz (reference) a morseovková značka na 1020 Hz.","l":"V demodulovaném zvuku: hluboké bručení 30 Hz, široká vlnitá čára kolem 10 kHz a občas značka (list 15).","n":"demodulovaný zvuk, měřítko ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: navádění na přistání (localizer)","h":"V AM dva tóny 90 a 150 Hz; jejich poměr říká letadlu, zda je vlevo nebo vpravo od osy. Morseovková značka začíná písmenem I.","l":"V demodulovaném zvuku: dvě velmi hluboké čáry na 90 a 150 Hz a značka na 1020 Hz. Mezi 108,1 a 112 MHz; sestupová rovina je kolem 330 MHz (list 15)."},"m10":{"nm":"Sondy M10 / M20","sh":"Meteomodem","t":"Radiosondy M10 a M20 (Meteomodem)","h":"Jeden rámec za sekundu v rychlé FSK (asi 9600 Bd): širší než RS41. Ve Francii je vypouští Météo-France.","l":"Každou sekundu široká dávka, která během letu pomalu ujíždí; mezi 400 a 406 MHz (list 18)."},"tpms":{"nm":"Pneumatiky (TPMS)","sh":"433 MHz","t":"Snímače tlaku v pneumatikách (TPMS)","h":"Každé kolo občas vyšle dávku FSK o několika milisekundách: tlak, teplota, identifikátor.","l":"Drobné samostatné dávky na 433,92 MHz (nebo 315 MHz), často po dvou, když projede auto. Dekóduje je rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Časový signál ALS162 (Allouis, 162 kHz)","h":"Nosná bývalého dlouhovlnného vysílání France Inter; čas je zakódován drobnými, neslyšitelnými fázovými modulacemi.","l":"Pevná čára, ve Francii velmi silná, na začátku každé sekundy sotva rozšířená; ke čtení času je třeba dekodér (list 10)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Časový signál WWV (Colorado)","h":"V AM: každou sekundu „tik“ 5 ms na 1000 Hz, tón 500 nebo 600 Hz, časový kód na 100 Hz a hlas hlásící UTC.","l":"V demodulovaném zvuku: čára na 500 Hz přerušená každou sekundu, tik na 1000 Hz a úplně dole kód na 100 Hz (list 10)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Časový signál MSF (Anthorn, 60 kHz)","h":"Nosná se na začátku každé sekundy vypne na 0,1, 0,2 nebo 0,3 s podle bitů a na 0,5 s pro označení minuty.","l":"Pevná čára s úplně černými mezerami každou sekundu, delšími než u DCF77 (list 10)."},"type2":{"nm":"Slunce typ II","sh":"rázová vlna","t":"Slunce: rádiová vzplanutí typu II","h":"Rázová vlna výronu koronální hmoty nutí plazma vyzařovat pomalu stále níž, často ve dvou pásech (základní a dvojnásobný).","l":"Dva rovnoběžné pásy šumu, které několik minut pozvolna klesají. Porovnej se vzplanutími typu III, která jsou mnohem rychlejší.","n":"několik minut zkráceno na 6 s"},"tweeks":{"nm":"Tweeky","sh":"VLF","t":"Tweeky: noční VLF „pípnutí“","h":"V noci se cvaknutí vzdáleného blesku odráží mezi zemí a ionosférou; kmitočty u mezního kmitočtu (kolem 1,7 kHz) dorazí poslední.","l":"Malé „pípnutí“, které klesne a zastaví se kolem 1,7 kHz, někdy s ozvěnou na dvojnásobku; všude praskání. Pod 10 kHz, v noci."},"hiss":{"nm":"VLF šum","sh":"hiss","t":"VLF šum (hiss)","h":"Širokopásmový šum elektronů v plazmasféře, který roste a klesá s magnetickou aktivitou.","l":"Pás šumu od několika set Hz do několika kHz, bez vzoru, pomalu sílí a slábne."},"aurora":{"nm":"Rádiová polární záře","sh":"Au","t":"Šíření přes polární záři (Au)","h":"Polární záře odráží VKV vlny, ale velmi rychle jimi třese: každý signál se rozprostře do několika set Hz.","l":"CW se změní v drsný, jakoby šeptaný šum; tón už neslyšíš. Na 50 a 144 MHz, s anténou k severu při magnetických bouřích."},"galactic":{"nm":"Galaktický šum","sh":"20–40 MHz","t":"Šum Mléčné dráhy","h":"Střed galaxie vyzařuje rádiový šum, který Karl Jansky objevil v roce 1932 kolem 20 MHz. Roste a klesá s otáčením Země.","l":"Šum pozadí, který pomalu roste a zase klesá, každý den asi o 4 minuty dřív. Viditelný s obyčejným dipólem mezi 20 a 40 MHz.","n":"den zkrácen na 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 Bd","t":"Telemetrie CubeSatu","h":"Malé družice pravidelně vysílají svá měření (baterie, teploty) v FSK nebo GMSK rychlostí 1200 nebo 9600 Bd kolem 435–438 MHz.","l":"Pravidelné dávky, které během přeletu Dopplerovým jevem pokaždé sklouznou o kus níž (list 34).","n":"zmenšeno, přelet zrychlen"},"issfm":{"nm":"ISS v FM","sh":"145,800 MHz","t":"Vesmírná stanice (ISS): hlas v FM","h":"Astronauti mluví se školami a radioamatéry v FM na 145,800 MHz. Stanice letí rychlostí 28 000 km/h: přijímaný kmitočet během přeletu klesne asi o 3,5 kHz.","l":"Pás FM hlasu, který se během desetiminutového přeletu pomalu posouvá zprava doleva (list 34).","n":"přelet 10 min zkrácen na 10 s"},"buzzer":{"nm":"UVB-76 „The Buzzer“","sh":"4625 kHz","t":"UVB-76, „The Buzzer“ (4625 kHz)","h":"Ruská vojenská stanice, která už desítky let vysílá asi sekundové bzučení, zhruba 25krát za minutu, někdy přerušené hlasovou zprávou.","l":"Pevná nosná a při každém bzučení sloupec hustých čar shora dolů. Snadno ji najdeš na 4625 kHz v USB."},"pip":{"nm":"„The Pip“","sh":"3756 / 5448 kHz","t":"„The Pip“: nekonečná pípnutí","h":"Další ruský vojenský krátkovlnný maják, který dnem i nocí opakuje krátká pípnutí, někdy přerušená zprávami.","l":"Pevná čára rozsekaná na velmi husté tečky; v uchu rychlé píp-píp-píp, které nikdy nepřestane.","n":"přibližný rytmus"},"squeaky":{"nm":"„Squeaky Wheel“","sh":"KV","t":"„Squeaky Wheel“: vrzající kolo","h":"Ruský vojenský krátkovlnný maják, pojmenovaný posluchači podle svého opakovaného zvukového vzoru.","l":"Malý vzor dvou zvuků, z nichž jeden stoupá, opakovaný dokola: jako vrzající kolo.","n":"přibližná napodobenina"},"codar":{"nm":"CODAR","sh":"oceánský radar","t":"CODAR: radary mořských proudů","h":"Pobřežní radary jednou či dvakrát za sekundu přejedou pásmo kmitočtů, aby měřily proudy a vlny.","l":"Pravidelné rovnoběžné úhlopříčky a opakované „swish“; kolem 4,5–5,5 MHz, 13 MHz a 25 MHz, často ve dne i v noci.","n":"zmenšeno"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Vojenský modem STANAG 4285","h":"Fázová modulace 8-PSK rychlostí 2400 Bd na nosné 1800 Hz, se zkušební sekvencí každých 107 ms pro sledování kanálu.","l":"Plný blok asi 3 kHz; v uchu šum s pravidelným bzučením (list 35 bis)."},"link11":{"nm":"Link-11","sh":"16 tónů","t":"Link-11: námořní datové spojení","h":"Šestnáct tónů od 605 do 2915 Hz vysílaných současně, každý fázově modulovaný 75krát za sekundu.","l":"Hřeben pravidelných čar na 2,3 kHz a jedna čára trochu stranou; v uchu hudební bručení (list 35 bis)."},"numbers":{"nm":"Číselná stanice","sh":"hlas","t":"Číselná stanice","h":"V pevný čas krátká volací melodie, pak hlas (často syntetický) čte skupiny pěti číslic, v AM nebo SSB.","l":"Melodie v samostatných tónech, pak pravidelné skupiny slabik oddělené tichem (list 35 bis).","n":"napodobený hlas, žádné skutečné číslice"}}},"pt":{"ui":{"title":"Identificador de modos de rádio","mystery":"Som mistério","play":"▶ Ouvir","stop":"■ Parar","noise":"Ruído","volume":"Volume","loop":"Repetir","specwf":"Espetro + Cascata","cursor":"cursor","footprint":"Impressão","dur":"{s} s de cima para baixo","avg":"média de todo o sinal","press":"Carrega em Ouvir: o sinal desfila aqui","count":"{n} sinais, pela ordem da ficha 5 bis","myst":"Modo mistério","mystTags":"Ouve e observa, depois escolhe a resposta certa","quizH":"Que sinal é este?","quizLead":"Põe a ouvir, observa o espetro, a cascata e a impressão, e responde.","score":"Pontuação","good":"Certo!","bad":"Errado: era {x}.","next":"Próximo som mistério","principle":"Princípio","screen":"No ecrã","sheet":"ficha","book":"Livro: ficha {r}","lang":"Idioma","signals":"Sinais","f1":"Sinais simulados na página (12 000 amostras por segundo), segundo os sinais da ficha 5 bis do livro OpenBookRadio, mais Olivia, FT4 e Feld Hell (ficha 26). Nos sinais de rádio (AM, FM, AIS, LoRa…) vê-se a frequência intermédia simulada, como no ecrã de um SDR; alguns estão em escala reduzida ou acelerada, como indicado.","f2":"O tempo desce na cascata e na impressão. Licença CC BY-NC-SA 4.0, gratuito, proibida a venda.","night":"Modo noite","day":"Modo dia"},"groups":["Voz analógica","Telegrafia","Dados","Imagens","Aviação, marinha e socorro","Chamada, subtons e mensagens","Radiossondas, sensores e objetos ligados","Modos HF e curiosidades","Radiodifusão e hora","Banda larga","Bónus: sons do espaço","Bónus: curiosidades da onda curta"],"modes":{"am":{"sh":"voz","t":"AM: modulação de amplitude","h":"A força da portadora segue o som: a curva «incha» e «desincha».","l":"Um traço fixo no centro (a portadora), com duas bandas laterais iguais de cada lado. Cerca de 6 a 9 kHz de largura. Rádio em onda curta e onda média, aviação (fichas 10 e 12)."},"ssb":{"nm":"BLU / SSB","t":"BLU / SSB: banda lateral única","h":"Só fica uma banda lateral, sem portadora: nada quando ninguém fala.","l":"Sem traço central, uma única banda de cerca de 2,7 kHz que só vive quando se fala. USB acima de 10 MHz, LSB abaixo (radioamadores). Mal sintonizada, a voz parece um «pato» (fichas 9 e 26)."},"fm":{"sh":"voz","t":"FM: modulação de frequência","h":"A amplitude fica fixa; as oscilações aproximam-se ou afastam-se com o som.","l":"O sinal dança à volta da sua frequência, mais largo quando o som é forte: 12,5 kHz por canal em FM estreita (walkie-talkies, repetidores), 200 kHz em rádio FM (fichas 2 e 11)."},"cw":{"t":"CW: Morse","h":"A portadora liga e desliga: traços e pontos.","l":"Um traço muito fino que se interrompe ao ritmo do Morse; um apito ao ouvido. Aqui «CQ» (ficha 39).","r":[["Velocidade","20 palavras/min, ponto de 60 ms, a 700 Hz: «CQ CQ CQ DE F4ABC K»"],["De ouvido","Apitos puros, longos e curtos, de uma só nota"],["Descodificação","De ouvido, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: duas frequências","h":"A frequência salta entre dois valores, um para 0, outro para 1.","l":"Dois traços paralelos: 170 Hz de afastamento nos radioamadores (45,45 bauds), 450 ou 850 Hz nos boletins meteorológicos. Um «tidilidi» regular (ficha 27).","r":[["Código","Baudot ITA2: 5 bits + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Texto","RYRYRYRY CQ CQ DE F4ABC"],["Descodificação","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 bauds: APRS e packet","h":"Dois tons áudio, 1200 e 2200 Hz, enviados para um emissor FM.","l":"Visto depois do recetor FM (som do altifalante): uma banda de 1200 a 2200 Hz, em rajadas curtas. Ao ouvido, um «grrrt» de um segundo (fichas 29 e 30).","r":[["Frequência","144,800 MHz na Europa (APRS), FM"],["Trama","Flags 0x7E e depois dados AX.25 em NRZI"],["Descodificação","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"t":"PSK31: modulação de fase","h":"A frequência não se mexe, é a fase que se inverte; a amplitude cava em cada inversão.","l":"Um traço muito fino de cerca de 60 Hz, um pouco «entrançado». Dezenas de estações cabem em 3 kHz (ficha 26).","r":[["Código","Varicode: 0 = inversão de fase, 1 = sem mudança; em repouso, dois traços gémeos"],["Onde ouvir","14 070 kHz, 3580 kHz"],["Descodificação","fldigi"]]},"ft8":{"t":"MFSK / FT8: oito tons","h":"A frequência sobe e desce em degraus de 6,25 Hz, 0,16 s por degrau.","l":"Bandas de cerca de 50 Hz que duram 12,6 s e voltam a cada 15 s, acertadas pela hora: várias estações ao mesmo tempo em 3 kHz, por exemplo em 7,074 MHz (ficha 26).","r":[["Trama","79 símbolos de 0,16 s, três padrões Costas (início, meio, fim); aqui oito estações"],["Frequências","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Descodificação","WSJT-X, JTDX (hora do PC exata)"]]},"ft4":{"t":"FT4: o FT8 dos concursos","h":"Quatro tons afastados 20,8 Hz, 20,8 bauds: 105 símbolos em 5 s, em períodos de 7,5 s.","l":"Bandas de cerca de 90 Hz, mais curtas e largas que o FT8, que voltam a cada 7,5 s. 14 080, 7047,5 kHz (ficha 26)."},"olivia":{"t":"Olivia 8/250: oito tons","h":"Oito tons afastados 31,25 Hz, um de cada vez, que saltam ao acaso; codificação Walsh e entrelaçamento.","l":"Um bloco de pontos dispersos em 250 Hz; descodifica muito abaixo do ruído. Uma pequena melodia aleatória ao ouvido (ficha 26)."},"hell":{"t":"Feld Hell: escrever com uma portadora","h":"A portadora liga e desliga ponto a ponto: cada letra é feita de colunas de 14 pontos, varridas de baixo para cima (245 pontos por segundo).","l":"Na cascata, um traço picotado; é o ecrã do programa (fldigi) que redesenha as letras. Um crepitar suave ao ouvido (ficha 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Quatro níveis de frequência: cada símbolo leva dois bits.","l":"Um bloco retangular de 6 a 12,5 kHz, cheio como ruído, muitas vezes em rajadas (o DMR divide o canal em dois intervalos). Um «frrr» rouco ao ouvido (ficha 38)."},"mt63":{"t":"MT63: mensagens de emergência (NBEMS)","h":"64 tons ao mesmo tempo, cada um modulado lentamente, com muita redundância.","l":"Um bloco plano de 1 ou 2 kHz centrado em 1500 Hz, de bordas nítidas; um sopro regular. Passa até por um microfone encostado a um altifalante (ficha 26 ter)."},"lora":{"t":"LoRa: rampas de frequência (chirps)","h":"A frequência varre toda a largura e recomeça de baixo: a posição do salto leva os dados.","l":"Diagonais paralelas, fáceis de reconhecer: Meshtastic e MeshCore em 869,525 MHz ou 433 MHz, sensores LoRaWAN (fichas 11, 20 e 21)."},"sstv":{"t":"SSTV: imagens em áudio","h":"Um impulso de sincronismo a 1200 Hz, depois a frequência segue o brilho da linha, de 1500 (preto) a 2300 Hz (branco).","l":"Traços de sincronismo regulares e uma nuvem que muda com a imagem; um som que «chilreia» durante um a dois minutos. 14,230 MHz, ISS em 145,800 MHz (ficha 31).","r":[["Trama","Cabeçalho VIS e depois linhas: sincronismo 1200 Hz, verde, azul, vermelho; aqui 20 linhas de uma mira"],["Descodificação","QSSTV, MMSSTV, Robot36 no telemóvel"]]},"fax":{"nm":"Fax meteorológico","t":"Fax meteorológico: 1500 Hz preto, 2300 Hz branco","h":"A frequência passa do preto ao branco de forma contínua, 120 linhas por minuto.","l":"Duas bandas fixas em 1500 e 2300 Hz (800 Hz de afastamento), um «tique-taque» regular. As frequências publicadas são as da portadora: ouvir em USB 1,9 kHz abaixo (ficha 32).","r":[["Trama","Tom de arranque de 300 Hz, linhas de fase (impulso branco) e depois o mapa"],["Descodificação","fldigi, JWX, HamFax"]]},"elt":{"nm":"Sirene ELT","t":"Sirene ELT / PLB em 121,5 MHz","h":"Uma AM cujo tom desce de 1600 para 300 Hz, duas a quatro vezes por segundo.","l":"Uma portadora fixa e bandas laterais que deslizam em leque: o «uu-uu» das balizas de socorro, também em 121,375 MHz para exercícios (fichas 24 e 25)."},"406":{"nm":"Baliza 406","t":"Baliza 406 MHz: rajada BPSK","h":"Meio segundo de emissão: 160 ms de portadora pura, depois a fase oscila ±1,1 radiano a 400 bit/s.","l":"Um pequeno traço curto que volta a cada 50 s, entre 406,0 e 406,1 MHz; nada útil para ouvir, é preciso um descodificador (EPIRB 406, ficha 25)."},"adsb":{"t":"ADS-B / modo S (1090 MHz): impulsos","h":"Impulsos de 0,5 µs cuja posição leva os bits (PPM); aqui a escala de tempo está muito abrandada.","l":"Traços horizontais muito curtos em toda a largura, centenas por segundo perto de um aeroporto; é preciso uma pen SDR (ficha 13).","n":"escala de tempo muito abrandada"},"acars":{"t":"ACARS: AM e dados MSK","h":"Uma AM que transporta dois tons, 1200 e 2400 Hz, a 2400 bit/s.","l":"Rajadas de meio segundo com portadora e bandas laterais, em 131,525, 131,725 ou 131,825 MHz na Europa: um «brrrt» ao ouvido (ficha 14)."},"ais":{"t":"AIS: GMSK 9600 bauds em dois canais","h":"Uma FSK suavizada (GMSK) em rajadas de 26 ms, uma vez em 161,975 MHz, outra em 162,025 MHz (escala reduzida).","l":"Duas colunas de traços breves, a 50 kHz um do outro, um estalido regular; quanto mais navios, mais denso (ficha 16).","n":"escala reduzida"},"navtex":{"t":"NAVTEX e DSC em onda média e curta: FSK 170 Hz","h":"Como o RTTY: duas frequências a 170 Hz, mas a 100 bauds.","l":"Dois traços paralelos contínuos durante o boletim, em 518 e 490 kHz (NAVTEX) ou 2187,5 kHz (chamada seletiva digital) (ficha 17).","r":[["Código","SITOR-B, CCIR 476: 7 bits com quatro «1», com repetição FEC"],["Descodificação","fldigi, YaND"]]},"hfdl":{"t":"HFDL: os aviões em onda curta","h":"Uma PSK de 1800 bauds numa subportadora de 1440 Hz.","l":"Rajadas de cerca de 2,4 kHz entre 2,9 e 22 MHz; um chiado de modem que vai e vem (ficha 14 bis)."},"ctcss":{"t":"CTCSS: subtom por baixo da voz","h":"Um tom grave e contínuo (67 a 254 Hz, aqui 88,5 Hz) junto à voz.","l":"Visto no som do recetor FM: um traço fixo bem em baixo, por baixo da voz; abre o squelch dos repetidores e walkie-talkies (ficha 8)."},"dtmf":{"sh":"2 tons","t":"DTMF: dois tons por tecla","h":"Cada tecla envia ao mesmo tempo um tom grave (697 a 941 Hz) e um agudo (1209 a 1633 Hz).","l":"Pares de pontos alinhados em oito colunas fixas; o «bip-bip» dos números de telefone e dos comandos de repetidores (ficha 8).","r":[["Sequência","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tons","t":"Selcall CCIR: tons em sequência","h":"Cinco tons de 100 ms seguidos, um por algarismo.","l":"Uma pequena escada de pontos, repetida; um «tululululu» rápido para chamar um rádio preciso (ficha 28).","r":[["Sequência","1 2 3 4 5, duas vezes; também descodificada pela app SelCall do UV-K1"]]},"pocsag":{"sh":"pagers","t":"POCSAG e FLEX: pagers","h":"Uma FSK a ±4,5 kHz; um preâmbulo 1010… e depois os dados (escala reduzida).","l":"Dois traços nítidos durante o preâmbulo, depois uma banda cheia; um «brrrrt» estridente. 466,075 MHz, DAPNET 439,9875 MHz (ficha 37).","n":"escala reduzida"},"ale":{"sh":"8 tons","t":"ALE: chamada automática em onda curta","h":"Oito tons de 750 a 2500 Hz, 125 bauds, em rajadas.","l":"Um bloco de cerca de 2 kHz feito de pontinhos, um a dois segundos, às vezes em várias frequências vizinhas; um chilrear agudo (ficha 28 bis)."},"rs41":{"nm":"Radiossonda RS41","t":"Radiossonda RS41: GFSK contínua","h":"Uma FSK suavizada a 4800 bauds, sem parar; a frequência deriva devagar à medida que a sonda sobe e arrefece.","l":"Uma banda de cerca de 10 kHz que desliza na diagonal durante todo o voo, entre 400 e 406 MHz (ficha 18)."},"ook":{"nm":"Sensores 433","t":"Sensores 433 MHz: OOK","h":"A portadora liga e desliga em impulsos curtos ou longos (tudo ou nada); a mensagem repete-se três vezes.","l":"Rajadas de pontinhos, muitas vezes em triplicado, em 433,92 MHz: estações meteorológicas, sondas de temperatura, comandos à distância (ficha 19)."},"fhss":{"t":"Bluetooth: saltos de frequência (FHSS)","h":"A frequência muda 1600 vezes por segundo entre 79 canais (escala reduzida).","l":"Pequenos traços espalhados por todo o lado em 80 MHz, nunca no mesmo sítio, perto de 2,4 GHz (ficha 22).","n":"escala reduzida"},"wspr":{"t":"WSPR: balizas de propagação","h":"Quatro tons afastados 1,46 Hz, 0,68 s por símbolo, durante 110,6 s.","l":"Um traço muito fino de cerca de 6 Hz que dura quase dois minutos, a cada dois minutos pares: é preciso ampliar muito (ficha 26).","n":"excerto de 24 s (uma emissão dura 110,6 s)"},"qrss":{"t":"QRSS: Morse muito lento","h":"Uma portadora ligada e desligada, com pontos de 3 a 10 s, muitas vezes em duas frequências vizinhas (DFCW).","l":"Traços de poucos Hz de largura, lidos num ecrã de dez minutos; inaudível ao ouvido (ficha 26 bis).","n":"acelerado: ponto de 0,6 s em vez de 3 a 10 s"},"texte":{"nm":"Texto na cascata","t":"Texto na cascata","h":"Cada linha de uma imagem torna-se um grupo de tons: o som parece ruído.","l":"O texto ou o desenho aparece diretamente no ecrã do SDR (ficha 33).","r":[["Nota","Emitido a partir de baixo da imagem: direito na cascata ao vivo, de pernas para o ar na impressão (lida de cima para baixo)"]]},"vara":{"t":"Dados HF modernos: VARA, Pactor, ARDOP","h":"Rajadas longas e cheias (OFDM ou PSK) e, entre elas, respostas curtas da outra estação.","l":"Um retângulo de cerca de 2,4 kHz que para e recomeça, com um pequeno aviso de receção no meio; um chiado entrecortado (ficha 26)."},"chirp":{"nm":"Sondador ionosférico","t":"Sondador ionosférico (chirp sounder)","h":"Uma rampa de frequência lenta que atravessa toda a banda HF; os ecos da ionosfera chegam um pouco depois.","l":"Uma diagonal que varre o ecrã, acompanhada de traços paralelos (os ecos); um «ffuit» que passa numa fração de segundo."},"oth":{"nm":"Radar trans-horizonte","t":"Radar trans-horizonte («woodpecker»)","h":"Impulsos repetidos 10 a 50 vezes por segundo, cada um com vários kHz de largura.","l":"Um bloco largo e riscado que cobre bandas inteiras; um bater de pica-pau muito regular em onda curta."},"parasites":{"nm":"Interferências","sh":"fonte","t":"Interferências de uma fonte comutada","h":"Um sinal quadrado: a sua frequência e todas as harmónicas saem ao mesmo tempo.","l":"Um pente de riscas regulares que derivam juntas sobre um fundo de ruído: procurar com NOISE FIND ou um recetor portátil (ficha K21b)."},"mpx":{"nm":"FM estéreo e RDS","t":"Rádio FM estéreo e RDS","h":"O som desmodulado (multiplex) contém a via L+R, um piloto a 19 kHz, a via L-R à volta de 38 kHz e o RDS a 57 kHz.","l":"Visto de 0 a 60 kHz depois da desmodulação: um bloco grave, um traço fino a 19 kHz, um bloco mais fraco no meio e o RDS lá em cima (ficha 10).","n":"escala ÷ 20 para ouvir"},"dcf77":{"t":"Sinal horário DCF77 (77,5 kHz)","h":"Uma portadora que baixa para 15 % durante 0,1 s (bit 0) ou 0,2 s (bit 1), no início de cada segundo.","l":"Um traço fixo com um corte preto a cada segundo; o segundo 59 não tem, para marcar o minuto (ficha 10).","r":[["Nota","Aqui a portadora é trazida para 1000 Hz; o 6.º segundo não tem corte, como o segundo 59 de cada minuto"]]},"ofdm":{"t":"OFDM: dezenas de subportadoras","h":"Muitas portadoras muito juntas, cada uma lenta: a soma parece ruído.","l":"Um retângulo plano de bordas nítidas, sempre presente: DRM em onda curta (10 kHz), DAB+ (1,5 MHz), TDT, Wi-Fi. Um sopro contínuo ao ouvido (fichas 10 e 22)."},"dsss":{"t":"Espetro espalhado (DSSS): GPS, Wi-Fi 802.11b","h":"Os dados são misturados com um código muito rápido: a energia espalha-se por uma grande largura.","l":"Uma bossa larga, mal acima do ruído; o GPS está mesmo abaixo do ruído e não se vê sem tratamento (fichas 22 e 23)."},"hline":{"nm":"Risca do hidrogénio","sh":"1420 MHz","t":"Risca do hidrogénio de 21 cm (1420,405 MHz)","h":"O hidrogénio frio da Via Láctea emite um sopro muito fraco em 1420,405 MHz. O movimento dos braços da galáxia desloca-o por efeito Doppler: veem-se várias pequenas bossas.","l":"Quase nada na cascata de um segundo para o outro: é preciso fazer a média durante muito tempo para ver as bossas saírem do ruído. Aqui, olha para o espetro médio com a reprodução parada. Basta uma parabólica ou uma corneta, um pré-amplificador e uma pen SDR.","n":"sinal muito exagerado"},"sun":{"nm":"Sol","sh":"explosões","t":"Sol: explosões rádio do tipo III","h":"Eletrões lançados por uma erupção atravessam a coroa solar e fazem-na emitir cada vez mais baixo em frequência à medida que se afastam.","l":"Traços que caem na diagonal de cima para baixo do espetro em menos de um segundo, sobre um fundo de ruído solar; um «chhhh» que cresce. De cerca de 10 a 400 MHz, também em onda curta perto de 20 MHz."},"jupiter":{"nm":"Júpiter","sh":"20 MHz","t":"Júpiter: explosões decamétricas (L e S)","h":"O campo magnético de Júpiter e a sua lua Io produzem emissões fortes entre 15 e 40 MHz: explosões L lentas e explosões S muito curtas que descem depressa.","l":"Primeiro ondas de sopro (L, como a rebentação), depois séries de pequenos «pops» (S) em diagonais apertadas. Perto de 20,1 MHz à noite, com um simples dipolo, quando Io está bem colocada."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Uma estrela de neutrões em rotação varre a Terra com um feixe rádio, aqui a cada 0,714 s. O gás interestelar atrasa as frequências baixas: cada impulso chega primeiro ao topo do espetro.","l":"Um «tique» regular; na cascata, cada impulso é uma curva que desce (dispersão). O sinal real está abaixo do ruído: é preciso uma grande antena e somar os impulsos sobre o seu período.","n":"sinal muito exagerado"},"meteor":{"nm":"Meteoros","sh":"GRAVES","t":"Ecos de meteoros do radar GRAVES (143,050 MHz)","h":"O radar francês GRAVES emite sem parar em 143,050 MHz. Quando uma estrela cadente ioniza o ar, o seu rasto devolve um pouco desse sinal ao teu recetor, de uma fração de segundo a alguns segundos.","l":"Em USB em 143,049 MHz: «pings» curtos perto de 1000 Hz, às vezes um eco que desliza (a cabeça do meteoro, efeito Doppler) ou que dura. Muitos mais durante as chuvas de meteoros (Perseidas, Geminídeas) (ficha 1)."},"whistler":{"nm":"Assobios","sh":"VLF","t":"Assobios VLF (whistlers)","h":"Um relâmpago cria um estalo rádio; parte dele segue as linhas do campo magnético da Terra até ao outro hemisfério e volta, os agudos primeiro.","l":"Um «fiuuu» que desce do agudo ao grave em um ou dois segundos, logo após um estalo; estalidos (sferics) por todo o lado. Abaixo de 10 kHz, com um recetor VLF longe das linhas elétricas."},"chorus":{"nm":"Coro da madrugada","sh":"VLF","t":"Coro da madrugada (dawn chorus)","h":"Durante uma tempestade magnética, eletrões presos na magnetosfera emitem pequenas notas ascendentes, sobretudo ao nascer do sol.","l":"Chilreios ascendentes que se sobrepõem, como pássaros, de 1 a 4 kHz aproximadamente. O mesmo equipamento que para os assobios."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"O primeiro satélite artificial emitia bips de cerca de 0,3 s em 20,005 e 40,002 MHz, alternadamente, durante três semanas.","l":"Um traço cortado com regularidade: «bip… bip…», o som que o mundo inteiro ouviu em outubro de 1957 (reconstituição)."},"doppler":{"nm":"Efeito Doppler","sh":"satélite","t":"Baliza de satélite e efeito Doppler","h":"Um satélite em órbita baixa aproxima-se e depois afasta-se: a frequência recebida desce durante a passagem, cerca de ±3 kHz em 145 MHz e ±10 kHz em 435 MHz.","l":"Um traço que desce em forma de S: devagar ao início, depressa quando o satélite passa mais perto, e de novo devagar (ficha 34).","n":"passagem de 10 min reduzida a 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satélites NOAA: imagens APT (histórico)","h":"Uma subportadora de 2400 Hz modulada em amplitude pela imagem, duas linhas por segundo, com um impulso de sincronismo no início de cada linha. Desligado em 2025; hoje os Meteor-M emitem em LRPT.","l":"Um traço em 2400 Hz com bandas laterais que mudam com a imagem, e o famoso «tique-taque» duas vezes por segundo (ficha 34)."},"eme":{"nm":"Eco da Lua","sh":"EME","t":"Eco da Lua (EME)","h":"Um sinal enviado para a Lua volta cerca de 2,5 s depois, enormemente enfraquecido, um pouco alargado e deslocado pelo Doppler.","l":"Ouve-se o próprio «bip» e, 2,5 s depois, o seu eco fraco e um pouco desfocado. Os radioamadores fazem-no em CW ou JT65, a partir de 144 MHz (ficha 1).","n":"eco muito exagerado"},"msk144":{"nm":"MSK144","sh":"meteoros","t":"MSK144: o modo digital dos meteoros","h":"Dois tons, 1000 e 2000 Hz, a 2000 bauds, em tramas de 72 ms repetidas sem parar: cada rasto de meteoro deixa passar algumas.","l":"Rajadas de 0,1 a 1 s, com cerca de 2,4 kHz de largura, que aparecem e se apagam com o «ping» do meteoro. Em 50 e 144 MHz, com o WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tons","t":"JT65: 65 tons, muito lento","h":"Um tom de sincronismo e 64 tons de dados afastados 2,7 Hz (JT65A), 0,37 s por símbolo, 47 s de emissão por minuto.","l":"Uma escada de pequenos traços em cerca de 180 Hz, com um traço de sincronismo que volta sempre ao mesmo sítio. Usado para o ressalto lunar (JT65B e C) e sinais muito fracos.","n":"excerto de 20 s (uma emissão dura 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: rede digital profissional","h":"Modulação de fase π/4-DQPSK a 18 000 símbolos por segundo, quatro canais partilhados no tempo, em canais de 25 kHz.","l":"Um bloco cheio de flancos arredondados, sempre presente perto de uma estação de base; um sopro rouco. Cifrado: não se pode ouvir (ficha 38).","n":"escala reduzida"},"ndb":{"nm":"Radiofarol NDB","sh":"190–535 kHz","t":"NDB: radiofarol não direcional","h":"Uma portadora fixa em onda longa, com um indicativo Morse de duas ou três letras enviado num tom (muitas vezes 1020 Hz).","l":"Um traço fixo ao centro e, durante o indicativo, dois pequenos traços de cada lado. De cerca de 190 a 535 kHz, em BLU ou CW (ficha 10)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: radiofarol omnidirecional","h":"Em AM: um sinal de 30 Hz que depende da direção, uma subportadora de 9960 Hz modulada em frequência a 30 Hz (a referência) e o indicativo Morse em 1020 Hz.","l":"No som desmodulado: um zumbido grave de 30 Hz, um traço largo ondulante perto de 10 kHz e o indicativo de vez em quando (ficha 15).","n":"som desmodulado, escala ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: guiamento na aterragem (localizer)","h":"Em AM, dois tons de 90 e 150 Hz; a sua relação diz ao avião se está à esquerda ou à direita do eixo. O indicativo Morse começa por I.","l":"No som desmodulado: dois traços muito graves em 90 e 150 Hz e o indicativo em 1020 Hz. Entre 108,1 e 112 MHz; a rampa de descida está perto de 330 MHz (ficha 15)."},"m10":{"nm":"Sondas M10 / M20","sh":"Meteomodem","t":"Radiossondas M10 e M20 (Meteomodem)","h":"Uma trama por segundo em FSK rápida (cerca de 9600 bauds): mais larga do que a RS41. Lançadas em França pela Météo-France.","l":"Uma rajada larga a cada segundo, que deriva devagar durante o voo; entre 400 e 406 MHz (ficha 18)."},"tpms":{"nm":"Pneus (TPMS)","sh":"433 MHz","t":"Sensores de pressão dos pneus (TPMS)","h":"Cada roda envia de vez em quando uma rajada FSK de poucos milissegundos: pressão, temperatura, identificador.","l":"Pequenas rajadas isoladas em 433,92 MHz (ou 315 MHz), muitas vezes aos pares, quando passa um carro. Descodificadas pelo rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Sinal horário ALS162 (Allouis, 162 kHz)","h":"A portadora da antiga onda longa da France Inter; a hora é codificada por pequenas modulações de fase, inaudíveis.","l":"Um traço fixo, muito forte em França, mal alargado no início de cada segundo; é preciso um descodificador para ler a hora (ficha 10)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Sinal horário WWV (Colorado)","h":"Em AM: um «tique» de 5 ms a 1000 Hz a cada segundo, um tom de 500 ou 600 Hz, um código horário em 100 Hz e uma voz que anuncia a hora UTC.","l":"No som desmodulado: um traço em 500 Hz cortado a cada segundo, o tique em 1000 Hz e o código lá em baixo em 100 Hz (ficha 10)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Sinal horário MSF (Anthorn, 60 kHz)","h":"A portadora é cortada no início de cada segundo durante 0,1, 0,2 ou 0,3 s conforme os bits, e 0,5 s para marcar o minuto.","l":"Um traço fixo com buracos totalmente pretos a cada segundo, mais longos do que no DCF77 (ficha 10)."},"type2":{"nm":"Sol tipo II","sh":"onda de choque","t":"Sol: explosões rádio do tipo II","h":"A onda de choque de uma ejeção de massa coronal faz o plasma emitir cada vez mais baixo, devagar, muitas vezes em duas bandas (a fundamental e o seu dobro).","l":"Duas bandas de ruído paralelas que descem suavemente durante vários minutos. Compara com as do tipo III, muito mais rápidas.","n":"vários minutos reduzidos a 6 s"},"tweeks":{"nm":"Tweeks","sh":"VLF","t":"Tweeks: os «pings» noturnos em VLF","h":"De noite, o estalo de um relâmpago distante ressalta entre o solo e a ionosfera; as frequências perto do corte (cerca de 1,7 kHz) chegam por último.","l":"Um pequeno «ping» que desce e para perto de 1,7 kHz, às vezes com um eco no dobro; estalidos por todo o lado. Abaixo de 10 kHz, de noite."},"hiss":{"nm":"Sopro VLF","sh":"hiss","t":"Sopro VLF (hiss)","h":"Um ruído largo produzido pelos eletrões da plasmasfera, que sobe e desce com a atividade magnética.","l":"Uma banda de sopro de algumas centenas de Hz a alguns kHz, sem padrão, que cresce e decai devagar."},"aurora":{"nm":"Aurora rádio","sh":"Au","t":"Propagação auroral (Au)","h":"Uma aurora boreal reflete as ondas VHF, mas agita-as muito depressa: cada sinal fica espalhado por várias centenas de Hz.","l":"O CW torna-se um sopro áspero, como sussurrado; já não se ouve a nota. Em 50 e 144 MHz, apontando para norte durante as tempestades magnéticas."},"galactic":{"nm":"Ruído galáctico","sh":"20–40 MHz","t":"Ruído da Via Láctea","h":"O centro da galáxia emite um sopro rádio que Karl Jansky descobriu em 1932 perto de 20 MHz. Sobe e desce com a rotação da Terra.","l":"Um ruído de fundo que sobe devagar e volta a descer, cada dia cerca de 4 minutos mais cedo. Visível com um simples dipolo entre 20 e 40 MHz.","n":"um dia reduzido a 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"Telemetria de CubeSat","h":"Os pequenos satélites enviam regularmente as suas medidas (bateria, temperaturas) em FSK ou GMSK a 1200 ou 9600 bauds, perto de 435–438 MHz.","l":"Rajadas regulares que descem um pouco de cada vez, por efeito Doppler, durante a passagem (ficha 34).","n":"escala reduzida, passagem acelerada"},"issfm":{"nm":"ISS em FM","sh":"145,800 MHz","t":"Estação espacial (ISS): voz em FM","h":"Os astronautas falam com escolas e radioamadores em FM em 145,800 MHz. A estação voa a 28 000 km/h: a frequência recebida desce cerca de 3,5 kHz durante a passagem.","l":"Uma banda de voz FM que se desloca devagar da direita para a esquerda durante os 10 minutos da passagem (ficha 34).","n":"passagem de 10 min reduzida a 10 s"},"buzzer":{"nm":"UVB-76 «The Buzzer»","sh":"4625 kHz","t":"UVB-76, «The Buzzer» (4625 kHz)","h":"Uma estação militar russa que emite há décadas um zumbido de cerca de um segundo, umas 25 vezes por minuto, por vezes interrompido por uma mensagem de voz.","l":"Uma portadora fixa e, em cada zumbido, uma coluna de riscas apertadas de cima a baixo. Fácil de encontrar em 4625 kHz em USB."},"pip":{"nm":"«The Pip»","sh":"3756 / 5448 kHz","t":"«The Pip»: bips sem fim","h":"Outra baliza militar russa de onda curta, que repete pequenos bips curtos dia e noite, por vezes interrompidos por mensagens.","l":"Um traço fixo cortado em pontos muito apertados; ao ouvido, um pip-pip-pip rápido que nunca para.","n":"ritmo aproximado"},"squeaky":{"nm":"«Squeaky Wheel»","sh":"OC","t":"«Squeaky Wheel»: a roda que chia","h":"Uma baliza militar russa de onda curta, batizada pelos ouvintes segundo o seu padrão sonoro repetido.","l":"Um pequeno padrão de dois sons, um deles a subir, repetido em ciclo: como uma roda que chia.","n":"imitação aproximada"},"codar":{"nm":"CODAR","sh":"radar oceânico","t":"CODAR: radares das correntes marinhas","h":"Radares costeiros varrem uma banda de frequências uma ou duas vezes por segundo para medir correntes e ondas.","l":"Diagonais paralelas regulares e um «swish» repetido; perto de 4,5–5,5 MHz, 13 MHz e 25 MHz, muitas vezes dia e noite.","n":"escala reduzida"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Modem militar STANAG 4285","h":"Modulação de fase 8-PSK a 2400 bauds numa portadora de 1800 Hz, com uma sequência de teste a cada 107 ms para seguir o canal.","l":"Um bloco cheio de cerca de 3 kHz; ao ouvido, um sopro com um zumbido regular (ficha 35 bis)."},"link11":{"nm":"Link-11","sh":"16 tons","t":"Link-11: ligação de dados naval","h":"Dezasseis tons de 605 a 2915 Hz emitidos em conjunto, cada um modulado em fase 75 vezes por segundo.","l":"Um pente de riscas regulares em 2,3 kHz, mais uma risca um pouco à parte; ao ouvido, um zumbido musical (ficha 35 bis)."},"numbers":{"nm":"Estação de números","sh":"voz","t":"Estação de números","h":"A uma hora fixa, uma pequena melodia de chamada e depois uma voz (muitas vezes sintética) que lê grupos de cinco algarismos, em AM ou BLU.","l":"A melodia em notas soltas e depois grupos regulares de sílabas separados por silêncios (ficha 35 bis).","n":"voz imitada, sem algarismos reais"}}},"it":{"ui":{"title":"Identificatore di modi radio","mystery":"Suono misterioso","play":"▶ Ascolta","stop":"■ Stop","noise":"Rumore","volume":"Volume","loop":"Ripeti","specwf":"Spettro + Cascata","cursor":"cursore","footprint":"Impronta","dur":"{s} s dall'alto in basso","avg":"media su tutto il segnale","press":"Premi Ascolta: il segnale scorre qui","count":"{n} segnali, nell'ordine della scheda 5 bis","myst":"Modo misterioso","mystTags":"Ascolta e guarda, poi scegli la risposta giusta","quizH":"Che segnale è?","quizLead":"Avvia l'ascolto, osserva lo spettro, la cascata e l'impronta, poi rispondi.","score":"Punteggio","good":"Giusto!","bad":"Sbagliato: era {x}.","next":"Prossimo suono misterioso","principle":"Principio","screen":"Sullo schermo","sheet":"scheda","book":"Libro: scheda {r}","lang":"Lingua","signals":"Segnali","f1":"Segnali simulati nella pagina (12 000 campioni al secondo), secondo i segnali della scheda 5 bis del libro OpenBookRadio, più Olivia, FT4 e Feld Hell (scheda 26). Per i segnali radio (AM, FM, AIS, LoRa…) si vede la frequenza intermedia simulata, come sullo schermo di un SDR; alcuni sono in scala ridotta o accelerata, come indicato.","f2":"Il tempo scende nella cascata e nell'impronta. Licenza CC BY-NC-SA 4.0, gratuito, non vendere.","night":"Modo notte","day":"Modo giorno"},"groups":["Voce analogica","Telegrafia","Dati","Immagini","Aviazione, marina e soccorso","Chiamata, subtoni e cercapersone","Radiosonde, sensori e oggetti connessi","Modi HF e curiosità","Radiodiffusione e ora","Banda larga","Bonus: suoni dallo spazio","Bonus: curiosità delle onde corte"],"modes":{"am":{"sh":"voce","t":"AM: modulazione di ampiezza","h":"La forza della portante segue il suono: la curva si «gonfia» e si «sgonfia».","l":"Una riga fissa al centro (la portante), con due bande laterali uguali ai lati. Circa 6-9 kHz di larghezza. Radio in onde corte e medie, aviazione (schede 10 e 12)."},"ssb":{"t":"SSB: banda laterale unica","h":"Resta una sola banda laterale, senza portante: niente quando nessuno parla.","l":"Nessuna riga centrale, una sola banda di circa 2,7 kHz che vive solo quando si parla. USB sopra 10 MHz, LSB sotto (radioamatori). Sintonizzata male, la voce sembra una «papera» (schede 9 e 26)."},"fm":{"sh":"voce","t":"FM: modulazione di frequenza","h":"L'ampiezza resta fissa; sono le oscillazioni che si stringono o si allargano con il suono.","l":"Il segnale danza intorno alla sua frequenza, più largo quando il suono è forte: 12,5 kHz per canale in FM stretta (walkie-talkie, ponti), 200 kHz nella radio FM (schede 2 e 11)."},"cw":{"t":"CW: Morse","h":"La portante si accende e si spegne: linee e punti.","l":"Una riga sottilissima che si interrompe al ritmo del Morse; un bip all'orecchio. Qui «CQ» (scheda 39).","r":[["Velocità","20 parole/min, punto di 60 ms, a 700 Hz: «CQ CQ CQ DE F4ABC K»"],["A orecchio","Bip puri, lunghi e corti, su una sola nota"],["Decodifica","A orecchio, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: due frequenze","h":"La frequenza salta tra due valori, uno per 0 e uno per 1.","l":"Due righe parallele: 170 Hz di distanza per i radioamatori (45,45 baud), 450 o 850 Hz per i bollettini meteo. Un «tidilidi» regolare (scheda 27).","r":[["Codice","Baudot ITA2: 5 bit + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Testo","RYRYRYRY CQ CQ DE F4ABC"],["Decodifica","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 baud: APRS e packet","h":"Due toni audio, 1200 e 2200 Hz, inviati in un trasmettitore FM.","l":"Visto dopo il ricevitore FM (suono dell'altoparlante): una banda da 1200 a 2200 Hz, a raffiche brevi. All'orecchio, un «grrrt» di un secondo (schede 29 e 30).","r":[["Frequenza","144,800 MHz in Europa (APRS), FM"],["Trama","Flag 0x7E poi dati AX.25 in NRZI"],["Decodifica","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"t":"PSK31: modulazione di fase","h":"La frequenza non si muove, è la fase che si inverte; l'ampiezza cala a ogni inversione.","l":"Una riga sottilissima di circa 60 Hz, un po' «intrecciata». Decine di stazioni stanno in 3 kHz (scheda 26).","r":[["Codice","Varicode: 0 = inversione di fase, 1 = nessun cambio; a riposo, due righe gemelle"],["Dove ascoltarlo","14 070 kHz, 3580 kHz"],["Decodifica","fldigi"]]},"ft8":{"t":"MFSK / FT8: otto toni","h":"La frequenza sale e scende a gradini di 6,25 Hz, 0,16 s per gradino.","l":"Bande di circa 50 Hz che durano 12,6 s e tornano ogni 15 s, sincronizzate sull'ora: più stazioni insieme in 3 kHz, per esempio su 7,074 MHz (scheda 26).","r":[["Trama","79 simboli di 0,16 s, tre schemi Costas (inizio, metà, fine); qui otto stazioni"],["Frequenze","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Decodifica","WSJT-X, JTDX (ora del PC esatta)"]]},"ft4":{"t":"FT4: l'FT8 dei contest","h":"Quattro toni distanti 20,8 Hz, 20,8 baud: 105 simboli in 5 s, a turni di 7,5 s.","l":"Bande di circa 90 Hz, più corte e larghe dell'FT8, che tornano ogni 7,5 s. 14 080, 7047,5 kHz (scheda 26)."},"olivia":{"t":"Olivia 8/250: otto toni","h":"Otto toni distanti 31,25 Hz, uno alla volta, che saltano a caso; codifica Walsh e interleaving.","l":"Un blocco di punti sparsi su 250 Hz; decodifica molto sotto il rumore. Una piccola melodia casuale all'orecchio (scheda 26)."},"hell":{"t":"Feld Hell: scrivere con una portante","h":"La portante si accende e si spegne punto per punto: ogni lettera è fatta di colonne di 14 punti, scandite dal basso in alto (245 punti al secondo).","l":"Nella cascata, una riga spezzettata; è lo schermo del programma (fldigi) che ridisegna le lettere. Un crepitio leggero all'orecchio (scheda 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Quattro livelli di frequenza: ogni simbolo porta due bit.","l":"Un blocco rettangolare da 6 a 12,5 kHz, pieno come rumore, spesso a raffiche (il DMR divide il canale in due slot). Un «frrr» rauco all'orecchio (scheda 38)."},"mt63":{"t":"MT63: messaggi di emergenza (NBEMS)","h":"64 toni contemporaneamente, ognuno modulato lentamente, con molta ridondanza.","l":"Un blocco piatto di 1 o 2 kHz centrato su 1500 Hz, con bordi netti; un soffio regolare. Passa persino da un microfono appoggiato a un altoparlante (scheda 26 ter)."},"lora":{"t":"LoRa: rampe di frequenza (chirp)","h":"La frequenza spazza tutta la larghezza e riparte dal basso: la posizione del salto porta i dati.","l":"Diagonali parallele, facili da riconoscere: Meshtastic e MeshCore su 869,525 MHz o 433 MHz, sensori LoRaWAN (schede 11, 20 e 21)."},"sstv":{"t":"SSTV: immagini in audio","h":"Un impulso di sincronismo a 1200 Hz, poi la frequenza segue la luminosità della riga, da 1500 (nero) a 2300 Hz (bianco).","l":"Righe di sincronismo regolari e una nuvola che cambia con l'immagine; un suono che «cinguetta» per uno o due minuti. 14,230 MHz, ISS su 145,800 MHz (scheda 31).","r":[["Trama","Intestazione VIS, poi righe: sincronismo 1200 Hz, verde, blu, rosso; qui 20 righe di un monoscopio"],["Decodifica","QSSTV, MMSSTV, Robot36 sullo smartphone"]]},"fax":{"nm":"Fax meteo","t":"Fax meteo: 1500 Hz nero, 2300 Hz bianco","h":"La frequenza passa dal nero al bianco in modo continuo, 120 righe al minuto.","l":"Due bande fisse a 1500 e 2300 Hz (800 Hz di distanza), un «tic-tac» regolare. Le frequenze pubblicate sono quelle della portante: ascolta in USB 1,9 kHz più in basso (scheda 32).","r":[["Trama","Tono di avvio a 300 Hz, righe di fasatura (impulso bianco), poi la carta"],["Decodifica","fldigi, JWX, HamFax"]]},"elt":{"nm":"Sirena ELT","t":"Sirena ELT / PLB su 121,5 MHz","h":"Un'AM il cui tono scende da 1600 a 300 Hz, da due a quattro volte al secondo.","l":"Una portante fissa e bande laterali che scivolano a ventaglio: l'«uu-uu» dei radiofari di soccorso, anche su 121,375 MHz per le esercitazioni (schede 24 e 25)."},"406":{"nm":"Radiofaro 406","t":"Radiofaro 406 MHz: raffica BPSK","h":"Mezzo secondo di trasmissione: 160 ms di portante pura, poi la fase oscilla di ±1,1 radianti a 400 bit/s.","l":"Un trattino breve che torna ogni 50 s, tra 406,0 e 406,1 MHz; niente di utile da ascoltare, serve un decodificatore (EPIRB 406, scheda 25)."},"adsb":{"t":"ADS-B / modo S (1090 MHz): impulsi","h":"Impulsi di 0,5 µs la cui posizione porta i bit (PPM); qui la scala del tempo è molto rallentata.","l":"Trattini orizzontali brevissimi su tutta la larghezza, centinaia al secondo vicino a un aeroporto; serve una chiavetta SDR (scheda 13).","n":"scala del tempo molto rallentata"},"acars":{"t":"ACARS: AM e dati MSK","h":"Un'AM che trasporta due toni, 1200 e 2400 Hz, a 2400 bit/s.","l":"Raffiche di mezzo secondo con portante e bande laterali, su 131,525, 131,725 o 131,825 MHz in Europa: un «brrrt» all'orecchio (scheda 14)."},"ais":{"t":"AIS: GMSK 9600 baud su due canali","h":"Una FSK ammorbidita (GMSK) a raffiche di 26 ms, una volta su 161,975 MHz, una volta su 162,025 MHz (scala ridotta).","l":"Due colonne di trattini brevi, a 50 kHz di distanza, uno schiocco regolare; più navi ci sono, più è fitto (scheda 16).","n":"scala ridotta"},"navtex":{"t":"NAVTEX e DSC in onde medie e corte: FSK 170 Hz","h":"Come l'RTTY: due frequenze a 170 Hz, ma a 100 baud.","l":"Due righe parallele continue durante il bollettino, su 518 e 490 kHz (NAVTEX) o 2187,5 kHz (chiamata selettiva digitale) (scheda 17).","r":[["Codice","SITOR-B, CCIR 476: 7 bit con quattro «1», con ripetizione FEC"],["Decodifica","fldigi, YaND"]]},"hfdl":{"t":"HFDL: gli aerei in onde corte","h":"Una PSK a 1800 baud su una sottoportante di 1440 Hz.","l":"Raffiche di circa 2,4 kHz tra 2,9 e 22 MHz; un fruscio da modem che va e viene (scheda 14 bis)."},"ctcss":{"t":"CTCSS: subtono sotto la voce","h":"Un tono grave e continuo (da 67 a 254 Hz, qui 88,5 Hz) aggiunto alla voce.","l":"Visto nel suono del ricevitore FM: una riga fissa in fondo, sotto la voce; apre lo squelch di ponti e walkie-talkie (scheda 8)."},"dtmf":{"sh":"2 toni","t":"DTMF: due toni per tasto","h":"Ogni tasto invia contemporaneamente un tono grave (697-941 Hz) e uno acuto (1209-1633 Hz).","l":"Coppie di punti allineati su otto colonne fisse; il «bip-bip» dei numeri di telefono e dei comandi dei ponti (scheda 8).","r":[["Sequenza","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 toni","t":"Selcall CCIR: toni in sequenza","h":"Cinque toni di 100 ms uno dopo l'altro, uno per cifra.","l":"Una piccola scala di punti, ripetuta; un «tululululu» rapido per chiamare una radio precisa (scheda 28).","r":[["Sequenza","1 2 3 4 5, due volte; decodificata anche dall'app SelCall dell'UV-K1"]]},"pocsag":{"sh":"cercapersone","t":"POCSAG e FLEX: cercapersone","h":"Una FSK a ±4,5 kHz; un preambolo 1010… poi i dati (scala ridotta).","l":"Due righe nette durante il preambolo, poi una banda piena; un «brrrrt» stridente. 466,075 MHz, DAPNET 439,9875 MHz (scheda 37).","n":"scala ridotta"},"ale":{"sh":"8 toni","t":"ALE: chiamata automatica in onde corte","h":"Otto toni da 750 a 2500 Hz, 125 baud, a raffiche.","l":"Un blocco di circa 2 kHz fatto di puntini, uno o due secondi, a volte su più frequenze vicine; un cinguettio acuto (scheda 28 bis)."},"rs41":{"nm":"Radiosonda RS41","t":"Radiosonda RS41: GFSK continua","h":"Una FSK ammorbidita a 4800 baud, senza sosta; la frequenza deriva lentamente quando la sonda sale e si raffredda.","l":"Una banda di circa 10 kHz che scivola in diagonale per tutto il volo, tra 400 e 406 MHz (scheda 18)."},"ook":{"nm":"Sensori 433","t":"Sensori 433 MHz: OOK","h":"La portante si accende e si spegne a impulsi brevi o lunghi (tutto o niente); il messaggio è ripetuto tre volte.","l":"Raffiche di puntini, spesso tripli, su 433,92 MHz: stazioni meteo, sonde di temperatura, telecomandi (scheda 19)."},"fhss":{"t":"Bluetooth: salti di frequenza (FHSS)","h":"La frequenza cambia 1600 volte al secondo tra 79 canali (scala ridotta).","l":"Trattini sparsi ovunque su 80 MHz, mai nello stesso posto, intorno a 2,4 GHz (scheda 22).","n":"scala ridotta"},"wspr":{"t":"WSPR: radiofari di propagazione","h":"Quattro toni distanti 1,46 Hz, 0,68 s per simbolo, per 110,6 s.","l":"Una riga sottilissima di circa 6 Hz che dura quasi due minuti, ogni due minuti pari: bisogna ingrandire molto (scheda 26).","n":"estratto di 24 s (una trasmissione dura 110,6 s)"},"qrss":{"t":"QRSS: Morse lentissimo","h":"Una portante accesa e spenta, con punti da 3 a 10 s, spesso su due frequenze vicine (DFCW).","l":"Righe larghe pochi Hz, lette su uno schermo di dieci minuti; non udibile (scheda 26 bis).","n":"accelerato: punto di 0,6 s invece di 3-10 s"},"texte":{"nm":"Testo nella cascata","t":"Testo nella cascata","h":"Ogni riga di un'immagine diventa un gruppo di toni: il suono sembra rumore.","l":"Il testo o il disegno appare direttamente sullo schermo dell'SDR (scheda 33).","r":[["Nota","Trasmesso dal basso dell'immagine: dritto nella cascata dal vivo, capovolto nell'impronta (letta dall'alto in basso)"]]},"vara":{"t":"Dati HF moderni: VARA, Pactor, ARDOP","h":"Lunghe raffiche piene (OFDM o PSK) e, tra una e l'altra, brevi risposte dell'altra stazione.","l":"Un rettangolo di circa 2,4 kHz che si ferma e riparte, con una piccola conferma in mezzo; un fruscio spezzettato (scheda 26)."},"chirp":{"nm":"Ionosonda","t":"Ionosonda (chirp sounder)","h":"Una rampa di frequenza lenta che attraversa tutta la banda HF; gli echi della ionosfera arrivano poco dopo.","l":"Una diagonale che spazza lo schermo, affiancata da righe parallele (gli echi); un «ffuit» che passa in una frazione di secondo."},"oth":{"nm":"Radar oltre l'orizzonte","t":"Radar oltre l'orizzonte («woodpecker»)","h":"Impulsi ripetuti da 10 a 50 volte al secondo, ognuno largo diversi kHz.","l":"Un blocco largo e striato che copre bande intere; un picchiettio da picchio molto regolare in onde corte."},"parasites":{"nm":"Disturbi","sh":"alimentatore","t":"Disturbi di un alimentatore switching","h":"Un'onda quadra: la sua frequenza e tutte le armoniche escono insieme.","l":"Un pettine di righe regolari che derivano insieme su un fondo di rumore: cercalo con NOISE FIND o un ricevitore portatile (scheda K21b)."},"mpx":{"nm":"FM stereo e RDS","t":"Radio FM stereo e RDS","h":"Il suono demodulato (multiplex) contiene il canale L+R, un pilota a 19 kHz, il canale L-R intorno a 38 kHz e l'RDS a 57 kHz.","l":"Visto da 0 a 60 kHz dopo la demodulazione: un blocco basso, una riga sottile a 19 kHz, un blocco più debole al centro e l'RDS in cima (scheda 10).","n":"scala ÷ 20 per l'ascolto"},"dcf77":{"t":"Segnale orario DCF77 (77,5 kHz)","h":"Una portante che scende al 15 % per 0,1 s (bit 0) o 0,2 s (bit 1), all'inizio di ogni secondo.","l":"Una riga fissa con un buco nero ogni secondo; il 59° secondo non ce l'ha, per segnare il minuto (scheda 10).","r":[["Nota","Qui la portante è portata a 1000 Hz; il 6° secondo non ha buco, come il 59° secondo di ogni minuto"]]},"ofdm":{"t":"OFDM: decine di sottoportanti","h":"Molte portanti fittissime, ognuna lenta: la somma sembra rumore.","l":"Un rettangolo piatto dai bordi netti, sempre presente: DRM in onde corte (10 kHz), DAB+ (1,5 MHz), DVB-T, Wi-Fi. Un soffio continuo all'orecchio (schede 10 e 22)."},"dsss":{"t":"Spettro espanso (DSSS): GPS, Wi-Fi 802.11b","h":"I dati sono mescolati con un codice velocissimo: l'energia si spande su una grande larghezza.","l":"Una gobba larga, appena sopra il rumore; il GPS è persino sotto il rumore e non si vede senza elaborazione (schede 22 e 23)."},"hline":{"nm":"Riga dell'idrogeno","sh":"1420 MHz","t":"Riga dell'idrogeno a 21 cm (1420,405 MHz)","h":"L'idrogeno freddo della Via Lattea emette un soffio debolissimo su 1420,405 MHz. Il moto dei bracci della galassia lo sposta per effetto Doppler: si vedono alcune piccole gobbe.","l":"Quasi nulla nella cascata da un secondo all'altro: bisogna fare la media a lungo per veder emergere le gobbe dal rumore. Qui guarda lo spettro medio a riproduzione ferma. Bastano una parabola o una tromba, un preamplificatore e una chiavetta SDR.","n":"segnale molto esagerato"},"sun":{"nm":"Sole","sh":"burst","t":"Sole: burst radio di tipo III","h":"Elettroni lanciati da un brillamento attraversano la corona solare e la fanno emettere sempre più in basso in frequenza man mano che si allontanano.","l":"Righe che cadono in diagonale dall'alto al basso dello spettro in meno di un secondo, su un fondo di rumore solare; un «shhhh» che cresce. Da circa 10 a 400 MHz, anche in onde corte verso 20 MHz."},"jupiter":{"nm":"Giove","sh":"20 MHz","t":"Giove: burst decametrici (L e S)","h":"Il campo magnetico di Giove e la sua luna Io producono emissioni potenti tra 15 e 40 MHz: burst L lenti e burst S brevissimi che scivolano rapidi verso il basso.","l":"Prima onde di soffio (L, come la risacca), poi raffiche di piccoli «pop» (S) in diagonali fitte. Verso 20,1 MHz di notte, con un semplice dipolo, quando Io è ben posizionata."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Una stella di neutroni che ruota spazza la Terra con un fascio radio, qui ogni 0,714 s. Il gas interstellare ritarda le frequenze basse: ogni impulso arriva prima in cima allo spettro.","l":"Un «tic» regolare; nella cascata ogni impulso è una curva che scende (dispersione). Il segnale vero è sotto il rumore: servono una grande antenna e la somma degli impulsi sul loro periodo.","n":"segnale molto esagerato"},"meteor":{"nm":"Meteore","sh":"GRAVES","t":"Echi di meteore dal radar GRAVES (143,050 MHz)","h":"Il radar francese GRAVES trasmette senza sosta su 143,050 MHz. Quando una stella cadente ionizza l'aria, la sua scia rimanda un po' di quel segnale al tuo ricevitore, da una frazione di secondo a qualche secondo.","l":"In USB su 143,049 MHz: brevi «ping» intorno a 1000 Hz, a volte un eco che scivola (la testa della meteora, effetto Doppler) o che dura. Molti di più durante gli sciami (Perseidi, Geminidi) (scheda 1)."},"whistler":{"nm":"Fischi","sh":"VLF","t":"Fischi VLF (whistler)","h":"Un fulmine crea uno schiocco radio; una parte segue le linee del campo magnetico terrestre fino all'altro emisfero e torna, gli acuti per primi.","l":"Un «fiuuu» che scende dall'acuto al grave in uno o due secondi, subito dopo uno schiocco; scricchiolii (sferics) ovunque. Sotto i 10 kHz, con un ricevitore VLF lontano dalle linee elettriche."},"chorus":{"nm":"Coro dell'alba","sh":"VLF","t":"Coro dell'alba (dawn chorus)","h":"Durante una tempesta magnetica, elettroni intrappolati nella magnetosfera emettono piccole note ascendenti, soprattutto all'alba.","l":"Cinguettii ascendenti che si sovrappongono, come uccelli, da circa 1 a 4 kHz. Stessa attrezzatura dei fischi."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"Il primo satellite artificiale emetteva bip di circa 0,3 s su 20,005 e 40,002 MHz, alternandoli, per tre settimane.","l":"Una riga interrotta con regolarità: «bip… bip…», il suono ascoltato da tutto il mondo nell'ottobre 1957 (ricostruzione)."},"doppler":{"nm":"Effetto Doppler","sh":"satellite","t":"Radiofaro di satellite ed effetto Doppler","h":"Un satellite in orbita bassa si avvicina e poi si allontana: la frequenza ricevuta scende durante il passaggio, di circa ±3 kHz a 145 MHz e ±10 kHz a 435 MHz.","l":"Una riga che scende a forma di S: lentamente all'inizio, veloce quando il satellite è più vicino, poi di nuovo lentamente (scheda 34).","n":"passaggio di 10 min ridotto a 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satelliti NOAA: immagini APT (storico)","h":"Una sottoportante di 2400 Hz modulata in ampiezza dall'immagine, due righe al secondo, con un impulso di sincronismo all'inizio di ogni riga. Spento nel 2025; oggi i Meteor-M trasmettono in LRPT.","l":"Una riga a 2400 Hz con bande laterali che cambiano con l'immagine, e il famoso «tic-tac» due volte al secondo (scheda 34)."},"eme":{"nm":"Eco dalla Luna","sh":"EME","t":"Eco dalla Luna (EME)","h":"Un segnale inviato verso la Luna torna circa 2,5 s dopo, enormemente indebolito, un po' allargato e spostato dal Doppler.","l":"Si sente il proprio «bip», poi 2,5 s dopo il suo eco debole e un po' sfocato. I radioamatori lo fanno in CW o JT65, da 144 MHz in su (scheda 1).","n":"eco molto esagerato"},"msk144":{"nm":"MSK144","sh":"meteore","t":"MSK144: il modo digitale delle meteore","h":"Due toni, 1000 e 2000 Hz, a 2000 baud, in trame di 72 ms ripetute senza sosta: ogni scia di meteora ne lascia passare alcune.","l":"Raffiche da 0,1 a 1 s, larghe circa 2,4 kHz, che compaiono e si spengono con il «ping» della meteora. Su 50 e 144 MHz, con WSJT-X."},"jt65":{"nm":"JT65","sh":"65 toni","t":"JT65: 65 toni, lentissimo","h":"Un tono di sincronismo e 64 toni di dati distanti 2,7 Hz (JT65A), 0,37 s per simbolo, 47 s di trasmissione al minuto.","l":"Una scala di trattini su circa 180 Hz, con una riga di sincronismo che torna sempre nello stesso punto. Usato per il rimbalzo lunare (JT65B e C) e segnali debolissimi.","n":"estratto di 20 s (una trasmissione dura 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: rete digitale professionale","h":"Modulazione di fase π/4-DQPSK a 18 000 simboli al secondo, quattro canali a divisione di tempo, in canali da 25 kHz.","l":"Un blocco pieno dai fianchi arrotondati, sempre presente vicino a una stazione base; un soffio rauco. Cifrato: non si può ascoltare (scheda 38).","n":"scala ridotta"},"ndb":{"nm":"Radiofaro NDB","sh":"190–535 kHz","t":"NDB: radiofaro non direzionale","h":"Una portante fissa in onde lunghe, con un nominativo Morse di due o tre lettere inviato su un tono (spesso 1020 Hz).","l":"Una riga fissa al centro e, durante il nominativo, due trattini ai lati. Circa da 190 a 535 kHz, in SSB o CW (scheda 10)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: radiofaro omnidirezionale","h":"In AM: un segnale a 30 Hz che dipende dalla direzione, una sottoportante a 9960 Hz modulata in frequenza a 30 Hz (il riferimento) e il nominativo Morse a 1020 Hz.","l":"Nel suono demodulato: un ronzio grave a 30 Hz, una riga larga e ondulata verso 10 kHz e ogni tanto il nominativo (scheda 15).","n":"suono demodulato, scala ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: guida all'atterraggio (localizer)","h":"In AM, due toni a 90 e 150 Hz; il loro rapporto dice all'aereo se è a sinistra o a destra dell'asse. Il nominativo Morse inizia con I.","l":"Nel suono demodulato: due righe molto basse a 90 e 150 Hz e il nominativo a 1020 Hz. Tra 108,1 e 112 MHz; il sentiero di discesa è verso 330 MHz (scheda 15)."},"m10":{"nm":"Sonde M10 / M20","sh":"Meteomodem","t":"Radiosonde M10 e M20 (Meteomodem)","h":"Una trama al secondo in FSK veloce (circa 9600 baud): più larga della RS41. Lanciate in Francia da Météo-France.","l":"Una raffica larga ogni secondo, che deriva lentamente durante il volo; tra 400 e 406 MHz (scheda 18)."},"tpms":{"nm":"Pneumatici (TPMS)","sh":"433 MHz","t":"Sensori di pressione degli pneumatici (TPMS)","h":"Ogni ruota invia ogni tanto una raffica FSK di pochi millisecondi: pressione, temperatura, identificativo.","l":"Piccole raffiche isolate su 433,92 MHz (o 315 MHz), spesso a coppie, al passaggio di un'auto. Decodificate da rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Segnale orario ALS162 (Allouis, 162 kHz)","h":"La portante delle vecchie onde lunghe di France Inter; l'ora è codificata con piccole modulazioni di fase, inudibili.","l":"Una riga fissa, fortissima in Francia, appena allargata all'inizio di ogni secondo; serve un decodificatore per leggere l'ora (scheda 10)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Segnale orario WWV (Colorado)","h":"In AM: un «tic» di 5 ms a 1000 Hz ogni secondo, un tono a 500 o 600 Hz, un codice orario a 100 Hz e una voce che annuncia l'ora UTC.","l":"Nel suono demodulato: una riga a 500 Hz interrotta ogni secondo, il tic a 1000 Hz e il codice in fondo a 100 Hz (scheda 10)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Segnale orario MSF (Anthorn, 60 kHz)","h":"La portante viene spenta all'inizio di ogni secondo per 0,1, 0,2 o 0,3 s secondo i bit, e per 0,5 s per segnare il minuto.","l":"Una riga fissa con buchi completamente neri ogni secondo, più lunghi che con DCF77 (scheda 10)."},"type2":{"nm":"Sole tipo II","sh":"onda d'urto","t":"Sole: burst radio di tipo II","h":"L'onda d'urto di un'espulsione di massa coronale fa emettere il plasma sempre più in basso, lentamente, spesso in due bande (la fondamentale e il suo doppio).","l":"Due bande di rumore parallele che scendono dolcemente per diversi minuti. Confrontale con i burst di tipo III, molto più rapidi.","n":"diversi minuti ridotti a 6 s"},"tweeks":{"nm":"Tweek","sh":"VLF","t":"Tweek: i «ping» notturni in VLF","h":"Di notte lo schiocco di un fulmine lontano rimbalza tra suolo e ionosfera; le frequenze vicine al taglio (verso 1,7 kHz) arrivano per ultime.","l":"Un piccolo «ping» che scende e si ferma verso 1,7 kHz, a volte con un'eco al doppio; scricchiolii ovunque. Sotto i 10 kHz, di notte."},"hiss":{"nm":"Soffio VLF","sh":"hiss","t":"Soffio VLF (hiss)","h":"Un rumore largo prodotto dagli elettroni della plasmasfera, che sale e scende con l'attività magnetica.","l":"Una banda di soffio da qualche centinaio di Hz a qualche kHz, senza schema, che cresce e cala lentamente."},"aurora":{"nm":"Aurora radio","sh":"Au","t":"Propagazione aurorale (Au)","h":"Un'aurora boreale riflette le onde VHF ma le agita velocissimamente: ogni segnale si spande su alcune centinaia di Hz.","l":"Il CW diventa un soffio ruvido, come sussurrato; non si sente più la nota. Su 50 e 144 MHz, puntando a nord durante le tempeste magnetiche."},"galactic":{"nm":"Rumore galattico","sh":"20–40 MHz","t":"Rumore della Via Lattea","h":"Il centro della galassia emette un soffio radio scoperto da Karl Jansky nel 1932 verso 20 MHz. Sale e scende con la rotazione della Terra.","l":"Un rumore di fondo che sale lentamente e poi ridiscende, ogni giorno circa 4 minuti prima. Visibile con un semplice dipolo tra 20 e 40 MHz.","n":"un giorno ridotto a 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"Telemetria di CubeSat","h":"I piccoli satelliti inviano regolarmente le loro misure (batteria, temperature) in FSK o GMSK a 1200 o 9600 baud, verso 435–438 MHz.","l":"Raffiche regolari che scendono un po' ogni volta, per effetto Doppler, durante il passaggio (scheda 34).","n":"scala ridotta, passaggio accelerato"},"issfm":{"nm":"ISS in FM","sh":"145,800 MHz","t":"Stazione spaziale (ISS): voce in FM","h":"Gli astronauti parlano con scuole e radioamatori in FM su 145,800 MHz. La stazione vola a 28 000 km/h: la frequenza ricevuta scende di circa 3,5 kHz durante il passaggio.","l":"Una banda di voce FM che si sposta lentamente da destra a sinistra durante i 10 minuti del passaggio (scheda 34).","n":"passaggio di 10 min ridotto a 10 s"},"buzzer":{"nm":"UVB-76 «The Buzzer»","sh":"4625 kHz","t":"UVB-76, «The Buzzer» (4625 kHz)","h":"Una stazione militare russa che da decenni trasmette un ronzio di circa un secondo, circa 25 volte al minuto, a volte interrotto da un messaggio vocale.","l":"Una portante fissa e, a ogni ronzio, una colonna di righe fitte dall'alto in basso. Facile da trovare su 4625 kHz in USB."},"pip":{"nm":"«The Pip»","sh":"3756 / 5448 kHz","t":"«The Pip»: bip senza fine","h":"Un altro radiofaro militare russo in onde corte, che ripete piccoli bip brevi giorno e notte, a volte interrotti da messaggi.","l":"Una riga fissa tagliata in puntini fittissimi; all'orecchio, un pip-pip-pip rapido che non si ferma mai.","n":"ritmo approssimato"},"squeaky":{"nm":"«Squeaky Wheel»","sh":"OC","t":"«Squeaky Wheel»: la ruota che cigola","h":"Un radiofaro militare russo in onde corte, battezzato dagli ascoltatori secondo il suo motivo sonoro ripetuto.","l":"Un piccolo motivo di due suoni, uno dei quali sale, ripetuto in loop: come una ruota che cigola.","n":"imitazione approssimata"},"codar":{"nm":"CODAR","sh":"radar oceanico","t":"CODAR: radar delle correnti marine","h":"Radar costieri spazzano una banda di frequenze una o due volte al secondo per misurare correnti e onde.","l":"Diagonali parallele regolari e uno «swish» ripetuto; verso 4,5–5,5 MHz, 13 MHz e 25 MHz, spesso giorno e notte.","n":"scala ridotta"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Modem militare STANAG 4285","h":"Modulazione di fase 8-PSK a 2400 baud su una portante di 1800 Hz, con una sequenza di prova ogni 107 ms per seguire il canale.","l":"Un blocco pieno di circa 3 kHz; all'orecchio, un soffio con un ronzio regolare (scheda 35 bis)."},"link11":{"nm":"Link-11","sh":"16 toni","t":"Link-11: collegamento dati navale","h":"Sedici toni da 605 a 2915 Hz trasmessi insieme, ciascuno modulato in fase 75 volte al secondo.","l":"Un pettine di righe regolari su 2,3 kHz, più una riga un po' a parte; all'orecchio, un ronzio musicale (scheda 35 bis)."},"numbers":{"nm":"Stazione dei numeri","sh":"voce","t":"Stazione dei numeri","h":"A un'ora fissa, una piccola melodia di chiamata, poi una voce (spesso sintetica) legge gruppi di cinque cifre, in AM o SSB.","l":"La melodia a note staccate, poi gruppi regolari di sillabe separati da silenzi (scheda 35 bis).","n":"voce imitata, senza cifre vere"}}},"pl":{"ui":{"title":"Rozpoznawacz emisji radiowych","mystery":"Tajemniczy dźwięk","play":"▶ Słuchaj","stop":"■ Stop","noise":"Szum","volume":"Głośność","loop":"Zapętlaj","specwf":"Widmo + wodospad","cursor":"kursor","footprint":"Odcisk","dur":"{s} s z góry na dół","avg":"średnia z całego sygnału","press":"Naciśnij Słuchaj: sygnał przewija się tutaj","count":"{n} sygnałów, w kolejności karty 5 bis","myst":"Tryb zagadki","mystTags":"Słuchaj i patrz, potem wybierz właściwą odpowiedź","quizH":"Co to za sygnał?","quizLead":"Włącz odsłuch, obserwuj widmo, wodospad i odcisk, potem odpowiedz.","score":"Wynik","good":"Dobrze!","bad":"Pudło: to był {x}.","next":"Następny tajemniczy dźwięk","principle":"Zasada","screen":"Na ekranie","sheet":"karta","book":"Książka: karta {r}","lang":"Język","signals":"Sygnały","f1":"Sygnały symulowane na stronie (12 000 próbek na sekundę), według sygnałów karty 5 bis książki OpenBookRadio, plus Olivia, FT4 i Feld Hell (karta 26). W przypadku sygnałów radiowych (AM, FM, AIS, LoRa…) widać symulowaną częstotliwość pośrednią, jak na ekranie SDR; niektóre są w zmniejszonej skali lub przyspieszone, co jest zaznaczone.","f2":"Czas w wodospadzie i odcisku płynie w dół. Licencja CC BY-NC-SA 4.0, za darmo, nie na sprzedaż.","night":"Tryb nocny","day":"Tryb dzienny"},"groups":["Głos analogowy","Telegrafia","Dane","Obrazy","Lotnictwo, morze i ratownictwo","Wywołanie, podtony i przywoławcze","Radiosondy, czujniki i urządzenia połączone","Emisje KF i ciekawostki","Radiofonia i czas","Szerokie pasmo","Bonus: dźwięki z kosmosu","Bonus: ciekawostki fal krótkich"],"modes":{"am":{"sh":"głos","t":"AM: modulacja amplitudy","h":"Siła nośnej podąża za dźwiękiem: krzywa „puchnie” i „opada”.","l":"Stała kreska pośrodku (nośna) i po obu stronach dwie jednakowe wstęgi boczne. Szerokość około 6–9 kHz. Radiofonia na falach krótkich i średnich, lotnictwo (karty 10 i 12)."},"ssb":{"t":"SSB: jedna wstęga boczna","h":"Zostaje tylko jedna wstęga boczna, bez nośnej: nic, gdy nikt nie mówi.","l":"Brak środkowej kreski, jedno pasmo około 2,7 kHz, które żyje tylko podczas mówienia. USB powyżej 10 MHz, LSB poniżej (krótkofalowcy). Źle dostrojony głos brzmi jak „kaczka” (karty 9 i 26)."},"fm":{"sh":"głos","t":"FM: modulacja częstotliwości","h":"Amplituda się nie zmienia; to drgania zagęszczają się lub rozrzedzają z dźwiękiem.","l":"Sygnał tańczy wokół swojej częstotliwości, szerszy przy głośnym dźwięku: 12,5 kHz na kanał w wąskim FM (krótkofalówki, przemienniki), 200 kHz w radiu FM (karty 2 i 11)."},"cw":{"t":"CW: Morse","h":"Nośna jest włączana i wyłączana: kreski i kropki.","l":"Bardzo cienka kreska przerywana w rytmie Morse'a; piszczenie w uchu. Tutaj „CQ” (karta 39).","r":[["Szybkość","20 słów/min, kropka 60 ms, na 700 Hz: „CQ CQ CQ DE F4ABC K”"],["Na słuch","Czyste piski, długie i krótkie, na jednym tonie"],["Dekodowanie","Na słuch, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: dwie częstotliwości","h":"Częstotliwość przeskakuje między dwiema wartościami, jedną dla 0, drugą dla 1.","l":"Dwie równoległe kreski: 170 Hz odstępu u krótkofalowców (45,45 bodów), 450 lub 850 Hz w komunikatach pogodowych. Regularne „tidilidi” (karta 27).","r":[["Kod","Baudot ITA2: 5 bitów + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Tekst","RYRYRYRY CQ CQ DE F4ABC"],["Dekodowanie","fldigi,
