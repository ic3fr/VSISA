ns e as previsões marítimas em texto claro.","l":"Dois traços muito mais afastados e um ritmo um pouco mais rápido. Entre boletins, a chamada «CQ CQ CQ DE DDK2 DDH7 DDK9» e depois RYRYRY. Em 4583, 7646 e 10 100,8 kHz, também 147,3 kHz (ficha 32)."},"mfsk16":{"nm":"MFSK16","sh":"16 tons","t":"MFSK16: dezasseis tons","h":"Dezasseis tons afastados 15,625 Hz, um de cada vez, 15,625 vezes por segundo; cada tom leva quatro bits, protegidos por um código corretor.","l":"Uma banda de 316 Hz feita de pequenos degraus que saltam sem parar, depois de um tom fixo no início. Ao ouvido, uma musiquinha rápida, como uma flauta. Também serve para enviar pequenas imagens."},"sitora":{"nm":"SITOR-A (ARQ)","sh":"telex","t":"SITOR-A: o telex marítimo em ARQ","h":"A estação envia blocos de três carateres (210 ms, 100 bauds, desvio de 170 Hz) a cada 450 ms; entre blocos, a outra estação responde com um sinal curto para dizer «recebido» ou «repete».","l":"Rajadas curtas e regulares, com uma pequena resposta mais fraca entre elas: um «tchip-tchip» de grilo. Hoje raro em onda curta."},"dscvhf":{"nm":"DSC VHF (canal 70)","sh":"DSC","t":"DSC: chamada seletiva digital no canal 70","h":"Uma rajada de cerca de meio segundo a 1200 bauds, em dois tons de 1300 e 2100 Hz: leva o número MMSI do navio, o tipo de chamada e, em perigo, a posição.","l":"Um «brrrt» curto e agudo em 156,525 MHz, que começa por uma série de bits alternados. Em onda média e curta, o DSC é em FSK a 100 bauds, como o NAVTEX (ficha 20)."},"selcal":{"nm":"SELCAL aviação","sh":"4 tons","t":"SELCAL: chamada seletiva dos aviões em onda curta","h":"O controlo chama um avião preciso com dois impulsos de cerca de um segundo, cada um feito de dois tons entre dezasseis (312,6 a 1479,1 Hz). No avião acende-se uma luz e toca um carrilhão: a tripulação não precisa de estar sempre à escuta.","l":"Dois acordes seguidos, «bing-bong», entre as mensagens de voz das frequências aeronáuticas em BLU, por exemplo 5616 ou 8864 kHz."},"dcs":{"nm":"DCS","sh":"134,4 bit/s","t":"DCS: o subtom digital","h":"Em vez de um tom contínuo como o CTCSS, o rádio envia por baixo da voz uma palavra de 23 bits repetida sem parar, a 134,4 bits por segundo. No fim, um tom de 134,4 Hz fecha o squelch sem ruído.","l":"Visto no som do recetor FM: uma banda irregular bem em baixo, abaixo de 300 Hz, e um ronco surdo se o filtro do rádio o deixar passar (ficha 10)."},"t1750":{"nm":"Tom de 1750 Hz","sh":"repetidor","t":"Tom de 1750 Hz: abrir um repetidor","h":"Um tom curto de 1750 Hz (cerca de 0,5 a 1 s) no início da emissão ainda abre alguns repetidores de radioamadores europeus; o repetidor responde muitas vezes com um bip quando se larga o botão.","l":"Um traço curto em 1750 Hz, depois a voz, depois o bip do repetidor (ficha 10)."},"ncdxf":{"nm":"Balizas NCDXF","sh":"14,100 MHz","t":"Balizas NCDXF / IARU: testar a propagação","h":"Dezoito balizas no mundo emitem à vez, dez segundos cada, em 14,100, 18,110, 21,150, 24,930 e 28,200 MHz: o indicativo em Morse e depois quatro traços de um segundo a 100 W, 10 W, 1 W e 0,1 W.","l":"Um indicativo e quatro traços cada vez mais fracos: se ainda ouves o último, a propagação para essa baliza é excelente. Aqui 4U1UN (Nova Iorque) e depois VE8AT (Canadá) (ficha 30)."},"lrpt":{"nm":"Meteor-M LRPT","sh":"137,9 MHz","t":"Satélites Meteor-M: imagens LRPT","h":"Os satélites meteorológicos russos Meteor-M enviam as imagens em digital: modulação de fase de quatro estados (QPSK), 72 000 símbolos por segundo, com cerca de 120 kHz de largura.","l":"Um bloco cheio de bordas arredondadas que desliza devagar durante a passagem (efeito Doppler); ao ouvido, um simples sopro. Em 137,9 ou 137,1 MHz, descodificado com o SatDump (ficha 41).","n":"escala reduzida"},"quindar":{"nm":"Bips Quindar","sh":"NASA","t":"Tons Quindar: os bips do Apollo","h":"Quando o controlo de Houston carrega no microfone, um bip de 2525 Hz (250 ms) liga os emissores das estações terrestres; quando larga, um bip de 2475 Hz desliga-os.","l":"Um bip agudo antes de cada frase e outro, um pouco mais grave, depois: o som célebre das gravações das missões Apollo."},"wow":{"nm":"Sinal «Wow!»","sh":"1977","t":"O sinal «Wow!» (15 de agosto de 1977)","h":"O radiotelescópio Big Ear (Ohio) captou durante 72 segundos um sinal estreito e muito forte perto da risca do hidrogénio, cerca de 1420,456 MHz. O astrónomo Jerry Ehman escreveu «Wow!» na listagem. Nunca mais foi visto e a sua origem continua em discussão.","l":"Um traço fino que sai do ruído, cresce e volta a descer: a forma da passagem de uma fonte fixa no feixe da antena. É uma reconstituição: não existe nenhuma gravação sonora.","n":"72 s reduzidos a 12 s"},"frb":{"nm":"Explosão rápida de rádio","sh":"FRB","t":"Explosão rápida de rádio (FRB)","h":"Um clarão rádio de alguns milissegundos vindo de outra galáxia; o primeiro foi descoberto em 2007. O gás atravessado atrasa muito as frequências baixas: a explosão chega esticada, os agudos primeiro.","l":"Uma só curva que cai do topo para o fundo do espetro, e depois mais nada. Algumas repetem-se; a maioria só é vista uma vez.","n":"muito abrandado e exagerado"},"letterb":{"nm":"Balizas de uma letra","sh":"D, P, S, C…","t":"Balizas de uma letra","h":"Emissores da marinha russa repetem sem fim uma única letra em Morse, cada um a 100 Hz do vizinho: D, P, S, C, A, F, K ou M conforme o local.","l":"Linhas pontilhadas paralelas, muito próximas, cada uma com o seu ritmo. Perto de 4558, 5154, 7039, 10 872, 13 528 e 16 332 kHz, em CW."},"sid":{"nm":"Erupção solar em VLF","sh":"SID","t":"Erupção solar vista em VLF (SID)","h":"Os emissores VLF das marinhas (20,9 kHz em França, 23,4 kHz na Alemanha…) propagam-se entre o solo e a ionosfera. Quando chega uma erupção solar, os seus raios X alteram a base da ionosfera em poucos minutos e o nível recebido salta de repente.","l":"Uma banda estreita e regular (o sinal MSK do emissor) que fica bruscamente mais forte e depois volta devagar ao normal. Bastam uma espira de fio e uma placa de som: um projeto clássico dos clubes de astronomia.","n":"uma hora reduzida a 12 s"},"qrn":{"nm":"Estática de trovoada","sh":"QRN","t":"Estática de trovoada (QRN)","h":"Cada relâmpago é um emissor muito potente que cobre todas as frequências ao mesmo tempo. Em onda média e curta ouvem-se trovoadas a milhares de quilómetros, sobretudo no verão e nas bandas baixas.","l":"Traços horizontais irregulares em toda a largura; estalos secos ao ouvido. O limitador de ruído (NB) ajuda um pouco, uma antena de quadro ajuda mais."},"fading":{"nm":"Desvanecimento seletivo","sh":"QSB","t":"Desvanecimento seletivo (QSB)","h":"Em onda curta o sinal chega por vários caminhos através da ionosfera. Conforme a frequência, somam-se ou anulam-se: uma cova estreita passeia pelo sinal.","l":"Uma zona escura que se desloca devagar na estação de AM. Quando passa na portadora, ao centro, o som fica rouco e deformado uns segundos; a deteção síncrona ou a escuta em BLU corrigem isso."},"plc":{"nm":"PLC","sh":"2–30 MHz","t":"PLC: Internet pelas tomadas elétricas","h":"Os adaptadores PLC enviam os dados pelos fios da casa com centenas de portadoras entre 2 e 30 MHz (mais acima nos modelos recentes), uma a cada 24,4 kHz. Os fios irradiam como uma antena.","l":"Um pente de riscas regulares que pisca por pacotes, com buracos nas bandas de radioamador (entalhes previstos pela norma); ao ouvido, um crepitar que acompanha o tráfego da Internet (ficha 43).","n":"escala reduzida"},"fence":{"nm":"Cerca elétrica","sh":"tac… tac…","t":"Cerca elétrica","h":"O eletrificador envia para o fio um impulso de vários milhares de volts, cerca de uma vez por segundo. Se a erva tocar no fio ou um isolador estiver danificado, salta uma faísca que irradia em todas as frequências.","l":"Um traço horizontal muito fino em toda a largura, a intervalos perfeitamente regulares; um «tac… tac…» da onda longa até VHF. O ritmo regular distingue-o da trovoada."},"gsm":{"nm":"Telemóvel GSM","sh":"217 Hz","t":"Telemóvel GSM junto de um altifalante","h":"Um telemóvel 2G emite em rajadas de 0,577 ms, 217 vezes por segundo. Um amplificador de áudio mal blindado deteta essas rajadas e torna-as audíveis.","l":"Um pente de riscas a cada 217 Hz; o famoso «ta-ta-tatata» mesmo antes de o telemóvel tocar e depois um zumbido contínuo durante a chamada. Cada vez mais raro: as redes 2G estão a fechar."},"jjy":{"nm":"JJY","sh":"40 / 60 kHz","t":"Sinal horário JJY (Japão, 40 e 60 kHz)","h":"Em cada segundo a portadora está em plena potência durante 0,8 s (bit 0), 0,5 s (bit 1) ou 0,2 s (marca) e depois cai para 10 %. É o inverso do DCF77, que baixa no início do segundo.","l":"Um traço fixo que enfraquece no fim de cada segundo, mais cedo ou mais tarde. Emissores de Fukushima (40 kHz) e Saga-Fukuoka (60 kHz), para os relógios radiocontrolados do Japão."},"rwm":{"nm":"RWM","sh":"4996 kHz","t":"Sinal horário RWM (Moscovo)","h":"Em telegrafia em 4996, 9996 e 14 996 kHz: um impulso de 100 ms a cada segundo e, noutros minutos, dez impulsos por segundo. O indicativo RWM é enviado em Morse duas vezes por hora.","l":"O indicativo, depois um traço cortado em «tiques» regulares e a seguir em pontos rápidos. Ouvir em CW ou BLU.","n":"excerto condensado"},"bpm":{"nm":"BPM","sh":"2,5–15 MHz","t":"Sinal horário BPM (China)","h":"A estação de Pucheng (Shaanxi) emite em AM em 2,5, 5, 10 e 15 MHz: um tique de 10 ms a 1000 Hz a cada segundo (300 ms no minuto) e, em certos minutos, tiques de 100 ms para o tempo UT1. O indicativo BPM é dado em Morse e depois por uma voz.","l":"No som desmodulado: o indicativo, depois traços muito curtos a 1000 Hz, um por segundo, com um mais longo no minuto. Muitas vezes misturado com a WWV nas mesmas frequências.","n":"excerto condensado"},"humpback":{"nm":"Baleia-jubarte","sh":"canto","t":"O canto da baleia-jubarte","h":"No inverno, nas zonas de reprodução, os machos cantam: uma série de gemidos, roncos e gritos que forma um tema, repetido igual durante horas e que muda de uma estação para a outra. Os hidrofones ouvem-no a dezenas de quilómetros.","l":"Traços grossos com os seus harmónicos, que sobem ou descem lentamente entre 100 Hz e alguns kHz; a mesma série volta passados alguns segundos. O eco na superfície e no fundo prolonga cada nota."},"bluewhale":{"nm":"Baleia-azul","sh":"×10","t":"A baleia-azul: o chamamento mais grave","h":"O maior animal do mundo emite chamamentos muito graves (10 a 40 Hz) e muito potentes, de 10 a 20 segundos, repetidos durante horas: chegam a centenas de quilómetros. Para os ouvir, a gravação é acelerada dez vezes.","l":"Uma parte pulsada e depois uma nota longa que mal desce, com os harmónicos por cima; a sequência repete-se. A escala mostra as frequências reais.","n":"acelerado 10 vezes"},"finwhale":{"nm":"Baleia-comum","sh":"20 Hz","t":"A baleia-comum: os impulsos de 20 Hz","h":"A baleia-comum emite impulsos de cerca de um segundo que descem de uns 25 para 18 Hz, a intervalos regulares, às vezes durante dias. Nos anos 1950-60, estes «sinais de 20 Hz» intrigaram as redes de escuta da marinha americana antes de serem atribuídos a esta baleia.","l":"Traços curtos, todos iguais, em série regular ou aos pares, como as batidas de um coração muito lento; cada um desce um pouco em frequência. A escala mostra as frequências reais.","n":"acelerado 10 vezes"},"sperm":{"nm":"Cachalote","sh":"cliques","t":"Os cliques do cachalote","h":"O cachalote caça em mergulho profundo com o seu sonar: cliques muito potentes, cerca de um por segundo, que aceleram num «rangido» ao aproximar-se da presa. Entre si, os cachalotes trocam «codas», séries curtas de cliques cujo ritmo varia de clã para clã.","l":"Traços horizontais em toda a largura, regularmente espaçados, depois apertados num zumbido (o rangido) e por fim um pequeno motivo rítmico: a coda. Cada clique é feito de vários impulsos muito próximos, devidos a reflexões na cabeça do animal."},"dolphin":{"nm":"Roaz","sh":"assobios","t":"Assobios e cliques do golfinho","h":"O roaz assobia entre cerca de 5 e 20 kHz; cada indivíduo tem um «assobio assinatura» que lhe serve de nome. Para caçar e orientar-se emite também trens de cliques muito curtos, até várias centenas por segundo.","l":"Curvas finas que sobem e voltam a descer, muitas vezes repetidas iguais, e rajadas de traços horizontais para a ecolocalização. As frequências são divididas por 3 para ficarem audíveis; a escala mostra os valores reais.","n":"3 vezes mais grave"},"orca":{"nm":"Orca","sh":"chamamentos pulsados","t":"Os chamamentos pulsados da orca","h":"As orcas comunicam com chamamentos pulsados: trens de impulsos tão rápidos (500 a 2000 por segundo) que se ouvem como uma nota, com um salto brusco de altura. Cada grupo familiar tem o seu próprio «dialeto».","l":"Uma pilha de traços paralelos (os harmónicos) que sobem ou descem juntos, com uma quebra nítida a meio do chamamento; às vezes um assobio fino, mais agudo."},"bseal":{"nm":"Foca-barbuda","sh":"trinado","t":"O trinado da foca-barbuda","h":"Na primavera, sob a banquisa ártica, o macho emite longos trinados que descem em espiral de vários kHz até algumas centenas de hertz, às vezes durante um minuto. Servem para defender um território e atrair as fêmeas.","l":"Uma curva ondulada que desliza de cima para baixo na escala, como uma mola que se distende, e uma nota grave no fim.","n":"encurtado"},"shrimp":{"nm":"Camarões-pistola","sh":"recife","t":"Os camarões-pistola (alfeídeos)","h":"Ao fechar a sua grande pinça, o camarão dispara um jato de água tão rápido que forma uma bolha de cavitação; ao rebentar, a bolha estala como um tiro. Milhares de camarões formam o ruído de fundo dos recifes e podem perturbar os sonares.","l":"Uma chuva de pontos e traços horizontais curtos em toda a largura, sem qualquer ordem; nos auscultadores, um crepitar contínuo, como uma fritura."},"sonar":{"nm":"Sonar ativo","sh":"ping","t":"O ping de um sonar ativo","h":"Um navio envia um impulso sonoro potente (aqui perto de 3,5 kHz, a gama dos sonares de casco das fragatas) e escuta o eco: o atraso dá a distância e o desvio de frequência (efeito Doppler) a velocidade do alvo. O som volta também como uma cauda vinda do fundo e da superfície: a reverberação.","l":"Um traço curto e forte, uma cauda que se apaga e depois o eco, muito mais fraco e um pouco desviado em frequência. O segundo ping é um varrimento de frequência (chirp), que mede melhor a distância."},"propeller":{"nm":"Hélice de navio","sh":"cavitação","t":"A hélice de um navio que passa","h":"As pás da hélice criam bolhas de cavitação que rebentam: um sopro largo, que bate ao ritmo da passagem das pás. As máquinas juntam riscas fixas. Os operadores de sonar analisam esse ritmo (análise DEMON) para contar as pás e a velocidade de rotação, e reconhecer o navio.","l":"Um sopro numa banda larga, riscado por faixas horizontais ao ritmo das pás, com alguns traços verticais fixos (motor, redutor). Tudo cresce e depois se apaga quando o navio passa por cima do hidrofone."},"uqc":{"nm":"Telefone subaquático","sh":"UQC 8 kHz","t":"O telefone subaquático (UQC, «Gertrude»)","h":"Submarinos e navios falam debaixo de água com um telefone acústico: a voz é transmitida em banda lateral única acima de uma portadora de 8,0875 kHz, emitida por um transdutor no casco. Alcance: alguns quilómetros.","l":"Uma banda de voz BLU acima de 8 kHz; desmodulada, uma voz distante que ondula e ressoa por causa dos ecos na superfície e no fundo. A visualização está reduzida a metade; a escala mostra as frequências reais.","n":"escala dividida por 2"},"zevs":{"nm":"ZEVS 82 Hz","sh":"ELF","t":"ZEVS: o rádio dos submarinos a 82 Hz","h":"As ondas de rádio penetram muito mal na água do mar, exceto em frequências extremamente baixas (ELF). O emissor russo ZEVS, na península de Kola, emite a 82 Hz com linhas de antena de dezenas de quilómetros para chegar aos submarinos em mergulho profundo. O débito é minúsculo: alguns caracteres por minuto.","l":"Um traço fino a 82 Hz ao lado da risca da rede a 50 Hz e dos seus harmónicos, com os parasitas das trovoadas. Nos auscultadores, um zumbido grave mal audível; capta-se com um grande quadro e uma placa de som. O equivalente americano, a 76 Hz, fechou em 2004."},"bloop":{"nm":"O «Bloop»","sh":"1997","t":"O «Bloop» (1997)","h":"Em 1997, os hidrofones da NOAA no Pacífico captaram um som muito grave que subia depressa, ouvido a milhares de quilómetros. Misterioso durante muito tempo, desde 2012 é atribuído a um sismo de gelo: um enorme icebergue a fender-se.","l":"Uma banda larga que sobe em poucos segundos, com os seus harmónicos, e depois se apaga lentamente. Reconstituição, acelerada 16 vezes como a gravação divulgada pela NOAA.","n":"acelerado 16 vezes"}}},"it":{"ui":{"title":"VSISA","mystery":"Suono misterioso","play":"▶ Ascolta","stop":"■ Stop","noise":"Rumore","volume":"Volume","loop":"Ripeti","specwf":"Spettro + Cascata","cursor":"cursore","footprint":"Impronta","dur":"{s} s dall'alto in basso","avg":"media su tutto il segnale","press":"Premi Ascolta: il segnale scorre qui","count":"{n} segnali, nell'ordine della scheda 6","myst":"Modo misterioso","mystTags":"Ascolta e guarda, poi scegli la risposta giusta","quizH":"Che segnale è?","quizLead":"Avvia l'ascolto, osserva lo spettro, la cascata e l'impronta, poi rispondi.","score":"Punteggio","good":"Giusto!","bad":"Sbagliato: era {x}.","next":"Prossimo suono misterioso","principle":"Principio","screen":"Sullo schermo","sheet":"scheda","book":"Libro: scheda {r}","lang":"Lingua","signals":"Segnali","f1":"Segnali simulati nella pagina (12 000 campioni al secondo): quelli della scheda 6 del libro OpenBookRadio, altri segnali del libro e bonus. Per i segnali radio (AM, FM, AIS, LoRa…) si vede la frequenza intermedia simulata, come sullo schermo di un SDR; alcuni sono in scala ridotta o accelerata, come indicato. Per AM, SSB, FM, FM stereo, ISS ed evanescenza si sente il suono demodulato, come dall'altoparlante del ricevitore, e lo schermo mostra il segnale radio; la voce è sintetica e non dice parole vere.","f2":"Il tempo scende nella cascata e nell'impronta. Licenza CC BY-NC-SA 4.0, gratuito, non vendere.","night":"Modo notte","day":"Modo giorno","visits":"visite","plays":"ascolti","book_dl":"Scarica il libro","book_dl2":"Scarica il libro OpenBookRadio (gratuito, PDF ed EPUB, 13 lingue)","display":"Visualizzazione","theme_day":"Giorno","theme_night":"Notte (rosso)","theme_phos":"Fosfori verdi","theme_phosb":"Fosfori blu","theme_phosa":"Fosfori ambra","w3d":"Waterfall 3D","w3dHint":"trascina per ruotare"},"groups":["Voce analogica","Telegrafia","Dati","Immagini","Aviazione, marina e soccorso","Chiamata, subtoni e cercapersone","Radiosonde, sensori e oggetti connessi","Modi HF e curiosità","Radiodiffusione e ora","Banda larga","Bonus: suoni dallo spazio","Bonus: curiosità delle onde corte","Bonus: suoni sottomarini"],"modes":{"am":{"sh":"radio","t":"AM: modulazione di ampiezza","h":"La forza della portante segue il suono: la curva si «gonfia» e si «sgonfia».","l":"Una riga fissa al centro (la portante), con due bande laterali uguali ai lati. Circa 6-9 kHz di larghezza. Radio in onde corte e medie, aviazione (schede 12 e 14).","r":[["Ascolto","Un jingle, poi lo speaker su un sottofondo musicale. Le due bande laterali sono speculari: si vede la melodia, poi la voce, ai due lati della portante."]]},"ssb":{"t":"SSB: banda laterale unica","h":"Resta una sola banda laterale, senza portante: niente quando nessuno parla.","l":"Nessuna riga centrale, una sola banda di circa 2,7 kHz che vive solo quando si parla. USB sopra 10 MHz, LSB sotto (radioamatori). Sintonizzata male, la voce sembra una «papera» (schede 11 e 29)."},"fm":{"sh":"voce","t":"FM: modulazione di frequenza","h":"L'ampiezza resta fissa; sono le oscillazioni che si stringono o si allargano con il suono.","l":"Il segnale danza intorno alla sua frequenza, più largo quando il suono è forte: 12,5 kHz per canale in FM stretta (walkie-talkie, ponti), 200 kHz nella radio FM (schede 2 e 13).","r":[["Ascolto","Alla fine, il breve «kshh»: lo squelch si chiude quando il trasmettitore si ferma."]]},"cw":{"t":"CW: Morse","h":"La portante si accende e si spegne: linee e punti.","l":"Una riga sottilissima che si interrompe al ritmo del Morse; un bip all'orecchio. Qui «CQ» (scheda 48).","r":[["Velocità","20 parole/min, punto di 60 ms, a 700 Hz: «CQ CQ CQ DE F4ABC K»"],["A orecchio","Bip puri, lunghi e corti, su una sola nota"],["Decodifica","A orecchio, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: due frequenze","h":"La frequenza salta tra due valori, uno per 0 e uno per 1.","l":"Due righe parallele: 170 Hz di distanza per i radioamatori (45,45 baud), 450 o 850 Hz per i bollettini meteo. Un «tidilidi» regolare (scheda 32).","r":[["Codice","Baudot ITA2: 5 bit + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Testo","RYRYRYRY CQ CQ DE F4ABC"],["Decodifica","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 baud: APRS e packet","h":"Due toni audio, 1200 e 2200 Hz, inviati in un trasmettitore FM.","l":"Visto dopo il ricevitore FM (suono dell'altoparlante): una banda da 1200 a 2200 Hz, a raffiche brevi. All'orecchio, un «grrrt» di un secondo (schede 35 e 36).","r":[["Frequenza","144,800 MHz in Europa (APRS), FM"],["Trama","Flag 0x7E poi dati AX.25 in NRZI"],["Decodifica","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"t":"PSK31: modulazione di fase","h":"La frequenza non si muove, è la fase che si inverte; l'ampiezza cala a ogni inversione.","l":"Una riga sottilissima di circa 60 Hz, un po' «intrecciata». Decine di stazioni stanno in 3 kHz (scheda 29).","r":[["Codice","Varicode: 0 = inversione di fase, 1 = nessun cambio; a riposo, due righe gemelle"],["Dove ascoltarlo","14 070 kHz, 3580 kHz"],["Decodifica","fldigi"]]},"ft8":{"t":"MFSK / FT8: otto toni","h":"La frequenza sale e scende a gradini di 6,25 Hz, 0,16 s per gradino.","l":"Bande di circa 50 Hz che durano 12,6 s e tornano ogni 15 s, sincronizzate sull'ora: più stazioni insieme in 3 kHz, per esempio su 7,074 MHz (scheda 29).","r":[["Trama","79 simboli di 0,16 s, tre schemi Costas (inizio, metà, fine); qui otto stazioni"],["Frequenze","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Decodifica","WSJT-X, JTDX (ora del PC esatta)"]]},"ft4":{"t":"FT4: l'FT8 dei contest","h":"Quattro toni distanti 20,8 Hz, 20,8 baud: 105 simboli in 5 s, a turni di 7,5 s.","l":"Bande di circa 90 Hz, più corte e larghe dell'FT8, che tornano ogni 7,5 s. 14 080, 7047,5 kHz (scheda 29)."},"olivia":{"t":"Olivia 8/250: otto toni","h":"Otto toni distanti 31,25 Hz, uno alla volta, che saltano a caso; codifica Walsh e interleaving.","l":"Un blocco di punti sparsi su 250 Hz; decodifica molto sotto il rumore. Una piccola melodia casuale all'orecchio (scheda 29)."},"hell":{"t":"Feld Hell: scrivere con una portante","h":"La portante si accende e si spegne punto per punto: ogni lettera è fatta di colonne di 14 punti, scandite dal basso in alto (245 punti al secondo).","l":"Nella cascata, una riga spezzettata; è lo schermo del programma (fldigi) che ridisegna le lettere. Un crepitio leggero all'orecchio (scheda 29)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Quattro livelli di frequenza: ogni simbolo porta due bit.","l":"Un blocco rettangolare da 6 a 12,5 kHz, pieno come rumore, spesso a raffiche (il DMR divide il canale in due slot). Un «frrr» rauco all'orecchio (scheda 46)."},"mt63":{"t":"MT63: messaggi di emergenza (NBEMS)","h":"64 toni contemporaneamente, ognuno modulato lentamente, con molta ridondanza.","l":"Un blocco piatto di 1 o 2 kHz centrato su 1500 Hz, con bordi netti; un soffio regolare. Passa persino da un microfono appoggiato a un altoparlante (scheda 31)."},"lora":{"t":"LoRa: rampe di frequenza (chirp)","h":"La frequenza spazza tutta la larghezza e riparte dal basso: la posizione del salto porta i dati.","l":"Diagonali parallele, facili da riconoscere: Meshtastic e MeshCore su 869,525 MHz o 433 MHz, sensori LoRaWAN (schede 13, 23 e 24)."},"sstv":{"t":"SSTV: immagini in audio","h":"Un impulso di sincronismo a 1200 Hz, poi la frequenza segue la luminosità della riga, da 1500 (nero) a 2300 Hz (bianco).","l":"Righe di sincronismo regolari e una nuvola che cambia con l'immagine; un suono che «cinguetta» per uno o due minuti. 14,230 MHz, ISS su 145,800 MHz (scheda 37).","r":[["Trama","Intestazione VIS, poi righe: sincronismo 1200 Hz, verde, blu, rosso; qui 20 righe di un monoscopio"],["Decodifica","QSSTV, MMSSTV, Robot36 sullo smartphone"]]},"fax":{"nm":"Fax meteo","t":"Fax meteo: 1500 Hz nero, 2300 Hz bianco","h":"La frequenza passa dal nero al bianco in modo continuo, 120 righe al minuto.","l":"Due bande fisse a 1500 e 2300 Hz (800 Hz di distanza), un «tic-tac» regolare. Le frequenze pubblicate sono quelle della portante: ascolta in USB 1,9 kHz più in basso (scheda 38).","r":[["Trama","Tono di avvio a 300 Hz, righe di fasatura (impulso bianco), poi la carta"],["Decodifica","fldigi, JWX, HamFax"]]},"elt":{"nm":"Sirena ELT","t":"Sirena ELT / PLB su 121,5 MHz","h":"Un'AM il cui tono scende da 1600 a 300 Hz, da due a quattro volte al secondo.","l":"Una portante fissa e bande laterali che scivolano a ventaglio: l'«uu-uu» dei radiofari di soccorso, anche su 121,375 MHz per le esercitazioni (schede 27 e 28)."},"406":{"nm":"Radiofaro 406","t":"Radiofaro 406 MHz: raffica BPSK","h":"Mezzo secondo di trasmissione: 160 ms di portante pura, poi la fase oscilla di ±1,1 radianti a 400 bit/s.","l":"Un trattino breve che torna ogni 50 s, tra 406,0 e 406,1 MHz; niente di utile da ascoltare, serve un decodificatore (EPIRB 406, scheda 28)."},"adsb":{"t":"ADS-B / modo S (1090 MHz): impulsi","h":"Impulsi di 0,5 µs la cui posizione porta i bit (PPM); qui la scala del tempo è molto rallentata.","l":"Trattini orizzontali brevissimi su tutta la larghezza, centinaia al secondo vicino a un aeroporto; serve una chiavetta SDR (scheda 15).","n":"scala del tempo molto rallentata"},"acars":{"t":"ACARS: AM e dati MSK","h":"Un'AM che trasporta due toni, 1200 e 2400 Hz, a 2400 bit/s.","l":"Raffiche di mezzo secondo con portante e bande laterali, su 131,525, 131,725 o 131,825 MHz in Europa: un «brrrt» all'orecchio (scheda 16)."},"ais":{"t":"AIS: GMSK 9600 baud su due canali","h":"Una FSK ammorbidita (GMSK) a raffiche di 26 ms, una volta su 161,975 MHz, una volta su 162,025 MHz (scala ridotta).","l":"Due colonne di trattini brevi, a 50 kHz di distanza, uno schiocco regolare; più navi ci sono, più è fitto (scheda 19).","n":"scala ridotta"},"navtex":{"t":"NAVTEX e DSC in onde medie e corte: FSK 170 Hz","h":"Come l'RTTY: due frequenze a 170 Hz, ma a 100 baud.","l":"Due righe parallele continue durante il bollettino, su 518 e 490 kHz (NAVTEX) o 2187,5 kHz (chiamata selettiva digitale) (scheda 20).","r":[["Codice","SITOR-B, CCIR 476: 7 bit con quattro «1», con ripetizione FEC"],["Decodifica","fldigi, YaND"]]},"hfdl":{"t":"HFDL: gli aerei in onde corte","h":"Una PSK a 1800 baud su una sottoportante di 1440 Hz.","l":"Raffiche di circa 2,4 kHz tra 2,9 e 22 MHz; un fruscio da modem che va e viene (scheda 17)."},"ctcss":{"t":"CTCSS: subtono sotto la voce","h":"Un tono grave e continuo (da 67 a 254 Hz, qui 88,5 Hz) aggiunto alla voce.","l":"Visto nel suono del ricevitore FM: una riga fissa in fondo, sotto la voce; apre lo squelch di ponti e walkie-talkie (scheda 10)."},"dtmf":{"sh":"2 toni","t":"DTMF: due toni per tasto","h":"Ogni tasto invia contemporaneamente un tono grave (697-941 Hz) e uno acuto (1209-1633 Hz).","l":"Coppie di punti allineati su otto colonne fisse; il «bip-bip» dei numeri di telefono e dei comandi dei ponti (scheda 10).","r":[["Sequenza","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 toni","t":"Selcall CCIR: toni in sequenza","h":"Cinque toni di 100 ms uno dopo l'altro, uno per cifra.","l":"Una piccola scala di punti, ripetuta; un «tululululu» rapido per chiamare una radio precisa (scheda 33).","r":[["Sequenza","1 2 3 4 5, due volte; decodificata anche dall'app SelCall dell'UV-K1"]]},"pocsag":{"sh":"cercapersone","t":"POCSAG e FLEX: cercapersone","h":"Una FSK a ±4,5 kHz; un preambolo 1010… poi i dati (scala ridotta).","l":"Due righe nette durante il preambolo, poi una banda piena; un «brrrrt» stridente. 466,075 MHz, DAPNET 439,9875 MHz (scheda 45).","n":"scala ridotta"},"ale":{"sh":"8 toni","t":"ALE: chiamata automatica in onde corte","h":"Otto toni da 750 a 2500 Hz, 125 baud, a raffiche.","l":"Un blocco di circa 2 kHz fatto di puntini, uno o due secondi, a volte su più frequenze vicine; un cinguettio acuto (scheda 34)."},"rs41":{"nm":"Radiosonda RS41","t":"Radiosonda RS41: GFSK continua","h":"Una FSK ammorbidita a 4800 baud, senza sosta; la frequenza deriva lentamente quando la sonda sale e si raffredda.","l":"Una banda di circa 10 kHz che scivola in diagonale per tutto il volo, tra 400 e 406 MHz (scheda 21)."},"ook":{"nm":"Sensori 433","t":"Sensori 433 MHz: OOK","h":"La portante si accende e si spegne a impulsi brevi o lunghi (tutto o niente); il messaggio è ripetuto tre volte.","l":"Raffiche di puntini, spesso tripli, su 433,92 MHz: stazioni meteo, sonde di temperatura, telecomandi (scheda 22)."},"fhss":{"t":"Bluetooth: salti di frequenza (FHSS)","h":"La frequenza cambia 1600 volte al secondo tra 79 canali (scala ridotta).","l":"Trattini sparsi ovunque su 80 MHz, mai nello stesso posto, intorno a 2,4 GHz (scheda 25).","n":"scala ridotta"},"wspr":{"t":"WSPR: radiofari di propagazione","h":"Quattro toni distanti 1,46 Hz, 0,68 s per simbolo, per 110,6 s.","l":"Una riga sottilissima di circa 6 Hz che dura quasi due minuti, ogni due minuti pari: bisogna ingrandire molto (scheda 29).","n":"estratto di 24 s (una trasmissione dura 110,6 s)"},"qrss":{"t":"QRSS: Morse lentissimo","h":"Una portante accesa e spenta, con punti da 3 a 10 s, spesso su due frequenze vicine (DFCW).","l":"Righe larghe pochi Hz, lette su uno schermo di dieci minuti; non udibile (scheda 30).","n":"accelerato: punto di 0,6 s invece di 3-10 s"},"texte":{"nm":"Testo nella cascata","t":"Testo nella cascata","h":"Ogni riga di un'immagine diventa un gruppo di toni: il suono sembra rumore.","l":"Il testo o il disegno appare direttamente sullo schermo dell'SDR (scheda 40).","r":[["Nota","Trasmesso dal basso dell'immagine: dritto nella cascata dal vivo, capovolto nell'impronta (letta dall'alto in basso)"]]},"vara":{"t":"Dati HF moderni: VARA, Pactor, ARDOP","h":"Lunghe raffiche piene (OFDM o PSK) e, tra una e l'altra, brevi risposte dell'altra stazione.","l":"Un rettangolo di circa 2,4 kHz che si ferma e riparte, con una piccola conferma in mezzo; un fruscio spezzettato (scheda 29)."},"chirp":{"nm":"Ionosonda","t":"Ionosonda (chirp sounder)","h":"Una rampa di frequenza lenta che attraversa tutta la banda HF; gli echi della ionosfera arrivano poco dopo.","l":"Una diagonale che spazza lo schermo, affiancata da righe parallele (gli echi); un «ffuit» che passa in una frazione di secondo."},"oth":{"nm":"Radar oltre l'orizzonte","t":"Radar oltre l'orizzonte («woodpecker»)","h":"Impulsi ripetuti da 10 a 50 volte al secondo, ognuno largo diversi kHz.","l":"Un blocco largo e striato che copre bande intere; un picchiettio da picchio molto regolare in onde corte."},"parasites":{"nm":"Disturbi","sh":"alimentatore","t":"Disturbi di un alimentatore switching","h":"Un'onda quadra: la sua frequenza e tutte le armoniche escono insieme.","l":"Un pettine di righe regolari che derivano insieme su un fondo di rumore: cercalo con NOISE FIND o un ricevitore portatile (scheda K22)."},"mpx":{"nm":"FM stereo e RDS","t":"Radio FM stereo e RDS","h":"Il suono demodulato (multiplex) contiene il canale L+R, un pilota a 19 kHz, il canale L-R intorno a 38 kHz e l'RDS a 57 kHz.","l":"Visto da 0 a 60 kHz dopo la demodulazione: un blocco basso, una riga sottile a 19 kHz, un blocco più debole al centro e l'RDS in cima (scheda 12).","n":"scala ÷ 20; suono stereo","r":[["Ascolto","In cuffia: 4 s in mono (il blocco centrale, L-R, scompare), poi 4 s in stereo, la melodia a sinistra e gli accordi a destra."]]},"dcf77":{"t":"Segnale orario DCF77 (77,5 kHz)","h":"Una portante che scende al 15 % per 0,1 s (bit 0) o 0,2 s (bit 1), all'inizio di ogni secondo.","l":"Una riga fissa con un buco nero ogni secondo; il 59° secondo non ce l'ha, per segnare il minuto (scheda 12).","r":[["Nota","Qui la portante è portata a 1000 Hz; il 6° secondo non ha buco, come il 59° secondo di ogni minuto"]]},"ofdm":{"t":"OFDM: decine di sottoportanti","h":"Molte portanti fittissime, ognuna lenta: la somma sembra rumore.","l":"Un rettangolo piatto dai bordi netti, sempre presente: DRM in onde corte (10 kHz), DAB+ (1,5 MHz), DVB-T, Wi-Fi. Un soffio continuo all'orecchio (schede 12 e 25)."},"dsss":{"t":"Spettro espanso (DSSS): GPS, Wi-Fi 802.11b","h":"I dati sono mescolati con un codice velocissimo: l'energia si spande su una grande larghezza.","l":"Una gobba larga, appena sopra il rumore; il GPS è persino sotto il rumore e non si vede senza elaborazione (schede 25 e 26)."},"hline":{"nm":"Riga dell'idrogeno","sh":"1420 MHz","t":"Riga dell'idrogeno a 21 cm (1420,405 MHz)","h":"L'idrogeno freddo della Via Lattea emette un soffio debolissimo su 1420,405 MHz. Il moto dei bracci della galassia lo sposta per effetto Doppler: si vedono alcune piccole gobbe.","l":"Quasi nulla nella cascata da un secondo all'altro: bisogna fare la media a lungo per veder emergere le gobbe dal rumore. Qui guarda lo spettro medio a riproduzione ferma. Bastano una parabola o una tromba, un preamplificatore e una chiavetta SDR.","n":"segnale molto esagerato"},"sun":{"nm":"Sole","sh":"burst","t":"Sole: burst radio di tipo III","h":"Elettroni lanciati da un brillamento attraversano la corona solare e la fanno emettere sempre più in basso in frequenza man mano che si allontanano.","l":"Righe che cadono in diagonale dall'alto al basso dello spettro in meno di un secondo, su un fondo di rumore solare; un «shhhh» che cresce. Da circa 10 a 400 MHz, anche in onde corte verso 20 MHz."},"jupiter":{"nm":"Giove","sh":"20 MHz","t":"Giove: burst decametrici (L e S)","h":"Il campo magnetico di Giove e la sua luna Io producono emissioni potenti tra 15 e 40 MHz: burst L lenti e burst S brevissimi che scivolano rapidi verso il basso.","l":"Prima onde di soffio (L, come la risacca), poi raffiche di piccoli «pop» (S) in diagonali fitte. Verso 20,1 MHz di notte, con un semplice dipolo, quando Io è ben posizionata."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Una stella di neutroni che ruota spazza la Terra con un fascio radio, qui ogni 0,714 s. Il gas interstellare ritarda le frequenze basse: ogni impulso arriva prima in cima allo spettro.","l":"Un «tic» regolare; nella cascata ogni impulso è una curva che scende (dispersione). Il segnale vero è sotto il rumore: servono una grande antenna e la somma degli impulsi sul loro periodo.","n":"segnale molto esagerato"},"meteor":{"nm":"Meteore","sh":"GRAVES","t":"Echi di meteore dal radar GRAVES (143,050 MHz)","h":"Il radar francese GRAVES trasmette senza sosta su 143,050 MHz. Quando una stella cadente ionizza l'aria, la sua scia rimanda un po' di quel segnale al tuo ricevitore, da una frazione di secondo a qualche secondo.","l":"In USB su 143,049 MHz: brevi «ping» intorno a 1000 Hz, a volte un eco che scivola (la testa della meteora, effetto Doppler) o che dura. Molti di più durante gli sciami (Perseidi, Geminidi) (scheda 1)."},"whistler":{"nm":"Fischi","sh":"VLF","t":"Fischi VLF (whistler)","h":"Un fulmine crea uno schiocco radio; una parte segue le linee del campo magnetico terrestre fino all'altro emisfero e torna, gli acuti per primi.","l":"Un «fiuuu» che scende dall'acuto al grave in uno o due secondi, subito dopo uno schiocco; scricchiolii (sferics) ovunque. Sotto i 10 kHz, con un ricevitore VLF lontano dalle linee elettriche."},"chorus":{"nm":"Coro dell'alba","sh":"VLF","t":"Coro dell'alba (dawn chorus)","h":"Durante una tempesta magnetica, elettroni intrappolati nella magnetosfera emettono piccole note ascendenti, soprattutto all'alba.","l":"Cinguettii ascendenti che si sovrappongono, come uccelli, da circa 1 a 4 kHz. Stessa attrezzatura dei fischi."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"Il primo satellite artificiale emetteva bip di circa 0,3 s su 20,005 e 40,002 MHz, alternandoli, per tre settimane.","l":"Una riga interrotta con regolarità: «bip… bip…», il suono ascoltato da tutto il mondo nell'ottobre 1957 (ricostruzione)."},"doppler":{"nm":"Effetto Doppler","sh":"satellite","t":"Radiofaro di satellite ed effetto Doppler","h":"Un satellite in orbita bassa si avvicina e poi si allontana: la frequenza ricevuta scende durante il passaggio, di circa ±3 kHz a 145 MHz e ±10 kHz a 435 MHz.","l":"Una riga che scende a forma di S: lentamente all'inizio, veloce quando il satellite è più vicino, poi di nuovo lentamente (scheda 41).","n":"passaggio di 10 min ridotto a 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satelliti NOAA: immagini APT (storico)","h":"Una sottoportante di 2400 Hz modulata in ampiezza dall'immagine, due righe al secondo, con un impulso di sincronismo all'inizio di ogni riga. Spento nel 2025; oggi i Meteor-M trasmettono in LRPT.","l":"Una riga a 2400 Hz con bande laterali che cambiano con l'immagine, e il famoso «tic-tac» due volte al secondo (scheda 41)."},"eme":{"nm":"Eco dalla Luna","sh":"EME","t":"Eco dalla Luna (EME)","h":"Un segnale inviato verso la Luna torna circa 2,5 s dopo, enormemente indebolito, un po' allargato e spostato dal Doppler.","l":"Si sente il proprio «bip», poi 2,5 s dopo il suo eco debole e un po' sfocato. I radioamatori lo fanno in CW o JT65, da 144 MHz in su (scheda 1).","n":"eco molto esagerato"},"msk144":{"nm":"MSK144","sh":"meteore","t":"MSK144: il modo digitale delle meteore","h":"Due toni, 1000 e 2000 Hz, a 2000 baud, in trame di 72 ms ripetute senza sosta: ogni scia di meteora ne lascia passare alcune.","l":"Raffiche da 0,1 a 1 s, larghe circa 2,4 kHz, che compaiono e si spengono con il «ping» della meteora. Su 50 e 144 MHz, con WSJT-X."},"jt65":{"nm":"JT65","sh":"65 toni","t":"JT65: 65 toni, lentissimo","h":"Un tono di sincronismo e 64 toni di dati distanti 2,7 Hz (JT65A), 0,37 s per simbolo, 47 s di trasmissione al minuto.","l":"Una scala di trattini su circa 180 Hz, con una riga di sincronismo che torna sempre nello stesso punto. Usato per il rimbalzo lunare (JT65B e C) e segnali debolissimi.","n":"estratto di 20 s (una trasmissione dura 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: rete digitale professionale","h":"Modulazione di fase π/4-DQPSK a 18 000 simboli al secondo, quattro canali a divisione di tempo, in canali da 25 kHz.","l":"Un blocco pieno dai fianchi arrotondati, sempre presente vicino a una stazione base; un soffio rauco. Cifrato: non si può ascoltare (scheda 46).","n":"scala ridotta"},"ndb":{"nm":"Radiofaro NDB","sh":"190–535 kHz","t":"NDB: radiofaro non direzionale","h":"Una portante fissa in onde lunghe, con un nominativo Morse di due o tre lettere inviato su un tono (spesso 1020 Hz).","l":"Una riga fissa al centro e, durante il nominativo, due trattini ai lati. Circa da 190 a 535 kHz, in SSB o CW (scheda 12)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: radiofaro omnidirezionale","h":"In AM: un segnale a 30 Hz che dipende dalla direzione, una sottoportante a 9960 Hz modulata in frequenza a 30 Hz (il riferimento) e il nominativo Morse a 1020 Hz.","l":"Nel suono demodulato: un ronzio grave a 30 Hz, una riga larga e ondulata verso 10 kHz e ogni tanto il nominativo (scheda 18).","n":"suono demodulato, scala ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: guida all'atterraggio (localizer)","h":"In AM, due toni a 90 e 150 Hz; il loro rapporto dice all'aereo se è a sinistra o a destra dell'asse. Il nominativo Morse inizia con I.","l":"Nel suono demodulato: due righe molto basse a 90 e 150 Hz e il nominativo a 1020 Hz. Tra 108,1 e 112 MHz; il sentiero di discesa è verso 330 MHz (scheda 18)."},"m10":{"nm":"Sonde M10 / M20","sh":"Meteomodem","t":"Radiosonde M10 e M20 (Meteomodem)","h":"Una trama al secondo in FSK veloce (circa 9600 baud): più larga della RS41. Lanciate in Francia da Météo-France.","l":"Una raffica larga ogni secondo, che deriva lentamente durante il volo; tra 400 e 406 MHz (scheda 21)."},"tpms":{"nm":"Pneumatici (TPMS)","sh":"433 MHz","t":"Sensori di pressione degli pneumatici (TPMS)","h":"Ogni ruota invia ogni tanto una raffica FSK di pochi millisecondi: pressione, temperatura, identificativo.","l":"Piccole raffiche isolate su 433,92 MHz (o 315 MHz), spesso a coppie, al passaggio di un'auto. Decodificate da rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Segnale orario ALS162 (Allouis, 162 kHz)","h":"La portante delle vecchie onde lunghe di France Inter; l'ora è codificata con piccole modulazioni di fase, inudibili.","l":"Una riga fissa, fortissima in Francia, appena allargata all'inizio di ogni secondo; serve un decodificatore per leggere l'ora (scheda 12)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Segnale orario WWV (Colorado)","h":"In AM: un «tic» di 5 ms a 1000 Hz ogni secondo, un tono a 500 o 600 Hz, un codice orario a 100 Hz e una voce che annuncia l'ora UTC.","l":"Nel suono demodulato: una riga a 500 Hz interrotta ogni secondo, il tic a 1000 Hz e il codice in fondo a 100 Hz (scheda 12)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Segnale orario MSF (Anthorn, 60 kHz)","h":"La portante viene spenta all'inizio di ogni secondo per 0,1, 0,2 o 0,3 s secondo i bit, e per 0,5 s per segnare il minuto.","l":"Una riga fissa con buchi completamente neri ogni secondo, più lunghi che con DCF77 (scheda 12)."},"type2":{"nm":"Sole tipo II","sh":"onda d'urto","t":"Sole: burst radio di tipo II","h":"L'onda d'urto di un'espulsione di massa coronale fa emettere il plasma sempre più in basso, lentamente, spesso in due bande (la fondamentale e il suo doppio).","l":"Due bande di rumore parallele che scendono dolcemente per diversi minuti. Confrontale con i burst di tipo III, molto più rapidi.","n":"diversi minuti ridotti a 6 s"},"tweeks":{"nm":"Tweek","sh":"VLF","t":"Tweek: i «ping» notturni in VLF","h":"Di notte lo schiocco di un fulmine lontano rimbalza tra suolo e ionosfera; le frequenze vicine al taglio (verso 1,7 kHz) arrivano per ultime.","l":"Un piccolo «ping» che scende e si ferma verso 1,7 kHz, a volte con un'eco al doppio; scricchiolii ovunque. Sotto i 10 kHz, di notte."},"hiss":{"nm":"Soffio VLF","sh":"hiss","t":"Soffio VLF (hiss)","h":"Un rumore largo prodotto dagli elettroni della plasmasfera, che sale e scende con l'attività magnetica.","l":"Una banda di soffio da qualche centinaio di Hz a qualche kHz, senza schema, che cresce e cala lentamente."},"aurora":{"nm":"Aurora radio","sh":"Au","t":"Propagazione aurorale (Au)","h":"Un'aurora boreale riflette le onde VHF ma le agita velocissimamente: ogni segnale si spande su alcune centinaia di Hz.","l":"Il CW diventa un soffio ruvido, come sussurrato; non si sente più la nota. Su 50 e 144 MHz, puntando a nord durante le tempeste magnetiche."},"galactic":{"nm":"Rumore galattico","sh":"20–40 MHz","t":"Rumore della Via Lattea","h":"Il centro della galassia emette un soffio radio scoperto da Karl Jansky nel 1932 verso 20 MHz. Sale e scende con la rotazione della Terra.","l":"Un rumore di fondo che sale lentamente e poi ridiscende, ogni giorno circa 4 minuti prima. Visibile con un semplice dipolo tra 20 e 40 MHz.","n":"un giorno ridotto a 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"Telemetria di CubeSat","h":"I piccoli satelliti inviano regolarmente le loro misure (batteria, temperature) in FSK o GMSK a 1200 o 9600 baud, verso 435–438 MHz.","l":"Raffiche regolari che scendono un po' ogni volta, per effetto Doppler, durante il passaggio (scheda 41).","n":"scala ridotta, passaggio accelerato"},"issfm":{"nm":"ISS in FM","sh":"145,800 MHz","t":"Stazione spaziale (ISS): voce in FM","h":"Gli astronauti parlano con scuole e radioamatori in FM su 145,800 MHz. La stazione vola a 28 000 km/h: durante il passaggio la frequenza ricevuta scivola da circa +3,5 kHz a −3,5 kHz.","l":"Una banda di voce FM che si sposta lentamente da destra a sinistra durante i 10 minuti del passaggio (scheda 41).","n":"passaggio di 10 min ridotto a 10 s"},"buzzer":{"nm":"UVB-76 «The Buzzer»","sh":"4625 kHz","t":"UVB-76, «The Buzzer» (4625 kHz)","h":"Una stazione militare russa che da decenni trasmette un ronzio di circa un secondo, circa 25 volte al minuto, a volte interrotto da un messaggio vocale.","l":"Una portante fissa e, a ogni ronzio, una colonna di righe fitte dall'alto in basso. Facile da trovare su 4625 kHz in USB."},"pip":{"nm":"«The Pip»","sh":"3756 / 5448 kHz","t":"«The Pip»: bip senza fine","h":"Un altro radiofaro militare russo in onde corte, che ripete piccoli bip brevi giorno e notte, a volte interrotti da messaggi.","l":"Una riga fissa interrotta da un bip breve circa 50 volte al minuto; all'orecchio, un «pip… pip…» regolare che non si ferma mai.","n":"ritmo approssimato"},"squeaky":{"nm":"«Squeaky Wheel»","sh":"OC","t":"«Squeaky Wheel»: la ruota che cigola","h":"Un radiofaro militare russo in onde corte, battezzato dagli ascoltatori secondo il suo motivo sonoro ripetuto.","l":"Un piccolo motivo di due suoni, uno dei quali sale, ripetuto in loop: come una ruota che cigola.","n":"imitazione approssimata"},"codar":{"nm":"CODAR","sh":"radar oceanico","t":"CODAR: radar delle correnti marine","h":"Radar costieri spazzano una banda di frequenze una o due volte al secondo per misurare correnti e onde.","l":"Diagonali parallele regolari e uno «swish» ripetuto; verso 4,5–5,5 MHz, 13 MHz e 25 MHz, spesso giorno e notte.","n":"scala ridotta"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Modem militare STANAG 4285","h":"Modulazione di fase 8-PSK a 2400 baud su una portante di 1800 Hz, con una sequenza di prova ogni 107 ms per seguire il canale.","l":"Un blocco pieno di circa 3 kHz; all'orecchio, un soffio con un ronzio regolare (scheda 43)."},"link11":{"nm":"Link-11","sh":"16 toni","t":"Link-11: collegamento dati navale","h":"Sedici toni da 605 a 2915 Hz trasmessi insieme, ciascuno modulato in fase 75 volte al secondo.","l":"Un pettine di quattordici righe regolari da 935 a 2365 Hz, più due righe a parte a 605 e 2915 Hz; all'orecchio, un ronzio musicale (scheda 43)."},"numbers":{"nm":"Stazione dei numeri","sh":"voce","t":"Stazione dei numeri","h":"A un'ora fissa, una piccola melodia di chiamata, poi una voce (spesso sintetica) legge gruppi di cinque cifre, in AM o SSB.","l":"La melodia a note staccate, poi gruppi regolari di sillabe separati da silenzi (scheda 43).","n":"voce imitata, senza cifre vere"},"rttydwd":{"nm":"RTTY meteo DWD","sh":"50 Bd / 450 Hz","t":"RTTY meteo del DWD (Germania)","h":"Come l'RTTY dei radioamatori, ma a 50 baud con 450 Hz di shift: il servizio meteorologico tedesco trasmette bollettini e previsioni marine in chiaro.","l":"Due righe molto più distanti e un ritmo un po' più rapido. Tra un bollettino e l'altro, la chiamata «CQ CQ CQ DE DDK2 DDH7 DDK9» e poi RYRYRY. Su 4583, 7646 e 10 100,8 kHz, anche 147,3 kHz (scheda 32)."},"mfsk16":{"nm":"MFSK16","sh":"16 toni","t":"MFSK16: sedici toni","h":"Sedici toni distanti 15,625 Hz, uno alla volta, 15,625 volte al secondo; ogni tono porta quattro bit, protetti da un codice correttore.","l":"Una banda di 316 Hz fatta di piccoli gradini che saltano di continuo, dopo un tono fisso all'inizio. All'orecchio, una musichetta veloce, come un flauto. Serve anche a inviare piccole immagini."},"sitora":{"nm":"SITOR-A (ARQ)","sh":"telex","t":"SITOR-A: il telex marittimo in ARQ","h":"La stazione invia blocchi di tre caratteri (210 ms, 100 baud, shift di 170 Hz) ogni 450 ms; tra un blocco e l'altro, l'altra stazione risponde con un segnale breve per dire «ricevuto» o «ripeti».","l":"Raffiche brevi e regolari, con una piccola risposta più debole in mezzo: un «cip-cip» da grillo. Ormai raro in onde corte."},"dscvhf":{"nm":"DSC VHF (canale 70)","sh":"DSC","t":"DSC: chiamata selettiva digitale sul canale 70","h":"Una raffica di circa mezzo secondo a 1200 baud, su due toni di 1300 e 2100 Hz: porta il numero MMSI della nave, il tipo di chiamata e, in caso di soccorso, la posizione.","l":"Un «brrrt» breve e acuto su 156,525 MHz, che inizia con una serie di bit alternati. In onde medie e corte il DSC è in FSK a 100 baud, come il NAVTEX (scheda 20)."},"selcal":{"nm":"SELCAL aviazione","sh":"4 toni","t":"SELCAL: chiamata selettiva degli aerei in onde corte","h":"Il controllo chiama un aereo preciso con due impulsi di circa un secondo, ciascuno fatto di due toni fra sedici (da 312,6 a 1479,1 Hz). A bordo si accende una spia e suona un cicalino: l'equipaggio non deve ascoltare di continuo.","l":"Due accordi in successione, «bing-bong», tra i messaggi vocali delle frequenze aeronautiche in SSB, per esempio 5616 o 8864 kHz."},"dcs":{"nm":"DCS","sh":"134,4 bit/s","t":"DCS: il subtono digitale","h":"Invece di un tono continuo come il CTCSS, la radio invia sotto la voce una parola di 23 bit ripetuta senza sosta, a 134,4 bit al secondo. Alla fine, un tono a 134,4 Hz chiude lo squelch senza rumore.","l":"Visto nel suono del ricevitore FM: una banda irregolare in fondo, sotto i 300 Hz, e un rombo sordo se il filtro della radio lo lascia passare (scheda 10)."},"t1750":{"nm":"Tono a 1750 Hz","sh":"ponte","t":"Tono a 1750 Hz: aprire un ponte ripetitore","h":"Un breve tono a 1750 Hz (circa 0,5-1 s) all'inizio della trasmissione apre ancora alcuni ponti radioamatoriali europei; il ponte risponde spesso con un bip al rilascio.","l":"Una riga corta a 1750 Hz, poi la voce, poi il bip del ponte (scheda 10)."},"ncdxf":{"nm":"Beacon NCDXF","sh":"14,100 MHz","t":"Beacon NCDXF / IARU: provare la propagazione","h":"Diciotto beacon nel mondo trasmettono a turno, dieci secondi ciascuno, su 14,100, 18,110, 21,150, 24,930 e 28,200 MHz: il nominativo in Morse, poi quattro linee di un secondo a 100 W, 10 W, 1 W e 0,1 W.","l":"Un nominativo, poi quattro linee sempre più deboli: se senti ancora l'ultima, la propagazione verso quel beacon è ottima. Qui 4U1UN (New York) e poi VE8AT (Canada) (scheda 30)."},"lrpt":{"nm":"Meteor-M LRPT","sh":"137,9 MHz","t":"Satelliti Meteor-M: immagini LRPT","h":"I satelliti meteo russi Meteor-M inviano le immagini in digitale: modulazione di fase a quattro stati (QPSK), 72 000 simboli al secondo, larga circa 120 kHz.","l":"Un blocco pieno dai bordi arrotondati che scivola lentamente durante il passaggio (effetto Doppler); all'orecchio, un semplice soffio. Su 137,9 o 137,1 MHz, decodificato con SatDump (scheda 41).","n":"scala ridotta"},"quindar":{"nm":"Toni Quindar","sh":"NASA","t":"Toni Quindar: i bip dell'Apollo","h":"Quando il controllo di Houston preme il microfono, un bip a 2525 Hz (250 ms) accende i trasmettitori delle stazioni a terra; al rilascio, un bip a 2475 Hz li spegne.","l":"Un bip acuto prima di ogni frase e un altro, un po' più grave, dopo: il suono celebre delle registrazioni delle missioni Apollo."},"wow":{"nm":"Segnale «Wow!»","sh":"1977","t":"Il segnale «Wow!» (15 agosto 1977)","h":"Il radiotelescopio Big Ear (Ohio) captò per 72 secondi un segnale stretto e fortissimo vicino alla riga dell'idrogeno, intorno a 1420,456 MHz. L'astronomo Jerry Ehman scrisse «Wow!» sul tabulato. Non è mai stato rivisto e la sua origine è ancora discussa.","l":"Una riga sottile che esce dal rumore, cresce e ridiscende: la forma del passaggio di una sorgente fissa nel fascio dell'antenna. È una ricostruzione: non esiste alcuna registrazione sonora.","n":"72 s ridotti a 12 s"},"frb":{"nm":"Lampo radio veloce","sh":"FRB","t":"Lampo radio veloce (FRB)","h":"Un lampo radio di pochi millisecondi proveniente da un'altra galassia; il primo è stato scoperto nel 2007. Il gas attraversato ritarda molto le basse frequenze: il lampo arriva allungato, gli acuti per primi.","l":"Una sola curva che cade dall'alto al basso dello spettro, poi più nulla. Alcuni si ripetono; la maggior parte si vede una volta sola.","n":"molto rallentato ed esagerato"},"letterb":{"nm":"Beacon a una lettera","sh":"D, P, S, C…","t":"Beacon a una lettera","h":"Trasmettitori della marina russa ripetono all'infinito una sola lettera in Morse, ciascuno a 100 Hz dal vicino: D, P, S, C, A, F, K o M secondo il sito.","l":"Linee tratteggiate parallele, vicinissime, ognuna con il suo ritmo. Intorno a 4558, 5154, 7039, 10 872, 13 528 e 16 332 kHz, in CW."},"sid":{"nm":"Brillamento solare in VLF","sh":"SID","t":"Brillamento solare visto in VLF (SID)","h":"I trasmettitori VLF delle marine (20,9 kHz in Francia, 23,4 kHz in Germania…) si propagano tra il suolo e la ionosfera. Quando arriva un brillamento solare, i suoi raggi X modificano la base della ionosfera in pochi minuti e il livello ricevuto salta di colpo.","l":"Una banda stretta e regolare (il segnale MSK del trasmettitore) che diventa bruscamente più forte, poi torna lentamente alla normalità. Bastano una spira di filo e una scheda audio: un progetto classico dei gruppi astrofili.","n":"un'ora ridotta a 12 s"},"qrn":{"nm":"Scariche di temporale","sh":"QRN","t":"Scariche di temporale (QRN)","h":"Ogni fulmine è un trasmettitore potentissimo che copre tutte le frequenze insieme. In onde medie e corte si sentono temporali a migliaia di chilometri, soprattutto d'estate e sulle bande basse.","l":"Righe orizzontali irregolari su tutta la larghezza; schiocchi secchi all'orecchio. Il noise blanker (NB) aiuta un po', un'antenna a telaio aiuta di più."},"fading":{"nm":"Evanescenza selettiva","sh":"QSB","t":"Evanescenza selettiva (QSB)","h":"In onde corte il segnale arriva per più percorsi attraverso la ionosfera. Secondo la frequenza si sommano o si annullano: un avvallamento stretto passeggia nel segnale.","l":"Una zona scura che si sposta lentamente nella stazione AM. Quando passa sulla portante, al centro, il suono diventa rauco e distorto per qualche secondo; la rivelazione sincrona o l'ascolto in SSB lo correggono."},"plc":{"nm":"PLC","sh":"2–30 MHz","t":"PLC: Internet dalle prese elettriche","h":"Gli adattatori PLC inviano i dati sui fili di casa con centinaia di portanti tra 2 e 30 MHz (più in alto nei modelli recenti), una ogni 24,4 kHz. I fili irradiano come un'antenna.","l":"Un pettine di righe regolari che lampeggia a pacchetti, con buchi sulle bande radioamatoriali (tacche previste dalla norma); all'orecchio, un crepitio che segue il traffico Internet (scheda 43).","n":"scala ridotta"},"fence":{"nm":"Recinto elettrico","sh":"tac… tac…","t":"Recinto elettrico","h":"L'elettrificatore manda nel filo un impulso di alcune migliaia di volt circa una volta al secondo. Se l'erba tocca il filo o un isolatore è rovinato, scocca una scintilla che irradia su tutte le frequenze.","l":"Una riga orizzontale sottilissima su tutta la larghezza, a intervalli perfettamente regolari; un «tac… tac…» dalle onde lunghe fino alle VHF. Il ritmo regolare lo distingue dal temporale."},"gsm":{"nm":"Telefono GSM","sh":"217 Hz","t":"Telefono GSM vicino a un altoparlante","h":"Un telefono 2G trasmette a raffiche di 0,577 ms, 217 volte al secondo. Un amplificatore audio mal schermato rivela queste raffiche e le rende udibili.","l":"Un pettine di righe ogni 217 Hz; il famoso «ta-ta-tatata» appena prima che il telefono squilli, poi un ronzio continuo durante la chiamata. Sempre più raro: le reti 2G stanno chiudendo."},"jjy":{"nm":"JJY","sh":"40 / 60 kHz","t":"Segnale orario JJY (Giappone, 40 e 60 kHz)","h":"A ogni secondo la portante è a piena potenza per 0,8 s (bit 0), 0,5 s (bit 1) o 0,2 s (marcatore), poi scende al 10 %. È il contrario di DCF77, che cala all'inizio del secondo.","l":"Una riga fissa che si indebolisce alla fine di ogni secondo, prima o dopo. Trasmettitori di Fukushima (40 kHz) e Saga-Fukuoka (60 kHz), per gli orologi radiocontrollati del Giappone."},"rwm":{"nm":"RWM","sh":"4996 kHz","t":"Segnale orario RWM (Mosca)","h":"In telegrafia su 4996, 9996 e 14 996 kHz: un impulso di 100 ms ogni secondo e, in altri minuti, dieci impulsi al secondo. Il nominativo RWM è trasmesso in Morse due volte all'ora.","l":"Il nominativo, poi una riga tagliata in «tic» regolari e infine in punti rapidi. Da ascoltare in CW o SSB.","n":"estratto condensato"},"bpm":{"nm":"BPM","sh":"2,5–15 MHz","t":"Segnale orario BPM (Cina)","h":"La stazione di Pucheng (Shaanxi) trasmette in AM su 2,5, 5, 10 e 15 MHz: un tic di 10 ms a 1000 Hz ogni secondo (300 ms al minuto) e, in certi minuti, tic di 100 ms per il tempo UT1. Il nominativo BPM è dato in Morse e poi a voce.","l":"Nel suono demodulato: il nominativo, poi righe cortissime a 1000 Hz, una al secondo, con una più lunga al minuto. Spesso mescolata a WWV sulle stesse frequenze.","n":"estratto condensato"},"humpback":{"nm":"Megattera","sh":"canto","t":"Il canto della megattera","h":"In inverno, nelle zone di riproduzione, i maschi cantano: una serie di lamenti, brontolii e grida che forma un tema, ripetuto identico per ore e che cambia da una stagione all'altra. Gli idrofoni lo sentono a decine di chilometri.","l":"Tratti spessi con le loro armoniche, che salgono o scendono lentamente tra 100 Hz e qualche kHz; la stessa serie ritorna dopo pochi secondi. L'eco sulla superficie e sul fondo allunga ogni nota."},"bluewhale":{"nm":"Balenottera azzurra","sh":"×10","t":"La balenottera azzurra: il richiamo più grave","h":"L'animale più grande del mondo emette richiami molto gravi (da 10 a 40 Hz) e molto potenti, lunghi da 10 a 20 secondi e ripetuti per ore: arrivano a centinaia di chilometri. Per sentirli, la registrazione viene accelerata dieci volte.","l":"Una parte pulsata, poi una lunga nota che scende appena, con le armoniche sopra; la sequenza si ripete. La scala indica le frequenze reali.","n":"accelerato 10 volte"},"finwhale":{"nm":"Balenottera comune","sh":"20 Hz","t":"La balenottera comune: gli impulsi a 20 Hz","h":"La balenottera comune emette impulsi di circa un secondo che scendono da circa 25 a 18 Hz, a intervalli regolari, a volte per giorni. Negli anni '50 e '60 questi «segnali a 20 Hz» incuriosirono le reti d'ascolto della marina statunitense prima di essere attribuiti a questa balena.","l":"Brevi trattini tutti uguali, in serie regolare o a coppie, come i battiti di un cuore lentissimo; ognuno scende un poco di frequenza. La scala indica le frequenze reali.","n":"accelerato 10 volte"},"sperm":{"nm":"Capodoglio","sh":"clic","t":"I clic del capodoglio","h":"Il capodoglio caccia in immersione profonda con il suo sonar: clic potentissimi, circa uno al secondo, che accelerano in uno «scricchiolio» quando si avvicina alla preda. Tra loro i capodogli si scambiano «code», brevi serie di clic il cui ritmo varia da un clan all'altro.","l":"Tratti orizzontali su tutta la larghezza, regolarmente distanziati, poi fitti in un ronzio (lo scricchiolio), poi un piccolo motivo ritmico: la coda. Ogni clic è fatto di più impulsi ravvicinati, dovuti alle riflessioni nella testa dell'animale."},"dolphin":{"nm":"Tursiope","sh":"fischi","t":"Fischi e clic del delfino","h":"Il tursiope fischia tra circa 5 e 20 kHz; ogni individuo ha un «fischio firma» che gli fa da nome. Per cacciare e orientarsi emette anche treni di clic brevissimi, fino a diverse centinaia al secondo.","l":"Curve sottili che salgono e riscendono, spesso ripetute identiche, e raffiche di tratti orizzontali per l'ecolocalizzazione. Le frequenze sono divise per 3 per restare udibili; la scala indica i valori reali.","n":"suonato 3 volte più grave"},"orca":{"nm":"Orca","sh":"richiami pulsati","t":"I richiami pulsati dell'orca","h":"Le orche comunicano con richiami pulsati: treni di impulsi così rapidi (da 500 a 2000 al secondo) da essere percepiti come una nota, con un salto brusco di altezza. Ogni gruppo familiare ha il suo «dialetto».","l":"Una pila di tratti paralleli (le armoniche) che salgono o scendono insieme, con una rottura netta a metà del richiamo; a volte un fischio sottile e più acuto."},"bseal":{"nm":"Foca barbata","sh":"trillo","t":"Il trillo della foca barbata","h":"In primavera, sotto la banchisa artica, il maschio emette lunghi trilli che scendono a spirale da diversi kHz fino a qualche centinaio di hertz, a volte per un minuto. Servono a difendere un territorio e ad attirare le femmine.","l":"Una curva ondulata che scivola dall'alto in basso della scala, come una molla che si distende, poi una nota grave alla fine.","n":"accorciato"},"shrimp":{"nm":"Gamberi pistola","sh":"scogliera","t":"I gamberi pistola (alfeidi)","h":"Chiudendo di scatto la grossa chela, il gambero spara un getto d'acqua così veloce da creare una bolla di cavitazione; implodendo, la bolla schiocca come un colpo di pistola. Migliaia di gamberi formano il rumore di fondo delle scogliere e possono disturbare i sonar.","l":"Una pioggia di punti e brevi tratti orizzontali su tutta la larghezza, senza alcun ordine; in cuffia, un crepitio continuo come una frittura."},"sonar":{"nm":"Sonar attivo","sh":"ping","t":"Il ping di un sonar attivo","h":"Una nave invia un potente impulso sonoro (qui verso 3,5 kHz, la gamma dei sonar di scafo delle fregate) e ascolta l'eco: il ritardo dà la distanza, lo spostamento di frequenza (effetto Doppler) la velocità del bersaglio. Il suono torna anche come una coda dal fondo e dalla superficie: il riverbero.","l":"Un tratto breve e forte, una coda che si spegne, poi l'eco, molto più debole e un po' spostato in frequenza. Il secondo ping è una spazzata di frequenza (chirp), che misura meglio la distanza."},"propeller":{"nm":"Elica di nave","sh":"cavitazione","t":"L'elica di una nave che passa","h":"Le pale dell'elica creano bolle di cavitazione che implodono: un soffio largo, che pulsa al ritmo del passaggio delle pale. Le macchine aggiungono righe fisse. I sonaristi analizzano questo ritmo (analisi DEMON) per contare le pale e la velocità di rotazione, e riconoscere la nave.","l":"Un soffio su una banda larga, striato da bande orizzontali al ritmo delle pale, con alcuni tratti verticali fissi (motore, riduttore). Tutto cresce e poi si spegne quando la nave passa sopra l'idrofono."},"uqc":{"nm":"Telefono subacqueo","sh":"UQC 8 kHz","t":"Il telefono subacqueo (UQC, «Gertrude»)","h":"Sottomarini e navi si parlano sott'acqua con un telefono acustico: la voce viene trasmessa in banda laterale unica sopra una portante di 8,0875 kHz, emessa da un trasduttore nello scafo. Portata: qualche chilometro.","l":"Una banda di voce SSB sopra gli 8 kHz; demodulata, una voce lontana che ondeggia e risuona per gli echi su superficie e fondo. La visualizzazione è dimezzata; la scala indica le frequenze reali.","n":"scala dimezzata"},"zevs":{"nm":"ZEVS 82 Hz","sh":"ELF","t":"ZEVS: la radio dei sottomarini a 82 Hz","h":"Le onde radio penetrano pochissimo nell'acqua di mare, tranne alle frequenze estremamente basse (ELF). Il trasmettitore russo ZEVS, nella penisola di Kola, trasmette a 82 Hz con linee d'antenna lunghe decine di chilometri per raggiungere i sottomarini in immersione profonda. La velocità è minima: pochi caratteri al minuto.","l":"Un tratto sottile a 82 Hz accanto alla riga di rete a 50 Hz e alle sue armoniche, con i disturbi dei temporali. In cuffia, un ronzio grave appena udibile; si riceve con un grande telaio e una scheda audio. L'equivalente americano, a 76 Hz, ha chiuso nel 2004."},"bloop":{"nm":"Il «Bloop»","sh":"1997","t":"Il «Bloop» (1997)","h":"Nel 1997 gli idrofoni della NOAA nel Pacifico captarono un suono molto grave che saliva rapidamente, udito a migliaia di chilometri. A lungo misterioso, dal 2012 è attribuito a un terremoto di ghiaccio: un enorme iceberg che si spacca.","l":"Una banda larga che sale in pochi secondi, con le sue armoniche, poi si spegne lentamente. Ricostruzione, accelerata 16 volte come la registrazione diffusa dalla NOAA.","n":"accelerato 16 volte"}}},"pl":{"ui":{"title":"VSISA","mystery":"Tajemniczy dźwięk","play":"▶ Słuchaj","stop":"■ Stop","noise":"Szum","volume":"Głośność","loop":"Zapętlaj","specwf":"Widmo + wodospad","cursor":"kursor","footprint":"Odcisk","dur":"{s} s z góry na dół","avg":"średnia z całego sygnału","press":"Naciśnij Słuchaj: sygnał przewija się tutaj","count":"{n} sygnałów, w kolejności karty 6","myst":"Tryb zagadki","mystTags":"Słuchaj i patrz, potem wybierz właściwą odpowiedź","quizH":"Co to za sygnał?","quizLead":"Włącz odsłuch, obserwuj widmo, wodospad i odcisk, potem odpowiedz.","score":"Wynik","good":"Dobrze!","bad":"Pudło: to był {x}.","next":"Następny tajemniczy dźwięk","principle":"Zasada","screen":"Na ekranie","sheet":"karta","book":"Książka: karta {r}","lang":"Język","signals":"Sygnały","f1":"Sygnały symulowane na stronie (12 000 próbek na sekundę): z karty 6 książki OpenBookRadio, inne sygnały z książki oraz bonusy. W przypadku sygnałów radiowych (AM, FM, AIS, LoRa…) widać symulowaną częstotliwość pośrednią, jak na ekranie SDR; niektóre są w zmniejszonej skali lub przyspieszone, co jest zaznaczone. W AM, SSB, FM, FM stereo, ISS i zanikach słychać zdemodulowany dźwięk jak z głośnika odbiornika, a ekran pokazuje sygnał radiowy; głos jest syntetyczny i nie mówi prawdziwych słów.","f2":"Czas w wodospadzie i odcisku płynie w dół. Licencja CC BY-NC-SA 4.0, za darmo, nie na sprzedaż.","night":"Tryb nocny","day":"Tryb dzienny","visits":"odwiedziny","plays":"odtworzenia","book_dl":"Pobierz książkę","book_dl2":"Pobierz książkę OpenBookRadio (za darmo, PDF i EPUB, 13 języków)","display":"Wygląd","theme_day":"Dzień","theme_night":"Noc (czerwony)","theme_phos":"Zielony luminofor","theme_phosb":"Niebieski luminofor","theme_phosa":"Pomarańczowy luminofor","w3d":"Wodospad 3D","w3dHint":"przeciągnij, aby obrócić"},"groups":["Głos analogowy","Telegrafia","Dane","Obrazy","Lotnictwo, morze i ratownictwo","Wywołanie, podtony i przywoławcze","Radiosondy, czujniki i urządzenia połączone","Emisje KF i ciekawostki","Radiofonia i czas","Szerokie pasmo","Bonus: dźwięki z kosmosu","Bonus: ciekawostki fal krótkich","Bonus: dźwięki podwodne"],"modes":{"am":{"sh":"radio","t":"AM: modulacja amplitudy","h":"Siła nośnej podąża za dźwiękiem: krzywa „puchnie” i „opada”.","l":"Stała kreska pośrodku (nośna) i po obu stronach dwie jednakowe wstęgi boczne. Szerokość około 6–9 kHz. Radiofonia na falach krótkich i średnich, lotnictwo (karty 12 i 14).","r":[["Odsłuch","Dżingiel, potem prezenter na tle muzyki. Obie wstęgi boczne są lustrzane: po obu stronach nośnej widać melodię, a potem głos."]]},"ssb":{"t":"SSB: jedna wstęga boczna","h":"Zostaje tylko jedna wstęga boczna, bez nośnej: nic, gdy nikt nie mówi.","l":"Brak środkowej kreski, jedno pasmo około 2,7 kHz, które żyje tylko podczas mówienia. USB powyżej 10 MHz, LSB poniżej (krótkofalowcy). Źle dostrojony głos brzmi jak „kaczka” (karty 11 i 29)."},"fm":{"sh":"głos","t":"FM: modulacja częstotliwości","h":"Amplituda się nie zmienia; to drgania zagęszczają się lub rozrzedzają z dźwiękiem.","l":"Sygnał tańczy wokół swojej częstotliwości, szerszy przy głośnym dźwięku: 12,5 kHz na kanał w wąskim FM (krótkofalówki, przemienniki), 200 kHz w radiu FM (karty 2 i 13).","r":[["Odsłuch","Na końcu krótkie „kszsz”: blokada szumów zamyka się, gdy nadajnik przestaje nadawać."]]},"cw":{"t":"CW: Morse","h":"Nośna jest włączana i wyłączana: kreski i kropki.","l":"Bardzo cienka kreska przerywana w rytmie Morse'a; piszczenie w uchu. Tutaj „CQ” (karta 48).","r":[["Szybkość","20 słów/min, kropka 60 ms, na 700 Hz: „CQ CQ CQ DE F4ABC K”"],["Na słuch","Czyste piski, długie i krótkie, na jednym tonie"],["Dekodowanie","Na słuch, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: dwie częstotliwości","h":"Częstotliwość przeskakuje między dwiema wartościami, jedną dla 0, drugą dla 1.","l":"Dwie równoległe kreski: 170 Hz odstępu u krótkofalowców (45,45 bodów), 450 lub 850 Hz w komunikatach pogodowych. Regularne „tidilidi” (karta 32).","r":[["Kod","Baudot ITA2: 5 bitów + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Tekst","RYRYRYRY CQ CQ DE F4ABC"],["Dekodowanie","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 bodów: APRS i packet","h":"Dwa tony akustyczne, 1200 i 2200 Hz, podane do nadajnika FM.","l":"Za odbiornikiem FM (dźwięk z głośnika): pasmo od 1200 do 2200 Hz w krótkich paczkach. Na słuch sekundowe „grrrt” (karty 35 i 36).","r":[["Częstotliwość","144,800 MHz w Europie (APRS), FM"],["Ramka","Flagi 0x7E, potem dane AX.25 w NRZI"],["Dekodowanie","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"t":"PSK31: modulacja fazy","h":"Częstotliwość się nie zmienia, odwraca się faza; przy każdym odwróceniu amplituda spada.","l":"Bardzo cienka kreska około 60 Hz, lekko „pleciona”. W 3 kHz mieszczą się dziesiątki stacji (karta 29).","r":[["Kod","Varicode: 0 = odwrócenie fazy, 1 = bez zmiany; w spoczynku dwie bliźniacze kreski"],["Gdzie słuchać","14 070 kHz, 3580 kHz"],["Dekodowanie","fldigi"]]},"ft8":{"t":"MFSK / FT8: osiem tonów","h":"Częstotliwość rośnie i maleje skokami po 6,25 Hz, 0,16 s na skok.","l":"Pasma około 50 Hz, które trwają 12,6 s i wracają co 15 s, zsynchronizowane z zegarem: kilka stacji naraz w 3 kHz, np. na 7,074 MHz (karta 29).","r":[["Ramka","79 symboli po 0,16 s, trzy wzory Costasa (początek, środek, koniec); tutaj osiem stacji"],["Częstotliwości","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Dekodowanie","WSJT-X, JTDX (dokładny zegar PC)"]]},"ft4":{"t":"FT4: FT8 do zawodów","h":"Cztery tony co 20,8 Hz, 20,8 bodów: 105 symboli w 5 s, w okienkach 7,5 s.","l":"Pasma około 90 Hz, krótsze i szersze niż FT8, wracające co 7,5 s. 14 080, 7047,5 kHz (karta 29)."},"olivia":{"t":"Olivia 8/250: osiem tonów","h":"Osiem tonów co 31,25 Hz, zawsze jeden naraz, przeskakujących losowo; kodowanie Walsha i przeplot.","l":"Blok rozsianych kropek na 250 Hz; dekoduje głęboko pod szumem. Na słuch mała losowa melodia (karta 29)."},"hell":{"t":"Feld Hell: pisanie nośną","h":"Nośna jest włączana i wyłączana punkt po punkcie: każda litera to kolumny po 14 punktów, skanowane od dołu do góry (245 punktów na sekundę).","l":"W wodospadzie poszarpana kreska; dopiero ekran programu (fldigi) rysuje litery. Na słuch delikatne trzeszczenie (karta 29)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Cztery poziomy częstotliwości: każdy symbol niesie dwa bity.","l":"Prostokątny blok 6–12,5 kHz, pełny jak szum, często w paczkach (DMR dzieli kanał na dwie szczeliny czasowe). Na słuch chrapliwe „frrr” (karta 46)."},"mt63":{"t":"MT63: wiadomości alarmowe (NBEMS)","h":"64 tony naraz, każdy powoli modulowany, z dużą nadmiarowością.","l":"Płaski blok 1 lub 2 kHz wokół 1500 Hz, o ostrych brzegach; równy szum. Przechodzi nawet przez mikrofon przyłożony do głośnika (karta 31)."},"lora":{"t":"LoRa: rampy częstotliwości (chirpy)","h":"Częstotliwość przemiata całą szerokość i zaczyna od dołu: położenie skoku niesie dane.","l":"Równoległe przekątne, łatwe do rozpoznania: Meshtastic i MeshCore na 869,525 MHz lub 433 MHz, czujniki LoRaWAN (karty 13, 23 i 24)."},"sstv":{"t":"SSTV: obrazy w dźwięku","h":"Impuls synchronizacji na 1200 Hz, potem częstotliwość podąża za jasnością linii, od 1500 (czarny) do 2300 Hz (biały).","l":"Regularne kreski synchronizacji i chmura zmieniająca się z obrazem; „ćwierkający” dźwięk przez minutę lub dwie. 14,230 MHz, ISS na 145,800 MHz (karta 37).","r":[["Ramka","Nagłówek VIS, potem linie: synchro 1200 Hz, zielony, niebieski, czerwony; tutaj 20 linii planszy testowej"],["Dekodowanie","QSSTV, MMSSTV, Robot36 na smartfonie"]]},"fax":{"nm":"Faks pogodowy","t":"Faks pogodowy: 1500 Hz czarny, 2300 Hz biały","h":"Częstotliwość płynnie przechodzi od czerni do bieli, 120 linii na minutę.","l":"Dwa stałe pasma na 1500 i 2300 Hz (800 Hz odstępu), regularne „tik-tak”. Publikowane są częstotliwości nośnej: słuchaj w USB 1,9 kHz niżej (karta 38).","r":[["Ramka","Ton startowy 300 Hz, linie fazujące (biały impuls), potem mapa"],["Dekodowanie","fldigi, JWX, HamFax"]]},"elt":{"nm":"Syrena ELT","t":"Syrena ELT / PLB na 121,5 MHz","h":"AM, której ton opada z 1600 do 300 Hz dwa do czterech razy na sekundę.","l":"Stała nośna i wstęgi boczne przesuwające się wachlarzem: „łuu-łuu” radiolatarni ratunkowych, także na 121,375 MHz do ćwiczeń (karty 27 i 28)."},"406":{"nm":"Radiolatarnia 406","t":"Radiolatarnia 406 MHz: paczka BPSK","h":"Pół sekundy nadawania: 160 ms czystej nośnej, potem faza przełącza się o ±1,1 radiana z szybkością 400 bit/s.","l":"Krótka kreseczka powracająca co 50 s, między 406,0 a 406,1 MHz; nic użytecznego do usłyszenia, potrzebny dekoder (EPIRB 406, karta 28)."},"adsb":{"t":"ADS-B / mod S (1090 MHz): impulsy","h":"Impulsy 0,5 µs, których położenie niesie bity (PPM); tutaj skala czasu jest mocno spowolniona.","l":"Bardzo krótkie poziome kreski na całej szerokości, setki na sekundę blisko lotniska; potrzebny klucz SDR (karta 15).","n":"skala czasu mocno spowolniona"},"acars":{"t":"ACARS: AM i dane MSK","h":"AM niosąca dwa tony, 1200 i 2400 Hz, z szybkością 2400 bit/s.","l":"Półsekundowe paczki z nośną i wstęgami bocznymi, na 131,525, 131,725 lub 131,825 MHz w Europie: na słuch „brrrt” (karta 16)."},"ais":{"t":"AIS: GMSK 9600 bodów na dwóch kanałach","h":"Wygładzone FSK (GMSK) w paczkach po 26 ms, raz na 161,975 MHz, raz na 162,025 MHz (skala zmniejszona).","l":"Dwie kolumny krótkich kresek 50 kHz od siebie, regularne klikanie; im więcej statków, tym gęściej (karta 19).","n":"skala zmniejszona"},"navtex":{"t":"NAVTEX i DSC na falach średnich i krótkich: FSK 170 Hz","h":"Jak RTTY: dwie częstotliwości 170 Hz od siebie, ale 100 bodów.","l":"Dwie równoległe kreski, ciągłe podczas komunikatu, na 518 i 490 kHz (NAVTEX) lub 2187,5 kHz (cyfrowe wywołanie selektywne) (karta 20).","r":[["Kod","SITOR-B, CCIR 476: 7 bitów z czterema „1”, z powtórzeniem FEC"],["Dekodowanie","fldigi, YaND"]]},"hfdl":{"t":"HFDL: samoloty na falach krótkich","h":"PSK 1800 bodów na podnośnej 1440 Hz.","l":"Paczki około 2,4 kHz między 2,9 a 22 MHz; szum modemu, który przychodzi i odchodzi (karta 17)."},"ctcss":{"t":"CTCSS: podton pod głosem","h":"Niski ciągły ton (67–254 Hz, tutaj 88,5 Hz) dodany do głosu.","l":"W dźwięku odbiornika FM: stała kreska na samym dole, pod głosem; otwiera blokadę szumów przemienników i krótkofalówek (karta 10)."},"dtmf":{"sh":"2 tony","t":"DTMF: dwa tony na klawisz","h":"Każdy klawisz wysyła jednocześnie ton niski (697–941 Hz) i wysoki (1209–1633 Hz).","l":"Pary kropek ułożone w ośmiu stałych kolumnach; „pip-pip” numerów telefonów i poleceń przemienników (karta 10).","r":[["Sekwencja","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tonów","t":"Selcall CCIR: tony po kolei","h":"Pięć tonów po 100 ms jeden po drugim, jeden na cyfrę.","l":"Małe schodki z kropek, powtarzane; szybkie „tululululu”, by wywołać jedno konkretne radio (karta 33).","r":[["Sekwencja","1 2 3 4 5, dwa razy; dekoduje ją też aplikacja SelCall dla UV-K1"]]},"pocsag":{"sh":"pagery","t":"POCSAG i FLEX: pagery","h":"FSK ±4,5 kHz; preambuła 1010…, potem dane (skala zmniejszona).","l":"Dwie wyraźne kreski podczas preambuły, potem pełne pasmo; przenikliwe „brrrrt”. 466,075 MHz, DAPNET 439,9875 MHz (karta 45).","n":"skala zmniejszona"},"ale":{"sh":"8 tonów","t":"ALE: automatyczne nawiązywanie łączności na KF","h":"Osiem tonów od 750 do 2500 Hz, 125 bodów, w paczkach.","l":"Blok około 2 kHz z drobnych kropek, sekunda lub dwie, czasem na kilku sąsiednich częstotliwościach; wysokie ćwierkanie (karta 34)."},"rs41":{"nm":"Radiosonda RS41","t":"Radiosonda RS41: ciągłe GFSK","h":"Wygładzone FSK 4800 bodów bez przerwy; częstotliwość powoli dryfuje, gdy sonda wznosi się i stygnie.","l":"Pasmo około 10 kHz przesuwające się ukośnie przez cały lot, między 400 a 406 MHz (karta 21)."},"ook":{"nm":"Czujniki 433","t":"Czujniki 433 MHz: OOK","h":"Nośna włącza się i wyłącza krótkimi lub długimi impulsami (wszystko albo nic); komunikat powtarza się trzy razy.","l":"Paczki drobnych kropek, często potrójne, na 433,92 MHz: stacje pogodowe, czujniki temperatury, piloty (karta 22)."},"fhss":{"t":"Bluetooth: skoki częstotliwości (FHSS)","h":"Częstotliwość zmienia się 1600 razy na sekundę wśród 79 kanałów (skala zmniejszona).","l":"Drobne kreski rozsiane wszędzie na 80 MHz, nigdy w tym samym miejscu, w okolicy 2,4 GHz (karta 25).","n":"skala zmniejszona"},"wspr":{"t":"WSPR: radiolatarnie propagacyjne","h":"Cztery tony co 1,46 Hz, 0,68 s na symbol, przez 110,6 s.","l":"Bardzo cienka kreska około 6 Hz trwająca prawie dwie minuty, co parzyste dwie minuty: trzeba mocno powiększyć (karta 29).","n":"fragment 24 s (emisja trwa 110,6 s)"},"qrss":{"t":"QRSS: bardzo wolny Morse","h":"Nośna włączana i wyłączana, kropki od 3 do 10 s, często na dwóch sąsiednich częstotliwościach (DFCW).","l":"Kreski szerokie na kilka Hz, czytane na dziesięciominutowym ekranie; niesłyszalne (karta 30).","n":"przyspieszone: kropka 0,6 s zamiast 3–10 s"},"texte":{"nm":"Tekst w wodospadzie","t":"Tekst w wodospadzie","h":"Każda linia obrazu staje się grupą tonów: dźwięk przypomina szum.","l":"Tekst lub rysunek pojawia się bezpośrednio na ekranie SDR (karta 40).","r":[["Uwaga","Nadawany od dołu obrazu: prosto w wodospadzie na żywo, do góry nogami w odcisku (czytanym z góry na dół)"]]},"vara":{"t":"Nowoczesne dane KF: VARA, Pactor, ARDOP","h":"Długie pełne paczki (OFDM lub PSK), a między nimi krótkie odpowiedzi drugiej stacji.","l":"Prostokąt około 2,4 kHz, który zatrzymuje się i rusza, z małym potwierdzeniem pośrodku; poszarpany szum (karta 29)."},"chirp":{"nm":"Jonosonda","t":"Jonosonda (chirp sounder)","h":"Powolna rampa częstotliwości przez całe pasmo KF; echa jonosfery przychodzą nieco później.","l":"Przekątna przemiatająca ekran, z równoległymi kreskami (echami); „ffuit”, które mija w ułamku sekundy."},"oth":{"nm":"Radar pozahoryzontalny","t":"Radar pozahoryzontalny („woodpecker”)","h":"Impulsy powtarzane 10 do 50 razy na sekundę, każdy szeroki na kilka kHz.","l":"Szeroki prążkowany blok pokrywający całe pasma; bardzo regularne stukanie dzięcioła na falach krótkich."},"parasites":{"nm":"Zakłócenia","sh":"zasilacz","t":"Zakłócenia z zasilacza impulsowego","h":"Sygnał prostokątny: jego częstotliwość i wszystkie harmoniczne wychodzą naraz.","l":"Grzebień regularnych prążków dryfujących razem na tle szumu: szukaj z NOISE FIND lub przenośnym odbiornikiem (karta K22)."},"mpx":{"nm":"FM stereo i RDS","t":"Radio FM stereo i RDS","h":"Zdemodulowany dźwięk (multipleks) zawiera kanał L+R, pilot 19 kHz, kanał L-R wokół 38 kHz i RDS na 57 kHz.","l":"Od 0 do 60 kHz po demodulacji: niski blok, cienka kreska na 19 kHz, słabszy blok pośrodku i RDS na samej górze (karta 12).","n":"skala ÷ 20; dźwięk stereo","r":[["Odsłuch","W słuchawkach: 4 s mono (środkowy blok L-R znika), potem 4 s stereo, melodia po lewej, akordy po prawej."]]},"dcf77":{"t":"Sygnał czasu DCF77 (77,5 kHz)","h":"Nośna spadająca do 15 % na 0,1 s (bit 0) lub 0,2 s (bit 1) na początku każdej sekundy.","l":"Stała kreska z czarną przerwą co sekundę; 59. sekunda jej nie ma, by zaznaczyć minutę (karta 12).","r":[["Uwaga","Tutaj nośna jest przeniesiona na 1000 Hz; 6. sekunda nie ma przerwy, jak 59. sekunda każdej minuty"]]},"ofdm":{"t":"OFDM: dziesiątki podnośnych","h":"Wiele gęsto upakowanych nośnych, każda wolna: suma wygląda jak szum.","l":"Płaski prostokąt o ostrych brzegach, zawsze obecny: DRM na KF (10 kHz), DAB+ (1,5 MHz), DVB-T, Wi-Fi. Na słuch ciągły szum (karty 12 i 25)."},"dsss":{"t":"Widmo rozproszone (DSSS): GPS, Wi-Fi 802.11b","h":"Dane miesza się z bardzo szybkim kodem: energia rozkłada się na dużą szerokość.","l":"Szeroki garb ledwo ponad szumem; GPS jest nawet pod szumem i bez obróbki go nie widać (karty 25 i 26)."},"hline":{"nm":"Linia wodoru","sh":"1420 MHz","t":"Linia wodoru 21 cm (1420,405 MHz)","h":"Zimny wodór w Drodze Mlecznej emituje bardzo słaby szum na 1420,405 MHz. Ruch ramion galaktyki przesuwa go przez efekt Dopplera: widać kilka małych garbów.","l":"W wodospadzie z sekundy na sekundę prawie nic: trzeba długo uśredniać, by garby wyłoniły się z szumu. Tutaj spójrz na średnie widmo po zatrzymaniu. Wystarczy czasza lub tuba, przedwzmacniacz i klucz SDR.","n":"sygnał mocno przesadzony"},"sun":{"nm":"Słońce","sh":"rozbłyski","t":"Słońce: rozbłyski radiowe typu III","h":"Elektrony wyrzucone przez rozbłysk przech
