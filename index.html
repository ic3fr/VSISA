<style>
/* Layout : un panneau de récepteur. Liste des signaux à gauche, spectre + waterfall en direct au centre, empreinte + fiche en dessous. */
:root{
  --odo-bg:#15110b;--odo-fg:#f3ead2;--odo-case:#0b0d10;
  --bg:#10141b; --panel:#171e28; --panel-2:#1d2633; --line:#2b3746;
  --fg:#e1e7ef; --muted:#8d9bad; --accent:#f2b544; --accent-ink:#1a1408;
  --ok:#5fcf8f; --bad:#ef6b6b;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html.night{--bg:#0a0000;--panel:#140202;--panel-2:#1e0404;--line:#3d0a08;--fg:#e2533f;--muted:#9c3428;--accent:#ff3b2f;--accent-ink:#140000;--ok:#ff8a6a;--bad:#c22a1c}

html.night,html.phos{--odo-bg:#000;--odo-fg:var(--fg);--odo-case:var(--panel)}
html.phos{--glow:57,255,106;--bg:#010801;--panel:#031203;--panel-2:#052005;--line:#0e4a12;--fg:#39ff6a;--muted:#1fa83f;--accent:#7dff9a;--accent-ink:#011a04;--ok:#b6ffc6;--bad:#ffd84a;
  --f-display:"VT323",ui-monospace,Menlo,Consolas,monospace;--f-body:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
html.phos .screen{background:#000}
html.phos body{text-shadow:0 0 4px rgba(var(--glow),.45)}
html.phos h1,html.phos .now h2,html.phos .card h3{font-weight:400;letter-spacing:.03em}
html.phos h1{font-size:clamp(2.1rem,5vw,3rem)}
html.phos .btn,html.phos select,html.phos .mode,html.phos .ref,html.phos .screen,html.phos .card{border-radius:0}
html.phos body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px);box-shadow:inset 0 0 120px rgba(0,0,0,.65)}
html.phos canvas{filter:drop-shadow(0 0 2px rgba(var(--glow),.35))}
html.phos.blue{--glow:90,190,255;--bg:#00040a;--panel:#020a16;--panel-2:#041226;--line:#0c3058;--fg:#5ab8ff;--muted:#2d78b8;--accent:#9fd8ff;--accent-ink:#000c1a;--ok:#c8ecff;--bad:#ffd84a}
html.phos.amber{--glow:255,176,0;--bg:#0a0500;--panel:#140b00;--panel-2:#201200;--line:#4a2c00;--fg:#ffb000;--muted:#b07600;--accent:#ffd060;--accent-ink:#1a0e00;--ok:#ffe7a8;--bad:#ff6a4a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
h1 small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.btn{font:500 .9rem var(--f-body);border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:6px;padding:8px 14px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--muted)}
.hdr-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.btn.book{border-color:var(--accent);color:var(--accent)}
.btn.book:hover{background:var(--accent);color:var(--accent-ink)}
.ref{text-decoration:none}
a.ref:hover{border-color:var(--accent)}
@media (max-width:560px){.langlbl span{display:none}.hdr-ctl select{max-width:44vw}}
.langlbl{display:flex;align-items:center;gap:8px;font:400 .8rem var(--f-mono);color:var(--muted)}
select{font:500 .9rem var(--f-body);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:38px;cursor:pointer}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:focus-visible,.mode:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;padding-right:4px}
@media (max-width:820px){.grid{grid-template-columns:1fr}aside{position:static;max-height:38vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:10px}}
.count{font:400 .75rem var(--f-mono);color:var(--muted);margin:0}
.group h2{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){.group ul{flex-direction:row;flex-wrap:wrap}}
.mode{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:baseline;font:500 .9rem var(--f-body);color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 10px;cursor:pointer}
.mode span{font:400 .72rem var(--f-mono);color:var(--muted);white-space:nowrap}
.mode:hover{background:var(--panel)}
.mode[aria-pressed="true"]{background:var(--panel-2);border-color:var(--accent)}
.mode[aria-pressed="true"] span{color:var(--accent)}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.now{min-width:0}
.now h2{font-family:var(--f-display);font-weight:700;font-size:1.9rem;margin:0;line-height:1.1;text-wrap:balance}
.now p{margin:0;color:var(--muted);font-family:var(--f-mono);font-size:.8rem}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.controls label{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:110px}
input[type=checkbox]{accent-color:var(--accent)}
.screen{background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.screen-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);font:400 .74rem var(--f-mono);color:var(--muted);letter-spacing:.04em}
.screen-head b{color:var(--fg);font-weight:500;text-transform:uppercase;letter-spacing:.1em}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:crosshair}
.ruler{position:relative;height:22px;background:var(--panel);border-top:1px solid var(--line);font:400 .7rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden}
.ruler span{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
.ruler span::before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:4px;background:var(--muted)}
.ruler span.first{transform:none}.ruler span.first::before{left:0}
.ruler span.last{transform:translateX(-100%)}.ruler span.last::before{left:auto;right:0}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
#w3{cursor:grab;touch-action:none}#w3:active{cursor:grabbing}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
.card h3{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0 0 4px;text-wrap:balance}
.card .lead{margin:0 0 12px;color:var(--fg);max-width:62ch}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:.9rem}
dt{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:3px}
dd{margin:0;min-width:0}
.ref{display:inline-block;margin-top:12px;font:500 .75rem var(--f-mono);color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.quiz{display:flex;flex-direction:column;gap:10px}
.quiz .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quiz .msg{font-weight:600}
.quiz .msg.ok{color:var(--ok)}.quiz .msg.bad{color:var(--bad)}
.score{font:500 .8rem var(--f-mono);color:var(--muted)}
.readout{font-variant-numeric:tabular-nums;color:var(--accent)}
footer{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
footer p{margin:0;max-width:110ch}
/* compteur à rouleaux, comme un compteur mécanique */
.odo-wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-left:auto}
.hdr-ctl{flex-basis:100%}
/* en-tête : VSISA à gauche ; à sa droite la description en haut et les compteurs en bas ; réglages dessous, à gauche */
header{flex-direction:column;align-items:stretch}
.ver{font-family:var(--f-mono);font-weight:500;font-size:.32em;letter-spacing:.06em;color:var(--accent);vertical-align:super}
.gh{position:relative;flex:none;align-self:flex-start;margin-left:auto;width:46px;height:46px;border-radius:50%;color:var(--fg);display:block}
.gh img{width:46px;height:46px;border-radius:50%;display:block;border:1px solid var(--line);background:var(--panel-2)}
.gh .gh-mark{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;padding:2px;border-radius:50%;background:var(--bg);box-sizing:content-box}
.gh.noav .gh-mark{position:static;width:38px;height:38px;padding:4px;background:none}
.gh:hover img{border-color:var(--accent)} .gh:hover .gh-mark{color:var(--accent)}
html.night .gh img,html.phos .gh img{filter:grayscale(1) contrast(1.1);opacity:.85}
.brand{display:flex;align-items:stretch;gap:6px 18px}
header h1{font-size:clamp(2.3rem,6vw,3.3rem);letter-spacing:.04em;line-height:1;align-self:center}
html.phos header h1{font-size:clamp(2.6rem,6.6vw,3.7rem)}
.brand-side{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding-block:2px}
.brand-desc{font-family:var(--f-mono);font-weight:400;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1.35}
header .odo-wrap{margin-left:0;justify-content:flex-start}
header .hdr-ctl{justify-content:flex-start}
@media (max-width:560px){.odo-d{font-size:.95rem}.odo-wrap{gap:6px 12px}.brand{gap:6px 10px}.brand-desc{font-size:.66rem;letter-spacing:.03em}.gh,.gh img{width:34px;height:34px}.gh{margin-right:4px}.gh .gh-mark{width:15px;height:15px}.gh.noav .gh-mark{width:28px;height:28px}}
.odo{display:flex;align-items:center;gap:8px}
.odo-lbl{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.odo-num{display:inline-flex;gap:2px;padding:3px;background:var(--odo-case);border:1px solid var(--line);border-radius:5px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.odo-d{position:relative;width:1.1em;height:1.55em;overflow:hidden;border-radius:2px;background:var(--odo-bg);font:600 1.15rem var(--f-mono)}
.odo-d::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55);z-index:2}
.odo-d::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0) 32%,rgba(255,255,255,.06) 50%,rgba(0,0,0,0) 68%,rgba(0,0,0,.6))}
.odo-strip{display:flex;flex-direction:column;will-change:transform}
.odo-strip span{display:block;height:1.55em;line-height:1.55em;text-align:center;color:var(--odo-fg)}
@media (prefers-reduced-motion:reduce){.odo-strip{transition:none!important}}
</style>

et messagerie","Radiosondes, capteurs et objets connectés","Modes HF et curiosités","Diffusion et temps","Large bande","Bonus : sons de l'espace","Bonus : curiosités des ondes courtes","Bonus : sons sous-marins"],"modes":{"406":{"nm":"Balise 406","sh":"BPSK","t":"Balise 406 MHz : salve BPSK","h":"Une demi-seconde d'émission : 160 ms de porteuse pure, puis la phase bascule de ±1,1 radian à 400 bit/s.","l":"Un petit trait court qui revient toutes les 50 s, entre 406,0 et 406,1 MHz ; rien à entendre d'utile, il faut un décodeur (EPIRB 406, fiche 28)."},"am":{"nm":"AM","sh":"radio","t":"AM : modulation d'amplitude","h":"La force de la porteuse suit le son : la courbe « gonfle » et « dégonfle ».","l":"Un trait fixe au centre (la porteuse), avec deux bandes latérales identiques de chaque côté. Environ 6 à 9 kHz de large. Radio en ondes courtes et petites ondes, aviation (fiches 12 et 14).","r":[["Écoute","Un jingle, puis l'animateur sur un fond musical. Les deux bandes latérales sont en miroir : on voit la mélodie, puis la voix, de chaque côté de la porteuse."]]},"ssb":{"nm":"BLU / SSB","sh":"USB","t":"BLU / SSB : bande latérale unique","h":"Il ne reste qu'une bande latérale, sans porteuse : rien quand on se tait.","l":"Pas de trait central, une seule bande d'environ 2,7 kHz qui ne vit que quand on parle. USB au-dessus de 10 MHz, LSB en dessous (radioamateurs). Mal calée, la voix devient « canard » (fiches 11 et 29)."},"fm":{"nm":"FM","sh":"voix","t":"FM : modulation de fréquence","h":"L'amplitude reste fixe ; ce sont les oscillations qui se serrent ou s'écartent avec le son.","l":"Le signal danse autour de sa fréquence, plus large quand le son est fort : 12,5 kHz par canal en FM étroite (talkies, relais), 200 kHz en radio FM (fiches 2 et 13).","r":[["Écoute","À la fin, le petit « kchh » : le squelch se ferme quand l'émetteur s'arrête."]]},"cw":{"nm":"CW","sh":"Morse","t":"CW : Morse","h":"La porteuse est allumée et éteinte : des traits et des points.","l":"Un trait très fin qui s'interrompt au rythme du Morse ; un bip à l'oreille. Ici « CQ » (fiche 48).","r":[["Vitesse","20 mots/min, point de 60 ms, à 700 Hz : « CQ CQ CQ DE F4ABC K »"],["À l'oreille","Bips purs, longs et courts, d'une seule note"],["Décodage","À l'oreille, fldigi, CW Skimmer"]]},"rtty":{"nm":"RTTY 45","sh":"170 Hz","t":"FSK / RTTY : deux fréquences","h":"La fréquence saute entre deux valeurs, une pour 0, une pour 1.","l":"Deux traits parallèles : 170 Hz d'écart chez les radioamateurs (45,45 bauds), 450 ou 850 Hz pour les bulletins météo. Un « tidilidi » régulier (fiche 32).","r":[["Code","Baudot ITA2 : 5 bits + start + 1,5 stop ; mark 2125 Hz, space 2295 Hz"],["Texte","RYRYRYRY CQ CQ DE F4ABC"],["Décodage","fldigi, MMTTY, 2Tone"]]},"afsk":{"nm":"Packet APRS","sh":"AFSK 1200","t":"AFSK 1200 bauds : APRS et packet","h":"Deux tonalités audio, 1200 et 2200 Hz, envoyées dans un émetteur FM.","l":"Vu après le récepteur FM (son du haut-parleur) : une bande de 1200 à 2200 Hz, en salves courtes. À l'oreille, un « grrrt » d'une seconde (fiches 35 et 36).","r":[["Fréquence","144,800 MHz en Europe (APRS), FM"],["Trame","Drapeaux 0x7E puis données AX.25 en NRZI"],["Décodage","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"nm":"PSK31","sh":"BPSK","t":"PSK31 : modulation de phase","h":"La fréquence ne bouge pas, c'est la phase qui s'inverse ; l'amplitude se creuse à chaque inversion.","l":"Un trait très fin d'environ 60 Hz, un peu « tressé ». Des dizaines de stations tiennent dans 3 kHz (fiche 29).","r":[["Code","Varicode : 0 = inversion de phase, 1 = pas de changement ; au repos, deux traits jumeaux"],["Où l'entendre","14 070 kHz, 3 580 kHz"],["Décodage","fldigi"]]},"ft8":{"nm":"FT8","sh":"8-FSK","t":"MFSK / FT8 : huit tonalités","h":"La fréquence monte et descend par marches de 6,25 Hz, 0,16 s par marche.","l":"Des bandes d'environ 50 Hz qui durent 12,6 s et reviennent toutes les 15 s, calées sur l'heure : plusieurs stations à la fois dans 3 kHz, par exemple sur 7,074 MHz (fiche 29).","r":[["Trame","79 symboles de 0,16 s, trois motifs Costas (début, milieu, fin) ; ici huit stations"],["Fréquences","14 074, 7 074, 3 573, 10 136, 21 074, 28 074 kHz"],["Décodage","WSJT-X, JTDX (heure du PC exacte)"]]},"ft4":{"nm":"FT4","sh":"4-FSK","t":"FT4 : le FT8 des concours","h":"Quatre tonalités espacées de 20,8 Hz, 20,8 bauds : 105 symboles en 5 s, calés sur des tranches de 7,5 s.","l":"Des bandes d'environ 90 Hz, plus courtes et plus larges que le FT8, qui reviennent toutes les 7,5 s. 14 080, 7 047,5 kHz (fiche 29)."},"olivia":{"nm":"Olivia 8/250","sh":"MFSK","t":"Olivia 8/250 : huit tonalités","h":"Huit tonalités espacées de 31,25 Hz, une seule à la fois, qui sautent au hasard ; codage Walsh et entrelacement.","l":"Un bloc de points dispersés sur 250 Hz ; décode très en dessous du bruit. Une petite mélodie aléatoire à l'oreille (fiche 29)."},"hell":{"nm":"Feld Hell","sh":"OOK","t":"Feld Hell : écrire avec une porteuse","h":"La porteuse est allumée et éteinte point par point : chaque lettre est une colonne de 14 points, balayée de bas en haut (245 points par seconde).","l":"Sur le waterfall, un trait haché ; c'est l'écran du logiciel (fldigi) qui redessine les lettres. Un crépitement doux à l'oreille (fiche 29)."},"4fsk":{"nm":"DMR / C4FM","sh":"4FSK","t":"4FSK : DMR, C4FM (Fusion), NXDN, dPMR","h":"Quatre niveaux de fréquence : chaque symbole porte deux bits.","l":"Un bloc rectangulaire de 6 à 12,5 kHz, plein comme du bruit, souvent en salves (le DMR partage le canal en deux créneaux). Un « frrr » rauque à l'oreille (fiche 46)."},"mt63":{"nm":"MT63","sh":"NBEMS","t":"MT63 : messages d'urgence (NBEMS)","h":"64 tonalités à la fois, chacune modulée lentement, avec beaucoup de redondance.","l":"Un bloc plat de 1 ou 2 kHz centré sur 1500 Hz, avec des bords nets ; un souffle régulier. Passe même par un micro collé à un haut-parleur (fiche 31)."},"lora":{"nm":"LoRa","sh":"chirps","t":"LoRa : rampes de fréquence (chirps)","h":"La fréquence balaie toute la largeur, puis repart du bas : la position du saut porte les données.","l":"Des diagonales parallèles, faciles à reconnaître : Meshtastic et MeshCore sur 869,525 MHz ou 433 MHz, capteurs LoRaWAN (fiches 13, 23 et 24)."},"sstv":{"nm":"SSTV Martin M1","sh":"VIS 44","t":"SSTV : images en audio","h":"Un top de synchro à 1200 Hz, puis la fréquence suit la luminosité de la ligne, de 1500 (noir) à 2300 Hz (blanc).","l":"Des traits de synchro réguliers et un nuage qui varie avec l'image ; un son qui « gazouille » pendant une à deux minutes. 14,230 MHz, ISS sur 145,800 MHz (fiche 37).","r":[["Trame","En-tête VIS, puis lignes : synchro 1200 Hz, vert, bleu, rouge ; ici 20 lignes d'une mire"],["Décodage","QSSTV, MMSSTV, Robot36 sur smartphone"]]},"fax":{"nm":"Fax météo","sh":"120 lpm","t":"Fax météo : 1500 Hz noir, 2300 Hz blanc","h":"La fréquence passe du noir au blanc en continu, 120 lignes par minute.","l":"Deux bandes fixes à 1500 et 2300 Hz (800 Hz d'écart), un « tic-tac » régulier. Les fréquences publiées sont celles de la porteuse : écoute en USB 1,9 kHz plus bas (fiche 38).","r":[["Trame","Ton de démarrage 300 Hz, lignes de phasage (impulsion blanche), puis la carte"],["Décodage","fldigi, JWX, HamFax"]]},"elt":{"nm":"Sirène ELT","sh":"121,5 MHz","t":"Sirène ELT / PLB sur 121,5 MHz","h":"Une AM dont la tonalité descend de 1600 à 300 Hz, deux à quatre fois par seconde.","l":"Une porteuse fixe et des bandes latérales qui glissent en éventail : le « wou-wou » des balises de détresse, aussi sur 121,375 MHz pour les exercices (fiches 27 et 28)."},"adsb":{"nm":"ADS-B","sh":"1090 MHz","t":"ADS-B / mode S (1090 MHz) : impulsions","h":"Des impulsions de 0,5 µs dont la position porte les bits (PPM) ; ici l'échelle de temps est très ralentie.","l":"Des traits horizontaux très courts sur toute la largeur, des centaines par seconde près d'un aéroport ; il faut une clé SDR (fiche 15).","n":"échelle de temps très ralentie"},"acars":{"nm":"ACARS","sh":"MSK","t":"ACARS : AM et données MSK","h":"Une AM qui transporte deux tonalités, 1200 et 2400 Hz, à 2400 bit/s.","l":"Des salves d'une demi-seconde avec porteuse et bandes latérales, sur 131,525, 131,725 ou 131,825 MHz en Europe : un « brrrt » à l'oreille (fiche 16)."},"ais":{"nm":"AIS","sh":"GMSK","t":"AIS : GMSK 9600 bauds sur deux canaux","h":"Une FSK adoucie (GMSK) en salves de 26 ms, une fois sur 161,975 MHz, une fois sur 162,025 MHz (échelle réduite).","l":"Deux colonnes de petits traits brefs, 50 kHz d'écart, un claquement régulier ; plus il y a de navires, plus c'est serré (fiche 19).","n":"échelle réduite"},"navtex":{"nm":"NAVTEX","sh":"518 kHz","t":"NAVTEX et ASN en ondes moyennes et courtes : FSK 170 Hz","h":"Comme le RTTY : deux fréquences à 170 Hz d'écart, mais à 100 bauds.","l":"Deux traits parallèles en continu pendant le bulletin, sur 518 et 490 kHz (NAVTEX) ou 2187,5 kHz (appel sélectif numérique) (fiche 20).","r":[["Code","SITOR-B, CCIR 476 : 7 bits dont quatre « 1 », avec répétition FEC"],["Décodage","fldigi, YaND"]]},"hfdl":{"nm":"HFDL","sh":"PSK 1800","t":"HFDL : les avions en ondes courtes","h":"Une PSK à 1800 bauds sur une sous-porteuse de 1440 Hz.","l":"Des salves d'environ 2,4 kHz entre 2,9 et 22 MHz ; un chuintement de modem qui part et revient (fiche 17)."},"ctcss":{"nm":"CTCSS","sh":"88,5 Hz","t":"CTCSS : sous-ton sous la voix","h":"Une tonalité grave et continue (67 à 254 Hz, ici 88,5 Hz) ajoutée à la voix.","l":"Vu dans le son du récepteur FM : un trait fixe tout en bas, sous la voix ; il ouvre le squelch des relais et des talkies (fiche 10)."},"dtmf":{"nm":"DTMF","sh":"2 tons","t":"DTMF : deux tonalités par touche","h":"Chaque touche du clavier envoie une tonalité grave (697 à 941 Hz) et une aiguë (1209 à 1633 Hz) en même temps.","l":"Des paires de points alignés sur huit colonnes fixes ; le « bip-bip » des numéros de téléphone et des commandes de relais (fiche 10).","r":[["Séquence","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"nm":"Selcall CCIR","sh":"5 tons","t":"Selcall CCIR : tonalités en séquence","h":"Cinq tonalités de 100 ms l'une après l'autre, une par chiffre.","l":"Un petit escalier de points, répété ; un « tululululu » rapide pour appeler une radio précise (fiche 33).","r":[["Séquence","1 2 3 4 5, deux fois ; décodé aussi par l'app SelCall de l'UV-K1"]]},"pocsag":{"nm":"POCSAG / FLEX","sh":"bipeurs","t":"POCSAG et FLEX : bipeurs","h":"Une FSK à ±4,5 kHz ; un préambule 1010… puis les données (échelle réduite).","l":"Deux traits nets pendant le préambule, puis une bande pleine ; un « brrrrt » strident. 466,075 MHz, DAPNET 439,9875 MHz (fiche 45).","n":"échelle réduite"},"ale":{"nm":"ALE","sh":"8 tons","t":"ALE : l'appel automatique en ondes courtes","h":"Huit tonalités de 750 à 2500 Hz, 125 bauds, en rafales.","l":"Un bloc d'environ 2 kHz fait de petits points, une à deux secondes, parfois sur plusieurs fréquences voisines ; un gazouillis aigu (fiche 34)."},"rs41":{"nm":"Radiosonde RS41","sh":"GFSK","t":"Radiosonde RS41 : GFSK en continu","h":"Une FSK adoucie à 4800 bauds, sans arrêt ; la fréquence dérive lentement quand la sonde monte et se refroidit.","l":"Une bande d'environ 10 kHz qui glisse en biais pendant tout le vol, entre 400 et 406 MHz (fiche 21)."},"ook":{"nm":"Capteurs 433","sh":"OOK","t":"Capteurs 433 MHz : OOK","h":"La porteuse s'allume et s'éteint en impulsions courtes ou longues (tout ou rien) ; le message est répété trois fois.","l":"Des rafales de petits points, souvent en triple, sur 433,92 MHz : stations météo, sondes de température, télécommandes (fiche 22)."},"fhss":{"nm":"Bluetooth","sh":"FHSS","t":"Bluetooth : sauts de fréquence (FHSS)","h":"La fréquence change 1600 fois par seconde parmi 79 canaux (échelle réduite).","l":"De petits traits éparpillés partout sur 80 MHz de large, jamais au même endroit, vers 2,4 GHz (fiche 25).","n":"échelle réduite"},"wspr":{"nm":"WSPR","sh":"4-FSK","t":"WSPR : balises de propagation","h":"Quatre tonalités espacées de 1,46 Hz, 0,68 s par symbole, pendant 110,6 s.","l":"Un trait très fin d'environ 6 Hz qui dure presque deux minutes, toutes les deux minutes paires : il faut zoomer très fort (fiche 29).","n":"extrait de 24 s (une émission dure 110,6 s)"},"qrss":{"nm":"QRSS","sh":"DFCW","t":"QRSS : Morse très lent","h":"Une porteuse allumée et éteinte, avec des points de 3 à 10 s, souvent sur deux fréquences voisines (DFCW).","l":"Des traits de quelques Hz de large qu'on lit sur un écran de dix minutes ; inaudible à l'oreille (fiche 30).","n":"accéléré : point de 0,6 s au lieu de 3 à 10 s"},"texte":{"nm":"Texte dans le waterfall","sh":"image","t":"Texte dans le waterfall","h":"Chaque ligne d'une image devient un groupe de tonalités : le son ressemble à du bruit.","l":"Le texte ou le dessin apparaît directement sur l'écran du SDR (fiche 40).","r":[["Note","Émis par le bas de l'image : à l'endroit sur le waterfall en direct, à l'envers dans l'empreinte (lue de haut en bas)"]]},"vara":{"nm":"VARA / Pactor","sh":"OFDM","t":"Données HF modernes : VARA, Pactor, ARDOP","h":"De longues salves pleines (OFDM ou PSK) et, entre deux, de courtes réponses de l'autre station.","l":"Un rectangle d'environ 2,4 kHz qui s'arrête et repart, avec un petit accusé de réception au milieu ; un chuintement haché (fiche 29)."},"chirp":{"nm":"Sondeur ionosphérique","sh":"chirp","t":"Sondeur ionosphérique (chirp sounder)","h":"Une rampe de fréquence lente qui traverse toute la bande HF ; les échos de l'ionosphère arrivent un peu plus tard.","l":"Une diagonale qui balaie l'écran, doublée de traits parallèles (les échos) ; un « ffuit » qui passe en une fraction de seconde."},"oth":{"nm":"Radar transhorizon","sh":"woodpecker","t":"Radar transhorizon (« woodpecker »)","h":"Des impulsions répétées 10 à 50 fois par seconde, chacune large de plusieurs kHz.","l":"Un bloc large strié, qui couvre des bandes entières ; un claquement de pic-vert très régulier en ondes courtes."},"parasites":{"nm":"Parasites","sh":"alimentation","t":"Parasites d'une alimentation à découpage","h":"Un signal carré : sa fréquence et toutes ses harmoniques sortent en même temps.","l":"Un peigne de raies régulières qui dérivent ensemble, sur un fond de bruit : à chercher avec NOISE FIND ou un récepteur portable (fiche K22)."},"mpx":{"nm":"FM stéréo et RDS","sh":"MPX","t":"Radio FM stéréo et RDS","h":"Le son démodulé (multiplex) contient la voie L+R, un pilote à 19 kHz, la voie L-R autour de 38 kHz et le RDS à 57 kHz.","l":"Vu sur 0 à 60 kHz après la démodulation : un bloc grave, un trait fin à 19 kHz, un bloc plus faible au milieu et le RDS tout en haut (fiche 12).","n":"échelle ÷ 20 ; son en stéréo","r":[["Écoute","Au casque : 4 s en mono (le bloc du milieu, L-R, disparaît), puis 4 s en stéréo, la mélodie à gauche et les accords à droite."]]},"dcf77":{"nm":"DCF77","sh":"77,5 kHz","t":"Signal horaire DCF77 (77,5 kHz)","h":"Une porteuse qui baisse à 15 % pendant 0,1 s (bit 0) ou 0,2 s (bit 1), au début de chaque seconde.","l":"Un trait fixe avec une coupure noire chaque seconde ; la 59e seconde n'en a pas, pour marquer la minute (fiche 12).","r":[["Note","Ici la porteuse est ramenée à 1000 Hz ; la 6e seconde n'a pas de coupure, comme la 59e seconde de chaque minute"]]},"ofdm":{"nm":"OFDM","sh":"DRM, DAB+","t":"OFDM : des dizaines de sous-porteuses","h":"Beaucoup de porteuses très serrées, chacune lente : la somme ressemble à du bruit.","l":"Un rectangle plat aux bords nets, toujours là : DRM en ondes courtes (10 kHz), DAB+ (1,5 MHz), TNT, Wi-Fi. Un souffle continu à l'oreille (fiches 12 et 25)."},"dsss":{"nm":"DSSS","sh":"GPS, Wi-Fi","t":"Étalement de spectre (DSSS) : GPS, Wi-Fi 802.11b","h":"Les données sont mélangées à un code très rapide : l'énergie s'étale sur une grande largeur.","l":"Une bosse large, à peine au-dessus du bruit ; le GPS est même sous le bruit et ne se voit pas sans traitement (fiches 25 et 26)."},"hline":{"nm":"Raie de l'hydrogène","sh":"1420 MHz","t":"Raie de l'hydrogène à 21 cm (1420,405 MHz)","h":"L'hydrogène froid de la Voie lactée émet un souffle très faible sur 1420,405 MHz. Le mouvement des bras de la galaxie le décale par effet Doppler : on voit plusieurs petites bosses.","l":"Presque rien dans le waterfall d'une seconde à l'autre : il faut moyenner longtemps pour voir les bosses sortir du bruit. Ici, regarde le spectre moyen à l'arrêt. Une parabole ou un cornet, un préampli et une clé SDR suffisent.","n":"signal très exagéré"},"sun":{"nm":"Soleil","sh":"sursauts","t":"Soleil : sursauts radio de type III","h":"Des électrons lancés par une éruption traversent la couronne du Soleil et la font émettre de plus en plus bas en fréquence à mesure qu'ils s'éloignent.","l":"Des traits qui tombent en diagonale du haut vers le bas du spectre en moins d'une seconde, sur un fond de bruit solaire ; un « chhhh » qui enfle. De 10 à 400 MHz environ, aussi en ondes courtes vers 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter : sursauts décamétriques (L et S)","h":"Le champ magnétique de Jupiter et sa lune Io produisent des émissions puissantes entre 15 et 40 MHz : des sursauts L lents et des sursauts S très courts qui glissent vite vers le bas.","l":"D'abord des vagues de souffle (L, comme le ressac), puis des salves de petits « pops » (S) en diagonales serrées. Vers 20,1 MHz la nuit, avec un simple dipôle, quand Io est bien placée."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Une étoile à neutrons qui tourne sur elle-même balaie la Terre d'un faisceau radio, ici toutes les 0,714 s. Le gaz interstellaire retarde les basses fréquences : chaque impulsion arrive d'abord en haut du spectre.","l":"Un « tic » régulier ; dans le waterfall, chaque impulsion est une courbe qui descend (la dispersion). Le vrai signal est sous le bruit : il faut une grande antenne et additionner les impulsions sur leur période.","n":"signal très exagéré"},"meteor":{"nm":"Météores","sh":"GRAVES","t":"Échos de météores sur le radar GRAVES (143,050 MHz)","h":"Le radar français GRAVES émet sans arrêt sur 143,050 MHz. Quand une étoile filante ionise l'air, sa traînée renvoie un peu de ce signal vers ton récepteur, pendant une fraction de seconde à quelques secondes.","l":"En USB sur 143,049 MHz : des « ping » brefs vers 1000 Hz, parfois un écho qui glisse (la tête du météore, effet Doppler) ou qui dure. Bien plus nombreux pendant les essaims (Perséides, Géminides) (fiche 1)."},"whistler":{"nm":"Sifflements","sh":"VLF","t":"Sifflements VLF (whistlers)","h":"Un éclair crée un claquement radio ; une partie suit les lignes du champ magnétique terrestre jusqu'à l'autre hémisphère et revient, les aigus en premier.","l":"Un « tiouuu » qui descend de l'aigu au grave en une ou deux secondes, juste après un claquement ; des craquements (sferics) partout. Sous 10 kHz, avec un récepteur VLF loin des lignes électriques."},"chorus":{"nm":"Chœur de l'aube","sh":"VLF","t":"Chœur de l'aube (dawn chorus)","h":"Pendant un orage magnétique, des électrons piégés dans la magnétosphère émettent de petites notes montantes, surtout au lever du jour.","l":"Des gazouillis montants qui se chevauchent, comme des oiseaux, de 1 à 4 kHz environ. Même matériel que pour les sifflements."},"sputnik":{"nm":"Spoutnik 1","sh":"1957","t":"Spoutnik 1 (1957)","h":"Le premier satellite artificiel émettait des bips d'environ 0,3 s sur 20,005 et 40,002 MHz, en alternance, pendant trois semaines.","l":"Un trait coupé régulièrement : « bip… bip… », le son écouté dans le monde entier en octobre 1957 (reconstitution)."},"doppler":{"nm":"Effet Doppler","sh":"satellite","t":"Balise de satellite et effet Doppler","h":"Un satellite en orbite basse s'approche puis s'éloigne : la fréquence reçue baisse pendant le passage, d'environ ±3 kHz à 145 MHz et ±10 kHz à 435 MHz.","l":"Un trait qui descend en forme de S : lentement au début, vite quand le satellite passe au plus près, puis de nouveau lentement (fiche 41).","n":"passage de 10 min ramené à 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satellites NOAA : images APT (historique)","h":"Une sous-porteuse de 2400 Hz modulée en amplitude par l'image, deux lignes par seconde, avec un top de synchro au début de chaque ligne. Arrêté en 2025 ; les Meteor-M émettent aujourd'hui en LRPT.","l":"Un trait à 2400 Hz avec des bandes latérales qui changent avec l'image, et le fameux « tic-tac » deux fois par seconde (fiche 41)."},"eme":{"nm":"Écho de la Lune","sh":"EME","t":"Écho de la Lune (EME)","h":"Un signal envoyé vers la Lune revient environ 2,5 s plus tard, énormément affaibli, un peu élargi et décalé par le Doppler.","l":"On entend son propre « bip », puis son écho faible et un peu flou 2,5 s après. Les radioamateurs le font en CW ou en JT65, sur 144 MHz et plus (fiche 1).","n":"écho très exagéré"},"msk144":{"nm":"MSK144","sh":"météores","t":"MSK144 : le numérique des météores","h":"Deux tonalités, 1000 et 2000 Hz, à 2000 bauds, en trames de 72 ms répétées sans arrêt : chaque passage de météore en laisse passer quelques-unes.","l":"Des salves de 0,1 à 1 s, d'environ 2,4 kHz de large, qui apparaissent puis s'éteignent avec le « ping » du météore. Sur 50 et 144 MHz, avec WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tons","t":"JT65 : 65 tonalités, très lent","h":"Une tonalité de synchro et 64 tonalités de données espacées de 2,7 Hz (JT65A), 0,37 s par symbole, 47 s d'émission par minute.","l":"Une échelle de petits traits sur environ 180 Hz, avec un trait de synchro qui revient sans cesse au même endroit. Utilisé pour la réflexion sur la Lune (JT65B et C) et les signaux très faibles.","n":"extrait de 20 s (une émission dure 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA : réseau numérique professionnel","h":"Une modulation de phase π/4-DQPSK à 18 000 symboles par seconde, quatre voies partagées dans le temps, sur des canaux de 25 kHz.","l":"Un bloc plein aux flancs arrondis, présent en permanence près d'un relais ; un souffle rauque. Chiffré : on ne peut pas l'écouter (fiche 46).","n":"échelle réduite"},"ndb":{"nm":"Balise NDB","sh":"190–535 kHz","t":"Balise NDB : radiophare non directionnel","h":"Une porteuse fixe en grandes ondes, avec un indicatif Morse de deux ou trois lettres envoyé sur une tonalité (souvent 1020 Hz).","l":"Un trait fixe au centre et, pendant l'indicatif, deux petits traits de chaque côté. Entre 190 et 535 kHz environ, en BLU ou CW (fiche 12)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR : radiophare omnidirectionnel","h":"En AM, un signal à 30 Hz qui dépend de la direction, une sous-porteuse à 9960 Hz modulée en fréquence à 30 Hz (la référence), et l'indicatif Morse sur 1020 Hz.","l":"Dans le son démodulé : un ronflement grave à 30 Hz, un trait large vers 10 kHz qui ondule, et l'indicatif de temps en temps (fiche 18).","n":"son démodulé, échelle ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS : guidage à l'atterrissage (localizer)","h":"En AM, deux tonalités de 90 et 150 Hz ; leur rapport dit à l'avion s'il est à gauche ou à droite de l'axe. L'indicatif Morse commence par I.","l":"Dans le son démodulé : deux traits très bas, à 90 et 150 Hz, et l'indicatif sur 1020 Hz. Entre 108,1 et 112 MHz ; le glide est vers 330 MHz (fiche 18)."},"m10":{"nm":"Sondes M10 / M20","sh":"Meteomodem","t":"Radiosondes M10 et M20 (Meteomodem)","h":"Une trame par seconde, en FSK rapide (environ 9600 bauds) : plus large que la RS41. Elles sont lancées en France par Météo-France.","l":"Une salve large toutes les secondes, qui dérive lentement pendant le vol ; entre 400 et 406 MHz (fiche 21)."},"tpms":{"nm":"Pneus (TPMS)","sh":"433 MHz","t":"Capteurs de pression des pneus (TPMS)","h":"Chaque roue envoie de temps en temps une salve FSK de quelques millisecondes : pression, température, identifiant.","l":"Des petites salves isolées sur 433,92 MHz (ou 315 MHz), souvent par deux, au passage d'une voiture. Décodées par rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Signal horaire ALS162 (Allouis, 162 kHz)","h":"La porteuse des anciennes grandes ondes de France Inter ; l'heure est codée par de petites modulations de phase, inaudibles.","l":"Un trait fixe, très fort en France, à peine élargi au début de chaque seconde ; il faut un décodeur pour lire l'heure (fiche 12)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Signal horaire WWV (Colorado)","h":"En AM : un « tic » de 5 ms à 1000 Hz chaque seconde, une tonalité de 500 ou 600 Hz, un code horaire sur 100 Hz et une voix qui annonce l'heure UTC.","l":"Dans le son démodulé : un trait à 500 Hz coupé à chaque seconde, le tic à 1000 Hz, et le code tout en bas à 100 Hz (fiche 12)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Signal horaire MSF (Anthorn, 60 kHz)","h":"La porteuse est coupée au début de chaque seconde pendant 0,1, 0,2 ou 0,3 s selon les bits, et pendant 0,5 s pour marquer la minute.","l":"Un trait fixe avec des trous noirs complets chaque seconde, plus longs qu'avec DCF77 (fiche 12)."},"type2":{"nm":"Soleil type II","sh":"onde de choc","t":"Soleil : sursauts radio de type II","h":"L'onde de choc d'une éjection de masse coronale fait émettre le plasma de plus en plus bas, lentement, souvent en deux bandes (la fondamentale et son double).","l":"Deux bandes de bruit parallèles qui descendent doucement pendant plusieurs minutes. À comparer avec les sursauts de type III, beaucoup plus rapides.","n":"plusieurs minutes ramenées à 6 s"},"tweeks":{"nm":"Tweeks","sh":"VLF","t":"Tweeks : les « ping » de la nuit en VLF","h":"La nuit, le claquement d'un éclair lointain rebondit entre le sol et l'ionosphère ; les fréquences proches de la coupure (vers 1,7 kHz) arrivent en dernier.","l":"Un petit « ping » qui descend et s'arrête vers 1,7 kHz, avec parfois un écho au double ; des craquements partout. Sous 10 kHz, la nuit."},"hiss":{"nm":"Souffle VLF","sh":"hiss","t":"Souffle VLF (hiss)","h":"Un bruit large émis par les électrons de la plasmasphère, qui monte et descend avec l'activité magnétique.","l":"Une bande de souffle de quelques centaines de Hz à quelques kHz, sans motif, qui enfle et retombe lentement."},"aurora":{"nm":"Aurore radio","sh":"Au","t":"Propagation aurorale (Au)","h":"Une aurore boréale renvoie les ondes VHF, mais en les agitant très vite : chaque signal est étalé sur plusieurs centaines de Hz.","l":"La CW devient un souffle râpeux, comme chuchotée ; on n'entend plus de note. Sur 50 et 144 MHz, en visant le nord pendant les orages magnétiques."},"galactic":{"nm":"Bruit galactique","sh":"20–40 MHz","t":"Bruit de la Voie lactée","h":"Le centre de la galaxie émet un souffle radio que Karl Jansky a découvert en 1932 vers 20 MHz. Il monte et baisse au rythme de la rotation de la Terre.","l":"Un bruit de fond qui augmente lentement puis redescend, chaque jour environ 4 minutes plus tôt. Visible avec un simple dipôle entre 20 et 40 MHz.","n":"une journée ramenée à 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"Télémétrie de CubeSat","h":"Les petits satellites envoient régulièrement leurs mesures (batterie, températures) en FSK ou GMSK à 1200 ou 9600 bauds, vers 435–438 MHz.","l":"Des salves régulières qui glissent vers le bas d'une fois sur l'autre, par effet Doppler, pendant le passage (fiche 41).","n":"échelle réduite, passage accéléré"},"issfm":{"nm":"ISS en FM","sh":"145,800 MHz","t":"Station spatiale (ISS) : voix en FM","h":"Les astronautes parlent avec des écoles et des radioamateurs en FM sur 145,800 MHz. La station file à 28 000 km/h : pendant le passage, la fréquence reçue glisse d'environ +3,5 kHz à −3,5 kHz.","l":"Une bande de voix FM qui descend lentement de droite à gauche pendant les 10 minutes du passage (fiche 41).","n":"passage de 10 min ramené à 10 s"},"buzzer":{"nm":"UVB-76 « The Buzzer »","sh":"4625 kHz","t":"UVB-76, « The Buzzer » (4625 kHz)","h":"Une station militaire russe qui émet depuis des décennies un bourdonnement d'environ une seconde, répété environ 25 fois par minute, parfois interrompu par un message vocal.","l":"Une porteuse fixe et, à chaque bourdonnement, une colonne de raies serrées de haut en bas. Facile à trouver sur 4625 kHz en USB."},"pip":{"nm":"« The Pip »","sh":"3756 / 5448 kHz","t":"« The Pip » : bips sans fin","h":"Une autre balise militaire russe des ondes courtes, qui répète de petits bips brefs, jour et nuit, parfois interrompus par des messages.","l":"Un trait fixe coupé par un bip bref environ 50 fois par minute ; à l'oreille, un « pip… pip… » régulier qui ne s'arrête jamais.","n":"rythme approché"},"squeaky":{"nm":"« Squeaky Wheel »","sh":"OC","t":"« Squeaky Wheel » : la roue qui grince","h":"Une balise militaire russe des ondes courtes, nommée par les écouteurs d'après son motif sonore répété.","l":"Un petit motif de deux sons, dont un qui monte, répété en boucle : comme une roue qui grince.","n":"imitation approchée"},"codar":{"nm":"CODAR","sh":"radar océan","t":"CODAR : radars des courants marins","h":"Des radars côtiers balaient une bande de fréquences, une ou deux fois par seconde, pour mesurer les courants et les vagues.","l":"Des diagonales parallèles régulières, et un « swish » répété ; vers 4,5–5,5 MHz, 13 MHz et 25 MHz, souvent jour et nuit.","n":"échelle réduite"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Modem militaire STANAG 4285","h":"Une modulation de phase 8-PSK à 2400 bauds sur une porteuse de 1800 Hz, avec une séquence de test toutes les 107 ms pour suivre le canal.","l":"Un bloc plein d'environ 3 kHz ; à l'oreille, un souffle avec un bourdonnement régulier (fiche 43)."},"link11":{"nm":"Link-11","sh":"16 tons","t":"Link-11 : liaison de données navale","h":"Seize tonalités de 605 à 2915 Hz émises ensemble, chacune modulée en phase 75 fois par seconde.","l":"Un peigne de quatorze raies régulières de 935 à 2365 Hz, plus deux raies à l'écart, à 605 et 2915 Hz ; à l'oreille, un ronflement musical (fiche 43)."},"numbers":{"nm":"Station de nombres","sh":"voix","t":"Station de nombres","h":"À heure fixe, une petite mélodie d'appel, puis une voix (souvent synthétique) lit des groupes de cinq chiffres, en AM ou en BLU.","l":"La mélodie en notes isolées, puis des groupes de syllabes réguliers séparés par des silences (fiche 43).","n":"voix imitée, sans vrais chiffres"},"rttydwd":{"nm":"RTTY météo DWD","sh":"50 Bd / 450 Hz","t":"RTTY météo du DWD (Allemagne)","h":"Comme le RTTY des radioamateurs, mais à 50 bauds avec 450 Hz d'écart : le service météo allemand envoie ses bulletins et ses prévisions marines en clair.","l":"Deux traits bien plus écartés, et un rythme un peu plus rapide. Entre deux bulletins, l'appel « CQ CQ CQ DE DDK2 DDH7 DDK9 » puis RYRYRY. Sur 4583, 7646 et 10 100,8 kHz, aussi 147,3 kHz (fiche 32)."},"mfsk16":{"nm":"MFSK16","sh":"16 tons","t":"MFSK16 : seize tonalités","h":"Seize tonalités espacées de 15,625 Hz, une seule à la fois, 15,625 fois par seconde ; chaque tonalité porte quatre bits, protégés par un code correcteur.","l":"Une bande de 316 Hz faite de petits paliers qui sautent sans arrêt, après un ton fixe au début. À l'oreille, une petite musique rapide, comme une flûte. Sert aussi à envoyer de petites images."},"sitora":{"nm":"SITOR-A (ARQ)","sh":"télex","t":"SITOR-A : le télex maritime en ARQ","h":"La station envoie des blocs de trois caractères (210 ms, 100 bauds, écart de 170 Hz) toutes les 450 ms ; entre deux blocs, l'autre station répond par un signal bref pour dire « reçu » ou « répète ».","l":"Des salves courtes et régulières, avec une petite réponse plus faible entre elles : un « tchip-tchip » de criquet. Devenu rare en ondes courtes."},"dscvhf":{"nm":"ASN VHF (canal 70)","sh":"DSC","t":"ASN / DSC : appel sélectif numérique sur le canal 70","h":"Une salve d'environ une demi-seconde à 1200 bauds, sur deux tonalités de 1300 et 2100 Hz : elle porte le numéro MMSI du navire, le type d'appel et, en cas de détresse, sa position.","l":"Un « brrrt » bref et aigu sur 156,525 MHz, qui commence par une série de bits alternés. En ondes moyennes et courtes, l'ASN est en FSK à 100 bauds, comme le NAVTEX (fiche 20)."},"selcal":{"nm":"SELCAL aviation","sh":"4 tons","t":"SELCAL : appel sélectif des avions en ondes courtes","h":"Le contrôle appelle un avion précis par deux impulsions d'environ une seconde, chacune faite de deux tonalités parmi seize (de 312,6 à 1479,1 Hz). Dans l'avion, un voyant et un carillon se déclenchent : l'équipage n'a pas besoin d'écouter en permanence.","l":"Deux accords successifs, « bing-bong », entre les messages vocaux des fréquences aéronautiques en BLU, par exemple 5616 ou 8864 kHz."},"dcs":{"nm":"DCS","sh":"134,4 bit/s","t":"DCS : le sous-ton numérique","h":"Au lieu d'une tonalité continue comme le CTCSS, la radio envoie sous la voix un mot de 23 bits répété sans arrêt, à 134,4 bits par seconde. À la fin, une tonalité de 134,4 Hz ferme le squelch sans bruit.","l":"Vu dans le son du récepteur FM : une bande irrégulière tout en bas, sous 300 Hz, et un ronflement sourd si le filtre de la radio le laisse passer (fiche 10)."},"t1750":{"nm":"Tonalité 1750 Hz","sh":"relais","t":"Tonalité 1750 Hz : ouvrir un relais","h":"Un ton bref de 1750 Hz (environ 0,5 à 1 s) au début de l'émission ouvre encore certains relais radioamateurs européens ; le relais répond souvent par un bip quand on relâche.","l":"Un trait court à 1750 Hz, puis la voix, puis le bip du relais (fiche 10)."},"ncdxf":{"nm":"Balises NCDXF","sh":"14,100 MHz","t":"Balises NCDXF / IARU : tester la propagation","h":"Dix-huit balises dans le monde émettent à tour de rôle, dix secondes chacune, sur 14,100, 18,110, 21,150, 24,930 et 28,200 MHz : l'indicatif en Morse, puis quatre traits d'une seconde à 100 W, 10 W, 1 W et 0,1 W.","l":"Un indicatif, puis quatre traits de plus en plus faibles : si tu entends encore le dernier, la propagation est excellente vers cette balise. Ici 4U1UN (New York) puis VE8AT (Canada) (fiche 30)."},"lrpt":{"nm":"Meteor-M LRPT","sh":"137,9 MHz","t":"Satellites Meteor-M : images LRPT","h":"Les satellites météo russes Meteor-M envoient leurs images en numérique : une modulation de phase à quatre états (QPSK), 72 000 symboles par seconde, sur environ 120 kHz de large.","l":"Un bloc plein aux bords arrondis qui glisse lentement pendant le passage (effet Doppler) ; à l'oreille, un simple souffle. Sur 137,9 ou 137,1 MHz, décodé avec SatDump (fiche 41).","n":"échelle réduite"},"quindar":{"nm":"Bips Quindar","sh":"NASA","t":"Tonalités Quindar : les bips d'Apollo","h":"Quand le contrôle de Houston appuie sur le micro, un bip de 2525 Hz (250 ms) allume les émetteurs des stations au sol ; quand il relâche, un bip de 2475 Hz les éteint.","l":"Un bip aigu avant chaque phrase et un autre, un peu plus grave, après : le son célèbre des enregistrements des missions Apollo."},"wow":{"nm":"Signal « Wow! »","sh":"1977","t":"Le signal « Wow! » (15 août 1977)","h":"Le radiotélescope Big Ear (Ohio) a capté pendant 72 secondes un signal étroit et très fort près de la raie de l'hydrogène, vers 1420,456 MHz. L'astronome Jerry Ehman a écrit « Wow! » sur le listing. On ne l'a jamais revu et son origine reste discutée.","l":"Un trait fin qui sort du bruit, monte puis redescend : la forme du passage d'une source fixe dans le faisceau de l'antenne. C'est une reconstitution : il n'existe aucun enregistrement sonore.","n":"72 s ramenées à 12 s"},"frb":{"nm":"Sursaut radio rapide","sh":"FRB","t":"Sursaut radio rapide (FRB)","h":"Un éclair radio de quelques millisecondes venu d'une autre galaxie ; le premier a été découvert en 2007. Le gaz traversé retarde beaucoup les basses fréquences : le sursaut arrive étalé, les aigus d'abord.","l":"Une seule courbe qui tombe du haut vers le bas du spectre, puis plus rien. Certains se répètent ; la plupart ne sont vus qu'une fois.","n":"très ralenti et exagéré"},"letterb":{"nm":"Balises à une lettre","sh":"D, P, S, C…","t":"Balises à une lettre","h":"Des émetteurs de la marine russe répètent sans fin une seule lettre en Morse, chacun à 100 Hz de son voisin : D, P, S, C, A, F, K ou M selon le site.","l":"Des lignes pointillées parallèles, très proches, chacune avec son rythme. Vers 4558, 5154, 7039, 10 872, 13 528 et 16 332 kHz, en CW."},"sid":{"nm":"Éruption solaire en VLF","sh":"SID","t":"Éruption solaire vue en VLF (SID)","h":"Les émetteurs VLF des marines (20,9 kHz en France, 23,4 kHz en Allemagne…) se propagent entre le sol et l'ionosphère. Quand une éruption solaire arrive, ses rayons X modifient le bas de l'ionosphère en quelques minutes et le niveau reçu change d'un coup.","l":"Une bande étroite et régulière (le signal MSK de l'émetteur) qui devient brusquement plus forte, puis revient lentement à la normale. Une boucle de fil et une carte son suffisent : c'est un montage classique des clubs d'astronomie.","n":"une heure ramenée à 12 s"},"qrn":{"nm":"Parasites d'orage","sh":"QRN","t":"Parasites d'orage (QRN)","h":"Chaque éclair est un émetteur très puissant qui couvre toutes les fréquences à la fois. En ondes moyennes et courtes, on entend des orages à des milliers de kilomètres, surtout l'été et sur les bandes basses.","l":"Des traits horizontaux sur toute la largeur, irréguliers ; des craquements secs à l'oreille. Le limiteur de bruit (NB) aide un peu, une antenne boucle davantage."},"fading":{"nm":"Fading sélectif","sh":"QSB","t":"Fading sélectif (QSB)","h":"En ondes courtes, le signal arrive par plusieurs chemins dans l'ionosphère. Selon la fréquence, ils s'ajoutent ou s'annulent : un creux étroit se promène dans le signal.","l":"Une zone sombre qui se promène lentement dans la station AM. Quand elle passe sur la porteuse, au centre, le son devient rauque et déformé quelques secondes ; la détection synchrone ou l'écoute en BLU corrige ce défaut."},"plc":{"nm":"CPL","sh":"2–30 MHz","t":"CPL : Internet par les prises électriques","h":"Les boîtiers CPL envoient les données sur les fils de la maison avec des centaines de porteuses entre 2 et 30 MHz (plus haut pour les modèles récents), une tous les 24,4 kHz. Les fils rayonnent comme une antenne.","l":"Un peigne de raies régulières qui clignote par paquets, avec des trous sur les bandes radioamateurs (encoches prévues par la norme) ; à l'oreille, un crépitement qui suit le trafic Internet (fiche 43).","n":"échelle réduite"},"fence":{"nm":"Clôture électrique","sh":"tac… tac…","t":"Clôture électrique","h":"L'électrificateur envoie dans le fil une impulsion de plusieurs milliers de volts, environ une fois par seconde. Si l'herbe touche le fil ou si un isolateur est abîmé, une étincelle saute et rayonne sur toutes les fréquences.","l":"Un trait horizontal très fin sur toute la largeur, à intervalle parfaitement régulier ; un « tac… tac… » des grandes ondes jusqu'en VHF. Son rythme régulier le distingue de l'orage."},"gsm":{"nm":"Téléphone GSM","sh":"217 Hz","t":"Téléphone GSM près d'un haut-parleur","h":"Un téléphone 2G émet par salves de 0,577 ms, 217 fois par seconde. Un ampli audio mal blindé détecte ces salves et les fait entendre.","l":"Un peigne de raies tous les 217 Hz ; le fameux « ta-ta-tatata » juste avant que le téléphone sonne, puis un bourdonnement continu pendant l'appel. De plus en plus rare : les réseaux 2G ferment peu à peu."},"jjy":{"nm":"JJY","sh":"40 / 60 kHz","t":"Signal horaire JJY (Japon, 40 et 60 kHz)","h":"À chaque seconde, la porteuse est à pleine puissance pendant 0,8 s (bit 0), 0,5 s (bit 1) ou 0,2 s (repère), puis tombe à 10 %. C'est l'inverse de DCF77, qui baisse au début de la seconde.","l":"Un trait fixe qui s'affaiblit à la fin de chaque seconde, plus ou moins tôt. Émetteurs de Fukushima (40 kHz) et de Saga-Fukuoka (60 kHz), pour les horloges radio-pilotées du Japon."},"rwm":{"nm":"RWM","sh":"4996 kHz","t":"Signal horaire RWM (Moscou)","h":"En télégraphie sur 4996, 9996 et 14 996 kHz : une impulsion de 100 ms chaque seconde, puis, à d'autres minutes, dix impulsions par seconde. L'indicatif RWM est envoyé en Morse deux fois par heure.","l":"L'indicatif, puis un trait découpé en « tic » réguliers, puis en pointillé rapide. À écouter en CW ou en BLU.","n":"extrait condensé"},"bpm":{"nm":"BPM","sh":"2,5–15 MHz","t":"Signal horaire BPM (Chine)","h":"La station de Pucheng (Shaanxi) émet en AM sur 2,5, 5, 10 et 15 MHz : un top de 10 ms à 1000 Hz chaque seconde (300 ms à la minute) et, à certaines minutes, des tops de 100 ms pour le temps UT1. L'indicatif BPM est donné en Morse, puis par une voix.","l":"Dans le son démodulé : l'indicatif, puis de très courts traits à 1000 Hz, un par seconde, avec un plus long à la minute. Souvent mêlé à WWV, sur les mêmes fréquences.","n":"extrait condensé"},"humpback":{"nm":"Baleine à bosse","sh":"chant","t":"Le chant de la baleine à bosse","h":"En hiver, sur les lieux de reproduction, les mâles chantent : une suite de gémissements, de grondements et de cris qui forme un thème, répété à l'identique pendant des heures et qui change d'une saison à l'autre. Les hydrophones l'entendent à des dizaines de kilomètres.","l":"Des traits épais avec leurs harmoniques, qui montent ou descendent lentement entre 100 Hz et quelques kHz ; la même suite revient après quelques secondes. L'écho sur la surface et le fond prolonge chaque note."},"bluewhale":{"nm":"Rorqual bleu","sh":"×10","t":"Le rorqual bleu : l'appel le plus grave","h":"Le plus grand animal du monde émet des appels très graves (10 à 40 Hz) et très puissants, longs de 10 à 20 secondes et répétés pendant des heures : ils portent à des centaines de kilomètres. Pour les entendre, on accélère l'enregistrement dix fois.","l":"Une partie pulsée, puis une longue note qui descend à peine, avec ses harmoniques au-dessus ; la séquence se répète. La règle donne les vraies fréquences.","n":"accéléré 10 fois"},"finwhale":{"nm":"Rorqual commun","sh":"20 Hz","t":"Le rorqual commun : les impulsions à 20 Hz","h":"Le rorqual commun émet des impulsions d'environ une seconde qui descendent d'environ 25 à 18 Hz, à intervalles réguliers, parfois pendant des jours. Dans les années 1950-60, ces « signaux à 20 Hz » ont intrigué les réseaux d'écoute de la marine américaine avant d'être attribués à ce rorqual.","l":"De petits traits courts, tous pareils, en série régulière ou par paires, comme les battements d'un cœur très lent ; chacun descend légèrement en fréquence. La règle donne les vraies fréquences.","n":"accéléré 10 fois"},"sperm":{"nm":"Cachalot","sh":"clics","t":"Les clics du cachalot","h":"Le cachalot chasse en plongée profonde grâce à son sonar : des clics très puissants, environ un par seconde, qui s'accélèrent en « grincement » à l'approche d'une proie. Entre eux, les cachalots échangent des « codas », de courtes séries de clics dont le rythme varie d'un clan à l'autre.","l":"Des traits horizontaux sur toute la largeur, régulièrement espacés, puis serrés en bourdonnement (le grincement), puis un petit motif rythmé : la coda. Chaque clic est fait de plusieurs impulsions rapprochées, dues aux réflexions dans la tête de l'animal."},"dolphin":{"nm":"Grand dauphin","sh":"sifflements","t":"Sifflements et clics du dauphin","h":"Le grand dauphin siffle entre 5 et 20 kHz environ ; chaque individu a un « sifflement signature » qui lui sert de nom. Pour chasser et s'orienter, il émet aussi des trains de clics très brefs, jusqu'à plusieurs centaines par seconde.","l":"Des courbes fines qui montent et redescendent, souvent répétées à l'identique, et des rafales de traits horizontaux pour l'écholocation. Les fréquences sont divisées par 3 pour rester audibles ; la règle donne les vraies valeurs.","n":"joué 3 fois plus grave"},"orca":{"nm":"Orque","sh":"cris pulsés","t":"Les cris pulsés de l'orque","h":"Les orques communiquent par des cris pulsés : des trains d'impulsions si rapides (500 à 2000 par seconde) qu'on les entend comme une note, avec un saut de hauteur brusque. Chaque groupe familial a son propre « dialecte ».","l":"Un empilement de traits parallèles (les harmoniques) qui montent ou descendent ensemble, avec une cassure nette au milieu du cri ; parfois un sifflement fin, plus aigu."},"bseal":{"nm":"Phoque barbu","sh":"trille","t":"Le trille du phoque barbu","h":"Au printemps, sous la banquise arctique, le mâle émet de longs trilles qui descendent en spirale de plusieurs kHz jusqu'à quelques centaines de hertz, pendant parfois une minute. Ils servent à défendre un territoire et à attirer les femelles.","l":"Une courbe ondulée qui glisse du haut vers le bas de l'échelle, comme un ressort qui se détend, puis une note grave à la fin.","n":"raccourci"},"shrimp":{"nm":"Crevettes-pistolets","sh":"récif","t":"Les crevettes-pistolets (alphées)","h":"En refermant sa grosse pince, l'alphée projette un jet d'eau si rapide qu'il crée une bulle de cavitation ; en éclatant, la bulle claque comme un coup de feu. Des milliers de crevettes font le fond sonore des récifs et peuvent gêner les sonars.","l":"Une pluie de points et de petits traits horizontaux sur toute la largeur, sans aucun ordre ; au casque, un crépitement continu, comme une friture."},"sonar":{"nm":"Sonar actif","sh":"ping","t":"Le ping d'un sonar actif","h":"Un navire envoie une impulsion sonore puissante (ici vers 3,5 kHz, la gamme des sonars de coque des frégates) et écoute l'écho : le délai donne la distance, le décalage de fréquence (effet Doppler) la vitesse de la cible. Le son revient aussi en traînée depuis le fond et la surface : c'est la réverbération.","l":"Un trait court et fort, une traînée qui s'éteint, puis l'écho, bien plus faible et un peu décalé en fréquence. Le second ping est un balayage de fréquence (chirp), qui mesure mieux la distance."},"propeller":{"nm":"Hélice de navire","sh":"cavitation","t":"L'hélice d'un navire qui passe","h":"Les pales de l'hélice créent des bulles de cavitation qui éclatent : un souffle large, battu au rythme du passage des pales. Les machines ajoutent des raies fixes. Les sonaristes analysent ce rythme (analyse DEMON) pour compter les pales et la vitesse de rotation, et reconnaître le navire.","l":"Un souffle sur une large bande, strié de bandes horizontales au rythme des pales, avec quelques traits verticaux fixes (moteur, réducteur). Le tout monte puis s'éteint quand le navire passe au-dessus de l'hydrophone."},"uqc":{"nm":"Téléphone sous-marin","sh":"UQC 8 kHz","t":"Le téléphone sous-marin (UQC, « Gertrude »)","h":"Les sous-marins et les navires se parlent sous l'eau avec un téléphone acoustique : la voix est transmise en bande latérale unique au-dessus d'une porteuse de 8,0875 kHz, émise par un transducteur dans la coque. Portée : quelques kilomètres.","l":"Une bande de voix BLU au-dessus de 8 kHz ; démodulée, une voix lointaine qui ondule et résonne à cause des échos sur la surface et le fond. L'affichage est réduit de moitié ; la règle donne les vraies fréquences.","n":"échelle divisée par 2"},"zevs":{"nm":"ZEVS 82 Hz","sh":"ELF","t":"ZEVS : la radio des sous-marins à 82 Hz","h":"Les ondes radio pénètrent très mal l'eau de mer, sauf aux fréquences extrêmement basses (ELF). L'émetteur russe ZEVS, dans la péninsule de Kola, émet à 82 Hz avec des lignes d'antenne de plusieurs dizaines de kilomètres pour joindre les sous-marins en plongée profonde. Le débit est minuscule : quelques caractères par minute.","l":"Un trait fin à 82 Hz, à côté de la raie du secteur à 50 Hz et de ses harmoniques, avec les parasites des orages. Au casque, un bourdonnement grave à peine audible ; on le capte avec une grande boucle et une carte son. L'équivalent américain, à 76 Hz, a fermé en 2004."},"bloop":{"nm":"Le « Bloop »","sh":"1997","t":"Le « Bloop » (1997)","h":"En 1997, les hydrophones de la NOAA dans le Pacifique ont capté un son très grave qui montait rapidement, entendu à plusieurs milliers de kilomètres. Longtemps mystérieux, il est attribué depuis 2012 à un tremblement de glace : un énorme iceberg qui se fissure.","l":"Une large bande qui monte en quelques secondes, avec ses harmoniques, puis s'éteint lentement. Reconstitution, accélérée 16 fois comme l'enregistrement diffusé par la NOAA.","n":"accéléré 16 fois"}}},"en":{"ui":{"title":"VSISA","mystery":"Mystery sound","play":"▶ Listen","stop":"■ Stop","noise":"Noise","volume":"Volume","loop":"Loop","specwf":"Spectrum + Waterfall","cursor":"cursor","footprint":"Footprint","dur":"{s} s from top to bottom","avg":"average over the whole signal","press":"Press Listen: the signal scrolls here","count":"{n} signals, in the order of sheet 6","myst":"Mystery mode","mystTags":"Listen and watch, then pick the right answer","quizH":"Which signal is this?","quizLead":"Start listening, watch the spectrum, the waterfall and the footprint, then answer.","score":"Score","good":"Correct!","bad":"Missed: it was {x}.","next":"Next mystery sound","principle":"Principle","screen":"On screen","sheet":"sheet","book":"Book: sheet {r}","lang":"Language","signals":"Signals","f1":"Signals simulated in the page (12,000 samples per second): those of sheet 6 of the OpenBookRadio book, other signals from the book, and bonuses. For radio signals (AM, FM, AIS, LoRa…), you see the simulated intermediate frequency, as on an SDR screen; some are scaled down or sped up, as stated. For AM, SSB, FM, FM stereo, ISS and fading, you hear the demodulated sound, as from the receiver's loudspeaker, while the screen shows the radio signal; the voice is a synthetic voice that says no real words.","f2":"Time runs downwards in the waterfall and the footprint. CC BY-NC-SA 4.0 license, free, not for sale.","night":"Night mode","day":"Day mode","visits":"visits","plays":"plays","book_dl":"Download the book","book_dl2":"Download the OpenBookRadio book (free, PDF and EPUB, 13 languages)","display":"Display","theme_day":"Day","theme_night":"Night (red)","theme_phos":"Green phosphor","theme_phosb":"Blue phosphor","theme_phosa":"Amber phosphor","w3d":"3D waterfall","w3dHint":"drag to rotate"},"groups":["Analogue voice","Telegraphy","Data","Images","Aviation, maritime and rescue","Calling, sub-tones and paging","Radiosondes, sensors and connected devices","HF modes and curiosities","Broadcast and time","Wideband","Bonus: sounds from space","Bonus: shortwave curiosities","Bonus: underwater sounds"],"modes":{"am":{"sh":"broadcast","t":"AM: amplitude modulation","h":"The strength of the carrier follows the sound: the curve \"swells\" and \"shrinks\".","l":"A fixed line in the centre (the carrier), with two identical sidebands on each side. About 6 to 9 kHz wide. Shortwave and medium-wave broadcasting, aviation (sheets 12 and 14).","r":[["Listening","A jingle, then the presenter over background music. The two sidebands are mirror images: you see the melody, then the voice, on each side of the carrier."]]},"ssb":{"nm":"SSB","t":"SSB: single sideband","h":"Only one sideband remains, without carrier: nothing when nobody speaks.","l":"No central line, a single band about 2.7 kHz wide that only lives while someone talks. USB above 10 MHz, LSB below (radio amateurs). Badly tuned, the voice sounds like a \"duck\" (sheets 11 and 29)."},"fm":{"sh":"voice","t":"FM: frequency modulation","h":"The amplitude stays fixed; the oscillations get closer or wider apart with the sound.","l":"The signal dances around its frequency, wider when the sound is loud: 12.5 kHz per channel in narrow FM (walkie-talkies, repeaters), 200 kHz for FM broadcasting (sheets 2 and 13).","r":[["Listening","At the end, the short \"kshh\": the squelch closes when the transmitter stops."]]},"cw":{"t":"CW: Morse","h":"The carrier is switched on and off: dashes and dots.","l":"A very thin line that breaks to the rhythm of Morse; a beep to the ear. Here \"CQ\" (sheet 48).","r":[["Speed","20 words/min, 60 ms dot, at 700 Hz: \"CQ CQ CQ DE F4ABC K\""],["By ear","Pure beeps, long and short, on a single note"],["Decoding","By ear, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: two frequencies","h":"The frequency jumps between two values, one for 0, one for 1.","l":"Two parallel lines: 170 Hz apart for radio amateurs (45.45 baud), 450 or 850 Hz for weather bulletins. A steady \"tidilidi\" (sheet 32).","r":[["Code","Baudot ITA2: 5 bits + start + 1.5 stop; mark 2125 Hz, space 2295 Hz"],["Text","RYRYRYRY CQ CQ DE F4ABC"],["Decoding","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 baud: APRS and packet","h":"Two audio tones, 1200 and 2200 Hz, sent into an FM transmitter.","l":"Seen after the FM receiver (loudspeaker sound): a band from 1200 to 2200 Hz, in short bursts. By ear, a one-second \"grrrt\" (sheets 35 and 36).","r":[["Frequency","144.800 MHz in Europe (APRS), FM"],["Frame","0x7E flags then AX.25 data in NRZI"],["Decoding","Direwolf, multimon-ng, KISS TNC"]]},"psk31":{"t":"PSK31: phase modulation","h":"The frequency does not move, the phase reverses; the amplitude dips at each reversal.","l":"A very thin line about 60 Hz wide, slightly \"braided\". Dozens of stations fit in 3 kHz (sheet 29).","r":[["Code","Varicode: 0 = phase reversal, 1 = no change; when idle, two twin lines"],["Where to hear it","14,070 kHz, 3,580 kHz"],["Decoding","fldigi"]]},"ft8":{"t":"MFSK / FT8: eight tones","h":"The frequency goes up and down in steps of 6.25 Hz, 0.16 s per step.","l":"Bands about 50 Hz wide lasting 12.6 s and coming back every 15 s, synchronised to the clock: several stations at once within 3 kHz, for example on 7.074 MHz (sheet 29).","r":[["Frame","79 symbols of 0.16 s, three Costas patterns (start, middle, end); here eight stations"],["Frequencies","14,074, 7,074, 3,573, 10,136, 21,074, 28,074 kHz"],["Decoding","WSJT-X, JTDX (exact PC clock)"]]},"ft4":{"t":"FT4: the contest FT8","h":"Four tones spaced 20.8 Hz, 20.8 baud: 105 symbols in 5 s, in 7.5 s time slots.","l":"Bands about 90 Hz wide, shorter and wider than FT8, coming back every 7.5 s. 14,080, 7,047.5 kHz (sheet 29)."},"olivia":{"t":"Olivia 8/250: eight tones","h":"Eight tones spaced 31.25 Hz, one at a time, jumping at random; Walsh coding and interleaving.","l":"A block of scattered dots over 250 Hz; decodes far below the noise. A small random melody to the ear (sheet 29)."},"hell":{"t":"Feld Hell: writing with a carrier","h":"The carrier is switched on and off dot by dot: each letter is made of columns of 14 dots, scanned from bottom to top (245 dots per second).","l":"On the waterfall, a chopped line; the software screen (fldigi) redraws the letters. A soft crackle to the ear (sheet 29)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Four frequency levels: each symbol carries two bits.","l":"A rectangular block 6 to 12.5 kHz wide, full like noise, often in bursts (DMR splits the channel into two time slots). A hoarse \"frrr\" to the ear (sheet 46)."},"mt63":{"t":"MT63: emergency messages (NBEMS)","h":"64 tones at once, each slowly modulated, with lots of redundancy.","l":"A flat block of 1 or 2 kHz centred on 1500 Hz, with sharp edges; a steady hiss. Even works through a microphone held to a loudspeaker (sheet 31)."},"lora":{"t":"LoRa: frequency ramps (chirps)","h":"The frequency sweeps the whole width, then starts again from the bottom: the position of the jump carries the data.","l":"Parallel diagonals, easy to recognise: Meshtastic and MeshCore on 869.525 MHz or 433 MHz, LoRaWAN sensors (sheets 13, 23 and 24)."},"sstv":{"t":"SSTV: pictures in audio","h":"A sync pulse at 1200 Hz, then the frequency follows the brightness of the line, from 1500 (black) to 2300 Hz (white).","l":"Regular sync lines and a cloud that changes with the picture; a \"chirping\" sound for one to two minutes. 14.230 MHz, ISS on 145.800 MHz (sheet 37).","r":[["Frame","VIS header, then lines: 1200 Hz sync, green, blue, red; here 20 lines of a test pattern"],["Decoding","QSSTV, MMSSTV, Robot36 on a smartphone"]]},"fax":{"nm":"Weather fax","t":"Weather fax: 1500 Hz black, 2300 Hz white","h":"The frequency moves continuously from black to white, 120 lines per minute.","l":"Two fixed bands at 1500 and 2300 Hz (800 Hz apart), a steady \"tick-tock\". Published frequencies are carrier frequencies: listen in USB 1.9 kHz lower (sheet 38).","r":[["Frame","300 Hz start tone, phasing lines (white pulse), then the chart"],["Decoding","fldigi, JWX, HamFax"]]},"elt":{"nm":"ELT siren","t":"ELT / PLB siren on 121.5 MHz","h":"An AM signal whose tone falls from 1600 to 300 Hz, two to four times per second.","l":"A fixed carrier and sidebands sliding like a fan: the \"woo-woo\" of distress beacons, also on 121.375 MHz for exercises (sheets 27 and 28)."},"406":{"nm":"406 beacon","t":"406 MHz beacon: BPSK burst","h":"Half a second of transmission: 160 ms of pure carrier, then the phase swings by ±1.1 radian at 400 bit/s.","l":"A short little line coming back every 50 s, between 406.0 and 406.1 MHz; nothing useful to hear, a decoder is needed (EPIRB 406, sheet 28)."},"adsb":{"t":"ADS-B / Mode S (1090 MHz): pulses","h":"0.5 µs pulses whose position carries the bits (PPM); here the time scale is greatly slowed down.","l":"Very short horizontal lines across the whole width, hundreds per second near an airport; an SDR dongle is needed (sheet 15).","n":"time scale greatly slowed down"},"acars":{"t":"ACARS: AM and MSK data","h":"An AM signal carrying two tones, 1200 and 2400 Hz, at 2400 bit/s.","l":"Half-second bursts with carrier and sidebands, on 131.525, 131.725 or 131.825 MHz in Europe: a \"brrrt\" to the ear (sheet 16)."},"ais":{"t":"AIS: GMSK 9600 baud on two channels","h":"A smoothed FSK (GMSK) in 26 ms bursts, once on 161.975 MHz, once on 162.025 MHz (reduced scale).","l":"Two columns of short little lines, 50 kHz apart, a regular clicking; the more ships, the denser it gets (sheet 19).","n":"reduced scale"},"navtex":{"t":"NAVTEX and DSC on medium and short waves: 170 Hz FSK","h":"Like RTTY: two frequencies 170 Hz apart, but at 100 baud.","l":"Two parallel lines, continuous during the bulletin, on 518 and 490 kHz (NAVTEX) or 2187.5 kHz (digital selective calling) (sheet 20).","r":[["Code","SITOR-B, CCIR 476: 7 bits with four \"1\"s, with FEC repetition"],["Decoding","fldigi, YaND"]]},"hfdl":{"t":"HFDL: aircraft on shortwave","h":"A 1800 baud PSK on a 1440 Hz subcarrier.","l":"Bursts about 2.4 kHz wide between 2.9 and 22 MHz; a modem hiss that comes and goes (sheet 17)."},"ctcss":{"t":"CTCSS: a sub-tone under the voice","h":"A low continuous tone (67 to 254 Hz, here 88.5 Hz) added to the voice.","l":"Seen in the FM receiver audio: a fixed line at the very bottom, under the voice; it opens the squelch of repeaters and walkie-talkies (sheet 10)."},"dtmf":{"sh":"2 tones","t":"DTMF: two tones per key","h":"Each keypad key sends a low tone (697 to 941 Hz) and a high one (1209 to 1633 Hz) at the same time.","l":"Pairs of dots aligned on eight fixed columns; the \"beep-beep\" of phone numbers and repeater commands (sheet 10).","r":[["Sequence","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tones","t":"CCIR Selcall: tones in sequence","h":"Five 100 ms tones one after the other, one per digit.","l":"A small staircase of dots, repeated; a quick \"tululululu\" to call one specific radio (sheet 33).","r":[["Sequence","1 2 3 4 5, twice; also decoded by the SelCall app of the UV-K1"]]},"pocsag":{"sh":"pagers","t":"POCSAG and FLEX: pagers","h":"An FSK at ±4.5 kHz; a 1010… preamble then the data (reduced scale).","l":"Two clean lines during the preamble, then a full band; a shrill \"brrrrt\". 466.075 MHz, DAPNET 439.9875 MHz (sheet 45).","n":"reduced scale"},"ale":{"sh":"8 tones","t":"ALE: automatic link establishment on shortwave","h":"Eight tones from 750 to 2500 Hz, 125 baud, in bursts.","l":"A block about 2 kHz wide made of small dots, one to two seconds, sometimes on several nearby frequencies; a high-pitched twitter (sheet 34)."},"rs41":{"nm":"RS41 radiosonde","t":"RS41 radiosonde: continuous GFSK","h":"A smoothed FSK at 4800 baud, non-stop; the frequency drifts slowly as the sonde rises and cools down.","l":"A band about 10 kHz wide that slides at an angle during the whole flight, between 400 and 406 MHz (sheet 21)."},"ook":{"nm":"433 sensors","t":"433 MHz sensors: OOK","h":"The carrier switches on and off in short or long pulses (on-off keying); the message is repeated three times.","l":"Bursts of small dots, often in threes, on 433.92 MHz: weather stations, temperature probes, remote controls (sheet 22)."},"fhss":{"t":"Bluetooth: frequency hopping (FHSS)","h":"The frequency changes 1600 times per second among 79 channels (reduced scale).","l":"Small lines scattered everywhere over 80 MHz, never in the same place, around 2.4 GHz (sheet 25).","n":"reduced scale"},"wspr":{"t":"WSPR: propagation beacons","h":"Four tones spaced 1.46 Hz, 0.68 s per symbol, for 110.6 s.","l":"A very thin line about 6 Hz wide lasting almost two minutes, every even two minutes: you have to zoom in a lot (sheet 29).","n":"24 s excerpt (a transmission lasts 110.6 s)"},"qrss":{"t":"QRSS: very slow Morse","h":"A carrier switched on and off, with dots of 3 to 10 s, often on two nearby frequencies (DFCW).","l":"Lines a few Hz wide, read on a ten-minute screen; inaudible to the ear (sheet 30).","n":"sped up: 0.6 s dot instead of 3 to 10 s"},"texte":{"nm":"Text in the waterfall","t":"Text in the waterfall","h":"Each line of a picture becomes a group of tones: the sound is like noise.","l":"The text or drawing appears directly on the SDR screen (sheet 40).","r":[["Note","Sent from the bottom of the picture: upright on the live waterfall, upside down in the footprint (read from top to bottom)"]]},"vara":{"t":"Modern HF data: VARA, Pactor, ARDOP","h":"Long full bursts (OFDM or PSK) and, in between, short replies from the other station.","l":"A rectangle about 2.4 kHz wide that stops and starts again, with a small acknowledgement in between; a chopped hiss (sheet 29)."},"chirp":{"nm":"Ionospheric sounder","t":"Ionospheric sounder (chirp sounder)","h":"A slow frequency ramp crossing the whole HF band; echoes from the ionosphere arrive a little later.","l":"A diagonal sweeping the screen, doubled by parallel lines (the echoes); a \"ffweet\" that passes in a fraction of a second."},"oth":{"nm":"Over-the-horizon radar","t":"Over-the-horizon radar (\"woodpecker\")","h":"Pulses repeated 10 to 50 times per second, each several kHz wide.","l":"A wide striped block covering whole bands; a very regular woodpecker knocking on shortwave."},"parasites":{"nm":"Interference","sh":"power supply","t":"Interference from a switching power supply","h":"A square wave: its frequency and all its harmonics come out at the same time.","l":"A comb of regular lines drifting together, on a noise background: look for it with NOISE FIND or a portable receiver (sheet K22)."},"mpx":{"nm":"FM stereo and RDS","t":"FM stereo radio and RDS","h":"The demodulated sound (multiplex) contains the L+R channel, a 19 kHz pilot, the L-R channel around 38 kHz and RDS at 57 kHz.","l":"Seen from 0 to 60 kHz after demodulation: a low block, a thin line at 19 kHz, a weaker block in the middle and RDS at the very top (sheet 12).","n":"scale ÷ 20; stereo sound","r":[["Listening","With headphones: 4 s in mono (the middle block, L-R, disappears), then 4 s in stereo, the melody on the left and the chords on the right."]]},"dcf77":{"t":"DCF77 time signal (77.5 kHz)","h":"A carrier dropping to 15 % for 0.1 s (bit 0) or 0.2 s (bit 1), at the start of each second.","l":"A fixed line with a black gap every second; the 59th second has none, to mark the minute (sheet 12).","r":[["Note","Here the carrier is brought down to 1000 Hz; the 6th second has no gap, like the 59th second of each minute"]]},"ofdm":{"t":"OFDM: dozens of subcarriers","h":"Many tightly packed carriers, each slow: the sum looks like noise.","l":"A flat rectangle with sharp edges, always there: DRM on shortwave (10 kHz), DAB+ (1.5 MHz), DVB-T, Wi-Fi. A continuous hiss to the ear (sheets 12 and 25)."},"dsss":{"t":"Spread spectrum (DSSS): GPS, Wi-Fi 802.11b","h":"The data are mixed with a very fast code: the energy is spread over a wide band.","l":"A wide hump, barely above the noise; GPS is even below the noise and cannot be seen without processing (sheets 25 and 26)."},"hline":{"nm":"Hydrogen line","sh":"1420 MHz","t":"21 cm hydrogen line (1420.405 MHz)","h":"Cold hydrogen in the Milky Way emits a very faint hiss on 1420.405 MHz. The motion of the galaxy's arms shifts it by the Doppler effect: you see several small humps.","l":"Almost nothing in the waterfall from one second to the next: you have to average for a long time to see the humps rise out of the noise. Here, look at the average spectrum when stopped. A dish or a horn, a preamp and an SDR dongle are enough.","n":"signal greatly exaggerated"},"sun":{"nm":"Sun","sh":"bursts","t":"Sun: type III radio bursts","h":"Electrons thrown out by a flare cross the Sun's corona and make it emit at lower and lower frequencies as they move away.","l":"Lines falling diagonally from the top to the bottom of the spectrum in less than a second, over a background of solar noise; a swelling \"shhhh\". From about 10 to 400 MHz, also on shortwave around 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter: decametric bursts (L and S)","h":"Jupiter's magnetic field and its moon Io produce powerful emissions between 15 and 40 MHz: slow L bursts and very short S bursts that slide down fast.","l":"First waves of hiss (L, like surf on a beach), then trains of little \"pops\" (S) in tight diagonals. Around 20.1 MHz at night, with a simple dipole, when Io is well placed."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"A spinning neutron star sweeps the Earth with a radio beam, here every 0.714 s. Interstellar gas delays the low frequencies: each pulse arrives first at the top of the spectrum.","l":"A regular \"tick\"; in the waterfall each pulse is a curve sloping down (dispersion). The real signal is below the noise: you need a big antenna and must add up the pulses over their period.","n":"signal greatly exaggerated"},"meteor":{"nm":"Meteors","sh":"GRAVES","t":"Meteor echoes from the GRAVES radar (143.050 MHz)","h":"The French GRAVES radar transmits non-stop on 143.050 MHz. When a shooting star ionises the air, its trail reflects a little of that signal to your receiver, for a fraction of a second to a few seconds.","l":"In USB on 143.049 MHz: short \"pings\" around 1000 Hz, sometimes an echo that slides (the meteor head, Doppler effect) or one that lasts. Far more during showers (Perseids, Geminids) (sheet 1)."},"whistler":{"nm":"Whistlers","sh":"VLF","t":"VLF whistlers","h":"Lightning makes a radio click; part of it follows the Earth's magnetic field lines to the other hemisphere and back, high notes first.","l":"A \"pyooo\" falling from high to low in one or two seconds, right after a click; crackles (sferics) everywhere. Below 10 kHz, with a VLF receiver far from power lines."},"chorus":{"nm":"Dawn chorus","sh":"VLF","t":"Dawn chorus","h":"During a magnetic storm, electrons trapped in the magnetosphere emit small rising notes, mostly around sunrise.","l":"Overlapping rising chirps, like birds, from about 1 to 4 kHz. Same equipment as for whistlers."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"The first artificial satellite sent beeps of about 0.3 s on 20.005 and 40.002 MHz, alternately, for three weeks.","l":"A regularly broken line: \"beep… beep…\", the sound the whole world listened to in October 1957 (reconstruction)."},"doppler":{"nm":"Doppler effect","sh":"satellite","t":"Satellite beacon and Doppler effect","h":"A low-orbit satellite comes closer then moves away: the received frequency falls during the pass, by about ±3 kHz at 145 MHz and ±10 kHz at 435 MHz.","l":"A line falling in an S shape: slowly at first, fast when the satellite is closest, then slowly again (sheet 41).","n":"10 min pass squeezed into 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA satellites: APT images (historical)","h":"A 2400 Hz subcarrier amplitude-modulated by the picture, two lines per second, with a sync pulse at the start of each line. Stopped in 2025; Meteor-M satellites now transmit LRPT.","l":"A line at 2400 Hz with sidebands that change with the picture, and the famous \"tick-tock\" twice a second (sheet 41)."},"eme":{"nm":"Moon echo"
