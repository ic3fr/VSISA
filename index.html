odzą przez koronę słoneczną i sprawiają, że emituje coraz niżej, w miarę jak się oddalają.","l":"Kreski spadające ukośnie z góry na dół widma w mniej niż sekundę, na tle szumu słonecznego; narastające „szszsz”. Od około 10 do 400 MHz, także na falach krótkich w okolicy 20 MHz."},"jupiter":{"nm":"Jowisz","sh":"20 MHz","t":"Jowisz: rozbłyski dekametrowe (L i S)","h":"Pole magnetyczne Jowisza i jego księżyc Io wytwarzają silną emisję między 15 a 40 MHz: powolne rozbłyski L i bardzo krótkie rozbłyski S, które szybko zjeżdżają w dół.","l":"Najpierw fale szumu (L, jak przybój), potem serie drobnych „pyknięć” (S) w gęstych przekątnych. Okolice 20,1 MHz nocą, z prostym dipolem, gdy Io jest dobrze ustawiona."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Wirująca gwiazda neutronowa omiata Ziemię wiązką radiową, tutaj co 0,714 s. Gaz międzygwiazdowy opóźnia niskie częstotliwości: każdy impuls dociera najpierw na górę widma.","l":"Regularne „tik”; w wodospadzie każdy impuls to opadająca krzywa (dyspersja). Prawdziwy sygnał jest pod szumem: potrzeba dużej anteny i sumowania impulsów w ich okresie.","n":"sygnał mocno przesadzony"},"meteor":{"nm":"Meteory","sh":"GRAVES","t":"Echa meteorów z radaru GRAVES (143,050 MHz)","h":"Francuski radar GRAVES nadaje bez przerwy na 143,050 MHz. Gdy spadająca gwiazda jonizuje powietrze, jej ślad odbija trochę tego sygnału do twojego odbiornika, na ułamek sekundy do kilku sekund.","l":"W USB na 143,049 MHz: krótkie „pingi” około 1000 Hz, czasem echo, które się przesuwa (głowa meteoru, efekt Dopplera) albo trwa dłużej. O wiele więcej podczas rojów (Perseidy, Geminidy) (karta 1)."},"whistler":{"nm":"Gwizdy","sh":"VLF","t":"Gwizdy VLF (whistlery)","h":"Piorun wytwarza radiowy trzask; część biegnie wzdłuż linii ziemskiego pola magnetycznego na drugą półkulę i z powrotem, wysokie tony najpierw.","l":"„Fiuuu” opadające od wysokich do niskich tonów w sekundę lub dwie, tuż po trzasku; wszędzie trzaski (sferyki). Poniżej 10 kHz, z odbiornikiem VLF z dala od linii energetycznych."},"chorus":{"nm":"Chór świtu","sh":"VLF","t":"Chór świtu (dawn chorus)","h":"Podczas burzy magnetycznej elektrony uwięzione w magnetosferze wydają małe rosnące nuty, głównie o świcie.","l":"Nakładające się, wznoszące ćwierkania, jak ptaki, od około 1 do 4 kHz. Ten sam sprzęt co do gwizdów."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"Pierwszy sztuczny satelita przez trzy tygodnie nadawał piknięcia po około 0,3 s, na przemian na 20,005 i 40,002 MHz.","l":"Regularnie przerywana kreska: „pip… pip…”, dźwięk, którego w październiku 1957 słuchał cały świat (rekonstrukcja)."},"doppler":{"nm":"Efekt Dopplera","sh":"satelita","t":"Radiolatarnia satelity i efekt Dopplera","h":"Satelita na niskiej orbicie zbliża się, a potem oddala: odbierana częstotliwość spada podczas przelotu, o około ±3 kHz na 145 MHz i ±10 kHz na 435 MHz.","l":"Kreska opadająca w kształcie litery S: najpierw powoli, szybko w chwili największego zbliżenia, potem znów powoli (karta 41).","n":"przelot 10 min skrócony do 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satelity NOAA: obrazy APT (historia)","h":"Podnośna 2400 Hz modulowana amplitudowo obrazem, dwie linie na sekundę, z impulsem synchronizacji na początku każdej linii. Wyłączone w 2025; dziś satelity Meteor-M nadają LRPT.","l":"Kreska na 2400 Hz ze wstęgami bocznymi zmieniającymi się z obrazem i słynne „tik-tak” dwa razy na sekundę (karta 41)."},"eme":{"nm":"Echo od Księżyca","sh":"EME","t":"Echo od Księżyca (EME)","h":"Sygnał wysłany w stronę Księżyca wraca po około 2,5 s, ogromnie osłabiony, nieco poszerzony i przesunięty przez Dopplera.","l":"Słychać własne „pip”, a po 2,5 s jego słabe, nieco rozmyte echo. Krótkofalowcy robią to w CW lub JT65, od 144 MHz w górę (karta 1).","n":"echo mocno przesadzone"},"msk144":{"nm":"MSK144","sh":"meteory","t":"MSK144: emisja cyfrowa do łączności przez meteory","h":"Dwa tony, 1000 i 2000 Hz, 2000 bodów, w ramkach po 72 ms powtarzanych bez przerwy: każdy ślad meteoru przepuszcza kilka z nich.","l":"Paczki od 0,1 do 1 s, szerokie na około 2,4 kHz, które pojawiają się i gasną z „pingiem” meteoru. Na 50 i 144 MHz, z WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tonów","t":"JT65: 65 tonów, bardzo wolno","h":"Jeden ton synchronizacji i 64 tony danych co 2,7 Hz (JT65A), 0,37 s na symbol, 47 s nadawania na minutę.","l":"Drabinka drobnych kresek na około 180 Hz, z kreską synchronizacji, która wraca stale w to samo miejsce. Używana do odbić od Księżyca (JT65B i C) i bardzo słabych sygnałów.","n":"fragment 20 s (emisja trwa 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: profesjonalna sieć cyfrowa","h":"Modulacja fazy π/4-DQPSK, 18 000 symboli na sekundę, cztery szczeliny czasowe, w kanałach 25 kHz.","l":"Pełny blok o zaokrąglonych bokach, stale obecny przy stacji bazowej; chrapliwy szum. Szyfrowane: nie da się słuchać (karta 46).","n":"skala zmniejszona"},"ndb":{"nm":"Radiolatarnia NDB","sh":"190–535 kHz","t":"NDB: bezkierunkowa radiolatarnia","h":"Stała nośna na falach długich ze znakiem Morse'a z dwóch lub trzech liter nadawanym tonem (często 1020 Hz).","l":"Stała kreska pośrodku, a w czasie znaku dwie kreseczki po bokach. Około 190–535 kHz, w SSB lub CW (karta 12)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: radiolatarnia ogólnokierunkowa","h":"W AM: sygnał 30 Hz zależny od kierunku, podnośna 9960 Hz modulowana częstotliwościowo 30 Hz (odniesienie) i znak Morse'a na 1020 Hz.","l":"W zdemodulowanym dźwięku: niskie buczenie 30 Hz, szeroka falująca kreska w okolicy 10 kHz i co jakiś czas znak (karta 18).","n":"dźwięk zdemodulowany, skala ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: naprowadzanie do lądowania (localizer)","h":"W AM dwa tony 90 i 150 Hz; ich stosunek mówi samolotowi, czy jest na lewo, czy na prawo od osi. Znak Morse'a zaczyna się od I.","l":"W zdemodulowanym dźwięku: dwie bardzo niskie kreski na 90 i 150 Hz oraz znak na 1020 Hz. Między 108,1 a 112 MHz; ścieżka schodzenia około 330 MHz (karta 18)."},"m10":{"nm":"Sondy M10 / M20","sh":"Meteomodem","t":"Radiosondy M10 i M20 (Meteomodem)","h":"Jedna ramka na sekundę w szybkim FSK (około 9600 bodów): szersza niż RS41. We Francji wypuszcza je Météo-France.","l":"Co sekundę szeroka paczka, która powoli dryfuje w czasie lotu; między 400 a 406 MHz (karta 21)."},"tpms":{"nm":"Opony (TPMS)","sh":"433 MHz","t":"Czujniki ciśnienia w oponach (TPMS)","h":"Każde koło od czasu do czasu wysyła paczkę FSK trwającą kilka milisekund: ciśnienie, temperatura, identyfikator.","l":"Małe pojedyncze paczki na 433,92 MHz (lub 315 MHz), często parami, gdy przejeżdża samochód. Dekoduje je rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Sygnał czasu ALS162 (Allouis, 162 kHz)","h":"Nośna dawnych fal długich France Inter; czas jest kodowany małymi, niesłyszalnymi zmianami fazy.","l":"Stała kreska, bardzo silna we Francji, ledwo poszerzona na początku każdej sekundy; do odczytu czasu potrzebny dekoder (karta 12)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Sygnał czasu WWV (Kolorado)","h":"W AM: co sekundę „tyk” 5 ms na 1000 Hz, ton 500 lub 600 Hz, kod czasu na 100 Hz i głos podający czas UTC.","l":"W zdemodulowanym dźwięku: kreska na 500 Hz przerywana co sekundę, tyknięcie na 1000 Hz i kod na samym dole na 100 Hz (karta 12)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Sygnał czasu MSF (Anthorn, 60 kHz)","h":"Nośna jest wyłączana na początku każdej sekundy na 0,1, 0,2 lub 0,3 s zależnie od bitów, a na 0,5 s dla oznaczenia minuty.","l":"Stała kreska z całkiem czarnymi przerwami co sekundę, dłuższymi niż w DCF77 (karta 12)."},"type2":{"nm":"Słońce typ II","sh":"fala uderzeniowa","t":"Słońce: rozbłyski radiowe typu II","h":"Fala uderzeniowa koronalnego wyrzutu masy sprawia, że plazma emituje powoli coraz niżej, często w dwóch pasmach (podstawowym i podwojonym).","l":"Dwa równoległe pasma szumu, które przez kilka minut łagodnie opadają. Porównaj z typem III, znacznie szybszym.","n":"kilka minut skrócone do 6 s"},"tweeks":{"nm":"Tweeki","sh":"VLF","t":"Tweeki: nocne „pingi” VLF","h":"Nocą trzask odległego pioruna odbija się między ziemią a jonosferą; częstotliwości bliskie odcięcia (około 1,7 kHz) docierają ostatnie.","l":"Małe „ping”, które opada i zatrzymuje się około 1,7 kHz, czasem z echem na podwójnej częstotliwości; wszędzie trzaski. Poniżej 10 kHz, nocą."},"hiss":{"nm":"Szum VLF","sh":"hiss","t":"Szum VLF (hiss)","h":"Szeroki szum wytwarzany przez elektrony plazmasfery, rosnący i malejący z aktywnością magnetyczną.","l":"Pasmo szumu od kilkuset Hz do kilku kHz, bez wzoru, powoli narastające i opadające."},"aurora":{"nm":"Zorza radiowa","sh":"Au","t":"Propagacja zorzowa (Au)","h":"Zorza polarna odbija fale UKF, ale bardzo szybko nimi potrząsa: każdy sygnał rozmywa się na kilkaset Hz.","l":"CW zmienia się w szorstki, jakby szeptany szum; nie słychać już tonu. Na 50 i 144 MHz, z anteną na północ podczas burz magnetycznych."},"galactic":{"nm":"Szum galaktyczny","sh":"20–40 MHz","t":"Szum Drogi Mlecznej","h":"Centrum Galaktyki emituje szum radiowy, który Karl Jansky odkrył w 1932 roku około 20 MHz. Rośnie i maleje wraz z obrotem Ziemi.","l":"Szum tła, który powoli rośnie i znów opada, każdego dnia około 4 minut wcześniej. Widoczny z prostym dipolem między 20 a 40 MHz.","n":"jeden dzień skrócony do 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"Telemetria CubeSata","h":"Małe satelity regularnie wysyłają pomiary (bateria, temperatury) w FSK lub GMSK 1200 lub 9600 bodów, w okolicy 435–438 MHz.","l":"Regularne paczki, które za każdym razem schodzą trochę niżej przez efekt Dopplera, w czasie przelotu (karta 41).","n":"skala zmniejszona, przelot przyspieszony"},"issfm":{"nm":"ISS w FM","sh":"145,800 MHz","t":"Stacja kosmiczna (ISS): głos w FM","h":"Astronauci rozmawiają ze szkołami i krótkofalowcami w FM na 145,800 MHz. Stacja leci 28 000 km/h: podczas przelotu odbierana częstotliwość przesuwa się od około +3,5 kHz do −3,5 kHz.","l":"Pasmo głosu FM, które w czasie 10-minutowego przelotu powoli przesuwa się z prawej na lewą (karta 41).","n":"przelot 10 min skrócony do 10 s"},"buzzer":{"nm":"UVB-76 „The Buzzer”","sh":"4625 kHz","t":"UVB-76, „The Buzzer” (4625 kHz)","h":"Rosyjska stacja wojskowa, która od dziesięcioleci nadaje około sekundowe brzęczenie, mniej więcej 25 razy na minutę, czasem przerywane komunikatem głosowym.","l":"Stała nośna, a przy każdym brzęczeniu kolumna gęstych prążków z góry na dół. Łatwo ją znaleźć na 4625 kHz w USB."},"pip":{"nm":"„The Pip”","sh":"3756 / 5448 kHz","t":"„The Pip”: niekończące się piknięcia","h":"Kolejna rosyjska wojskowa radiolatarnia krótkofalowa, która dzień i noc powtarza krótkie piknięcia, czasem przerywane komunikatami.","l":"Stała kreska przerywana krótkim piknięciem około 50 razy na minutę; na słuch równe „pip… pip…”, które nigdy nie milknie.","n":"rytm przybliżony"},"squeaky":{"nm":"„Squeaky Wheel”","sh":"KF","t":"„Squeaky Wheel”: skrzypiące koło","h":"Rosyjska wojskowa radiolatarnia krótkofalowa, nazwana przez nasłuchowców od powtarzanego wzoru dźwięku.","l":"Mały wzór dwóch dźwięków, z których jeden rośnie, powtarzany w pętli: jak skrzypiące koło.","n":"przybliżona imitacja"},"codar":{"nm":"CODAR","sh":"radar oceaniczny","t":"CODAR: radary prądów morskich","h":"Radary przybrzeżne raz lub dwa razy na sekundę przemiatają pasmo częstotliwości, by mierzyć prądy i fale.","l":"Regularne równoległe przekątne i powtarzane „swish”; w okolicy 4,5–5,5 MHz, 13 MHz i 25 MHz, często dzień i noc.","n":"skala zmniejszona"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Modem wojskowy STANAG 4285","h":"Modulacja fazy 8-PSK, 2400 bodów, na nośnej 1800 Hz, z sekwencją testową co 107 ms do śledzenia kanału.","l":"Pełny blok około 3 kHz; na słuch szum z regularnym brzęczeniem (karta 43)."},"link11":{"nm":"Link-11","sh":"16 tonów","t":"Link-11: morskie łącze danych","h":"Szesnaście tonów od 605 do 2915 Hz nadawanych razem, każdy modulowany fazowo 75 razy na sekundę.","l":"Grzebień czternastu regularnych prążków od 935 do 2365 Hz i dwa prążki z boku, na 605 i 2915 Hz; na słuch muzyczne buczenie (karta 43)."},"numbers":{"nm":"Stacja numeryczna","sh":"głos","t":"Stacja numeryczna","h":"O stałej porze krótka melodia wywoławcza, potem głos (często syntetyczny) czyta grupy po pięć cyfr, w AM lub SSB.","l":"Melodia w osobnych nutach, potem regularne grupy sylab rozdzielone ciszą (karta 43).","n":"głos naśladowany, bez prawdziwych cyfr"},"rttydwd":{"nm":"RTTY pogodowe DWD","sh":"50 Bd / 450 Hz","t":"Pogodowe RTTY służby DWD (Niemcy)","h":"Jak RTTY krótkofalowców, ale 50 bodów z przesuwem 450 Hz: niemiecka służba meteorologiczna nadaje komunikaty i prognozy morskie otwartym tekstem.","l":"Dwie kreski znacznie dalej od siebie i nieco szybszy rytm. Między komunikatami wywołanie „CQ CQ CQ DE DDK2 DDH7 DDK9”, potem RYRYRY. Na 4583, 7646 i 10 100,8 kHz, także 147,3 kHz (karta 32)."},"mfsk16":{"nm":"MFSK16","sh":"16 tonów","t":"MFSK16: szesnaście tonów","h":"Szesnaście tonów co 15,625 Hz, zawsze jeden naraz, 15,625 razy na sekundę; każdy ton niesie cztery bity chronione kodem korekcyjnym.","l":"Pasmo 316 Hz z małych schodków, które ciągle przeskakują, po stałym tonie na początku. Na słuch szybka melodyjka, jak flet. Służy też do przesyłania małych obrazków."},"sitora":{"nm":"SITOR-A (ARQ)","sh":"teleks","t":"SITOR-A: teleks morski w ARQ","h":"Stacja wysyła bloki po trzy znaki (210 ms, 100 bodów, przesuw 170 Hz) co 450 ms; między blokami druga stacja odpowiada krótkim sygnałem „odebrano” lub „powtórz”.","l":"Krótkie regularne paczki z małą, słabszą odpowiedzią pomiędzy: „cyk-cyk” jak świerszcz. Na falach krótkich już rzadkie."},"dscvhf":{"nm":"DSC UKF (kanał 70)","sh":"DSC","t":"DSC: cyfrowe wywołanie selektywne na kanale 70","h":"Paczka trwająca około pół sekundy, 1200 bodów, na dwóch tonach 1300 i 2100 Hz: niesie numer MMSI statku, rodzaj wywołania, a w niebezpieczeństwie także pozycję.","l":"Krótkie, wysokie „brrrt” na 156,525 MHz, zaczynające się serią naprzemiennych bitów. Na falach średnich i krótkich DSC to FSK 100 bodów, jak NAVTEX (karta 20)."},"selcal":{"nm":"SELCAL lotniczy","sh":"4 tony","t":"SELCAL: selektywne wywołanie samolotów na falach krótkich","h":"Kontrola wywołuje jeden konkretny samolot dwoma około sekundowymi impulsami, każdy z dwóch tonów spośród szesnastu (312,6 do 1479,1 Hz). W samolocie zapala się lampka i odzywa gong: załoga nie musi stale słuchać.","l":"Dwa akordy po sobie, „bim-bam”, między komunikatami głosowymi na częstotliwościach lotniczych w SSB, na przykład 5616 lub 8864 kHz."},"dcs":{"nm":"DCS","sh":"134,4 bit/s","t":"DCS: cyfrowy podton","h":"Zamiast ciągłego tonu jak w CTCSS radio wysyła pod głosem 23-bitowe słowo powtarzane bez przerwy z szybkością 134,4 bita na sekundę. Na końcu ton 134,4 Hz cicho zamyka blokadę szumów.","l":"W dźwięku odbiornika FM: nieregularne pasmo na samym dole, poniżej 300 Hz, i głuche buczenie, jeśli filtr radia je przepuści (karta 10)."},"t1750":{"nm":"Ton 1750 Hz","sh":"przemiennik","t":"Ton 1750 Hz: otwieranie przemiennika","h":"Krótki ton 1750 Hz (około 0,5 do 1 s) na początku nadawania wciąż otwiera niektóre europejskie przemienniki amatorskie; przemiennik często odpowiada piknięciem po zwolnieniu przycisku.","l":"Krótka kreska na 1750 Hz, potem głos, potem piknięcie przemiennika (karta 10)."},"ncdxf":{"nm":"Radiolatarnie NCDXF","sh":"14,100 MHz","t":"Radiolatarnie NCDXF / IARU: sprawdzanie propagacji","h":"Osiemnaście radiolatarni na świecie nadaje po kolei, każda dziesięć sekund, na 14,100, 18,110, 21,150, 24,930 i 28,200 MHz: znak Morse'em, potem cztery sekundowe kreski mocą 100 W, 10 W, 1 W i 0,1 W.","l":"Znak, potem cztery coraz słabsze kreski: jeśli słyszysz jeszcze ostatnią, propagacja do tej radiolatarni jest znakomita. Tutaj 4U1UN (Nowy Jork), potem VE8AT (Kanada) (karta 30)."},"lrpt":{"nm":"Meteor-M LRPT","sh":"137,9 MHz","t":"Satelity Meteor-M: obrazy LRPT","h":"Rosyjskie satelity meteorologiczne Meteor-M wysyłają obrazy cyfrowo: czterostanowa modulacja fazy (QPSK), 72 000 symboli na sekundę, szerokość około 120 kHz.","l":"Pełny blok o zaokrąglonych brzegach, który powoli przesuwa się podczas przelotu (efekt Dopplera); na słuch zwykły szum. Na 137,9 lub 137,1 MHz, dekoduje SatDump (karta 41).","n":"skala zmniejszona"},"quindar":{"nm":"Tony Quindar","sh":"NASA","t":"Tony Quindar: piknięcia Apollo","h":"Gdy kontrola w Houston naciska przycisk mikrofonu, piknięcie 2525 Hz (250 ms) włącza nadajniki stacji naziemnych; po zwolnieniu piknięcie 2475 Hz je wyłącza.","l":"Wysokie piknięcie przed każdym zdaniem i drugie, nieco niższe, po nim: słynny dźwięk nagrań z misji Apollo."},"wow":{"nm":"Sygnał „Wow!”","sh":"1977","t":"Sygnał „Wow!” (15 sierpnia 1977)","h":"Radioteleskop Big Ear (Ohio) odebrał przez 72 sekundy wąski i bardzo silny sygnał w pobliżu linii wodoru, około 1420,456 MHz. Astronom Jerry Ehman napisał na wydruku „Wow!”. Nigdy się nie powtórzył, a jego pochodzenie wciąż jest przedmiotem sporu.","l":"Cienka kreska, która wyłania się z szumu, rośnie i słabnie: kształt przejścia stałego źródła przez wiązkę anteny. To rekonstrukcja: nie istnieje żadne nagranie dźwiękowe.","n":"72 s skrócone do 12 s"},"frb":{"nm":"Szybki błysk radiowy","sh":"FRB","t":"Szybki błysk radiowy (FRB)","h":"Błysk radiowy trwający kilka milisekund, z innej galaktyki; pierwszy odkryto w 2007 roku. Gaz po drodze mocno opóźnia niskie częstotliwości: błysk dociera rozciągnięty, wysokie tony najpierw.","l":"Jedna krzywa opadająca z góry na dół widma, a potem nic. Niektóre się powtarzają; większość widziano tylko raz.","n":"mocno spowolnione i przesadzone"},"letterb":{"nm":"Radiolatarnie jednoliterowe","sh":"D, P, S, C…","t":"Radiolatarnie jednoliterowe","h":"Nadajniki rosyjskiej marynarki powtarzają bez końca jedną literę Morse'em, każdy 100 Hz od sąsiada: D, P, S, C, A, F, K lub M zależnie od miejsca.","l":"Równoległe przerywane linie, bardzo blisko siebie, każda we własnym rytmie. Okolice 4558, 5154, 7039, 10 872, 13 528 i 16 332 kHz, w CW."},"sid":{"nm":"Rozbłysk słoneczny na VLF","sh":"SID","t":"Rozbłysk słoneczny widziany na VLF (SID)","h":"Nadajniki VLF marynarek (20,9 kHz we Francji, 23,4 kHz w Niemczech…) rozchodzą się między ziemią a jonosferą. Gdy dociera rozbłysk słoneczny, jego promienie X w kilka minut zmieniają dół jonosfery i poziom odbioru skacze.","l":"Wąskie, równe pasmo (sygnał MSK nadajnika), które nagle staje się silniejsze, a potem powoli wraca do normy. Wystarczy pętla z drutu i karta dźwiękowa: klasyczny projekt kół astronomicznych.","n":"godzina skrócona do 12 s"},"qrn":{"nm":"Trzaski burzowe","sh":"QRN","t":"Trzaski burzowe (QRN)","h":"Każdy piorun to bardzo silny nadajnik pokrywający wszystkie częstotliwości naraz. Na falach średnich i krótkich słychać burze odległe o tysiące kilometrów, głównie latem i na niskich pasmach.","l":"Nieregularne poziome kreski na całej szerokości; suche trzaski na słuch. Eliminator zakłóceń (NB) trochę pomaga, antena ramowa bardziej."},"fading":{"nm":"Zanik selektywny","sh":"QSB","t":"Zanik selektywny (QSB)","h":"Na falach krótkich sygnał dociera kilkoma drogami przez jonosferę. Zależnie od częstotliwości dodają się lub znoszą: wąski dołek wędruje przez sygnał.","l":"Ciemna strefa powoli przesuwająca się przez stację AM. Gdy przechodzi przez nośną pośrodku, dźwięk na kilka sekund staje się chrapliwy i zniekształcony; detekcja synchroniczna lub odbiór w SSB to naprawia."},"plc":{"nm":"PLC","sh":"2–30 MHz","t":"PLC: internet przez gniazdka elektryczne","h":"Adaptery PLC wysyłają dane po przewodach w domu na setkach nośnych między 2 a 30 MHz (w nowszych modelach wyżej), jedna co 24,4 kHz. Przewody promieniują jak antena.","l":"Grzebień regularnych prążków migający paczkami, z przerwami na pasmach amatorskich (wycięcia wymagane normą); na słuch trzeszczenie podążające za ruchem w internecie (karta 43).","n":"skala zmniejszona"},"fence":{"nm":"Pastuch elektryczny","sh":"tyk… tyk…","t":"Pastuch elektryczny","h":"Elektryzator wysyła do drutu impuls kilku tysięcy woltów mniej więcej raz na sekundę. Jeśli trawa dotyka drutu albo izolator jest uszkodzony, przeskakuje iskra i promieniuje na wszystkich częstotliwościach.","l":"Bardzo cienka pozioma kreska na całej szerokości, w idealnie równych odstępach; „tyk… tyk…” od fal długich po UKF. Równy rytm odróżnia go od burzy."},"gsm":{"nm":"Telefon GSM","sh":"217 Hz","t":"Telefon GSM obok głośnika","h":"Telefon 2G nadaje paczkami po 0,577 ms, 217 razy na sekundę. Źle ekranowany wzmacniacz audio wykrywa te paczki i czyni je słyszalnymi.","l":"Grzebień prążków co 217 Hz; słynne „ta-ta-tatata” tuż przed dzwonkiem telefonu, potem ciągłe brzęczenie w czasie rozmowy. Coraz rzadsze: sieci 2G są wyłączane."},"jjy":{"nm":"JJY","sh":"40 / 60 kHz","t":"Sygnał czasu JJY (Japonia, 40 i 60 kHz)","h":"W każdej sekundzie nośna ma pełną moc przez 0,8 s (bit 0), 0,5 s (bit 1) lub 0,2 s (znacznik), potem spada do 10 %. Odwrotnie niż DCF77, który obniża się na początku sekundy.","l":"Stała kreska, która słabnie pod koniec każdej sekundy, wcześniej lub później. Nadajniki w Fukushimie (40 kHz) i Saga-Fukuoka (60 kHz), dla zegarów sterowanych radiowo w Japonii."},"rwm":{"nm":"RWM","sh":"4996 kHz","t":"Sygnał czasu RWM (Moskwa)","h":"Telegrafią na 4996, 9996 i 14 996 kHz: co sekundę impuls 100 ms, a w innych minutach dziesięć impulsów na sekundę. Znak RWM jest nadawany Morse'em dwa razy na godzinę.","l":"Znak, potem kreska pocięta na regularne „tyknięcia”, a dalej na szybkie kropki. Słuchaj w CW lub SSB.","n":"skrócony fragment"},"bpm":{"nm":"BPM","sh":"2,5–15 MHz","t":"Sygnał czasu BPM (Chiny)","h":"Stacja Pucheng (Shaanxi) nadaje w AM na 2,5, 5, 10 i 15 MHz: co sekundę tyknięcie 10 ms na 1000 Hz (300 ms o pełnej minucie), a w niektórych minutach tyknięcia 100 ms dla czasu UT1. Znak BPM podawany jest Morse'em, potem głosem.","l":"W zdemodulowanym dźwięku: znak, potem bardzo krótkie kreski na 1000 Hz, jedna na sekundę, z dłuższą o pełnej minucie. Często miesza się z WWV na tych samych częstotliwościach.","n":"skrócony fragment"},"humpback":{"nm":"Humbak","sh":"pieśń","t":"Pieśń humbaka","h":"Zimą, na obszarach rozrodu, samce śpiewają: ciąg jęków, pomruków i okrzyków tworzy temat, powtarzany bez zmian przez wiele godzin i zmieniający się z sezonu na sezon. Hydrofony słyszą go z odległości dziesiątek kilometrów.","l":"Grube ślady z harmonicznymi, powoli rosnące lub opadające między 100 Hz a kilkoma kHz; ten sam ciąg wraca po kilku sekundach. Echo od powierzchni i dna przedłuża każdą nutę."},"bluewhale":{"nm":"Płetwal błękitny","sh":"×10","t":"Płetwal błękitny: najniższy zew","h":"Największe zwierzę świata wydaje bardzo niskie (10–40 Hz) i bardzo silne zawołania, trwające 10–20 sekund i powtarzane godzinami: niosą się na setki kilometrów. Aby je usłyszeć, nagranie przyspiesza się dziesięciokrotnie.","l":"Część pulsująca, potem długa nuta, która ledwie opada, z harmonicznymi powyżej; sekwencja się powtarza. Skala pokazuje prawdziwe częstotliwości.","n":"przyspieszone 10×"},"finwhale":{"nm":"Płetwal zwyczajny","sh":"20 Hz","t":"Płetwal zwyczajny: impulsy 20 Hz","h":"Płetwal zwyczajny wydaje impulsy trwające około sekundy, opadające z ok. 25 do 18 Hz, w regularnych odstępach, czasem przez wiele dni. W latach 50. i 60. te „sygnały 20 Hz” intrygowały sieci nasłuchowe marynarki USA, zanim przypisano je temu wielorybowi.","l":"Krótkie kreski, wszystkie jednakowe, w regularnym ciągu lub parami, jak uderzenia bardzo wolnego serca; każda lekko opada w częstotliwości. Skala pokazuje prawdziwe częstotliwości.","n":"przyspieszone 10×"},"sperm":{"nm":"Kaszalot","sh":"kliki","t":"Kliki kaszalota","h":"Kaszalot poluje podczas głębokich nurkowań, używając sonaru: bardzo silne kliki, mniej więcej jeden na sekundę, które przyspieszają w „skrzypienie”, gdy zbliża się do ofiary. Między sobą kaszaloty wymieniają „cody”, krótkie serie klików, których rytm różni się między klanami.","l":"Poziome kreski na całej szerokości, w równych odstępach, potem zagęszczone w brzęczenie (skrzypienie), a na końcu mały rytmiczny motyw: coda. Każdy klik składa się z kilku bliskich impulsów, powstałych przez odbicia w głowie zwierzęcia."},"dolphin":{"nm":"Butlonos","sh":"gwizdy","t":"Gwizdy i kliki delfina","h":"Butlonos gwiżdże w zakresie ok. 5–20 kHz; każdy osobnik ma „gwizd sygnaturowy”, który służy mu za imię. Do polowania i orientacji wysyła też serie bardzo krótkich klików, nawet kilkaset na sekundę.","l":"Cienkie krzywe, które rosną i znów opadają, często powtarzane bez zmian, oraz serie poziomych kresek przy echolokacji. Częstotliwości podzielono przez 3, by były słyszalne; skala pokazuje prawdziwe wartości.","n":"odtwarzane 3× niżej"},"orca":{"nm":"Orka","sh":"zawołania pulsowe","t":"Pulsowe zawołania orki","h":"Orki porozumiewają się zawołaniami pulsowymi: ciągami impulsów tak szybkimi (500–2000 na sekundę), że słychać je jako nutę, z nagłym skokiem wysokości. Każda grupa rodzinna ma własny „dialekt”.","l":"Stos równoległych śladów (harmonicznych), które rosną lub opadają razem, z wyraźnym załamaniem w środku zawołania; czasem cienki, wyższy gwizd."},"bseal":{"nm":"Foka brodata","sh":"tryl","t":"Tryl foki brodatej","h":"Wiosną, pod arktycznym lodem, samiec wydaje długie tryle, które spiralnie opadają od kilku kHz do kilkuset herców, czasem przez całą minutę. Służą do obrony terytorium i wabienia samic.","l":"Falista krzywa, która zsuwa się z góry na dół skali jak rozprężająca się sprężyna, a na końcu niska nuta.","n":"skrócone"},"shrimp":{"nm":"Krewetki pistolety","sh":"rafa","t":"Krewetki pistolety (krewetkowate Alpheidae)","h":"Zamykając gwałtownie wielkie szczypce, krewetka wystrzeliwuje strumień wody tak szybki, że powstaje pęcherzyk kawitacyjny; zapadając się, trzaska jak wystrzał. Tysiące krewetek tworzą tło dźwiękowe raf i mogą zakłócać sonary.","l":"Deszcz punktów i krótkich poziomych kresek na całej szerokości, bez żadnego porządku; w słuchawkach nieustanne trzeszczenie jak przy smażeniu."},"sonar":{"nm":"Sonar aktywny","sh":"ping","t":"Ping sonaru aktywnego","h":"Okręt wysyła silny impuls dźwiękowy (tu ok. 3,5 kHz, zakres sonarów kadłubowych fregat) i nasłuchuje echa: opóźnienie daje odległość, a przesunięcie częstotliwości (efekt Dopplera) prędkość celu. Dźwięk wraca też jako ogon od dna i powierzchni: pogłos.","l":"Krótka, silna kreska, ogon, który wygasa, a potem echo, znacznie słabsze i nieco przesunięte w częstotliwości. Drugi ping to przemiatanie częstotliwości (chirp), które lepiej mierzy odległość."},"propeller":{"nm":"Śruba okrętowa","sh":"kawitacja","t":"Śruba przepływającego statku","h":"Łopaty śruby tworzą pęcherzyki kawitacyjne, które pękają: szeroki szum, pulsujący w rytmie przechodzących łopat. Maszyny dodają stałe prążki. Operatorzy sonaru analizują ten rytm (analiza DEMON), by policzyć łopaty i obroty, i rozpoznać statek.","l":"Szum w szerokim paśmie, prążkowany poziomymi pasami w rytmie łopat, z kilkoma stałymi pionowymi kreskami (silnik, przekładnia). Wszystko narasta, a potem cichnie, gdy statek przepływa nad hydrofonem."},"uqc":{"nm":"Telefon podwodny","sh":"UQC 8 kHz","t":"Telefon podwodny (UQC, „Gertrude”)","h":"Okręty podwodne i nawodne rozmawiają pod wodą przez telefon akustyczny: głos jest przesyłany jedną wstęgą boczną nad nośną 8,0875 kHz, emitowaną przez przetwornik w kadłubie. Zasięg: kilka kilometrów.","l":"Pasmo głosu SSB powyżej 8 kHz; po demodulacji odległy głos, który faluje i dudni przez echa od powierzchni i dna. Obraz jest pomniejszony o połowę; skala pokazuje prawdziwe częstotliwości.","n":"skala podzielona przez 2"},"zevs":{"nm":"ZEVS 82 Hz","sh":"ELF","t":"ZEVS: radio okrętów podwodnych na 82 Hz","h":"Fale radiowe bardzo słabo wnikają w wodę morską, z wyjątkiem częstotliwości skrajnie niskich (ELF). Rosyjski nadajnik ZEVS na Półwyspie Kolskim nadaje na 82 Hz liniami antenowymi o długości dziesiątek kilometrów, by dotrzeć do głęboko zanurzonych okrętów. Szybkość jest znikoma: kilka znaków na minutę.","l":"Cienka kreska na 82 Hz obok prążka sieci 50 Hz i jego harmonicznych, z zakłóceniami od burz. W słuchawkach ledwie słyszalny niski pomruk; odbiera się go dużą anteną ramową i kartą dźwiękową. Amerykański odpowiednik na 76 Hz wyłączono w 2004 roku."},"bloop":{"nm":"„Bloop”","sh":"1997","t":"„Bloop” (1997)","h":"W 1997 roku hydrofony NOAA na Pacyfiku zarejestrowały bardzo niski, szybko rosnący dźwięk, słyszalny na tysiące kilometrów. Długo zagadkowy, od 2012 roku przypisywany jest trzęsieniu lodu: pękającej ogromnej górze lodowej.","l":"Szerokie pasmo, które rośnie w kilka sekund, z harmonicznymi, a potem powoli wygasa. Rekonstrukcja, przyspieszona 16× jak nagranie udostępnione przez NOAA.","n":"przyspieszone 16×"}}},"ru":{"ui":{"title":"VSISA","mystery":"Загадочный звук","play":"▶ Слушать","stop":"■ Стоп","noise":"Шум","volume":"Громкость","loop":"По кругу","specwf":"Спектр + водопад","cursor":"курсор","footprint":"Отпечаток","dur":"{s} с сверху вниз","avg":"среднее по всему сигналу","press":"Нажми «Слушать»: сигнал побежит здесь","count":"{n} сигналов, в порядке листа 6","myst":"Загадка","mystTags":"Слушай и смотри, затем выбери правильный ответ","quizH":"Что это за сигнал?","quizLead":"Включи звук, посмотри на спектр, водопад и отпечаток, затем ответь.","score":"Счёт","good":"Верно!","bad":"Мимо: это был {x}.","next":"Следующий загадочный звук","principle":"Принцип","screen":"На экране","sheet":"лист","book":"Книга: лист {r}","lang":"Язык","signals":"Сигналы","f1":"Сигналы смоделированы прямо на странице (12 000 отсчётов в секунду): сигналы листа 6 книги OpenBookRadio, другие сигналы из книги и бонусы. Для радиосигналов (AM, FM, AIS, LoRa…) показана смоделированная промежуточная частота, как на экране SDR; некоторые уменьшены или ускорены, это указано. Для AM, SSB, FM, FM-стерео, МКС и замираний слышен демодулированный звук, как из динамика приёмника, а экран показывает радиосигнал; голос синтезированный и не произносит настоящих слов.","f2":"Время в водопаде и отпечатке идёт вниз. Лицензия CC BY-NC-SA 4.0, бесплатно, не для продажи.","night":"Ночной режим","day":"Дневной режим","visits":"посещения","plays":"прослушивания","book_dl":"Скачать книгу","book_dl2":"Скачать книгу OpenBookRadio (бесплатно, PDF и EPUB, 13 языков)","display":"Оформление","theme_day":"День","theme_night":"Ночь (красный)","theme_phos":"Зелёный люминофор","theme_phosb":"Синий люминофор","theme_phosa":"Янтарный люминофор","w3d":"3D-водопад","w3dHint":"потяните, чтобы повернуть"},"groups":["Аналоговый голос","Телеграф","Данные","Изображения","Авиация, флот и спасение","Вызов, субтоны и пейджинг","Радиозонды, датчики и устройства","Режимы КВ и диковинки","Вещание и время","Широкая полоса","Бонус: звуки космоса","Бонус: диковинки коротких волн","Бонус: подводные звуки"],"modes":{"am":{"sh":"вещание","t":"AM: амплитудная модуляция","h":"Сила несущей следует за звуком: кривая «раздувается» и «сдувается».","l":"Неподвижная линия в центре (несущая) и по бокам две одинаковые боковые полосы. Ширина около 6–9 кГц. Вещание на КВ и СВ, авиация (листы 12 и 14).","r":[["Прослушивание","Заставка, затем ведущий на фоне музыки. Две боковые полосы зеркальны: по обе стороны несущей видна мелодия, а затем голос."]]},"ssb":{"nm":"ОБП / SSB","t":"SSB: одна боковая полоса","h":"Остаётся одна боковая полоса без несущей: когда молчат, ничего нет.","l":"Нет центральной линии, одна полоса около 2,7 кГц, живая только во время речи. USB выше 10 МГц, LSB ниже (радиолюбители). При плохой настройке голос звучит как «утка» (листы 11 и 29)."},"fm":{"sh":"голос","t":"FM: частотная модуляция","h":"Амплитуда постоянна; колебания сгущаются или разрежаются вместе со звуком.","l":"Сигнал пляшет вокруг своей частоты и шире при громком звуке: 12,5 кГц на канал в узкополосной FM (рации, ретрансляторы), 200 кГц в FM-вещании (листы 2 и 13).","r":[["Прослушивание","В конце короткое «кшш»: шумоподавитель закрывается, когда передатчик выключается."]]},"cw":{"t":"CW: азбука Морзе","h":"Несущая включается и выключается: тире и точки.","l":"Очень тонкая линия, прерываемая в ритме Морзе; писк в ухе. Здесь «CQ» (лист 48).","r":[["Скорость","20 слов/мин, точка 60 мс, на 700 Гц: «CQ CQ CQ DE F4ABC K»"],["На слух","Чистые писки, длинные и короткие, на одной ноте"],["Декодирование","На слух, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: две частоты","h":"Частота прыгает между двумя значениями: одно для 0, другое для 1.","l":"Две параллельные линии: 170 Гц у радиолюбителей (45,45 Бод), 450 или 850 Гц у метеосводок. Ровное «тидилиди» (лист 32).","r":[["Код","Бодо ITA2: 5 бит + старт + 1,5 стоп; mark 2125 Гц, space 2295 Гц"],["Текст","RYRYRYRY CQ CQ DE F4ABC"],["Декодирование","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 Бод: APRS и пакет","h":"Два звуковых тона, 1200 и 2200 Гц, подаются в FM-передатчик.","l":"После FM-приёмника (звук динамика): полоса от 1200 до 2200 Гц короткими пачками. На слух секундное «грррт» (листы 35 и 36).","r":[["Частота","144,800 МГц в Европе (APRS), FM"],["Кадр","Флаги 0x7E, затем данные AX.25 в NRZI"],["Декодирование","Direwolf, multimon-ng, KISS TNC"]]},"psk31":{"t":"PSK31: фазовая модуляция","h":"Частота не меняется, меняется фаза; при каждой смене амплитуда проседает.","l":"Очень тонкая линия около 60 Гц, слегка «плетёная». В 3 кГц помещаются десятки станций (лист 29).","r":[["Код","Varicode: 0 = смена фазы, 1 = без изменений; в покое две линии-близнеца"],["Где слушать","14 070 кГц, 3580 кГц"],["Декодирование","fldigi"]]},"ft8":{"t":"MFSK / FT8: восемь тонов","h":"Частота ходит вверх-вниз ступеньками по 6,25 Гц, 0,16 с на ступеньку.","l":"Полосы около 50 Гц длительностью 12,6 с, повторяются каждые 15 с по часам: несколько станций сразу в 3 кГц, например на 7,074 МГц (лист 29).","r":[["Кадр","79 символов по 0,16 с, три шаблона Костаса (начало, середина, конец); здесь восемь станций"],["Частоты","14 074, 7074, 3573, 10 136, 21 074, 28 074 кГц"],["Декодирование","WSJT-X, JTDX (точное время ПК)"]]},"ft4":{"t":"FT4: FT8 для соревнований","h":"Четыре тона через 20,8 Гц, 20,8 Бод: 105 символов за 5 с, в окнах по 7,5 с.","l":"Полосы около 90 Гц, короче и шире, чем у FT8, повторяются каждые 7,5 с. 14 080, 7047,5 кГц (лист 29)."},"olivia":{"t":"Olivia 8/250: восемь тонов","h":"Восемь тонов через 31,25 Гц, по одному за раз, прыгают случайно; кодирование Уолша и перемежение.","l":"Россыпь точек на 250 Гц; декодируется глубоко под шумом. На слух маленькая случайная мелодия (лист 29)."},"hell":{"t":"Feld Hell: письмо несущей","h":"Несущая включается и выключается по точкам: каждая буква — столбцы по 14 точек, развёрнутые снизу вверх (245 точек в секунду).","l":"В водопаде рваная линия; буквы рисует экран программы (fldigi). На слух мягкое потрескивание (лист 29)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Четыре уровня частоты: каждый символ несёт два бита.","l":"Прямоугольный блок шириной 6–12,5 кГц, заполненный как шум, часто пачками (DMR делит канал на два тайм-слота). На слух хриплое «фррр» (лист 46)."},"mt63":{"t":"MT63: аварийные сообщения (NBEMS)","h":"64 тона одновременно, каждый модулирован медленно, с большой избыточностью.","l":"Плоский блок 1 или 2 кГц вокруг 1500 Гц с чёткими краями; ровное шипение. Проходит даже через микрофон у динамика (лист 31)."},"lora":{"t":"LoRa: частотные пилы (чирпы)","h":"Частота пробегает всю ширину и начинает снова снизу: положение скачка несёт данные.","l":"Параллельные диагонали, их легко узнать: Meshtastic и MeshCore на 869,525 МГц или 433 МГц, датчики LoRaWAN (листы 13, 23 и 24)."},"sstv":{"t":"SSTV: изображения в звуке","h":"Синхроимпульс на 1200 Гц, затем частота следует яркости строки: от 1500 (чёрный) до 2300 Гц (белый).","l":"Регулярные линии синхронизации и облако, меняющееся с картинкой; «щебечущий» звук одну-две минуты. 14,230 МГц, МКС на 145,800 МГц (лист 37).","r":[["Кадр","Заголовок VIS, затем строки: синхро 1200 Гц, зелёный, синий, красный; здесь 20 строк испытательной таблицы"],["Декодирование","QSSTV, MMSSTV, Robot36 на смартфоне"]]},"fax":{"nm":"Метеофакс","t":"Метеофакс: 1500 Гц чёрный, 2300 Гц белый","h":"Частота плавно идёт от чёрного к белому, 120 строк в минуту.","l":"Две неподвижные полосы на 1500 и 2300 Гц (800 Гц разнос), ровное «тик-так». Публикуются частоты несущей: слушай в USB на 1,9 кГц ниже (лист 38).","r":[["Кадр","Стартовый тон 300 Гц, строки фазирования (белый импульс), затем карта"],["Декодирование","fldigi, JWX, HamFax"]]},"elt":{"nm":"Сирена ELT","t":"Сирена ELT / PLB на 121,5 МГц","h":"AM, тон которой падает с 1600 до 300 Гц два-четыре раза в секунду.","l":"Неподвижная несущая и боковые полосы, скользящие веером: «уу-уу» аварийных маяков, также на 121,375 МГц для учений (листы 27 и 28)."},"406":{"nm":"Маяк 406","t":"Маяк 406 МГц: пачка BPSK","h":"Полсекунды передачи: 160 мс чистой несущей, затем фаза качается на ±1,1 радиана со скоростью 400 бит/с.","l":"Короткая чёрточка каждые 50 с, между 406,0 и 406,1 МГц; слушать нечего, нужен декодер (EPIRB 406, лист 28)."},"adsb":{"t":"ADS-B / режим S (1090 МГц): импульсы","h":"Импульсы 0,5 мкс, положение которых несёт биты (PPM); здесь шкала времени сильно замедлена.","l":"Очень короткие горизонтальные чёрточки по всей ширине, сотни в секунду возле аэропорта; нужен SDR-донгл (лист 15).","n":"шкала времени сильно замедлена"},"acars":{"t":"ACARS: AM и данные MSK","h":"AM, несущая два тона, 1200 и 2400 Гц, со скоростью 2400 бит/с.","l":"Пачки по полсекунды с несущей и боковыми полосами, на 131,525, 131,725 или 131,825 МГц в Европе: на слух «бррт» (лист 16)."},"ais":{"t":"AIS: GMSK 9600 Бод на двух каналах","h":"Сглаженная FSK (GMSK) пачками по 26 мс, то на 161,975 МГц, то на 162,025 МГц (в уменьшенном масштабе).","l":"Два столбца коротких чёрточек в 50 кГц друг от друга, ровное щёлканье; чем больше судов, тем гуще (лист 19).","n":"уменьшенный масштаб"},"navtex":{"t":"NAVTEX и ЦИВ на СВ и КВ: FSK 170 Гц","h":"Как RTTY: две частоты с разносом 170 Гц, но 100 Бод.","l":"Две параллельные линии без перерыва во время сводки, на 518 и 490 кГц (NAVTEX) или 2187,5 кГц (цифровой избирательный вызов) (лист 20).","r":[["Код","SITOR-B, CCIR 476: 7 бит с четырьмя «1», с повтором FEC"],["Декодирование","fldigi, YaND"]]},"hfdl":{"t":"HFDL: самолёты на КВ","h":"PSK 1800 Бод на поднесущей 1440 Гц.","l":"Пачки около 2,4 кГц между 2,9 и 22 МГц; шипение модема, которое то появляется, то пропадает (лист 17)."},"ctcss":{"t":"CTCSS: субтон под голосом","h":"Низкий непрерывный тон (67–254 Гц, здесь 88,5 Гц), добавленный к голосу.","l":"В звуке FM-приёмника: неподвижная линия в самом низу, под голосом; открывает шумоподавитель ретрансляторов и раций (лист 10)."},"dtmf":{"sh":"2 тона","t":"DTMF: два тона на клавишу","h":"Каждая клавиша одновременно посылает низкий тон (697–941 Гц) и высокий (1209–1633 Гц).","l":"Пары точек на восьми неподвижных столбцах; «пи-пи» телефонных номеров и команд ретрансляторов (лист 10).","r":[["Последовательность","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 тонов","t":"Selcall CCIR: тоны по очереди","h":"Пять тонов по 100 мс подряд, по одному на цифру.","l":"Маленькая лесенка из точек, повторяется; быстрое «тулулулу», чтобы вызвать одну конкретную рацию (лист 33).","r":[["Последовательность","1 2 3 4 5, дважды; декодируется и приложением SelCall для UV-K1"]]},"pocsag":{"sh":"пейджеры","t":"POCSAG и FLEX: пейджеры","h":"FSK ±4,5 кГц; преамбула 1010…, затем данные (уменьшенный масштаб).","l":"Две чёткие линии во время преамбулы, затем сплошная полоса; пронзительное «брррт». 466,075 МГц, DAPNET 439,9875 МГц (лист 45).","n":"уменьшенный масштаб"},"ale":{"sh":"8 тонов","t":"ALE: автоматическое установление связи на КВ","h":"Восемь тонов от 750 до 2500 Гц, 125 Бод, пачками.","l":"Блок около 2 кГц из мелких точек, одна-две секунды, иногда на нескольких соседних частотах; высокое щебетание (лист 34)."},"rs41":{"nm":"Радиозонд RS41","t":"Радиозонд RS41: непрерывная GFSK","h":"Сглаженная FSK 4800 Бод без остановки; частота медленно уходит, когда зонд поднимается и остывает.","l":"Полоса около 10 кГц, ползущая наискосок весь полёт, между 400 и 406 МГц (лист 21)."},"ook":{"nm":"Датчики 433","t":"Датчики 433 МГц: OOK","h":"Несущая включается и выключается короткими или длинными импульсами (всё или ничего); сообщение повторяется трижды.","l":"Пачки мелких точек, часто по три, на 433,92 МГц: метеостанции, датчики температуры, пульты (лист 22)."},"fhss":{"t":"Bluetooth: прыжки частоты (FHSS)","h":"Частота меняется 1600 раз в секунду среди 79 каналов (уменьшенный масштаб).","l":"Мелкие чёрточки разбросаны по всем 80 МГц, никогда в одном месте, около 2,4 ГГц (лист 25).","n":"уменьшенный масштаб"},"wspr":{"t":"WSPR: маяки прохождения","h":"Четыре тона через 1,46 Гц, 0,68 с на символ, в течение 110,6 с.","l":"Очень тонкая линия около 6 Гц длиной почти две минуты, каждые чётные две минуты: нужно сильно увеличить (лист 29).","n":"фрагмент 24 с (передача длится 110,6 с)"},"qrss":{"t":"QRSS: очень медленная морзянка","h":"Несущая включается и выключается, точки по 3–10 с, часто на двух соседних частотах (DFCW).","l":"Линии шириной в несколько Гц, читаются на десятиминутном экране; на слух не воспринимается (лист 30).","n":"ускорено: точка 0,6 с вместо 3–10 с"},"texte":{"nm":"Текст в водопаде","t":"Текст в водопаде","h":"Каждая строка картинки становится группой тонов: звук похож на шум.","l":"Текст или рисунок появляется прямо на экране SDR (лист 40).","r":[["Примечание","Передаётся с низа картинки: прямо в живом водопаде, вверх ногами в отпечатке (читается сверху вниз)"]]},"vara":{"t":"Современные данные КВ: VARA, Pactor, ARDOP","h":"Длинные сплошные пачки (OFDM или PSK), а между ними короткие ответы другой станции.","l":"Прямоугольник около 2,4 кГц, который останавливается и снова начинается, с маленьким подтверждением посередине; рваное шипение (лист 29)."},"chirp":{"nm":"Ионозонд","t":"Ионозонд (ЛЧМ-зондирование)","h":"Медленная частотная пила через весь КВ-диапазон; эхо от ионосферы приходит чуть позже.","l":"Диагональ через экран вместе с параллельными линиями (эхо); «ффьють», пролетающий за долю секунды."},"oth":{"nm":"Загоризонтный радар","t":"Загоризонтный радар («дятел»)","h":"Импульсы повторяются 10–50 раз в секунду, каждый шириной несколько кГц.","l":"Широкий полосатый блок, перекрывающий целые диапазоны; очень ровный стук дятла на КВ."},"parasites":{"nm":"Помехи","sh":"блок питания","t":"Помехи от импульсного блока питания","h":"Прямоугольный сигнал: его частота и все гармоники выходят одновременно.","l":"Гребёнка ровных линий, дрейфующих вместе, на фоне шума: ищи с NOISE FIND или переносным приёмником (лист K22)."},"mpx":{"nm":"FM-стерео и RDS","t":"FM-стерео и RDS","h":"Демодулированный звук (мультиплекс) содержит канал L+R, пилот 19 кГц, канал L-R около 38 кГц и RDS на 57 кГц.","l":"От 0 до 60 кГц после демодуляции: низкий блок, тонкая линия на 19 кГц, более слабый блок в середине и RDS на самом верху (лист 12).","n":"масштаб ÷ 20; стереозвук","r":[["Прослушивание","В наушниках: 4 с моно (средний блок L-R исчезает), затем 4 с стерео: мелодия слева, аккорды справа."]]},"dcf77":{"t":"Сигнал времени DCF77 (77,5 кГц)","h":"Несущая падает до 15 % на 0,1 с (бит 0) или 0,2 с (бит 1) в начале каждой секунды.","l":"Неподвижная линия с чёрным провалом каждую секунду; на 59-й секунде провала нет, это отметка минуты (лист 12).","r":[["Примечание","Здесь несущая перенесена на 1000 Гц; на 6-й секунде провала нет, как на 59-й секунде каждой минуты"]]},"ofdm":{"t":"OFDM: десятки поднесущих","h":"Много плотно уложенных несущих, каждая медленная: сумма похожа на шум.","l":"Плоский прямоугольник с чёткими краями, всегда на месте: DRM на КВ (10 кГц), DAB+ (1,5 МГц), DVB-T, Wi-Fi. На слух ровное шипение (листы 12 и 25)."},"dsss":{"t":"Расширенный спектр (DSSS): GPS, Wi-Fi 802.11b","h":"Данные смешиваются с очень быстрым кодом: энергия размазывается по широкой полосе.","l":"Широкий горб чуть выше шума; GPS даже ниже шума и без обработки не виден (листы 25 и 26)."},"hline":{"nm":"Линия водорода","sh":"1420 МГц","t":"Линия водорода 21 см (1420,405 МГц)","h":"Холодный водород Млечного Пути излучает очень слабый шум на 1420,405 МГц. Движение спиральных рукавов смещает его эффектом Доплера: видно несколько маленьких горбов.","l":"В водопаде от секунды к секунде почти ничего: нужно долго усреднять, чтобы горбы вышли из шума. Здесь посмотри на средний спектр в остановке. Достаточно тарелки или рупора, малошумящего усилителя и SDR-донгла.","n":"сигнал сильно преувеличен"},"sun":{"nm":"Солнце","sh":"всплески","t":"Солнце: радиовсплески III типа","h":"Электроны, выброшенные вспышкой, проходят через солнечную корону и заставляют её излучать всё ниже по частоте по мере удаления.","l":"Линии, падающие наискосок сверху вниз по спектру меньше чем за секунду, на фоне солнечного шума; нарастающее «шшшш». Примерно от 10 до 400 МГц, также на КВ около 20 МГц."},"jupiter":{"nm":"Юпитер","sh":"20 МГц","t":"Юпитер: декаметровые всплески (L и S)","h":"Магнитное поле Юпитера и его спутник Ио дают мощное излучение между 15 и 40 МГц: медленные L-всплески и очень короткие S-всплески, быстро скользящие вниз.","l":"Сначала волны шума (L, как прибой), затем серии маленьких «хлопков» (S) плотными диагоналями. Около 20,1 МГц ночью, на простой диполь, когда Ио в удачном положении."},"pulsar":{"nm":"Пульсар","sh":"B0329+54","t":"Пульсар PSR B0329+54","h":"Вращающаяся нейтронная звезда проводит по Земле радиолучом, здесь каждые 0,714 с. Межзвёздный газ задерживает низкие частоты: каждый импульс приходит сначала в верх спектра.","l":"Ровное «тик»; в водопаде каждый импульс — нисходящая кривая (дисперсия). Настоящий сигнал под шумом: нужна большая антенна и сложение импульсов по их периоду.","n":"сигнал сильно преувеличен"},"meteor":{"nm":"Метеоры","sh":"GRAVES","t":"Метеорные отражения радара GRAVES (143,050 МГц)","h":"Французский радар GRAVES непрерывно излучает на 143,050 МГц. Когда падающая звезда ионизирует воздух, её след отражает немного сигнала к твоему приёмнику — на долю секунды или несколько секунд.","l":"В USB на 143,049 МГц: короткие «пинги» около 1000 Гц, иногда скользящее эхо (голова метеора, эффект Доплера) или долгое. Гораздо больше во время потоков (Персеиды, Геминиды) (лист 1)."},"whistler":{"nm":"Свисты","sh":"ОНЧ","t":"ОНЧ-свисты (вистлеры)","h":"Молния даёт радиощелчок; часть его уходит вдоль силовых линий магнитного поля Земли в другое полушарие и обратно, высокие тона первыми.","l":"«Фьююю», спускающееся от высоких к низким за одну-две секунды сразу после щелчка; повсюду треск (сферики). Ниже 10 кГц, на ОНЧ-приёмник вдали от линий электропередачи."},"chorus":{"nm":"Утренний хор","sh":"ОНЧ","t":"Утренний хор (dawn chorus)","h":"Во время магнитной бури электроны, захваченные магнитосферой, издают маленькие восходящие ноты, особенно на рассвете.","l":"Перекрывающееся восходящее щебетание, как птицы, примерно от 1 до 4 кГц. То же оборудование, что для свистов."},"sputnik":{"nm":"Спутник-1","sh":"1957","t":"Спутник-1 (1957)","h":"Первый искусственный спутник три недели передавал сигналы около 0,3 с поочерёдно на 20,005 и 40,002 МГц.","l":"Регулярно прерываемая линия: «бип… бип…» — звук, который в октябре 1957 года слушал весь мир (реконструкция)."},"doppler":{"nm":"Эффект Доплера","sh":"спутник","t":"Маяк спутника и эффект Доплера","h":"Спутник на низкой орбите приближается, затем удаляется: принимаемая частота во время пролёта падает примерно на ±3 кГц на 145 МГц и ±10 кГц на 435 МГц.","l":"Линия, спадающая S-образно: сначала медленно, быстро в точке наибольшего сближения, затем снова медленно (лист 41).","n":"пролёт 10 мин сжат до 12 с"},"apt":{"nm":"NOAA APT","sh":"137 МГц","t":"Спутники NOAA: изображения APT (история)","h":"Поднесущая 2400 Гц, амплитудно модулированная изображением, две строки в секунду, с синхроимпульсом в начале каждой строки. Отключено в 2025 году; сейчас спутники «Метеор-М» передают LRPT.","l":"Линия на 2400 Гц с боковыми полосами, меняющимися вместе с изображением, и знаменитое «тик-так» дважды в секунду (лист 41)."},"eme":{"nm":"Эхо от Луны","sh":"EME","t":"Эхо от Луны (EME)","h":"Сигнал, посланный к Луне, возвращается примерно через 2,5 с, чрезвычайно ослабленный, немного размытый и сдвинутый Доплером.","l":"Слышишь своё «бип», а через 2,5 с его слабое, чуть размытое эхо. Радиолюбители делают это в CW или JT65, от 144 МГц и выше (лист 1).","n":"эхо сильно преувеличено"},"msk144":{"nm":"MSK144","sh":"метеоры","t":"MSK144: цифровой вид связи через метеоры","h":"Два тона, 1000 и 2000 Гц, 2000 Бод, кадры по 72 мс повторяются без перерыва: каждый метеорный след пропускает несколько из них.","l":"Пачки от 0,1 до 1 с шириной около 2,4 кГц, появляющиеся и гаснущие вместе с «пингом» метеора. На 50 и 144 МГц, с WSJT-X."},"jt65":{"nm":"JT65","sh":"65 тонов","t":"JT65: 65 тонов, очень медленно","h":"Один синхротон и 64 тона данных через 2,7 Гц (JT65A), 0,37 с на символ, 47 с передачи в минуту.","l":"Лесенка мелких чёрточек на 180 Гц с линией синхронизации, которая постоянно возвращается на одно место. Используется для связи через Луну (JT65B и C) и очень слабых сигналов.","n":"фрагмент 20 с (передача длится 47 с)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: профессиональная цифровая сеть","h":"Фазовая модуляция π/4-DQPSK, 18 000 символов в секунду, четыре тайм-слота, каналы по 25 кГц.","l":"Сплошной блок со скруглёнными краями, постоянно присутствует рядом с базовой станцией; хриплое шипение. Зашифровано: прослушать нельзя (лист 46).","n":"уменьшенный масштаб"},"ndb":{"nm":"Маяк NDB (ПРС)","sh":"190–535 кГц","t":"NDB: ненаправленный радиомаяк","h":"Неподвижная несущая на длинных волнах с позывным Морзе из двух-трёх букв, передаваемым тоном (часто 1020 Гц).","l":"Неподвижная линия в центре и во время позывного две чёрточки по бокам. Примерно 190–535 кГц, в SSB или CW (лист 12)."},"vor":{"nm":"VOR","sh":"108–118 МГц","t":"VOR: всенаправленный радиомаяк","h":"В AM: сигнал 30 Гц, зависящий от направления, поднесущая 9960 Гц с частотной модуляцией 30 Гц (опорный сигнал) и позывной Морзе на 1020 Гц.","l":"В демодулированном звуке: низкий гул 30 Гц, широкая волнистая линия около 10 кГц и время от времени позывной (лист 18).","n":"демодулированный звук, масштаб ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Гц","t":"ILS: курсовой маяк системы посадки","h":"В AM два тона, 90 и 150 Гц; их соотношение говорит самолёту, левее он оси или правее. Позывной Морзе начинается с I.","l":"В демодулированном звуке: две очень низкие линии на 90 и 150 Гц и позывной на 1020 Гц. Между 108,1 и 112 МГц; глиссадный маяк около 330 МГц (лист 18)."},"m10":{"nm":"Зонды M10 / M20","sh":"Meteomodem","t":"Радиозонды M10 и M20 (Meteomodem)","h":"Один кадр в секунду, быстрая FSK (около 9600 Бод): шире, чем у RS41. Во Франции их запускает Météo-France.","l":"Каждую секунду широкая пачка, медленно дрейфующая во время полёта; между 400 и 406 МГц (лист 21)."},"tpms":{"nm":"Шины (TPMS)","sh":"433 МГц","t":"Датчики давления в шинах (TPMS)","h":"Каждое колесо время от времени посылает FSK-пачку в несколько миллисекунд: давление, температура, идентификатор.","l":"Маленькие одиночные пачки на 433,92 МГц (или 315 МГц), часто парами, когда проезжает машина. Декодируются rtl_433."},"als162":{"nm":"ALS162","sh":"162 кГц","t":"Сигнал времени ALS162 (Аллуи, 162 кГц)","h":"Несущая бывшего длинноволнового вещания France Inter; время закодировано небольшими неслышимыми изменениями фазы.","l":"Неподвижная линия, очень сильная во Франции, чуть расширенная в начале каждой секунды; чтобы прочитать время, нужен декодер (лист 12)."},"wwv":{"nm":"WWV","sh":"2,5–20 МГц","t":"Сигнал времени WWV (Колорадо)","h":"В AM: каждую секунду «тик» 5 мс на 1000 Гц, тон 500 или 600 Гц, код времени на 100 Гц и голос, объявляющий время UTC.","l":"В демодулированном звуке: линия 500 Гц, прерываемая каждую секунду, тик на 1000 Гц и код в самом низу на 100 Гц (лист 12)."},"msf":{"nm":"MSF","sh":"60 кГц","t":"Сигнал времени MSF (Анторн, 60 кГц)","h":"Несущая выключается в начале каждой секунды на 0,1, 0,2 или 0,3 с в зависимости от битов и на 0,5 с для отметки минуты.","l":"Неподвижная линия с полностью чёрными провалами каждую секунду, длиннее, чем у DCF77 (лист 12)."},"type2":{"nm":"Солнце, II тип","sh":"ударная волна","t":"Солнце: радиовсплески II типа","h":"Ударная волна корональной эмиссии массы заставляет плазму медленно излучать всё ниже, часто в двух полосах (основной и удвоенной).","l":"Две параллельные полосы шума, плавно опускающиеся несколько минут. Сравни со всплесками III типа, гораздо более быстрыми.","n":"несколько минут сжаты до 6 с"},"tweeks":{"nm":"Твики","sh":"ОНЧ","t":"Твики: ночные ОНЧ-«пинги»","h":"Ночью щелчок далёкой молнии отражается между землёй и ионосферой; частоты у критической (около 1,7 кГц) приходят последними.","l":"Короткий «пинг», спускающийся и обрывающийся около 1,7 кГц, иногда с эхом на удвоенной частоте; повсюду треск. Ниже 10 кГц, ночью."},"hiss":{"nm":"ОНЧ-шипение","sh":"hiss","t":"ОНЧ-шипение (hiss)","h":"Широкополосный шум электронов плазмосферы, усиливающийся и ослабевающий с магнитной активностью.","l":"Полоса шипения от нескольких сотен Гц до нескольких кГц, без рисунка, медленно нарастающая и спадающая."},"aurora":{"nm":"Радиоаврора","sh":"Au","t":"Авроральное прохождение (Au)","h":"Полярное сияние отражает УКВ, но очень быстро их трясёт: каждый сигнал размазывается на несколько сотен Гц.","l":"CW превращается в шершавое шипение, будто шёпот; тона больше не слышно. На 50 и 144 МГц, антенна на север во время магнитных бурь."},"galactic":{"nm":"Галактический шум","sh":"20–40 МГц","t":"Шум Млечного Пути","h":"Центр Галактики излучает радиошум, который Карл Янский открыл в 1932 году около 20 МГц. Он растёт и падает с вращением Земли.","l":"Фоновый шум, медленно растущий и снова спадающий, каждый день примерно на 4 минуты раньше. Виден на простой диполь между 20 и 40 МГц.","n":"сутки сжаты до 12 с"},"cubesat":{"nm":"CubeSat","sh":"9600 Бод","t":"Телеметрия кубсата","h":"Малые спутники регулярно передают свои измерения (батарея, температуры) в FSK или GMSK со скоростью 1200 или 9600 Бод около 435–438 МГц.","l":"Регулярные пачки, каждый раз чуть ниже из-за эффекта Доплера во время пролёта (лист 41).","n":"уменьшенный масштаб, пролёт ускорен"},"issfm":{"nm":"МКС в FM","sh":"145,800 МГц","t":"Космическая станция (МКС): голос в FM","h":"Космонавты говорят со школами и радиолюбителями в FM на 145,800 МГц. Станция летит со скоростью 28 000 км/ч: за пролёт принимаемая частота сползает примерно с +3,5 кГц до −3,5 кГц.","l":"Полоса FM-голоса, медленно смещающаяся справа налево за 10 минут пролёта (лист 41).","n":"пролёт 10 мин сжат до 10 с"},"buzzer":{"nm":"УВБ-76 «Жужжалка»","sh":"4625 кГц","t":"УВБ-76, «Жужжалка» (The Buzzer, 4625 кГц)","h":"Российская военная станция, которая десятилетиями передаёт жужжание около секунды примерно 25 раз в минуту, иногда прерываемое голосовым сообщением.","l":"Неподвижная несущая и при каждом жужжании столбец плотных линий сверху вниз. Легко найти на 4625 кГц в USB."},"pip":{"nm":"«The Pip»","sh":"3756 / 5448 кГц","t":"«The Pip»: бесконечные писки","h":"Ещё один российский военный коротковолновый маяк, день и ночь повторяющий короткие писки, иногда прерываемые сообщениями.","l":"Неподвижная линия, прерываемая коротким писком около 50 раз в минуту; на слух ровное «пип… пип…» без конца.","n":"ритм приблизительный"},"squeaky":{"nm":"«Squeaky Wheel»","sh":"КВ","t":"«Squeaky Wheel»: скрипучее колесо","h":"Российский военный коротковолновый маяк, названный слушателями по повторяющемуся звуковому рисунку.","l":"Маленький рисунок из двух звуков, один из которых поднимается, повторяется по кругу: как скрипучее колесо.","n":"приблизительная имитация"},"codar":{"nm":"CODAR","sh":"морской радар","t":"CODAR: радары морских течений","h":"Береговые радары один-два раза в секунду пробегают полосу частот, чтобы измерять течения и волны.","l":"Регулярные параллельные диагонали и повторяющееся «свиш»; около 4,5–5,5 МГц, 13 МГц и 25 МГц, часто круглосуточно.","n":"уменьшенный масштаб"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Военный модем STANAG 4285","h":"Фазовая модуляция 8-PSK, 2400 Бод, на несущей 1800 Гц, с тестовой последовательностью каждые 107 мс для отслеживания канала.","l":"Сплошной блок около 3 кГц; на слух шипение с ровным жужжанием (лист 43)."},"link11":{"nm":"Link-11","sh":"16 тонов","t":"Link-11: морская линия передачи данных","h":"Шестнадцать тонов от 605 до 2915 Гц одновременно, каждый с фазовой модуляцией 75 раз в секунду.","l":"Гребёнка из четырнадцати ровных линий от 935 до 2365 Гц и две линии в стороне, на 605 и 2915 Гц; на слух музыкальный гул (лист 43)."},"numbers":{"nm":"Номерная станция","sh":"голос","t":"Номерная станция","h":"В определённое время короткая позывная мелодия, затем голос (часто синтезированный) читает группы по пять цифр, в AM или SSB.","l":"Мелодия отдельными нотами, затем ровные группы слогов, разделённые паузами (лист 43).","n":"имитация голоса, без настоящих цифр"},"rttydwd":{"nm":"Метео-RTTY DWD","sh":"50 Бод / 450 Гц","t":"Метеорологический RTTY службы DWD (Германия)","h":"Как любительский RTTY, но 50 Бод с разносом 450 Гц: немецкая метеослужба передаёт сводки и морские прогнозы открытым текстом.","l":"Две линии гораздо дальше друг от друга и чуть более быстрый ритм. Между сводками вызов «CQ CQ CQ DE DDK2 DDH7 DDK9», затем RYRYRY. На 4583, 7646 и 10 100,8 кГц, также 147,3 кГц (лист 32)."},"mfsk16":{"nm":"MFSK16","sh":"16 тонов","t":"MFSK16: шестнадцать тонов","h":"Шестнадцать тонов через 15,625 Гц, по одному за раз, 15,625 раза в секунду; каждый тон несёт четыре бита, защищённых корректирующим кодом.","l":"Полоса 316 Гц из маленьких ступенек, которые всё время прыгают, после ровного тона в начале. На слух быстрая мелодия, как флейта. Служит и для передачи небольших картинок."},"sitora":{"nm":"SITOR-A (ARQ)","sh":"телекс","t":"SITOR-A: морской телекс в режиме ARQ","h":"Станция посылает блоки по три знака (210 мс, 100 Бод, разнос 170 Гц) каждые 450 мс; между блоками другая станция коротко отвечает «принято» или «повтори».","l":"Короткие ровные пачки с маленьким слабым ответом между ними: «чик-чик», как сверчок. На КВ теперь редкость."},"dscvhf":{"nm":"ЦИВ УКВ (канал 70)","sh":"DSC","t":"ЦИВ / DSC: цифровой избирательный вызов на 70-м канале","h":"Пачка около полсекунды, 1200 Бод, на двух тонах 1300 и 2100 Гц: несёт номер MMSI судна, вид вызова, а при бедствии и координаты.","l":"Короткое высокое «бррт» на 156,525 МГц, начинается с серии чередующихся битов. На СВ и КВ ЦИВ идёт в FSK 100 Бод, как NAVTEX (лист 20)."},"selcal":{"nm":"Авиационный SELCAL","sh":"4 тона","t":"SELCAL: избирательный вызов самолётов на КВ","h":"Диспетчер вызывает конкретный самолёт двумя посылками примерно по секунде, каждая из двух тонов из шестнадцати (от 312,6 до 1479,1 Гц). В кабине загорается лампа и звучит сигнал: экипажу не нужно слушать эфир постоянно.","l":"Два аккорда подряд, «бим-бом», между голосовыми сообщениями на авиационных частотах в SSB, например 5616 или 8864 кГц."},"dcs":{"nm":"DCS","sh":"134,4 бит/с","t":"DCS: цифровой субтон","h":"Вместо непрерывного тона, как в CTCSS, рация передаёт под голосом 23-битное слово, повторяемое без остановки со скоростью 134,4 бит/с. В конце тон 134,4 Гц бесшумно закрывает шумоподавитель.","l":"В звуке FM-приёмника: неровная полоса в самом низу, ниже 300 Гц, и глухой гул, если фильтр рации его пропускает (лист 10)."},"t1750":{"nm":"Тон 1750 Гц","sh":"ретранслятор","t":"Тон 1750 Гц: открыть ретранслятор","h":"Короткий тон 1750 Гц (около 0,5–1 с) в начале передачи до сих пор открывает некоторые европейские любительские ретрансляторы; при отпускании ретранслятор часто отвечает коротким сигналом.","l":"Короткая линия на 1750 Гц, затем голос, затем сигнал ретранслятора (лист 10)."},"ncdxf":{"nm":"Маяки NCDXF","sh":"14,100 МГц","t":"Маяки NCDXF / IARU: проверка прохождения","h":"Восемнадцать маяков по всему миру передают по очереди, по десять секунд каждый, на 14,100, 18,110, 21,150, 24,930 и 28,200 МГц: позывной морзянкой, затем четыре секундных тире мощностью 100 Вт, 10 Вт, 1 Вт и 0,1 Вт.","l":"Позывной, затем четыре всё более слабых тире: если слышно и последнее, прохождение до этого маяка отличное. Здесь 4U1UN (Нью-Йорк), затем VE8AT (Канада) (лист 30)."},"lrpt":{"nm":"«Метеор-М» LRPT","sh":"137,9 МГц","t":"Спутники «Метеор-М»: изображения LRPT","h":"Российские метеоспутники «Метеор-М» передают снимки в цифровом виде: четырёхпозиционная фазовая модуляция (QPSK), 72 000 символов в секунду, ширина около 120 кГц.","l":"Сплошной блок со скруглёнными краями, медленно смещающийся за пролёт (эффект Доплера); на слух просто шипение. На 137,9 или 137,1 МГц, декодируется SatDump (лист 41).","n":"уменьшенный масштаб"},"quindar":{"nm":"Тоны Квиндар","sh":"NASA","t":"Тоны Квиндар: сигналы «Аполлона»","h":"Когда оператор в Хьюстоне нажимает тангенту, сигнал 2525 Гц (250 мс) включает передатчики наземных станций; при отпускании сигнал 2475 Гц их выключает.","l":"Высокий сигнал перед каждой фразой и другой, чуть ниже, после неё: знаменитый звук записей программы «Аполлон»."},"wow":{"nm":"Сигнал «Wow!»","sh":"1977","t":"Сигнал «Wow!» (15 августа 1977 года)","h":"Радиотелескоп «Большое ухо» (Огайо) в течение 72 секунд принимал узкий и очень сильный сигнал рядом с линией водорода, около 1420,456 МГц. Астроном Джерри Эйман написал на распечатке «Wow!». Он больше не повторялся, и его происхождение до сих пор обсуждают.","l":"Тонкая линия, выходящая из шума, усиливается и спадает: форма прохода неподвижного источника через луч антенны. Это реконструкция: звукозаписи не существует.","n":"72 с сжаты до 12 с"},"frb":{"nm":"Быстрый радиовсплеск","sh":"FRB","t":"Быстрый радиовсплеск (FRB)","h":"Радиовспышка в несколько миллисекунд из другой галактики; первую открыли в 2007 году. Газ на пути сильно задерживает низкие частоты: всплеск приходит растянутым, высокие тона первыми.","l":"Одна кривая, падающая сверху вниз по спектру, и больше ничего. Некоторые повторяются; большинство видели лишь однажды.","n":"сильно замедлено и преувеличено"},"letterb":{"nm":"Однобуквенные маяки","sh":"D, P, S, C…","t":"Однобуквенные маяки","h":"Передатчики российского флота бесконечно повторяют одну букву морзянкой, каждый в 100 Гц от соседа: D, P, S, C, A, F, K или M в зависимости от места.","l":"Параллельные пунктирные линии совсем рядом, каждая в своём ритме. Около 4558, 5154, 7039, 10 872, 13 528 и 16 332 кГц, в CW."},"sid":{"nm":"Солнечная вспышка на ОНЧ","sh":"SID","t":"Солнечная вспышка на ОНЧ (SID)","h":"Сигналы ОНЧ-передатчиков флотов (20,9 кГц во Франции, 23,4 кГц в Германии…) распространяются между землёй и ионосферой. Когда приходит солнечная вспышка, её рентгеновские лучи за минуты меняют низ ионосферы, и уровень приёма скачком меняется.","l":"Узкая ровная полоса (сигнал MSK передатчика), которая резко усиливается, а затем медленно возвращается к норме. Достаточно проволочной рамки и звуковой карты: классический проект астрономических кружков.","n":"час сжат до 12 с"},"qrn":{"nm":"Грозовые помехи","sh":"QRN","t":"Грозовые помехи (QRN)","h":"Каждая молния — очень мощный передатчик сразу на всех частотах. На СВ и КВ слышны грозы за тысячи километров, особенно летом и на низких диапазонах.","l":"Неровные горизонтальные линии во всю ширину; сухой треск на слух. Подавитель импульсных помех (NB) немного помогает, рамочная антенна — больше."},"fading":{"nm":"Селективные замирания","sh":"QSB","t":"Селективные замирания (QSB)","h":"На КВ сигнал приходит через ионосферу несколькими путями. В зависимости от частоты они складываются или гасят друг друга: по сигналу гуляет узкий провал.","l":"Тёмная зона, медленно ползущая по AM-станции. Когда она проходит через несущую в центре, звук на несколько секунд становится хриплым и искажённым; синхронный детектор или приём в SSB это исправляют."},"plc":{"nm":"PLC","sh":"2–30 МГц","t":"PLC: интернет через розетки","h":"PLC-адаптеры передают данные по домашней проводке на сотнях несущих между 2 и 30 МГц (у новых моделей выше), по одной каждые 24,4 кГц. Провода излучают, как антенна.","l":"Гребёнка ровных линий, мигающая пакетами, с пропусками на любительских диапазонах (вырезы, предусмотренные стандартом); на слух треск, который следует за интернет-трафиком (лист 43).","n":"уменьшенный масштаб"},"fence":{"nm":"Электропастух","sh":"тик… тик…","t":"Электрическая изгородь (электропастух)","h":"Генератор посылает в провод импульс в несколько тысяч вольт примерно раз в секунду. Если провода касается трава или повреждён изолятор, проскакивает искра и излучает на всех частотах.","l":"Очень тонкая горизонтальная линия во всю ширину через строго равные промежутки; «тик… тик…» от ДВ до УКВ. Ровный ритм отличает её от грозы."},"gsm":{"nm":"Телефон GSM","sh":"217 Гц","t":"Телефон GSM рядом с колонкой","h":"Телефон 2G передаёт пачками по 0,577 мс, 217 раз в секунду. Плохо экранированный усилитель детектирует эти пачки и делает их слышимыми.","l":"Гребёнка линий через 217 Гц; знаменитое «та-та-татата» перед самым звонком, затем ровное жужжание во время разговора. Встречается всё реже: сети 2G отключают."},"jjy":{"nm":"JJY","sh":"40 / 60 кГц","t":"Сигнал времени JJY (Япония, 40 и 60 кГц)","h":"Каждую секунду несущая идёт на полной мощности 0,8 с (бит 0), 0,5 с (бит 1) или 0,2 с (маркер), затем падает до 10 %. Наоборот по сравнению с DCF77, где уровень падает в начале секунды.","l":"Неподвижная линия, слабеющая в конце каждой секунды раньше или позже. Передатчики в Фукусиме (40 кГц) и Сага-Фукуока (60 кГц), для радиоуправляемых часов Японии."},"rwm":{"nm":"РВМ (RWM)","sh":"4996 кГц","t":"Сигнал времени РВМ (Москва)","h":"Телеграфом на 4996, 9996 и 14 996 кГц: каждую секунду импульс 100 мс, а в другие минуты десять импульсов в секунду. Позывной RWM передаётся морзянкой дважды в час.","l":"Позывной, затем линия из ровных «тиков», а потом из быстрых точек. Слушать в CW или SSB.","n":"сокращённый фрагмент"},"bpm":{"nm":"BPM","sh":"2,5–15 МГц","t":"Сигнал времени BPM (Китай)","h":"Станция Пучэн (Шэньси) передаёт в AM на 2,5, 5, 10 и 15 МГц: каждую секунду метка 10 мс на 1000 Гц (300 мс в начале минуты), а в определённые минуты метки по 100 мс для времени UT1. Позывной BPM даётся морзянкой, затем голосом.","l":"В демодулированном звуке: позывной, затем очень короткие чёрточки на 1000 Гц, одна в секунду, и более длинная в начале минуты. Часто смешивается с WWV на тех же частотах.","n":"сокращённый фрагмент"},"humpback":{"nm":"Горбатый кит","sh":"песня","t":"Песня горбатого кита","h":"Зимой в районах размножения самцы поют: последовательность стонов, рокотов и криков образует тему, которая часами повторяется без изменений и меняется от сезона к сезону. Гидрофоны слышат её за десятки километров.","l":"Толстые следы с гармониками, медленно поднимающиеся или опускающиеся между 100 Гц и несколькими кГц; та же последовательность возвращается через несколько секунд. Эхо от поверхности и дна растягивает каждую ноту."},"bluewhale":{"nm":"Синий кит","sh":"×10","t":"Синий кит: самый низкий зов","h":"Самое крупное животное на Земле издаёт очень низкие (10–40 Гц) и очень мощные зовы длиной 10–20 секунд, повторяя их часами: они разносятся на сотни километров. Чтобы их услышать, запись ускоряют в десять раз.","l":"Пульсирующая часть, затем длинная нота, которая едва понижается, с гармониками над ней; последовательность повторяется. Шкала показывает настоящие частоты.","n":"ускорено в 10 раз"},"finwhale":{"nm":"Финвал","sh":"20 Гц","t":"Финвал: импульсы 20 Гц","h":"Финвал издаёт импульсы длиной около секунды, понижающиеся примерно с 25 до 18 Гц, через равные промежутки, иногда сутками. В 1950–60-х годах эти «сигналы 20 Гц» озадачивали сети прослушивания ВМС США, пока их не приписали этому киту.","l":"Короткие одинаковые чёрточки, ровной серией или парами, как удары очень медленного сердца; каждая слегка понижается по частоте. Шкала показывает настоящие частоты.","n":"ускорено в 10 раз"},"sperm":{"nm":"Кашалот","sh":"щелчки","t":"Щелчки кашалота","h":"Кашалот охотится в глубоких погружениях с помощью сонара: очень мощные щелчки, примерно один в секунду, которые при приближении к добыче учащаются в «скрип». Между собой кашалоты обмениваются «кодами» — короткими сериями щелчков, ритм которых различается от клана к клану.","l":"Горизонтальные черты во всю ширину, равномерно расставленные, затем сгущённые в жужжание (скрип), и наконец маленький ритмический рисунок — кода. Каждый щелчок состоит из нескольких близких импульсов — отражений внутри головы животного."},"dolphin":{"nm":"Афалина","sh":"свисты","t":"Свисты и щелчки дельфина","h":"Афалина свистит примерно от 5 до 20 кГц; у каждой особи есть «свист-подпись», который служит ей именем. Для охоты и ориентации она также посылает серии очень коротких щелчков — до нескольких сотен в секунду.","l":"Тонкие кривые, которые поднимаются и снова опускаются, часто повторяясь без изменений, и пачки горизонтальных черт при эхолокации. Частоты поделены на 3, чтобы их было слышно; шкала показывает настоящие значения.","n":"в 3 раза ниже"},"orca":{"nm":"Косатка","sh":"импульсные крики","t":"Импульсные крики косатки","h":"Косатки общаются импульсными криками: сериями импульсов настолько частыми (500–2000 в секунду), что они слышатся как нота, с резким скачком высоты. У каждой семейной группы свой «диалект».","l":"Пачка параллельных следов (гармоник), которые вместе поднимаются или опускаются, с резким изломом посередине крика; иногда тонкий, более высокий свист."},"bseal":{"nm":"Морской заяц","sh":"трель","t":"Трель морского зайца","h":"Весной подо льдом Арктики самец издаёт длинные трели, спиралью спускающиеся от нескольких кГц до нескольких сотен герц, иногда целую минуту. Они служат для защиты территории и привлечения самок.","l":"Волнистая кривая, скользящая по шкале сверху вниз, как распрямляющаяся пружина, и низкая нота в конце.","n":"сокращено"},"shrimp":{"nm":"Креветки-щелкуны","sh":"риф","t":"Креветки-щелкуны (альфеиды)","h":"Резко захлопывая большую клешню, креветка выбрасывает струю воды так быстро, что образуется кавитационный пузырёк; схлопываясь, он щёлкает, как выстрел. Тысячи креветок создают звуковой фон рифов и могут мешать сонарам.","l":"Дождь точек и коротких горизонтальных черт во всю ширину, без всякого порядка; в наушниках непрерывный треск, как при жарке."},"sonar":{"nm":"Активный сонар","sh":"пинг","t":"Пинг активного сонара","h":"Корабль посылает мощный звуковой импульс (здесь около 3,5 кГц — диапазон корпусных сонаров фрегатов) и слушает эхо: задержка даёт дальность, сдвиг частоты (эффект Доплера) — скорость цели. Звук возвращается и шлейфом от дна и поверхности — это реверберация.","l":"Короткая сильная черта, затухающий шлейф, затем эхо — гораздо слабее и немного сдвинутое по частоте. Второй пинг — частотная развёртка (чирп), которая лучше измеряет дальность."},"propeller":{"nm":"Гребной винт","sh":"кавитация","t":"Винт проходящего судна","h":"Лопасти винта создают кавитационные пузырьки, которые лопаются: широкий шум, пульсирующий в ритме прохождения лопастей. Машины добавляют постоянные линии. Гидроакустики анализируют этот ритм (анализ DEMON), чтобы сосчитать лопасти и обороты и опознать судно.","l":"Шум в широкой полосе, исчерченный горизонтальными полосами в ритме лопастей, с несколькими постоянными вертикальными линиями (двигатель, редуктор). Всё нарастает, а затем затихает, когда судно проходит над гидрофоном."},"uqc":{"nm":"Подводный телефон","sh":"UQC 8 кГц","t":"Подводный телефон (UQC, «Гертруда»)","h":"Подводные лодки и корабли разговаривают под водой по акустическому телефону: голос передаётся с одной боковой полосой над несущей 8,0875 кГц, излучаемой преобразователем в корпусе. Дальность — несколько километров.","l":"Полоса голоса SSB выше 8 кГц; после демодуляции — далёкий голос, который колеблется и гулко звучит из-за эха от поверхности и дна. Изображение уменьшено вдвое; шкала показывает настоящие частоты.","n":"шкала уменьшена вдвое"},"zevs":{"nm":"ЗЕВС 82 Гц","sh":"КНЧ","t":"ЗЕВС: радио для подводных лодок на 82 Гц","h":"Радиоволны очень плохо проникают в морскую воду, кроме крайне низких частот (КНЧ). Российский передатчик ЗЕВС на Кольском полуострове работает на 82 Гц через антенные линии длиной в десятки километров, чтобы связаться с лодками на большой глубине. Скорость ничтожна: несколько знаков в минуту.","l":"Тонкая линия на 82 Гц рядом с линией сети 50 Гц и её гармониками, с помехами от гроз. В наушниках едва слышный низкий гул; принимается большой рамкой и звуковой картой. Американский аналог на 76 Гц закрыт в 2004 году."},"bloop":{"nm":"«Блуп»","sh":"1997","t":"«Блуп» (1997)","h":"В 1997 году гидрофоны NOAA в Тихом океане уловили очень низкий, быстро повышающийся звук, слышный за тысячи километров. Долго остававшийся загадкой, с 2012 года он приписывается ледотрясению — раскалывающемуся огромному айсбергу.","l":"Широкая полоса, которая за несколько секунд поднимается вместе с гармониками, а затем медленно затухает. Реконструкция, ускоренная в 16 раз, как запись, опубликованная NOAA.","n":"ускорено в 16 раз"}}},"uk":{"ui":{"title":"VSISA","mystery":"Загадковий звук","play":"▶ Слухати","stop":"■ Стоп","noise":"Шум","volume":"Гучність","loop":"По колу","specwf":"Спектр + водоспад","cursor":"курсор","footprint":"Відбиток","dur":"{s} с згори донизу","avg":"середнє по всьому сигналу","press":"Натисни «Слухати»: сигнал побіжить тут","count":"{n} сигналів, у порядку аркуша 6","myst":"Загадка","mystTags":"Слухай і дивись, потім обери правильну відповідь","quizH":"Що це за сигнал?","quizLead":"Увімкни звук, подивись на спектр, водоспад і відбиток, потім відповідай.","score":"Рахунок","good":"Правильно!","bad":"Ні: це був {x}.","next":"Наступний загадковий звук","principle":"Принцип","screen":"На екрані","sheet":"аркуш","book":"Книга: аркуш {r}","lang":"Мова","signals":"Сигнали","f1":"Сигнали змодельовано просто на сторінці (12 000 відліків за секунду): сигнали аркуша 6 книги OpenBookRadio, інші сигнали з книги та бонуси. Для радіосигналів (AM, FM, AIS, LoRa…) показано змодельовану проміжну частоту, як на екрані SDR; деякі зменшено або прискорено, це вказано. Для AM, SSB, FM, FM-стерео, МКС і завмирань чути демодульований звук, як із динаміка приймача, а екран показує
