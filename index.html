<title>Identificateur de modes radio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : un panneau de récepteur. Liste des signaux à gauche, spectre + waterfall en direct au centre, empreinte + fiche en dessous. */
:root{
  --bg:#10141b; --panel:#171e28; --panel-2:#1d2633; --line:#2b3746;
  --fg:#e1e7ef; --muted:#8d9bad; --accent:#f2b544; --accent-ink:#1a1408;
  --ok:#5fcf8f; --bad:#ef6b6b;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html.night{--bg:#0a0000;--panel:#140202;--panel-2:#1e0404;--line:#3d0a08;--fg:#e2533f;--muted:#9c3428;--accent:#ff3b2f;--accent-ink:#140000;--ok:#ff8a6a;--bad:#c22a1c}
html.night .screen{background:#000}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
h1 small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.btn{font:500 .9rem var(--f-body);border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:6px;padding:8px 14px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--muted)}
.hdr-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.langlbl{display:flex;align-items:center;gap:8px;font:400 .8rem var(--f-mono);color:var(--muted)}
select{font:500 .9rem var(--f-body);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:38px;cursor:pointer}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:focus-visible,.mode:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;padding-right:4px}
@media (max-width:820px){.grid{grid-template-columns:1fr}aside{position:static;max-height:none;overflow:visible}}
.count{font:400 .75rem var(--f-mono);color:var(--muted);margin:0}
.group h2{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){.group ul{flex-direction:row;flex-wrap:wrap}}
.mode{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:baseline;font:500 .9rem var(--f-body);color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 10px;cursor:pointer}
.mode span{font:400 .72rem var(--f-mono);color:var(--muted);white-space:nowrap}
.mode:hover{background:var(--panel)}
.mode[aria-pressed="true"]{background:var(--panel-2);border-color:var(--accent)}
.mode[aria-pressed="true"] span{color:var(--accent)}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.now{min-width:0}
.now h2{font-family:var(--f-display);font-weight:700;font-size:1.9rem;margin:0;line-height:1.1;text-wrap:balance}
.now p{margin:0;color:var(--muted);font-family:var(--f-mono);font-size:.8rem}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.controls label{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:110px}
input[type=checkbox]{accent-color:var(--accent)}
.screen{background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.screen-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);font:400 .74rem var(--f-mono);color:var(--muted);letter-spacing:.04em}
.screen-head b{color:var(--fg);font-weight:500;text-transform:uppercase;letter-spacing:.1em}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:crosshair}
.ruler{position:relative;height:22px;background:var(--panel);border-top:1px solid var(--line);font:400 .7rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden}
.ruler span{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
.ruler span::before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:4px;background:var(--muted)}
.ruler span.first{transform:none}.ruler span.first::before{left:0}
.ruler span.last{transform:translateX(-100%)}.ruler span.last::before{left:auto;right:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
.card h3{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0 0 4px;text-wrap:balance}
.card .lead{margin:0 0 12px;color:var(--fg);max-width:62ch}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:.9rem}
dt{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:3px}
dd{margin:0;min-width:0}
.ref{display:inline-block;margin-top:12px;font:500 .75rem var(--f-mono);color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.quiz{display:flex;flex-direction:column;gap:10px}
.quiz .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quiz .msg{font-weight:600}
.quiz .msg.ok{color:var(--ok)}.quiz .msg.bad{color:var(--bad)}
.score{font:500 .8rem var(--f-mono);color:var(--muted)}
.readout{font-variant-numeric:tabular-nums;color:var(--accent)}
footer{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
footer p{margin:0;max-width:110ch}
</style>

<div class="wrap">
  <header>
    <h1><small>VSISA · Virtual Simulator identification Signal Audio · OpenBookRadio</small><span id="tTitle">Identificateur de modes radio</span></h1>
    <div class="hdr-ctl">
      <label class="langlbl" for="lang"><span id="tLang">Langue</span>
        <select id="lang"></select></label>
      <button class="btn" id="night" type="button" aria-pressed="false">Mode nuit</button>
      <button class="btn" id="mystery" type="button">Son mystère</button>
    </div>
  </header>

  <div class="grid">
    <aside id="modes" aria-label="Signaux"></aside>

    <main>
      <div class="bar">
        <div class="now">
          <h2 id="nowName">—</h2>
          <p id="nowTags">—</p>
        </div>
        <div class="controls">
          <button class="btn primary" id="play" type="button">▶ Écouter</button>
          <button class="btn" id="stop" type="button">■ Stop</button>
          <label for="noise"><span id="tNoise">Bruit</span> <input type="range" id="noise" min="0" max="100" value="15"></label>
          <label for="vol"><span id="tVol">Volume</span> <input type="range" id="vol" min="0" max="100" value="55"></label>
          <label for="loop"><input type="checkbox" id="loop" checked> <span id="tLoop">En boucle</span></label>
        </div>
      </div>

      <section class="screen" aria-label="Spectre et waterfall en direct">
        <div class="screen-head"><b id="tSpecwf">Spectre + Waterfall</b><span><span id="spanLbl">—</span> · <span id="tCursor">curseur</span> <span class="readout" id="ro1">—</span></span></div>
        <canvas id="sp" width="600" height="140" style="border-bottom:1px solid var(--line)"></canvas>
        <canvas id="wf" width="600" height="240"></canvas>
        <div class="ruler" id="ruler1"></div>
      </section>

      <div class="two">
        <section class="screen" aria-label="Empreinte du signal">
          <div class="screen-head"><b id="tFoot">Empreinte</b><span id="dur">—</span></div>
          <canvas id="fp" width="600" height="300"></canvas>
          <div class="ruler" id="ruler2"></div>
        </section>
        <section class="card" id="info" aria-live="polite"></section>
      </div>
    </main>
  </div>

  <footer>
    <p id="tF1"></p>
    <p id="tF2"></p>
  </footer>
</div>

const I18N = {"fr":{"ui":{"title":"Identificateur de modes radio","mystery":"Son mystère","play":"▶ Écouter","stop":"■ Stop","noise":"Bruit","volume":"Volume","loop":"En boucle","specwf":"Spectre + Waterfall","cursor":"curseur","footprint":"Empreinte","dur":"{s} s de haut en bas","avg":"moyenne sur tout le signal","press":"Appuie sur Écouter : le signal défile ici","count":"{n} signaux, dans l'ordre de la fiche 5 bis","myst":"Mode mystère","mystTags":"Écoute et regarde, puis choisis la bonne réponse","quizH":"Quel est ce signal ?","quizLead":"Lance l'écoute, observe le spectre, le waterfall et l'empreinte, puis réponds.","score":"Score","good":"Bonne réponse !","bad":"Raté : c'était {x}.","next":"Son mystère suivant","principle":"Principe","screen":"Sur l'écran","sheet":"fiche","book":"Livre : fiche {r}","lang":"Langue","signals":"Signaux","f1":"Signaux simulés dans la page (12 000 échantillons par seconde), d'après les signaux de la fiche 5 bis du livre OpenBookRadio, plus Olivia, FT4 et Feld Hell (fiche 26). Pour les signaux radio (AM, FM, AIS, LoRa…), on voit la fréquence intermédiaire simulée, comme sur l'écran d'un SDR ; certains sont à échelle réduite ou accélérée, c'est indiqué.","f2":"Le temps descend dans le waterfall et dans l'empreinte. Licence CC BY-NC-SA 4.0, gratuit, ne pas vendre.","night":"Mode nuit","day":"Mode jour"},"groups":["Voix analogique","Télégraphie","Données","Images","Aviation, marine et secours","Appel, sous-tons et messagerie","Radiosondes, capteurs et objets connectés","Modes HF et curiosités","Diffusion et temps","Large bande","Bonus : sons de l'espace","Bonus : curiosités des ondes courtes"],"modes":{"406":{"nm":"Balise 406","sh":"BPSK","t":"Balise 406 MHz : salve BPSK","h":"Une demi-seconde d'émission : 160 ms de porteuse pure, puis la phase bascule de ±1,1 radian à 400 bit/s.","l":"Un petit trait court qui revient toutes les 50 s, entre 406,0 et 406,1 MHz ; rien à entendre d'utile, il faut un décodeur (EPIRB 406, fiche 25)."},"am":{"nm":"AM","sh":"voix","t":"AM : modulation d'amplitude","h":"La force de la porteuse suit le son : la courbe « gonfle » et « dégonfle ».","l":"Un trait fixe au centre (la porteuse), avec deux bandes latérales identiques de chaque côté. Environ 6 à 9 kHz de large. Radio en ondes courtes et petites ondes, aviation (fiches 10 et 12)."},"ssb":{"nm":"BLU / SSB","sh":"USB","t":"BLU / SSB : bande latérale unique","h":"Il ne reste qu'une bande latérale, sans porteuse : rien quand on se tait.","l":"Pas de trait central, une seule bande d'environ 2,7 kHz qui ne vit que quand on parle. USB au-dessus de 10 MHz, LSB en dessous (radioamateurs). Mal calée, la voix devient « canard » (fiches 9 et 26)."},"fm":{"nm":"FM","sh":"voix","t":"FM : modulation de fréquence","h":"L'amplitude reste fixe ; ce sont les oscillations qui se serrent ou s'écartent avec le son.","l":"Le signal danse autour de sa fréquence, plus large quand le son est fort : 12,5 kHz par canal en FM étroite (talkies, relais), 200 kHz en radio FM (fiches 2 et 11)."},"cw":{"nm":"CW","sh":"Morse","t":"CW : Morse","h":"La porteuse est allumée et éteinte : des traits et des points.","l":"Un trait très fin qui s'interrompt au rythme du Morse ; un bip à l'oreille. Ici « CQ » (fiche 39).","r":[["Vitesse","20 mots/min, point de 60 ms, à 700 Hz : « CQ CQ CQ DE F4ABC K »"],["À l'oreille","Bips purs, longs et courts, d'une seule note"],["Décodage","À l'oreille, fldigi, CW Skimmer"]]},"rtty":{"nm":"RTTY 45","sh":"170 Hz","t":"FSK / RTTY : deux fréquences","h":"La fréquence saute entre deux valeurs, une pour 0, une pour 1.","l":"Deux traits parallèles : 170 Hz d'écart chez les radioamateurs (45,45 bauds), 450 ou 850 Hz pour les bulletins météo. Un « tidilidi » régulier (fiche 27).","r":[["Code","Baudot ITA2 : 5 bits + start + 1,5 stop ; mark 2125 Hz, space 2295 Hz"],["Texte","RYRYRYRY CQ CQ DE F4ABC"],["Décodage","fldigi, MMTTY, 2Tone"]]},"afsk":{"nm":"Packet APRS","sh":"AFSK 1200","t":"AFSK 1200 bauds : APRS et packet","h":"Deux léatoire à l'oreille (fiche 26)."},"hell":{"nm":"Feld Hell","sh":"OOK","t":"Feld Hell : écrire avec une porteuse","h":"La porteuse est allumée et éteinte point par point : chaque lettre est une colonne de 14 points, balayée de bas en haut (245 points par seconde).","l":"Sur le waterfall, un trait haché ; c'est l'écran du logiciel (fldigi) qui redessine les lettres. Un crépitement doux à l'oreille (fiche 26)."},"4fsk":{"nm":"DMR / C4FM","sh":"4FSK","t":"4FSK : DMR, C4FM (Fusion), NXDN, dPMR","h":"Quatre niveaux de fréquence : chaque symbole porte deux bits.","l":"Un bloc rectangulaire de 6 à 12,5 kHz, plein comme du bruit, souvent en salves (le DMR partage le canal en deux créneaux). Un « frrr » rauque à l'oreille (fiche 38)."},"mt63":{"nm":"MT63","sh":"NBEMS","t":"MT63 : messages d'urgence (NBEMS)","h":"64 tonalités à la fois, chacune modulée lentement, avec beaucoup de redondance.","l":"Un bloc plat de 1 ou 2 kHz centré sur 1500 Hz, avec des bords nets ; un souffle régulier. Passe même par un micro collé à un haut-parleur (fiche 26 ter)."},"lora":{"nm":"LoRa","sh":"chirps","t":"LoRa : rampes de fréquence (chirps)","h":"La fréquence balaie toute la largeur, puis repart du bas : la position du saut porte les données.","l":"Des diagonales parallèles, faciles à reconnaître : Meshtastic et MeshCore sur 869,525 MHz ou 433 MHz, capteurs LoRaWAN (fiches 11, 20 et 21)."},"sstv":{"nm":"SSTV Martin M1","sh":"VIS 44","t":"SSTV : images en audio","h":"Un top de synchro à 1200 Hz, puis la fréquence suit la luminosité de la ligne, de 1500 (noir) à 2300 Hz (blanc).","l":"Des traits de synchro réguliers et un nuage qui varie avec l'image ; un son qui « gazouille » pendant une à deux minutes. 14,230 MHz, ISS sur 145,800 MHz (fiche 31).","r":[["Trame","En-tête VIS, puis lignes : synchro 1200 Hz, vert, bleu, rouge ; ici 20 lignes d'une mire"],["Décodage","QSSTV, MMSSTV, Robot36 sur smartphone"]]},"fax":{"nm":"Fax météo","sh":"120 lpm","t":"Fax météo : 1500 Hz noir, 2300 Hz blanc","h":"La fréquence passe du noir au blanc en continu, 120 lignes par minute.","l":"Deux bandes fixes à 1500 et 2300 Hz (800 Hz d'écart), un « tic-tac » régulier. Les fréquences publiées sont celles de la porteuse : écoute en USB 1,9 kHz plus bas (fiche 32).","r":[["Trame","Ton de démarrage 300 Hz, lignes de phasage (impulsion blanche), puis la carte"],["Décodage","fldigi, JWX, HamFax"]]},"elt":{"nm":"Sirène ELT","sh":"121,5 MHz","t":"Sirène ELT / PLB sur 121,5 MHz","h":"Une AM dont la tonalité descend de 1600 à 300 Hz, deux à quatre fois par seconde.","l":"Une porteuse fixe et des bandes latérales qui glissent en éventail : le « wou-wou » des balises de détresse, aussi sur 121,375 MHz pour les exercices (fiches 24 et 25)."},"adsb":{"nm":"ADS-B","sh":"1090 MHz","t":"ADS-B / mode S (1090 MHz) : impulsions","h":"Des impulsions de 0,5 µs dont la position porte les bits (PPM) ; ici l'échelle de temps est très ralentie.","l":"Des traits horizontaux très courts sur toute la largeur, des centaines par seconde près d'un aéroport ; il faut une clé SDR (fiche 13).","n":"échelle de temps très ralentie"},"acars":{"nm":"ACARS","sh":"MSK","t":"ACARS : AM et données MSK","h":"Une AM qui transporte deux tonalités, 1200 et 2400 Hz, à 2400 bit/s.","l":"Des salves d'une demi-seconde avec porteuse et bandes latérales, sur 131,525, 131,725 ou 131,825 MHz en Europe : un « brrrt » à l'oreille (fiche 14)."},"ais":{"nm":"AIS","sh":"GMSK","t":"AIS : GMSK 9600 bauds sur deux canaux","h":"Une FSK adoucie (GMSK) en salves de 26 ms, une fois sur 161,975 MHz, une fois sur 162,025 MHz (échelle réduite).","l":"Deux colonnes de petits traits brefs, 50 kHz d'écart, un claquement régulier ; plus il y a de navires, plus c'est serré (fiche 16).","n":"échelle réduite"},"navtex":{"nm":"NAVTEX","sh":"518 kHz","t":"NAVTEX et ASN en ondes moyennes et courtes : FSK 170 Hz","h":"Comme le RTTY : deux fréquences à 170 Hz d'écart, mais à 100 bauds.","l":"Deux traits parallèles en continu pendant le bulletin, sur 518 et 490 kHz (NAVTEX) ou 2187,5 kHz (appel sélectif numérique) (fiche 17).","r":[["Code","SITOR-B, CCIR 476 : 7 bits dont quatre « 1 », avec répétition FEC"],["Décodage","fldigi, YaND"]]},"hfdl":{"nm":"HFDL","sh":"PSK 1800","t":"HFDL : les avions en ondes courtes","h":"Une PSK à 1800 bauds sur une sous-porteuse de 1440 Hz.","l":"Des salves d'environ 2,4 kHz entre 2,9 et 22 MHz ; un chuintement de modem qui part et revient (fiche 14 bis)."},"ctcss":{"nm":"CTCSS","sh":"88,5 Hz","t":"CTCSS : sous-ton sous la voix","h":"Une tonalité grave et continue (67 à 254 Hz, ici 88,5 Hz) ajoutée à la voix.","l":"Vu dans le son du récepteur FM : un trait fixe tout en bas, sous la voix ; il ouvre le squelch des relais et des talkies (fiche 8)."},"dtmf":{"nm":"DTMF","sh":"2 tons","t":"DTMF : deux tonalités par touche","h":"Chaque touche du clavier envoie une tonalité grave (697 à 941 Hz) et une aiguë (1209 à 1633 Hz) en même temps.","l":"Des paires de points alignés sur huit colonnes fixes ; le « bip-bip » des numéros de téléphone et des commandes de relais (fiche 8).","r":[["Séquence","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"nm":"Selcall CCIR","sh":"5 tons","t":"Selcall CCIR : tonalités en séquence","h":"Cinq tonalités de 100 ms l'une après l'autre, une par chiffre.","l":"Un petit escalier de points, répété ; un « tululululu » rapide pour appeler une radio précise (fiche 28).","r":[["Séquence","1 2 3 4 5, deux fois ; décodé aussi par l'app SelCall de l'UV-K1"]]},"pocsag":{"nm":"POCSAG / FLEX","sh":"bipeurs","t":"POCSAG et FLEX : bipeurs","h":"Une FSK à ±4,5 kHz ; un préambule 1010… puis les données (échelle réduite).","l":"Deux traits nets pendant le préambule, puis une bande pleine ; un « brrrrt » strident. 466,075 MHz, DAPNET 439,9875 MHz (fiche 37).","n":"échelle réduite"},"ale":{"nm":"ALE","sh":"8 tons","t":"ALE : l'appel automatique en ondes courtes","h":"Huit tonalités de 750 à 2500 Hz, 125 bauds, en rafales.","l":"Un bloc d'environ 2 kHz fait de petits points, une à deux secondes, parfois sur plusieurs fréquences voisines ; un gazouillis aigu (fiche 28 bis)."},"rs41":{"nm":"Radiosonde RS41","sh":"GFSK","t":"Radiosonde RS41 : GFSK en continu","h":"Une FSK adoucie à 4800 bauds, sans arrêt ; la fréquence dérive lentement quand la sonde monte et se refroidit.","l":"Une bande d'environ 10 kHz qui glisse en biais pendant tout le vol, entre 400 et 406 MHz (fiche 18)."},"ook":{"nm":"Capteurs 433","sh":"OOK","t":"Capteurs 433 MHz : OOK","h":"La porteuse s'allume et s'éteint en impulsions courtes ou longues (tout ou rien) ; le message est répété trois fois.","l":"Des rafales de petits points, souvent en triple, sur 433,92 MHz : stations météo, sondes de température, télécommandes (fiche 19)."},"fhss":{"nm":"Bluetooth","sh":"FHSS","t":"Bluetooth : sauts de fréquence (FHSS)","h":"La fréquence change 1600 fois par seconde parmi 79 canaux (échelle réduite).","l":"De petits traits éparpillés partout sur 80 MHz de large, jamais au même endroit, vers 2,4 GHz (fiche 22).","n":"échelle réduite"},"wspr":{"nm":"WSPR","sh":"4-FSK","t":"WSPR : balises de propagation","h":"Quatre tonalités espacées de 1,46 Hz, 0,68 s par symbole, pendant 110,6 s.","l":"Un trait très fin d'environ 6 Hz qui dure presque deux minutes, toutes les deux minutes paires : il faut zoomer très fort (fiche 26).","n":"extrait de 24 s (une émission dure 110,6 s)"},"qrss":{"nm":"QRSS","sh":"DFCW","t":"QRSS : Morse très lent","h":"Une porteuse allumée et éteinte, avec des points de 3 à 10 s, souvent sur deux fréquences voisines (DFCW).","l":"Des traits de quelques Hz de large qu'on lit sur un écran de dix minutes ; inaudible à l'oreille (fiche 26 bis).","n":"accéléré : point de 0,6 s au lieu de 3 à 10 s"},"texte":{"nm":"Texte dans le waterfall","sh":"image","t":"Texte dans le waterfall","h":"Chaque ligne d'une image devient un groupe de tonalités : le son ressemble à du bruit.","l":"Le texte ou le dessin apparaît directement sur l'écran du SDR (fiche 33).","r":[["Note","Émis par le bas de l'image : à l'endroit sur le waterfall en direct, à l'envers dans l'empreinte (lue de haut en bas)"]]},"vara":{"nm":"VARA / Pactor","sh":"OFDM","t":"Données HF modernes : VARA, Pactor, ARDOP","h":"De longues salves pleines (OFDM ou PSK) et, entre deux, de courtes réponses de l'autre station.","l":"Un rectangle d'environ 2,4 kHz qui s'arrête et repart, avec un petit accusé de réception au milieu ; un chuintement haché (fiche 26)."},"chirp":{"nm":"Sondeur ionosphérique","sh":"chirp","t":"Sondeur ionosphérique (chirp sounder)","h":"Une rampe de fréquence lente qui traverse toute la bande HF ; les échos de l'ionosphère arrivent un peu plus tard.","l":"Une diagonale qui balaie l'écran, doublée de traits parallèles (les échos) ; un « ffuit » qui passe en une fraction de seconde."},"oth":{"nm":"Radar transhorizon","sh":"woodpecker","t":"Radar transhorizon (« woodpecker »)","h":"Des impulsions répétées 10 à 50 fois par seconde, chacune large de plusieurs kHz.","l":"Un bloc large strié, qui couvre des bandes entières ; un claquement de pic-vert très régulier en ondes courtes."},"parasites":{"nm":"Parasites","sh":"alimentation","t":"Parasites d'une alimentation à découpage","h":"Un signal carré : sa fréquence et toutes ses harmoniques sortent en même temps.","l":"Un peigne de raies régulières qui dérivent ensemble, sur un fond de bruit : à chercher avec NOISE FIND ou un récepteur portable (fiche K21b)."},"mpx":{"nm":"FM stéréo et RDS","sh":"MPX","t":"Radio FM stéréo et RDS","h":"Le son démodulé (multiplex) contient la voie L+R, un pilote à 19 kHz, la voie L-R autour de 38 kHz et le RDS à 57 kHz.","l":"Vu sur 0 à 60 kHz après la démodulation : un bloc grave, un trait fin à 19 kHz, un bloc plus faible au milieu et le RDS tout en haut (fiche 10).","n":"échelle ÷ 20 pour l'écoute"},"dcf77":{"nm":"DCF77","sh":"77,5 kHz","t":"Signal horaire DCF77 (77,5 kHz)","h":"Une porteuse qui baisse à 15 % pendant 0,1 s (bit 0) ou 0,2 s (bit 1), au début de chaque seconde.","l":"Un trait fixe avec une coupure noire chaque seconde ; la 59e seconde n'en a pas, pour marquer la minute (fiche 10).","r":[["Note","Ici la porteuse est ramenée à 1000 Hz ; la 6e seconde n'a pas de coupure, comme la 59e seconde de chaque minute"]]},"ofdm":{"nm":"OFDM","sh":"DRM, DAB+","t":"OFDM : des dizaines de sous-porteuses","h":"Beaucoup de porteuses très serrées, chacune lente : la somme ressemble à du bruit.","l":"Un rectangle plat aux bords nets, toujours là : DRM en ondes courtes (10 kHz), DAB+ (1,5 MHz), TNT, Wi-Fi. Un souffle continu à l'oreille (fiches 10 et 22)."},"dsss":{"nm":"DSSS","sh":"GPS, Wi-Fi","t":"Étalement de spectre (DSSS) : GPS, Wi-Fi 802.11b","h":"Les données sont mélangées à un code très rapide : l'énergie s'étale sur une grande largeur.","l":"Une bosse large, à peine au-dessus du bruit ; le GPS est même sous le bruit et ne se voit pas sans traitement (fiches 22 et 23)."},"hline":{"nm":"Raie de l'hydrogène","sh":"1420 MHz","t":"Raie de l'hydrogène à 21 cm (1420,405 MHz)","h":"L'hydrogène froid de la Voie lactée émet un souffle très faible sur 1420,405 MHz. Le mouvement des bras de la galaxie le décale par effet Doppler : on voit plusieurs petites bosses.","l":"Presque rien dans le waterfall d'une seconde à l'autre : il faut moyenner longtemps pour voir les bosses sortir du bruit. Ici, regarde le spectre moyen à l'arrêt. Une parabole ou un cornet, un préampli et une clé SDR suffisent.","n":"signal très exagéré"},"sun":{"nm":"Soleil","sh":"sursauts","t":"Soleil : sursauts radio de type III","h":"Des électrons lancés par une éruption traversent la couronne du Soleil et la font émettre de plus en plus bas en fréquence à mesure qu'ils s'éloignent.","l":"Des traits qui tombent en diagonale du haut vers le bas du spectre en moins d'une seconde, sur un fond de bruit solaire ; un « chhhh » qui enfle. De 10 à 400 MHz environ, aussi en ondes courtes vers 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter : sursauts décamétriques (L et S)","h":"Le champ magnétique de Jupiter et sa lune Io produisent des émissions puissantes entre 15 et 40 MHz : des sursauts L lents et des sursauts S très courts qui glissent vite vers le bas.","l":"D'abord des vagues de souffle (L, comme le ressac), puis des salves de petits « pops » (S) en diagonales serrées. Vers 20,1 MHz la nuit, avec un simple dipôle, quand Io est bien placée."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Une étoile à neutrons qui tourne sur elle-même balaie la Terre d'un faisceau radio, ici toutes les 0,714 s. Le gaz interstellaire retarde les basses fréquences : chaque impulsion arrive d'abord en haut du spectre.","l":"Un « tic » régulier ; dans le waterfall, chaque impulsion est une courbe qui descend (la dispersion). Le vrai signal est sous le bruit : il faut une grande antenne et additionner les impulsions sur leur période.","n":"signal très exagéré"},"meteor":{"nm":"Météores","sh":"GRAVES","t":"Échos de météores sur le radar GRAVES (143,050 MHz)","h":"Le radar français GRAVES émet sans arrêt sur 143,050 MHz. Quand une étoile filante ionise l'air, sa traînée renvoie un peu de ce signal vers ton récepteur, pendant une fraction de seconde à quelques secondes.","l":"En USB sur 143,049 MHz : des « ping » brefs vers 1000 Hz, parfois un écho qui glisse (la tête du météore, effet Doppler) ou qui dure. Bien plus nombreux pendant les essaims (Perséides, Géminides) (fiche 1)."},"whistler":{"nm":"Sifflements","sh":"VLF","t":"Sifflements VLF (whistlers)","h":"Un éclair crée un claquement radio ; une partie suit les lignes du champ magnétique terrestre jusqu'à l'autre hémisphère et revient, les aigus en premier.","l":"Un « tiouuu » qui descend de l'aigu au grave en une ou deux secondes, juste après un claquement ; des craquements (sferics) partout. Sous 10 kHz, avec un récepteur VLF loin des lignes électriques."},"chorus":{"nm":"Chœur de l'aube","sh":"VLF","t":"Chœur de l'aube (dawn chorus)","h":"Pendant un orage magnétique, des électrons piégés dans la magnétosphère émettent de petites notes montantes, surtout au lever du jour.","l":"Des gazouillis montants qui se chevauchent, comme des oiseaux, de 1 à 4 kHz environ. Même matériel que pour les sifflements."},"sputnik":{"nm":"Spoutnik 1","sh":"1957","t":"Spoutnik 1 (1957)","h":"Le premier satellite artificiel émettait des bips d'environ 0,3 s sur 20,005 et 40,002 MHz, en alternance, pendant trois semaines.","l":"Un trait coupé régulièrement : « bip… bip… », le son écouté dans le monde entier en octobre 1957 (reconstitution)."},"doppler":{"nm":"Effet Doppler","sh":"satellite","t":"Balise de satellite et effet Doppler","h":"Un satellite en orbite basse s'approche puis s'éloigne : la fréquence reçue baisse pendant le passage, d'environ ±3 kHz à 145 MHz et ±10 kHz à 435 MHz.","l":"Un trait qui descend en forme de S : lentement au début, vite quand le satellite passe au plus près, puis de nouveau lentement (fiche 34).","n":"passage de 10 min ramené à 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satellites NOAA : images APT (historique)","h":"Une sous-porteuse de 2400 Hz modulée en amplitude par l'image, deux lignes par seconde, avec un top de synchro au début de chaque ligne. Arrêté en 2025 ; les Meteor-M émettent aujourd'hui en LRPT.","l":"Un trait à 2400 Hz avec des bandes latérales qui changent avec l'image, et le fameux « tic-tac » deux fois par seconde (fiche 34)."},"eme":{"nm":"Écho de la Lune","sh":"EME","t":"Écho de la Lune (EME)","h":"Un signal envoyé vers la Lune revient environ 2,5 s plus tard, énormément affaibli, un peu élargi et décalé par le Doppler.","l":"On entend son propre « bip », puis son écho faible et un peu flou 2,5 s après. Les radioamateurs le font en CW ou en JT65, sur 144 MHz et plus (fiche 1).","n":"écho très exagéré"},"msk144":{"nm":"MSK144","sh":"météores","t":"MSK144 : le numérique des météores","h":"Deux tonalités, 1000 et 2000 Hz, à 2000 bauds, en trames de 72 ms répétées sans arrêt : chaque passage de météore en laisse passer quelques-unes.","l":"Des salves de 0,1 à 1 s, d'environ 2,4 kHz de large, qui apparaissent puis s'éteignent avec le « ping » du météore. Sur 50 et 144 MHz, avec WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tons","t":"JT65 : 65 tonalités, très lent","h":"Une tonalité de synchro et 64 tonalités de données espacées de 2,7 Hz (JT65A), 0,37 s par symbole, 47 s d'émission par minute.","l":"Une échelle de petits traits sur environ 180 Hz, avec un trait de synchro qui revient sans cesse au même endroit. Utilisé pour la réflexion sur la Lune (JT65B et C) et les signaux très faibles.","n":"extrait de 20 s (une émission dure 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA : réseau numérique professionnel","h":"Une modulation de phase π/4-DQPSK à 18 000 symboles par seconde, quatre voies partagées dans le temps, sur des canaux de 25 kHz.","l":"Un bloc plein aux flancs arrondis, présent en permanence près d'un relais ; un souffle rauque. Chiffré : on ne peut pas l'écouter (fiche 38).","n":"échelle réduite"},"ndb":{"nm":"Balise NDB","sh":"190–535 kHz","t":"Balise NDB : radiophare non directionnel","h":"Une porteuse fixe en grandes ondes, avec un indicatif Morse de deux ou trois lettres envoyé sur une tonalité (souvent 1020 Hz).","l":"Un trait fixe au centre et, pendant l'indicatif, deux petits traits de chaque côté. Entre 190 et 535 kHz environ, en BLU ou CW (fiche 10)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR : radiophare omnidirectionnel","h":"En AM, un signal à 30 Hz qui dépend de la direction, une sous-porteuse à 9960 Hz modulée en fréquence à 30 Hz (la référence), et l'indicatif Morse sur 1020 Hz.","l":"Dans le son démodulé : un ronflement grave à 30 Hz, un trait large vers 10 kHz qui ondule, et l'indicatif de temps en temps (fiche 15).","n":"son démodulé, échelle ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS : guidage à l'atterrissage (localizer)","h":"En AM, deux tonalités de 90 et 150 Hz ; leur rapport dit à l'avion s'il est à gauche ou à droite de l'axe. L'indicatif Morse commence par I.","l":"Dans le son démodulé : deux traits très bas, à 90 et 150 Hz, et l'indicatif sur 1020 Hz. Entre 108,1 et 112 MHz ; le glide est vers 330 MHz (fiche 15)."},"m10":{"nm":"Sondes M10 / M20","sh":"Meteomodem","t":"Radiosondes M10 et M20 (Meteomodem)","h":"Une trame par seconde, en FSK rapide (environ 9600 bauds) : plus large que la RS41. Elles sont lancées en France par Météo-France.","l":"Une salve large toutes les secondes, qui dérive lentement pendant le vol ; entre 400 et 406 MHz (fiche 18)."},"tpms":{"nm":"Pneus (TPMS)","sh":"433 MHz","t":"Capteurs de pression des pneus (TPMS)","h":"Chaque roue envoie de temps en temps une salve FSK de quelques millisecondes : pression, température, identifiant.","l":"Des petites salves isolées sur 433,92 MHz (ou 315 MHz), souvent par deux, au passage d'une voiture. Décodées par rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Signal horaire ALS162 (Allouis, 162 kHz)","h":"La porteuse des anciennes grandes ondes de France Inter ; l'heure est codée par de petites modulations de phase, inaudibles.","l":"Un trait fixe, très fort en France, à peine élargi au début de chaque seconde ; il faut un décodeur pour lire l'heure (fiche 10)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Signal horaire WWV (Colorado)","h":"En AM : un « tic » de 5 ms à 1000 Hz chaque seconde, une tonalité de 500 ou 600 Hz, un code horaire sur 100 Hz et une voix qui annonce l'heure UTC.","l":"Dans le son démodulé : un trait à 500 Hz coupé à chaque seconde, le tic à 1000 Hz, et le code tout en bas à 100 Hz (fiche 10)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Signal horaire MSF (Anthorn, 60 kHz)","h":"La porteuse est coupée au début de chaque seconde pendant 0,1, 0,2 ou 0,3 s selon les bits, et pendant 0,5 s pour marquer la minute.","l":"Un trait fixe avec des trous noirs complets chaque seconde, plus longs qu'avec DCF77 (fiche 10)."},"type2":{"nm":"Soleil type II","sh":"onde de choc","t":"Soleil : sursauts radio de type II","h":"L'onde de choc d'une éjection de masse coronale fait émettre le plasma de plus en plus bas, lentement, souvent en deux bandes (la fondamentale et son double).","l":"Deux bandes de bruit parallèles qui descendent doucement pendant plusieurs minutes. À comparer avec les sursauts de type III, beaucoup plus rapides.","n":"plusieurs minutes ramenées à 6 s"},"tweeks":{"nm":"Tweeks","sh":"VLF","t":"Tweeks : les « ping » de la nuit en VLF","h":"La nuit, le claquement d'un éclair lointain rebondit entre le sol et l'ionosphère ; les fréquences proches de la coupure (vers 1,7 kHz) arrivent en dernier.","l":"Un petit « ping » qui descend et s'arrête vers 1,7 kHz, avec parfois un écho au double ; des craquements partout. Sous 10 kHz, la nuit."},"hiss":{"nm":"Souffle VLF","sh":"hiss","t":"Souffle VLF (hiss)","h":"Un bruit large émis par les électrons de la plasmasphère, qui monte et descend avec l'activité magnétique.","l":"Une bande de souffle de quelques centaines de Hz à quelques kHz, sans motif, qui enfle et retombe lentement."},"aurora":{"nm":"Aurore radio","sh":"Au","t":"Propagation aurorale (Au)","h":"Une aurore boréale renvoie les ondes VHF, mais en les agitant très vite : chaque signal est étalé sur plusieurs centaines de Hz.","l":"La CW devient un souffle râpeux, comme chuchotée ; on n'entend plus de note. Sur 50 et 144 MHz, en visant le nord pendant les orages magnétiques."},"galactic":{"nm":"Bruit galactique","sh":"20–40 MHz","t":"Bruit de la Voie lactée","h":"Le centre de la galaxie émet un souffle radio que Karl Jansky a découvert en 1932 vers 20 MHz. Il monte et baisse au rythme de la rotation de la Terre.","l":"Un bruit de fond qui augmente lentement puis redescend, chaque jour environ 4 minutes plus tôt. Visible avec un simple dipôle entre 20 et 40 MHz.","n":"une journée ramenée à 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"Télémétrie de CubeSat","h":"Les petits satellites envoient régulièrement leurs mesures (batterie, températures) en FSK ou GMSK à 1200 ou 9600 bauds, vers 435–438 MHz.","l":"Des salves régulières qui glissent vers le bas d'une fois sur l'autre, par effet Doppler, pendant le passage (fiche 34).","n":"échelle réduite, passage accéléré"},"issfm":{"nm":"ISS en FM","sh":"145,800 MHz","t":"Station spatiale (ISS) : voix en FM","h":"Les astronautes parlent avec des écoles et des radioamateurs en FM sur 145,800 MHz. La station file à 28 000 km/h : la fréquence reçue baisse d'environ 3,5 kHz pendant le passage.","l":"Une bande de voix FM qui descend lentement de droite à gauche pendant les 10 minutes du passage (fiche 34).","n":"passage de 10 min ramené à 10 s"},"buzzer":{"nm":"UVB-76 « The Buzzer »","sh":"4625 kHz","t":"UVB-76, « The Buzzer » (4625 kHz)","h":"Une station militaire russe qui émet depuis des décennies un bourdonnement d'environ une seconde, répété environ 25 fois par minute, parfois interrompu par un message vocal.","l":"Une porteuse fixe et, à chaque bourdonnement, une colonne de raies serrées de haut en bas. Facile à trouver sur 4625 kHz en USB."},"pip":{"nm":"« The Pip »","sh":"3756 / 5448 kHz","t":"« The Pip » : bips sans fin","h":"Une autre balise militaire russe des ondes courtes, qui répète de petits bips brefs, jour et nuit, parfois interrompus par des messages.","l":"Un trait fixe découpé en pointillés très serrés ; à l'oreille, un pip-pip-pip rapide qui ne s'arrête jamais.","n":"rythme approché"},"squeaky":{"nm":"« Squeaky Wheel »","sh":"OC","t":"« Squeaky Wheel » : la roue qui grince","h":"Une balise militaire russe des ondes courtes, nommée par les écouteurs d'après son motif sonore répété.","l":"Un petit motif de deux sons, dont un qui monte, répété en boucle : comme une roue qui grince.","n":"imitation approchée"},"codar":{"nm":"CODAR","sh":"radar océan","t":"CODAR : radars des courants marins","h":"Des radars côtiers balaient une bande de fréquences, une ou deux fois par seconde, pour mesurer les courants et les vagues.","l":"Des diagonales parallèles régulières, et un « swish » répété ; vers 4,5–5,5 MHz, 13 MHz et 25 MHz, souvent jour et nuit.","n":"échelle réduite"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Modem militaire STANAG 4285","h":"Une modulation de phase 8-PSK à 2400 bauds sur une porteuse de 1800 Hz, avec une séquence de test toutes les 107 ms pour suivre le canal.","l":"Un bloc plein d'environ 3 kHz ; à l'oreille, un souffle avec un bourdonnement régulier (fiche 35 bis)."},"link11":{"nm":"Link-11","sh":"16 tons","t":"Link-11 : liaison de données navale","h":"Seize tonalités de 605 à 2915 Hz émises ensemble, chacune modulée en phase 75 fois par seconde.","l":"Un peigne de raies régulières sur 2,3 kHz, plus une raie un peu à l'écart ; à l'oreille, un ronflement musical (fiche 35 bis)."},"numbers":{"nm":"Station de nombres","sh":"voix","t":"Station de nombres","h":"À heure fixe, une petite mélodie d'appel, puis une voix (souvent synthétique) lit des groupes de cinq chiffres, en AM ou en BLU.","l":"La mélodie en notes isolées, puis des groupes de syllabes réguliers séparés par des silences (fiche 35 bis).","n":"voix imitée, sans vrais chiffres"}}},"en":{"ui":{"title":"Radio Mode Identifier","mystery":"Mystery sound","play":"▶ Listen","stop":"■ Stop","noise":"Noise","volume":"Volume","loop":"Loop","specwf":"Spectrum + Waterfall","cursor":"cursor","footprint":"Footprint","dur":"{s} s from top to bottom","avg":"average over the whole signal","press":"Press Listen: the signal scrolls here","count":"{n} signals, in the order of sheet 5 bis","myst":"Mystery mode","mystTags":"Listen and watch, then pick the right answer","quizH":"Which signal is this?","quizLead":"Start listening, watch the spectrum, the waterfall and the footprint, then answer.","score":"Score","good":"Correct!","bad":"Missed: it was {x}.","next":"Next mystery sound","principle":"Principle","screen":"On screen","sheet":"sheet","book":"Book: sheet {r}","lang":"Language","signals":"Signals","f1":"Signals simulated in the page (12,000 samples per second), based on the signals of sheet 5 bis of the OpenBookRadio book, plus Olivia, FT4 and Feld Hell (sheet 26). For radio signals (AM, FM, AIS, LoRa…), you see the simulated intermediate frequency, as on an SDR screen; some are scaled down or sped up, as stated.","f2":"Time runs downwards in the waterfall and the footprint. CC BY-NC-SA 4.0 license, free, not for sale.","night":"Night mode","day":"Day mode"},"groups":["Analogue voice","Telegraphy","Data","Images","Aviation, maritime and rescue","Calling, sub-tones and paging","Radiosondes, sensors and connected devices","HF modes and curiosities","Broadcast and time","Wideband","Bonus: sounds from space","Bonus: shortwave curiosities"],"modes":{"am":{"sh":"voice","t":"AM: amplitude modulation","h":"The strength of the carrier follows the sound: the curve \"swells\" and \"shrinks\".","l":"A fixed line in the centre (the carrier), with two identical sidebands on each side. About 6 to 9 kHz wide. Shortwave and medium-wave broadcasting, aviation (sheets 10 and 12)."},"ssb":{"nm":"SSB","t":"SSB: single sideband","h":"Only one sideband remains, without carrier: nothing when nobody speaks.","l":"No central line, a single band about 2.7 kHz wide that only lives while someone talks. USB above 10 MHz, LSB below (radio amateurs). Badly tuned, the voice sounds like a \"duck\" (sheets 9 and 26)."},"fm":{"sh":"voice","t":"FM: frequency modulation","h":"The amplitude stays fixed; the oscillations get closer or wider apart with the sound.","l":"The signal dances around its frequency, wider when the sound is loud: 12.5 kHz per channel in narrow FM (walkie-talkies, repeaters), 200 kHz for FM broadcasting (sheets 2 and 11)."},"cw":{"t":"CW: Morse","h":"The carrier is switched on and off: dashes and dots.","l":"A very thin line that breaks to the rhythm of Morse; a beep to the ear. Here \"CQ\" (sheet 39).","r":[["Speed","20 words/min, 60 ms dot, at 700 Hz: \"CQ CQ CQ DE F4ABC K\""],["By ear","Pure beeps, long and short, on a single note"],["Decoding","By ear, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: two frequencies","h":"The frequency jumps between two values, one for 0, one for 1.","l":"Two parallel lines: 170 Hz apart for radio amateurs (45.45 baud), 450 or 850 Hz for weather bulletins. A steady \"tidilidi\" (sheet 27).","r":[["Code","Baudot ITA2: 5 bits + start + 1.5 stop; mark 2125 Hz, space 2295 Hz"],["Text","RYRYRYRY CQ CQ DE F4ABC"],["Decoding","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 baud: APRS and packet","h":"Two audio tones, 1200 and 2200 Hz, sent into an FM transmitter.","l":"Seen after the FM receiver (loudspeaker sound): a band from 1200 to 2200 Hz, in short bursts. By ear, a one-second \"grrrt\" (sheets 29 and 30).","r":[["Frequency","144.800 MHz in Europe (APRS), FM"],["Frame","0x7E flags then AX.25 data in NRZI"],["Decoding","Direwolf, multimon-ng, KISS TNC"]]},"psk31":{"t":"PSK31: phase modulation","h":"The frequency does not move, the phase reverses; the amplitude dips at each reversal.","l":"A very thin line about 60 Hz wide, slightly \"braided\". Dozens of stations fit in 3 kHz (sheet 26).","r":[["Code","Varicode: 0 = phase reversal, 1 = no change; when idle, two twin lines"],["Where to hear it","14,070 kHz, 3,580 kHz"],["Decoding","fldigi"]]},"ft8":{"t":"MFSK / FT8: eight tones","h":"The frequency goes up and down in steps of 6.25 Hz, 0.16 s per step.","l":"Bands about 50 Hz wide lasting 12.6 s and coming back every 15 s, synchronised to the clock: several stations at once within 3 kHz, for example on 7.074 MHz (sheet 26).","r":[["Frame","79 symbols of 0.16 s, three Costas patterns (start, middle, end); here eight stations"],["Frequencies","14,074, 7,074, 3,573, 10,136, 21,074, 28,074 kHz"],["Decoding","WSJT-X, JTDX (exact PC clock)"]]},"ft4":{"t":"FT4: the contest FT8","h":"Four tones spaced 20.8 Hz, 20.8 baud: 105 symbols in 5 s, in 7.5 s time slots.","l":"Bands about 90 Hz wide, shorter and wider than FT8, coming back every 7.5 s. 14,080, 7,047.5 kHz (sheet 26)."},"olivia":{"t":"Olivia 8/250: eight tones","h":"Eight tones spaced 31.25 Hz, one at a time, jumping at random; Walsh coding and interleaving.","l":"A block of scattered dots over 250 Hz; decodes far below the noise. A small random melody to the ear (sheet 26)."},"hell":{"t":"Feld Hell: writing with a carrier","h":"The carrier is switched on and off dot by dot: each letter is made of columns of 14 dots, scanned from bottom to top (245 dots per second).","l":"On the waterfall, a chopped line; the software screen (fldigi) redraws the letters. A soft crackle to the ear (sheet 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Four frequency levels: each symbol carries two bits.","l":"A rectangular block 6 to 12.5 kHz wide, full like noise, often in bursts (DMR splits the channel into two time slots). A hoarse \"frrr\" to the ear (sheet 38)."},"mt63":{"t":"MT63: emergency messages (NBEMS)","h":"64 tones at once, each slowly modulated, with lots of redundancy.","l":"A flat block of 1 or 2 kHz centred on 1500 Hz, with sharp edges; a steady hiss. Even works through a microphone held to a loudspeaker (sheet 26 ter)."},"lora":{"t":"LoRa: frequency ramps (chirps)","h":"The frequency sweeps the whole width, then starts again from the bottom: the position of the jump carries the data.","l":"Parallel diagonals, easy to recognise: Meshtastic and MeshCore on 869.525 MHz or 433 MHz, LoRaWAN sensors (sheets 11, 20 and 21)."},"sstv":{"t":"SSTV: pictures in audio","h":"A sync pulse at 1200 Hz, then the frequency follows the brightness of the line, from 1500 (black) to 2300 Hz (white).","l":"Regular sync lines and a cloud that changes with the picture; a \"chirping\" sound for one to two minutes. 14.230 MHz, ISS on 145.800 MHz (sheet 31).","r":[["Frame","VIS header, then lines: 1200 Hz sync, green, blue, red; here 20 lines of a test pattern"],["Decoding","QSSTV, MMSSTV, Robot36 on a smartphone"]]},"fax":{"nm":"Weather fax","t":"Weather fax: 1500 Hz black, 2300 Hz white","h":"The frequency moves continuously from black to white, 120 lines per minute.","l":"Two fixed bands at 1500 and 2300 Hz (800 Hz apart), a steady \"tick-tock\". Published frequencies are carrier frequencies: listen in USB 1.9 kHz lower (sheet 32).","r":[["Frame","300 Hz start tone, phasing lines (white pulse), then the chart"],["Decoding","fldigi, JWX, HamFax"]]},"elt":{"nm":"ELT siren","t":"ELT / PLB siren on 121.5 MHz","h":"An AM signal whose tone falls from 1600 to 300 Hz, two to four times per second.","l":"A fixed carrier and sidebands sliding like a fan: the \"woo-woo\" of distress beacons, also on 121.375 MHz for exercises (sheets 24 and 25)."},"406":{"nm":"406 beacon","t":"406 MHz beacon: BPSK burst","h":"Half a second of transmission: 160 ms of pure carrier, then the phase swings by ±1.1 radian at 400 bit/s.","l":"A short little line coming back every 50 s, between 406.0 and 406.1 MHz; nothing useful to hear, a decoder is needed (EPIRB 406, sheet 25)."},"adsb":{"t":"ADS-B / Mode S (1090 MHz): pulses","h":"0.5 µs pulses whose position carries the bits (PPM); here the time scale is greatly slowed down.","l":"Very short horizontal lines across the whole width, hundreds per second near an airport; an SDR dongle is needed (sheet 13).","n":"time scale greatly slowed down"},"acars":{"t":"ACARS: AM and MSK data","h":"An AM signal carrying two tones, 1200 and 2400 Hz, at 2400 bit/s.","l":"Half-second bursts with carrier and sidebands, on 131.525, 131.725 or 131.825 MHz in Europe: a \"brrrt\" to the ear (sheet 14)."},"ais":{"t":"AIS: GMSK 9600 baud on two channels","h":"A smoothed FSK (GMSK) in 26 ms bursts, once on 161.975 MHz, once on 162.025 MHz (reduced scale).","l":"Two columns of short little lines, 50 kHz apart, a regular clicking; the more ships, the denser it gets (sheet 16).","n":"reduced scale"},"navtex":{"t":"NAVTEX and DSC on medium and short waves: 170 Hz FSK","h":"Like RTTY: two frequencies 170 Hz apart, but at 100 baud.","l":"Two parallel lines, continuous during the bulletin, on 518 and 490 kHz (NAVTEX) or 2187.5 kHz (digital selective calling) (sheet 17).","r":[["Code","SITOR-B, CCIR 476: 7 bits with four \"1\"s, with FEC repetition"],["Decoding","fldigi, YaND"]]},"hfdl":{"t":"HFDL: aircraft on shortwave","h":"A 1800 baud PSK on a 1440 Hz subcarrier.","l":"Bursts about 2.4 kHz wide between 2.9 and 22 MHz; a modem hiss that comes and goes (sheet 14 bis)."},"ctcss":{"t":"CTCSS: a sub-tone under the voice","h":"A low continuous tone (67 to 254 Hz, here 88.5 Hz) added to the voice.","l":"Seen in the FM receiver audio: a fixed line at the very bottom, under the voice; it opens the squelch of repeaters and walkie-talkies (sheet 8)."},"dtmf":{"sh":"2 tones","t":"DTMF: two tones per key","h":"Each keypad key sends a low tone (697 to 941 Hz) and a high one (1209 to 1633 Hz) at the same time.","l":"Pairs of dots aligned on eight fixed columns; the \"beep-beep\" of phone numbers and repeater commands (sheet 8).","r":[["Sequence","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tones","t":"CCIR Selcall: tones in sequence","h":"Five 100 ms tones one after the other, one per digit.","l":"A small staircase of dots, repeated; a quick \"tululululu\" to call one specific radio (sheet 28).","r":[["Sequence","1 2 3 4 5, twice; also decoded by the SelCall app of the UV-K1"]]},"pocsag":{"sh":"pagers","t":"POCSAG and FLEX: pagers","h":"An FSK at ±4.5 kHz; a 1010… preamble then the data (reduced scale).","l":"Two clean lines during the preamble, then a full band; a shrill \"brrrrt\". 466.075 MHz, DAPNET 439.9875 MHz (sheet 37).","n":"reduced scale"},"ale":{"sh":"8 tones","t":"ALE: automatic link establishment on shortwave","h":"Eight tones from 750 to 2500 Hz, 125 baud, in bursts.","l":"A block about 2 kHz wide made of small dots, one to two seconds, sometimes on several nearby frequencies; a high-pitched twitter (sheet 28 bis)."},"rs41":{"nm":"RS41 radiosonde","t":"RS41 radiosonde: continuous GFSK","h":"A smoothed FSK at 4800 baud, non-stop; the frequency drifts slowly as the sonde rises and cools down.","l":"A band about 10 kHz wide that slides at an angle during the whole flight, between 400 and 406 MHz (sheet 18)."},"ook":{"nm":"433 sensors","t":"433 MHz sensors: OOK","h":"The carrier switches on and off in short or long pulses (on-off keying); the message is repeated three times.","l":"Bursts of small dots, often in threes, on 433.92 MHz: weather stations, temperature probes, remote controls (sheet 19)."},"fhss":{"t":"Bluetooth: frequency hopping (FHSS)","h":"The frequency changes 1600 times per second among 79 channels (reduced scale).","l":"Small lines scattered everywhere over 80 MHz, never in the same place, around 2.4 GHz (sheet 22).","n":"reduced scale"},"wspr":{"t":"WSPR: propagation beacons","h":"Four tones spaced 1.46 Hz, 0.68 s per symbol, for 110.6 s.","l":"A very thin line about 6 Hz wide lasting almost two minutes, every even two minutes: you have to zoom in a lot (sheet 26).","n":"24 s excerpt (a transmission lasts 110.6 s)"},"qrss":{"t":"QRSS: very slow Morse","h":"A carrier switched on and off, with dots of 3 to 10 s, often on two nearby frequencies (DFCW).","l":"Lines a few Hz wide, read on a ten-minute screen; inaudible to the ear (sheet 26 bis).","n":"sped up: 0.6 s dot instead of 3 to 10 s"},"texte":{"nm":"Text in the waterfall","t":"Text in the waterfall","h":"Each line of a picture becomes a group of tones: the sound is like noise.","l":"The text or drawing appears directly on the SDR screen (sheet 33).","r":[["Note","Sent from the bottom of the picture: upright on the live waterfall, upside down in the footprint (read from top to bottom)"]]},"vara":{"t":"Modern HF data: VARA, Pactor, ARDOP","h":"Long full bursts (OFDM or PSK) and, in between, short replies from the other station.","l":"A rectangle about 2.4 kHz wide that stops and starts again, with a small acknowledgement in between; a chopped hiss (sheet 26)."},"chirp":{"nm":"Ionospheric sounder","t":"Ionospheric sounder (chirp sounder)","h":"A slow frequency ramp crossing the whole HF band; echoes from the ionosphere arrive a little later.","l":"A diagonal sweeping the screen, doubled by parallel lines (the echoes); a \"ffweet\" that passes in a fraction of a second."},"oth":{"nm":"Over-the-horizon radar","t":"Over-the-horizon radar (\"woodpecker\")","h":"Pulses repeated 10 to 50 times per second, each several kHz wide.","l":"A wide striped block covering whole bands; a very regular woodpecker knocking on shortwave."},"parasites":{"nm":"Interference","sh":"power supply","t":"Interference from a switching power supply","h":"A square wave: its frequency and all its harmonics come out at the same time.","l":"A comb of regular lines drifting together, on a noise background: look for it with NOISE FIND or a portable receiver (sheet K21b)."},"mpx":{"nm":"FM stereo and RDS","t":"FM stereo radio and RDS","h":"The demodulated sound (multiplex) contains the L+R channel, a 19 kHz pilot, the L-R channel around 38 kHz and RDS at 57 kHz.","l":"Seen from 0 to 60 kHz after demodulation: a low block, a thin line at 19 kHz, a weaker block in the middle and RDS at the very top (sheet 10).","n":"scale ÷ 20 for listening"},"dcf77":{"t":"DCF77 time signal (77.5 kHz)","h":"A carrier dropping to 15 % for 0.1 s (bit 0) or 0.2 s (bit 1), at the start of each second.","l":"A fixed line with a black gap every second; the 59th second has none, to mark the minute (sheet 10).","r":[["Note","Here the carrier is brought down to 1000 Hz; the 6th second has no gap, like the 59th second of each minute"]]},"ofdm":{"t":"OFDM: dozens of subcarriers","h":"Many tightly packed carriers, each slow: the sum looks like noise.","l":"A flat rectangle with sharp edges, always there: DRM on shortwave (10 kHz), DAB+ (1.5 MHz), DVB-T, Wi-Fi. A continuous hiss to the ear (sheets 10 and 22)."},"dsss":{"t":"Spread spectrum (DSSS): GPS, Wi-Fi 802.11b","h":"The data are mixed with a very fast code: the energy is spread over a wide band.","l":"A wide hump, barely above the noise; GPS is even below the noise and cannot be seen without processing (sheets 22 and 23)."},"hline":{"nm":"Hydrogen line","sh":"1420 MHz","t":"21 cm hydrogen line (1420.405 MHz)","h":"Cold hydrogen in the Milky Way emits a very faint hiss on 1420.405 MHz. The motion of the galaxy's arms shifts it by the Doppler effect: you see several small humps.","l":"Almost nothing in the waterfall from one second to the next: you have to average for a long time to see the humps rise out of the noise. Here, look at the average spectrum when stopped. A dish or a horn, a preamp and an SDR dongle are enough.","n":"signal greatly exaggerated"},"sun":{"nm":"Sun","sh":"bursts","t":"Sun: type III radio bursts","h":"Electrons thrown out by a flare cross the Sun's corona and make it emit at lower and lower frequencies as they move away.","l":"Lines falling diagonally from the top to the bottom of the spectrum in less than a second, over a background of solar noise; a swelling \"shhhh\". From about 10 to 400 MHz, also on shortwave around 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter: decametric bursts (L and S)","h":"Jupiter's magnetic field and its moon Io produce powerful emissions between 15 and 40 MHz: slow L bursts and very short S bursts that slide down fast.","l":"First waves of hiss (L, like surf on a beach), then trains of little \"pops\" (S) in tight diagonals. Around 20.1 MHz at night, with a simple dipole, when Io is well placed."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"A spinning neutron star sweeps the Earth with a radio beam, here every 0.714 s. Interstellar gas delays the low frequencies: each pulse arrives first at the top of the spectrum.","l":"A regular \"tick\"; in the waterfall each pulse is a curve sloping down (dispersion). The real signal is below the noise: you need a big antenna and must add up the pulses over their period.","n":"signal greatly exaggerated"},"meteor":{"nm":"Meteors","sh":"GRAVES","t":"Meteor echoes from the GRAVES radar (143.050 MHz)","h":"The French GRAVES radar transmits non-stop on 143.050 MHz. When a shooting star ionises the air, its trail reflects a little of that signal to your receiver, for a fraction of a second to a few seconds.","l":"In USB on 143.049 MHz: short \"pings\" around 1000 Hz, sometimes an echo that slides (the meteor head, Doppler effect) or one that lasts. Far more during showers (Perseids, Geminids) (sheet 1)."},"whistler":{"nm":"Whistlers","sh":"VLF","t":"VLF whistlers","h":"Lightning makes a radio click; part of it follows the Earth's magnetic field lines to the other hemisphere and back, high notes first.","l":"A \"pyooo\" falling from high to low in one or two seconds, right after a click; crackles (sferics) everywhere. Below 10 kHz, with a VLF receiver far from power lines."},"chorus":{"nm":"Dawn chorus","sh":"VLF","t":"Dawn chorus","h":"During a magnetic storm, electrons trapped in the magnetosphere emit small rising notes, mostly around sunrise.","l":"Overlapping rising chirps, like birds, from about 1 to 4 kHz. Same equipment as for whistlers."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"The first artificial satellite sent beeps of about 0.3 s on 20.005 and 40.002 MHz, alternately, for three weeks.","l":"A regularly broken line: \"beep… beep…\", the sound the whole world listened to in October 1957 (reconstruction)."},"doppler":{"nm":"Doppler effect","sh":"satellite","t":"Satellite beacon and Doppler effect","h":"A low-orbit satellite comes closer then moves away: the received frequency falls during the pass, by about ±3 kHz at 145 MHz and ±10 kHz at 435 MHz.","l":"A line falling in an S shape: slowly at first, fast when the satellite is closest, then slowly again (sheet 34).","n":"10 min pass squeezed into 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA satellites: APT images (historical)","h":"A 2400 Hz subcarrier amplitude-modulated by the picture, two lines per second, with a sync pulse at the start of each line. Stopped in 2025; Meteor-M satellites now transmit LRPT.","l":"A line at 2400 Hz with sidebands that change with the picture, and the famous \"tick-tock\" twice a second (sheet 34)."},"eme":{"nm":"Moon echo","sh":"EME","t":"Moon echo (EME)","h":"A signal sent to the Moon comes back about 2.5 s later, hugely weakened, slightly smeared and shifted by Doppler.","l":"You hear your own \"beep\", then its faint, slightly blurred echo 2.5 s later. Radio amateurs do it in CW or JT65, on 144 MHz and above (sheet 1).","n":"echo greatly exaggerated"},"msk144":{"nm":"MSK144","sh":"meteors","t":"MSK144: the meteor-scatter digital mode","h":"Two tones, 1000 and 2000 Hz, at 2000 baud, in 72 ms frames repeated non-stop: each meteor trail lets a few of them through.","l":"Bursts of 0.1 to 1 s, about 2.4 kHz wide, that appear and fade with the meteor's \"ping\". On 50 and 144 MHz, with WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tones","t":"JT65: 65 tones, very slow","h":"One sync tone and 64 data tones spaced 2.7 Hz (JT65A), 0.37 s per symbol, 47 s of transmission per minute.","l":"A ladder of small lines over about 180 Hz, with a sync line that keeps returning to the same place. Used for Moon bounce (JT65B and C) and very weak signals.","n":"20 s excerpt (a transmission lasts 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: professional digital network","h":"π/4-DQPSK phase modulation at 18,000 symbols per second, four time-shared channels, in 25 kHz channels.","l":"A full block with rounded edges, always there near a base station; a hoarse hiss. Encrypted: you cannot listen to it (sheet 38).","n":"reduced scale"},"ndb":{"nm":"NDB beacon","sh":"190–535 kHz","t":"NDB: non-directional beacon","h":"A fixed carrier on long wave, with a two- or three-letter Morse identifier sent on a tone (often 1020 Hz).","l":"A fixed line in the centre and, during the identifier, two small lines on either side. Roughly 190 to 535 kHz, in SSB or CW (sheet 10)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: omnidirectional radio range","h":"In AM: a 30 Hz signal that depends on direction, a 9960 Hz subcarrier frequency-modulated at 30 Hz (the reference), and the Morse identifier on 1020 Hz.","l":"In the demodulated sound: a low 30 Hz hum, a wide wavy line near 10 kHz, and the identifier now and then (sheet 15).","n":"demodulated sound, scale ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: landing guidance (localizer)","h":"In AM, two tones of 90 and 150 Hz; their ratio tells the aircraft whether it is left or right of the centreline. The Morse identifier starts with I.","l":"In the demodulated sound: two very low lines at 90 and 150 Hz, and the identifier on 1020 Hz. Between 108.1 and 112 MHz; the glide slope is around 330 MHz (sheet 15)."},"m10":{"nm":"M10 / M20 sondes","sh":"Meteomodem","t":"M10 and M20 radiosondes (Meteomodem)","h":"One frame per second, in fast FSK (about 9600 baud): wider than the RS41. Launched in France by Météo-France.","l":"A wide burst every second that drifts slowly during the flight; between 400 and 406 MHz (sheet 18)."},"tpms":{"nm":"Tyres (TPMS)","sh":"433 MHz","t":"Tyre pressure sensors (TPMS)","h":"Each wheel now and then sends an FSK burst of a few milliseconds: pressure, temperature, identifier.","l":"Small isolated bursts on 433.92 MHz (or 315 MHz), often in pairs, as a car passes. Decoded by rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"ALS162 time signal (Allouis, 162 kHz)","h":"The carrier of France Inter's former long-wave service; the time is coded by small, inaudible phase modulations.","l":"A fixed line, very strong in France, barely widened at the start of each second; a decoder is needed to read the time (sheet 10)."},"wwv":{"nm":"WWV","sh":"2.5–20 MHz","t":"WWV time signal (Colorado)","h":"In AM: a 5 ms \"tick\" at 1000 Hz every second, a 500 or 600 Hz tone, a time code on 100 Hz and a voice announcing UTC.","l":"In the demodulated sound: a 500 Hz line broken every second, the 1000 Hz tick, and the code at the very bottom on 100 Hz (sheet 10)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"MSF time signal (Anthorn, 60 kHz)","h":"The carrier is switched off at the start of each second for 0.1, 0.2 or 0.3 s depending on the bits, and for 0.5 s to mark the minute.","l":"A fixed line with complete black gaps every second, longer than with DCF77 (sheet 10)."},"type2":{"nm":"Sun type II","sh":"shock wave","t":"Sun: type II radio bursts","h":"The shock wave of a coronal mass ejection makes the plasma emit lower and lower, slowly, often in two bands (the fundamental and its double).","l":"Two parallel noise bands drifting down gently for several minutes. Compare with type III bursts, which are much faster.","n":"several minutes squeezed into 6 s"},"tweeks":{"nm":"Tweeks","sh":"VLF","t":"Tweeks: the night-time VLF \"pings\"","h":"At night, the click of distant lightning bounces between the ground and the ionosphere; frequencies near the cut-off (around 1.7 kHz) arrive last.","l":"A small \"ping\" that falls and stops around 1.7 kHz, sometimes with an echo at double frequency; crackles everywhere. Below 10 kHz, at night."},"hiss":{"nm":"VLF hiss","sh":"hiss","t":"VLF hiss","h":"Wideband noise produced by electrons in the plasmasphere, rising and falling with magnetic activity.","l":"A band of hiss from a few hundred Hz to a few kHz, with no pattern, slowly swelling and fading."},"aurora":{"nm":"Radio aurora","sh":"Au","t":"Auroral propagation (Au)","h":"The aurora reflects VHF waves but shakes them very fast: each signal is spread over several hundred Hz.","l":"CW turns into a raspy hiss, as if whispered; you no longer hear a note. On 50 and 144 MHz, beaming north during magnetic storms."},"galactic":{"nm":"Galactic noise","sh":"20–40 MHz","t":"Noise from the Milky Way","h":"The centre of the galaxy emits a radio hiss that Karl Jansky discovered in 1932 around 20 MHz. It rises and falls as the Earth turns.","l":"A background noise that slowly rises then falls again, about 4 minutes earlier each day. Visible with a simple dipole between 20 and 40 MHz.","n":"one day squeezed into 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"CubeSat telemetry","h":"Small satellites regularly send their measurements (battery, temperatures) in FSK or GMSK at 1200 or 9600 baud, around 435–438 MHz.","l":"Regular bursts sliding lower each time, by the Doppler effect, during the pass (sheet 34).","n":"reduced scale, pass sped up"},"issfm":{"nm":"ISS on FM","sh":"145.800 MHz","t":"Space station (ISS): FM voice","h":"Astronauts talk with schools and radio amateurs in FM on 145.800 MHz. The station flies at 28,000 km/h: the received frequency falls by about 3.5 kHz during the pass.","l":"A band of FM voice slowly moving from right to left during the 10-minute pass (sheet 34).","n":"10 min pass squeezed into 10 s"},"buzzer":{"nm":"UVB-76 \"The Buzzer\"","sh":"4625 kHz","t":"UVB-76, \"The Buzzer\" (4625 kHz)","h":"A Russian military station that has sent, for decades, a buzz of about one second repeated about 25 times a minute, sometimes interrupted by a voice message.","l":"A fixed carrier and, at each buzz, a column of tight lines from top to bottom. Easy to find on 4625 kHz in USB."},"pip":{"nm":"\"The Pip\"","sh":"3756 / 5448 kHz","t":"\"The Pip\": endless beeps","h":"Another Russian military shortwave beacon, repeating short little beeps day and night, sometimes interrupted by messages.","l":"A fixed line cut into very tight dots; to the ear, a fast pip-pip-pip that never stops.","n":"approximate rhythm"},"squeaky":{"nm":"\"Squeaky Wheel\"","sh":"HF","t":"\"Squeaky Wheel\"","h":"A Russian military shortwave beacon, named by listeners after its repeated sound pattern.","l":"A small pattern of two sounds, one of them rising, repeated in a loop: like a squeaking wheel.","n":"approximate imitation"},"codar":{"nm":"CODAR","sh":"ocean radar","t":"CODAR: ocean current radars","h":"Coastal radars sweep a band of frequencies once or twice a second to measure currents and waves.","l":"Regular parallel diagonals and a repeated \"swish\"; around 4.5–5.5 MHz, 13 MHz and 25 MHz, often day and night.","n":"reduced scale"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"STANAG 4285 military modem","h":"8-PSK phase modulation at 2400 baud on an 1800 Hz carrier, with a probe sequence every 107 ms to track the channel.","l":"A full block about 3 kHz wide; to the ear, a hiss with a regular buzz (sheet 35 bis)."},"link11":{"nm":"Link-11","sh":"16 tones","t":"Link-11: naval data link","h":"Sixteen tones from 605 to 2915 Hz sent together, each phase-modulated 75 times per second.","l":"A comb of regular lines over 2.3 kHz, plus one line a little apart; to the ear, a musical drone (sheet 35 bis)."},"numbers":{"nm":"Numbers station","sh":"voice","t":"Numbers station","h":"At a fixed time, a short call melody, then a voice (often synthetic) reads groups of five digits, in AM or SSB.","l":"The melody as separate notes, then regular groups of syllables separated by silences (sheet 35 bis).","n":"imitated voice, no real digits"}}},"es":{"ui":{"title":"Identificador de modos de radio","mystery":"Sonido misterioso","play":"▶ Escuchar","stop":"■ Parar","noise":"Ruido","volume":"Volumen","loop":"En bucle","specwf":"Espectro + Cascada","cursor":"cursor","footprint":"Huella","dur":"{s} s de arriba abajo","avg":"media de toda la señal","press":"Pulsa Escuchar: la señal se desplaza aquí","count":"{n} señales, en el orden de la ficha 5 bis","myst":"Modo misterioso","mystTags":"Escucha y observa, luego elige la respuesta correcta","quizH":"¿Qué señal es?","quizLead":"Pon la escucha, observa el espectro, la cascada y la huella, y responde.","score":"Puntuación","good":"¡Correcto!","bad":"Fallo: era {x}.","next":"Siguiente sonido misterioso","principle":"Principio","screen":"En pantalla","sheet":"ficha","book":"Libro: ficha {r}","lang":"Idioma","signals":"Señales","f1":"Señales simuladas en la página (12 000 muestras por segundo), según las señales de la ficha 5 bis del libro OpenBookRadio, más Olivia, FT4 y Feld Hell (ficha 26). Para las señales de radio (AM, FM, AIS, LoRa…) se ve la frecuencia intermedia simulada, como en la pantalla de un SDR; algunas están a escala reducida o acelerada, y se indica.","f2":"El tiempo baja en la cascada y en la huella. Licencia CC BY-NC-SA 4.0, gratis, prohibida la venta.","night":"Modo noche","day":"Modo día"},"groups":["Voz analógica","Telegrafía","Datos","Imágenes","Aviación, marina y rescate","Llamada, subtonos y mensajería","Radiosondas, sensores y objetos conectados","Modos HF y curiosidades","Radiodifusión y hora","Banda ancha","Bonus: sonidos del espacio","Bonus: curiosidades de onda corta"],"modes":{"am":{"sh":"voz","t":"AM: modulación de amplitud","h":"La fuerza de la portadora sigue al sonido: la curva se «hincha» y se «deshincha».","l":"Una raya fija en el centro (la portadora), con dos bandas laterales idénticas a cada lado. Unos 6 a 9 kHz de ancho. Radio en onda corta y onda media, aviación (fichas 10 y 12)."},"ssb":{"t":"BLU / SSB: banda lateral única","h":"Solo queda una banda lateral, sin portadora: nada cuando nadie habla.","l":"Sin raya central, una sola banda de unos 2,7 kHz que solo vive cuando se habla. USB por encima de 10 MHz, LSB por debajo (radioaficionados). Mal sintonizada, la voz suena a «pato» (fichas 9 y 26)."},"fm":{"sh":"voz","t":"FM: modulación de frecuencia","h":"La amplitud se mantiene fija; las oscilaciones se juntan o se separan con el sonido.","l":"La señal baila alrededor de su frecuencia, más ancha cuando el sonido es fuerte: 12,5 kHz por canal en FM estrecha (walkies, repetidores), 200 kHz en radio FM (fichas 2 y 11)."},"cw":{"t":"CW: Morse","h":"La portadora se enciende y se apaga: rayas y puntos.","l":"Una raya muy fina que se corta al ritmo del Morse; un pitido al oído. Aquí «CQ» (ficha 39).","r":[["Velocidad","20 palabras/min, punto de 60 ms, a 700 Hz: «CQ CQ CQ DE F4ABC K»"],["Al oído","Pitidos puros, largos y cortos, de una sola nota"],["Decodificación","De oído, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: dos frecuencias","h":"La frecuencia salta entre dos valores, uno para 0 y otro para 1.","l":"Dos rayas paralelas: 170 Hz de separación entre radioaficionados (45,45 baudios), 450 u 850 Hz para los boletines meteorológicos. Un «tidilidi» regular (ficha 27).","r":[["Código","Baudot ITA2: 5 bits + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Texto","RYRYRYRY CQ CQ DE F4ABC"],["Decodificación","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 baudios: APRS y packet","h":"Dos tonos de audio, 1200 y 2200 Hz, enviados a un transmisor FM.","l":"Vista tras el receptor FM (sonido del altavoz): una banda de 1200 a 2200 Hz, en ráfagas cortas. Al oído, un «grrrt» de un segundo (fichas 29 y 30).","r":[["Frecuencia","144,800 MHz en Europa (APRS), FM"],["Trama","Banderas 0x7E y datos AX.25 en NRZI"],["Decodificación","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"t":"PSK31: modulación de fase","h":"La frecuencia no se mueve, es la fase la que se invierte; la amplitud baja en cada inversión.","l":"Una raya muy fina de unos 60 Hz, algo «trenzada». Decenas de estaciones caben en 3 kHz (ficha 26).","r":[["Código","Varicode: 0 = inversión de fase, 1 = sin cambio; en reposo, dos rayas gemelas"],["Dónde oírla","14 070 kHz, 3580 kHz"],["Decodificación","fldigi"]]},"ft8":{"t":"MFSK / FT8: ocho tonos","h":"La frecuencia sube y baja en escalones de 6,25 Hz, 0,16 s por escalón.","l":"Bandas de unos 50 Hz que duran 12,6 s y vuelven cada 15 s, sincronizadas con la hora: varias estaciones a la vez en 3 kHz, por ejemplo en 7,074 MHz (ficha 26).","r":[["Trama","79 símbolos de 0,16 s, tres patrones Costas (inicio, centro, final); aquí ocho estaciones"],["Frecuencias","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Decodificación","WSJT-X, JTDX (hora del PC exacta)"]]},"ft4":{"t":"FT4: el FT8 de los concursos","h":"Cuatro tonos separados 20,8 Hz, 20,8 baudios: 105 símbolos en 5 s, en turnos de 7,5 s.","l":"Bandas de unos 90 Hz, más cortas y anchas que el FT8, que vuelven cada 7,5 s. 14 080, 7047,5 kHz (ficha 26)."},"olivia":{"t":"Olivia 8/250: ocho tonos","h":"Ocho tonos separados 31,25 Hz, uno cada vez, que saltan al azar; codificación Walsh y entrelazado.","l":"Un bloque de puntos dispersos sobre 250 Hz; decodifica muy por debajo del ruido. Una pequeña melodía aleatoria al oído (ficha 26)."},"hell":{"t":"Feld Hell: escribir con una portadora","h":"La portadora se enciende y se apaga punto a punto: cada letra son columnas de 14 puntos, barridas de abajo arriba (245 puntos por segundo).","l":"En la cascada, una raya entrecortada; la pantalla del programa (fldigi) redibuja las letras. Un crepitar suave al oído (ficha 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Cuatro niveles de frecuencia: cada símbolo lleva dos bits.","l":"Un bloque rectangular de 6 a 12,5 kHz, lleno como el ruido, a menudo en ráfagas (el DMR reparte el canal en dos intervalos). Un «frrr» ronco al oído (ficha 38)."},"mt63":{"t":"MT63: mensajes de emergencia (NBEMS)","h":"64 tonos a la vez, cada uno modulado lentamente, con mucha redundancia.","l":"Un bloque plano de 1 o 2 kHz centrado en 1500 Hz, de bordes nítidos; un soplido regular. Pasa incluso por un micrófono pegado a un altavoz (ficha 26 ter)."},"lora":{"t":"LoRa: rampas de frecuencia (chirps)","h":"La frecuencia barre todo el ancho y vuelve a empezar desde abajo: la posición del salto lleva los datos.","l":"Diagonales paralelas, fáciles de reconocer: Meshtastic y MeshCore en 869,525 MHz o 433 MHz, sensores LoRaWAN (fichas 11, 20 y 21)."},"sstv":{"t":"SSTV: imágenes en audio","h":"Un pulso de sincronía a 1200 Hz y luego la frecuencia sigue el brillo de la línea, de 1500 (negro) a 2300 Hz (blanco).","l":"Rayas de sincronía regulares y una nube que cambia con la imagen; un sonido que «gorjea» durante uno o dos minutos. 14,230 MHz, ISS en 145,800 MHz (ficha 31).","r":[["Trama","Cabecera VIS y luego líneas: sincronía 1200 Hz, verde, azul, rojo; aquí 20 líneas de una carta de ajuste"],["Decodificación","QSSTV, MMSSTV, Robot36 en el móvil"]]},"fax":{"nm":"Fax meteorológico","t":"Fax meteorológico: 1500 Hz negro, 2300 Hz blanco","h":"La frecuencia pasa del negro al blanco de forma continua, 120 líneas por minuto.","l":"Dos bandas fijas en 1500 y 2300 Hz (800 Hz de separación), un «tic-tac» regular. Las frecuencias publicadas son las de la portadora: escucha en USB 1,9 kHz más abajo (ficha 32).","r":[["Trama","Tono de inicio de 300 Hz, líneas de fase (pulso blanco) y luego el mapa"],["Decodificación","fldigi, JWX, HamFax"]]},"elt":{"nm":"Sirena ELT","t":"Sirena ELT / PLB en 121,5 MHz","h":"Una AM cuyo tono baja de 1600 a 300 Hz, de dos a cuatro veces por segundo.","l":"Una portadora fija y bandas laterales que se deslizan en abanico: el «uu-uu» de las radiobalizas de socorro, también en 121,375 MHz para ejercicios (fichas 24 y 25)."},"406":{"nm":"Baliza 406","t":"Baliza 406 MHz: ráfaga BPSK","h":"Medio segundo de emisión: 160 ms de portadora pura, luego la fase oscila ±1,1 radián a 400 bit/s.","l":"Una rayita corta que vuelve cada 50 s, entre 406,0 y 406,1 MHz; nada útil que oír, hace falta un decodificador (EPIRB 406, ficha 25)."},"adsb":{"t":"ADS-B / modo S (1090 MHz): impulsos","h":"Impulsos de 0,5 µs cuya posición lleva los bits (PPM); aquí la escala de tiempo está muy ralentizada.","l":"Rayas horizontales muy cortas en todo el ancho, cientos por segundo cerca de un aeropuerto; hace falta una llave SDR (ficha 13).","n":"escala de tiempo muy ralentizada"},"acars":{"t":"ACARS: AM y datos MSK","h":"Una AM que transporta dos tonos, 1200 y 2400 Hz, a 2400 bit/s.","l":"Ráfagas de medio segundo con portadora y bandas laterales, en 131,525, 131,725 o 131,825 MHz en Europa: un «brrrt» al oído (ficha 14)."},"ais":{"t":"AIS: GMSK 9600 baudios en dos canales","h":"Una FSK suavizada (GMSK) en ráfagas de 26 ms, una vez en 161,975 MHz, otra en 162,025 MHz (escala reducida).","l":"Dos columnas de rayitas breves, a 50 kHz, un chasquido regular; cuantos más barcos, más denso (ficha 16).","n":"escala reducida"},"navtex":{"t":"NAVTEX y LSD en onda media y corta: FSK 170 Hz","h":"Como el RTTY: dos frecuencias separadas 170 Hz, pero a 100 baudios.","l":"Dos rayas paralelas continuas durante el boletín, en 518 y 490 kHz (NAVTEX) o 2187,5 kHz (llamada selectiva digital) (ficha 17).","r":[["Código","SITOR-B, CCIR 476: 7 bits con cuatro «1», con repetición FEC"],["Decodificación","fldigi, YaND"]]},"hfdl":{"t":"HFDL: los aviones en onda corta","h":"Una PSK de 1800 baudios sobre una subportadora de 1440 Hz.","l":"Ráfagas de unos 2,4 kHz entre 2,9 y 22 MHz; un siseo de módem que va y viene (ficha 14 bis)."},"ctcss":{"t":"CTCSS: subtono bajo la voz","h":"Un tono grave y continuo (67 a 254 Hz, aquí 88,5 Hz) añadido a la voz.","l":"Visto en el sonido del receptor FM: una raya fija abajo del todo, bajo la voz; abre el silenciador de repetidores y walkies (ficha 8)."},"dtmf":{"sh":"2 tonos","t":"DTMF: dos tonos por tecla","h":"Cada tecla envía un tono grave (697 a 941 Hz) y uno agudo (1209 a 1633 Hz) a la vez.","l":"Pares de puntos alineados en ocho columnas fijas; el «bip-bip» de los números de teléfono y de los mandos de repetidores (ficha 8).","r":[["Secuencia","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tonos","t":"Selcall CCIR: tonos en secuencia","h":"Cinco tonos de 100 ms uno tras otro, uno por cifra.","l":"Una pequeña escalera de puntos, repetida; un «tululululu» rápido para llamar a una radio concreta (ficha 28).","r":[["Secuencia","1 2 3 4 5, dos veces; también lo decodifica la app SelCall del UV-K1"]]},"pocsag":{"sh":"buscas","t":"POCSAG y FLEX: buscapersonas","h":"Una FSK a ±4,5 kHz; un preámbulo 1010… y luego los datos (escala reducida).","l":"Dos rayas nítidas durante el preámbulo y luego una banda llena; un «brrrrt» estridente. 466,075 MHz, DAPNET 439,9875 MHz (ficha 37).","n":"escala reducida"},"ale":{"sh":"8 tonos","t":"ALE: llamada automática en onda corta","h":"Ocho tonos de 750 a 2500 Hz, 125 baudios, en ráfagas.","l":"Un bloque de unos 2 kHz hecho de puntitos, de uno a dos segundos, a veces en varias frecuencias vecinas; un gorjeo agudo (ficha 28 bis)."},"rs41":{"nm":"Radiosonda RS41","t":"Radiosonda RS41: GFSK continua","h":"Una FSK suavizada a 4800 baudios, sin parar; la frecuencia deriva despacio cuando la sonda sube y se enfría.","l":"Una banda de unos 10 kHz que se desliza en diagonal durante todo el vuelo, entre 400 y 406 MHz (ficha 18)."},"ook":{"nm":"Sensores 433","t":"Sensores 433 MHz: OOK","h":"La portadora se enciende y se apaga en impulsos cortos o largos (todo o nada); el mensaje se repite tres veces.","l":"Ráfagas de puntitos, a menudo por triplicado, en 433,92 MHz: estaciones meteorológicas, sondas de temperatura, mandos a distancia (ficha 19)."},"fhss":{"t":"Bluetooth: saltos de frecuencia (FHSS)","h":"La frecuencia cambia 1600 veces por segundo entre 79 canales (escala reducida).","l":"Rayitas esparcidas por todas partes en 80 MHz de ancho, nunca en el mismo sitio, hacia 2,4 GHz (ficha 22).","n":"escala reducida"},"wspr":{"t":"WSPR: balizas de propagación","h":"Cuatro tonos separados 1,46 Hz, 0,68 s por símbolo, durante 110,6 s.","l":"Una raya muy fina de unos 6 Hz que dura casi dos minutos, cada dos minutos pares: hay que ampliar mucho (ficha 26).","n":"extracto de 24 s (una emisión dura 110,6 s)"},"qrss":{"t":"QRSS: Morse muy lento","h":"Una portadora encendida y apagada, con puntos de 3 a 10 s, a menudo en dos frecuencias vecinas (DFCW).","l":"Rayas de pocos Hz de ancho que se leen en una pantalla de diez minutos; inaudible al oído (ficha 26 bis).","n":"acelerado: punto de 0,6 s en lugar de 3 a 10 s"},"texte":{"nm":"Texto en la cascada","t":"Texto en la cascada","h":"Cada línea de una imagen se convierte en un grupo de tonos: el sonido parece ruido.","l":"El texto o el dibujo aparece directamente en la pantalla del SDR (ficha 33).","r":[["Nota","Emitido
