个音高"],["解码","人耳、fldigi、CW Skimmer"]]},"rtty":{"t":"FSK / RTTY：两个频率","h":"频率在两个值之间跳变，一个代表 0，一个代表 1。","l":"两条平行线：业余无线电间隔 170 Hz（45.45 波特），气象广播 450 或 850 Hz。规律的“滴哩哩”声（第 27 页）。","r":[["编码","博多码 ITA2：5 位 + 起始位 + 1.5 停止位；mark 2125 Hz，space 2295 Hz"],["文本","RYRYRYRY CQ CQ DE F4ABC"],["解码","fldigi、MMTTY、2Tone"]]},"afsk":{"nm":"APRS 分组","t":"AFSK 1200 波特：APRS 与分组无线电","h":"两个音频音调，1200 和 2200 Hz，送入 FM 发射机。","l":"在 FM 接收机之后（扬声器声音）：1200 到 2200 Hz 的频带，短促成串。听起来是一秒钟的“咕噜噜”（第 29 和 30 页）。","r":[["频率","欧洲 144.800 MHz（APRS），FM"],["帧","0x7E 标志，然后是 NRZI 编码的 AX.25 数据"],["解码","Direwolf、multimon-ng、KISS TNC"]]},"psk31":{"t":"PSK31：相位调制","h":"频率不动，是相位在翻转；每次翻转时幅度下陷。","l":"一条约 60 Hz 宽的极细线，略带“编织”纹。3 kHz 内可容纳几十个电台（第 26 页）。","r":[["编码","Varicode：0 = 相位翻转，1 = 不变；空闲时是两条孪生线"],["收听频率","14070 kHz、3580 kHz"],["解码","fldigi"]]},"ft8":{"t":"MFSK / FT8：八个音调","h":"频率以 6.25 Hz 的台阶上下变化，每个台阶 0.16 秒。","l":"约 50 Hz 宽的频带，持续 12.6 秒，每 15 秒按时钟重复：3 kHz 内同时有多个电台，例如 7.074 MHz（第 26 页）。","r":[["帧","79 个 0.16 秒的符号，三组 Costas 同步图案（开头、中间、结尾）；这里有八个电台"],["频率","14074、7074、3573、10136、21074、28074 kHz"],["解码","WSJT-X、JTDX（电脑时间要准确）"]]},"ft4":{"t":"FT4：竞赛用的 FT8","h":"四个音调间隔 20.8 Hz，20.8 波特：5 秒内 105 个符号，按 7.5 秒时隙发送。","l":"约 90 Hz 宽的频带，比 FT8 更短更宽，每 7.5 秒重复。14080、7047.5 kHz（第 26 页）。"},"olivia":{"t":"Olivia 8/250：八个音调","h":"八个间隔 31.25 Hz 的音调，每次一个，随机跳动；Walsh 编码和交织。","l":"在 250 Hz 内散布的一片点；可在远低于噪声时解码。听起来是一段随机的小旋律（第 26 页）。"},"hell":{"nm":"Feld Hell 海尔","t":"Feld Hell：用载波写字","h":"载波逐点开关：每个字母由 14 点一列的若干列组成，从下往上扫描（每秒 245 点）。","l":"瀑布图上是一条断续的线；字母要由软件屏幕（fldigi）画出来。听起来是轻柔的噼啪声（第 26 页）。"},"4fsk":{"t":"4FSK：DMR、C4FM（Fusion）、NXDN、dPMR","h":"四个频率等级：每个符号携带两位。","l":"6 至 12.5 kHz 宽的矩形块，像噪声一样填满，常成串出现（DMR 把信道分成两个时隙）。听起来是沙哑的“呼噜噜”（第 38 页）。"},"mt63":{"t":"MT63：应急消息（NBEMS）","h":"同时发 64 个音调，每个都缓慢调制，冗余度很高。","l":"以 1500 Hz 为中心、宽 1 或 2 kHz 的平坦块，边缘清晰；规律的嘶嘶声。即使把话筒贴在扬声器上也能传（第 26 ter 页）。"},"lora":{"t":"LoRa：频率斜坡（啁啾）","h":"频率扫过整个带宽，然后从底部重新开始：跳变的位置携带数据。","l":"平行的斜线，很容易认出：Meshtastic 和 MeshCore 在 869.525 MHz 或 433 MHz，LoRaWAN 传感器（第 11、20 和 21 页）。"},"sstv":{"nm":"SSTV 慢扫描电视","t":"SSTV：声音里的图像","h":"1200 Hz 的同步脉冲，然后频率跟随一行的亮度，从 1500 Hz（黑）到 2300 Hz（白）。","l":"规律的同步线和随图像变化的一团云；“啾啾”声持续一到两分钟。14.230 MHz，国际空间站 145.800 MHz（第 31 页）。","r":[["帧","VIS 头，然后是各行：1200 Hz 同步，绿、蓝、红；这里是测试图的 20 行"],["解码","QSSTV、MMSSTV、手机上的 Robot36"]]},"fax":{"nm":"气象传真","t":"气象传真：1500 Hz 黑，2300 Hz 白","h":"频率从黑到白连续变化，每分钟 120 行。","l":"1500 和 2300 Hz 两条固定频带（相距 800 Hz），规律的“嘀嗒”声。公布的是载波频率：用 USB 在低 1.9 kHz 处收听（第 32 页）。","r":[["帧","300 Hz 起始音、定相行（白色脉冲），然后是图"],["解码","fldigi、JWX、HamFax"]]},"elt":{"nm":"ELT 警笛","t":"121.5 MHz 上的 ELT / PLB 警笛","h":"一种 AM 信号，其音调每秒两到四次从 1600 Hz 降到 300 Hz。","l":"固定的载波和像扇子一样滑动的边带：遇险信标的“呜—呜”声，演练时也用 121.375 MHz（第 24 和 25 页）。"},"406":{"nm":"406 信标","t":"406 MHz 信标：BPSK 突发","h":"发射半秒：160 ms 纯载波，然后相位以 400 bit/s 在 ±1.1 弧度间切换。","l":"一条每 50 秒出现一次的短线，位于 406.0 至 406.1 MHz 之间；没什么可听的，需要解码器（EPIRB 406，第 25 页）。"},"adsb":{"t":"ADS-B / S 模式（1090 MHz）：脉冲","h":"0.5 微秒的脉冲，其位置携带比特（PPM）；这里的时间轴大大放慢。","l":"横贯全宽的极短横线，机场附近每秒数百条；需要 SDR 接收棒（第 13 页）。","n":"时间轴大大放慢"},"acars":{"t":"ACARS：AM 与 MSK 数据","h":"一种携带两个音调（1200 和 2400 Hz）的 AM 信号，速率 2400 bit/s。","l":"半秒长的突发，带载波和边带，欧洲在 131.525、131.725 或 131.825 MHz：听起来是“噗噜噜”（第 14 页）。"},"ais":{"nm":"AIS 船舶","t":"AIS：两个信道上的 GMSK 9600 波特","h":"平滑的 FSK（GMSK），每次 26 ms 突发，交替在 161.975 MHz 和 162.025 MHz（比例缩小）。","l":"两列短促的小线段，相距 50 kHz，规律的咔哒声；船越多越密（第 16 页）。","n":"比例缩小"},"navtex":{"t":"中波和短波上的 NAVTEX 与 DSC：FSK 170 Hz","h":"与 RTTY 相似：两个相距 170 Hz 的频率，但速率是 100 波特。","l":"播报期间连续的两条平行线，位于 518 和 490 kHz（NAVTEX）或 2187.5 kHz（数字选择呼叫）（第 17 页）。","r":[["编码","SITOR-B，CCIR 476：7 位中有四个“1”，带 FEC 重复"],["解码","fldigi、YaND"]]},"hfdl":{"t":"HFDL：短波上的飞机","h":"在 1440 Hz 副载波上的 1800 波特 PSK。","l":"在 2.9 至 22 MHz 之间约 2.4 kHz 宽的突发；时有时无的调制解调器嘶声（第 14 bis 页）。"},"ctcss":{"nm":"CTCSS 亚音","t":"CTCSS：语音下的亚音","h":"在语音中加入一个低沉的连续音调（67 至 254 Hz，这里是 88.5 Hz）。","l":"在 FM 接收机的声音中：最底部的一条固定线，在语音下方；它用来打开中继和对讲机的静噪（第 8 页）。"},"dtmf":{"nm":"DTMF 双音","sh":"2 个音","t":"DTMF：每个按键两个音调","h":"每个按键同时发出一个低音（697 至 941 Hz）和一个高音（1209 至 1633 Hz）。","l":"成对的点排列在八个固定列上；电话号码和中继命令的“嘀嘀”声（第 8 页）。","r":[["序列","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"nm":"CCIR 选呼","sh":"5 个音","t":"CCIR 选呼：依次发出的音调","h":"五个 100 ms 的音调接连发出，每个数字一个。","l":"一段小小的点状台阶，会重复；快速的“嘟噜噜噜”用来呼叫某一部电台（第 28 页）。","r":[["序列","1 2 3 4 5，两遍；UV-K1 的 SelCall 应用也能解码"]]},"pocsag":{"nm":"POCSAG 寻呼","sh":"寻呼机","t":"POCSAG 与 FLEX：寻呼机","h":"±4.5 kHz 的 FSK；先是 1010… 前导码，然后是数据（比例缩小）。","l":"前导码期间两条清晰的线，然后是一条填满的频带；刺耳的“噗噜噜”。466.075 MHz，DAPNET 439.9875 MHz（第 37 页）。","n":"比例缩小"},"ale":{"sh":"8 个音","t":"ALE：短波自动链路建立","h":"750 至 2500 Hz 的八个音调，125 波特，成串发送。","l":"约 2 kHz 宽、由小点组成的块，持续一到两秒，有时出现在几个相邻频率上；尖细的啁啾声（第 28 bis 页）。"},"rs41":{"nm":"RS41 探空仪","t":"RS41 探空仪：连续 GFSK","h":"4800 波特的平滑 FSK，不停发送；探空仪上升变冷时，频率会慢慢漂移。","l":"一条约 10 kHz 宽的频带，在整个飞行过程中斜着滑动，位于 400 至 406 MHz 之间（第 18 页）。"},"ook":{"nm":"433 传感器","t":"433 MHz 传感器：OOK","h":"载波以长短脉冲开关（通断键控）；同一消息重复三次。","l":"成串的小点，常三次一组，位于 433.92 MHz：气象站、温度探头、遥控器（第 19 页）。"},"fhss":{"nm":"蓝牙","t":"蓝牙：跳频（FHSS）","h":"频率每秒在 79 个信道之间切换 1600 次（比例缩小）。","l":"小线段散布在 80 MHz 宽度内，从不在同一处，位于 2.4 GHz 附近（第 22 页）。","n":"比例缩小"},"wspr":{"t":"WSPR：传播信标","h":"四个间隔 1.46 Hz 的音调，每个符号 0.68 秒，持续 110.6 秒。","l":"一条约 6 Hz 宽的极细线，持续将近两分钟，每逢偶数分钟出现：需要大幅放大（第 26 页）。","n":"24 秒片段（一次发射持续 110.6 秒）"},"qrss":{"t":"QRSS：极慢摩尔斯","h":"载波开开关关，点长 3 至 10 秒，常在两个相邻频率上（DFCW）。","l":"只有几 Hz 宽的线，在十分钟的屏幕上读取；人耳听不出来（第 26 bis 页）。","n":"已加速：点长 0.6 秒，而不是 3 至 10 秒"},"texte":{"nm":"瀑布图文字","t":"瀑布图中的文字","h":"图像的每一行变成一组音调：声音听起来像噪声。","l":"文字或图画直接出现在 SDR 屏幕上（第 33 页）。","r":[["说明","从图像底部开始发送：在实时瀑布图中是正的，在信号指纹中是倒的（自上而下阅读）"]]},"vara":{"t":"现代短波数据：VARA、Pactor、ARDOP","h":"长而饱满的突发（OFDM 或 PSK），中间夹着对方电台的简短应答。","l":"约 2.4 kHz 宽的矩形，停了又起，中间有一个小小的确认；断断续续的嘶声（第 26 页）。"},"chirp":{"nm":"电离层探测","t":"电离层探测仪（啁啾探测）","h":"一条缓慢的频率斜坡穿过整个短波段；电离层的回波稍后到达。","l":"一条扫过屏幕的斜线，旁边伴有平行线（回波）；一声“嗖”，转瞬即逝。"},"oth":{"nm":"超视距雷达","t":"超视距雷达（“啄木鸟”）","h":"脉冲每秒重复 10 到 50 次，每个脉冲宽几 kHz。","l":"覆盖整个波段的宽条纹块；短波上非常规律的啄木鸟敲击声。"},"parasites":{"nm":"干扰","sh":"开关电源","t":"开关电源的干扰","h":"方波：它的频率和所有谐波同时出现。","l":"在噪声背景上一起漂移的规则梳状谱线：可用 NOISE FIND 或便携式接收机查找（第 K21b 页）。"},"mpx":{"nm":"FM 立体声与 RDS","t":"FM 立体声广播与 RDS","h":"解调后的声音（复合信号）包含 L+R 声道、19 kHz 导频、38 kHz 附近的 L-R 声道和 57 kHz 的 RDS。","l":"解调后从 0 到 60 kHz 看：低频块、19 kHz 处的细线、中间较弱的块，以及最上方的 RDS（第 10 页）。","n":"为便于收听缩小 20 倍"},"dcf77":{"nm":"DCF77 授时","t":"DCF77 授时信号（77.5 kHz）","h":"每秒开始时，载波降到 15%，持续 0.1 秒（位 0）或 0.2 秒（位 1）。","l":"一条固定的线，每秒有一个黑色缺口；第 59 秒没有缺口，用来标记整分（第 10 页）。","r":[["说明","这里把载波移到 1000 Hz；第 6 秒没有缺口，就像每分钟的第 59 秒"]]},"ofdm":{"t":"OFDM：几十个子载波","h":"许多排得很密的载波，每个都很慢：叠加起来像噪声。","l":"边缘清晰的平坦矩形，一直都在：短波 DRM（10 kHz）、DAB+（1.5 MHz）、数字电视、Wi-Fi。听起来是持续的嘶声（第 10 和 22 页）。"},"dsss":{"t":"扩频（DSSS）：GPS、Wi-Fi 802.11b","h":"数据与非常快的码相混合：能量分散到很宽的频带上。","l":"一个宽宽的鼓包，勉强高出噪声；GPS 甚至在噪声之下，不经处理看不到（第 22 和 23 页）。"},"hline":{"nm":"氢线","sh":"1420 MHz","t":"21 厘米氢线（1420.405 MHz）","h":"银河系中的冷氢在 1420.405 MHz 上发出极弱的噪声。银河旋臂的运动通过多普勒效应使其频移：可以看到几个小鼓包。","l":"瀑布图里每一秒几乎都看不出什么：要长时间平均，鼓包才会从噪声中浮现。这里请在停止后看平均频谱。一面抛物面天线或喇叭天线、一个前置放大器和一根 SDR 接收棒就够了。","n":"信号已大幅夸大"},"sun":{"nm":"太阳","sh":"射电暴","t":"太阳：III 型射电暴","h":"耀斑抛出的电子穿过日冕，越走越远，使日冕发出的频率越来越低。","l":"在太阳噪声背景上，一条条线在不到一秒内从频谱上方斜着落到下方；越来越响的“嘶——”。约 10 至 400 MHz，短波 20 MHz 附近也能听到。"},"jupiter":{"nm":"木星","sh":"20 MHz","t":"木星：十米波射电暴（L 型和 S 型）","h":"木星的磁场和它的卫星木卫一（Io）在 15 至 40 MHz 之间产生强烈辐射：缓慢的 L 型暴和极短的、快速向下滑动的 S 型暴。","l":"先是一阵阵噪声浪潮（L 型，像海浪），然后是一串串密集斜线状的小“噗”声（S 型）。夜间在 20.1 MHz 附近，用简单的偶极天线即可，前提是木卫一位置合适。"},"pulsar":{"nm":"脉冲星","sh":"B0329+54","t":"脉冲星 PSR B0329+54","h":"一颗自转的中子星用射电波束扫过地球，这里每 0.714 秒一次。星际气体使低频延迟：每个脉冲先到达频谱上方。","l":"规律的“嗒”声；在瀑布图中，每个脉冲是一条向下弯的曲线（色散）。真实信号在噪声之下：需要大天线，并按周期把脉冲叠加起来。","n":"信号已大幅夸大"},"meteor":{"nm":"流星","sh":"GRAVES","t":"GRAVES 雷达的流星回波（143.050 MHz）","h":"法国 GRAVES 雷达在 143.050 MHz 上不停发射。流星电离空气时，其尾迹会把一点信号反射到你的接收机，持续零点几秒到几秒。","l":"在 143.049 MHz 用 USB 收听：1000 Hz 附近短促的“叮”声，有时回波会滑动（流星头，多普勒效应）或持续较久。流星雨期间（英仙座、双子座）多得多（第 1 页）。"},"whistler":{"nm":"哨声","sh":"甚低频","t":"甚低频哨声（whistler）","h":"闪电产生一声射电“咔哒”；其中一部分沿地磁场磁力线传到另一半球再返回，高音先到。","l":"紧跟在一声“咔哒”之后，一个“啾——”在一两秒内从高音降到低音；到处是噼啪声（天电）。低于 10 kHz，用远离电线的甚低频接收机收听。"},"chorus":{"nm":"黎明合唱","sh":"甚低频","t":"黎明合唱（dawn chorus）","h":"磁暴期间，被困在磁层中的电子发出上升的小音符，多在日出时分。","l":"重叠在一起的上升鸣叫声，像鸟儿一样，约 1 至 4 kHz。所需设备与哨声相同。"},"sputnik":{"nm":"斯普特尼克 1 号","sh":"1957","t":"斯普特尼克 1 号（1957）","h":"第一颗人造卫星在 20.005 和 40.002 MHz 上交替发出约 0.3 秒的“哔”声，持续三周。","l":"一条规律断开的线：“哔……哔……”，1957 年 10 月全世界都在收听的声音（复原）。"},"doppler":{"nm":"多普勒效应","sh":"卫星","t":"卫星信标与多普勒效应","h":"低轨卫星先靠近再远离：过境期间接收频率下降，145 MHz 约 ±3 kHz，435 MHz 约 ±10 kHz。","l":"一条呈 S 形下降的线：开始慢，卫星最近时快，之后又变慢（第 34 页）。","n":"10 分钟过境压缩为 12 秒"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA 卫星：APT 图像（历史）","h":"2400 Hz 副载波由图像进行幅度调制，每秒两行，每行开头有同步脉冲。已于 2025 年停止；如今 Meteor-M 卫星发送 LRPT。","l":"2400 Hz 处的一条线，边带随图像变化，还有著名的每秒两次的“嘀嗒”声（第 34 页）。"},"eme":{"nm":"月球回波","sh":"EME","t":"月球回波（EME）","h":"发往月球的信号约 2.5 秒后返回，衰减极大，略微展宽，并有多普勒频移。","l":"先听到自己的“哔”，2.5 秒后听到微弱、略显模糊的回波。业余无线电爱好者用 CW 或 JT65 在 144 MHz 及以上进行（第 1 页）。","n":"回波已大幅夸大"},"msk144":{"nm":"MSK144","sh":"流星","t":"MSK144：流星散射数字模式","h":"两个音调，1000 和 2000 Hz，2000 波特，72 ms 的帧不停重复：每条流星余迹会让其中几帧通过。","l":"0.1 至 1 秒、约 2.4 kHz 宽的突发，随流星的“叮”一起出现又消失。在 50 和 144 MHz 上，使用 WSJT-X。"},"jt65":{"nm":"JT65","sh":"65 音","t":"JT65：65 个音调，非常慢","h":"一个同步音和 64 个间隔 2.7 Hz 的数据音（JT65A），每个符号 0.37 秒，每分钟发射 47 秒。","l":"约 180 Hz 内的一排小线段，还有一条总回到同一位置的同步线。用于月面反射（JT65B 和 C）和极弱信号。","n":"20 秒片段（一次发射持续 47 秒）"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA：专业数字集群网络","h":"π/4-DQPSK 相位调制，每秒 18000 个符号，四个时隙，信道 25 kHz。","l":"边缘圆润的实心块，在基站附近一直存在；沙哑的嘶声。已加密，无法收听（第 38 页）。","n":"比例缩小"},"ndb":{"nm":"NDB 信标","sh":"190–535 kHz","t":"NDB：无方向性信标","h":"长波上的固定载波，用音调（常为 1020 Hz）发送两三个字母的摩尔斯识别码。","l":"中间一条固定线，发识别码时两侧各有一条小线。约 190 至 535 kHz，用 SSB 或 CW 收听（第 10 页）。"},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR：甚高频全向信标","h":"AM 信号：一个随方位变化的 30 Hz 信号，一个以 30 Hz 调频的 9960 Hz 副载波（基准），以及 1020 Hz 的摩尔斯识别码。","l":"解调后的声音中：低沉的 30 Hz 嗡声，10 kHz 附近一条起伏的宽线，偶尔有识别码（第 15 页）。","n":"解调后的声音，缩小 2 倍"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS：着陆引导（航向信标）","h":"AM 信号中有 90 和 150 Hz 两个音调；它们的比例告诉飞机偏左还是偏右。摩尔斯识别码以 I 开头。","l":"解调后的声音中：90 和 150 Hz 两条很低的线，以及 1020 Hz 的识别码。108.1 至 112 MHz；下滑道信标约 330 MHz（第 15 页）。"},"m10":{"nm":"M10 / M20 探空仪","sh":"Meteomodem","t":"M10 和 M20 探空仪（Meteomodem）","h":"每秒一帧，快速 FSK（约 9600 波特）：比 RS41 更宽。在法国由法国气象局施放。","l":"每秒一个宽突发，在飞行中缓慢漂移；400 至 406 MHz（第 18 页）。"},"tpms":{"nm":"胎压（TPMS）","sh":"433 MHz","t":"轮胎压力传感器（TPMS）","h":"每个车轮不时发送一段几毫秒的 FSK 突发：气压、温度、识别码。","l":"433.92 MHz（或 315 MHz）上零星的小突发，常成对出现，在汽车经过时。可用 rtl_433 解码。"},"als162":{"nm":"ALS162","sh":"162 kHz","t":"ALS162 授时信号（阿卢伊，162 kHz）","h":"原法国国际广播电台长波的载波；时间用细微、听不见的相位调制编码。","l":"一条固定的线，在法国极强，每秒开头略微变宽；需要解码器才能读出时间（第 10 页）。"},"wwv":{"nm":"WWV","sh":"2.5–20 MHz","t":"WWV 授时信号（科罗拉多）","h":"AM：每秒一个 5 ms、1000 Hz 的“嗒”，一个 500 或 600 Hz 的音，100 Hz 上的时间码，以及播报 UTC 的人声。","l":"解调后的声音中：每秒中断一次的 500 Hz 线、1000 Hz 的嗒声，以及最底部 100 Hz 的时间码（第 10 页）。"},"msf":{"nm":"MSF","sh":"60 kHz","t":"MSF 授时信号（安索恩，60 kHz）","h":"每秒开头载波按比特关断 0.1、0.2 或 0.3 秒，整分时关断 0.5 秒。","l":"一条固定的线，每秒有完全黑的缺口，比 DCF77 的更长（第 10 页）。"},"type2":{"nm":"太阳 II 型","sh":"激波","t":"太阳：II 型射电暴","h":"日冕物质抛射的激波使等离子体缓慢地向越来越低的频率辐射，常分成两条带（基频和二倍频）。","l":"两条平行的噪声带，在几分钟内缓缓下降。与快得多的 III 型暴对比一下。","n":"几分钟压缩为 6 秒"},"tweeks":{"nm":"Tweek","sh":"甚低频","t":"Tweek：夜间的甚低频“叮”声","h":"夜里，远处闪电的咔哒声在地面和电离层之间来回反射；接近截止频率（约 1.7 kHz）的成分最后到达。","l":"一个小小的“叮”向下滑并停在约 1.7 kHz，有时在二倍频处有回声；到处噼啪声。低于 10 kHz，夜间。"},"hiss":{"nm":"甚低频嘶声","sh":"hiss","t":"甚低频嘶声（hiss）","h":"等离子体层电子产生的宽带噪声，随地磁活动起伏。","l":"从几百 Hz 到几 kHz 的嘶声带，没有图案，缓慢增强又减弱。"},"aurora":{"nm":"极光传播","sh":"Au","t":"极光传播（Au）","h":"极光会反射甚高频电波，但抖动得非常快：每个信号被展宽到几百 Hz。","l":"CW 变成粗糙的、像耳语一样的嘶声，听不出音调。在 50 和 144 MHz，磁暴期间把天线对准北方。"},"galactic":{"nm":"银河噪声","sh":"20–40 MHz","t":"银河系的噪声","h":"银河系中心发出射电噪声，卡尔·央斯基于 1932 年在 20 MHz 附近发现了它。它随地球自转升降。","l":"背景噪声慢慢升高又降低，每天提前约 4 分钟。在 20 至 40 MHz 用简单的偶极天线就能看到。","n":"一天压缩为 12 秒"},"cubesat":{"nm":"立方星","sh":"9600 bd","t":"立方星遥测","h":"小卫星定期以 1200 或 9600 波特的 FSK 或 GMSK 在 435–438 MHz 附近发送测量数据（电池、温度）。","l":"规律的突发，由于多普勒效应，过境期间每次都更低一点（第 34 页）。","n":"比例缩小，过境加速"},"issfm":{"nm":"国际空间站 FM","sh":"145.800 MHz","t":"国际空间站（ISS）：FM 语音","h":"宇航员在 145.800 MHz 用 FM 与学校和业余无线电爱好者通话。空间站时速 28000 公里：过境期间接收频率下降约 3.5 kHz。","l":"一条 FM 语音带，在 10 分钟过境中从右向左慢慢移动（第 34 页）。","n":"10 分钟过境压缩为 10 秒"},"buzzer":{"nm":"UVB-76“蜂鸣器”","sh":"4625 kHz","t":"UVB-76，“蜂鸣器”（The Buzzer，4625 kHz）","h":"一个俄罗斯军用电台，几十年来每分钟约 25 次发出约一秒的嗡嗡声，偶尔插入语音消息。","l":"一条固定载波，每次嗡声时出现一列自上而下的密集谱线。在 4625 kHz 用 USB 很容易找到。"},"pip":{"nm":"“The Pip”","sh":"3756 / 5448 kHz","t":"“The Pip”：无尽的哔声","h":"另一个俄罗斯军用短波信标，昼夜不停重复短促的哔声，偶尔被消息打断。","l":"一条固定的线被切成非常密的点；听起来是永不停止的快速哔哔哔。","n":"节奏为近似"},"squeaky":{"nm":"“Squeaky Wheel”","sh":"短波","t":"“Squeaky Wheel”：吱吱响的轮子","h":"一个俄罗斯军用短波信标，收听者根据其重复的声音图案为它起了名字。","l":"由两个声音组成的小图案，其中一个上升，循环重复：像吱吱作响的轮子。","n":"近似模仿"},"codar":{"nm":"CODAR","sh":"海洋雷达","t":"CODAR：海流雷达","h":"海岸雷达每秒扫过一段频率一到两次，用来测量海流和海浪。","l":"规则的平行斜线和重复的“刷”声；约 4.5–5.5 MHz、13 MHz 和 25 MHz，常常昼夜不停。","n":"比例缩小"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"STANAG 4285 军用调制解调器","h":"在 1800 Hz 载波上以 2400 波特进行 8-PSK 相位调制，每 107 ms 有一段测试序列用于跟踪信道。","l":"约 3 kHz 宽的实心块；听起来是带有规律嗡声的嘶声（第 35 bis 页）。"},"link11":{"nm":"Link-11","sh":"16 音","t":"Link-11：海军数据链","h":"605 至 2915 Hz 的十六个音调同时发出，每个每秒做 75 次相位调制。","l":"2.3 kHz 内一排规则的谱线，外加一条稍微分开的线；听起来是带音乐感的嗡声（第 35 bis 页）。"},"numbers":{"nm":"数字电台","sh":"人声","t":"数字电台","h":"在固定时间先播一段小呼号旋律，然后一个（常为合成的）声音用 AM 或 SSB 朗读五位一组的数字。","l":"先是单个音符的旋律，然后是由静音隔开的规律音节组（第 35 bis 页）。","n":"人声为模仿，没有真实数字"}}},"ja":{"ui":{"title":"無線モード識別器","mystery":"ミステリー音","play":"▶ 聴く","stop":"■ 停止","noise":"ノイズ","volume":"音量","loop":"ループ","specwf":"スペクトラム + ウォーターフォール","cursor":"カーソル","footprint":"信号の全体像","dur":"上から下へ {s} 秒","avg":"信号全体の平均","press":"「聴く」を押すと、ここに信号が流れます","count":"{n} 種類の信号（第 5 bis シートの順）","myst":"ミステリーモード","mystTags":"聴いて見てから、正しい答えを選んでください","quizH":"これはどの信号？","quizLead":"再生して、スペクトラム、ウォーターフォール、全体像を見てから答えてください。","score":"スコア","good":"正解！","bad":"残念：正解は {x} でした。","next":"次のミステリー音","principle":"しくみ","screen":"画面上","sheet":"シート","book":"本：シート {r}","lang":"言語","signals":"信号","f1":"信号はページ内でシミュレートしています（毎秒 12,000 サンプル）。OpenBookRadio の本の第 5 bis シートの信号に、Olivia、FT4、Feld Hell（第 26 シート）を加えました。無線信号（AM、FM、AIS、LoRa など）は SDR の画面と同じく、シミュレートした中間周波数で表示しています。一部は縮小または高速化しており、その旨を表示しています。","f2":"ウォーターフォールと全体像では時間が下へ流れます。ライセンス CC BY-NC-SA 4.0、無料、販売禁止。","night":"ナイトモード","day":"デイモード"},"groups":["アナログ音声","電信","データ","画像","航空・海事・救難","呼出し・サブトーン・ページング","ラジオゾンデ・センサー・IoT機器","HF モードと珍しい信号","放送と時刻","広帯域","ボーナス：宇宙の音","ボーナス：短波の珍しい信号"],"modes":{"am":{"sh":"音声","t":"AM：振幅変調","h":"搬送波の強さが音に合わせて変わり、波形が「ふくらんだり」「しぼんだり」します。","l":"中央に固定の線（搬送波）、その両側に同じ側波帯。幅は約 6〜9 kHz。短波・中波放送、航空無線（シート 10 と 12）。"},"ssb":{"t":"SSB：単側波帯","h":"側波帯が一つだけ残り、搬送波はありません。話していないときは何もありません。","l":"中央線がなく、話しているときだけ現れる幅約 2.7 kHz の帯一本。10 MHz 以上は USB、以下は LSB（アマチュア無線）。同調がずれると「アヒル声」になります（シート 9 と 26）。"},"fm":{"sh":"音声","t":"FM：周波数変調","h":"振幅は一定で、音に合わせて振動の間隔が詰まったり広がったりします。","l":"信号は自分の周波数のまわりで揺れ、音が大きいほど広がります。ナローFM は 1 チャンネル 12.5 kHz（トランシーバー、レピーター）、FM 放送は 200 kHz（シート 2 と 11）。"},"cw":{"nm":"CW モールス","t":"CW：モールス符号","h":"搬送波をオン・オフします：長点と短点。","l":"モールスのリズムで途切れるとても細い線。耳には「ピッ」という音。ここでは「CQ」（シート 39）。","r":[["速度","毎分 20 語、短点 60 ms、700 Hz：「CQ CQ CQ DE F4ABC K」"],["耳で","一つの音程の、長短の澄んだビープ音"],["デコード","耳、fldigi、CW Skimmer"]]},"rtty":{"t":"FSK / RTTY：二つの周波数","h":"周波数が二つの値の間を跳びます。一方が 0、もう一方が 1。","l":"平行な二本線：アマチュア無線では 170 Hz 間隔（45.45 ボー）、気象通報では 450 または 850 Hz。規則的な「ティディリディ」（シート 27）。","r":[["符号","ボー ITA2：5 ビット + スタート + 1.5 ストップ；mark 2125 Hz、space 2295 Hz"],["テキスト","RYRYRYRY CQ CQ DE F4ABC"],["デコード","fldigi、MMTTY、2Tone"]]},"afsk":{"nm":"APRS パケット","t":"AFSK 1200 ボー：APRS とパケット通信","h":"1200 Hz と 2200 Hz の二つの可聴音を FM 送信機に入れます。","l":"FM 受信機の後（スピーカーの音）で見ると、1200〜2200 Hz の帯が短いバーストで現れます。耳には 1 秒ほどの「グルルッ」（シート 29 と 30）。","r":[["周波数","ヨーロッパでは 144.800 MHz（APRS）、FM"],["フレーム","0x7E フラグのあと NRZI の AX.25 データ"],["デコード","Direwolf、multimon-ng、KISS TNC"]]},"psk31":{"t":"PSK31：位相変調","h":"周波数は動かず、位相が反転します。反転のたびに振幅が落ち込みます。","l":"幅約 60 Hz のとても細い線で、少し「編んだ」ように見えます。3 kHz に数十局が入ります（シート 26）。","r":[["符号","Varicode：0 = 位相反転、1 = 変化なし；待機中は双子の二本線"],["受信周波数","14,070 kHz、3,580 kHz"],["デコード","fldigi"]]},"ft8":{"t":"MFSK / FT8：八つのトーン","h":"周波数が 6.25 Hz 刻みで上下し、1 段 0.16 秒です。","l":"幅約 50 Hz の帯が 12.6 秒続き、時計に合わせて 15 秒ごとに戻ってきます。3 kHz に同時に何局も入ります（例：7.074 MHz、シート 26）。","r":[["フレーム","0.16 秒の 79 シンボル、3 つの Costas パターン（始め、中央、終わり）；ここでは 8 局"],["周波数","14,074、7,074、3,573、10,136、21,074、28,074 kHz"],["デコー z）、DAB+（1.5 MHz）、地デジ、Wi-Fi。耳には連続したシャー音（シート 10 と 22）。"},"dsss":{"t":"スペクトラム拡散（DSSS）：GPS、Wi-Fi 802.11b","h":"データをとても速い符号と混ぜ、エネルギーを広い帯域に広げます。","l":"ノイズからわずかに出た広いこぶ。GPS はノイズより下にあり、処理しないと見えません（シート 22 と 23）。"},"hline":{"nm":"水素線","sh":"1420 MHz","t":"波長 21 cm の水素線（1420.405 MHz）","h":"天の川銀河の冷たい水素が 1420.405 MHz でとても弱いノイズを出しています。銀河の腕の動きによりドップラー効果でずれ、小さなこぶがいくつか見えます。","l":"ウォーターフォールでは一瞬ごとにはほとんど何も見えません。長時間平均すると、こぶがノイズから浮かび上がります。ここでは停止中の平均スペクトラムを見てください。パラボラかホーン、プリアンプ、SDR ドングルがあれば十分です。","n":"信号を大きく誇張"},"sun":{"nm":"太陽","sh":"バースト","t":"太陽：III 型電波バースト","h":"フレアで放り出された電子がコロナを通り抜け、遠ざかるにつれてより低い周波数で電波を出させます。","l":"太陽ノイズを背景に、1 秒足らずでスペクトラムの上から下へ斜めに落ちる線。高まる「シャーッ」。およそ 10〜400 MHz、短波の 20 MHz 付近でも聞こえます。"},"jupiter":{"nm":"木星","sh":"20 MHz","t":"木星：デカメートル波バースト（L と S）","h":"木星の磁場と衛星イオが 15〜40 MHz で強い電波を出します。ゆっくりした L バーストと、すばやく下へ滑るとても短い S バースト。","l":"まず打ち寄せる波のようなノイズ（L）、続いて密な斜め線の小さな「ポッ」の連続（S）。夜の 20.1 MHz 付近で、イオの位置がよいとき、簡単なダイポールで受信できます。"},"pulsar":{"nm":"パルサー","sh":"B0329+54","t":"パルサー PSR B0329+54","h":"自転する中性子星が電波ビームで地球をなでます。ここでは 0.714 秒ごと。星間ガスが低い周波数を遅らせるので、各パルスはまずスペクトラムの上に届きます。","l":"規則的な「カチッ」。ウォーターフォールでは各パルスが下がっていく曲線（分散）。本物の信号はノイズの下にあり、大きなアンテナと周期ごとのパルスの積算が必要です。","n":"信号を大きく誇張"},"meteor":{"nm":"流星","sh":"GRAVES","t":"GRAVES レーダーの流星エコー（143.050 MHz）","h":"フランスの GRAVES レーダーは 143.050 MHz で常に送信しています。流れ星が空気を電離すると、その痕跡が信号の一部をあなたの受信機へ反射します。一瞬から数秒間です。","l":"143.049 MHz を USB で：1000 Hz 付近の短い「ピン」。ときにはすべるエコー（流星の頭部、ドップラー効果）や長く続くエコーも。流星群（ペルセウス座、ふたご座）のときはずっと増えます（シート 1）。"},"whistler":{"nm":"ホイッスラー","sh":"VLF","t":"VLF ホイッスラー","h":"雷が電波の「パチッ」を生み、その一部が地磁気の磁力線に沿ってもう一方の半球まで行って戻ってきます。高い音が先に届きます。","l":"「パチッ」のすぐあと、1〜2 秒で高い音から低い音へ下がる「ヒューン」。あちこちにパチパチ音（空電）。10 kHz 以下、送電線から離れた VLF 受信機で。"},"chorus":{"nm":"ドーンコーラス","sh":"VLF","t":"ドーンコーラス（夜明けの合唱）","h":"磁気嵐のとき、磁気圏に捕らえられた電子が小さな上昇音を出します。とくに夜明けごろに多く現れます。","l":"重なり合う上昇するさえずり、まるで鳥のよう。およそ 1〜4 kHz。ホイッスラーと同じ装置で聞けます。"},"sputnik":{"nm":"スプートニク 1 号","sh":"1957","t":"スプートニク 1 号（1957 年）","h":"最初の人工衛星は、約 0.3 秒のビープ音を 20.005 MHz と 40.002 MHz で交互に、3 週間送り続けました。","l":"規則的に途切れる線：「ピッ…ピッ…」。1957 年 10 月に世界中が耳を傾けた音（再現）。"},"doppler":{"nm":"ドップラー効果","sh":"衛星","t":"衛星ビーコンとドップラー効果","h":"低軌道の衛星は近づいてから遠ざかるので、受信周波数はパスの間に下がります。145 MHz で約 ±3 kHz、435 MHz で約 ±10 kHz。","l":"S 字形に下がる線：最初はゆっくり、衛星が最も近いときに速く、また最後はゆっくり（シート 34）。","n":"10 分のパスを 12 秒に短縮"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA 衛星：APT 画像（過去の方式）","h":"画像で振幅変調した 2400 Hz のサブキャリアで、毎秒 2 行、各行の初めに同期パルス。2025 年に停止し、現在は Meteor-M 衛星が LRPT で送信しています。","l":"画像とともに変わる側波帯をもつ 2400 Hz の線と、毎秒 2 回の有名な「チクタク」（シート 34）。"},"eme":{"nm":"月面反射","sh":"EME","t":"月面反射のエコー（EME）","h":"月へ送った信号は約 2.5 秒後に戻ってきます。非常に弱くなり、少し広がり、ドップラーでずれています。","l":"自分の「ピッ」が聞こえ、2.5 秒後に弱く少しぼやけたエコーが返ってきます。アマチュア無線家は 144 MHz 以上で CW や JT65 を使って行います（シート 1）。","n":"エコーを大きく誇張"},"msk144":{"nm":"MSK144","sh":"流星","t":"MSK144：流星散乱のデジタルモード","h":"1000 Hz と 2000 Hz の二つのトーン、2000 ボー。72 ms のフレームを休みなく繰り返し、流星の痕跡ごとにいくつかが届きます。","l":"幅約 2.4 kHz、0.1〜1 秒のバーストが、流星の「ピン」とともに現れて消えます。50 MHz と 144 MHz で WSJT-X を使います。"},"jt65":{"nm":"JT65","sh":"65 トーン","t":"JT65：65 トーンのとても遅いモード","h":"同期トーン一つと、2.7 Hz 間隔の 64 のデータトーン（JT65A）。1 シンボル 0.37 秒、1 分間に 47 秒送信します。","l":"約 180 Hz に並ぶ小さな線のはしごと、いつも同じ場所に戻る同期の線。月面反射（JT65B、C）や非常に弱い信号に使われます。","n":"20 秒の抜粋（1 回の送信は 47 秒）"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA：業務用デジタル無線","h":"π/4-DQPSK の位相変調で毎秒 18,000 シンボル、4 つのタイムスロット、25 kHz のチャンネル。","l":"縁の丸い詰まったブロックで、基地局の近くではずっと出ています。しゃがれたシャー音。暗号化されていて聞けません（シート 38）。","n":"縮小表示"},"ndb":{"nm":"NDB ビーコン","sh":"190–535 kHz","t":"NDB：無指向性無線標識","h":"長波の固定搬送波に、2〜3 文字のモールス識別符号をトーン（多くは 1020 Hz）で乗せています。","l":"中央に固定の線、識別符号の間は両側に小さな線が二本。およそ 190〜535 kHz、SSB か CW で（シート 10）。"},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR：超短波全方向式無線標識","h":"AM で、方位によって変わる 30 Hz 信号、30 Hz で周波数変調した 9960 Hz のサブキャリア（基準）、1020 Hz のモールス識別符号。","l":"復調した音では：低い 30 Hz のうなり、10 kHz 付近の波打つ太い線、ときどき識別符号（シート 15）。","n":"復調音、1/2 に縮小"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS：着陸誘導（ローカライザー）","h":"AM で 90 Hz と 150 Hz の二つのトーン。その比で、機体が中心線の左か右かがわかります。モールス識別符号は I で始まります。","l":"復調した音では：90 Hz と 150 Hz のとても低い二本の線と、1020 Hz の識別符号。108.1〜112 MHz、グライドスロープは 330 MHz 付近（シート 15）。"},     for(let k=0;k<K;k++){ const fk=FC-w/2+k*w/K, p0=rnd()*TAU; let s=0; for(let i=a;i<b;i++){ if((i-a)%(SR/40)===0) s=ri(2); x[i]+=Math.cos(TAU*fk*i/SR+p0+Math.PI*s)/K*3; } } }
  return addNoise(x,0.03); };
G.chirp=()=>{ const N=4*SR, x=Z(N);
  for(const [dl,a] of [[0,1],[0.12,0.5],[0.3,0.3]]){ let ph=0; for(let i=0;i<N;i++){ const t=i/SR; if(t>dl&&t<dl+4){ ph+=TAU*(200+1400*(t-dl))/SR; x[i]+=a*Math.cos(ph); } } }
  return addNoise(x,0.03); };
G.oth=()=>{ const N=4*SR, x=Z(N), L=Math.round(SR*0.012);
  for(let k=0;k<80;k++){ const a=Math.round(k*SR/20); for(let j=0;j<L&&a+j<N;j++){ const t=j/SR; x[a+j]+=Math.cos(TAU*(1000*t+4000*t*t/0.024*0.5+1500*t)); } }
  return addNoise(x,0.03); };
G.parasites=()=>{ const N=4*SR, x=Z(N); let ph=0; for(let i=0;i<N;i++){ const t=i/SR; ph+=TAU*(450+15*Math.sin(TAU*0.2*t))/SR; let s=0; for(let h=1;h<14;h++) s+=(0.6/Math.pow(h,0.3))*Math.cos(h*ph); x[i]=s; } return addNoise(x,0.08); };
G.mpx=()=>{ // multiplex FM à l'échelle 1/20 : 19 kHz → 950 Hz, 38 kHz → 1900 Hz, 57 kHz → 2850 Hz
  const N=4*SR, x=Z(N), w=Z(N), d=Z(N); for(let i=0;i<N;i++){ w[i]=gauss(); d[i]=gauss(); }
  const mono=smooth(w,9), diff=smooth(d,9), rds=Z(N); let rb=1; for(let i=0;i<N;i++){ if(i%Math.round(SR/59.4)===0) rb=ri(2)*2-1; rds[i]=rb; } const rs=smooth(rds,40);
  for(let i=0;i<N;i++){ const t=i/SR; x[i]=mono[i]*(0.6+0.4*Math.sin(TAU*1.3*t))+0.1*Math.sin(TAU*950*t)+0.5*diff[i]*Math.sin(TAU*1900*t)+0.05*rs[i]*Math.sin(TAU*2850*t); }
  return addNoise(x,0.002); };
G.dcf77=()=>{ const N=6*SR, x=Z(N); for(let i=0;i<N;i++){ const t=i/SR, s=Math.floor(t), ph=t-s; let env=1; if(s<5){ const len=(s%2?0.2:0.1); if(ph<len) env=0.15; } x[i]=env*Math.cos(TAU*1000*t); } return addNoise(x,0.01); };
G.ofdm=()=>{ const N=4*SR, x=Z(N), K=60;
  for(let k=0;k<K;k++){ const fk=FC-2000+k*4000/K, p0=rnd()*TAU; let s=0; for(let i=0;i<N;i++){ if(i%(SR/40)===0) s=ri(2); x[i]+=Math.cos(TAU*fk*i/SR+p0+Math.PI*s)/K*4; } }
  return addNoise(x,0.02); };
G.dsss=()=>{ const N=4*SR, x=Z(N); let c=1; for(let i=0;i<N;i++){ if(i%6===0) c=ri(2)*2-1; x[i]=0.5*c*Math.cos(TAU*FC*i/SR); } return addNoise(x,0.35); };

/* ---- bonus : sons de l'espace ---- */
function lpNoise(n,w){ const a=Z(n); for(let i=0;i<n;i++) a[i]=gauss(); return smooth(a,w); }
G.hline=()=>{ const N=6*SR, x=Z(N);
  for(const [fc,sd,a,K] of [[2900,70,0.008,160],[3160,45,0.006,120]]) for(let k=0;k<K;k++){ const f=fc+sd*gauss(), p=rnd()*TAU, w=TAU*f/SR; for(let i=0;i<N;i++) x[i]+=a*Math.cos(w*i+p); }
  return addNoise(x,0.3); };
G.sun=()=>{ const N=6*SR, x=Z(N), lp=lpNoise(N,15);
  for(const [t0,a] of [[0.4,1],[1.9,0.7],[2.5,1.2],[4.1,0.9],[4.6,0.6]]){ const i0=Math.round(t0*SR), L=Math.round(1.1*SR); let ph=0;
    for(let j=0;j<L&&i0+j<N;j++){ const t=j/SR, fc=300+5300*Math.exp(-t/0.28), env=Math.min(1,t/0.04)*Math.exp(-t/0.6); ph+=TAU*fc/SR; x[i0+j]+=a*4*env*lp[i0+j]*Math.cos(ph); } }
  return addNoise(x,0.25); };
G.jupiter=()=>{ const N=7*SR, x=Z(N), lp=lpNoise(N,4);
  let e=0, tgt=0; for(let i=0;i<Math.round(3.4*SR);i++){ if(i%Math.round(SR*0.35)===0) tgt=rnd()<0.5?0.15:0.6+rnd()*0.6; e+=(tgt-e)*0.0004; x[i]+=e*3*lp[i]*Math.cos(TAU*3000*i/SR); }
  let t=3.6; while(t<6.8){ const n=4+ri(8); for(let k=0;k<n;k++){ const i0=Math.round((t+k*0.012)*SR), L=Math.round(0.018*SR), f0=4200+rnd()*600; let ph=0;
      for(let j=0;j<L&&i0+j<N;j++){ const f=f0-60000*j/SR; ph+=TAU*f/SR; x[i0+j]+=0.8*Math.sin(Math.PI*j/L)*Math.cos(ph); } } t+=0.15+rnd()*0.35; }
  return addNoise(x,0.12); };
G.pulsar=()=>{ const N=6*SR, x=Z(N), P=0.714, K=0.12/(1/(500*500)-1/(5500*5500));
  for(let t0=0.3;t0<5.9;t0+=P){ const i0=Math.round(t0*SR), L=Math.round(0.12*SR); let ph=0;
    for(let j=0;j<L&&i0+j<N;j++){ const f=1/Math.sqrt(j/SR/K+1/(5500*5500)); ph+=TAU*f/SR; x[i0+j]+=0.6*Math.cos(ph)*Math.min(1,j/30); } }
  return addNoise(x,0.15); };
G.meteor=()=>{ const N=8*SR, x=Z(N);
  const ping=(t0,dur,f0,drift,a,head)=>{ const i0=Math.round(t0*SR); let ph=0;
    if(head){ const H=Math.round(0.15*SR); for(let j=0;j<H;j++){ const f=f0+260*(1-j/H); ph+=TAU*f/SR; const ii=i0-H+j; if(ii>=0) x[ii]+=0.35*a*Math.cos(ph)*(j/H); } }
    const L=Math.round(dur*4*SR); for(let j=0;j<L&&i0+j<N;j++){ const t=j/SR, f=f0+drift*t; ph+=TAU*f/SR; const env=Math.min(1,t/0.004)*Math.exp(-t/dur)*(dur>0.8?(0.7+0.3*Math.sin(TAU*1.7*t)):1); x[i0+j]+=a*env*Math.cos(ph); } };
  ping(0.8,0.12,1000,0,1,false); ping(2.3,0.25,1000,0,1,true); ping(3.5,0.06,1000,0,0.7,false); ping(4.6,0.9,1000,8,0.9,false); ping(7.1,0.1,1000,0,0.8,false);
  return addNoise(x,0.05); };
G.whistler=()=>{ const N=6*SR, x=Z(N), D=40.4;
  for(let k=0;k<70;k++){ const i=ri(N-4), a=0.5+rnd()*2; x[i]+=a; x[i+1]-=a*0.6; x[i+2]+=a*0.2; }
  for(const t0 of [0.6,3.2]){ const i0=Math.round(t0*SR); x[i0]+=4; x[i0+1]-=3; let ph=0; const L=Math.round(1.9*SR);
    for(let j=0;j<L&&i0+j<N;j++){ const t=j/SR, f=Math.pow(D/(t+D/Math.sqrt(5800)),2); ph+=TAU*f/SR; const env=Math.min(1,t/0.05)*Math.exp(-t/0.9); x[i0+j]+=0.5*env*Math.cos(ph); } }
  return addNoise(x,0.05); };
G.chorus=()=>{ const N=6*SR, x=Z(N);
  for(let k=0;k<45;k++){ const i0=ri(N-SR), d=0.2+rnd()*0.25, L=Math.round(d*SR), f0=1100+rnd()*900, df=900+rnd()*900, a=0.25+rnd()*0.4; let ph=0;
    for(let j=0;j<L;j++){ const u=j/L, f=f0+df*u*u; ph+=TAU*f/SR; x[i0+j]+=a*Math.sin(Math.PI*u)*Math.cos(ph); } }
  return addNoise(x,0.05); };
G.sputnik=()=>{ const N=Math.round(4.8*SR), key=Z(N); for(let i=0;i<N;i++){ const t=i/SR; key[i]=(t>0.2&&(t-0.2)%0.6<0.3)?1:0; }
  const a=1-Math.exp(-1/(SR*0.004)); let e=0; const x=Z(N); for(let i=0;i<N;i++){ e+=(key[i]-e)*a; x[i]=0.7*e*Math.cos(TAU*1000*i/SR); } return addNoise(x,0.08); };
G.doppler=()=>{ const N=12*SR, fi=Z(N); for(let i=0;i<N;i++){ const t=i/SR; fi[i]=1000-600*Math.tanh((t-6)/1.4); } return addNoise(fm(fi,0.6),0.12); };
G.apt=()=>{ const N=6*SR, x=Z(N), W=2080, Tw=0.5/W;
  for(let i=0;i<N;i++){ const t=i/SR, line=Math.floor(t/0.5), w=Math.floor((t%0.5)/Tw); let v;
    if(w<39) v=((w%4)<2)?1:0.1; else if(w<86) v=0.05; else if(w<995){ const u=(w-86)/909; v=0.25+0.45*Math.sin(u*9+line*0.4)*Math.sin(u*3)+0.25*(u>0.6&&u<0.8?1:0); }
    else if(w<1040) v=(line%8)/8; else if(w<1079) v=(((w-1040)%5)<3)?1:0.1; else if(w<1126) v=0.9; else if(w<2035){ const u=(w-1126)/909; v=0.7-0.4*Math.sin(u*9+line*0.4)*Math.sin(u*3); } else v=(line%8)/8;
    x[i]=(0.1+0.9*Math.max(0,Math.min(1,v)))*Math.sin(TAU*2400*t); }
  return addNoise(x,0.03); };
G.eme=()=>{ const N=Math.round(7.5*SR), x=Z(N), u=0.12, keyT=[[0.3,3],[0.3+4*u,1],[0.3+6*u,3]];
  const env=t=>{ let e=0; for(const [s,l] of keyT){ const a=s, b=s+l*u; if(t>=a&&t<b) e=Math.min(1,(t-a)/0.005,(b-t)/0.005); } return e; };
  const comps=[]; for(let k=0;k<6;k++) comps.push([1040+12*gauss(),rnd()*TAU]);
  for(let i=0;i<N;i++){ const t=i/SR; x[i]=0.7*env(t)*Math.cos(TAU*1000*t); const e2=env(t-2.5); if(e2>0){ let s=0; for(const [f,p] of comps) s+=Math.cos(TAU*f*t+p); x[i]+=0.05*e2*s*(0.6+0.4*Math.sin(TAU*0.8*t)); } }
  return addNoise(x,0.03); };

/* ---- signaux ajoutés : livre, espace, curiosités ---- */
function morseKey(text,u,t0,f){ // liste de [début, fin] en secondes
  const out=[]; let t=t0; for(const w of text.split(" ")){ for(const c of w){ for(const s of MORSE[c]){ const d=s==="."?u:3*u; out.push([t,t+d]); t+=d+u; } t+=2*u; } t+=4*u; } return {seg:out,end:t}; }
function keyEnv(seg,t){ for(const [a,b] of seg) if(t>=a&&t<b) return Math.min(1,(t-a)/0.004,(b-t)/0.004); return 0; }
G.msk144=()=>{ const N=6*SR, x=Z(N);
  for(const [t0,d,a] of [[0.6,0.35,1],[2.4,1.1,0.8],[4.5,0.2,0.9]]){ const i0=Math.round(t0*SR), L=Math.round(d*SR); let ph=0, b=0;
    for(let j=0;j<L;j++){ if(j%6===0) b=ri(2); ph+=TAU*(b?2000:1000)/SR; const t=j/SR; x[i0+j]+=a*Math.min(1,t/0.003)*Math.exp(-3*t/d)*Math.cos(ph); } }
  return addNoise(x,0.06); };
G.jt65=()=>{ const N=20*SR, x=Z(N), Ts=4096/11025, df=11025/4096, f0=1270.5; let ph=0, s=0, nx=0, k=0;
  const sync=[]; for(let i=0;i<126;i++) sync.push(rnd()<0.5);
  for(let i=Math.round(0.5*SR);i<N;i++){ if(i-Math.round(0.5*SR)>=nx){ s=sync[k%126]?0:2+ri(64); k++; nx+=Ts*SR; } ph+=TAU*(f0+df*s)/SR; x[i]=0.6*Math.cos(ph); }
  return addNoise(x,0.2); };
G.tetra=()=>{ const N=4*SR, re=Z(N), im=Z(N); let a=0, b=0, ph=0; const sps=2;
  for(let i=0;i<N;i++){ if(i%sps===0){ ph+=Math.PI/4*(2*ri(4)+1); a=Math.cos(ph); b=Math.sin(ph); } re[i]=a; im[i]=b; }
  const k=hannK(9), r=conv(re,k), q=conv(im,k), x=Z(N); for(let i=0;i<N;i++){ const p=TAU*FC*i/SR; x[i]=r[i]*Math.cos(p)-q[i]*Math.sin(p); }
  return addNoise(x,0.03); };
G.ndb=()=>{ const {seg,end}=morseKey("OB",0.1,0.3), N=Math.round((end+0.8)*SR), x=Z(N);
  for(let i=0;i<N;i++){ const t=i/SR; x[i]=0.5*Math.cos(TAU*FC*t)+0.45*keyEnv(seg,t)*(Math.cos(TAU*(FC-1020)*t)+Math.cos(TAU*(FC+1020)*t)); }
  return addNoise(x,0.02); };
G.vor=()=>{ const N=5*SR, x=Z(N), {seg}=morseKey("OBR",0.06,1.5); let ph=0; // audio démodulé, échelle ÷ 2
  for(let i=0;i<N;i++){ const t=i/SR; ph+=TAU*(4980+240*Math.cos(TAU*15*t))/SR; x[i]=0.5*Math.cos(TAU*15*t)+0.4*Math.cos(ph)+0.35*keyEnv(seg,t)*Math.cos(TAU*510*t); }
  return addNoise(x,0.01); };
G.ils=()=>{ const N=5*SR, x=Z(N), {seg}=morseKey("IOB",0.07,1.2);
  for(let i=0;i<N;i++){ const t=i/SR; x[i]=0.4*Math.cos(TAU*90*t)+0.4*Math.cos(TAU*150*t)+0.35*keyEnv(seg,t)*Math.cos(TAU*1020*t); }
  return addNoise(x,0.01); };
G.m10=()=>{ const N=4*SR, x=Z(N), hk=hannK(4);
  for(let s=0;s<4;s++){ const i0=Math.round((0.2+s)*SR), L=Math.round(0.11*SR), d=Z(L); let b=0; for(let j=0;j<L;j++){ if(j%Math.round(SR/4800)===0) b=ri(2)*2-1; d[j]=b; }
    const sm=conv(d,hk), fi=Z(L); for(let j=0;j<L;j++) fi[j]=FC+300*s+1300*sm[j]; const y=fm(fi), r=ramp(L,0.002); for(let j=0;j<L;j++) x[i0+j]+=y[j]*r[j]; }
  return addNoise(x,0.05); };
G.tpms=()=>{ const N=4*SR, x=Z(N);
  for(const t0 of [0.5,0.62,2.6]){ const i0=Math.round(t0*SR), L=Math.round(0.03*SR); let ph=0, b=0;
    for(let j=0;j<L;j++){ if(j%3===0) b=ri(2); ph+=TAU*(FC+(b?900:-900))/SR; x[i0+j]+=Math.cos(ph)*Math.min(1,j/10,(L-j)/10); } }
  return addNoise(x,0.04); };
G.als162=()=>{ const N=6*SR, x=Z(N); let jit=0;
  for(let i=0;i<N;i++){ const t=i/SR, f=t%1; if(i%Math.round(SR/400)===0) jit=(f<0.1||(f<0.2&&Math.floor(t)%2))?(rnd()<0.5?-1:1):0; x[i]=Math.cos(TAU*FC*t+0.25*jit); }
  return addNoise(x,0.03); };
G.wwv=()=>{ const N=6*SR, x=Z(N);
  for(let i=0;i<N;i++){ const t=i/SR, f=t%1, s=Math.floor(t); let v=0;
    if(f<0.005) v+=0.9*Math.sin(TAU*1000*t); if(f>0.03&&f<0.97) v+=0.3*Math.sin(TAU*500*t);
    const bit=[0.2,0.5,0.8,0.2,0.5,0.2][s]; v+=(f<bit?0.25:0.06)*Math.sin(TAU*100*t); x[i]=v; }
  return addNoise(x,0.02); };
G.msf=()=>{ const N=6*SR, x=Z(N), offs=[0.5,0.1,0.2,0.1,0.3,0.1];
  for(let i=0;i<N;i++){ const t=i/SR, s=Math.floor(t), f=t-s; x[i]=(f<offs[s]?0:1)*Math.cos(TAU*1000*t); }
  return addNoise(x,0.02); };
G.type2=()=>{ const N=6*SR, x=Z(N), lp=lpNoise(N,25); let p1=0, p2=0;
  for(let i=0;i<N;i++){ const t=i/SR, f1=2600*Math.exp(-t/7), env=Math.min(1,t/0.4)*(0.6+0.4*Math.sin(TAU*1.3*t)); p1+=TAU*f1/SR; p2+=TAU*2*f1/SR;
    x[i]=env*lp[i]*3*(Math.cos(p1)+0.7*Math.cos(p2)); }
  return addNoise(x,0.2); };
G.tweeks=()=>{ const N=6*SR, x=Z(N);
  for(const t0 of [0.4,1.3,1.9,3.0,3.8,4.9]){ const i0=Math.round(t0*SR); x[i0]+=3; x[i0+1]-=2; let p1=0,p2=0; const L=Math.round(0.12*SR);
    for(let j=0;j<L;j++){ const t=j/SR, f=1750/Math.sqrt(1-Math.exp(-t/0.012)*0.92); p1+=TAU*f/SR; p2+=TAU*2*f/SR; const e=Math.exp(-t/0.04); x[i0+j]+=0.6*e*Math.cos(p1)+0.25*e*Math.cos(p2); } }
  for(let k=0;k<40;k++){ const i=ri(N-3), a=0.3+rnd(); x[i]+=a; x[i+1]-=a*0.5; }

G.hiss=()=>{ const N=6*SR, x=Z(N), lp=lpNoise(N,6);

G.aurora=()=>{ const {seg,end}=morseKey("CQ CQ",0.07,0.3), N=Math.round((end+0.4)*SR), lp=lpNoise(N,60), x=Z(N);

G.galactic=()=>{ const N=12*SR, x=Z(N); for(let i=0;i<N;i++){ const t=i/SR, l=0.15+0.25*Math.pow(Math.sin(Math.PI*t/12),2); x[i]=l*gauss(); }

G.cubesat=()=>{ const N=10*SR, x=Z(N), hk=hannK(6);

    const c=FC+1800*Math.tanh((5-t0)/2.5), sm=conv(d,hk), fi=Z(L); for(let j=0;j<L;j++) fi[j]=c+700*sm[j]; const y=fm(fi), r=ramp(L); for(let j=0;j<L;j++) x[i0+j]+=y[j]*r[j]; }

G.issfm=()=>{ const N=10*SR, v=voice(N), fi=Z(N); for(let i=0;i<N;i++){ const t=i/SR; fi[i]=FC+1500*Math.tanh((5-t)/2)+1200*v[i]; }
  const x=fm(fi); for(let i=0;i<N;i++){ const t=i/SR; if(t<0.3||t>9.7) x[i]=0; } return addNoise(x,0.08); };
G.buzzer=()=>{ const N=Math.round(7.2*SR), x=Z(N); let ph=0;
  for(let i=0;i<N;i++){ const t=i/SR, f=t%2.4; x[i]=0.15*Math.cos(TAU*1000*t); if(f<1.1){ ph+=TAU*25/SR; let s=0; for(let h=1;h<=60;h++) s+=Math.cos(h*ph)/Math.sqrt(h); x[i]+=0.08*s*Math.min(1,f/0.02,(1.1-f)/0.02); } }
  return addNoise(x,0.05); };
G.pip=()=>{ const N=5*SR, x=Z(N); for(let i=0;i<N;i++){ const t=i/SR, f=(t*9)%1; if(f<0.25) x[i]=Math.sin(Math.PI*f/0.25)*Math.cos(TAU*1000*t); } return addNoise(x,0.08); };
G.squeaky=()=>{ const N=6*SR, x=Z(N); let ph=0;
  for(let i=0;i<N;i++){ const t=i/SR, f=t%1; let fr=0, a=0; if(f<0.15){ fr=1100; a=1; } else if(f>0.2&&f<0.42){ fr=900+700*(f-0.2)/0.22; a=1; }

const W=600;
function spectrumRaw(sig,center,m){
  const n=m.nfft, P=fftPlan(n), re=P.re, im=P.im, st=center-(n>>1);

  fft(re,im,P.rev); const binHz=SR/n, row=new Float32Array(W), [f0,f1]=m.span, norm=P.ws*P.ws;
  const pw=b=>(re[b]*re[b]+im[b]*im[b])/norm;

    if(bb-ba<1){ const c=(ba+bb)/2, i0=Math.floor(c), u=c-i0; p=pw(i0)*(1-u)+pw(Math.min(n/2,i0+1))*u; }
    else { p=0; for(let b=Math.floor(ba);b<=Math.floor(bb)&&b<=n/2;b++){ const v=pw(b); if(v>p) p=v; } }
    row[x]=10*Math.log10(p+1e-14); }
  return row;
}

      lastRow++; added++; last=row; }
    if(added===8) lastRow=target;
    if(last){ if(!peak) peak=Float32Array.from(last); else for(let x=0;x<W;x++) peak[x]=Math.max(last[x],peak[x]-0.006); drawSpectrum(last); }
    const p=(src.loop?el%dur:Math.min(el,dur))/dur; fctx.putImageData(fpImage,0,0); fctx.fillStyle=P().head; fctx.fillRect(0,Math.round(p*fp.height),W,2); }
  requestAnimationFrame(tick);
}

/* ================= interface ================= */
[sp,wf,fp].forEach(cv=>{
  cv.addEventListener("pointermove",e=>{ if(!current) return; const r=cv.getBoundingClientRect(), u=(e.clientX-r.left)/r.width, m=current;
    const f=(m.span[0]+u*(m.span[1]-m.span[0]))*m.scale, w=(m.span[1]-m.span[0])*m.scale;
    document.getElementById("ro1").textContent=w>=4000?(f/1000).toLocaleString(LOC,{maximumFractionDigits:2})+" kHz":f.toLocaleString(LOC,{maximumFractionDigits:w<100?1:0})+" Hz"; });
  cv.addEventListener("pointerleave",()=>document.getElementById("ro1").textContent="—");
});
const aside=document.getElementById("modes");
function buildAside(){ aside.textContent=""; aside.setAttribute("aria-label",t("signals"));
  const cnt=document.createElement("p"); cnt.className="count"; cnt.textContent=MODES.length+" "+t("signals").toLocaleLowerCase(LOC); aside.appendChild(cnt);
  const groups=(I18N[LG]&&I18N[LG].groups)||I18N.fr.groups;
  groups.forEach((g,gi)=>{ const ms=MODES.filter(m=>m.gi===gi); if(!ms.length) return;
    const d=document.createElement("div"); d.className="group"; d.innerHTML=`<h2>${esc(g)}</h2><ul></ul>`;
    ms.forEach(m=>{ const x=tx(m), li=document.createElement("li");
      li.innerHTML=`<button class="mode" type="button" data-id="${m.id}" aria-pressed="${String(!quiz&&current===m)}">${esc(x.name)}<span>${esc(x.short)}</span></button>`;
      li.firstChild.addEventListener("click",()=>{ quiz=null; select(m); play(); }); d.querySelector("ul").appendChild(li); });
    aside.appendChild(d); }); }
function setLang(l){ if(!I18N[l]) l="fr"; LG=l; LOC=(LANGS.find(x=>x[0]===l)||LANGS[0])[2]; document.documentElement.lang=l;
  const sel=document.getElementById("lang"); sel.value=l;
  const T={tTitle:"title",tLang:"lang",mystery:"mystery",play:"play",stop:"stop",tNoise:"noise",tVol:"volume",tLoop:"loop",tSpecwf:"specwf",tCursor:"cursor",tFoot:"footprint",tF1:"f1",tF2:"f2"};
  for(const id in T) document.getElementById(id).textContent=t(T[id]);
  document.getElementById("night").textContent=t(NIGHT?"day":"night");
  document.title=t("title")+" · VSISA";
  try{ localStorage.setItem("idmr-lang",l); }catch(e){}
  if(location.hash.slice(1)!==l){ try{ history.replaceState(null,"","#"+l); }catch(e){} }
  buildAside();
  if(current){ setNow(current,!!quiz); document.getElementById("spanLbl").textContent=spanText(current); ruler("ruler1"); ruler("ruler2");
    if(quiz) renderQuiz(); else renderInfo(current,""); if(!playing){ restSpectrum(); blankWaterfall(t("press")); }
    const d=signal.length/SR; document.getElementById("dur").textContent=t("dur").replace("{s}",d.toLocaleString(LOC,{minimumFractionDigits:1,maximumFractionDigits:1})); } }
(function(){ const sel=document.getElementById("lang"); LANGS.forEach(([c,n])=>{ const o=document.createElement("option"); o.value=c; o.textContent=n; sel.appendChild(o); });
  sel.addEventListener("change",()=>setLang(sel.value)); })();
function setNight(on){ NIGHT=!!on; LUT=NIGHT?LUT_NIGHT:LUT_DAY; document.documentElement.classList.toggle("night",NIGHT);
  const b=document.getElementById("night"); b.textContent=t(NIGHT?"day":"night"); b.setAttribute("aria-pressed",String(NIGHT));
  try{ localStorage.setItem("idmr-night",NIGHT?"1":"0"); }catch(e){}
  if(current&&signal){ analyse(); if(!playing) blankWaterfall(t("press")); } }
document.getElementById("night").addEventListener("click",()=>setNight(!NIGHT));
document.getElementById("play").addEventListener("click",play);
document.getElementById("stop").addEventListener("click",stop);
document.getElementById("mystery").addEventListener("click",mystery);
document.getElementById("vol").addEventListener("input",e=>{ if(gain) gain.gain.value=e.target.value/100*0.8; });
document.getElementById("loop").addEventListener("change",e=>{ if(src) src.loop=e.target.checked; });
document.getElementById("noise").addEventListener("change",()=>{ if(!current) return; const was=playing, hidden=!!quiz; stop();
  signal=buildSignal(current); analyse(); if(was) play(); else blankWaterfall(t("press")); if(hidden) renderQuiz(); });

let lg0=location.hash.slice(1);
if(!I18N[lg0]){ try{ lg0=localStorage.getItem("idmr-lang")||""; }catch(e){ lg0=""; } }
if(!I18N[lg0]){ const nl=(navigator.language||"fr").slice(0,2).toLowerCase(); lg0=I18N[nl]?nl:"en"; }
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(I18N[h]&&h!==LG) setLang(h); });
let start=MODES.find(m=>m.id==="psk31");
try{ const s=localStorage.getItem("idmr-mode"); const f=MODES.find(m=>m.id===s); if(f) start=f; }catch(e){}
try{ NIGHT=localStorage.getItem("idmr-night")==="1"; }catch(e){}
setLang(lg0);
setNight(NIGHT);
select(start);
})();
