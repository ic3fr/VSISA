"BPM","sh":"2,5–15 MHz","t":"Tijdsignaal BPM (China)","h":"Het station Pucheng (Shaanxi) zendt in AM op 2,5, 5, 10 en 15 MHz: elke seconde een tik van 10 ms op 1000 Hz (300 ms op de minuut) en, op bepaalde minuten, tikken van 100 ms voor de UT1-tijd. De roepnaam BPM komt in morse en daarna met een stem.","l":"In het gedemoduleerde geluid: de roepnaam, dan heel korte streepjes op 1000 Hz, één per seconde, met een langere op de minuut. Vaak gemengd met WWV op dezelfde frequenties.","n":"ingekort fragment"},"humpback":{"nm":"Bultrug","sh":"zang","t":"De zang van de bultrug","h":"In de winter zingen de mannetjes in de voortplantingsgebieden: een reeks kreunen, brommen en roepen die een thema vormt, urenlang gelijk herhaald en van seizoen tot seizoen anders. Hydrofoons horen hem op tientallen kilometers.","l":"Dikke sporen met hun harmonischen, die langzaam stijgen of dalen tussen 100 Hz en enkele kHz; dezelfde reeks komt na een paar seconden terug. Echo's van het oppervlak en de bodem rekken elke noot."},"bluewhale":{"nm":"Blauwe vinvis","sh":"×10","t":"De blauwe vinvis: de laagste roep","h":"Het grootste dier ter wereld maakt zeer lage (10 tot 40 Hz) en zeer krachtige roepen, 10 tot 20 seconden lang en urenlang herhaald: ze dragen honderden kilometers ver. Om ze te horen wordt de opname tien keer versneld.","l":"Een gepulst deel, dan een lange toon die nauwelijks daalt, met zijn harmonischen erboven; de reeks herhaalt zich. De schaal geeft de echte frequenties.","n":"10× versneld"},"finwhale":{"nm":"Gewone vinvis","sh":"20 Hz","t":"De gewone vinvis: de pulsen van 20 Hz","h":"De gewone vinvis maakt pulsen van ongeveer een seconde die van zo'n 25 naar 18 Hz dalen, met regelmatige tussenpozen, soms dagenlang. In de jaren 1950-60 verbaasden deze „20 Hz-signalen” de luisternetten van de Amerikaanse marine, tot ze aan deze walvis werden toegeschreven.","l":"Korte streepjes, allemaal gelijk, in een regelmatige reeks of per paar, als de slagen van een heel traag hart; elk daalt licht in frequentie. De schaal geeft de echte frequenties.","n":"10× versneld"},"sperm":{"nm":"Potvis","sh":"klikken","t":"De klikken van de potvis","h":"De potvis jaagt tijdens diepe duiken met zijn sonar: zeer krachtige klikken, ongeveer één per seconde, die versnellen tot een „kraken” als hij zijn prooi nadert. Onderling wisselen potvissen „coda's” uit, korte klikreeksen waarvan het ritme per clan verschilt.","l":"Horizontale strepen over de hele breedte, regelmatig verdeeld, dan dicht opeen tot een zoemen (het kraken), dan een klein ritmisch patroon: de coda. Elke klik bestaat uit meerdere vlak opeenvolgende pulsen, door weerkaatsingen in de kop van het dier."},"dolphin":{"nm":"Tuimelaar","sh":"fluiten","t":"Fluitjes en klikken van de dolfijn","h":"De tuimelaar fluit tussen ongeveer 5 en 20 kHz; elk dier heeft een „signatuurfluit” die als naam dient. Om te jagen en zich te oriënteren zendt hij ook reeksen heel korte klikken uit, tot enkele honderden per seconde.","l":"Dunne curven die stijgen en weer dalen, vaak gelijk herhaald, en salvo's horizontale strepen voor echolocatie. De frequenties zijn door 3 gedeeld om hoorbaar te blijven; de schaal geeft de echte waarden.","n":"3× lager afgespeeld"},"orca":{"nm":"Orka","sh":"pulsroepen","t":"De pulsroepen van de orka","h":"Orka's communiceren met gepulste roepen: reeksen pulsen zo snel (500 tot 2000 per seconde) dat je ze als een toon hoort, met een plotse sprong in toonhoogte. Elke familiegroep heeft zijn eigen „dialect”.","l":"Een stapel evenwijdige sporen (de harmonischen) die samen stijgen of dalen, met een scherpe knik midden in de roep; soms een dun, hoger fluitje."},"bseal":{"nm":"Baardrob","sh":"triller","t":"De triller van de baardrob","h":"In de lente, onder het Arctische pakijs, maakt het mannetje lange trillers die spiraalsgewijs dalen van enkele kHz tot een paar honderd hertz, soms een hele minuut lang. Ze dienen om een territorium te verdedigen en vrouwtjes te lokken.","l":"Een golvende curve die van boven naar onder over de schaal glijdt, als een veer die ontspant, en een lage toon aan het eind.","n":"ingekort"},"shrimp":{"nm":"Pistoolgarnalen","sh":"rif","t":"Pistoolgarnalen (knalkreeftjes)","h":"Als de garnaal zijn grote schaar dichtklapt, schiet hij een waterstraal zo snel weg dat er een cavitatiebel ontstaat; als die implodeert, knalt ze als een schot. Duizenden garnalen vormen het achtergrondgeluid van riffen en kunnen sonar storen.","l":"Een regen van stippen en korte horizontale streepjes over de hele breedte, zonder enige orde; in de koptelefoon een voortdurend geknetter, als bakken in de pan."},"sonar":{"nm":"Actieve sonar","sh":"ping","t":"De ping van een actieve sonar","h":"Een schip zendt een krachtige geluidspuls uit (hier rond 3,5 kHz, het bereik van de rompsonars van fregatten) en luistert naar de echo: de vertraging geeft de afstand, de frequentieverschuiving (dopplereffect) de snelheid van het doel. Het geluid komt ook als een sleep terug van bodem en oppervlak: de nagalm.","l":"Een korte, sterke streep, een sleep die uitdooft, dan de echo, veel zwakker en iets verschoven in frequentie. De tweede ping is een frequentiezwaai (chirp), die de afstand beter meet."},"propeller":{"nm":"Scheepsschroef","sh":"cavitatie","t":"De schroef van een passerend schip","h":"De schroefbladen veroorzaken cavitatiebellen die imploderen: een breed geruis dat klopt op het ritme van de voorbijkomende bladen. De machines voegen vaste lijnen toe. Sonaroperators analyseren dat ritme (DEMON-analyse) om bladen en toerental te tellen en het schip te herkennen.","l":"Geruis over een brede band, gestreept met horizontale banden op het ritme van de bladen, met enkele vaste verticale lijnen (motor, tandwielkast). Alles zwelt aan en dooft dan uit als het schip over de hydrofoon vaart."},"uqc":{"nm":"Onderwatertelefoon","sh":"UQC 8 kHz","t":"De onderwatertelefoon (UQC, „Gertrude”)","h":"Onderzeeërs en schepen praten onder water met een akoestische telefoon: de stem wordt als enkelzijband boven een draaggolf van 8,0875 kHz verzonden, uitgestraald door een transducer in de romp. Bereik: enkele kilometers.","l":"Een SSB-spraakband boven 8 kHz; gedemoduleerd een verre stem die golft en galmt door echo's van oppervlak en bodem. De weergave is gehalveerd; de schaal geeft de echte frequenties.","n":"schaal gehalveerd"},"zevs":{"nm":"ZEVS 82 Hz","sh":"ELF","t":"ZEVS: radio voor onderzeeërs op 82 Hz","h":"Radiogolven dringen nauwelijks door in zeewater, behalve bij extreem lage frequenties (ELF). De Russische zender ZEVS op het schiereiland Kola zendt op 82 Hz via antennelijnen van tientallen kilometers om diep gedoken onderzeeërs te bereiken. De snelheid is piepklein: een paar tekens per minuut.","l":"Een dunne lijn op 82 Hz naast de 50 Hz-netlijn en haar harmonischen, met storingen van onweer. In de koptelefoon een nauwelijks hoorbaar laag brommen; te ontvangen met een grote raamantenne en een geluidskaart. Het Amerikaanse equivalent op 76 Hz sloot in 2004."},"bloop":{"nm":"De „Bloop”","sh":"1997","t":"De „Bloop” (1997)","h":"In 1997 vingen hydrofoons van de NOAA in de Stille Oceaan een zeer laag, snel stijgend geluid op, dat duizenden kilometers ver te horen was. Lang een raadsel, sinds 2012 toegeschreven aan een ijsbeving: een enorme ijsberg die scheurt.","l":"Een brede band die in een paar seconden stijgt, met zijn harmonischen, en dan langzaam uitdooft. Reconstructie, 16× versneld zoals de opname die de NOAA uitbracht.","n":"16× versneld"}}},"cs":{"ui":{"title":"VSISA","mystery":"Záhadný zvuk","play":"▶ Poslouchat","stop":"■ Stop","noise":"Šum","volume":"Hlasitost","loop":"Opakovat","specwf":"Spektrum + vodopád","cursor":"kurzor","footprint":"Otisk","dur":"{s} s shora dolů","avg":"průměr za celý signál","press":"Stiskni Poslouchat: signál poběží tady","count":"{n} signálů v pořadí listu 6","myst":"Záhadný režim","mystTags":"Poslouchej a dívej se, pak vyber správnou odpověď","quizH":"Který je to signál?","quizLead":"Spusť poslech, sleduj spektrum, vodopád a otisk a odpověz.","score":"Skóre","good":"Správně!","bad":"Vedle: byl to {x}.","next":"Další záhadný zvuk","principle":"Princip","screen":"Na obrazovce","sheet":"list","book":"Kniha: list {r}","lang":"Jazyk","signals":"Signály","f1":"Signály simulované přímo ve stránce (12 000 vzorků za sekundu): signály listu 6 knihy OpenBookRadio, další signály z knihy a bonusy. U rádiových signálů (AM, FM, AIS, LoRa…) je vidět simulovaný mezifrekvenční kmitočet jako na obrazovce SDR; některé jsou zmenšené nebo zrychlené, je to uvedeno. U AM, SSB, FM, FM sterea, ISS a úniku slyšíš demodulovaný zvuk jako z reproduktoru přijímače a obrazovka ukazuje rádiový signál; hlas je syntetický a neříká skutečná slova.","f2":"Čas ve vodopádu i v otisku běží dolů. Licence CC BY-NC-SA 4.0, zdarma, neprodávat.","night":"Noční režim","day":"Denní režim","visits":"návštěvy","plays":"přehrání","book_dl":"Stáhnout knihu","book_dl2":"Stáhnout knihu OpenBookRadio (zdarma, PDF a EPUB, 13 jazyků)","display":"Zobrazení","theme_day":"Den","theme_night":"Noc (červená)","theme_phos":"Zelený fosfor","theme_phosb":"Modrý fosfor","theme_phosa":"Oranžový fosfor","w3d":"3D vodopád","w3dHint":"tažením otočíte"},"groups":["Analogový hlas","Telegrafie","Data","Obrázky","Letectví, námořnictví a záchrana","Volání, subtóny a pagery","Radiosondy, senzory a připojená zařízení","KV druhy provozu a zajímavosti","Vysílání a čas","Široké pásmo","Bonus: zvuky z vesmíru","Bonus: kuriozity krátkých vln","Bonus: podvodní zvuky"],"modes":{"am":{"sh":"rozhlas","t":"AM: amplitudová modulace","h":"Síla nosné sleduje zvuk: křivka se „nafukuje“ a „splaskává“.","l":"Pevná čára uprostřed (nosná) a po obou stranách dvě stejná postranní pásma. Šířka asi 6 až 9 kHz. Rozhlas na krátkých a středních vlnách, letectví (listy 12 a 14).","r":[["Poslech","Znělka a pak moderátor na hudebním podkladu. Obě postranní pásma jsou zrcadlová: po obou stranách nosné je vidět melodie a pak hlas."]]},"ssb":{"t":"SSB: jedno postranní pásmo","h":"Zbude jen jedno postranní pásmo, bez nosné: když nikdo nemluví, není nic.","l":"Žádná středová čára, jediné pásmo asi 2,7 kHz, které žije jen při řeči. USB nad 10 MHz, LSB pod (radioamatéři). Špatně naladěný hlas zní jako „kachna“ (listy 11 a 29)."},"fm":{"sh":"hlas","t":"FM: kmitočtová modulace","h":"Amplituda zůstává stejná; kmity se se zvukem zhušťují nebo řídnou.","l":"Signál tančí kolem svého kmitočtu, při hlasitém zvuku je širší: 12,5 kHz na kanál u úzkopásmové FM (vysílačky, převáděče), 200 kHz u rozhlasu FM (listy 2 a 13).","r":[["Poslech","Na konci krátké „kšš“: squelch se zavře, když vysílač přestane vysílat."]]},"cw":{"t":"CW: Morseova abeceda","h":"Nosná se zapíná a vypíná: čárky a tečky.","l":"Velmi tenká čára přerušovaná v rytmu morseovky; pípání v uchu. Zde „CQ“ (list 48).","r":[["Rychlost","20 slov/min, tečka 60 ms, na 700 Hz: „CQ CQ CQ DE F4ABC K“"],["Sluchem","Čistá pípnutí, dlouhá a krátká, jediný tón"],["Dekódování","Sluchem, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: dva kmitočty","h":"Kmitočet skáče mezi dvěma hodnotami, jednou pro 0, druhou pro 1.","l":"Dvě rovnoběžné čáry: 170 Hz od sebe u radioamatérů (45,45 Bd), 450 nebo 850 Hz u meteozpráv. Pravidelné „tidilidi“ (list 32).","r":[["Kód","Baudot ITA2: 5 bitů + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Text","RYRYRYRY CQ CQ DE F4ABC"],["Dekódování","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 Bd: APRS a packet","h":"Dva zvukové tóny, 1200 a 2200 Hz, přivedené do FM vysílače.","l":"Za FM přijímačem (zvuk z reproduktoru): pásmo od 1200 do 2200 Hz v krátkých dávkách. V uchu sekundové „grrrt“ (listy 35 a 36).","r":[["Kmitočet","144,800 MHz v Evropě (APRS), FM"],["Rámec","Příznaky 0x7E, pak data AX.25 v NRZI"],["Dekódování","Direwolf, multimon-ng, KISS TNC"]]},"psk31":{"t":"PSK31: fázová modulace","h":"Kmitočet se nemění, obrací se fáze; při každém obratu amplituda poklesne.","l":"Velmi tenká čára asi 60 Hz, trochu „spletená“. Do 3 kHz se vejdou desítky stanic (list 29).","r":[["Kód","Varicode: 0 = obrat fáze, 1 = beze změny; v klidu dvě dvojčata čar"],["Kde poslouchat","14 070 kHz, 3580 kHz"],["Dekódování","fldigi"]]},"ft8":{"t":"MFSK / FT8: osm tónů","h":"Kmitočet stoupá a klesá po krocích 6,25 Hz, 0,16 s na krok.","l":"Pásy asi 50 Hz, které trvají 12,6 s a vracejí se každých 15 s podle hodin: několik stanic najednou ve 3 kHz, například na 7,074 MHz (list 29).","r":[["Rámec","79 symbolů po 0,16 s, tři vzory Costas (začátek, střed, konec); zde osm stanic"],["Kmitočty","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Dekódování","WSJT-X, JTDX (přesný čas PC)"]]},"ft4":{"t":"FT4: FT8 pro závody","h":"Čtyři tóny 20,8 Hz od sebe, 20,8 Bd: 105 symbolů za 5 s v časových oknech 7,5 s.","l":"Pásy asi 90 Hz, kratší a širší než FT8, vracejí se každých 7,5 s. 14 080, 7047,5 kHz (list 29)."},"olivia":{"t":"Olivia 8/250: osm tónů","h":"Osm tónů 31,25 Hz od sebe, vždy jen jeden, náhodně skáčou; Walshovo kódování a prokládání.","l":"Blok rozptýlených teček na 250 Hz; dekóduje hluboko pod šumem. V uchu malá náhodná melodie (list 29)."},"hell":{"t":"Feld Hell: psaní nosnou","h":"Nosná se zapíná a vypíná bod po bodu: každé písmeno tvoří sloupce po 14 bodech, snímané zdola nahoru (245 bodů za sekundu).","l":"Ve vodopádu přerušovaná čára; písmena vykreslí až obrazovka programu (fldigi). V uchu jemné praskání (list 29)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Čtyři úrovně kmitočtu: každý symbol nese dva bity.","l":"Obdélníkový blok 6 až 12,5 kHz, plný jako šum, často v dávkách (DMR dělí kanál na dva časové sloty). V uchu chraplavé „frrr“ (list 46)."},"mt63":{"t":"MT63: tísňové zprávy (NBEMS)","h":"64 tónů najednou, každý pomalu modulovaný, s velkou nadbytečností.","l":"Plochý blok 1 nebo 2 kHz kolem 1500 Hz s ostrými okraji; pravidelný šum. Projde i mikrofonem přiloženým k reproduktoru (list 31)."},"lora":{"t":"LoRa: kmitočtové rampy (chirpy)","h":"Kmitočet přejede celou šířku a začne znovu zdola: poloha skoku nese data.","l":"Rovnoběžné úhlopříčky, snadno rozpoznatelné: Meshtastic a MeshCore na 869,525 MHz nebo 433 MHz, senzory LoRaWAN (listy 13, 23 a 24)."},"sstv":{"t":"SSTV: obrázky ve zvuku","h":"Synchronizační impulz na 1200 Hz, pak kmitočet sleduje jas řádku, od 1500 (černá) do 2300 Hz (bílá).","l":"Pravidelné synchronizační čáry a mrak, který se mění s obrázkem; „cvrlikající“ zvuk po jednu až dvě minuty. 14,230 MHz, ISS na 145,800 MHz (list 37).","r":[["Rámec","Hlavička VIS, pak řádky: synchro 1200 Hz, zelená, modrá, červená; zde 20 řádků testovacího obrazce"],["Dekódování","QSSTV, MMSSTV, Robot36 v mobilu"]]},"fax":{"nm":"Meteofax","t":"Meteofax: 1500 Hz černá, 2300 Hz bílá","h":"Kmitočet plynule přechází z černé do bílé, 120 řádků za minutu.","l":"Dvě pevná pásma na 1500 a 2300 Hz (800 Hz od sebe), pravidelné „tik-tak“. Zveřejněné kmitočty jsou kmitočty nosné: poslouchej v USB o 1,9 kHz níž (list 38).","r":[["Rámec","Startovní tón 300 Hz, fázovací řádky (bílý impulz), pak mapa"],["Dekódování","fldigi, JWX, HamFax"]]},"elt":{"nm":"Siréna ELT","t":"Siréna ELT / PLB na 121,5 MHz","h":"AM, jejíž tón klesá z 1600 na 300 Hz dvakrát až čtyřikrát za sekundu.","l":"Pevná nosná a postranní pásma klouzající jako vějíř: „ú-ú“ nouzových majáků, na 121,375 MHz i pro cvičení (listy 27 a 28)."},"406":{"nm":"Maják 406","t":"Maják 406 MHz: dávka BPSK","h":"Půl sekundy vysílání: 160 ms čisté nosné, pak se fáze přepíná o ±1,1 radiánu rychlostí 400 bit/s.","l":"Krátká čárka, která se vrací každých 50 s, mezi 406,0 a 406,1 MHz; nic užitečného k poslechu, je třeba dekodér (EPIRB 406, list 28)."},"adsb":{"t":"ADS-B / mód S (1090 MHz): impulzy","h":"Impulzy 0,5 µs, jejichž poloha nese bity (PPM); zde je časová osa silně zpomalená.","l":"Velmi krátké vodorovné čárky přes celou šířku, stovky za sekundu u letiště; je třeba SDR klíčenka (list 15).","n":"časová osa silně zpomalená"},"acars":{"t":"ACARS: AM a data MSK","h":"AM nesoucí dva tóny, 1200 a 2400 Hz, rychlostí 2400 bit/s.","l":"Půlsekundové dávky s nosnou a postranními pásmy, na 131,525, 131,725 nebo 131,825 MHz v Evropě: v uchu „brrrt“ (list 16)."},"ais":{"t":"AIS: GMSK 9600 Bd na dvou kanálech","h":"Vyhlazená FSK (GMSK) v dávkách 26 ms, jednou na 161,975 MHz, jednou na 162,025 MHz (zmenšeno).","l":"Dva sloupce krátkých čárek 50 kHz od sebe, pravidelné cvakání; čím víc lodí, tím hustší (list 19).","n":"zmenšeno"},"navtex":{"t":"NAVTEX a DSC na středních a krátkých vlnách: FSK 170 Hz","h":"Jako RTTY: dva kmitočty 170 Hz od sebe, ale 100 Bd.","l":"Dvě rovnoběžné čáry, souvislé během zprávy, na 518 a 490 kHz (NAVTEX) nebo 2187,5 kHz (digitální selektivní volání) (list 20).","r":[["Kód","SITOR-B, CCIR 476: 7 bitů se čtyřmi „1“, s opakováním FEC"],["Dekódování","fldigi, YaND"]]},"hfdl":{"t":"HFDL: letadla na krátkých vlnách","h":"PSK 1800 Bd na pomocné nosné 1440 Hz.","l":"Dávky asi 2,4 kHz mezi 2,9 a 22 MHz; šumění modemu, které přichází a odchází (list 17)."},"ctcss":{"t":"CTCSS: subtón pod hlasem","h":"Hluboký trvalý tón (67 až 254 Hz, zde 88,5 Hz) přidaný k hlasu.","l":"Ve zvuku FM přijímače: pevná čára úplně dole, pod hlasem; otevírá squelch převáděčů a vysílaček (list 10)."},"dtmf":{"sh":"2 tóny","t":"DTMF: dva tóny na klávesu","h":"Každá klávesa vyšle zároveň hluboký tón (697 až 941 Hz) a vysoký (1209 až 1633 Hz).","l":"Dvojice teček na osmi pevných sloupcích; „píp-píp“ telefonních čísel a povelů převáděčů (list 10).","r":[["Sekvence","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tónů","t":"Selcall CCIR: tóny za sebou","h":"Pět tónů po 100 ms za sebou, jeden na číslici.","l":"Malé schodiště teček, opakované; rychlé „tululululu“ k zavolání jedné určité stanice (list 33).","r":[["Sekvence","1 2 3 4 5, dvakrát; dekóduje ji i aplikace SelCall pro UV-K1"]]},"pocsag":{"sh":"pagery","t":"POCSAG a FLEX: pagery","h":"FSK ±4,5 kHz; preambule 1010… a pak data (zmenšeno).","l":"Dvě ostré čáry během preambule, pak plné pásmo; pronikavé „brrrrt“. 466,075 MHz, DAPNET 439,9875 MHz (list 45).","n":"zmenšeno"},"ale":{"sh":"8 tónů","t":"ALE: automatické navázání spojení na KV","h":"Osm tónů od 750 do 2500 Hz, 125 Bd, v dávkách.","l":"Blok asi 2 kHz z drobných teček, jednu až dvě sekundy, někdy na několika sousedních kmitočtech; vysoké švitoření (list 34)."},"rs41":{"nm":"Radiosonda RS41","t":"Radiosonda RS41: nepřetržitá GFSK","h":"Vyhlazená FSK 4800 Bd bez přestávky; kmitočet pomalu ujíždí, jak sonda stoupá a chladne.","l":"Pás asi 10 kHz, který během celého letu šikmo klouže, mezi 400 a 406 MHz (list 21)."},"ook":{"nm":"Senzory 433","t":"Senzory 433 MHz: OOK","h":"Nosná se zapíná a vypíná v krátkých nebo dlouhých impulzech (vše nebo nic); zpráva se opakuje třikrát.","l":"Dávky drobných teček, často trojmo, na 433,92 MHz: meteostanice, teplotní čidla, dálková ovládání (list 22)."},"fhss":{"t":"Bluetooth: přeskakování kmitočtu (FHSS)","h":"Kmitočet se mění 1600krát za sekundu mezi 79 kanály (zmenšeno).","l":"Drobné čárky rozházené všude po 80 MHz, nikdy na stejném místě, kolem 2,4 GHz (list 25).","n":"zmenšeno"},"wspr":{"t":"WSPR: šířkové majáky","h":"Čtyři tóny 1,46 Hz od sebe, 0,68 s na symbol, po dobu 110,6 s.","l":"Velmi tenká čára asi 6 Hz, trvá skoro dvě minuty, každou sudou minutu: je třeba hodně přiblížit (list 29).","n":"úryvek 24 s (vysílání trvá 110,6 s)"},"qrss":{"t":"QRSS: velmi pomalá morseovka","h":"Nosná zapínaná a vypínaná, tečky 3 až 10 s, často na dvou sousedních kmitočtech (DFCW).","l":"Čáry široké jen několik Hz, čtené na desetiminutové obrazovce; uchem neslyšitelné (list 30).","n":"zrychleno: tečka 0,6 s místo 3 až 10 s"},"texte":{"nm":"Text ve vodopádu","t":"Text ve vodopádu","h":"Každý řádek obrázku se stane skupinou tónů: zvuk připomíná šum.","l":"Text nebo kresba se objeví přímo na obrazovce SDR (list 40).","r":[["Poznámka","Vysíláno od spodku obrázku: rovně v živém vodopádu, vzhůru nohama v otisku (čteném shora dolů)"]]},"vara":{"t":"Moderní KV data: VARA, Pactor, ARDOP","h":"Dlouhé plné dávky (OFDM nebo PSK) a mezi nimi krátké odpovědi protistanice.","l":"Obdélník asi 2,4 kHz, který se zastaví a znovu rozběhne, s malým potvrzením mezi tím; přerušované šumění (list 29)."},"chirp":{"nm":"Ionosonda","t":"Ionosonda (chirp sounder)","h":"Pomalá kmitočtová rampa přes celé KV pásmo; ozvěny z ionosféry přicházejí o něco později.","l":"Úhlopříčka přes obrazovku doprovázená rovnoběžnými čarami (ozvěnami); „ffuit“, které proletí za zlomek sekundy."},"oth":{"nm":"Radar za horizont","t":"Radar za horizont („woodpecker“)","h":"Impulzy opakované 10 až 50krát za sekundu, každý široký několik kHz.","l":"Široký pruhovaný blok přes celá pásma; velmi pravidelné ťukání datla na krátkých vlnách."},"parasites":{"nm":"Rušení","sh":"zdroj","t":"Rušení ze spínaného zdroje","h":"Obdélníkový signál: jeho kmitočet a všechny harmonické vycházejí zároveň.","l":"Hřeben pravidelných čar, které spolu ujíždějí, na šumovém pozadí: hledej s NOISE FIND nebo přenosným přijímačem (list K22)."},"mpx":{"nm":"FM stereo a RDS","t":"Rozhlas FM stereo a RDS","h":"Demodulovaný zvuk (multiplex) obsahuje kanál L+R, pilot na 19 kHz, kanál L-R kolem 38 kHz a RDS na 57 kHz.","l":"Od 0 do 60 kHz po demodulaci: hluboký blok, tenká čára na 19 kHz, slabší blok uprostřed a RDS úplně nahoře (list 12).","n":"měřítko ÷ 20; stereo zvuk","r":[["Poslech","Se sluchátky: 4 s mono (prostřední blok L-R zmizí), pak 4 s stereo, melodie vlevo a akordy vpravo."]]},"dcf77":{"t":"Časový signál DCF77 (77,5 kHz)","h":"Nosná, která na začátku každé sekundy klesne na 15 % na 0,1 s (bit 0) nebo 0,2 s (bit 1).","l":"Pevná čára s černou mezerou každou sekundu; 59. sekunda ji nemá, aby označila minutu (list 12).","r":[["Poznámka","Nosná je zde posunuta na 1000 Hz; 6. sekunda nemá mezeru, jako 59. sekunda každé minuty"]]},"ofdm":{"t":"OFDM: desítky subnosných","h":"Mnoho hustě vedle sebe ležících nosných, každá pomalá: součet vypadá jako šum.","l":"Plochý obdélník s ostrými okraji, stále přítomný: DRM na KV (10 kHz), DAB+ (1,5 MHz), DVB-T, Wi-Fi. V uchu nepřetržitý šum (listy 12 a 25)."},"dsss":{"t":"Rozprostřené spektrum (DSSS): GPS, Wi-Fi 802.11b","h":"Data se smíchají s velmi rychlým kódem: energie se rozprostře do velké šířky.","l":"Široký hrb sotva nad šumem; GPS je dokonce pod šumem a bez zpracování není vidět (listy 25 a 26)."},"hline":{"nm":"Vodíková čára","sh":"1420 MHz","t":"Vodíková čára 21 cm (1420,405 MHz)","h":"Studený vodík v Mléčné dráze vyzařuje velmi slabý šum na 1420,405 MHz. Pohyb ramen galaxie ho posouvá Dopplerovým jevem: je vidět několik malých hrbolků.","l":"Ve vodopádu se ze sekundy na sekundu skoro nic neděje: je třeba dlouho průměrovat, aby se hrbolky vynořily ze šumu. Zde se po zastavení podívej na průměrné spektrum. Stačí parabola nebo trychtýř, předzesilovač a SDR klíčenka.","n":"signál silně zveličen"},"sun":{"nm":"Slunce","sh":"vzplanutí","t":"Slunce: rádiová vzplanutí typu III","h":"Elektrony vymrštěné erupcí procházejí sluneční korónou a nutí ji vyzařovat stále níž, jak se vzdalují.","l":"Čáry, které za méně než sekundu padají šikmo shora dolů spektrem na pozadí slunečního šumu; sílící „šššš“. Zhruba 10 až 400 MHz, i na krátkých vlnách kolem 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter: dekametrová vzplanutí (L a S)","h":"Magnetické pole Jupiteru a jeho měsíc Io vytvářejí silné vyzařování mezi 15 a 40 MHz: pomalá vzplanutí L a velmi krátká vzplanutí S, která rychle klouzají dolů.","l":"Nejdřív vlny šumu (L, jako příboj), pak série drobných „lupnutí“ (S) v hustých úhlopříčkách. Kolem 20,1 MHz v noci, s obyčejným dipólem, když je Io dobře postavená."},"pulsar":{"nm":"Pulzar","sh":"B0329+54","t":"Pulzar PSR B0329+54","h":"Rotující neutronová hvězda přejíždí Zemi rádiovým paprskem, zde každých 0,714 s. Mezihvězdný plyn zpožďuje nízké kmitočty: každý impulz dorazí nejdřív nahoře ve spektru.","l":"Pravidelné „tik“; ve vodopádu je každý impulz klesající křivka (disperze). Skutečný signál je pod šumem: je třeba velká anténa a sčítání impulzů přes jejich periodu.","n":"signál silně zveličen"},"meteor":{"nm":"Meteory","sh":"GRAVES","t":"Meteorické ozvěny radaru GRAVES (143,050 MHz)","h":"Francouzský radar GRAVES vysílá nepřetržitě na 143,050 MHz. Když padající hvězda ionizuje vzduch, její stopa odrazí trochu signálu k tvému přijímači, na zlomek sekundy až několik sekund.","l":"V USB na 143,049 MHz: krátká „pípnutí“ kolem 1000 Hz, někdy klouzající ozvěna (hlava meteoru, Dopplerův jev) nebo dlouhá. Mnohem víc během rojů (Perseidy, Geminidy) (list 1)."},"whistler":{"nm":"Hvizdy","sh":"VLF","t":"VLF hvizdy (whistlery)","h":"Blesk vytvoří rádiové cvaknutí; část putuje podél siločar zemského magnetického pole na druhou polokouli a zpět, výšky napřed.","l":"„Fjúúú“, které za sekundu či dvě sklesne z výšky do hloubky hned po cvaknutí; všude praskání (sferiky). Pod 10 kHz, s VLF přijímačem daleko od elektrického vedení."},"chorus":{"nm":"Ranní sbor","sh":"VLF","t":"Ranní sbor (dawn chorus)","h":"Během magnetické bouře vydávají elektrony zachycené v magnetosféře drobné stoupající tóny, hlavně za úsvitu.","l":"Stoupající švitoření, která se překrývají jako ptáci, zhruba 1 až 4 kHz. Stejné vybavení jako na hvizdy."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"První umělá družice vysílala tři týdny pípnutí asi 0,3 s střídavě na 20,005 a 40,002 MHz.","l":"Pravidelně přerušovaná čára: „píp… píp…“, zvuk, který v říjnu 1957 poslouchal celý svět (rekonstrukce)."},"doppler":{"nm":"Dopplerův jev","sh":"družice","t":"Maják družice a Dopplerův jev","h":"Družice na nízké dráze se přibližuje a pak vzdaluje: přijímaný kmitočet během přeletu klesá, asi o ±3 kHz na 145 MHz a ±10 kHz na 435 MHz.","l":"Čára klesající do tvaru S: nejdřív pomalu, rychle při největším přiblížení, pak zase pomalu (list 41).","n":"přelet 10 min zkrácen na 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Družice NOAA: snímky APT (historie)","h":"Pomocná nosná 2400 Hz amplitudově modulovaná obrazem, dva řádky za sekundu, se synchronizačním impulzem na začátku každého řádku. Vypnuto v roce 2025; dnes vysílají družice Meteor-M v LRPT.","l":"Čára na 2400 Hz s postranními pásmy, která se mění s obrazem, a známé „tik-tak“ dvakrát za sekundu (list 41)."},"eme":{"nm":"Ozvěna od Měsíce","sh":"EME","t":"Ozvěna od Měsíce (EME)","h":"Signál vyslaný k Měsíci se vrátí asi za 2,5 s, nesmírně zeslabený, trochu rozšířený a posunutý Dopplerem.","l":"Slyšíš své vlastní „píp“ a za 2,5 s jeho slabou, trochu rozmazanou ozvěnu. Radioamatéři to dělají v CW nebo JT65, od 144 MHz výš (list 1).","n":"ozvěna silně zveličena"},"msk144":{"nm":"MSK144","sh":"meteory","t":"MSK144: digitální provoz přes meteory","h":"Dva tóny, 1000 a 2000 Hz, rychlostí 2000 Bd, v rámcích po 72 ms opakovaných bez přestávky: každá stopa meteoru propustí několik z nich.","l":"Dávky 0,1 až 1 s, široké asi 2,4 kHz, které se objeví a zhasnou s „pípnutím“ meteoru. Na 50 a 144 MHz, s WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tónů","t":"JT65: 65 tónů, velmi pomalé","h":"Jeden synchronizační tón a 64 datových tónů 2,7 Hz od sebe (JT65A), 0,37 s na symbol, 47 s vysílání za minutu.","l":"Žebřík drobných čárek na asi 180 Hz se synchronizační čárou, která se vrací stále na stejné místo. Používá se pro odraz od Měsíce (JT65B a C) a velmi slabé signály.","n":"úryvek 20 s (vysílání trvá 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: profesionální digitální síť","h":"Fázová modulace π/4-DQPSK s 18 000 symboly za sekundu, čtyři časové sloty, v kanálech 25 kHz.","l":"Plný blok se zaoblenými boky, u základnové stanice stále přítomný; chraplavý šum. Šifrováno: nelze poslouchat (list 46).","n":"zmenšeno"},"ndb":{"nm":"Maják NDB","sh":"190–535 kHz","t":"NDB: nesměrový radiomaják","h":"Pevná nosná na dlouhých vlnách s morseovkovou značkou o dvou či třech písmenech vysílanou tónem (často 1020 Hz).","l":"Pevná čára uprostřed a během značky dvě čárky po stranách. Zhruba 190 až 535 kHz, v SSB nebo CW (list 12)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: všesměrový radiomaják","h":"V AM: signál 30 Hz závislý na směru, pomocná nosná 9960 Hz kmitočtově modulovaná 30 Hz (reference) a morseovková značka na 1020 Hz.","l":"V demodulovaném zvuku: hluboké bručení 30 Hz, široká vlnitá čára kolem 10 kHz a občas značka (list 18).","n":"demodulovaný zvuk, měřítko ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: navádění na přistání (localizer)","h":"V AM dva tóny 90 a 150 Hz; jejich poměr říká letadlu, zda je vlevo nebo vpravo od osy. Morseovková značka začíná písmenem I.","l":"V demodulovaném zvuku: dvě velmi hluboké čáry na 90 a 150 Hz a značka na 1020 Hz. Mezi 108,1 a 112 MHz; sestupová rovina je kolem 330 MHz (list 18)."},"m10":{"nm":"Sondy M10 / M20","sh":"Meteomodem","t":"Radiosondy M10 a M20 (Meteomodem)","h":"Jeden rámec za sekundu v rychlé FSK (asi 9600 Bd): širší než RS41. Ve Francii je vypouští Météo-France.","l":"Každou sekundu široká dávka, která během letu pomalu ujíždí; mezi 400 a 406 MHz (list 21)."},"tpms":{"nm":"Pneumatiky (TPMS)","sh":"433 MHz","t":"Snímače tlaku v pneumatikách (TPMS)","h":"Každé kolo občas vyšle dávku FSK o několika milisekundách: tlak, teplota, identifikátor.","l":"Drobné samostatné dávky na 433,92 MHz (nebo 315 MHz), často po dvou, když projede auto. Dekóduje je rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Časový signál ALS162 (Allouis, 162 kHz)","h":"Nosná bývalého dlouhovlnného vysílání France Inter; čas je zakódován drobnými, neslyšitelnými fázovými modulacemi.","l":"Pevná čára, ve Francii velmi silná, na začátku každé sekundy sotva rozšířená; ke čtení času je třeba dekodér (list 12)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Časový signál WWV (Colorado)","h":"V AM: každou sekundu „tik“ 5 ms na 1000 Hz, tón 500 nebo 600 Hz, časový kód na 100 Hz a hlas hlásící UTC.","l":"V demodulovaném zvuku: čára na 500 Hz přerušená každou sekundu, tik na 1000 Hz a úplně dole kód na 100 Hz (list 12)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Časový signál MSF (Anthorn, 60 kHz)","h":"Nosná se na začátku každé sekundy vypne na 0,1, 0,2 nebo 0,3 s podle bitů a na 0,5 s pro označení minuty.","l":"Pevná čára s úplně černými mezerami každou sekundu, delšími než u DCF77 (list 12)."},"type2":{"nm":"Slunce typ II","sh":"rázová vlna","t":"Slunce: rádiová vzplanutí typu II","h":"Rázová vlna výronu koronální hmoty nutí plazma vyzařovat pomalu stále níž, často ve dvou pásech (základní a dvojnásobný).","l":"Dva rovnoběžné pásy šumu, které několik minut pozvolna klesají. Porovnej se vzplanutími typu III, která jsou mnohem rychlejší.","n":"několik minut zkráceno na 6 s"},"tweeks":{"nm":"Tweeky","sh":"VLF","t":"Tweeky: noční VLF „pípnutí“","h":"V noci se cvaknutí vzdáleného blesku odráží mezi zemí a ionosférou; kmitočty u mezního kmitočtu (kolem 1,7 kHz) dorazí poslední.","l":"Malé „pípnutí“, které klesne a zastaví se kolem 1,7 kHz, někdy s ozvěnou na dvojnásobku; všude praskání. Pod 10 kHz, v noci."},"hiss":{"nm":"VLF šum","sh":"hiss","t":"VLF šum (hiss)","h":"Širokopásmový šum elektronů v plazmasféře, který roste a klesá s magnetickou aktivitou.","l":"Pás šumu od několika set Hz do několika kHz, bez vzoru, pomalu sílí a slábne."},"aurora":{"nm":"Rádiová polární záře","sh":"Au","t":"Šíření přes polární záři (Au)","h":"Polární záře odráží VKV vlny, ale velmi rychle jimi třese: každý signál se rozprostře do několika set Hz.","l":"CW se změní v drsný, jakoby šeptaný šum; tón už neslyšíš. Na 50 a 144 MHz, s anténou k severu při magnetických bouřích."},"galactic":{"nm":"Galaktický šum","sh":"20–40 MHz","t":"Šum Mléčné dráhy","h":"Střed galaxie vyzařuje rádiový šum, který Karl Jansky objevil v roce 1932 kolem 20 MHz. Roste a klesá s otáčením Země.","l":"Šum pozadí, který pomalu roste a zase klesá, každý den asi o 4 minuty dřív. Viditelný s obyčejným dipólem mezi 20 a 40 MHz.","n":"den zkrácen na 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 Bd","t":"Telemetrie CubeSatu","h":"Malé družice pravidelně vysílají svá měření (baterie, teploty) v FSK nebo GMSK rychlostí 1200 nebo 9600 Bd kolem 435–438 MHz.","l":"Pravidelné dávky, které během přeletu Dopplerovým jevem pokaždé sklouznou o kus níž (list 41).","n":"zmenšeno, přelet zrychlen"},"issfm":{"nm":"ISS v FM","sh":"145,800 MHz","t":"Vesmírná stanice (ISS): hlas v FM","h":"Astronauti mluví se školami a radioamatéry v FM na 145,800 MHz. Stanice letí rychlostí 28 000 km/h: během přeletu přijímaný kmitočet sklouzne asi z +3,5 kHz na −3,5 kHz.","l":"Pás FM hlasu, který se během desetiminutového přeletu pomalu posouvá zprava doleva (list 41).","n":"přelet 10 min zkrácen na 10 s"},"buzzer":{"nm":"UVB-76 „The Buzzer“","sh":"4625 kHz","t":"UVB-76, „The Buzzer“ (4625 kHz)","h":"Ruská vojenská stanice, která už desítky let vysílá asi sekundové bzučení, zhruba 25krát za minutu, někdy přerušené hlasovou zprávou.","l":"Pevná nosná a při každém bzučení sloupec hustých čar shora dolů. Snadno ji najdeš na 4625 kHz v USB."},"pip":{"nm":"„The Pip“","sh":"3756 / 5448 kHz","t":"„The Pip“: nekonečná pípnutí","h":"Další ruský vojenský krátkovlnný maják, který dnem i nocí opakuje krátká pípnutí, někdy přerušená zprávami.","l":"Pevná čára přerušovaná krátkým pípnutím asi 50krát za minutu; v uchu pravidelné „píp… píp…“, které nikdy nepřestane.","n":"přibližný rytmus"},"squeaky":{"nm":"„Squeaky Wheel“","sh":"KV","t":"„Squeaky Wheel“: vrzající kolo","h":"Ruský vojenský krátkovlnný maják, pojmenovaný posluchači podle svého opakovaného zvukového vzoru.","l":"Malý vzor dvou zvuků, z nichž jeden stoupá, opakovaný dokola: jako vrzající kolo.","n":"přibližná napodobenina"},"codar":{"nm":"CODAR","sh":"oceánský radar","t":"CODAR: radary mořských proudů","h":"Pobřežní radary jednou či dvakrát za sekundu přejedou pásmo kmitočtů, aby měřily proudy a vlny.","l":"Pravidelné rovnoběžné úhlopříčky a opakované „swish“; kolem 4,5–5,5 MHz, 13 MHz a 25 MHz, často ve dne i v noci.","n":"zmenšeno"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Vojenský modem STANAG 4285","h":"Fázová modulace 8-PSK rychlostí 2400 Bd na nosné 1800 Hz, se zkušební sekvencí každých 107 ms pro sledování kanálu.","l":"Plný blok asi 3 kHz; v uchu šum s pravidelným bzučením (list 43)."},"link11":{"nm":"Link-11","sh":"16 tónů","t":"Link-11: námořní datové spojení","h":"Šestnáct tónů od 605 do 2915 Hz vysílaných současně, každý fázově modulovaný 75krát za sekundu.","l":"Hřeben čtrnácti pravidelných čar od 935 do 2365 Hz a dvě čáry stranou na 605 a 2915 Hz; v uchu hudební bručení (list 43)."},"numbers":{"nm":"Číselná stanice","sh":"hlas","t":"Číselná stanice","h":"V pevný čas krátká volací melodie, pak hlas (často syntetický) čte skupiny pěti číslic, v AM nebo SSB.","l":"Melodie v samostatných tónech, pak pravidelné skupiny slabik oddělené tichem (list 43).","n":"napodobený hlas, žádné skutečné číslice"},"rttydwd":{"nm":"RTTY počasí DWD","sh":"50 Bd / 450 Hz","t":"Meteorologické RTTY služby DWD (Německo)","h":"Jako radioamatérské RTTY, ale 50 Bd s odstupem 450 Hz: německá meteorologická služba vysílá zprávy a námořní předpovědi otevřeným textem.","l":"Dvě čáry mnohem dál od sebe a o něco rychlejší rytmus. Mezi zprávami volání „CQ CQ CQ DE DDK2 DDH7 DDK9“ a pak RYRYRY. Na 4583, 7646 a 10 100,8 kHz, také 147,3 kHz (list 32)."},"mfsk16":{"nm":"MFSK16","sh":"16 tónů","t":"MFSK16: šestnáct tónů","h":"Šestnáct tónů 15,625 Hz od sebe, vždy jen jeden, 15,625krát za sekundu; každý tón nese čtyři bity chráněné opravným kódem.","l":"Pás 316 Hz z malých schůdků, které stále přeskakují, po stálém tónu na začátku. V uchu rychlá melodie jako flétna. Používá se i k posílání malých obrázků."},"sitora":{"nm":"SITOR-A (ARQ)","sh":"dálnopis","t":"SITOR-A: námořní dálnopis v ARQ","h":"Stanice vysílá bloky tří znaků (210 ms, 100 Bd, odstup 170 Hz) každých 450 ms; mezi bloky protistanice krátce odpoví „přijato“ nebo „opakuj“.","l":"Krátké pravidelné dávky s malou slabší odpovědí mezi nimi: cvrčkovité „čip-čip“. Na krátkých vlnách už vzácné."},"dscvhf":{"nm":"DSC VKV (kanál 70)","sh":"DSC","t":"DSC: digitální selektivní volání na kanálu 70","h":"Dávka asi půl sekundy rychlostí 1200 Bd na dvou tónech 1300 a 2100 Hz: nese číslo MMSI lodi, druh volání a v tísni i polohu.","l":"Krátké vysoké „brrrt“ na 156,525 MHz, které začíná řadou střídavých bitů. Na středních a krátkých vlnách je DSC v FSK 100 Bd jako NAVTEX (list 20)."},"selcal":{"nm":"Letecký SELCAL","sh":"4 tóny","t":"SELCAL: selektivní volání letadel na krátkých vlnách","h":"Řízení letového provozu volá jedno určité letadlo dvěma asi sekundovými impulzy, každý ze dvou tónů ze šestnácti (312,6 až 1479,1 Hz). V letadle se rozsvítí kontrolka a zazní gong: posádka nemusí stále poslouchat.","l":"Dva akordy po sobě, „bim-bam“, mezi hlasovými zprávami na leteckých kmitočtech v SSB, například 5616 nebo 8864 kHz."},"dcs":{"nm":"DCS","sh":"134,4 bit/s","t":"DCS: digitální subtón","h":"Místo stálého tónu jako u CTCSS vysílá stanice pod hlasem 23bitové slovo opakované bez přestávky rychlostí 134,4 bitu za sekundu. Na konci tón 134,4 Hz tiše zavře squelch.","l":"Ve zvuku FM přijímače: nepravidelný pás úplně dole pod 300 Hz a tlumené bručení, pokud ho filtr stanice propustí (list 10)."},"t1750":{"nm":"Tón 1750 Hz","sh":"převáděč","t":"Tón 1750 Hz: otevření převáděče","h":"Krátký tón 1750 Hz (asi 0,5 až 1 s) na začátku vysílání dodnes otevírá některé evropské radioamatérské převáděče; převáděč často odpoví pípnutím po uvolnění klíčování.","l":"Krátká čára na 1750 Hz, pak hlas, pak pípnutí převáděče (list 10)."},"ncdxf":{"nm":"Majáky NCDXF","sh":"14,100 MHz","t":"Majáky NCDXF / IARU: zkouška šíření","h":"Osmnáct majáků po světě vysílá postupně, každý deset sekund, na 14,100, 18,110, 21,150, 24,930 a 28,200 MHz: značka morseovkou a pak čtyři sekundové čárky výkonem 100 W, 10 W, 1 W a 0,1 W.","l":"Značka a pak čtyři stále slabší čárky: slyšíš-li i poslední, je šíření k tomuto majáku výborné. Zde 4U1UN (New York) a pak VE8AT (Kanada) (list 30)."},"lrpt":{"nm":"Meteor-M LRPT","sh":"137,9 MHz","t":"Družice Meteor-M: snímky LRPT","h":"Ruské meteorologické družice Meteor-M vysílají snímky digitálně: čtyřstavová fázová modulace (QPSK), 72 000 symbolů za sekundu, šířka asi 120 kHz.","l":"Plný blok se zaoblenými okraji, který během přeletu pomalu klouže (Dopplerův jev); v uchu jen šum. Na 137,9 nebo 137,1 MHz, dekóduje SatDump (list 41).","n":"zmenšeno"},"quindar":{"nm":"Tóny Quindar","sh":"NASA","t":"Tóny Quindar: pípání Apolla","h":"Když řídicí středisko v Houstonu stiskne klíčování, pípnutí 2525 Hz (250 ms) zapne vysílače pozemních stanic; po uvolnění je pípnutí 2475 Hz vypne.","l":"Vysoké pípnutí před každou větou a další, o něco nižší, po ní: slavný zvuk nahrávek z misí Apollo."},"wow":{"nm":"Signál „Wow!“","sh":"1977","t":"Signál „Wow!“ (15. srpna 1977)","h":"Radioteleskop Big Ear (Ohio) zachytil na 72 sekund úzký a velmi silný signál poblíž vodíkové čáry, kolem 1420,456 MHz. Astronom Jerry Ehman napsal na výpis „Wow!“. Už se nikdy neopakoval a jeho původ je dodnes sporný.","l":"Tenká čára, která vystoupí ze šumu, zesílí a zeslábne: tvar průchodu pevného zdroje svazkem antény. Je to rekonstrukce: zvuková nahrávka neexistuje.","n":"72 s zkráceno na 12 s"},"frb":{"nm":"Rychlý rádiový záblesk","sh":"FRB","t":"Rychlý rádiový záblesk (FRB)","h":"Rádiový záblesk trvající pár milisekund z jiné galaxie; první byl objeven v roce 2007. Plyn po cestě silně zpožďuje nízké kmitočty: záblesk dorazí roztažený, výšky napřed.","l":"Jediná křivka padající shora dolů spektrem a pak nic. Některé se opakují; většina je vidět jen jednou.","n":"silně zpomaleno a zveličeno"},"letterb":{"nm":"Jednopísmenné majáky","sh":"D, P, S, C…","t":"Jednopísmenné majáky","h":"Vysílače ruského námořnictva donekonečna opakují jediné písmeno morseovky, každý 100 Hz od souseda: D, P, S, C, A, F, K nebo M podle místa.","l":"Rovnoběžné tečkované čáry těsně vedle sebe, každá s vlastním rytmem. Kolem 4558, 5154, 7039, 10 872, 13 528 a 16 332 kHz, v CW."},"sid":{"nm":"Sluneční erupce na VLF","sh":"SID","t":"Sluneční erupce viděná na VLF (SID)","h":"Námořní vysílače VLF (20,9 kHz ve Francii, 23,4 kHz v Německu…) se šíří mezi zemí a ionosférou. Když dorazí sluneční erupce, její rentgenové záření během minut změní spodek ionosféry a přijímaná úroveň skočí.","l":"Úzký pravidelný pás (signál MSK vysílače), který náhle zesílí a pak se pomalu vrací k normálu. Stačí drátová smyčka a zvuková karta: klasický projekt astronomických kroužků.","n":"hodina zkrácena na 12 s"},"qrn":{"nm":"Bouřkové rušení","sh":"QRN","t":"Bouřkové rušení (QRN)","h":"Každý blesk je velmi silný vysílač, který pokryje všechny kmitočty najednou. Na středních a krátkých vlnách jsou slyšet bouřky tisíce kilometrů daleko, hlavně v létě a na nízkých pásmech.","l":"Nepravidelné vodorovné čáry přes celou šířku; suché praskání v uchu. Omezovač šumu (NB) trochu pomůže, rámová anténa víc."},"fading":{"nm":"Selektivní únik","sh":"QSB","t":"Selektivní únik (QSB)","h":"Na krátkých vlnách přichází signál ionosférou několika cestami. Podle kmitočtu se sčítají nebo ruší: signálem putuje úzký propad.","l":"Tmavá zóna, která pomalu putuje stanicí AM. Když přejde přes nosnou uprostřed, zvuk je pár sekund chraplavý a zkreslený; synchronní detekce nebo poslech v SSB to napraví."},"plc":{"nm":"PLC","sh":"2–30 MHz","t":"PLC: internet po elektrických zásuvkách","h":"Adaptéry PLC posílají data po domovních rozvodech na stovkách nosných mezi 2 a 30 MHz (u novějších i výš), jedna každých 24,4 kHz. Vodiče vyzařují jako anténa.","l":"Hřeben pravidelných čar, který bliká po paketech, s mezerami na radioamatérských pásmech (zářezy předepsané normou); v uchu praskání, které sleduje internetový provoz (list 43).","n":"zmenšeno"},"fence":{"nm":"Elektrický ohradník","sh":"ťuk… ťuk…","t":"Elektrický ohradník","h":"Zdroj ohradníku pošle do drátu asi jednou za sekundu impulz několika tisíc voltů. Dotýká-li se drátu tráva nebo je poškozený izolátor, přeskočí jiskra a vyzařuje na všech kmitočtech.","l":"Velmi tenká vodorovná čára přes celou šířku v dokonale pravidelném odstupu; „ťuk… ťuk…“ od dlouhých vln po VKV. Pravidelný rytmus ho odliší od bouřky."},"gsm":{"nm":"Telefon GSM","sh":"217 Hz","t":"Telefon GSM vedle reproduktoru","h":"Telefon 2G vysílá v dávkách 0,577 ms, 217krát za sekundu. Špatně stíněný zesilovač tyto dávky detekuje a udělá je slyšitelnými.","l":"Hřeben čar po 217 Hz; známé „ta-ta-tatata“ těsně před zazvoněním telefonu a pak trvalé bzučení během hovoru. Stále vzácnější: sítě 2G se vypínají."},"jjy":{"nm":"JJY","sh":"40 / 60 kHz","t":"Časový signál JJY (Japonsko, 40 a 60 kHz)","h":"V každé sekundě má nosná plný výkon po 0,8 s (bit 0), 0,5 s (bit 1) nebo 0,2 s (značka) a pak klesne na 10 %. Opak DCF77, který klesá na začátku sekundy.","l":"Pevná čára, která na konci každé sekundy dříve či později zeslábne. Vysílače ve Fukušimě (40 kHz) a Saga-Fukuoka (60 kHz), pro rádiem řízené hodiny v Japonsku."},"rwm":{"nm":"RWM","sh":"4996 kHz","t":"Časový signál RWM (Moskva)","h":"Telegraficky na 4996, 9996 a 14 996 kHz: každou sekundu impulz 100 ms a v jiných minutách deset impulzů za sekundu. Značka RWM se vysílá morseovkou dvakrát za hodinu.","l":"Značka, pak čára rozdělená na pravidelná „tik“ a potom na rychlé tečky. Poslouchej v CW nebo SSB.","n":"zhuštěná ukázka"},"bpm":{"nm":"BPM","sh":"2,5–15 MHz","t":"Časový signál BPM (Čína)","h":"Stanice Pchu-čcheng (Šen-si) vysílá v AM na 2,5, 5, 10 a 15 MHz: každou sekundu tik 10 ms na 1000 Hz (300 ms v celou minutu) a v určitých minutách tiky 100 ms pro čas UT1. Značka BPM zazní morseovkou a pak hlasem.","l":"V demodulovaném zvuku: značka, pak velmi krátké čárky na 1000 Hz, jedna za sekundu, s delší v celou minutu. Často se mísí s WWV na stejných kmitočtech.","n":"zhuštěná ukázka"},"humpback":{"nm":"Keporkak","sh":"zpěv","t":"Zpěv keporkaka","h":"V zimě v oblastech rozmnožování samci zpívají: sled stenů, mručení a výkřiků tvoří téma, které se hodiny opakuje beze změny a mění se z jedné sezóny na druhou. Hydrofony ho zachytí na desítky kilometrů.","l":"Tlusté stopy s harmonickými, které pomalu stoupají nebo klesají mezi 100 Hz a několika kHz; stejný sled se vrátí po několika sekundách. Ozvěna od hladiny a dna každý tón prodlužuje."},"bluewhale":{"nm":"Plejtvák obrovský","sh":"×10","t":"Plejtvák obrovský: nejhlubší volání","h":"Největší živočich na světě vydává velmi hluboká (10 až 40 Hz) a velmi silná volání, dlouhá 10 až 20 sekund a opakovaná celé hodiny: nesou se stovky kilometrů. Aby byla slyšet, nahrávka se desetkrát zrychlí.","l":"Pulzní část a pak dlouhý tón, který jen nepatrně klesá, s harmonickými nad ním; sled se opakuje. Stupnice ukazuje skutečné kmitočty.","n":"zrychleno 10×"},"finwhale":{"nm":"Plejtvák myšok","sh":"20 Hz","t":"Plejtvák myšok: impulzy 20 Hz","h":"Plejtvák myšok vydává asi sekundové impulzy klesající zhruba z 25 na 18 Hz, v pravidelných odstupech, někdy celé dny. V 50. a 60. letech tyto „signály 20 Hz“ mátly odposlechové sítě amerického námořnictva, než byly přiřazeny tomuto plejtvákovi.","l":"Krátké čárky, všechny stejné, v pravidelné řadě nebo ve dvojicích, jako tep velmi pomalého srdce; každá mírně klesá v kmitočtu. Stupnice ukazuje skutečné kmitočty.","n":"zrychleno 10×"},"sperm":{"nm":"Vorvaň","sh":"cvakání","t":"Cvakání vorvaně","h":"Vorvaň loví při hlubokých ponorech pomocí sonaru: velmi silná cvaknutí, asi jedno za sekundu, která se při přiblížení ke kořisti zrychlí ve „vrzání“. Mezi sebou si vorvani vyměňují „kódy“, krátké řady cvaknutí, jejichž rytmus se liší klan od klanu.","l":"Vodorovné čáry přes celou šířku, pravidelně rozložené, pak nahuštěné do bzučení (vrzání) a nakonec malý rytmický vzor: kóda. Každé cvaknutí tvoří několik těsně po sobě jdoucích impulzů, vzniklých odrazy v hlavě zvířete."},"dolphin":{"nm":"Delfín skákavý","sh":"pískání","t":"Pískání a cvakání delfína","h":"Delfín skákavý píská zhruba mezi 5 a 20 kHz; každý jedinec má „podpisový hvizd“, který mu slouží jako jméno. K lovu a orientaci vysílá také řady velmi krátkých cvaknutí, až několik set za sekundu.","l":"Tenké křivky, které stoupají a zase klesají, často opakované beze změny, a dávky vodorovných čar pro echolokaci. Kmitočty jsou vyděleny třemi, aby byly slyšet; stupnice ukazuje skutečné hodnoty.","n":"přehráno 3× níž"},"orca":{"nm":"Kosatka","sh":"pulzní volání","t":"Pulzní volání kosatky","h":"Kosatky se dorozumívají pulzními voláními: řadami impulzů tak rychlými (500 až 2000 za sekundu), že je slyšíme jako tón, s náhlým skokem výšky. Každá rodinná skupina má svůj vlastní „dialekt“.","l":"Svazek rovnoběžných stop (harmonických), které stoupají nebo klesají společně, s ostrým zlomem uprostřed volání; někdy tenký, vyšší hvizd."},"bseal":{"nm":"Tuleň vousatý","sh":"trylek","t":"Trylek tuleně vousatého","h":"Na jaře pod arktickým ledem vydává samec dlouhé trylky, které ve spirále klesají z několika kHz až na pár set hertzů, někdy celou minutu. Slouží k obraně teritoria a k lákání samic.","l":"Zvlněná křivka, která klouže po stupnici shora dolů jako povolující pružina, a na konci hluboký tón.","n":"zkráceno"},"shrimp":{"nm":"Krevety pistolnice","sh":"útes","t":"Krevety pistolnice (Alpheidae)","h":"Když kreveta prudce sevře velké klepeto, vystřelí proud vody tak rychle, že vznikne kavitační bublina; ta při zániku praskne jako výstřel. Tisíce krevet tvoří zvukové pozadí útesů a mohou rušit sonary.","l":"Déšť teček a krátkých vodorovných čar přes celou šířku, bez jakéhokoli pořádku; ve sluchátkách nepřetržité praskání jako při smažení."},"sonar":{"nm":"Aktivní sonar","sh":"ping","t":"Ping aktivního sonaru","h":"Loď vyšle silný zvukový impulz (zde kolem 3,5 kHz, v pásmu trupových sonarů fregat) a poslouchá ozvěnu: zpoždění udává vzdálenost, posun kmitočtu (Dopplerův jev) rychlost cíle. Zvuk se vrací i jako dozvuk ode dna a hladiny.","l":"Krátká silná čára, dozvuk, který doznívá, a pak ozvěna, mnohem slabší a mírně posunutá v kmitočtu. Druhý ping je kmitočtový rozmítnutý signál (chirp), který lépe měří vzdálenost."},"propeller":{"nm":"Lodní šroub","sh":"kavitace","t":"Šroub proplouvající lodi","h":"Listy šroubu vytvářejí kavitační bubliny, které praskají: široký šum, který pulzuje v rytmu míjejících listů. Strojovna přidává pevné čáry. Sonaristé tento rytmus analyzují (analýza DEMON), aby spočítali listy a otáčky a loď poznali.","l":"Šum v širokém pásmu, pruhovaný vodorovnými pásy v rytmu listů, s několika pevnými svislými čarami (motor, převodovka). Vše zesílí a pak odezní, když loď přepluje nad hydrofonem."},"uqc":{"nm":"Podvodní telefon","sh":"UQC 8 kHz","t":"Podvodní telefon (UQC, „Gertrude“)","h":"Ponorky a lodě spolu mluví pod vodou akustickým telefonem: hlas se přenáší jedním postranním pásmem nad nosnou 8,0875 kHz, vyzařovanou měničem v trupu. Dosah: několik kilometrů.","l":"Pásmo hlasu SSB nad 8 kHz; po demodulaci vzdálený hlas, který se vlní a zní ozvěnami od hladiny a dna. Zobrazení je zmenšeno na polovinu; stupnice ukazuje skutečné kmitočty.","n":"stupnice vydělena 2"},"zevs":{"nm":"ZEVS 82 Hz","sh":"ELF","t":"ZEVS: rádio pro ponorky na 82 Hz","h":"Rádiové vlny pronikají do mořské vody jen velmi špatně, kromě extrémně nízkých kmitočtů (ELF). Ruský vysílač ZEVS na poloostrově Kola vysílá na 82 Hz anténními vedeními dlouhými desítky kilometrů, aby zastihl ponorky v hlubokém ponoru. Rychlost je nepatrná: několik znaků za minutu.","l":"Tenká čára na 82 Hz vedle čáry sítě 50 Hz a jejích harmonických, s rušením od bouřek. Ve sluchátkách sotva slyšitelné hluboké bručení; zachytí se velkou rámovou anténou a zvukovou kartou. Americký protějšek na 76 Hz byl uzavřen v roce 2004."},"bloop":{"nm":"„Bloop“","sh":"1997","t":"„Bloop“ (1997)","h":"V roce 1997 zachytily hydrofony NOAA v Tichém oceánu velmi hluboký, rychle stoupající zvuk, slyšitelný na tisíce kilometrů. Dlouho záhadný, od roku 2012 je připisován ledotřesení: obrovskému ledovci, který praská.","l":"Široké pásmo, které během několika sekund stoupne, s harmonickými, a pak pomalu odezní. Rekonstrukce, zrychlená 16× jako nahrávka zveřejněná NOAA.","n":"zrychleno 16×"}}},"pt":{"ui":{"title":"VSISA","mystery":"Som mistério","play":"▶ Ouvir","stop":"■ Parar","noise":"Ruído","volume":"Volume","loop":"Repetir","specwf":"Espetro + Cascata","cursor":"cursor","footprint":"Impressão","dur":"{s} s de cima para baixo","avg":"média de todo o sinal","press":"Carrega em Ouvir: o sinal desfila aqui","count":"{n} sinais, pela ordem da ficha 6","myst":"Modo mistério","mystTags":"Ouve e observa, depois escolhe a resposta certa","quizH":"Que sinal é este?","quizLead":"Põe a ouvir, observa o espetro, a cascata e a impressão, e responde.","score":"Pontuação","good":"Certo!","bad":"Errado: era {x}.","next":"Próximo som mistério","principle":"Princípio","screen":"No ecrã","sheet":"ficha","book":"Livro: ficha {r}","lang":"Idioma","signals":"Sinais","f1":"Sinais simulados na página (12 000 amostras por segundo): os da ficha 6 do livro OpenBookRadio, outros sinais do livro e bónus. Nos sinais de rádio (AM, FM, AIS, LoRa…) vê-se a frequência intermédia simulada, como no ecrã de um SDR; alguns estão em escala reduzida ou acelerada, como indicado. Em AM, BLU, FM, FM estéreo, ISS e desvanecimento ouve-se o som desmodulado, como no altifalante do recetor, e o ecrã mostra o sinal de rádio; a voz é sintética e não diz palavras reais.","f2":"O tempo desce na cascata e na impressão. Licença CC BY-NC-SA 4.0, gratuito, proibida a venda.","night":"Modo noite","day":"Modo dia","visits":"visitas","plays":"audições","book_dl":"Descarregar o livro","book_dl2":"Descarregar o livro OpenBookRadio (gratuito, PDF e EPUB, 13 idiomas)","display":"Visualização","theme_day":"Dia","theme_night":"Noite (vermelho)","theme_phos":"Fósforo verde","theme_phosb":"Fósforo azul","theme_phosa":"Fósforo âmbar","w3d":"Cascata 3D","w3dHint":"arraste para girar"},"groups":["Voz analógica","Telegrafia","Dados","Imagens","Aviação, marinha e socorro","Chamada, subtons e mensagens","Radiossondas, sensores e objetos ligados","Modos HF e curiosidades","Radiodifusão e hora","Banda larga","Bónus: sons do espaço","Bónus: curiosidades da onda curta","Bónus: sons subaquáticos"],"modes":{"am":{"sh":"rádio","t":"AM: modulação de amplitude","h":"A força da portadora segue o som: a curva «incha» e «desincha».","l":"Um traço fixo no centro (a portadora), com duas bandas laterais iguais de cada lado. Cerca de 6 a 9 kHz de largura. Rádio em onda curta e onda média, aviação (fichas 12 e 14).","r":[["Escuta","Um jingle e depois o locutor sobre um fundo musical. As duas bandas laterais são espelhadas: vê-se a melodia e depois a voz de cada lado da portadora."]]},"ssb":{"nm":"BLU / SSB","t":"BLU / SSB: banda lateral única","h":"Só fica uma banda lateral, sem portadora: nada quando ninguém fala.","l":"Sem traço central, uma única banda de cerca de 2,7 kHz que só vive quando se fala. USB acima de 10 MHz, LSB abaixo (radioamadores). Mal sintonizada, a voz parece um «pato» (fichas 11 e 29)."},"fm":{"sh":"voz","t":"FM: modulação de frequência","h":"A amplitude fica fixa; as oscilações aproximam-se ou afastam-se com o som.","l":"O sinal dança à volta da sua frequência, mais largo quando o som é forte: 12,5 kHz por canal em FM estreita (walkie-talkies, repetidores), 200 kHz em rádio FM (fichas 2 e 13).","r":[["Escuta","No fim, o pequeno «kchh»: o squelch fecha quando o emissor para."]]},"cw":{"t":"CW: Morse","h":"A portadora liga e desliga: traços e pontos.","l":"Um traço muito fino que se interrompe ao ritmo do Morse; um apito ao ouvido. Aqui «CQ» (ficha 48).","r":[["Velocidade","20 palavras/min, ponto de 60 ms, a 700 Hz: «CQ CQ CQ DE F4ABC K»"],["De ouvido","Apitos puros, longos e curtos, de uma só nota"],["Descodificação","De ouvido, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: duas frequências","h":"A frequência salta entre dois valores, um para 0, outro para 1.","l":"Dois traços paralelos: 170 Hz de afastamento nos radioamadores (45,45 bauds), 450 ou 850 Hz nos boletins meteorológicos. Um «tidilidi» regular (ficha 32).","r":[["Código","Baudot ITA2: 5 bits + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Texto","RYRYRYRY CQ CQ DE F4ABC"],["Descodificação","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 bauds: APRS e packet","h":"Dois tons áudio, 1200 e 2200 Hz, enviados para um emissor FM.","l":"Visto depois do recetor FM (som do altifalante): uma banda de 1200 a 2200 Hz, em rajadas curtas. Ao ouvido, um «grrrt» de um segundo (fichas 35 e 36).","r":[["Frequência","144,800 MHz na Europa (APRS), FM"],["Trama","Flags 0x7E e depois dados AX.25 em NRZI"],["Descodificação","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"t":"PSK31: modulação de fase","h":"A frequência não se mexe, é a fase que se inverte; a amplitude cava em cada inversão.","l":"Um traço muito fino de cerca de 60 Hz, um pouco «entrançado». Dezenas de estações cabem em 3 kHz (ficha 29).","r":[["Código","Varicode: 0 = inversão de fase, 1 = sem mudança; em repouso, dois traços gémeos"],["Onde ouvir","14 070 kHz, 3580 kHz"],["Descodificação","fldigi"]]},"ft8":{"t":"MFSK / FT8: oito tons","h":"A frequência sobe e desce em degraus de 6,25 Hz, 0,16 s por degrau.","l":"Bandas de cerca de 50 Hz que duram 12,6 s e voltam a cada 15 s, acertadas pela hora: várias estações ao mesmo tempo em 3 kHz, por exemplo em 7,074 MHz (ficha 29).","r":[["Trama","79 símbolos de 0,16 s, três padrões Costas (início, meio, fim); aqui oito estações"],["Frequências","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Descodificação","WSJT-X, JTDX (hora do PC exata)"]]},"ft4":{"t":"FT4: o FT8 dos concursos","h":"Quatro tons afastados 20,8 Hz, 20,8 bauds: 105 símbolos em 5 s, em períodos de 7,5 s.","l":"Bandas de cerca de 90 Hz, mais curtas e largas que o FT8, que voltam a cada 7,5 s. 14 080, 7047,5 kHz (ficha 29)."},"olivia":{"t":"Olivia 8/250: oito tons","h":"Oito tons afastados 31,25 Hz, um de cada vez, que saltam ao acaso; codificação Walsh e entrelaçamento.","l":"Um bloco de pontos dispersos em 250 Hz; descodifica muito abaixo do ruído. Uma pequena melodia aleatória ao ouvido (ficha 29)."},"hell":{"t":"Feld Hell: escrever com uma portadora","h":"A portadora liga e desliga ponto a ponto: cada letra é feita de colunas de 14 pontos, varridas de baixo para cima (245 pontos por segundo).","l":"Na cascata, um traço picotado; é o ecrã do programa (fldigi) que redesenha as letras. Um crepitar suave ao ouvido (ficha 29)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Quatro níveis de frequência: cada símbolo leva dois bits.","l":"Um bloco retangular de 6 a 12,5 kHz, cheio como ruído, muitas vezes em rajadas (o DMR divide o canal em dois intervalos). Um «frrr» rouco ao ouvido (ficha 46)."},"mt63":{"t":"MT63: mensagens de emergência (NBEMS)","h":"64 tons ao mesmo tempo, cada um modulado lentamente, com muita redundância.","l":"Um bloco plano de 1 ou 2 kHz centrado em 1500 Hz, de bordas nítidas; um sopro regular. Passa até por um microfone encostado a um altifalante (ficha 31)."},"lora":{"t":"LoRa: rampas de frequência (chirps)","h":"A frequência varre toda a largura e recomeça de baixo: a posição do salto leva os dados.","l":"Diagonais paralelas, fáceis de reconhecer: Meshtastic e MeshCore em 869,525 MHz ou 433 MHz, sensores LoRaWAN (fichas 13, 23 e 24)."},"sstv":{"t":"SSTV: imagens em áudio","h":"Um impulso de sincronismo a 1200 Hz, depois a frequência segue o brilho da linha, de 1500 (preto) a 2300 Hz (branco).","l":"Traços de sincronismo regulares e uma nuvem que muda com a imagem; um som que «chilreia» durante um a dois minutos. 14,230 MHz, ISS em 145,800 MHz (ficha 37).","r":[["Trama","Cabeçalho VIS e depois linhas: sincronismo 1200 Hz, verde, azul, vermelho; aqui 20 linhas de uma mira"],["Descodificação","QSSTV, MMSSTV, Robot36 no telemóvel"]]},"fax":{"nm":"Fax meteorológico","t":"Fax meteorológico: 1500 Hz preto, 2300 Hz branco","h":"A frequência passa do preto ao branco de forma contínua, 120 linhas por minuto.","l":"Duas bandas fixas em 1500 e 2300 Hz (800 Hz de afastamento), um «tique-taque» regular. As frequências publicadas são as da portadora: ouvir em USB 1,9 kHz abaixo (ficha 38).","r":[["Trama","Tom de arranque de 300 Hz, linhas de fase (impulso branco) e depois o mapa"],["Descodificação","fldigi, JWX, HamFax"]]},"elt":{"nm":"Sirene ELT","t":"Sirene ELT / PLB em 121,5 MHz","h":"Uma AM cujo tom desce de 1600 para 300 Hz, duas a quatro vezes por segundo.","l":"Uma portadora fixa e bandas laterais que deslizam em leque: o «uu-uu» das balizas de socorro, também em 121,375 MHz para exercícios (fichas 27 e 28)."},"406":{"nm":"Baliza 406","t":"Baliza 406 MHz: rajada BPSK","h":"Meio segundo de emissão: 160 ms de portadora pura, depois a fase oscila ±1,1 radiano a 400 bit/s.","l":"Um pequeno traço curto que volta a cada 50 s, entre 406,0 e 406,1 MHz; nada útil para ouvir, é preciso um descodificador (EPIRB 406, ficha 28)."},"adsb":{"t":"ADS-B / modo S (1090 MHz): impulsos","h":"Impulsos de 0,5 µs cuja posição leva os bits (PPM); aqui a escala de tempo está muito abrandada.","l":"Traços horizontais muito curtos em toda a largura, centenas por segundo perto de um aeroporto; é preciso uma pen SDR (ficha 15).","n":"escala de tempo muito abrandada"},"acars":{"t":"ACARS: AM e dados MSK","h":"Uma AM que transporta dois tons, 1200 e 2400 Hz, a 2400 bit/s.","l":"Rajadas de meio segundo com portadora e bandas laterais, em 131,525, 131,725 ou 131,825 MHz na Europa: um «brrrt» ao ouvido (ficha 16)."},"ais":{"t":"AIS: GMSK 9600 bauds em dois canais","h":"Uma FSK suavizada (GMSK) em rajadas de 26 ms, uma vez em 161,975 MHz, outra em 162,025 MHz (escala reduzida).","l":"Duas colunas de traços breves, a 50 kHz um do outro, um estalido regular; quanto mais navios, mais denso (ficha 19).","n":"escala reduzida"},"navtex":{"t":"NAVTEX e DSC em onda média e curta: FSK 170 Hz","h":"Como o RTTY: duas frequências a 170 Hz, mas a 100 bauds.","l":"Dois traços paralelos contínuos durante o boletim, em 518 e 490 kHz (NAVTEX) ou 2187,5 kHz (chamada seletiva digital) (ficha 20).","r":[["Código","SITOR-B, CCIR 476: 7 bits com quatro «1», com repetição FEC"],["Descodificação","fldigi, YaND"]]},"hfdl":{"t":"HFDL: os aviões em onda curta","h":"Uma PSK de 1800 bauds numa subportadora de 1440 Hz.","l":"Rajadas de cerca de 2,4 kHz entre 2,9 e 22 MHz; um chiado de modem que vai e vem (ficha 17)."},"ctcss":{"t":"CTCSS: subtom por baixo da voz","h":"Um tom grave e contínuo (67 a 254 Hz, aqui 88,5 Hz) junto à voz.","l":"Visto no som do recetor FM: um traço fixo bem em baixo, por baixo da voz; abre o squelch dos repetidores e walkie-talkies (ficha 10)."},"dtmf":{"sh":"2 tons","t":"DTMF: dois tons por tecla","h":"Cada tecla envia ao mesmo tempo um tom grave (697 a 941 Hz) e um agudo (1209 a 1633 Hz).","l":"Pares de pontos alinhados em oito colunas fixas; o «bip-bip» dos números de telefone e dos comandos de repetidores (ficha 10).","r":[["Sequência","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tons","t":"Selcall CCIR: tons em sequência","h":"Cinco tons de 100 ms seguidos, um por algarismo.","l":"Uma pequena escada de pontos, repetida; um «tululululu» rápido para chamar um rádio preciso (ficha 33).","r":[["Sequência","1 2 3 4 5, duas vezes; também descodificada pela app SelCall do UV-K1"]]},"pocsag":{"sh":"pagers","t":"POCSAG e FLEX: pagers","h":"Uma FSK a ±4,5 kHz; um preâmbulo 1010… e depois os dados (escala reduzida).","l":"Dois traços nítidos durante o preâmbulo, depois uma banda cheia; um «brrrrt» estridente. 466,075 MHz, DAPNET 439,9875 MHz (ficha 45).","n":"escala reduzida"},"ale":{"sh":"8 tons","t":"ALE: chamada automática em onda curta","h":"Oito tons de 750 a 2500 Hz, 125 bauds, em rajadas.","l":"Um bloco de cerca de 2 kHz feito de pontinhos, um a dois segundos, às vezes em várias frequências vizinhas; um chilrear agudo (ficha 34)."},"rs41":{"nm":"Radiossonda RS41","t":"Radiossonda RS41: GFSK contínua","h":"Uma FSK suavizada a 4800 bauds, sem parar; a frequência deriva devagar à medida que a sonda sobe e arrefece.","l":"Uma banda de cerca de 10 kHz que desliza na diagonal durante todo o voo, entre 400 e 406 MHz (ficha 21)."},"ook":{"nm":"Sensores 433","t":"Sensores 433 MHz: OOK","h":"A portadora liga e desliga em impulsos curtos ou longos (tudo ou nada); a mensagem repete-se três vezes.","l":"Rajadas de pontinhos, muitas vezes em triplicado, em 433,92 MHz: estações meteorológicas, sondas de temperatura, comandos à distância (ficha 22)."},"fhss":{"t":"Bluetooth: saltos de frequência (FHSS)","h":"A frequência muda 1600 vezes por segundo entre 79 canais (escala reduzida).","l":"Pequenos traços espalhados por todo o lado em 80 MHz, nunca no mesmo sítio, perto de 2,4 GHz (ficha 25).","n":"escala reduzida"},"wspr":{"t":"WSPR: balizas de propagação","h":"Quatro tons afastados 1,46 Hz, 0,68 s por símbolo, durante 110,6 s.","l":"Um traço muito fino de cerca de 6 Hz que dura quase dois minutos, a cada dois minutos pares: é preciso ampliar muito (ficha 29).","n":"excerto de 24 s (uma emissão dura 110,6 s)"},"qrss":{"t":"QRSS: Morse muito lento","h":"Uma portadora ligada e desligada, com pontos de 3 a 10 s, muitas vezes em duas frequências vizinhas (DFCW).","l":"Traços de poucos Hz de largura, lidos num ecrã de dez minutos; inaudível ao ouvido (ficha 30).","n":"acelerado: ponto de 0,6 s em vez de 3 a 10 s"},"texte":{"nm":"Texto na cascata","t":"Texto na cascata","h":"Cada linha de uma imagem torna-se um grupo de tons: o som parece ruído.","l":"O texto ou o desenho aparece diretamente no ecrã do SDR (ficha 40).","r":[["Nota","Emitido a partir de baixo da imagem: direito na cascata ao vivo, de pernas para o ar na impressão (lida de cima para baixo)"]]},"vara":{"t":"Dados HF modernos: VARA, Pactor, ARDOP","h":"Rajadas longas e cheias (OFDM ou PSK) e, entre elas, respostas curtas da outra estação.","l":"Um retângulo de cerca de 2,4 kHz que para e recomeça, com um pequeno aviso de receção no meio; um chiado entrecortado (ficha 29)."},"chirp":{"nm":"Sondador ionosférico","t":"Sondador ionosférico (chirp sounder)","h":"Uma rampa de frequência lenta que atravessa toda a banda HF; os ecos da ionosfera chegam um pouco depois.","l":"Uma diagonal que varre o ecrã, acompanhada de traços paralelos (os ecos); um «ffuit» que passa numa fração de segundo."},"oth":{"nm":"Radar trans-horizonte","t":"Radar trans-horizonte («woodpecker»)","h":"Impulsos repetidos 10 a 50 vezes por segundo, cada um com vários kHz de largura.","l":"Um bloco largo e riscado que cobre bandas inteiras; um bater de pica-pau muito regular em onda curta."},"parasites":{"nm":"Interferências","sh":"fonte","t":"Interferências de uma fonte comutada","h":"Um sinal quadrado: a sua frequência e todas as harmónicas saem ao mesmo tempo.","l":"Um pente de riscas regulares que derivam juntas sobre um fundo de ruído: procurar com NOISE FIND ou um recetor portátil (ficha K22)."},"mpx":{"nm":"FM estéreo e RDS","t":"Rádio FM estéreo e RDS","h":"O som desmodulado (multiplex) contém a via L+R, um piloto a 19 kHz, a via L-R à volta de 38 kHz e o RDS a 57 kHz.","l":"Visto de 0 a 60 kHz depois da desmodulação: um bloco grave, um traço fino a 19 kHz, um bloco mais fraco no meio e o RDS lá em cima (ficha 12).","n":"escala ÷ 20; som estéreo","r":[["Escuta","Com auscultadores: 4 s em mono (o bloco do meio, L-R, desaparece) e depois 4 s em estéreo, a melodia à esquerda e os acordes à direita."]]},"dcf77":{"t":"Sinal horário DCF77 (77,5 kHz)","h":"Uma portadora que baixa para 15 % durante 0,1 s (bit 0) ou 0,2 s (bit 1), no início de cada segundo.","l":"Um traço fixo com um corte preto a cada segundo; o segundo 59 não tem, para marcar o minuto (ficha 12).","r":[["Nota","Aqui a portadora é trazida para 1000 Hz; o 6.º segundo não tem corte, como o segundo 59 de cada minuto"]]},"ofdm":{"t":"OFDM: dezenas de subportadoras","h":"Muitas portadoras muito juntas, cada uma lenta: a soma parece ruído.","l":"Um retângulo plano de bordas nítidas, sempre presente: DRM em onda curta (10 kHz), DAB+ (1,5 MHz), TDT, Wi-Fi. Um sopro contínuo ao ouvido (fichas 12 e 25)."},"dsss":{"t":"Espetro espalhado (DSSS): GPS, Wi-Fi 802.11b","h":"Os dados são misturados com um código muito rápido: a energia espalha-se por uma grande largura.","l":"Uma bossa larga, mal acima do ruído; o GPS está mesmo abaixo do ruído e não se vê sem tratamento (fichas 25 e 26)."},"hline":{"nm":"Risca do hidrogénio","sh":"1420 MHz","t":"Risca do hidrogénio de 21 cm (1420,405 MHz)","h":"O hidrogénio frio da Via Láctea emite um sopro muito fraco em 1420,405 MHz. O movimento dos braços da galáxia desloca-o por efeito Doppler: veem-se várias pequenas bossas.","l":"Quase nada na cascata de um segundo para o outro: é preciso fazer a média durante muito tempo para ver as bossas saírem do ruído. Aqui, olha para o espetro médio com a reprodução parada. Basta uma parabólica ou uma corneta, um pré-amplificador e uma pen SDR.","n":"sinal muito exagerado"},"sun":{"nm":"Sol","sh":"explosões","t":"Sol: explosões rádio do tipo III","h":"Eletrões lançados por uma erupção atravessam a coroa solar e fazem-na emitir cada vez mais baixo em frequência à medida que se afastam.","l":"Traços que caem na diagonal de cima para baixo do espetro em menos de um segundo, sobre um fundo de ruído solar; um «chhhh» que cresce. De cerca de 10 a 400 MHz, também em onda curta perto de 20 MHz."},"jupiter":{"nm":"Júpiter","sh":"20 MHz","t":"Júpiter: explosões decamétricas (L e S)","h":"O campo magnético de Júpiter e a sua lua Io produzem emissões fortes entre 15 e 40 MHz: explosões L lentas e explosões S muito curtas que descem depressa.","l":"Primeiro ondas de sopro (L, como a rebentação), depois séries de pequenos «pops» (S) em diagonais apertadas. Perto de 20,1 MHz à noite, com um simples dipolo, quando Io está bem colocada."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Uma estrela de neutrões em rotação varre a Terra com um feixe rádio, aqui a cada 0,714 s. O gás interestelar atrasa as frequências baixas: cada impulso chega primeiro ao topo do espetro.","l":"Um «tique» regular; na cascata, cada impulso é uma curva que desce (dispersão). O sinal real está abaixo do ruído: é preciso uma grande antena e somar os impulsos sobre o seu período.","n":"sinal muito exagerado"},"meteor":{"nm":"Meteoros","sh":"GRAVES","t":"Ecos de meteoros do radar GRAVES (143,050 MHz)","h":"O radar francês GRAVES emite sem parar em 143,050 MHz. Quando uma estrela cadente ioniza o ar, o seu rasto devolve um pouco desse sinal ao teu recetor, de uma fração de segundo a alguns segundos.","l":"Em USB em 143,049 MHz: «pings» curtos perto de 1000 Hz, às vezes um eco que desliza (a cabeça do meteoro, efeito Doppler) ou que dura. Muitos mais durante as chuvas de meteoros (Perseidas, Geminídeas) (ficha 1)."},"whistler":{"nm":"Assobios","sh":"VLF","t":"Assobios VLF (whistlers)","h":"Um relâmpago cria um estalo rádio; parte dele segue as linhas do campo magnético da Terra até ao outro hemisfério e volta, os agudos primeiro.","l":"Um «fiuuu» que desce do agudo ao grave em um ou dois segundos, logo após um estalo; estalidos (sferics) por todo o lado. Abaixo de 10 kHz, com um recetor VLF longe das linhas elétricas."},"chorus":{"nm":"Coro da madrugada","sh":"VLF","t":"Coro da madrugada (dawn chorus)","h":"Durante uma tempestade magnética, eletrões presos na magnetosfera emitem pequenas notas ascendentes, sobretudo ao nascer do sol.","l":"Chilreios ascendentes que se sobrepõem, como pássaros, de 1 a 4 kHz aproximadamente. O mesmo equipamento que para os assobios."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"O primeiro satélite artificial emitia bips de cerca de 0,3 s em 20,005 e 40,002 MHz, alternadamente, durante três semanas.","l":"Um traço cortado com regularidade: «bip… bip…», o som que o mundo inteiro ouviu em outubro de 1957 (reconstituição)."},"doppler":{"nm":"Efeito Doppler","sh":"satélite","t":"Baliza de satélite e efeito Doppler","h":"Um satélite em órbita baixa aproxima-se e depois afasta-se: a frequência recebida desce durante a passagem, cerca de ±3 kHz em 145 MHz e ±10 kHz em 435 MHz.","l":"Um traço que desce em forma de S: devagar ao início, depressa quando o satélite passa mais perto, e de novo devagar (ficha 41).","n":"passagem de 10 min reduzida a 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satélites NOAA: imagens APT (histórico)","h":"Uma subportadora de 2400 Hz modulada em amplitude pela imagem, duas linhas por segundo, com um impulso de sincronismo no início de cada linha. Desligado em 2025; hoje os Meteor-M emitem em LRPT.","l":"Um traço em 2400 Hz com bandas laterais que mudam com a imagem, e o famoso «tique-taque» duas vezes por segundo (ficha 41)."},"eme":{"nm":"Eco da Lua","sh":"EME","t":"Eco da Lua (EME)","h":"Um sinal enviado para a Lua volta cerca de 2,5 s depois, enormemente enfraquecido, um pouco alargado e deslocado pelo Doppler.","l":"Ouve-se o próprio «bip» e, 2,5 s depois, o seu eco fraco e um pouco desfocado. Os radioamadores fazem-no em CW ou JT65, a partir de 144 MHz (ficha 1).","n":"eco muito exagerado"},"msk144":{"nm":"MSK144","sh":"meteoros","t":"MSK144: o modo digital dos meteoros","h":"Dois tons, 1000 e 2000 Hz, a 2000 bauds, em tramas de 72 ms repetidas sem parar: cada rasto de meteoro deixa passar algumas.","l":"Rajadas de 0,1 a 1 s, com cerca de 2,4 kHz de largura, que aparecem e se apagam com o «ping» do meteoro. Em 50 e 144 MHz, com o WSJT-X."},"jt65":{"nm":"JT65","sh":"65 tons","t":"JT65: 65 tons, muito lento","h":"Um tom de sincronismo e 64 tons de dados afastados 2,7 Hz (JT65A), 0,37 s por símbolo, 47 s de emissão por minuto.","l":"Uma escada de pequenos traços em cerca de 180 Hz, com um traço de sincronismo que volta sempre ao mesmo sítio. Usado para o ressalto lunar (JT65B e C) e sinais muito fracos.","n":"excerto de 20 s (uma emissão dura 47 s)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: rede digital profissional","h":"Modulação de fase π/4-DQPSK a 18 000 símbolos por segundo, quatro canais partilhados no tempo, em canais de 25 kHz.","l":"Um bloco cheio de flancos arredondados, sempre presente perto de uma estação de base; um sopro rouco. Cifrado: não se pode ouvir (ficha 46).","n":"escala reduzida"},"ndb":{"nm":"Radiofarol NDB","sh":"190–535 kHz","t":"NDB: radiofarol não direcional","h":"Uma portadora fixa em onda longa, com um indicativo Morse de duas ou três letras enviado num tom (muitas vezes 1020 Hz).","l":"Um traço fixo ao centro e, durante o indicativo, dois pequenos traços de cada lado. De cerca de 190 a 535 kHz, em BLU ou CW (ficha 12)."},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR: radiofarol omnidirecional","h":"Em AM: um sinal de 30 Hz que depende da direção, uma subportadora de 9960 Hz modulada em frequência a 30 Hz (a referência) e o indicativo Morse em 1020 Hz.","l":"No som desmodulado: um zumbido grave de 30 Hz, um traço largo ondulante perto de 10 kHz e o indicativo de vez em quando (ficha 18).","n":"som desmodulado, escala ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS: guiamento na aterragem (localizer)","h":"Em AM, dois tons de 90 e 150 Hz; a sua relação diz ao avião se está à esquerda ou à direita do eixo. O indicativo Morse começa por I.","l":"No som desmodulado: dois traços muito graves em 90 e 150 Hz e o indicativo em 1020 Hz. Entre 108,1 e 112 MHz; a rampa de descida está perto de 330 MHz (ficha 18)."},"m10":{"nm":"Sondas M10 / M20","sh":"Meteomodem","t":"Radiossondas M10 e M20 (Meteomodem)","h":"Uma trama por segundo em FSK rápida (cerca de 9600 bauds): mais larga do que a RS41. Lançadas em França pela Météo-France.","l":"Uma rajada larga a cada segundo, que deriva devagar durante o voo; entre 400 e 406 MHz (ficha 21)."},"tpms":{"nm":"Pneus (TPMS)","sh":"433 MHz","t":"Sensores de pressão dos pneus (TPMS)","h":"Cada roda envia de vez em quando uma rajada FSK de poucos milissegundos: pressão, temperatura, identificador.","l":"Pequenas rajadas isoladas em 433,92 MHz (ou 315 MHz), muitas vezes aos pares, quando passa um carro. Descodificadas pelo rtl_433."},"als162":{"nm":"ALS162","sh":"162 kHz","t":"Sinal horário ALS162 (Allouis, 162 kHz)","h":"A portadora da antiga onda longa da France Inter; a hora é codificada por pequenas modulações de fase, inaudíveis.","l":"Um traço fixo, muito forte em França, mal alargado no início de cada segundo; é preciso um descodificador para ler a hora (ficha 12)."},"wwv":{"nm":"WWV","sh":"2,5–20 MHz","t":"Sinal horário WWV (Colorado)","h":"Em AM: um «tique» de 5 ms a 1000 Hz a cada segundo, um tom de 500 ou 600 Hz, um código horário em 100 Hz e uma voz que anuncia a hora UTC.","l":"No som desmodulado: um traço em 500 Hz cortado a cada segundo, o tique em 1000 Hz e o código lá em baixo em 100 Hz (ficha 12)."},"msf":{"nm":"MSF","sh":"60 kHz","t":"Sinal horário MSF (Anthorn, 60 kHz)","h":"A portadora é cortada no início de cada segundo durante 0,1, 0,2 ou 0,3 s conforme os bits, e 0,5 s para marcar o minuto.","l":"Um traço fixo com buracos totalmente pretos a cada segundo, mais longos do que no DCF77 (ficha 12)."},"type2":{"nm":"Sol tipo II","sh":"onda de choque","t":"Sol: explosões rádio do tipo II","h":"A onda de choque de uma ejeção de massa coronal faz o plasma emitir cada vez mais baixo, devagar, muitas vezes em duas bandas (a fundamental e o seu dobro).","l":"Duas bandas de ruído paralelas que descem suavemente durante vários minutos. Compara com as do tipo III, muito mais rápidas.","n":"vários minutos reduzidos a 6 s"},"tweeks":{"nm":"Tweeks","sh":"VLF","t":"Tweeks: os «pings» noturnos em VLF","h":"De noite, o estalo de um relâmpago distante ressalta entre o solo e a ionosfera; as frequências perto do corte (cerca de 1,7 kHz) chegam por último.","l":"Um pequeno «ping» que desce e para perto de 1,7 kHz, às vezes com um eco no dobro; estalidos por todo o lado. Abaixo de 10 kHz, de noite."},"hiss":{"nm":"Sopro VLF","sh":"hiss","t":"Sopro VLF (hiss)","h":"Um ruído largo produzido pelos eletrões da plasmasfera, que sobe e desce com a atividade magnética.","l":"Uma banda de sopro de algumas centenas de Hz a alguns kHz, sem padrão, que cresce e decai devagar."},"aurora":{"nm":"Aurora rádio","sh":"Au","t":"Propagação auroral (Au)","h":"Uma aurora boreal reflete as ondas VHF, mas agita-as muito depressa: cada sinal fica espalhado por várias centenas de Hz.","l":"O CW torna-se um sopro áspero, como sussurrado; já não se ouve a nota. Em 50 e 144 MHz, apontando para norte durante as tempestades magnéticas."},"galactic":{"nm":"Ruído galáctico","sh":"20–40 MHz","t":"Ruído da Via Láctea","h":"O centro da galáxia emite um sopro rádio que Karl Jansky descobriu em 1932 perto de 20 MHz. Sobe e desce com a rotação da Terra.","l":"Um ruído de fundo que sobe devagar e volta a descer, cada dia cerca de 4 minutos mais cedo. Visível com um simples dipolo entre 20 e 40 MHz.","n":"um dia reduzido a 12 s"},"cubesat":{"nm":"CubeSat","sh":"9600 bd","t":"Telemetria de CubeSat","h":"Os pequenos satélites enviam regularmente as suas medidas (bateria, temperaturas) em FSK ou GMSK a 1200 ou 9600 bauds, perto de 435–438 MHz.","l":"Rajadas regulares que descem um pouco de cada vez, por efeito Doppler, durante a passagem (ficha 41).","n":"escala reduzida, passagem acelerada"},"issfm":{"nm":"ISS em FM","sh":"145,800 MHz","t":"Estação espacial (ISS): voz em FM","h":"Os astronautas falam com escolas e radioamadores em FM em 145,800 MHz. A estação voa a 28 000 km/h: durante a passagem, a frequência recebida desliza de cerca de +3,5 kHz para −3,5 kHz.","l":"Uma banda de voz FM que se desloca devagar da direita para a esquerda durante os 10 minutos da passagem (ficha 41).","n":"passagem de 10 min reduzida a 10 s"},"buzzer":{"nm":"UVB-76 «The Buzzer»","sh":"4625 kHz","t":"UVB-76, «The Buzzer» (4625 kHz)","h":"Uma estação militar russa que emite há décadas um zumbido de cerca de um segundo, umas 25 vezes por minuto, por vezes interrompido por uma mensagem de voz.","l":"Uma portadora fixa e, em cada zumbido, uma coluna de riscas apertadas de cima a baixo. Fácil de encontrar em 4625 kHz em USB."},"pip":{"nm":"«The Pip»","sh":"3756 / 5448 kHz","t":"«The Pip»: bips sem fim","h":"Outra baliza militar russa de onda curta, que repete pequenos bips curtos dia e noite, por vezes interrompidos por mensagens.","l":"Um traço fixo cortado por um bip curto cerca de 50 vezes por minuto; ao ouvido, um «pip… pip…» regular que nunca para.","n":"ritmo aproximado"},"squeaky":{"nm":"«Squeaky Wheel»","sh":"OC","t":"«Squeaky Wheel»: a roda que chia","h":"Uma baliza militar russa de onda curta, batizada pelos ouvintes segundo o seu padrão sonoro repetido.","l":"Um pequeno padrão de dois sons, um deles a subir, repetido em ciclo: como uma roda que chia.","n":"imitação aproximada"},"codar":{"nm":"CODAR","sh":"radar oceânico","t":"CODAR: radares das correntes marinhas","h":"Radares costeiros varrem uma banda de frequências uma ou duas vezes por segundo para medir correntes e ondas.","l":"Diagonais paralelas regulares e um «swish» repetido; perto de 4,5–5,5 MHz, 13 MHz e 25 MHz, muitas vezes dia e noite.","n":"escala reduzida"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Modem militar STANAG 4285","h":"Modulação de fase 8-PSK a 2400 bauds numa portadora de 1800 Hz, com uma sequência de teste a cada 107 ms para seguir o canal.","l":"Um bloco cheio de cerca de 3 kHz; ao ouvido, um sopro com um zumbido regular (ficha 43)."},"link11":{"nm":"Link-11","sh":"16 tons","t":"Link-11: ligação de dados naval","h":"Dezasseis tons de 605 a 2915 Hz emitidos em conjunto, cada um modulado em fase 75 vezes por segundo.","l":"Um pente de catorze riscas regulares de 935 a 2365 Hz, mais duas riscas à parte em 605 e 2915 Hz; ao ouvido, um zumbido musical (ficha 43)."},"numbers":{"nm":"Estação de números","sh":"voz","t":"Estação de números","h":"A uma hora fixa, uma pequena melodia de chamada e depois uma voz (muitas vezes sintética) que lê grupos de cinco algarismos, em AM ou BLU.","l":"A melodia em notas soltas e depois grupos regulares de sílabas separados por silêncios (ficha 43).","n":"voz imitada, sem algarismos reais"},"rttydwd":{"nm":"RTTY meteo DWD","sh":"50 Bd / 450 Hz","t":"RTTY meteorológico do DWD (Alemanha)","h":"Como o RTTY dos radioamadores, mas a 50 bauds com 450 Hz de desvio: o serviço meteorológico alemão envia os boleti
