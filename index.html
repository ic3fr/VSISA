т, між 400 і 406 МГц (аркуш 21)."},"ook":{"nm":"Датчики 433","t":"Датчики 433 МГц: OOK","h":"Несуча вмикається й вимикається короткими або довгими імпульсами (усе або нічого); повідомлення повторюється тричі.","l":"Пачки дрібних точок, часто по три, на 433,92 МГц: метеостанції, датчики температури, пульти (аркуш 22)."},"fhss":{"t":"Bluetooth: стрибки частоти (FHSS)","h":"Частота змінюється 1600 разів на секунду серед 79 каналів (зменшений масштаб).","l":"Дрібні рисочки розкидані по всіх 80 МГц, ніколи в одному місці, біля 2,4 ГГц (аркуш 25).","n":"зменшений масштаб"},"wspr":{"t":"WSPR: маяки проходження","h":"Чотири тони через 1,46 Гц, 0,68 с на символ, протягом 110,6 с.","l":"Дуже тонка лінія близько 6 Гц завдовжки майже дві хвилини, кожні парні дві хвилини: треба сильно збільшити (аркуш 29).","n":"фрагмент 24 с (передача триває 110,6 с)"},"qrss":{"t":"QRSS: дуже повільна морзянка","h":"Несуча вмикається й вимикається, крапки по 3–10 с, часто на двох сусідніх частотах (DFCW).","l":"Лінії шириною кілька Гц, читаються на десятихвилинному екрані; на слух не сприймається (аркуш 30).","n":"прискорено: крапка 0,6 с замість 3–10 с"},"texte":{"nm":"Текст у водоспаді","t":"Текст у водоспаді","h":"Кожен рядок картинки стає групою тонів: звук схожий на шум.","l":"Текст або малюнок з'являється просто на екрані SDR (аркуш 40).","r":[["Примітка","Передається з низу картинки: рівно в живому водоспаді, догори дриґом у відбитку (читається згори донизу)"]]},"vara":{"t":"Сучасні дані КХ: VARA, Pactor, ARDOP","h":"Довгі суцільні пачки (OFDM або PSK), а між ними короткі відповіді іншої станції.","l":"Прямокутник близько 2,4 кГц, що зупиняється й починається знову, з маленьким підтвердженням посередині; рване шипіння (аркуш 29)."},"chirp":{"nm":"Іонозонд","t":"Іонозонд (ЛЧМ-зондування)","h":"Повільна частотна пилка через увесь КХ-діапазон; відлуння від іоносфери приходить трохи пізніше.","l":"Діагональ через екран разом із паралельними лініями (відлуння); «ффюїть», що пролітає за частку секунди."},"oth":{"nm":"Загоризонтний радар","t":"Загоризонтний радар («дятел»)","h":"Імпульси повторюються 10–50 разів на секунду, кожен шириною кілька кГц.","l":"Широкий смугастий блок, що перекриває цілі діапазони; дуже рівний стукіт дятла на КХ."},"parasites":{"nm":"Завади","sh":"блок живлення","t":"Завади від імпульсного блока живлення","h":"Прямокутний сигнал: його частота й усі гармоніки виходять одночасно.","l":"Гребінка рівних ліній, що дрейфують разом, на тлі шуму: шукай з NOISE FIND або переносним приймачем (аркуш K22)."},"mpx":{"nm":"FM-стерео і RDS","t":"FM-стерео і RDS","h":"Демодульований звук (мультиплекс) містить канал L+R, пілот 19 кГц, канал L-R біля 38 кГц і RDS на 57 кГц.","l":"Від 0 до 60 кГц після демодуляції: низький блок, тонка лінія на 19 кГц, слабший блок посередині й RDS на самому верху (аркуш 12).","n":"масштаб ÷ 20; стереозвук","r":[["Прослуховування","У навушниках: 4 с моно (середній блок L-R зникає), потім 4 с стерео: мелодія ліворуч, акорди праворуч."]]},"dcf77":{"t":"Сигнал часу DCF77 (77,5 кГц)","h":"Несуча падає до 15 % на 0,1 с (біт 0) або 0,2 с (біт 1) на початку кожної секунди.","l":"Нерухома лінія з чорним провалом щосекунди; на 59-й секунді провалу немає, це позначка хвилини (аркуш 12).","r":[["Примітка","Тут несучу перенесено на 1000 Гц; на 6-й секунді провалу немає, як на 59-й секунді кожної хвилини"]]},"ofdm":{"t":"OFDM: десятки піднесучих","h":"Багато щільно укладених несучих, кожна повільна: сума схожа на шум.","l":"Плаский прямокутник із чіткими краями, завжди на місці: DRM на КХ (10 кГц), DAB+ (1,5 МГц), DVB-T, Wi-Fi. На слух рівне шипіння (аркуші 12 і 25)."},"dsss":{"t":"Розширений спектр (DSSS): GPS, Wi-Fi 802.11b","h":"Дані змішуються з дуже швидким кодом: енергія розмазується по широкій смузі.","l":"Широкий горб ледь над шумом; GPS навіть нижче шуму й без обробки не видно (аркуші 25 і 26)."},"hline":{"nm":"Лінія водню","sh":"1420 МГц","t":"Лінія водню 21 см (1420,405 МГц)","h":"Холодний водень Чумацького Шляху випромінює дуже слабкий шум на 1420,405 МГц. Рух спіральних рукавів зсуває його ефектом Доплера: видно кілька маленьких горбів.","l":"У водоспаді від секунди до секунди майже нічого: треба довго усереднювати, щоб горби вийшли з шуму. Тут подивись на середній спектр у зупинці. Досить тарілки або рупора, малошумного підсилювача та SDR-донгла.","n":"сигнал дуже перебільшено"},"sun":{"nm":"Сонце","sh":"сплески","t":"Сонце: радіосплески III типу","h":"Електрони, викинуті спалахом, проходять крізь сонячну корону й змушують її випромінювати дедалі нижче за частотою, віддаляючись.","l":"Лінії, що падають навскіс згори донизу спектра менш ніж за секунду, на тлі сонячного шуму; наростаюче «шшшш». Приблизно від 10 до 400 МГц, також на КХ біля 20 МГц."},"jupiter":{"nm":"Юпітер","sh":"20 МГц","t":"Юпітер: декаметрові сплески (L і S)","h":"Магнітне поле Юпітера та його супутник Іо дають потужне випромінювання між 15 і 40 МГц: повільні L-сплески та дуже короткі S-сплески, що швидко ковзають донизу.","l":"Спершу хвилі шуму (L, як прибій), потім серії маленьких «хлопків» (S) щільними діагоналями. Біля 20,1 МГц уночі, на простий диполь, коли Іо вдало розташована."},"pulsar":{"nm":"Пульсар","sh":"B0329+54","t":"Пульсар PSR B0329+54","h":"Нейтронна зоря, що обертається, проводить по Землі радіопроменем, тут кожні 0,714 с. Міжзоряний газ затримує низькі частоти: кожен імпульс приходить спершу вгорі спектра.","l":"Рівне «тік»; у водоспаді кожен імпульс — низхідна крива (дисперсія). Справжній сигнал під шумом: потрібна велика антена й додавання імпульсів за їхнім періодом.","n":"сигнал дуже перебільшено"},"meteor":{"nm":"Метеори","sh":"GRAVES","t":"Метеорні відбиття радара GRAVES (143,050 МГц)","h":"Французький радар GRAVES безперервно випромінює на 143,050 МГц. Коли падаюча зоря іонізує повітря, її слід відбиває трохи сигналу до твого приймача — на частку секунди чи кілька секунд.","l":"В USB на 143,049 МГц: короткі «пінги» біля 1000 Гц, іноді ковзне відлуння (голова метеора, ефект Доплера) або довге. Значно більше під час потоків (Персеїди, Гемініди) (аркуш 1)."},"whistler":{"nm":"Свисти","sh":"ННЧ","t":"ННЧ-свисти (вістлери)","h":"Блискавка дає радіоклацання; частина його йде вздовж силових ліній магнітного поля Землі в іншу півкулю й назад, високі тони першими.","l":"«Фʼюююю», що спускається від високих до низьких за одну-дві секунди одразу після клацання; усюди тріск (сферики). Нижче 10 кГц, на ННЧ-приймач далеко від ліній електропередачі."},"chorus":{"nm":"Ранковий хор","sh":"ННЧ","t":"Ранковий хор (dawn chorus)","h":"Під час магнітної бурі електрони, захоплені магнітосферою, видають маленькі висхідні ноти, особливо на світанку.","l":"Висхідне щебетання, що накладається, як птахи, приблизно від 1 до 4 кГц. Те саме обладнання, що й для свистів."},"sputnik":{"nm":"Супутник-1","sh":"1957","t":"Супутник-1 (1957)","h":"Перший штучний супутник три тижні передавав сигнали близько 0,3 с почергово на 20,005 і 40,002 МГц.","l":"Регулярно перервана лінія: «біп… біп…» — звук, який у жовтні 1957 року слухав увесь світ (реконструкція)."},"doppler":{"nm":"Ефект Доплера","sh":"супутник","t":"Маяк супутника й ефект Доплера","h":"Супутник на низькій орбіті наближається, потім віддаляється: прийнята частота під час прольоту падає приблизно на ±3 кГц на 145 МГц і ±10 кГц на 435 МГц.","l":"Лінія, що спадає S-подібно: спершу повільно, швидко в точці найбільшого зближення, потім знову повільно (аркуш 41).","n":"проліт 10 хв стиснуто до 12 с"},"apt":{"nm":"NOAA APT","sh":"137 МГц","t":"Супутники NOAA: зображення APT (історія)","h":"Піднесуча 2400 Гц, амплітудно модульована зображенням, два рядки за секунду, із синхроімпульсом на початку кожного рядка. Вимкнено у 2025 році; тепер супутники «Метеор-М» передають LRPT.","l":"Лінія на 2400 Гц із бічними смугами, що змінюються разом із зображенням, і знамените «тік-так» двічі на секунду (аркуш 41)."},"eme":{"nm":"Відлуння від Місяця","sh":"EME","t":"Відлуння від Місяця (EME)","h":"Сигнал, надісланий до Місяця, повертається приблизно за 2,5 с, надзвичайно ослаблений, трохи розмитий і зсунутий Доплером.","l":"Чуєш своє «біп», а за 2,5 с його слабке, трохи розмите відлуння. Радіоаматори роблять це в CW або JT65, від 144 МГц і вище (аркуш 1).","n":"відлуння дуже перебільшено"},"msk144":{"nm":"MSK144","sh":"метеори","t":"MSK144: цифровий вид зв'язку через метеори","h":"Два тони, 1000 і 2000 Гц, 2000 Бод, кадри по 72 мс повторюються без перерви: кожен метеорний слід пропускає кілька з них.","l":"Пачки від 0,1 до 1 с завширшки близько 2,4 кГц, що з'являються й гаснуть разом із «пінгом» метеора. На 50 і 144 МГц, з WSJT-X."},"jt65":{"nm":"JT65","sh":"65 тонів","t":"JT65: 65 тонів, дуже повільно","h":"Один синхротон і 64 тони даних через 2,7 Гц (JT65A), 0,37 с на символ, 47 с передачі за хвилину.","l":"Драбинка дрібних рисочок на 180 Гц із лінією синхронізації, що весь час повертається на те саме місце. Використовується для зв'язку через Місяць (JT65B і C) і дуже слабких сигналів.","n":"фрагмент 20 с (передача триває 47 с)"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA: професійна цифрова мережа","h":"Фазова модуляція π/4-DQPSK, 18 000 символів за секунду, чотири тайм-слоти, канали по 25 кГц.","l":"Суцільний блок із заокругленими краями, постійно присутній біля базової станції; хрипке шипіння. Зашифровано: прослухати не можна (аркуш 46).","n":"зменшений масштаб"},"ndb":{"nm":"Маяк NDB","sh":"190–535 кГц","t":"NDB: ненаправлений радіомаяк","h":"Нерухома несуча на довгих хвилях із позивним Морзе з двох-трьох літер, що передається тоном (часто 1020 Гц).","l":"Нерухома лінія в центрі, а під час позивного дві рисочки з боків. Приблизно 190–535 кГц, в SSB або CW (аркуш 12)."},"vor":{"nm":"VOR","sh":"108–118 МГц","t":"VOR: всеспрямований радіомаяк","h":"В AM: сигнал 30 Гц, що залежить від напрямку, піднесуча 9960 Гц із частотною модуляцією 30 Гц (опорний сигнал) і позивний Морзе на 1020 Гц.","l":"У демодульованому звуці: низький гул 30 Гц, широка хвиляста лінія біля 10 кГц і час від часу позивний (аркуш 18).","n":"демодульований звук, масштаб ÷ 2"},"ils":{"nm":"ILS","sh":"90 + 150 Гц","t":"ILS: курсовий маяк системи посадки","h":"В AM два тони, 90 і 150 Гц; їхнє співвідношення каже літаку, лівіше він від осі чи правіше. Позивний Морзе починається з I.","l":"У демодульованому звуці: дві дуже низькі лінії на 90 і 150 Гц і позивний на 1020 Гц. Між 108,1 і 112 МГц; глісадний маяк біля 330 МГц (аркуш 18)."},"m10":{"nm":"Зонди M10 / M20","sh":"Meteomodem","t":"Радіозонди M10 і M20 (Meteomodem)","h":"Один кадр за секунду, швидка FSK (близько 9600 Бод): ширше, ніж у RS41. У Франції їх запускає Météo-France.","l":"Щосекунди широка пачка, що повільно дрейфує під час польоту; між 400 і 406 МГц (аркуш 21)."},"tpms":{"nm":"Шини (TPMS)","sh":"433 МГц","t":"Датчики тиску в шинах (TPMS)","h":"Кожне колесо час від часу надсилає FSK-пачку в кілька мілісекунд: тиск, температура, ідентифікатор.","l":"Маленькі поодинокі пачки на 433,92 МГц (або 315 МГц), часто парами, коли проїжджає авто. Декодуються rtl_433."},"als162":{"nm":"ALS162","sh":"162 кГц","t":"Сигнал часу ALS162 (Аллуї, 162 кГц)","h":"Несуча колишнього довгохвильового мовлення France Inter; час закодовано невеликими нечутними змінами фази.","l":"Нерухома лінія, дуже сильна у Франції, ледь розширена на початку кожної секунди; щоб прочитати час, потрібен декодер (аркуш 12)."},"wwv":{"nm":"WWV","sh":"2,5–20 МГц","t":"Сигнал часу WWV (Колорадо)","h":"В AM: щосекунди «тік» 5 мс на 1000 Гц, тон 500 або 600 Гц, код часу на 100 Гц і голос, що оголошує час UTC.","l":"У демодульованому звуці: лінія 500 Гц, перервана щосекунди, тік на 1000 Гц і код у самому низу на 100 Гц (аркуш 12)."},"msf":{"nm":"MSF","sh":"60 кГц","t":"Сигнал часу MSF (Анторн, 60 кГц)","h":"Несучу вимикають на початку кожної секунди на 0,1, 0,2 або 0,3 с залежно від бітів і на 0,5 с для позначки хвилини.","l":"Нерухома лінія з повністю чорними провалами щосекунди, довшими, ніж у DCF77 (аркуш 12)."},"type2":{"nm":"Сонце, II тип","sh":"ударна хвиля","t":"Сонце: радіосплески II типу","h":"Ударна хвиля корональних викидів маси змушує плазму повільно випромінювати дедалі нижче, часто у двох смугах (основній і подвоєній).","l":"Дві паралельні смуги шуму, що плавно опускаються кілька хвилин. Порівняй зі сплесками III типу, значно швидшими.","n":"кілька хвилин стиснуто до 6 с"},"tweeks":{"nm":"Твіки","sh":"ННЧ","t":"Твіки: нічні ННЧ-«пінги»","h":"Уночі клацання далекої блискавки відбивається між землею й іоносферою; частоти біля критичної (близько 1,7 кГц) приходять останніми.","l":"Короткий «пінг», що спускається й уривається біля 1,7 кГц, іноді з відлунням на подвоєній частоті; усюди тріск. Нижче 10 кГц, уночі."},"hiss":{"nm":"ННЧ-шипіння","sh":"hiss","t":"ННЧ-шипіння (hiss)","h":"Широкосмуговий шум електронів плазмосфери, що посилюється й слабне з магнітною активністю.","l":"Смуга шипіння від кількох сотень Гц до кількох кГц, без малюнка, що повільно наростає й спадає."},"aurora":{"nm":"Радіоаврора","sh":"Au","t":"Авроральне проходження (Au)","h":"Полярне сяйво відбиває УКХ, але дуже швидко їх трясе: кожен сигнал розмазується на кілька сотень Гц.","l":"CW перетворюється на шорстке шипіння, ніби шепіт; тону вже не чути. На 50 і 144 МГц, антена на північ під час магнітних бур."},"galactic":{"nm":"Галактичний шум","sh":"20–40 МГц","t":"Шум Чумацького Шляху","h":"Центр Галактики випромінює радіошум, який Карл Янський відкрив 1932 року біля 20 МГц. Він зростає й спадає з обертанням Землі.","l":"Фоновий шум, що повільно зростає й знову спадає, щодня приблизно на 4 хвилини раніше. Видно на простий диполь між 20 і 40 МГц.","n":"добу стиснуто до 12 с"},"cubesat":{"nm":"CubeSat","sh":"9600 Бод","t":"Телеметрія кубсата","h":"Малі супутники регулярно передають свої вимірювання (батарея, температури) у FSK або GMSK зі швидкістю 1200 або 9600 Бод біля 435–438 МГц.","l":"Регулярні пачки, щоразу трохи нижчі через ефект Доплера під час прольоту (аркуш 41).","n":"зменшений масштаб, проліт прискорено"},"issfm":{"nm":"МКС у FM","sh":"145,800 МГц","t":"Космічна станція (МКС): голос у FM","h":"Астронавти говорять зі школами й радіоаматорами у FM на 145,800 МГц. Станція летить зі швидкістю 28 000 км/год: за проліт прийнята частота сповзає приблизно з +3,5 кГц до −3,5 кГц.","l":"Смуга FM-голосу, що повільно зсувається справа наліво за 10 хвилин прольоту (аркуш 41).","n":"проліт 10 хв стиснуто до 10 с"},"buzzer":{"nm":"УВБ-76 «Дзижчалка»","sh":"4625 кГц","t":"УВБ-76, «Дзижчалка» (The Buzzer, 4625 кГц)","h":"Російська військова станція, яка десятиліттями передає дзижчання близько секунди приблизно 25 разів на хвилину, іноді переривається голосовим повідомленням.","l":"Нерухома несуча й за кожного дзижчання стовпець щільних ліній згори донизу. Легко знайти на 4625 кГц в USB."},"pip":{"nm":"«The Pip»","sh":"3756 / 5448 кГц","t":"«The Pip»: нескінченні писки","h":"Ще один російський військовий короткохвильовий маяк, що вдень і вночі повторює короткі писки, іноді перервані повідомленнями.","l":"Нерухома лінія, яку приблизно 50 разів на хвилину перериває короткий писк; на слух рівне «піп… піп…» без кінця.","n":"ритм приблизний"},"squeaky":{"nm":"«Squeaky Wheel»","sh":"КХ","t":"«Squeaky Wheel»: рипуче колесо","h":"Російський військовий короткохвильовий маяк, названий слухачами за повторюваним звуковим малюнком.","l":"Маленький малюнок із двох звуків, один із яких піднімається, повторюється по колу: як рипуче колесо.","n":"приблизна імітація"},"codar":{"nm":"CODAR","sh":"морський радар","t":"CODAR: радари морських течій","h":"Берегові радари один-два рази на секунду пробігають смугу частот, щоб вимірювати течії та хвилі.","l":"Регулярні паралельні діагоналі й повторюване «свіш»; біля 4,5–5,5 МГц, 13 МГц і 25 МГц, часто цілодобово.","n":"зменшений масштаб"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"Військовий модем STANAG 4285","h":"Фазова модуляція 8-PSK, 2400 Бод, на несучій 1800 Гц, із тестовою послідовністю кожні 107 мс для відстеження каналу.","l":"Суцільний блок близько 3 кГц; на слух шипіння з рівним дзижчанням (аркуш 43)."},"link11":{"nm":"Link-11","sh":"16 тонів","t":"Link-11: морська лінія передачі даних","h":"Шістнадцять тонів від 605 до 2915 Гц одночасно, кожен із фазовою модуляцією 75 разів на секунду.","l":"Гребінка з чотирнадцяти рівних ліній від 935 до 2365 Гц і дві лінії осторонь, на 605 і 2915 Гц; на слух музичний гул (аркуш 43)."},"numbers":{"nm":"Номерна станція","sh":"голос","t":"Номерна станція","h":"У визначений час коротка позивна мелодія, потім голос (часто синтезований) читає групи з п'яти цифр, в AM або SSB.","l":"Мелодія окремими нотами, потім рівні групи складів, розділені паузами (аркуш 43).","n":"імітація голосу, без справжніх цифр"},"rttydwd":{"nm":"Метео-RTTY DWD","sh":"50 Бод / 450 Гц","t":"Метеорологічний RTTY служби DWD (Німеччина)","h":"Як аматорський RTTY, але 50 Бод із рознесенням 450 Гц: німецька метеослужба передає зведення та морські прогнози відкритим текстом.","l":"Дві лінії значно далі одна від одної і трохи швидший ритм. Між зведеннями виклик «CQ CQ CQ DE DDK2 DDH7 DDK9», потім RYRYRY. На 4583, 7646 і 10 100,8 кГц, також 147,3 кГц (аркуш 32)."},"mfsk16":{"nm":"MFSK16","sh":"16 тонів","t":"MFSK16: шістнадцять тонів","h":"Шістнадцять тонів через 15,625 Гц, по одному за раз, 15,625 раза на секунду; кожен тон несе чотири біти, захищені коригувальним кодом.","l":"Смуга 316 Гц із маленьких сходинок, що весь час стрибають, після рівного тону на початку. На слух швидка мелодія, як флейта. Служить і для передавання невеликих зображень."},"sitora":{"nm":"SITOR-A (ARQ)","sh":"телекс","t":"SITOR-A: морський телекс у режимі ARQ","h":"Станція надсилає блоки по три знаки (210 мс, 100 Бод, рознесення 170 Гц) кожні 450 мс; між блоками інша станція коротко відповідає «прийнято» або «повтори».","l":"Короткі рівні пачки з маленькою слабшою відповіддю між ними: «цвірк-цвірк», як цвіркун. На КХ тепер рідкість."},"dscvhf":{"nm":"ЦВВ УКХ (канал 70)","sh":"DSC","t":"ЦВВ / DSC: цифровий вибірковий виклик на 70-му каналі","h":"Пачка близько пів секунди, 1200 Бод, на двох тонах 1300 і 2100 Гц: несе номер MMSI судна, вид виклику, а в разі лиха й координати.","l":"Коротке високе «бррт» на 156,525 МГц, що починається серією почергових бітів. На СХ і КХ ЦВВ іде у FSK 100 Бод, як NAVTEX (аркуш 20)."},"selcal":{"nm":"Авіаційний SELCAL","sh":"4 тони","t":"SELCAL: вибірковий виклик літаків на КХ","h":"Диспетчер викликає конкретний літак двома посилками приблизно по секунді, кожна з двох тонів із шістнадцяти (від 312,6 до 1479,1 Гц). У кабіні засвічується лампа й лунає сигнал: екіпажу не треба постійно слухати ефір.","l":"Два акорди поспіль, «бім-бом», між голосовими повідомленнями на авіаційних частотах у SSB, наприклад 5616 або 8864 кГц."},"dcs":{"nm":"DCS","sh":"134,4 біт/с","t":"DCS: цифровий субтон","h":"Замість безперервного тону, як у CTCSS, рація передає під голосом 23-бітне слово, повторюване без зупинки зі швидкістю 134,4 біт/с. Наприкінці тон 134,4 Гц безшумно закриває шумоподавлювач.","l":"У звуці FM-приймача: нерівна смуга в самому низу, нижче 300 Гц, і глухий гул, якщо фільтр рації його пропускає (аркуш 10)."},"t1750":{"nm":"Тон 1750 Гц","sh":"ретранслятор","t":"Тон 1750 Гц: відкрити ретранслятор","h":"Короткий тон 1750 Гц (близько 0,5–1 с) на початку передачі досі відкриває деякі європейські аматорські ретранслятори; після відпускання ретранслятор часто відповідає коротким сигналом.","l":"Коротка лінія на 1750 Гц, потім голос, потім сигнал ретранслятора (аркуш 10)."},"ncdxf":{"nm":"Маяки NCDXF","sh":"14,100 МГц","t":"Маяки NCDXF / IARU: перевірка проходження","h":"Вісімнадцять маяків у світі передають по черзі, по десять секунд кожен, на 14,100, 18,110, 21,150, 24,930 і 28,200 МГц: позивний морзянкою, потім чотири секундні тире потужністю 100 Вт, 10 Вт, 1 Вт і 0,1 Вт.","l":"Позивний, потім чотири дедалі слабші тире: якщо чути й останнє, проходження до цього маяка відмінне. Тут 4U1UN (Нью-Йорк), потім VE8AT (Канада) (аркуш 30)."},"lrpt":{"nm":"«Метеор-М» LRPT","sh":"137,9 МГц","t":"Супутники «Метеор-М»: зображення LRPT","h":"Російські метеосупутники «Метеор-М» передають знімки в цифровому вигляді: чотирипозиційна фазова модуляція (QPSK), 72 000 символів за секунду, ширина близько 120 кГц.","l":"Суцільний блок із заокругленими краями, що повільно зсувається за проліт (ефект Доплера); на слух просто шипіння. На 137,9 або 137,1 МГц, декодує SatDump (аркуш 41).","n":"зменшений масштаб"},"quindar":{"nm":"Тони Квіндар","sh":"NASA","t":"Тони Квіндар: сигнали «Аполлона»","h":"Коли оператор у Х'юстоні натискає тангенту, сигнал 2525 Гц (250 мс) вмикає передавачі наземних станцій; після відпускання сигнал 2475 Гц їх вимикає.","l":"Високий сигнал перед кожною фразою та інший, трохи нижчий, після неї: знаменитий звук записів програми «Аполлон»."},"wow":{"nm":"Сигнал «Wow!»","sh":"1977","t":"Сигнал «Wow!» (15 серпня 1977 року)","h":"Радіотелескоп «Велике вухо» (Огайо) протягом 72 секунд приймав вузький і дуже сильний сигнал поблизу лінії водню, близько 1420,456 МГц. Астроном Джеррі Еман написав на роздруківці «Wow!». Він більше не повторювався, і його походження досі обговорюють.","l":"Тонка лінія, що виходить із шуму, посилюється й спадає: форма проходження нерухомого джерела крізь промінь антени. Це реконструкція: звукозапису не існує.","n":"72 с стиснуто до 12 с"},"frb":{"nm":"Швидкий радіосплеск","sh":"FRB","t":"Швидкий радіосплеск (FRB)","h":"Радіоспалах у кілька мілісекунд з іншої галактики; перший відкрили 2007 року. Газ на шляху сильно затримує низькі частоти: сплеск приходить розтягнутим, високі тони першими.","l":"Одна крива, що падає згори донизу спектра, і більше нічого. Деякі повторюються; більшість бачили лише раз.","n":"дуже сповільнено й перебільшено"},"letterb":{"nm":"Однолітерні маяки","sh":"D, P, S, C…","t":"Однолітерні маяки","h":"Передавачі російського флоту без кінця повторюють одну літеру морзянкою, кожен за 100 Гц від сусіда: D, P, S, C, A, F, K або M залежно від місця.","l":"Паралельні пунктирні лінії зовсім поруч, кожна у своєму ритмі. Біля 4558, 5154, 7039, 10 872, 13 528 і 16 332 кГц, у CW."},"sid":{"nm":"Сонячний спалах на ННЧ","sh":"SID","t":"Сонячний спалах на ННЧ (SID)","h":"Сигнали ННЧ-передавачів флотів (20,9 кГц у Франції, 23,4 кГц у Німеччині…) поширюються між землею та іоносферою. Коли надходить сонячний спалах, його рентгенівські промені за хвилини змінюють низ іоносфери, і рівень приймання стрибком змінюється.","l":"Вузька рівна смуга (сигнал MSK передавача), яка різко посилюється, а потім повільно повертається до норми. Досить дротяної рамки та звукової карти: класичний проєкт астрономічних гуртків.","n":"годину стиснуто до 12 с"},"qrn":{"nm":"Грозові завади","sh":"QRN","t":"Грозові завади (QRN)","h":"Кожна блискавка — дуже потужний передавач одразу на всіх частотах. На СХ і КХ чути грози за тисячі кілометрів, особливо влітку й на низьких діапазонах.","l":"Нерівні горизонтальні лінії на всю ширину; сухий тріск на слух. Придушувач імпульсних завад (NB) трохи допомагає, рамкова антена — більше."},"fading":{"nm":"Селективні завмирання","sh":"QSB","t":"Селективні завмирання (QSB)","h":"На КХ сигнал приходить крізь іоносферу кількома шляхами. Залежно від частоти вони додаються або гасять один одного: сигналом мандрує вузький провал.","l":"Темна зона, що повільно повзе AM-станцією. Коли вона проходить через несучу в центрі, звук на кілька секунд стає хрипким і спотвореним; синхронний детектор або приймання в SSB це виправляють."},"plc":{"nm":"PLC","sh":"2–30 МГц","t":"PLC: інтернет через розетки","h":"PLC-адаптери передають дані домашньою проводкою на сотнях несучих між 2 і 30 МГц (у нових моделей вище), по одній кожні 24,4 кГц. Дроти випромінюють, як антена.","l":"Гребінка рівних ліній, що блимає пакетами, з пропусками на аматорських діапазонах (вирізи, передбачені стандартом); на слух тріск, який іде за інтернет-трафіком (аркуш 43).","n":"зменшений масштаб"},"fence":{"nm":"Електропастух","sh":"тік… тік…","t":"Електрична огорожа (електропастух)","h":"Генератор надсилає в дріт імпульс у кілька тисяч вольт приблизно раз на секунду. Якщо дроту торкається трава або пошкоджено ізолятор, проскакує іскра й випромінює на всіх частотах.","l":"Дуже тонка горизонтальна лінія на всю ширину через строго рівні проміжки; «тік… тік…» від ДХ до УКХ. Рівний ритм відрізняє її від грози."},"gsm":{"nm":"Телефон GSM","sh":"217 Гц","t":"Телефон GSM поруч із колонкою","h":"Телефон 2G передає пачками по 0,577 мс, 217 разів на секунду. Погано екранований підсилювач детектує ці пачки й робить їх чутними.","l":"Гребінка ліній через 217 Гц; знамените «та-та-татата» перед самим дзвінком, потім рівне дзижчання під час розмови. Трапляється дедалі рідше: мережі 2G вимикають."},"jjy":{"nm":"JJY","sh":"40 / 60 кГц","t":"Сигнал часу JJY (Японія, 40 і 60 кГц)","h":"Щосекунди несуча йде на повній потужності 0,8 с (біт 0), 0,5 с (біт 1) або 0,2 с (маркер), потім падає до 10 %. Навпаки порівняно з DCF77, де рівень падає на початку секунди.","l":"Нерухома лінія, що слабшає наприкінці кожної секунди раніше чи пізніше. Передавачі у Фукусімі (40 кГц) і Сага-Фукуока (60 кГц), для радіокерованих годинників Японії."},"rwm":{"nm":"РВМ (RWM)","sh":"4996 кГц","t":"Сигнал часу РВМ (Москва)","h":"Телеграфом на 4996, 9996 і 14 996 кГц: щосекунди імпульс 100 мс, а в інші хвилини десять імпульсів на секунду. Позивний RWM передається морзянкою двічі на годину.","l":"Позивний, потім лінія з рівних «тіків», а далі зі швидких крапок. Слухати в CW або SSB.","n":"скорочений фрагмент"},"bpm":{"nm":"BPM","sh":"2,5–15 МГц","t":"Сигнал часу BPM (Китай)","h":"Станція Пучен (Шеньсі) передає в AM на 2,5, 5, 10 і 15 МГц: щосекунди мітка 10 мс на 1000 Гц (300 мс на початку хвилини), а в певні хвилини мітки по 100 мс для часу UT1. Позивний BPM подається морзянкою, потім голосом.","l":"У демодульованому звуці: позивний, потім дуже короткі рисочки на 1000 Гц, одна на секунду, і довша на початку хвилини. Часто змішується з WWV на тих самих частотах.","n":"скорочений фрагмент"},"humpback":{"nm":"Горбатий кит","sh":"пісня","t":"Пісня горбатого кита","h":"Узимку в районах розмноження самці співають: послідовність стогонів, гуркоту й криків утворює тему, яка годинами повторюється без змін і змінюється від сезону до сезону. Гідрофони чують її за десятки кілометрів.","l":"Товсті сліди з гармоніками, що повільно піднімаються чи опускаються між 100 Гц і кількома кГц; та сама послідовність повертається за кілька секунд. Відлуння від поверхні й дна подовжує кожну ноту."},"bluewhale":{"nm":"Синій кит","sh":"×10","t":"Синій кит: найнижчий поклик","h":"Найбільша тварина на Землі видає дуже низькі (10–40 Гц) і дуже потужні поклики завдовжки 10–20 секунд, повторюючи їх годинами: вони розносяться на сотні кілометрів. Щоб їх почути, запис прискорюють удесятеро.","l":"Пульсуюча частина, потім довга нота, що ледь знижується, з гармоніками над нею; послідовність повторюється. Шкала показує справжні частоти.","n":"прискорено в 10 разів"},"finwhale":{"nm":"Фінвал","sh":"20 Гц","t":"Фінвал: імпульси 20 Гц","h":"Фінвал видає імпульси завдовжки близько секунди, що знижуються приблизно з 25 до 18 Гц, через рівні проміжки, іноді добами. У 1950–60-х роках ці «сигнали 20 Гц» спантеличували мережі прослуховування ВМС США, доки їх не приписали цьому киту.","l":"Короткі однакові рисочки, рівною серією або парами, як удари дуже повільного серця; кожна трохи знижується за частотою. Шкала показує справжні частоти.","n":"прискорено в 10 разів"},"sperm":{"nm":"Кашалот","sh":"клацання","t":"Клацання кашалота","h":"Кашалот полює під час глибоких занурень за допомогою сонара: дуже потужні клацання, приблизно одне на секунду, що частішають у «рипіння», коли він наближається до здобичі. Між собою кашалоти обмінюються «кодами» — короткими серіями клацань, ритм яких різниться від клану до клану.","l":"Горизонтальні риски на всю ширину, рівномірно розставлені, потім згущені в дзижчання (рипіння), і наостанок маленький ритмічний візерунок — кода. Кожне клацання складається з кількох близьких імпульсів — відбиттів усередині голови тварини."},"dolphin":{"nm":"Афаліна","sh":"свисти","t":"Свисти й клацання дельфіна","h":"Афаліна свистить приблизно від 5 до 20 кГц; кожна особина має «свист-підпис», що слугує їй іменем. Для полювання й орієнтації вона також посилає серії дуже коротких клацань — до кількох сотень на секунду.","l":"Тонкі криві, що піднімаються й знову опускаються, часто повторюючись без змін, і пачки горизонтальних рисок під час ехолокації. Частоти поділено на 3, щоб їх було чути; шкала показує справжні значення.","n":"утричі нижче"},"orca":{"nm":"Косатка","sh":"імпульсні крики","t":"Імпульсні крики косатки","h":"Косатки спілкуються імпульсними криками: серіями імпульсів такими частими (500–2000 на секунду), що вони чуються як нота, з різким стрибком висоти. Кожна родинна група має свій «діалект».","l":"Пачка паралельних слідів (гармонік), що разом піднімаються чи опускаються, з різким зламом посередині крику; іноді тонкий, вищий свист."},"bseal":{"nm":"Морський заєць","sh":"трель","t":"Трель морського зайця","h":"Навесні під арктичною кригою самець видає довгі трелі, що спіраллю спускаються від кількох кГц до кількох сотень герц, іноді цілу хвилину. Вони слугують для захисту території та приваблення самиць.","l":"Хвиляста крива, що ковзає шкалою згори донизу, наче пружина, що розпрямляється, і низька нота наприкінці.","n":"скорочено"},"shrimp":{"nm":"Креветки-клацуни","sh":"риф","t":"Креветки-клацуни (альфеїди)","h":"Різко стуляючи велику клешню, креветка викидає струмінь води так швидко, що утворюється кавітаційна бульбашка; схлопуючись, вона клацає, мов постріл. Тисячі креветок створюють звуковий фон рифів і можуть заважати сонарам.","l":"Дощ крапок і коротких горизонтальних рисок на всю ширину, без жодного порядку; у навушниках безперервне потріскування, як під час смаження."},"sonar":{"nm":"Активний сонар","sh":"пінг","t":"Пінг активного сонара","h":"Корабель посилає потужний звуковий імпульс (тут близько 3,5 кГц — діапазон корпусних сонарів фрегатів) і слухає відлуння: затримка дає відстань, зсув частоти (ефект Доплера) — швидкість цілі. Звук повертається і шлейфом від дна та поверхні — це реверберація.","l":"Коротка сильна риска, шлейф, що згасає, потім відлуння — набагато слабше й трохи зсунуте за частотою. Другий пінг — частотна розгортка (чирп), яка краще вимірює відстань."},"propeller":{"nm":"Гребний гвинт","sh":"кавітація","t":"Гвинт судна, що проходить","h":"Лопаті гвинта створюють кавітаційні бульбашки, які лопаються: широкий шум, що пульсує в ритмі проходження лопатей. Машини додають сталі лінії. Гідроакустики аналізують цей ритм (аналіз DEMON), щоб полічити лопаті й оберти та розпізнати судно.","l":"Шум у широкій смузі, покреслений горизонтальними смугами в ритмі лопатей, з кількома сталими вертикальними лініями (двигун, редуктор). Усе наростає, а потім згасає, коли судно проходить над гідрофоном."},"uqc":{"nm":"Підводний телефон","sh":"UQC 8 кГц","t":"Підводний телефон (UQC, «Гертруда»)","h":"Підводні човни й кораблі розмовляють під водою акустичним телефоном: голос передається з однією бічною смугою над несною 8,0875 кГц, що випромінюється перетворювачем у корпусі. Дальність — кілька кілометрів.","l":"Смуга голосу SSB вище 8 кГц; після демодуляції — далекий голос, що коливається й гучно відлунює через відлуння від поверхні та дна. Зображення зменшено вдвічі; шкала показує справжні частоти.","n":"шкалу зменшено вдвічі"},"zevs":{"nm":"ZEVS 82 Гц","sh":"ДНЧ","t":"ZEVS: радіо для підводних човнів на 82 Гц","h":"Радіохвилі дуже погано проникають у морську воду, крім наднизьких частот (ДНЧ). Російський передавач ZEVS на Кольському півострові працює на 82 Гц через антенні лінії завдовжки в десятки кілометрів, щоб зв'язатися з човнами на великій глибині. Швидкість мізерна: кілька знаків на хвилину.","l":"Тонка лінія на 82 Гц поруч із лінією мережі 50 Гц та її гармоніками, із завадами від гроз. У навушниках ледь чутне низьке гудіння; приймається великою рамкою та звуковою картою. Американський аналог на 76 Гц закрито 2004 року."},"bloop":{"nm":"«Блуп»","sh":"1997","t":"«Блуп» (1997)","h":"1997 року гідрофони NOAA в Тихому океані вловили дуже низький звук, що швидко підвищувався, чутний за тисячі кілометрів. Довго загадковий, від 2012 року його приписують льодотрусу — велетенському айсбергу, що розколюється.","l":"Широка смуга, що за кілька секунд піднімається разом із гармоніками, а потім повільно згасає. Реконструкція, прискорена в 16 разів, як запис, оприлюднений NOAA.","n":"прискорено в 16 разів"}}},"zh":{"ui":{"title":"VSISA","mystery":"神秘声音","play":"▶ 收听","stop":"■ 停止","noise":"噪声","volume":"音量","loop":"循环","specwf":"频谱 + 瀑布图","cursor":"光标","footprint":"信号指纹","dur":"自上而下 {s} 秒","avg":"整个信号的平均值","press":"按“收听”：信号会在这里滚动","count":"{n} 种信号，按第 6 页的顺序排列","myst":"神秘模式","mystTags":"边听边看，然后选出正确答案","quizH":"这是什么信号？","quizLead":"开始收听，观察频谱、瀑布图和信号指纹，然后作答。","score":"得分","good":"答对了！","bad":"答错了：这是 {x}。","next":"下一个神秘声音","principle":"原理","screen":"屏幕上","sheet":"页","book":"书中：第 {r} 页","lang":"语言","signals":"信号","f1":"信号在页面中模拟生成（每秒 12000 个采样）：包括 OpenBookRadio 一书第 6 页的信号、书中的其他信号以及彩蛋。对于无线电信号（AM、FM、AIS、LoRa……），显示的是模拟的中频，就像 SDR 屏幕上那样；部分信号按比例缩小或加速，均有标注。对于 AM、单边带、FM、FM 立体声、国际空间站和衰落，听到的是解调后的声音，就像接收机扬声器里放出的一样，屏幕上显示的是无线电信号；人声是合成的，并不说真实的词语。","f2":"瀑布图和信号指纹中时间向下流动。许可协议 CC BY-NC-SA 4.0，免费，禁止出售。","night":"夜间模式","day":"日间模式","visits":"访问","plays":"收听","book_dl":"下载本书","book_dl2":"下载 OpenBookRadio 一书（免费，PDF 和 EPUB，13 种语言）","display":"显示","theme_day":"日间","theme_night":"夜间（红色）","theme_phos":"绿色荧光屏","theme_phosb":"蓝色荧光屏","theme_phosa":"琥珀色荧光屏","w3d":"3D 瀑布图","w3dHint":"拖动可旋转"},"groups":["模拟语音","电报","数据","图像","航空、航海与救援","呼叫、亚音与寻呼","探空仪、传感器与联网设备","短波模式与奇特信号","广播与授时","宽带","彩蛋：来自太空的声音","彩蛋：短波奇闻","彩蛋：水下声音"],"modes":{"am":{"nm":"AM 调幅","sh":"广播","t":"AM：幅度调制","h":"载波强度随声音变化：曲线时而“鼓起”，时而“瘪下”。","l":"中间一条固定的线（载波），两侧各有一条相同的边带。宽约 6 至 9 kHz。短波和中波广播、航空（第 12 和 14 页）。","r":[["收听","先是一段片头音乐，然后是主持人在背景音乐上讲话。两条边带互为镜像：在载波两侧先看到旋律，再看到人声。"]]},"ssb":{"nm":"SSB 单边带","t":"SSB：单边带","h":"只保留一条边带，没有载波：没人说话时什么都没有。","l":"没有中心线，只有一条约 2.7 kHz 宽的频带，只在说话时出现。10 MHz 以上用 USB，以下用 LSB（业余无线电）。调谐不准时，声音像“鸭子叫”（第 11 和 29 页）。"},"fm":{"nm":"FM 调频","sh":"语音","t":"FM：频率调制","h":"幅度保持不变；振荡随声音变密或变疏。","l":"信号在其频率附近跳动，声音越大越宽：窄带 FM 每信道 12.5 kHz（对讲机、中继），FM 广播 200 kHz（第 2 和 13 页）。","r":[["收听","结尾那声短促的“嚓”：发射停止时静噪关闭。"]]},"cw":{"nm":"CW 摩尔斯","t":"CW：摩尔斯电码","h":"载波开开关关：划和点。","l":"一条很细的线，按摩尔斯节奏断断续续；耳中是“嘀嘀”声。这里是“CQ”（第 48 页）。","r":[["速度","每分钟 20 词，点长 60 ms，700 Hz：“CQ CQ CQ DE F4ABC K”"],["听感","纯净的长短嘀声，同一个音高"],["解码","人耳、fldigi、CW Skimmer"]]},"rtty":{"t":"FSK / RTTY：两个频率","h":"频率在两个值之间跳变，一个代表 0，一个代表 1。","l":"两条平行线：业余无线电间隔 170 Hz（45.45 波特），气象广播 450 或 850 Hz。规律的“滴哩哩”声（第 32 页）。","r":[["编码","博多码 ITA2：5 位 + 起始位 + 1.5 停止位；mark 2125 Hz，space 2295 Hz"],["文本","RYRYRYRY CQ CQ DE F4ABC"],["解码","fldigi、MMTTY、2Tone"]]},"afsk":{"nm":"APRS 分组","t":"AFSK 1200 波特：APRS 与分组无线电","h":"两个音频音调，1200 和 2200 Hz，送入 FM 发射机。","l":"在 FM 接收机之后（扬声器声音）：1200 到 2200 Hz 的频带，短促成串。听起来是一秒钟的“咕噜噜”（第 35 和 36 页）。","r":[["频率","欧洲 144.800 MHz（APRS），FM"],["帧","0x7E 标志，然后是 NRZI 编码的 AX.25 数据"],["解码","Direwolf、multimon-ng、KISS TNC"]]},"psk31":{"t":"PSK31：相位调制","h":"频率不动，是相位在翻转；每次翻转时幅度下陷。","l":"一条约 60 Hz 宽的极细线，略带“编织”纹。3 kHz 内可容纳几十个电台（第 29 页）。","r":[["编码","Varicode：0 = 相位翻转，1 = 不变；空闲时是两条孪生线"],["收听频率","14070 kHz、3580 kHz"],["解码","fldigi"]]},"ft8":{"t":"MFSK / FT8：八个音调","h":"频率以 6.25 Hz 的台阶上下变化，每个台阶 0.16 秒。","l":"约 50 Hz 宽的频带，持续 12.6 秒，每 15 秒按时钟重复：3 kHz 内同时有多个电台，例如 7.074 MHz（第 29 页）。","r":[["帧","79 个 0.16 秒的符号，三组 Costas 同步图案（开头、中间、结尾）；这里有八个电台"],["频率","14074、7074、3573、10136、21074、28074 kHz"],["解码","WSJT-X、JTDX（电脑时间要准确）"]]},"ft4":{"t":"FT4：竞赛用的 FT8","h":"四个音调间隔 20.8 Hz，20.8 波特：5 秒内 105 个符号，按 7.5 秒时隙发送。","l":"约 90 Hz 宽的频带，比 FT8 更短更宽，每 7.5 秒重复。14080、7047.5 kHz（第 29 页）。"},"olivia":{"t":"Olivia 8/250：八个音调","h":"八个间隔 31.25 Hz 的音调，每次一个，随机跳动；Walsh 编码和交织。","l":"在 250 Hz 内散布的一片点；可在远低于噪声时解码。听起来是一段随机的小旋律（第 29 页）。"},"hell":{"nm":"Feld Hell 海尔","t":"Feld Hell：用载波写字","h":"载波逐点开关：每个字母由 14 点一列的若干列组成，从下往上扫描（每秒 245 点）。","l":"瀑布图上是一条断续的线；字母要由软件屏幕（fldigi）画出来。听起来是轻柔的噼啪声（第 29 页）。"},"4fsk":{"t":"4FSK：DMR、C4FM（Fusion）、NXDN、dPMR","h":"四个频率等级：每个符号携带两位。","l":"6 至 12.5 kHz 宽的矩形块，像噪声一样填满，常成串出现（DMR 把信道分成两个时隙）。听起来是沙哑的“呼噜噜”（第 46 页）。"},"mt63":{"t":"MT63：应急消息（NBEMS）","h":"同时发 64 个音调，每个都缓慢调制，冗余度很高。","l":"以 1500 Hz 为中心、宽 1 或 2 kHz 的平坦块，边缘清晰；规律的嘶嘶声。即使把话筒贴在扬声器上也能传（第 31 页）。"},"lora":{"t":"LoRa：频率斜坡（啁啾）","h":"频率扫过整个带宽，然后从底部重新开始：跳变的位置携带数据。","l":"平行的斜线，很容易认出：Meshtastic 和 MeshCore 在 869.525 MHz 或 433 MHz，LoRaWAN 传感器（第 13、23 和 24 页）。"},"sstv":{"nm":"SSTV 慢扫描电视","t":"SSTV：声音里的图像","h":"1200 Hz 的同步脉冲，然后频率跟随一行的亮度，从 1500 Hz（黑）到 2300 Hz（白）。","l":"规律的同步线和随图像变化的一团云；“啾啾”声持续一到两分钟。14.230 MHz，国际空间站 145.800 MHz（第 37 页）。","r":[["帧","VIS 头，然后是各行：1200 Hz 同步，绿、蓝、红；这里是测试图的 20 行"],["解码","QSSTV、MMSSTV、手机上的 Robot36"]]},"fax":{"nm":"气象传真","t":"气象传真：1500 Hz 黑，2300 Hz 白","h":"频率从黑到白连续变化，每分钟 120 行。","l":"1500 和 2300 Hz 两条固定频带（相距 800 Hz），规律的“嘀嗒”声。公布的是载波频率：用 USB 在低 1.9 kHz 处收听（第 38 页）。","r":[["帧","300 Hz 起始音、定相行（白色脉冲），然后是图"],["解码","fldigi、JWX、HamFax"]]},"elt":{"nm":"ELT 警笛","t":"121.5 MHz 上的 ELT / PLB 警笛","h":"一种 AM 信号，其音调每秒两到四次从 1600 Hz 降到 300 Hz。","l":"固定的载波和像扇子一样滑动的边带：遇险信标的“呜—呜”声，演练时也用 121.375 MHz（第 27 和 28 页）。"},"406":{"nm":"406 信标","t":"406 MHz 信标：BPSK 突发","h":"发射半秒：160 ms 纯载波，然后相位以 400 bit/s 在 ±1.1 弧度间切换。","l":"一条每 50 秒出现一次的短线，位于 406.0 至 406.1 MHz 之间；没什么可听的，需要解码器（EPIRB 406，第 28 页）。"},"adsb":{"t":"ADS-B / S 模式（1090 MHz）：脉冲","h":"0.5 微秒的脉冲，其位置携带比特（PPM）；这里的时间轴大大放慢。","l":"横贯全宽的极短横线，机场附近每秒数百条；需要 SDR 接收棒（第 15 页）。","n":"时间轴大大放慢"},"acars":{"t":"ACARS：AM 与 MSK 数据","h":"一种携带两个音调（1200 和 2400 Hz）的 AM 信号，速率 2400 bit/s。","l":"半秒长的突发，带载波和边带，欧洲在 131.525、131.725 或 131.825 MHz：听起来是“噗噜噜”（第 16 页）。"},"ais":{"nm":"AIS 船舶","t":"AIS：两个信道上的 GMSK 9600 波特","h":"平滑的 FSK（GMSK），每次 26 ms 突发，交替在 161.975 MHz 和 162.025 MHz（比例缩小）。","l":"两列短促的小线段，相距 50 kHz，规律的咔哒声；船越多越密（第 19 页）。","n":"比例缩小"},"navtex":{"t":"中波和短波上的 NAVTEX 与 DSC：FSK 170 Hz","h":"与 RTTY 相似：两个相距 170 Hz 的频率，但速率是 100 波特。","l":"播报期间连续的两条平行线，位于 518 和 490 kHz（NAVTEX）或 2187.5 kHz（数字选择呼叫）（第 20 页）。","r":[["编码","SITOR-B，CCIR 476：7 位中有四个“1”，带 FEC 重复"],["解码","fldigi、YaND"]]},"hfdl":{"t":"HFDL：短波上的飞机","h":"在 1440 Hz 副载波上的 1800 波特 PSK。","l":"在 2.9 至 22 MHz 之间约 2.4 kHz 宽的突发；时有时无的调制解调器嘶声（第 17 页）。"},"ctcss":{"nm":"CTCSS 亚音","t":"CTCSS：语音下的亚音","h":"在语音中加入一个低沉的连续音调（67 至 254 Hz，这里是 88.5 Hz）。","l":"在 FM 接收机的声音中：最底部的一条固定线，在语音下方；它用来打开中继和对讲机的静噪（第 10 页）。"},"dtmf":{"nm":"DTMF 双音","sh":"2 个音","t":"DTMF：每个按键两个音调","h":"每个按键同时发出一个低音（697 至 941 Hz）和一个高音（1209 至 1633 Hz）。","l":"成对的点排列在八个固定列上；电话号码和中继命令的“嘀嘀”声（第 10 页）。","r":[["序列","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"nm":"CCIR 选呼","sh":"5 个音","t":"CCIR 选呼：依次发出的音调","h":"五个 100 ms 的音调接连发出，每个数字一个。","l":"一段小小的点状台阶，会重复；快速的“嘟噜噜噜”用来呼叫某一部电台（第 33 页）。","r":[["序列","1 2 3 4 5，两遍；UV-K1 的 SelCall 应用也能解码"]]},"pocsag":{"nm":"POCSAG 寻呼","sh":"寻呼机","t":"POCSAG 与 FLEX：寻呼机","h":"±4.5 kHz 的 FSK；先是 1010… 前导码，然后是数据（比例缩小）。","l":"前导码期间两条清晰的线，然后是一条填满的频带；刺耳的“噗噜噜”。466.075 MHz，DAPNET 439.9875 MHz（第 45 页）。","n":"比例缩小"},"ale":{"sh":"8 个音","t":"ALE：短波自动链路建立","h":"750 至 2500 Hz 的八个音调，125 波特，成串发送。","l":"约 2 kHz 宽、由小点组成的块，持续一到两秒，有时出现在几个相邻频率上；尖细的啁啾声（第 34 页）。"},"rs41":{"nm":"RS41 探空仪","t":"RS41 探空仪：连续 GFSK","h":"4800 波特的平滑 FSK，不停发送；探空仪上升变冷时，频率会慢慢漂移。","l":"一条约 10 kHz 宽的频带，在整个飞行过程中斜着滑动，位于 400 至 406 MHz 之间（第 21 页）。"},"ook":{"nm":"433 传感器","t":"433 MHz 传感器：OOK","h":"载波以长短脉冲开关（通断键控）；同一消息重复三次。","l":"成串的小点，常三次一组，位于 433.92 MHz：气象站、温度探头、遥控器（第 22 页）。"},"fhss":{"nm":"蓝牙","t":"蓝牙：跳频（FHSS）","h":"频率每秒在 79 个信道之间切换 1600 次（比例缩小）。","l":"小线段散布在 80 MHz 宽度内，从不在同一处，位于 2.4 GHz 附近（第 25 页）。","n":"比例缩小"},"wspr":{"t":"WSPR：传播信标","h":"四个间隔 1.46 Hz 的音调，每个符号 0.68 秒，持续 110.6 秒。","l":"一条约 6 Hz 宽的极细线，持续将近两分钟，每逢偶数分钟出现：需要大幅放大（第 29 页）。","n":"24 秒片段（一次发射持续 110.6 秒）"},"qrss":{"t":"QRSS：极慢摩尔斯","h":"载波开开关关，点长 3 至 10 秒，常在两个相邻频率上（DFCW）。","l":"只有几 Hz 宽的线，在十分钟的屏幕上读取；人耳听不出来（第 30 页）。","n":"已加速：点长 0.6 秒，而不是 3 至 10 秒"},"texte":{"nm":"瀑布图文字","t":"瀑布图中的文字","h":"图像的每一行变成一组音调：声音听起来像噪声。","l":"文字或图画直接出现在 SDR 屏幕上（第 40 页）。","r":[["说明","从图像底部开始发送：在实时瀑布图中是正的，在信号指纹中是倒的（自上而下阅读）"]]},"vara":{"t":"现代短波数据：VARA、Pactor、ARDOP","h":"长而饱满的突发（OFDM 或 PSK），中间夹着对方电台的简短应答。","l":"约 2.4 kHz 宽的矩形，停了又起，中间有一个小小的确认；断断续续的嘶声（第 29 页）。"},"chirp":{"nm":"电离层探测","t":"电离层探测仪（啁啾探测）","h":"一条缓慢的频率斜坡穿过整个短波段；电离层的回波稍后到达。","l":"一条扫过屏幕的斜线，旁边伴有平行线（回波）；一声“嗖”，转瞬即逝。"},"oth":{"nm":"超视距雷达","t":"超视距雷达（“啄木鸟”）","h":"脉冲每秒重复 10 到 50 次，每个脉冲宽几 kHz。","l":"覆盖整个波段的宽条纹块；短波上非常规律的啄木鸟敲击声。"},"parasites":{"nm":"干扰","sh":"开关电源","t":"开关电源的干扰","h":"方波：它的频率和所有谐波同时出现。","l":"在噪声背景上一起漂移的规则梳状谱线：可用 NOISE FIND 或便携式接收机查找（第 K22 页）。"},"mpx":{"nm":"FM 立体声与 RDS","t":"FM 立体声广播与 RDS","h":"解调后的声音（复合信号）包含 L+R 声道、19 kHz 导频、38 kHz 附近的 L-R 声道和 57 kHz 的 RDS。","l":"解调后从 0 到 60 kHz 看：低频块、19 kHz 处的细线、中间较弱的块，以及最上方的 RDS（第 12 页）。","n":"缩小 20 倍；立体声","r":[["收听","戴耳机听：前 4 秒是单声道（中间的 L-R 块消失），后 4 秒是立体声，旋律在左，和弦在右。"]]},"dcf77":{"nm":"DCF77 授时","t":"DCF77 授时信号（77.5 kHz）","h":"每秒开始时，载波降到 15%，持续 0.1 秒（位 0）或 0.2 秒（位 1）。","l":"一条固定的线，每秒有一个黑色缺口；第 59 秒没有缺口，用来标记整分（第 12 页）。","r":[["说明","这里把载波移到 1000 Hz；第 6 秒没有缺口，就像每分钟的第 59 秒"]]},"ofdm":{"t":"OFDM：几十个子载波","h":"许多排得很密的载波，每个都很慢：叠加起来像噪声。","l":"边缘清晰的平坦矩形，一直都在：短波 DRM（10 kHz）、DAB+（1.5 MHz）、数字电视、Wi-Fi。听起来是持续的嘶声（第 12 和 25 页）。"},"dsss":{"t":"扩频（DSSS）：GPS、Wi-Fi 802.11b","h":"数据与非常快的码相混合：能量分散到很宽的频带上。","l":"一个宽宽的鼓包，勉强高出噪声；GPS 甚至在噪声之下，不经处理看不到（第 25 和 26 页）。"},"hline":{"nm":"氢线","sh":"1420 MHz","t":"21 厘米氢线（1420.405 MHz）","h":"银河系中的冷氢在 1420.405 MHz 上发出极弱的噪声。银河旋臂的运动通过多普勒效应使其频移：可以看到几个小鼓包。","l":"瀑布图里每一秒几乎都看不出什么：要长时间平均，鼓包才会从噪声中浮现。这里请在停止后看平均频谱。一面抛物面天线或喇叭天线、一个前置放大器和一根 SDR 接收棒就够了。","n":"信号已大幅夸大"},"sun":{"nm":"太阳","sh":"射电暴","t":"太阳：III 型射电暴","h":"耀斑抛出的电子穿过日冕，越走越远，使日冕发出的频率越来越低。","l":"在太阳噪声背景上，一条条线在不到一秒内从频谱上方斜着落到下方；越来越响的“嘶——”。约 10 至 400 MHz，短波 20 MHz 附近也能听到。"},"jupiter":{"nm":"木星","sh":"20 MHz","t":"木星：十米波射电暴（L 型和 S 型）","h":"木星的磁场和它的卫星木卫一（Io）在 15 至 40 MHz 之间产生强烈辐射：缓慢的 L 型暴和极短的、快速向下滑动的 S 型暴。","l":"先是一阵阵噪声浪潮（L 型，像海浪），然后是一串串密集斜线状的小“噗”声（S 型）。夜间在 20.1 MHz 附近，用简单的偶极天线即可，前提是木卫一位置合适。"},"pulsar":{"nm":"脉冲星","sh":"B0329+54","t":"脉冲星 PSR B0329+54","h":"一颗自转的中子星用射电波束扫过地球，这里每 0.714 秒一次。星际气体使低频延迟：每个脉冲先到达频谱上方。","l":"规律的“嗒”声；在瀑布图中，每个脉冲是一条向下弯的曲线（色散）。真实信号在噪声之下：需要大天线，并按周期把脉冲叠加起来。","n":"信号已大幅夸大"},"meteor":{"nm":"流星","sh":"GRAVES","t":"GRAVES 雷达的流星回波（143.050 MHz）","h":"法国 GRAVES 雷达在 143.050 MHz 上不停发射。流星电离空气时，其尾迹会把一点信号反射到你的接收机，持续零点几秒到几秒。","l":"在 143.049 MHz 用 USB 收听：1000 Hz 附近短促的“叮”声，有时回波会滑动（流星头，多普勒效应）或持续较久。流星雨期间（英仙座、双子座）多得多（第 1 页）。"},"whistler":{"nm":"哨声","sh":"甚低频","t":"甚低频哨声（whistler）","h":"闪电产生一声射电“咔哒”；其中一部分沿地磁场磁力线传到另一半球再返回，高音先到。","l":"紧跟在一声“咔哒”之后，一个“啾——”在一两秒内从高音降到低音；到处是噼啪声（天电）。低于 10 kHz，用远离电线的甚低频接收机收听。"},"chorus":{"nm":"黎明合唱","sh":"甚低频","t":"黎明合唱（dawn chorus）","h":"磁暴期间，被困在磁层中的电子发出上升的小音符，多在日出时分。","l":"重叠在一起的上升鸣叫声，像鸟儿一样，约 1 至 4 kHz。所需设备与哨声相同。"},"sputnik":{"nm":"斯普特尼克 1 号","sh":"1957","t":"斯普特尼克 1 号（1957）","h":"第一颗人造卫星在 20.005 和 40.002 MHz 上交替发出约 0.3 秒的“哔”声，持续三周。","l":"一条规律断开的线：“哔……哔……”，1957 年 10 月全世界都在收听的声音（复原）。"},"doppler":{"nm":"多普勒效应","sh":"卫星","t":"卫星信标与多普勒效应","h":"低轨卫星先靠近再远离：过境期间接收频率下降，145 MHz 约 ±3 kHz，435 MHz 约 ±10 kHz。","l":"一条呈 S 形下降的线：开始慢，卫星最近时快，之后又变慢（第 41 页）。","n":"10 分钟过境压缩为 12 秒"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA 卫星：APT 图像（历史）","h":"2400 Hz 副载波由图像进行幅度调制，每秒两行，每行开头有同步脉冲。已于 2025 年停止；如今 Meteor-M 卫星发送 LRPT。","l":"2400 Hz 处的一条线，边带随图像变化，还有著名的每秒两次的“嘀嗒”声（第 41 页）。"},"eme":{"nm":"月球回波","sh":"EME","t":"月球回波（EME）","h":"发往月球的信号约 2.5 秒后返回，衰减极大，略微展宽，并有多普勒频移。","l":"先听到自己的“哔”，2.5 秒后听到微弱、略显模糊的回波。业余无线电爱好者用 CW 或 JT65 在 144 MHz 及以上进行（第 1 页）。","n":"回波已大幅夸大"},"msk144":{"nm":"MSK144","sh":"流星","t":"MSK144：流星散射数字模式","h":"两个音调，1000 和 2000 Hz，2000 波特，72 ms 的帧不停重复：每条流星余迹会让其中几帧通过。","l":"0.1 至 1 秒、约 2.4 kHz 宽的突发，随流星的“叮”一起出现又消失。在 50 和 144 MHz 上，使用 WSJT-X。"},"jt65":{"nm":"JT65","sh":"65 音","t":"JT65：65 个音调，非常慢","h":"一个同步音和 64 个间隔 2.7 Hz 的数据音（JT65A），每个符号 0.37 秒，每分钟发射 47 秒。","l":"约 180 Hz 内的一排小线段，还有一条总回到同一位置的同步线。用于月面反射（JT65B 和 C）和极弱信号。","n":"20 秒片段（一次发射持续 47 秒）"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA：专业数字集群网络","h":"π/4-DQPSK 相位调制，每秒 18000 个符号，四个时隙，信道 25 kHz。","l":"边缘圆润的实心块，在基站附近一直存在；沙哑的嘶声。已加密，无法收听（第 46 页）。","n":"比例缩小"},"ndb":{"nm":"NDB 信标","sh":"190–535 kHz","t":"NDB：无方向性信标","h":"长波上的固定载波，用音调（常为 1020 Hz）发送两三个字母的摩尔斯识别码。","l":"中间一条固定线，发识别码时两侧各有一条小线。约 190 至 535 kHz，用 SSB 或 CW 收听（第 12 页）。"},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR：甚高频全向信标","h":"AM 信号：一个随方位变化的 30 Hz 信号，一个以 30 Hz 调频的 9960 Hz 副载波（基准），以及 1020 Hz 的摩尔斯识别码。","l":"解调后的声音中：低沉的 30 Hz 嗡声，10 kHz 附近一条起伏的宽线，偶尔有识别码（第 18 页）。","n":"解调后的声音，缩小 2 倍"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS：着陆引导（航向信标）","h":"AM 信号中有 90 和 150 Hz 两个音调；它们的比例告诉飞机偏左还是偏右。摩尔斯识别码以 I 开头。","l":"解调后的声音中：90 和 150 Hz 两条很低的线，以及 1020 Hz 的识别码。108.1 至 112 MHz；下滑道信标约 330 MHz（第 18 页）。"},"m10":{"nm":"M10 / M20 探空仪","sh":"Meteomodem","t":"M10 和 M20 探空仪（Meteomodem）","h":"每秒一帧，快速 FSK（约 9600 波特）：比 RS41 更宽。在法国由法国气象局施放。","l":"每秒一个宽突发，在飞行中缓慢漂移；400 至 406 MHz（第 21 页）。"},"tpms":{"nm":"胎压（TPMS）","sh":"433 MHz","t":"轮胎压力传感器（TPMS）","h":"每个车轮不时发送一段几毫秒的 FSK 突发：气压、温度、识别码。","l":"433.92 MHz（或 315 MHz）上零星的小突发，常成对出现，在汽车经过时。可用 rtl_433 解码。"},"als162":{"nm":"ALS162","sh":"162 kHz","t":"ALS162 授时信号（阿卢伊，162 kHz）","h":"原法国国际广播电台长波的载波；时间用细微、听不见的相位调制编码。","l":"一条固定的线，在法国极强，每秒开头略微变宽；需要解码器才能读出时间（第 12 页）。"},"wwv":{"nm":"WWV","sh":"2.5–20 MHz","t":"WWV 授时信号（科罗拉多）","h":"AM：每秒一个 5 ms、1000 Hz 的“嗒”，一个 500 或 600 Hz 的音，100 Hz 上的时间码，以及播报 UTC 的人声。","l":"解调后的声音中：每秒中断一次的 500 Hz 线、1000 Hz 的嗒声，以及最底部 100 Hz 的时间码（第 12 页）。"},"msf":{"nm":"MSF","sh":"60 kHz","t":"MSF 授时信号（安索恩，60 kHz）","h":"每秒开头载波按比特关断 0.1、0.2 或 0.3 秒，整分时关断 0.5 秒。","l":"一条固定的线，每秒有完全黑的缺口，比 DCF77 的更长（第 12 页）。"},"type2":{"nm":"太阳 II 型","sh":"激波","t":"太阳：II 型射电暴","h":"日冕物质抛射的激波使等离子体缓慢地向越来越低的频率辐射，常分成两条带（基频和二倍频）。","l":"两条平行的噪声带，在几分钟内缓缓下降。与快得多的 III 型暴对比一下。","n":"几分钟压缩为 6 秒"},"tweeks":{"nm":"Tweek","sh":"甚低频","t":"Tweek：夜间的甚低频“叮”声","h":"夜里，远处闪电的咔哒声在地面和电离层之间来回反射；接近截止频率（约 1.7 kHz）的成分最后到达。","l":"一个小小的“叮”向下滑并停在约 1.7 kHz，有时在二倍频处有回声；到处噼啪声。低于 10 kHz，夜间。"},"hiss":{"nm":"甚低频嘶声","sh":"hiss","t":"甚低频嘶声（hiss）","h":"等离子体层电子产生的宽带噪声，随地磁活动起伏。","l":"从几百 Hz 到几 kHz 的嘶声带，没有图案，缓慢增强又减弱。"},"aurora":{"nm":"极光传播","sh":"Au","t":"极光传播（Au）","h":"极光会反射甚高频电波，但抖动得非常快：每个信号被展宽到几百 Hz。","l":"CW 变成粗糙的、像耳语一样的嘶声，听不出音调。在 50 和 144 MHz，磁暴期间把天线对准北方。"},"galactic":{"nm":"银河噪声","sh":"20–40 MHz","t":"银河系的噪声","h":"银河系中心发出射电噪声，卡尔·央斯基于 1932 年在 20 MHz 附近发现了它。它随地球自转升降。","l":"背景噪声慢慢升高又降低，每天提前约 4 分钟。在 20 至 40 MHz 用简单的偶极天线就能看到。","n":"一天压缩为 12 秒"},"cubesat":{"nm":"立方星","sh":"9600 bd","t":"立方星遥测","h":"小卫星定期以 1200 或 9600 波特的 FSK 或 GMSK 在 435–438 MHz 附近发送测量数据（电池、温度）。","l":"规律的突发，由于多普勒效应，过境期间每次都更低一点（第 41 页）。","n":"比例缩小，过境加速"},"issfm":{"nm":"国际空间站 FM","sh":"145.800 MHz","t":"国际空间站（ISS）：FM 语音","h":"宇航员在 145.800 MHz 用 FM 与学校和业余无线电爱好者通话。空间站时速 28000 公里：过境期间，接收频率从约 +3.5 kHz 滑到 −3.5 kHz。","l":"一条 FM 语音带，在 10 分钟过境中从右向左慢慢移动（第 41 页）。","n":"10 分钟过境压缩为 10 秒"},"buzzer":{"nm":"UVB-76“蜂鸣器”","sh":"4625 kHz","t":"UVB-76，“蜂鸣器”（The Buzzer，4625 kHz）","h":"一个俄罗斯军用电台，几十年来每分钟约 25 次发出约一秒的嗡嗡声，偶尔插入语音消息。","l":"一条固定载波，每次嗡声时出现一列自上而下的密集谱线。在 4625 kHz 用 USB 很容易找到。"},"pip":{"nm":"“The Pip”","sh":"3756 / 5448 kHz","t":"“The Pip”：无尽的哔声","h":"另一个俄罗斯军用短波信标，昼夜不停重复短促的哔声，偶尔被消息打断。","l":"一条固定的线，每分钟约 50 次被一声短促的哔声切断；听起来是永不停止的规律“哔…哔…”。","n":"节奏为近似"},"squeaky":{"nm":"“Squeaky Wheel”","sh":"短波","t":"“Squeaky Wheel”：吱吱响的轮子","h":"一个俄罗斯军用短波信标，收听者根据其重复的声音图案为它起了名字。","l":"由两个声音组成的小图案，其中一个上升，循环重复：像吱吱作响的轮子。","n":"近似模仿"},"codar":{"nm":"CODAR","sh":"海洋雷达","t":"CODAR：海流雷达","h":"海岸雷达每秒扫过一段频率一到两次，用来测量海流和海浪。","l":"规则的平行斜线和重复的“刷”声；约 4.5–5.5 MHz、13 MHz 和 25 MHz，常常昼夜不停。","n":"比例缩小"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"STANAG 4285 军用调制解调器","h":"在 1800 Hz 载波上以 2400 波特进行 8-PSK 相位调制，每 107 ms 有一段测试序列用于跟踪信道。","l":"约 3 kHz 宽的实心块；听起来是带有规律嗡声的嘶声（第 43 页）。"},"link11":{"nm":"Link-11","sh":"16 音","t":"Link-11：海军数据链","h":"605 至 2915 Hz 的十六个音调同时发出，每个每秒做 75 次相位调制。","l":"从 935 到 2365 Hz 的十四条规则谱线，另有 605 和 2915 Hz 两条分开的线；听起来是带音乐感的嗡声（第 43 页）。"},"numbers":{"nm":"数字电台","sh":"人声","t":"数字电台","h":"在固定时间先播一段小呼号旋律，然后一个（常为合成的）声音用 AM 或 SSB 朗读五位一组的数字。","l":"先是单个音符的旋律，然后是由静音隔开的规律音节组（第 43 页）。","n":"人声为模仿，没有真实数字"},"rttydwd":{"nm":"DWD 气象 RTTY","sh":"50 波特 / 450 Hz","t":"德国气象局（DWD）的气象 RTTY","h":"与业余无线电的 RTTY 相似，但速率为 50 波特、频移 450 Hz：德国气象局用明文播发气象公报和海洋预报。","l":"两条线相距远得多，节奏略快。两段公报之间是呼叫“CQ CQ CQ DE DDK2 DDH7 DDK9”，然后是 RYRYRY。频率 4583、7646 和 10100.8 kHz，还有 147.3 kHz（第 32 页）。"},"mfsk16":{"nm":"MFSK16","sh":"16 音","t":"MFSK16：十六个音调","h":"十六个间隔 15.625 Hz 的音调，每次只发一个，每秒 15.625 次；每个音调携带四个比特，并有纠错码保护。","l":"一条 316 Hz 宽的频带，由不停跳动的小台阶组成，开头有一段固定音。听起来像一段轻快的笛声。也可用来发送小图片。"},"sitora":{"nm":"SITOR-A（ARQ）","sh":"电传","t":"SITOR-A：ARQ 方式的海事电传","h":"电台每 450 ms 发送一个三字符的数据块（210 ms，100 波特，频移 170 Hz）；两块之间，对方用一个短信号回答“收到”或“重发”。","l":"短促而规律的突发，中间夹着较弱的小应答：像蟋蟀的“唧唧”声。如今在短波上已很少见。"},"dscvhf":{"nm":"甚高频 DSC（70 频道）","sh":"DSC","t":"DSC：70 频道上的数字选择呼叫","h":"约半秒的突发，1200 波特，使用 1300 和 2100 Hz 两个音调：携带船舶的 MMSI 号码、呼叫类型，遇险时还有船位。","l":"156.525 MHz 上一声短促尖锐的“噗噜”，开头是一串交替的比特。在中波和短波上，DSC 是 100 波特的 FSK，与 NAVTEX 相同（第 20 页）。"},"selcal":{"nm":"航空 SELCAL","sh":"4 个音","t":"SELCAL：短波上的飞机选择呼叫","h":"管制员用两个各约一秒的脉冲呼叫某一架飞机，每个脉冲由十六个音调（312.6 至 1479.1 Hz）中的两个组成。机上指示灯亮起并响起提示音：机组不必一直守听。","l":"两个相继的和弦“叮—咚”，出现在航空单边带频率的话音之间，例如 5616 或 8864 kHz。"},"dcs":{"nm":"DCS 数字亚音","sh":"134.4 bit/s","t":"DCS：数字亚音","h":"与 CTCSS 的连续音调不同，电台在语音下方以每秒 134.4 比特不停重复发送一个 23 位的码字。结束时，一个 134.4 Hz 的音调无声地关闭静噪。","l":"在 FM 接收机的声音中：最底部 300 Hz 以下一条不规则的频带；如果电台的滤波器放它通过，会听到低沉的嗡声（第 10 页）。"},"t1750":{"nm":"1750 Hz 单音","sh":"中继","t":"1750 Hz 单音：打开中继台","h":"发射开始时一个短促的 1750 Hz 音（约 0.5 至 1 秒）至今仍用来打开欧洲的一些业余中继台；松开按键时，中继常回一声“哔”。","l":"1750 Hz 处一条短线，然后是语音，再是中继的哔声（第 10 页）。"},"ncdxf":{"nm":"NCDXF 信标","sh":"14.100 MHz","t":"NCDXF / IARU 信标：测试传播","h":"全世界十八个信标轮流发射，每个十秒，频率为 14.100、18.110、21.150、24.930 和 28.200 MHz：先用摩尔斯发呼号，然后是四个一秒长的划，功率依次为 100 W、10 W、1 W 和 0.1 W。","l":"一个呼号，然后是四个越来越弱的划：如果还能听到最后一个，说明到该信标的传播极好。这里先是 4U1UN（纽约），再是 VE8AT（加拿大）（第 30 页）。"},"lrpt":{"nm":"Meteor-M LRPT","sh":"137.9 MHz","t":"Meteor-M 卫星：LRPT 图像","h":"俄罗斯 Meteor-M 气象卫星以数字方式发送图像：四相相位调制（QPSK），每秒 72000 个符号，宽约 120 kHz。","l":"边缘圆润的实心块，过境期间缓慢滑动（多普勒效应）；听起来只是嘶声。频率 137.9 或 137.1 MHz，可用 SatDump 解码（第 41 页）。","n":"比例缩小"},"quindar":{"nm":"Quindar 提示音","sh":"NASA","t":"Quindar 音：阿波罗的“哔”声","h":"休斯敦任务控制中心按下话筒键时，一声 2525 Hz 的哔声（250 ms）打开地面站的发射机；松开时，一声 2475 Hz 的哔声把它们关闭。","l":"每句话前有一声较高的哔，话后有一声略低的哔：阿波罗任务录音中那个著名的声音。"},"wow":{"nm":"“Wow!”信号","sh":"1977","t":"“Wow!”信号（1977 年 8 月 15 日）","h":"美国俄亥俄州的“大耳朵”射电望远镜在氢线附近（约 1420.456 MHz）接收到一个持续 72 秒、很窄而且非常强的信号。天文学家杰里·埃曼在打印纸上写下“Wow!”。此后再也没有出现过，其来源至今仍有争论。","l":"一条细线从噪声中升起，增强后又减弱：这是固定信号源扫过天线波束时的形状。这里是复原：并没有任何录音存在。","n":"72 秒压缩为 12 秒"},"frb":{"nm":"快速射电暴","sh":"FRB","t":"快速射电暴（FRB）","h":"来自其他星系、只持续几毫秒的射电闪光；第一个于 2007 年被发现。途中的气体使低频大大延迟：信号到达时被拉长，高频先到。","l":"一条从频谱顶部落到底部的曲线，然后就什么都没有了。有些会重复；大多数只出现过一次。","n":"大幅放慢并夸大"},"letterb":{"nm":"单字母信标","sh":"D、P、S、C…","t":"单字母信标","h":"俄罗斯海军的发射机无休止地重复一个摩尔斯字母，彼此相隔 100 Hz：按地点不同为 D、P、S、C、A、F、K 或 M。","l":"几条紧挨着的平行虚线，各有各的节奏。在 4558、5154、7039、10872、13528 和 16332 kHz 附近，用 CW 收听。"},"sid":{"nm":"甚低频上的太阳耀斑","sh":"SID","t":"在甚低频上看到的太阳耀斑（SID）","h":"各国海军的甚低频发射台（法国 20.9 kHz、德国 23.4 kHz 等）的信号在地面和电离层之间传播。太阳耀斑到来时，它的 X 射线在几分钟内改变电离层底部，接收电平随之突变。","l":"一条窄而稳定的频带（发射台的 MSK 信号）突然变强，然后慢慢恢复正常。一个线圈加一块声卡就够了：天文社团的经典制作。","n":"一小时压缩为 12 秒"},"qrn":{"nm":"雷电干扰","sh":"QRN","t":"雷电干扰（QRN）","h":"每一次闪电都是一部功率极大的发射机，同时覆盖所有频率。在中波和短波上能听到几千公里外的雷暴，夏季和低频段尤其明显。","l":"横贯全宽的不规则横线；耳中是干脆的噼啪声。噪声抑制器（NB）有一点帮助，环形天线帮助更大。"},"fading":{"nm":"选择性衰落","sh":"QSB","t":"选择性衰落（QSB）","h":"在短波上，信号经电离层的多条路径到达。随频率不同，它们相互叠加或抵消：一个窄窄的凹陷在信号中游走。","l":"一片暗区在 AM 电台中缓慢移动。当它经过中间的载波时，声音会有几秒钟变得沙哑失真；同步检波或用单边带收听可以消除这种现象。"},"plc":{"nm":"电力线上网（PLC）","sh":"2–30 MHz","t":"PLC：通过电源插座上网","h":"电力猫通过家里的电线传送数据，在 2 至 30 MHz 之间（新型号更高）使用数百个载波，每 24.4 kHz 一个。电线就像天线一样向外辐射。","l":"一排规则的谱线成包闪烁，在业余频段留有缺口（标准规定的陷波）；听起来是随上网流量变化的噼啪声（第 43 页）。","n":"比例缩小"},"fence":{"nm":"电围栏","sh":"嗒…嗒…","t":"电围栏","h":"电围栏主机大约每秒向导线送出一个几千伏的脉冲。如果草碰到导线或绝缘子损坏，就会跳火花，向所有频率辐射。","l":"横贯全宽的一条极细横线，间隔非常均匀；从长波到甚高频都能听到“嗒…嗒…”。均匀的节奏使它有别于雷电。"},"gsm":{"nm":"GSM 手机","sh":"217 Hz","t":"音箱旁的 GSM 手机","h":"2G 手机以 0.577 ms 的突发发射，每秒 217 次。屏蔽不良的音频放大器会检出这些突发，让人听见。","l":"每隔 217 Hz 一条的梳状谱线；手机响铃前那著名的“嗒嗒—嗒嗒嗒”，通话时则是持续的嗡嗡声。越来越少见：2G 网络正在逐步关闭。"},"jjy":{"nm":"JJY","sh":"40 / 60 kHz","t":"JJY 授时信号（日本，40 和 60 kHz）","h":"每秒开始时载波以全功率发射 0.8 秒（位 0）、0.5 秒（位 1）或 0.2 秒（标志），然后降到 10%。与在秒开头降低的 DCF77 正好相反。","l":"一条固定的线，在每秒的末尾或早或晚变弱。发射台位于福岛（40 kHz）和佐贺—福冈（60 kHz），供日本的电波钟使用。"},"rwm":{"nm":"RWM","sh":"4996 kHz","t":"RWM 授时信号（莫斯科）","h":"在 4996、9996 和 14996 kHz 上用等幅电报发射：每秒一个 100 ms 的脉冲，在另一些分钟则是每秒十个脉冲。呼号 RWM 每小时用摩尔斯发送两次。","l":"先是呼号，然后一条线被切成规律的“嗒”声，再变成快速的点。用 CW 或单边带收听。","n":"压缩片段"},"bpm":{"nm":"BPM","sh":"2.5–15 MHz","t":"BPM 授时信号（中国）","h":"陕西蒲城的 BPM 短波授时台以 AM 在 2.5、5、10 和 15 MHz 发射：每秒一个 10 ms 的 1000 Hz 秒信号（整分为 300 ms），某些分钟发 100 ms 的 UT1 秒信号。呼号 BPM 先用摩尔斯、再用语音播出。","l":"解调后的声音中：先是呼号，然后是 1000 Hz 处极短的线，每秒一条，整分时有一条较长的。常与同频率的 WWV 混在一起。","n":"压缩片段"},"humpback":{"nm":"座头鲸","sh":"歌声","t":"座头鲸的歌声","h":"冬季在繁殖海域，雄鲸会歌唱：一串呻吟、低吼和鸣叫组成一个主题，一连几个小时原样重复，并且每个季节都会变化。水听器在几十公里外都能听到。","l":"带有谐波的粗线条，在 100 Hz 到几 kHz 之间缓慢升降；几秒后同样的一串又会出现。海面和海底的回声把每个音拉长。"},"bluewhale":{"nm":"蓝鲸","sh":"×10","t":"蓝鲸：最低沉的叫声","h":"地球上最大的动物发出非常低沉（10 至 40 Hz）而且非常响的叫声，每声长 10 至 20 秒，一连重复几个小时，可以传到几百公里外。为了让人耳听见，录音加快了十倍。","l":"先是一段脉冲，然后是一个几乎不下降的长音，上方是它的谐波；整段反复出现。刻度显示的是真实频率。","n":"加速 10 倍"},"finwhale":{"nm":"长须鲸","sh":"20 Hz","t":"长须鲸：20 Hz 脉冲","h":"长须鲸发出约一秒长的脉冲，频率从约 25 Hz 降到 18 Hz，间隔规律，有时持续几天。上世纪五六十年代，这些“20 Hz 信号”曾让美国海军的监听网困惑不已，后来才确认来自这种鲸。","l":"一个个相同的短划，规律成串或成对出现，像一颗跳得极慢的心脏；每一划的频率略微下降。刻度显示的是真实频率。","n":"加速 10 倍"},"sperm":{"nm":"抹香鲸","sh":"咔嗒声","t":"抹香鲸的咔嗒声","h":"抹香鲸深潜捕食时使用声呐：非常响的咔嗒声，大约每秒一下，接近猎物时加快成“吱嘎声”。抹香鲸之间还交换“尾音（coda）”，即一小串咔嗒声，节奏因族群而异。","l":"横贯全宽的水平线，间隔均匀，然后密集成嗡嗡声（吱嘎声），最后是一个小小的节奏型：尾音。每一下咔嗒由几个紧挨着的脉冲组成，来自鲸头部内的反射。"},"dolphin":{"nm":"宽吻海豚","sh":"哨声","t":"海豚的哨声和咔嗒声","h":"宽吻海豚的哨声大约在 5 至 20 kHz；每只海豚都有一个“签名哨声”，相当于它的名字。为了捕食和辨认方向，它还发出一串串极短的咔嗒声，每秒可达几百下。","l":"细细的曲线上升又回落，常常原样重复；还有回声定位时成串的水平线。为了能听见，频率除以 3；刻度显示的是真实数值。","n":"降低 3 倍播放"},"orca":{"nm":"虎鲸","sh":"脉冲叫声","t":"虎鲸的脉冲叫声","h":"虎鲸用脉冲叫声交流：脉冲快得（每秒 500 至 2000 个）让人听成一个音，并且音高会突然跳变。每个家族群体都有自己的“方言”。","l":"一叠平行的线条（谐波）一起上升或下降，叫声中间有一个明显的折角；有时还有一条更高的细哨声。"},"bseal":{"nm":"髯海豹","sh":"颤音","t":"髯海豹的颤音","h":"春天在北极海冰下，雄海豹发出长长的颤音，从几 kHz 螺旋式下降到几百赫兹，有时长达一分钟。用来守卫领地和吸引雌海豹。","l":"一条波浪形曲线从刻度高处滑到低处，像一根正在松开的弹簧，最后是一个低音。","n":"已缩短"},"shrimp":{"nm":"枪虾","sh":"珊瑚礁","t":"枪虾（鼓虾）","h":"枪虾猛地合上大螯，喷出的水流快到形成空化气泡；气泡破裂时发出枪声般的爆响。成千上万只枪虾构成珊瑚礁的背景噪声，还会干扰声呐。","l":"横贯全宽的点和短横线，毫无规律，像下雨一样；耳机里是不停的噼啪声，像在油锅里煎东西。"},"sonar":{"nm":"主动声呐","sh":"ping","t":"主动声呐的“ping”","h":"舰船发出一个很强的声脉冲（这里约 3.5 kHz，是护卫舰舰壳声呐的频段），然后聆听回波：延迟给出距离，频移（多普勒效应）给出目标速度。声音还会从海底和海面拖着尾巴返回，这就是混响。","l":"一条又短又强的线，一段渐渐消失的拖尾，然后是弱得多、频率略有偏移的回波。第二个 ping 是扫频信号（chirp），测距更准。"},"propeller":{"nm":"船舶螺旋桨","sh":"空化","t":"驶过船只的螺旋桨","h":"螺旋桨叶片产生空化气泡并破裂：一片宽带的嘶嘶声，随叶片经过的节奏起伏。机器再加上固定的谱线。声呐兵分析这个节奏（DEMON 分析）来数出叶片数和转速，从而识别船只。","l":"宽频带的嘶声，带有随叶片节奏出现的水平条纹，另有几条固定的竖线（发动机、减速箱）。船从水听器上方驶过时，声音先增强后消失。"},"uqc":{"nm":"水下电话","sh":"UQC 8 kHz","t":"水下电话（UQC，“Gertrude”）","h":"潜艇和舰船在水下用声学电话通话：语音以单边带方式调制在 8.0875 kHz 载波之上，由舰壳上的换能器发出。通信距离几公里。","l":"8 kHz 以上的一条单边带语音频带；解调后是遥远的人声，因为海面和海底的回声而起伏、发出回响。显示比例缩小一半；刻度显示的是真实频率。","n":"刻度缩小一半"},"zevs":{"nm":"ZEVS 82 Hz","sh":"ELF","t":"ZEVS：82 Hz 的潜艇电台","h":"无线电波很难穿透海水，只有极低频（ELF）例外。俄罗斯科拉半岛的 ZEVS 发射台用长达几十公里的天线线路在 82 Hz 发射，用来联络深潜的潜艇。速率极低：每分钟几个字符。","l":"82 Hz 处的一条细线，旁边是 50 Hz 电网谱线及其谐波，还有雷暴的干扰。耳机里是几乎听不见的低沉嗡声；用大环形天线加声卡就能接收。美国的同类系统（76 Hz）已于 2004 年关闭。"},"bloop":{"nm":"“Bloop”","sh":"1997","t":"“Bloop”（1997 年）","h":"1997 年，NOAA 在太平洋的水听器录到一个非常低沉、迅速升高的声音，几千公里外都能听到。它长期是个谜，自 2012 年起被认为来自冰震：一座巨大冰山的破裂。","l":"一条宽频带在几秒内连同谐波一起升高，然后慢慢消失。这是复原，像 NOAA 发布的录音一样加速了 16 倍。","n":"加速 16 倍"}}},"ja":{"ui":{"title":"VSISA","mystery":"ミステリー音","play":"▶ 聴く","stop":"■ 停止","noise":"ノイズ","volume":"音量","loop":"ループ","specwf":"スペクトラム + ウォーターフォール","cursor":"カーソル","footprint":"信号の全体像","dur":"上から下へ {s} 秒","avg":"信号全体の平均","press":"「聴く」を押すと、ここに信号が流れます","count":"{n} 種類の信号（第 6 シートの順）","myst":"ミステリーモード","mystTags":"聴いて見てから、正しい答えを選んでください","quizH":"これはどの信号？","quizLead":"再生して、スペクトラム、ウォーターフォール、全体像を見てから答えてください。","score":"スコア","good":"正解！","bad":"残念：正解は {x} でした。","next":"次のミステリー音","principle":"しくみ","screen":"画面上","sheet":"シート","book":"本：シート {r}","lang":"言語","signals":"信号","f1":"信号はページ内でシミュレートしています（毎秒 12,000 サンプル）。OpenBookRadio の本の第 6 シートの信号、本に出てくるその他の信号、そしてボーナスです。無線信号（AM、FM、AIS、LoRa など）は SDR の画面と同じく、シミュレートした中間周波数で表示しています。一部は縮小または高速化しており、その旨を表示しています。AM、SSB、FM、FM ステレオ、ISS、フェージングでは、受信機のスピーカーと同じ復調後の音が聞こえ、画面には無線信号が表示されます。声は合成音声で、本当の言葉は話していません。","f2":"ウォーターフォールと全体像では時間が下へ流れます。ライセンス CC BY-NC-SA 4.0、無料、販売禁止。","night":"ナイトモード","day":"デイモード","visits":"訪問","plays":"再生","book_dl":"本をダウンロード","book_dl2":"OpenBookRadio の本をダウンロード（無料、PDF と EPUB、13 言語）","display":"表示","theme_day":"昼","theme_night":"夜（赤）","theme_phos":"緑色リン光","theme_phosb":"青色リン光","theme_phosa":"琥珀色リン光","w3d":"3D ウォーターフォール","w3dHint":"ドラッグで回転"},"groups":["アナログ音声","電信","データ","画像","航空・海事・救難","呼出し・サブトーン・ページング","ラジオゾンデ・センサー・IoT機器","HF モードと珍しい信号","放送と時刻","広帯域","ボーナス：宇宙の音","ボーナス：短波の珍しい信号","ボーナス：水中の音"],"modes":{"am":{"sh":"放送","t":"AM：振幅変調","h":"搬送波の強さが音に合わせて変わり、波形が「ふくらんだり」「しぼんだり」します。","l":"中央に固定の線（搬送波）、その両側に同じ側波帯。幅は約 6〜9 kHz。短波・中波放送、航空無線（シート 12 と 14）。","r":[["聞きどころ","ジングルのあと、BGM にのせてアナウンサーが話します。二つの側波帯は鏡写しで、搬送波の両側に旋律、続いて声が見えます。"]]},"ssb":{"t":"SSB：単側波帯","h":"側波帯が一つだけ残り、搬送波はありません。話していないときは何もありません。","l":"中央線がなく、話しているときだけ現れる幅約 2.7 kHz の帯一本。10 MHz 以上は USB、以下は LSB（アマチュア無線）。同調がずれると「アヒル声」になります（シート 11 と 29）。"},"fm":{"sh":"音声","t":"FM：周波数変調","h":"振幅は一定で、音に合わせて振動の間隔が詰まったり広がったりします。","l":"信号は自分の周波数のまわりで揺れ、音が大きいほど広がります。ナローFM は 1 チャンネル 12.5 kHz（トランシーバー、レピーター）、FM 放送は 200 kHz（シート 2 と 13）。","r":[["聞きどころ","最後の短い「ザッ」：送信が止まるとスケルチが閉じます。"]]},"cw":{"nm":"CW モールス","t":"CW：モールス符号","h":"搬送波をオン・オフします：長点と短点。","l":"モールスのリズムで途切れるとても細い線。耳には「ピッ」という音。ここでは「CQ」（シート 48）。","r":[["速度","毎分 20 語、短点 60 ms、700 Hz：「CQ CQ CQ DE F4ABC K」"],["耳で","一つの音程の、長短の澄んだビープ音"],["デコード","耳、fldigi、CW Skimmer"]]},"rtty":{"t":"FSK / RTTY：二つの周波数","h":"周波数が二つの値の間を跳びます。一方が 0、もう一方が 1。","l":"平行な二本線：アマチュア無線では 170 Hz 間隔（45.45 ボー）、気象通報では 450 または 850 Hz。規則的な「ティディリディ」（シート 32）。","r":[["符号","ボー ITA2：5 ビット + スタート + 1.5 ストップ；mark 2125 Hz、space 2295 Hz"],["テキスト","RYRYRYRY CQ CQ DE F4ABC"],["デコード","fldigi、MMTTY、2Tone"]]},"afsk":{"nm":"APRS パケット","t":"AFSK 1200 ボー：APRS とパケット通信","h":"1200 Hz と 2200 Hz の二つの可聴音を FM 送信機に入れます。","l":"FM 受信機の後（スピーカーの音）で見ると、1200〜2200 Hz の帯が短いバーストで現れます。耳には 1 秒ほどの「グルルッ」（シート 35 と 36）。","r":[["周波数","ヨーロッパでは 144.800 MHz（APRS）、FM"],["フレーム","0x7E フラグのあと NRZI の AX.25 データ"],["デコード","Direwolf、multimon-ng、KISS TNC"]]},"psk31":{"t":"PSK31：位相変調","h":"周波数は動かず、位相が反転します。反転のたびに振幅が落ち込みます。","l":"幅約 60 Hz のとても細い線で、少し「編んだ」ように見えます。3 kHz に数十局が入ります（シート 29）。","r":[["符号","Varicode：0 = 位相反転、1 = 変化なし；待機中は双子の二本線"],["受信周波数","14,070 kHz、3,580 kHz"],["デコード","fldigi"]]},"ft8":{"t":"MFSK / FT8：八つのトー す。","l":"小さな点でできた幅約 2 kHz のブロックが 1〜2 秒、ときには近くの複数の周波数に。高いさえずり音（シート 34）。"},"rs41":{"nm":"RS41 ラジオゾンデ","t":"RS41 ラジオゾンデ：連続 GFSK","h":"4800 ボーのなめらかな FSK を止まらず送信。ゾンデが上昇して冷えるにつれ、周波数がゆっくりずれます。","l":"400〜406 MHz で、飛行中ずっと斜めに滑っていく幅約 10 kHz の帯（シート 21）。"},"ook":{"nm":"433 センサー","t":"433 MHz センサー：OOK","h":"搬送波を短いパルスや長いパルスでオン・オフします（オンオフ変調）。メッセージは 3 回繰り返されます。","l":"433.92 MHz に、小さな点のバーストがよく 3 回ずつ。気象ステーション、温度センサー、リモコン（シート 22）。"},"fhss":{"t":"Bluetooth：周波数ホッピング（FHSS）","h":"79 チャンネルの中で周波数を毎秒 1600 回切り替えます（縮小表示）。","l":"2.4 GHz 付近、幅 80 MHz にわたって散らばる小さな線。同じ場所には二度と現れません（シート 25）。","n":"縮小表示"},"wspr":{"t":"WSPR：伝搬ビーコン","h":"1.46 Hz 間隔の四つのトーン、1 シンボル 0.68 秒、110.6 秒間。","l":"幅約 6 Hz のとても細い線が 2 分近く続き、偶数分ごとに現れます。大きく拡大する必要があります（シート 29）。","n":"24 秒の抜粋（1 回の送信は 110.6 秒）"},"qrss":{"t":"QRSS：とても遅いモールス","h":"搬送波をオン・オフし、短点は 3〜10 秒。近い二つの周波数を使うことが多い（DFCW）。","l":"幅数 Hz の線を 10 分間の画面で読みます。耳では聞き取れません（シート 30）。","n":"高速化：短点 0.6 秒（本来は 3〜10 秒）"},"texte":{"nm":"ウォーターフォール文字","t":"ウォーターフォールに文字を描く","h":"画像の各行がトーンの集まりになり、音はノイズのように聞こえます。","l":"文字や絵が SDR の画面に直接現れます（シート 40）。","r":[["注","画像の下から送信：ライブのウォーターフォールでは正立、全体像（上から下へ読む）では逆さま"]]},"vara":{"t":"最新の HF データ：VARA、Pactor、ARDOP","h":"長く詰まったバースト（OFDM または PSK）と、その合間の相手局からの短い応答。","l":"止まっては再開する幅約 2.4 kHz の長方形と、合間の小さな受信確認。途切れ途切れのシャー音（シート 29）。"},"chirp":{"nm":"電離層サウンダー","t":"電離層サウンダー（チャープサウンダー）","h":"HF 全体を横切るゆっくりした周波数スイープ。電離層からのエコーが少し遅れて届きます。","l":"画面を横切る斜め線と、それに並ぶ平行線（エコー）。一瞬で通り過ぎる「フュイッ」。"},"oth":{"nm":"超水平線レーダー","t":"超水平線レーダー（「ウッドペッカー」）","h":"毎秒 10〜50 回繰り返すパルスで、一つひとつが数 kHz の幅。","l":"バンド全体を覆う縞模様の広いブロック。短波で聞こえる、とても規則的なキツツキの音。"},"parasites":{"nm":"雑音妨害","sh":"電源","t":"スイッチング電源の雑音","h":"方形波：その周波数とすべての高調波が同時に出ます。","l":"ノイズを背景に、そろってずれていく規則的な線の櫛。NOISE FIND や携帯受信機で探します（シート K22）。"},"mpx":{"nm":"FM ステレオと RDS","t":"FM ステレオ放送と RDS","h":"復調した音（コンポジット）には L+R、19 kHz のパイロット、38 kHz 付近の L-R、57 kHz の RDS が入っています。","l":"復調後 0〜60 kHz で見ると、低い帯、19 kHz の細い線、中央の弱い帯、いちばん上に RDS（シート 12）。","n":"1/20 に縮小、ステレオ音声","r":[["聞きどころ","ヘッドホンで：最初の 4 秒はモノラル（中央の L-R のブロックが消えます）、次の 4 秒はステレオで、旋律が左、和音が右から聞こえます。"]]},"dcf77":{"t":"DCF77 標準電波（77.5 kHz）","h":"毎秒の初めに、搬送波が 0.1 秒（ビット 0）または 0.2 秒（ビット 1）だけ 15 % に下がります。","l":"毎秒黒い切れ目が入る固定の線。59 秒目には切れ目がなく、分の区切りを示します（シート 12）。","r":[["注","ここでは搬送波を 1000 Hz に移しています。6 秒目には切れ目がなく、毎分 59 秒目と同じです"]]},"ofdm":{"t":"OFDM：数十のサブキャリア","h":"ぎっしり並んだ多数の搬送波で、それぞれは遅い。合計するとノイズのように見えます。","l":"縁のくっきりした平らな長方形で、いつも出ています：短波 DRM（10 kHz）、DAB+（1.5 MHz）、地デジ、Wi-Fi。耳には連続したシャー音（シート 12 と 25）。"},"dsss":{"t":"スペクトラム拡散（DSSS）：GPS、Wi-Fi 802.11b","h":"データをとても速い符号と混ぜ、エネルギーを広い帯域に広げます。","l":"ノイズからわずかに出た広いこぶ。GPS はノイズより下にあり、処理しないと見えません（シート 25 と 26）。"},"hline":{"nm":"水素線","sh":"1420 MHz","t":"波長 21 cm の水素線（1420.405 MHz）","h":"天の川銀河の冷たい水素が 1420.405 MHz でとても弱いノイズを出しています。銀河の腕の動きによりドップラー効果でずれ、小さなこぶがいくつか見えます。","l":"ウォーターフォールでは一瞬ごとにはほとんど何も見えません。長時間平均すると、こぶがノイズから浮かび上がります。ここでは停止中の平均スペクトラムを見てください。パラボラかホーン、プリアンプ、SDR ドングルがあれば十分です。","n":"信号を大きく誇張"},"sun":{"nm":"太陽","sh":"バースト","t":"太陽：III 型電波バースト","h":"フレアで放り出された電子がコロナを通り抜け、遠ざかるにつれてより低い周波数で電波を出させます。","l":"太陽ノイズを背景に、1 秒足らずでスペクトラムの上から下へ斜めに落ちる線。高まる「シャーッ」。およそ 10〜400 MHz、短波の 20 MHz 付近でも聞こえます。"},"jupiter":{"nm":"木星","sh":"20 MHz","t":"木星：デカメートル波バースト（L と S）","h":"木星の磁場と衛星イオが 15〜40 MHz で強い電波を出します。ゆっくりした L バーストと、すばやく下へ滑るとても短い S バースト。","l":"まず打ち寄せる波のようなノイズ（L）、続いて密な斜め線の小さな「ポッ」の連続（S）。夜の 20.1 MHz 付近で、イオの位置がよいとき、簡単なダイポールで受信できます。"},"pulsar":{"nm":"パルサー","sh":"B0329+54","t":"パルサー PSR B0329+54","h":"自転する中性子星が電波ビームで地球をなでます。ここでは 0.714 秒ごと。星間ガスが低い周波数を遅らせるので、各パルスはまずスペクトラムの上に届きます。","l":"規則的な「カチッ」。ウォーターフォールでは各パルスが下がっていく曲線（分散）。本物の信号はノイズの下にあり、大きなアンテナと周期ごとのパルスの積算が必要です。","n":"信号を大きく誇張"},"meteor":{"nm":"流星","sh":"GRAVES","t":"GRAVES レーダーの流星エコー（143.050 MHz）","h":"フランスの GRAVES レーダーは 143.050 MHz で常に送信しています。流れ星が空気を電離すると、その痕跡が信号の一部をあなたの受信機へ反射します。一瞬から数秒間です。","l":"143.049 MHz を USB で：1000 Hz 付近の短い「ピン」。ときにはすべるエコー（流星の頭部、ドップラー効果）や長く続くエコーも。流星群（ペルセウス座、ふたご座）のときはずっと増えます（シート 1）。"},"whistler":{"nm":"ホイッスラー","sh":"VLF","t":"VLF ホイッスラー","h":"雷が電波の「パチッ」を生み、その一部が地磁気の磁力線に沿ってもう一方の半球まで行って戻ってきます。高い音が先に届きます。","l":"「パチッ」のすぐあと、1〜2 秒で高い音から低い音へ下がる「ヒューン」。あちこちにパチパチ音（空電）。10 kHz 以下、送電線から離れた VLF 受信機で。"},"chorus":{"nm":"ドーンコーラス","sh":"VLF","t":"ドーンコーラス（夜明けの合唱）","h":"磁気嵐のとき、磁気圏に捕らえられた電子が小さな上昇音を出します。とくに夜明けごろに多く現れます。","l":"重なり合う上昇するさえずり、まるで鳥のよう。およそ 1〜4 kHz。ホイッスラーと同じ装置で聞けます。"},"sputnik":{"nm":"スプートニク 1 号","sh":"1957","t":"スプートニク 1 号（1957 年）","h":"最初の人工衛星は、約 0.3 秒のビープ音を 20.005 MHz と 40.002 MHz で交互に、3 週間送り続けました。","l":"規則的に途切れる線：「ピッ…ピッ…」。1957 年 10 月に世界中が耳を傾けた音（再現）。"},"doppler":{"nm":"ドップラー効果","sh":"衛星","t":"衛星ビーコンとドップラー効果","h":"低軌道の衛星は近づいてから遠ざかるので、受信周波数はパスの間に下がります。145 MHz で約 ±3 kHz、435 MHz で約 ±10 kHz。","l":"S 字形に下がる線：最初はゆっくり、衛星が最も近いときに速く、また最後はゆっくり（シート 41）。","n":"10 分のパスを 12 秒に短縮"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA 衛星：APT 画像（過去の方式）","h":"画像で振幅変調した 2400 Hz のサブキャリアで、毎秒 2 行、各行の初めに同期パルス。2025 年に停止し、現在は Meteor-M 衛星が LRPT で送信しています。","l":"画像とともに変わる側波帯をもつ 2400 Hz の線と、毎秒 2 回の有名な「チクタク」（シート 41）。"},"eme":{"nm":"月面反射","sh":"EME","t":"月面反射のエコー（EME）","h":"月へ送った信号は約 2.5 秒後に戻ってきます。非常に弱くなり、少し広がり、ドップラーでずれています。","l":"自分の「ピッ」が聞こえ、2.5 秒後に弱く少しぼやけたエコーが返ってきます。アマチュア無線家は 144 MHz 以上で CW や JT65 を使って行います（シート 1）。","n":"エコーを大きく誇張"},"msk144":{"nm":"MSK144","sh":"流星","t":"MSK144：流星散乱のデジタルモード","h":"1000 Hz と 2000 Hz の二つのトーン、2000 ボー。72 ms のフレームを休みなく繰り返し、流星の痕跡ごとにいくつかが届きます。","l":"幅約 2.4 kHz、0.1〜1 秒のバーストが、流星の「ピン」とともに現れて消えます。50 MHz と 144 MHz で WSJT-X を使います。"},"jt65":{"nm":"JT65","sh":"65 トーン","t":"JT65：65 トーンのとても遅いモード","h":"同期トーン一つと、2.7 Hz 間隔の 64 のデータトーン（JT65A）。1 シンボル 0.37 秒、1 分間に 47 秒送信します。","l":"約 180 Hz に並ぶ小さな線のはしごと、いつも同じ場所に戻る同期の線。月面反射（JT65B、C）や非常に弱い信号に使われます。","n":"20 秒の抜粋（1 回の送信は 47 秒）"},"tetra":{"nm":"TETRA","sh":"π/4-DQPSK","t":"TETRA：業務用デジタル無線","h":"π/4-DQPSK の位相変調で毎秒 18,000 シンボル、4 つのタイムスロット、25 kHz のチャンネル。","l":"縁の丸い詰まったブロックで、基地局の近くではずっと出ています。しゃがれたシャー音。暗号化されていて聞けません（シート 46）。","n":"縮小表示"},"ndb":{"nm":"NDB ビーコン","sh":"190–535 kHz","t":"NDB：無指向性無線標識","h":"長波の固定搬送波に、2〜3 文字のモールス識別符号をトーン（多くは 1020 Hz）で乗せています。","l":"中央に固定の線、識別符号の間は両側に小さな線が二本。およそ 190〜535 kHz、SSB か CW で（シート 12）。"},"vor":{"nm":"VOR","sh":"108–118 MHz","t":"VOR：超短波全方向式無線標識","h":"AM で、方位によって変わる 30 Hz 信号、30 Hz で周波数変調した 9960 Hz のサブキャリア（基準）、1020 Hz のモールス識別符号。","l":"復調した音では：低い 30 Hz のうなり、10 kHz 付近の波打つ太い線、ときどき識別符号（シート 18）。","n":"復調音、1/2 に縮小"},"ils":{"nm":"ILS","sh":"90 + 150 Hz","t":"ILS：着陸誘導（ローカライザー）","h":"AM で 90 Hz と 150 Hz の二つのトーン。その比で、機体が中心線の左か右かがわかります。モールス識別符号は I で始まります。","l":"復調した音では：90 Hz と 150 Hz のとても低い二本の線と、1020 Hz の識別符号。108.1〜112 MHz、グライドスロープは 330 MHz 付近（シート 18）。"},"m10":{"nm":"M10 / M20 ゾンデ","sh":"Meteomodem","t":"M10・M20 ラジオゾンデ（Meteomodem）","h":"毎秒 1 フレームの高速 FSK（約 9600 ボー）で、RS41 より幅が広い。フランスではメテオフランスが放球しています。","l":"毎秒一つの広いバーストが、飛行中ゆっくりずれていきます。400〜406 MHz（シート 21）。"},"tpms":{"nm":"タイヤ（TPMS）","sh":"433 MHz","t":"タイヤ空気圧センサー（TPMS）","h":"各ホイールがときどき数ミリ秒の FSK バーストを送ります：空気圧、温度、ID。","l":"433.92 MHz（または 315 MHz）に、車が通るとき、よく二つずつ現れる小さな単発バースト。rtl_433 でデコードできます。"},"als162":{"nm":"ALS162","sh":"162 kHz","t":"ALS162 標準電波（アルーイ、162 kHz）","h":"かつてのフランス・アンテール長波放送の搬送波。時刻は聞こえない小さな位相変調で符号化されています。","l":"フランスではとても強い固定の線で、毎秒の初めにわずかに広がるだけ。時刻を読むにはデコーダーが必要です（シート 12）。"},"wwv":{"nm":"WWV","sh":"2.5–20 MHz","t":"WWV 標準電波（コロラド）","h":"AM で、毎秒 1000 Hz・5 ms の「チッ」、500 Hz か 600 Hz のトーン、100 Hz のタイムコード、UTC を告げる声。","l":"復調した音では：毎秒切れる 500 Hz の線、1000 Hz のチッ、いちばん下の 100 Hz にタイムコード（シート 12）。"},"msf":{"nm":"MSF","sh":"60 kHz","t":"MSF 標準電波（アンソーン、60 kHz）","h":"毎秒の初めに、ビットに応じて 0.1、0.2、0.3 秒搬送波を切り、分の区切りには 0.5 秒切ります。","l":"毎秒完全に黒い切れ目が入る固定の線。DCF77 より長い切れ目です（シート 12）。"},"type2":{"nm":"太陽 II 型","sh":"衝撃波","t":"太陽：II 型電波バースト","h":"コロナ質量放出の衝撃波で、プラズマがゆっくりと低い周波数へ移りながら電波を出します。基本波と 2 倍波の二本に分かれることが多いです。","l":"数分かけてゆっくり下がる平行な二本のノイズ帯。ずっと速い III 型と比べてみてください。","n":"数分を 6 秒に短縮"},"tweeks":{"nm":"ツイーク","sh":"VLF","t":"ツイーク：夜の VLF「ピン」","h":"夜、遠くの雷の「パチッ」が地面と電離層の間を反射します。遮断周波数（約 1.7 kHz）付近の成分が最後に届きます。","l":"下がって 1.7 kHz 付近で止まる小さな「ピン」。2 倍の周波数にエコーが出ることも。あちこちにパチパチ音。10 kHz 以下、夜に。"},"hiss":{"nm":"VLF ヒス","sh":"hiss","t":"VLF ヒス","h":"プラズマ圏の電子が出す広帯域のノイズで、磁気活動とともに強まったり弱まったりします。","l":"数百 Hz から数 kHz のノイズ帯。模様はなく、ゆっくり強まっては弱まります。"},"aurora":{"nm":"オーロラ反射","sh":"Au","t":"オーロラ伝搬（Au）","h":"オーロラは VHF の電波を反射しますが、とても速く揺さぶるので、各信号が数百 Hz に広がります。","l":"CW がざらざらした、ささやくようなノイズになり、音程が聞こえなくなります。磁気嵐のとき、50 MHz・144 MHz でアンテナを北に向けて。"},"galactic":{"nm":"銀河雑音","sh":"20–40 MHz","t":"天の川からの雑音","h":"銀河中心は電波ノイズを出しています。1932 年にカール・ジャンスキーが 20 MHz 付近で発見しました。地球の自転とともに強まったり弱まったりします。","l":"背景ノイズがゆっくり強まってまた弱まり、毎日約 4 分ずつ早くなります。20〜40 MHz で簡単なダイポールでも見えます。","n":"1 日を 12 秒に短縮"},"cubesat":{"nm":"キューブサット","sh":"9600 bd","t":"キューブサットのテレメトリー","h":"小型衛星は測定値（バッテリー、温度）を 435〜438 MHz 付近で 1200 または 9600 ボーの FSK・GMSK で定期的に送ります。","l":"パスの間、ドップラー効果で毎回少しずつ下がっていく規則的なバースト（シート 41）。","n":"縮小表示、パスを高速化"},"issfm":{"nm":"ISS の FM","sh":"145.800 MHz","t":"国際宇宙ステーション（ISS）：FM 音声","h":"宇宙飛行士は 145.800 MHz の FM で学校やアマチュア無線家と交信します。ステーションは時速 28,000 km なので、パスの間に受信周波数が約 +3.5 kHz から −3.5 kHz へずれていきます。","l":"10 分間のパスの間、右から左へゆっくり移っていく FM 音声の帯（シート 41）。","n":"10 分のパスを 10 秒に短縮"},"buzzer":{"nm":"UVB-76「ブザー」","sh":"4625 kHz","t":"UVB-76「ザ・ブザー」（4625 kHz）","h":"ロシアの軍用局で、何十年も前から約 1 秒のブザー音を 1 分に約 25 回送り続け、ときどき音声メッセージが入ります。","l":"固定の搬送波と、ブザーのたびに上から下まで並ぶ密な線の柱。4625 kHz の USB で簡単に見つかります。"},"pip":{"nm":"「ザ・ピップ」","sh":"3756 / 5448 kHz","t":"「ザ・ピップ」：終わりのないビープ","h":"もう一つのロシアの軍用短波ビーコンで、昼も夜も短いビープを繰り返し、ときどきメッセージが入ります。","l":"1 分間に約 50 回、短いビープで区切られる固定の線。耳には止まることのない規則的な「ピッ…ピッ…」。","n":"リズムは近似"},"squeaky":{"nm":"「スクイーキー・ホイール」","sh":"短波","t":"「スクイーキー・ホイール」：きしむ車輪","h":"ロシアの軍用短波ビーコンで、繰り返す音のパターンから聞き手が名付けました。","l":"一つが上昇する二つの音の小さなパターンがループで繰り返されます。きしむ車輪のようです。","n":"近似の再現"},"codar":{"nm":"CODAR","sh":"海洋レーダー","t":"CODAR：海流レーダー","h":"沿岸のレーダーが 1 秒に 1〜2 回周波数帯を掃引し、海流や波を測ります。","l":"規則的な平行の斜め線と、繰り返す「シュッ」。4.5〜5.5 MHz、13 MHz、25 MHz 付近で、昼夜を問わず出ていることが多いです。","n":"縮小表示"},"stanag":{"nm":"STANAG 4285","sh":"8-PSK","t":"軍用モデム STANAG 4285","h":"1800 Hz の搬送波上の 2400 ボー 8-PSK 位相変調。回線を追うため、107 ms ごとにテスト系列が入ります。","l":"幅約 3 kHz の詰まったブロック。耳には規則的なうなりを伴うシャー音（シート 43）。"},"link11":{"nm":"Link-11","sh":"16 トーン","t":"Link-11：海軍のデータリンク","h":"605〜2915 Hz の 16 のトーンを同時に送り、それぞれを毎秒 75 回位相変調します。","l":"935〜2365 Hz の規則的な 14 本の線の櫛と、離れた 605 Hz・2915 Hz の二本の線。耳には音楽的なうなり（シート 43）。"},"numbers":{"nm":"乱数放送","sh":"音声","t":"乱数放送（ナンバーズ・ステーション）","h":"決まった時刻に短い呼び出しメロディーが流れ、そのあと声（多くは合成音声）が 5 桁ずつ数字を読み上げます。AM または SSB です。","l":"一音ずつのメロディー、次に無音をはさんだ規則的な音節のまとまり（シート 43）。","n":"声は模倣で、本物の数字ではありません"},"rttydwd":{"nm":"DWD 気象 RTTY","sh":"50 Bd / 450 Hz","t":"ドイツ気象局（DWD）の気象 RTTY","h":"アマチュア無線の RTTY と同じ方式ですが、50 ボー・シフト幅 450 Hz です。ドイツ気象局が気象通報や海上予報を平文で送っています。","l":"二本の線の間隔がずっと広く、リズムも少し速め。通報の合間に「CQ CQ CQ DE DDK2 DDH7 DDK9」の呼出しと RYRYRY が流れます。4583、7646、10100.8 kHz、ほかに 147.3 kHz（シート 32）。"},"mfsk16":{"nm":"MFSK16","sh":"16 トーン","t":"MFSK16：16 のトーン","h":"15.625 Hz 間隔の 16 のトーンを一度に一つずつ、毎秒 15.625 回送ります。各トーンが 4 ビットを運び、誤り訂正符号で守られています。","l":"最初の一定音のあと、小さな段が絶えず跳び回る幅 316 Hz の帯。耳には笛のような速い旋律。小さな画像の伝送にも使われます。"},"sitora":{"nm":"SITOR-A（ARQ）","sh":"テレックス","t":"SITOR-A：ARQ 方式の海上テレックス","h":"局は 3 文字のブロック（210 ms、100 ボー、シフト幅 170 Hz）を 450 ms ごとに送り、その合間に相手局が短い信号で「受信」または「再送」を返します。","l":"規則的な短いバーストと、その間の弱い小さな応答。コオロギのような「チッチッ」という音。短波では今では珍しくなりました。"},"dscvhf":{"nm":"VHF DSC（70 チャンネル）","sh":"DSC","t":"DSC：70 チャンネルのデジタル選択呼出し","h":"1300 Hz と 2100 Hz の二つのトーンによる 1200 ボー・約 0.5 秒のバースト。船の MMSI 番号、呼出しの種類、遭難時には位置も運びます。","l":"156.525 MHz の短く高い「ブルルッ」で、交互ビットの並びから始まります。中波・短波の DSC は NAVTEX と同じ 100 ボーの FSK です（シート 20）。"},"selcal":{"nm":"航空 SELCAL","sh":"4 トーン","t":"SELCAL：短波での航空機の選択呼出し","h":"管制は、16 種類のトーン（312.6〜1479.1 Hz）のうち二つを重ねた約 1 秒のパルスを二回送り、特定の航空機を呼び出します。機内ではランプがつきチャイムが鳴るので、乗員は聞き続ける必要がありません。","l":"航空用 SSB 周波数（たとえば 5616 や 8864 kHz）の音声通信の合間に鳴る、二つ続きの和音「ピン・ポン」。"},"dcs":{"nm":"DCS","sh":"134.4 bit/s","t":"DCS：デジタルのサブトーン","h":"CTCSS のような連続音の代わりに、音声の下で 23 ビットの符号を毎秒 134.4 ビットで繰り返し送ります。終わりには 134.4 Hz のトーンでスケルチを静かに閉じます。","l":"FM 受信機の音で見ると、いちばん下の 300 Hz 以下に不規則な帯。無線機のフィルターを通れば、低いうなりとして聞こえます（シート 10）。"},"t1750":{"nm":"1750 Hz トーン","sh":"レピーター","t":"1750 Hz トーン：レピーターを開く","h":"送信の初めの短い 1750 Hz のトーン（約 0.5〜1 秒）は、今もヨーロッパの一部のアマチュア用レピーターを開くのに使われます。送信を終えると、レピーターがビープ音で応えることがよくあります。","l":"1750 Hz の短い線、続いて音声、最後にレピーターのビープ音（シート 10）。"},"ncdxf":{"nm":"NCDXF ビーコン","sh":"14.100 MHz","t":"NCDXF / IARU ビーコン：伝搬を調べる","h":"世界 18 局のビーコンが 14.100、18.110、21.150、24.930、28.200 MHz で 10 秒ずつ順番に送信します。モールスのコールサインのあと、100 W、10 W、1 W、0.1 W の 1 秒の長点を四つ送ります。","l":"コールサインのあと、だんだん弱くなる四つの長点。最後まで聞こえれば、そのビーコンへの伝搬は絶好です。ここでは 4U1UN（ニューヨーク）に続いて VE8AT（カナダ）（シート 30）。"},"lrpt":{"nm":"Meteor-M LRPT","sh":"137.9 MHz","t":"Meteor-M 衛星：LRPT 画像","h":"ロシアの気象衛星 Meteor-M は画像をデジタルで送ります。4 相位相変調（QPSK）、毎秒 72,000 シンボル、幅は約 120 kHz です。","l":"縁の丸い詰まったブロックが、パスの間ゆっくり動きます（ドップラー効果）。耳にはただのシャー音。137.9 または 137.1 MHz、SatDump でデコードします（シート 41）。","n":"縮小表示"},"quindar":{"nm":"クインダートーン","sh":"NASA","t":"クインダートーン：アポロの「ピッ」","h":"ヒューストンの管制がマイクのキーを押すと、2525 Hz のビープ（250 ms）が地上局の送信機を入れ、離すと 2475 Hz のビープが切ります。","l":"言葉の前に高いビープ、後に少し低いビープ。アポロ計画の録音でおなじみの音です。"},"wow":{"nm":"「Wow!」シグナル","sh":"1977","t":"「Wow!」シグナル（1977 年 8 月 15 日）","h":"オハイオ州のビッグイヤー電波望遠鏡が、水素線の近く（約 1420.456 MHz）で、狭くてとても強い信号を 72 秒間とらえました。天文学者ジェリー・エーマンが記録紙に「Wow!」と書き込みました。その後二度と現れず、正体は今も議論されています。","l":"ノイズの中から現れて強まり、また弱まる細い線。固定した電波源がアンテナのビームを横切るときの形です。これは再現で、音の記録は存在しません。","n":"72 秒を 12 秒に短縮"},"frb":{"nm":"高速電波バースト","sh":"FRB","t":"高速電波バースト（FRB）","h":"別の銀河から届く、数ミリ秒だけの電波の閃光。最初の発見は 2007 年です。途中のガスが低い周波数を大きく遅らせるので、高い音から先に、引き伸ばされて届きます。","l":"スペクトラムの上から下へ落ちる一本の曲線、そのあとは何もありません。繰り返すものもありますが、大半は一度きりです。","n":"大きく引き伸ばして誇張"},"letterb":{"nm":"一文字ビーコン","sh":"D・P・S・C…","t":"一文字ビーコン","h":"ロシア海軍の送信機が、モールスの一文字だけを延々と繰り返します。それぞれ隣と 100 Hz ずつ離れていて、場所によって D、P、S、C、A、F、K、M のどれかです。","l":"すぐ隣り合った平行な点線で、リズムはそれぞれ別。4558、5154、7039、10872、13528、16332 kHz 付近、CW で受信します。"},"sid":{"nm":"VLF で見る太陽フレア","sh":"SID","t":"VLF で見る太陽フレア（SID）","h":"各国海軍の VLF 送信局（フランス 20.9 kHz、ドイツ 23.4 kHz など）の電波は、地面と電離層の間を伝わります。太陽フレアが届くと、X 線が数分で電離層の下部を変え、受信レベルが急に変わります。","l":"狭く一定の帯（送信局の MSK 信号）が急に強くなり、ゆっくり元に戻ります。電線のループとサウンドカードがあれば十分で、天文クラブの定番の工作です。","n":"1 時間を 12 秒に短縮"},"qrn":{"nm":"雷の空電","sh":"QRN","t":"雷の空電（QRN）","h":"稲妻は一つひとつが、すべての周波数を同時に覆うとても強力な送信機です。中波や短波では数千 km 先の雷も聞こえ、夏と低い周波数帯でとくに目立ちます。","l":"全幅にわたる不規則な横線。耳には乾いたバリバリ音。ノイズブランカー（NB）は少し効き、ループアンテナはもっと効きます。"},"fading":{"nm":"選択性フェージング","sh":"QSB","t":"選択性フェージング（QSB）","h":"短波では、信号が電離層のいくつもの経路を通って届きます。周波数によって強め合ったり打ち消し合ったりするので、狭いへこみが信号の中を動き回ります。","l":"AM 局の中をゆっくり動く暗い部分。中央の搬送波にかかると、数秒間、音がしゃがれて歪みます。同期検波や SSB での受信で直せます。"},"plc":{"nm":"PLC（電力線通信）","sh":"2–30 MHz","t":"PLC：コンセントを使うインターネット","h":"PLC アダプターは、2〜30 MHz（新しい機種ではもっと上まで）の数百本の搬送波を 24.4 kHz 間隔で使い、家の電線でデータを送ります。電線がアンテナのように電波を出します。","l":"規則的な線の櫛がパケットごとに明滅し、アマチュアバンドには切れ目（規格で決められたノッチ）があります。耳には、通信量に合わせて変わるバリバリ音（シート 43）。","n":"縮小表示"},"fence":{"nm":"電気柵","sh":"カチ…カチ…","t":"電気柵","h":"電気柵の電源装置は、およそ 1 秒に 1 回、数千ボルトのパルスを線に送ります。草が線に触れていたり碍子が傷んでいたりすると火花が飛び、あらゆる周波数に電波を出します。","l":"全幅にわたるとても細い横線が、完全に一定の間隔で現れます。長波から VHF まで聞こえる「カチ…カチ…」。規則正しいリズムで雷と区別できます。"},"gsm":{"nm":"GSM 携帯電話","sh":"217 Hz","t":"スピーカーのそばの GSM 携帯電話","h":"2G の携帯電話は 0.577 ms のバーストを毎秒 217 回送信します。シールドの甘いオーディオアンプがこのバーストを検波し、音にしてしまいます。","l":"217 Hz ごとの線の櫛。着信の直前に聞こえるあの「ジジッ・ジジジ」と、通話中の連続したブーン音。2G 網の停波が進み、だんだん聞かれなくなっています。"},"jjy":{"nm":"JJY","sh":"40 / 60 kHz","t":"標準電波 JJY（日本、40 kHz・60 kHz）","h":"毎秒の初めに搬送波を全出力で 0.8 秒（ビット 0）、0.5 秒（ビット 1）、または 0.2 秒（マーカー）送り、そのあと 10 % に下げます。秒の初めに下げる DCF77 とは逆です。","l":"毎秒の終わりに、早めか遅めに弱くなる固定の線。おおたかどや山（福島、40 kHz）とはがね山（佐賀・福岡、60 kHz）の送信所から、日本の電波時計向けに送られています。"},"rwm":{"nm":"RWM","sh":"4996 kHz","t":"標準電波 RWM（モスクワ）","h":"4996、9996、14996 kHz の電信で、毎秒 100 ms のパルスを送り、別の分には毎秒 10 回のパルスを送ります。コールサイン RWM は 1 時間に 2 回モールスで送られます。","l":"コールサインのあと、規則的な「チッ」に刻まれた線、続いて速い点の列。CW か SSB で聞きます。","n":"短縮した抜粋"},"bpm":{"nm":"BPM","sh":"2.5–15 MHz","t":"標準電波 BPM（中国）","h":"陝西省蒲城の局が 2.5、5、10、15 MHz の AM で送信します。毎秒 1000 Hz・10 ms の秒信号（毎正分は 300 ms）、特定の分には UT1 用の 100 ms の秒信号。コールサイン BPM はモールスと音声で送られます。","l":"復調した音では、コールサインのあと、1000 Hz のごく短い線が毎秒一本、正分には長めの一本。同じ周波数の WWV と混ざって聞こえることがよくあります。","n":"短縮した抜粋"},"humpback":{"nm":"ザトウクジラ","sh":"歌","t":"ザトウクジラの歌","h":"冬の繁殖海域でオスは歌います。うめき声、うなり声、叫び声が連なって一つのテーマとなり、何時間も同じように繰り返され、季節ごとに変わっていきます。ハイドロフォンには数十キロ先から届きます。","l":"倍音を伴った太い線が、100 Hz から数 kHz の間でゆっくり上下します。数秒後に同じ流れが戻ってきます。海面と海底からのエコーが一つ一つの音を長く引き延ばします。"},"bluewhale":{"nm":"シロナガスクジラ","sh":"×10","t":"シロナガスクジラ：最も低い声","h":"地球最大の動物は、非常に低く（10〜40 Hz）非常に強い声を、10〜20 秒ずつ何時間も繰り返します。声は数百キロ先まで届きます。耳で聞けるように、録音を 10 倍速にしています。","l":"パルス状の部分のあと、ほとんど下がらない長い音が続き、その上に倍音が並びます。この流れが繰り返されます。目盛りは本当の周波数です。","n":"10 倍速"},"finwhale":{"nm":"ナガスクジラ","sh":"20 Hz","t":"ナガスクジラ：20 Hz のパルス","h":"ナガスクジラは約 25 Hz から 18 Hz へ下がる 1 秒ほどのパルスを、一定の間隔で、ときには何日も出し続けます。1950〜60 年代、この「20 Hz 信号」は米海軍の聴音網を悩ませ、のちにこのクジラの声と分かりました。","l":"同じ形の短い線が、規則正しい列や 2 つ組で並びます。とてもゆっくりした心臓の鼓動のようです。一つ一つは周波数がわずかに下がります。目盛りは本当の周波数です。","n":"10 倍速"},"sperm":{"nm":"マッコウクジラ","sh":"クリック","t":"マッコウクジラのクリック音","h":"マッコウクジラは深く潜ってソナーで狩りをします。とても強いクリック音を 1 秒に 1 回ほど出し、獲物に近づくと「きしみ音」へと速くなります。仲間どうしでは「コーダ」と呼ばれる短いクリックの連なりを交わし、そのリズムは群れ（クラン）ごとに違います。","l":"幅いっぱいの横線が等間隔に並び、やがて詰まってブーンという音（きしみ音）になり、最後に小さなリズムの模様、コーダが現れます。一つのクリックは、頭の中での反射による、近接した数個のパルスでできています。"},"dolphin":{"nm":"ハンドウイルカ","sh":"ホイッスル","t":"イルカのホイッスルとクリック","h":"ハンドウイルカはおよそ 5〜20 kHz で鳴きます。一頭ごとに名前の役目をする「シグネチャーホイッスル」を持っています。狩りや方向を知るために、とても短いクリックを 1 秒に数百回まで連続して出します。","l":"上がっては下がる細い曲線がしばしば同じ形で繰り返され、エコーロケーションでは横線がまとまって現れます。聞こえるように周波数を 3 分の 1 にしています。目盛りは本当の値です。","n":"3 分の 1 の高さで再生"},"orca":{"nm":"シャチ","sh":"パルス音","t":"シャチのパルス・コール","h":"シャチはパルス・コールで会話します。パルスがとても速い（毎秒 500〜2000 回）ので一つの音に聞こえ、高さが急に跳びます。家族の群れごとに独自の「方言」があります。","l":"平行な線（倍音）の束がそろって上下し、コールの途中ではっきり折れ曲がります。ときどき、より高い細いホイッスルも入ります。"},"bseal":{"nm":"アゴヒゲアザラシ","sh":"トリル","t":"アゴヒゲアザラシのトリル","h":"春、北極の海氷の下で、オスは数 kHz から数百ヘルツまでらせんを描くように下がっていく長いトリルを、ときには 1 分も続けて出します。なわばりを守り、メスを引きつけるためです。","l":"波打つ曲線が、ほどけていくばねのように目盛りの上から下へ滑り降り、最後に低い音が続きます。","n":"短縮"},"shrimp":{"nm":"テッポウエビ","sh":"サンゴ礁","t":"テッポウエビ","h":"大きなはさみを勢いよく閉じると、水の噴流が速すぎてキャビテーションの泡ができ、泡がつぶれるときに銃声のような音がします。何千匹ものエビがサンゴ礁の背景音をつくり、ソナーの妨げになることもあります。","l":"点と短い横線が、何の規則もなく幅いっぱいに雨のように散らばります。ヘッドホンでは、揚げ物のようなパチパチ音が絶えず聞こえます。"},"sonar":{"nm":"アクティブ・ソナー","sh":"ピン","t":"アクティブ・ソナーのピン","h":"艦船は強い音のパルス（ここでは約 3.5 kHz、フリゲートの船体ソナーの帯域）を出し、エコーを聞きます。遅れから距離が、周波数のずれ（ドップラー効果）から目標の速さが分かります。音は海底や海面からも尾を引いて戻ってきます。これが残響です。","l":"短く強い線、消えていく尾、そしてずっと弱く、周波数が少しずれたエコー。2 回目のピンは周波数を掃引するチャープで、距離をより正確に測れます。"},"propeller":{"nm":"船のスクリュー","sh":"キャビテーション","t":"通り過ぎる船のスクリュー","h":"スクリューの羽根がキャビテーションの泡をつくり、泡がはじけます。羽根が通るリズムで脈打つ広い帯域のザーッという音です。機関が一定の線を加えます。ソナー員はこのリズムを解析し（DEMON 解析）、羽根の枚数と回転数を数えて船を識別します。","l":"広い帯域のノイズに、羽根のリズムで横じまが入り、いくつかの一定の縦線（エンジン、減速機）があります。船がハイドロフォンの上を通ると、全体が強くなってから消えていきます。"},"uqc":{"nm":"水中電話","sh":"UQC 8 kHz","t":"水中電話（UQC、「ガートルード」）","h":"潜水艦や艦船は音響式の電話で水中で話します。声は 8.0875 kHz の搬送波の上に単側波帯で乗せられ、船体の送受波器から出されます。届く距離は数キロです。","l":"8 kHz より上の SSB の声の帯域。復調すると、海面と海底のエコーのせいで揺れて響く、遠い声が聞こえます。表示は半分に縮めています。目盛りは本当の周波数です。","n":"目盛り 2 分の 1"},"zevs":{"nm":"ZEVS 82 Hz","sh":"ELF","t":"ZEVS：82 Hz の潜水艦向け無線","h":"電波は海水にほとんど入りませんが、極超長波（ELF）だけは別です。コラ半島にあるロシアの送信所 ZEVS は、長さ数十キロのアンテナ線を使って 82 Hz で送信し、深く潜った潜水艦に届けます。速度はごくわずかで、1 分間に数文字です。","l":"50 Hz の電源ハムとその倍音の横に、82 Hz の細い線が 1 本。雷による雑音も入ります。ヘッドホンではやっと聞こえる低いうなりです。大きなループアンテナとサウンドカードで受信できます。アメリカの同様のシステム（76 Hz）は 2004 年に廃止されました。"},"bloop":{"nm":"「ブループ」","sh":"1997","t":"「ブループ」（1997 年）","h":"1997 年、太平洋の NOAA のハイドロフォンが、急に高くなっていくとても低い音をとらえました。数千キロ先でも聞こえました。長いあいだ謎でしたが、2012 年からは氷震、つまり巨大な氷山が割れる音とされています。","l":"広い帯域が倍音とともに数秒で上がり、ゆっくり消えていきます。NOAA が公開した録音と同じく 16 倍速にした再現です。","n":"16 倍速"}}}};

function setOdo(el,value){ // chaque chiffre est un rouleau 0-9 (répété) qui tourne toujours vers l'avant
