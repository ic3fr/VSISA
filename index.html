<style>
/* Layout : un panneau de récepteur. Liste des signaux à gauche, spectre + waterfall en direct au centre, empreinte + fiche en dessous. */
:root{
  --bg:#10141b; --panel:#171e28; --panel-2:#1d2633; --line:#2b3746;
  --fg:#e1e7ef; --muted:#8d9bad; --accent:#f2b544; --accent-ink:#1a1408;
  --ok:#5fcf8f; --bad:#ef6b6b;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
h1 small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.btn{font:500 .9rem var(--f-body);border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:6px;padding:8px 14px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--muted)}
.hdr-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.langlbl{display:flex;align-items:center;gap:8px;font:400 .8rem var(--f-mono);color:var(--muted)}
select{font:500 .9rem var(--f-body);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:38px;cursor:pointer}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:focus-visible,.mode:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;padding-right:4px}
@media (max-width:820px){.grid{grid-template-columns:1fr}aside{position:static;max-height:none;overflow:visible}}
.count{font:400 .75rem var(--f-mono);color:var(--muted);margin:0}
.group h2{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){.group ul{flex-direction:row;flex-wrap:wrap}}
.mode{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:baseline;font:500 .9rem var(--f-body);color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 10px;cursor:pointer}
.mode span{font:400 .72rem var(--f-mono);color:var(--muted);white-space:nowrap}
.mode:hover{background:var(--panel)}
.mode[aria-pressed="true"]{background:var(--panel-2);border-color:var(--accent)}
.mode[aria-pressed="true"] span{color:var(--accent)}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.now{min-width:0}
.now h2{font-family:var(--f-display);font-weight:700;font-size:1.9rem;margin:0;line-height:1.1;text-wrap:balance}
.now p{margin:0;color:var(--muted);font-family:var(--f-mono);font-size:.8rem}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.controls label{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:110px}
input[type=checkbox]{accent-color:var(--accent)}
.screen{background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.screen-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);font:400 .74rem var(--f-mono);color:var(--muted);letter-spacing:.04em}
.screen-head b{color:var(--fg);font-weight:500;text-transform:uppercase;letter-spacing:.1em}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:crosshair}
.ruler{position:relative;height:22px;background:var(--panel);border-top:1px solid var(--line);font:400 .7rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden}
.ruler span{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
.ruler span::before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:4px;background:var(--muted)}
.ruler span.first{transform:none}.ruler span.first::before{left:0}
.ruler span.last{transform:translateX(-100%)}.ruler span.last::before{left:auto;right:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
.card h3{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0 0 4px;text-wrap:balance}
.card .lead{margin:0 0 12px;color:var(--fg);max-width:62ch}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:.9rem}
dt{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:3px}
dd{margin:0;min-width:0}
.ref{display:inline-block;margin-top:12px;font:500 .75rem var(--f-mono);color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.quiz{display:flex;flex-direction:column;gap:10px}
.quiz .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quiz .msg{font-weight:600}
.quiz .msg.ok{color:var(--ok)}.quiz .msg.bad{color:var(--bad)}
.score{font:500 .8rem var(--f-mono);color:var(--muted)}
.readout{font-variant-numeric:tabular-nums;color:var(--accent)}
footer{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
footer p{margin:0;max-width:110ch}
</style>

<div class="wrap">
  <header>
    <h1><small>VSISA · Virtual Simulator identification Signal Audio · OpenBookRadio</small><span id="tTitle">Identificateur de modes radio</span></h1>
    <div class="hdr-ctl">
      <label class="langlbl" for="lang"><span id="tLang">Langue</span>
        <select id="lang"></select></label>
      <button class="btn" id="mystery" type="button">Son mystère</button>
    </div>
  </header>

  <div class="grid">
    <aside id="modes" aria-label="Signaux"></aside>

    <main>
      <div class="bar">
        <div class="now">
          <h2 id="nowName">—</h2>
          <p id="nowTags">—</p>
        </div>
        <div class="controls">
          <button class="btn primary" id="play" type="button">▶ Écouter</button>
          <button class="btn" id="stop" type="button">■ Stop</button>
          <label for="noise"><span id="tNoise">Bruit</span> <input type="range" id="noise" min="0" max="100" value="15"></label>
          <label for="vol"><span id="tVol">Volume</span> <input type="range" id="vol" min="0" max="100" value="55"></label>
          <label for="loop"><input type="checkbox" id="loop" checked> <span id="tLoop">En boucle</span></label>
        </div>
      </div>

      <section class="screen" aria-label="Spectre et waterfall en direct">
        <div class="screen-head"><b id="tSpecwf">Spectre + Waterfall</b><span><span id="spanLbl">—</span> · <span id="tCursor">curseur</span> <span class="readout" id="ro1">—</span></span></div>
        <canvas id="sp" width="600" height="140" style="border-bottom:1px solid var(--line)"></canvas>
        <canvas id="wf" width="600" height="240"></canvas>
        <div class="ruler" id="ruler1"></div>
      </section>

      <div class="two">
        <section class="screen" aria-label="Empreinte du signal">
          <div class="screen-head"><b id="tFoot">Empreinte</b><span id="dur">—</span></div>
          <canvas id="fp" width="600" height="300"></canvas>
          <div class="ruler" id="ruler2"></div>
        </section>
        <section class="card" id="info" aria-live="polite"></section>
      </div>
    </main>
  </div>

  <footer>
    <p id="tF1"></p>
    <p id="tF2"></p>
  </footer>
</div>

ès le récepteur FM (son du haut-parleur) : une bande de 1200 à 2200 Hz, en salves courtes. À l'oreille, un « grrrt » d'une seconde (fiches 29 et 30).","r":[["Fréquence","144,800 MHz en Europe (APRS), FM"],["Trame","Drapeaux 0x7E puis données AX.25 en NRZI"],["Décodage","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"nm":"PSK31","sh":"BPSK","t":"PSK31 : modulation de phase","h":"La fréquence ne bouge pas, c'est la phase qui s'inverse ; l'amplitude se creuse à chaque inversion.","l":"Un trait très fin d'environ 60 Hz, un peu « tressé ». Des dizaines de stations tiennent dans 3 kHz (fiche 26).","r":[["Code","Varicode : 0 = inversion de phase, 1 = pas de changement ; au repos, deux traits jumeaux"],["Où l'entendre","14 070 kHz, 3 580 kHz"],["Décodage","fldigi"]]},"ft8":{"nm":"FT8","sh":"8-FSK","t":"MFSK / FT8 : huit tonalités","h":"La fréquence monte et descend par marches de 6,25 Hz, 0,16 s par marche.","l":"Des bandes d'environ 50 Hz qui durent 12,6 s et reviennent toutes les 15 s, calées sur l'heure : plusieurs stations à la fois dans 3 kHz, par exemple sur 7,074 MHz (fiche 26).","r":[["Trame","79 symboles de 0,16 s, trois motifs Costas (début, milieu, fin) ; ici huit stations"],["Fréquences","14 074, 7 074, 3 573, 10 136, 21 074, 28 074 kHz"],["Décodage","WSJT-X, JTDX (heure du PC exacte)"]]},"ft4":{"nm":"FT4","sh":"4-FSK","t":"FT4 : le FT8 des concours","h":"Quatre tonalités espacées de 20,8 Hz, 20,8 bauds : 105 symboles en 5 s, calés sur des tranches de 7,5 s.","l":"Des bandes d'environ 90 Hz, plus courtes et plus larges que le FT8, qui reviennent toutes les 7,5 s. 14 080, 7 047,5 kHz (fiche 26)."},"olivia":{"nm":"Olivia 8/250","sh":"MFSK","t":"Olivia 8/250 : huit tonalités","h":"Huit tonalités espacées de 31,25 Hz, une seule à la fois, qui sautent au hasard ; codage Walsh et entrelacement.","l":"Un bloc de points dispersés sur 250 Hz ; décode très en dessous du bruit. Une petite mélodie aléatoire à l'oreille (fiche 26)."},"hell":{"nm":"Feld Hell","sh":"OOK","t":"Feld Hell : écrire avec une porteuse","h":"La porteuse est allumée et éteinte point par point : chaque lettre est une colonne de 14 points, balayée de bas en haut (245 points par seconde).","l":"Sur le waterfall, un trait haché ; c'est l'écran du logiciel (fldigi) qui redessine les lettres. Un crépitement doux à l'oreille (fiche 26)."},"4fsk":{"nm":"DMR / C4FM","sh":"4FSK","t":"4FSK : DMR, C4FM (Fusion), NXDN, dPMR","h":"Quatre niveaux de fréquence : chaque symbole porte deux bits.","l":"Un bloc rectangulaire de 6 à 12,5 kHz, plein comme du bruit, souvent en salves (le DMR partage le canal en deux créneaux). Un « frrr » rauque à l'oreille (fiche 38)."},"mt63":{"nm":"MT63","sh":"NBEMS","t":"MT63 : messages d'urgence (NBEMS)","h":"64 tonalités à la fois, chacune modulée lentement, avec beaucoup de redondance.","l":"Un bloc plat de 1 ou 2 kHz centré sur 1500 Hz, avec des bords nets ; un souffle régulier. Passe même par un micro collé à un haut-parleur (fiche 26 ter)."},"lora":{"nm":"LoRa","sh":"chirps","t":"LoRa : rampes de fréquence (chirps)","h":"La fréquence balaie toute la largeur, puis repart du bas : la position du saut porte les données.","l":"Des diagonales parallèles, faciles à reconnaître : Meshtastic et MeshCore sur 869,525 MHz ou 433 MHz, capteurs LoRaWAN (fiches 11, 20 et 21)."},"sstv":{"nm":"SSTV Martin M1","sh":"VIS 44","t":"SSTV : images en audio","h":"Un top de synchro à 1200 Hz, puis la fréquence suit la luminosité de la ligne, de 1500 (noir) à 2300 Hz (blanc).","l":"Des traits de synchro réguliers et un nuage qui varie avec l'image ; un son qui « gazouille » pendant une à deux minutes. 14,230 MHz, ISS sur 145,800 MHz (fiche 31).","r":[["Trame","En-tête VIS, puis lignes : synchro 1200 Hz, vert, bleu, rouge ; ici 20 lignes d'une mire"],["Décodage","QSSTV, MMSSTV, Robot36 sur smartphone"]]},"fax":{"nm":"Fax météo","sh":"120 lpm","t":"Fax météo : 1500 Hz noir, 2300 Hz blanc","h":"La fréquence passe du noir au blanc en continu, 120 lignes par minute.","l":"Deux bandes fixes à 1500 et 2300 Hz (800 Hz d'écart), un « tic-tac » régulier. Les fréquences publiées sont celles de la porteuse : écoute en USB 1,9 kHz plus bas (fiche 32).","r":[["Trame","Ton de démarrage 300 Hz, lignes de phasage (impulsion blanche), puis la carte"],["Décodage","fldigi, JWX, HamFax"]]},"elt":{"nm":"Sirène ELT","sh":"121,5 MHz","t":"Sirène ELT / PLB sur 121,5 MHz","h":"Une AM dont la tonalité descend de 1600 à 300 Hz, deux à quatre fois par seconde.","l":"Une porteuse fixe et des bandes latérales qui glissent en éventail : le « wou-wou » des balises de détresse, aussi sur 121,375 MHz pour les exercices (fiches 24 et 25)."},"adsb":{"nm":"ADS-B","sh":"1090 MHz","t":"ADS-B / mode S (1090 MHz) : impulsions","h":"Des impulsions de 0,5 µs dont la position porte les bits (PPM) ; ici l'échelle de temps est très ralentie.","l":"Des traits horizontaux très courts sur toute la largeur, des centaines par seconde près d'un aéroport ; il faut une clé SDR (fiche 13).","n":"échelle de temps très ralentie"},"acars":{"nm":"ACARS","sh":"MSK","t":"ACARS : AM et données MSK","h":"Une AM qui transporte deux tonalités, 1200 et 2400 Hz, à 2400 bit/s.","l":"Des salves d'une demi-seconde avec porteuse et bandes latérales, sur 131,525, 131,725 ou 131,825 MHz en Europe : un « brrrt » à l'oreille (fiche 14)."},"ais":{"nm":"AIS","sh":"GMSK","t":"AIS : GMSK 9600 bauds sur deux canaux","h":"Une FSK adoucie (GMSK) en salves de 26 ms, une fois sur 161,975 MHz, une fois sur 162,025 MHz (échelle réduite).","l":"Deux colonnes de petits traits brefs, 50 kHz d'écart, un claquement régulier ; plus il y a de navires, plus c'est serré (fiche 16).","n":"échelle réduite"},"navtex":{"nm":"NAVTEX","sh":"518 kHz","t":"NAVTEX et ASN en ondes moyennes et courtes : FSK 170 Hz","h":"Comme le RTTY : deux fréquences à 170 Hz d'écart, mais à 100 bauds.","l":"Deux traits parallèles en continu pendant le bulletin, sur 518 et 490 kHz (NAVTEX) ou 2187,5 kHz (appel sélectif numérique) (fiche 17).","r":[["Code","SITOR-B, CCIR 476 : 7 bits dont quatre « 1 », avec répétition FEC"],["Décodage","fldigi, YaND"]]},"hfdl":{"nm":"HFDL","sh":"PSK 1800","t":"HFDL : les avions en ondes courtes","h":"Une PSK à 1800 bauds sur une sous-porteuse de 1440 Hz.","l":"Des salves d'environ 2,4 kHz entre 2,9 et 22 MHz ; un chuintement de modem qui part et revient (fiche 14 bis)."},"ctcss":{"nm":"CTCSS","sh":"88,5 Hz","t":"CTCSS : sous-ton sous la voix","h":"Une tonalité grave et continue (67 à 254 Hz, ici 88,5 Hz) ajoutée à la voix.","l":"Vu dans le son du récepteur FM : un trait fixe tout en bas, sous la voix ; il ouvre le squelch des relais et des talkies (fiche 8)."},"dtmf":{"nm":"DTMF","sh":"2 tons","t":"DTMF : deux tonalités par touche","h":"Chaque touche du clavier envoie une tonalité grave (697 à 941 Hz) et une aiguë (1209 à 1633 Hz) en même temps.","l":"Des paires de points alignés sur huit colonnes fixes ; le « bip-bip » des numéros de téléphone et des commandes de relais (fiche 8).","r":[["Séquence","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"nm":"Selcall CCIR","sh":"5 tons","t":"Selcall CCIR : tonalités en séquence","h":"Cinq tonalités de 100 ms l'une après l'autre, une par chiffre.","l":"Un petit escalier de points, répété ; un « tululululu » rapide pour appeler une radio précise (fiche 28).","r":[["Séquence","1 2 3 4 5, deux fois ; décodé aussi par l'app SelCall de l'UV-K1"]]},"pocsag":{"nm":"POCSAG / FLEX","sh":"bipeurs","t":"POCSAG et FLEX : bipeurs","h":"Une FSK à ±4,5 kHz ; un préambule 1010… puis les données (échelle réduite).","l":"Deux traits nets pendant le préambule, puis une bande pleine ; un « brrrrt » strident. 466,075 MHz, DAPNET 439,9875 MHz (fiche 37).","n":"échelle réduite"},"ale":{"nm":"ALE","sh":"8 tons","t":"ALE : l'appel automatique en ondes courtes","h":"Huit tonalités de 750 à 2500 Hz, 125 bauds, en rafales.","l":"Un bloc d'environ 2 kHz fait de petits points, une à deux secondes, parfois sur plusieurs fréquences voisines ; un gazouillis aigu (fiche 28 bis)."},"rs41":{"nm":"Radiosonde RS41","sh":"GFSK","t":"Radiosonde RS41 : GFSK en continu","h":"Une FSK adoucie à 4800 bauds, sans arrêt ; la fréquence dérive lentement quand la sonde monte et se refroidit.","l":"Une bande d'environ 10 kHz qui glisse en biais pendant tout le vol, entre 400 et 406 MHz (fiche 18)."},"ook":{"nm":"Capteurs 433","sh":"OOK","t":"Capteurs 433 MHz : OOK","h":"La porteuse s'allume et s'éteint en impulsions courtes ou longues (tout ou rien) ; le message est répété trois fois.","l":"Des rafales de petits points, souvent en triple, sur 433,92 MHz : stations météo, sondes de température, télécommandes (fiche 19)."},"fhss":{"nm":"Bluetooth","sh":"FHSS","t":"Bluetooth : sauts de fréquence (FHSS)","h":"La fréquence change 1600 fois par seconde parmi 79 canaux (échelle réduite).","l":"De petits traits éparpillés partout sur 80 MHz de large, jamais au même endroit, vers 2,4 GHz (fiche 22).","n":"échelle réduite"},"wspr":{"nm":"WSPR","sh":"4-FSK","t":"WSPR : balises de propagation","h":"Quatre tonalités espacées de 1,46 Hz, 0,68 s par symbole, pendant 110,6 s.","l":"Un trait très fin d'environ 6 Hz qui dure presque deux minutes, toutes les deux minutes paires : il faut zoomer très fort (fiche 26).","n":"extrait de 24 s (une émission dure 110,6 s)"},"qrss":{"nm":"QRSS","sh":"DFCW","t":"QRSS : Morse très lent","h":"Une porteuse allumée et éteinte, avec des points de 3 à 10 s, souvent sur deux fréquences voisines (DFCW).","l":"Des traits de quelques Hz de large qu'on lit sur un écran de dix minutes ; inaudible à l'oreille (fiche 26 bis).","n":"accéléré : point de 0,6 s au lieu de 3 à 10 s"},"texte":{"nm":"Texte dans le waterfall","sh":"image","t":"Texte dans le waterfall","h":"Chaque ligne d'une image devient un groupe de tonalités : le son ressemble à du bruit.","l":"Le texte ou le dessin apparaît directement sur l'écran du SDR (fiche 33).","r":[["Note","Émis par le bas de l'image : à l'endroit sur le waterfall en direct, à l'envers dans l'empreinte (lue de haut en bas)"]]},"vara":{"nm":"VARA / Pactor","sh":"OFDM","t":"Données HF modernes : VARA, Pactor, ARDOP","h":"De longues salves pleines (OFDM ou PSK) et, entre deux, de courtes réponses de l'autre station.","l":"Un rectangle d'environ 2,4 kHz qui s'arrête et repart, avec un petit accusé de réception au milieu ; un chuintement haché (fiche 26)."},"chirp":{"nm":"Sondeur ionosphérique","sh":"chirp","t":"Sondeur ionosphérique (chirp sounder)","h":"Une rampe de fréquence lente qui traverse toute la bande HF ; les échos de l'ionosphère arrivent un peu plus tard.","l":"Une diagonale qui balaie l'écran, doublée de traits parallèles (les échos) ; un « ffuit » qui passe en une fraction de seconde."},"oth":{"nm":"Radar transhorizon","sh":"woodpecker","t":"Radar transhorizon (« woodpecker »)","h":"Des impulsions répétées 10 à 50 fois par seconde, chacune large de plusieurs kHz.","l":"Un bloc large strié, qui couvre des bandes entières ; un claquement de pic-vert très régulier en ondes courtes."},"parasites":{"nm":"Parasites","sh":"alimentation","t":"Parasites d'une alimentation à découpage","h":"Un signal carré : sa fréquence et toutes ses harmoniques sortent en même temps.","l":"Un peigne de raies régulières qui dérivent ensemble, sur un fond de bruit : à chercher avec NOISE FIND ou un récepteur portable (fiche K21b)."},"mpx":{"nm":"FM stéréo et RDS","sh":"MPX","t":"Radio FM stéréo et RDS","h":"Le son démodulé (multiplex) contient la voie L+R, un pilote à 19 kHz, la voie L-R autour de 38 kHz et le RDS à 57 kHz.","l":"Vu sur 0 à 60 kHz après la démodulation : un bloc grave, un trait fin à 19 kHz, un bloc plus faible au milieu et le RDS tout en haut (fiche 10).","n":"échelle ÷ 20 pour l'écoute"},"dcf77":{"nm":"DCF77","sh":"77,5 kHz","t":"Signal horaire DCF77 (77,5 kHz)","h":"Une porteuse qui baisse à 15 % pendant 0,1 s (bit 0) ou 0,2 s (bit 1), au début de chaque seconde.","l":"Un trait fixe avec une coupure noire chaque seconde ; la 59e seconde n'en a pas, pour marquer la minute (fiche 10).","r":[["Note","Ici la porteuse est ramenée à 1000 Hz ; la 6e seconde n'a pas de coupure, comme la 59e seconde de chaque minute"]]},"ofdm":{"nm":"OFDM","sh":"DRM, DAB+","t":"OFDM : des dizaines de sous-porteuses","h":"Beaucoup de porteuses très serrées, chacune lente : la somme ressemble à du bruit.","l":"Un rectangle plat aux bords nets, toujours là : DRM en ondes courtes (10 kHz), DAB+ (1,5 MHz), TNT, Wi-Fi. Un souffle continu à l'oreille (fiches 10 et 22)."},"dsss":{"nm":"DSSS","sh":"GPS, Wi-Fi","t":"Étalement de spectre (DSSS) : GPS, Wi-Fi 802.11b","h":"Les données sont mélangées à un code très rapide : l'énergie s'étale sur une grande largeur.","l":"Une bosse large, à peine au-dessus du bruit ; le GPS est même sous le bruit et ne se voit pas sans traitement (fiches 22 et 23)."},"hline":{"nm":"Raie de l'hydrogène","sh":"1420 MHz","t":"Raie de l'hydrogène à 21 cm (1420,405 MHz)","h":"L'hydrogène froid de la Voie lactée émet un souffle très faible sur 1420,405 MHz. Le mouvement des bras de la galaxie le décale par effet Doppler : on voit plusieurs petites bosses.","l":"Presque rien dans le waterfall d'une seconde à l'autre : il faut moyenner longtemps pour voir les bosses sortir du bruit. Ici, regarde le spectre moyen à l'arrêt. Une parabole ou un cornet, un préampli et une clé SDR suffisent.","n":"signal très exagéré"},"sun":{"nm":"Soleil","sh":"sursauts","t":"Soleil : sursauts radio de type III","h":"Des électrons lancés par une éruption traversent la couronne du Soleil et la font émettre de plus en plus bas en fréquence à mesure qu'ils s'éloignent.","l":"Des traits qui tombent en diagonale du haut vers le bas du spectre en moins d'une seconde, sur un fond de bruit solaire ; un « chhhh » qui enfle. De 10 à 400 MHz environ, aussi en ondes courtes vers 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter : sursauts décamétriques (L et S)","h":"Le champ magnétique de Jupiter et sa lune Io produisent des émissions puissantes entre 15 et 40 MHz : des sursauts L lents et des sursauts S très courts qui glissent vite vers le bas.","l":"D'abord des vagues de souffle (L, comme le ressac), puis des salves de petits « pops » (S) en diagonales serrées. Vers 20,1 MHz la nuit, avec un simple dipôle, quand Io est bien placée."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"Une étoile à neutrons qui tourne sur elle-même balaie la Terre d'un faisceau radio, ici toutes les 0,714 s. Le gaz interstellaire retarde les basses fréquences : chaque impulsion arrive d'abord en haut du spectre.","l":"Un « tic » régulier ; dans le waterfall, chaque impulsion est une courbe qui descend (la dispersion). Le vrai signal est sous le bruit : il faut une grande antenne et additionner les impulsions sur leur période.","n":"signal très exagéré"},"meteor":{"nm":"Météores","sh":"GRAVES","t":"Échos de météores sur le radar GRAVES (143,050 MHz)","h":"Le radar français GRAVES émet sans arrêt sur 143,050 MHz. Quand une étoile filante ionise l'air, sa traînée renvoie un peu de ce signal vers ton récepteur, pendant une fraction de seconde à quelques secondes.","l":"En USB sur 143,049 MHz : des « ping » brefs vers 1000 Hz, parfois un écho qui glisse (la tête du météore, effet Doppler) ou qui dure. Bien plus nombreux pendant les essaims (Perséides, Géminides) (fiche 1)."},"whistler":{"nm":"Sifflements","sh":"VLF","t":"Sifflements VLF (whistlers)","h":"Un éclair crée un claquement radio ; une partie suit les lignes du champ magnétique terrestre jusqu'à l'autre hémisphère et revient, les aigus en premier.","l":"Un « tiouuu » qui descend de l'aigu au grave en une ou deux secondes, juste après un claquement ; des craquements (sferics) partout. Sous 10 kHz, avec un récepteur VLF loin des lignes électriques."},"chorus":{"nm":"Chœur de l'aube","sh":"VLF","t":"Chœur de l'aube (dawn chorus)","h":"Pendant un orage magnétique, des électrons piégés dans la magnétosphère émettent de petites notes montantes, surtout au lever du jour.","l":"Des gazouillis montants qui se chevauchent, comme des oiseaux, de 1 à 4 kHz environ. Même matériel que pour les sifflements."},"sputnik":{"nm":"Spoutnik 1","sh":"1957","t":"Spoutnik 1 (1957)","h":"Le premier satellite artificiel émettait des bips d'environ 0,3 s sur 20,005 et 40,002 MHz, en alternance, pendant trois semaines.","l":"Un trait coupé régulièrement : « bip… bip… », le son écouté dans le monde entier en octobre 1957 (reconstitution)."},"doppler":{"nm":"Effet Doppler","sh":"satellite","t":"Balise de satellite et effet Doppler","h":"Un satellite en orbite basse s'approche puis s'éloigne : la fréquence reçue baisse pendant le passage, d'environ ±3 kHz à 145 MHz et ±10 kHz à 435 MHz.","l":"Un trait qui descend en forme de S : lentement au début, vite quand le satellite passe au plus près, puis de nouveau lentement (fiche 34).","n":"passage de 10 min ramené à 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satellites NOAA : images APT (historique)","h":"Une sous-porteuse de 2400 Hz modulée en amplitude par l'image, deux lignes par seconde, avec un top de synchro au début de chaque ligne. Arrêté en 2025 ; les Meteor-M émettent aujourd'hui en LRPT.","l":"Un trait à 2400 Hz avec des bandes latérales qui changent avec l'image, et le fameux « tic-tac » deux fois par seconde (fiche 34)."},"eme":{"nm":"Écho de la Lune","sh":"EME","t":"Écho de la Lune (EME)","h":"Un signal envoyé vers la Lune revient environ 2,5 s plus tard, énormément affaibli, un peu élargi et décalé par le Doppler.","l":"On entend son propre « bip », puis son écho faible et un peu flou 2,5 s après. Les radioamateurs le font en CW ou en JT65, sur 144 MHz et plus (fiche 1).","n":"écho très exagéré"}}},"en":{"ui":{"title":"Radio Mode Identifier","mystery":"Mystery sound","play":"▶ Listen","stop":"■ Stop","noise":"Noise","volume":"Volume","loop":"Loop","specwf":"Spectrum + Waterfall","cursor":"cursor","footprint":"Footprint","dur":"{s} s from top to bottom","avg":"average over the whole signal","press":"Press Listen: the signal scrolls here","count":"{n} signals, in the order of sheet 5 bis","myst":"Mystery mode","mystTags":"Listen and watch, then pick the right answer","quizH":"Which signal is this?","quizLead":"Start listening, watch the spectrum, the waterfall and the footprint, then answer.","score":"Score","good":"Correct!","bad":"Missed: it was {x}.","next":"Next mystery sound","principle":"Principle","screen":"On screen","sheet":"sheet","book":"Book: sheet {r}","lang":"Language","signals":"Signals","f1":"Signals simulated in the page (12,000 samples per second), based on the signals of sheet 5 bis of the OpenBookRadio book, plus Olivia, FT4 and Feld Hell (sheet 26). For radio signals (AM, FM, AIS, LoRa…), you see the simulated intermediate frequency, as on an SDR screen; some are scaled down or sped up, as stated.","f2":"Time runs downwards in the waterfall and the footprint. CC BY-NC-SA 4.0 license, free, not for sale."},"groups":["Analogue voice","Telegraphy","Data","Images","Aviation, maritime and rescue","Calling, sub-tones and paging","Radiosondes, sensors and connected devices","HF modes and curiosities","Broadcast and time","Wideband","Bonus: sounds from space"],"modes":{"am":{"sh":"voice","t":"AM: amplitude modulation","h":"The strength of the carrier follows the sound: the curve \"swells\" and \"shrinks\".","l":"A fixed line in the centre (the carrier), with two identical sidebands on each side. About 6 to 9 kHz wide. Shortwave and medium-wave broadcasting, aviation (sheets 10 and 12)."},"ssb":{"nm":"SSB","t":"SSB: single sideband","h":"Only one sideband remains, without carrier: nothing when nobody speaks.","l":"No central line, a single band about 2.7 kHz wide that only lives while someone talks. USB above 10 MHz, LSB below (radio amateurs). Badly tuned, the voice sounds like a \"duck\" (sheets 9 and 26)."},"fm":{"sh":"voice","t":"FM: frequency modulation","h":"The amplitude stays fixed; the oscillations get closer or wider apart with the sound.","l":"The signal dances around its frequency, wider when the sound is loud: 12.5 kHz per channel in narrow FM (walkie-talkies, repeaters), 200 kHz for FM broadcasting (sheets 2 and 11)."},"cw":{"t":"CW: Morse","h":"The carrier is switched on and off: dashes and dots.","l":"A very thin line that breaks to the rhythm of Morse; a beep to the ear. Here \"CQ\" (sheet 39).","r":[["Speed","20 words/min, 60 ms dot, at 700 Hz: \"CQ CQ CQ DE F4ABC K\""],["By ear","Pure beeps, long and short, on a single note"],["Decoding","By ear, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: two frequencies","h":"The frequency jumps between two values, one for 0, one for 1.","l":"Two parallel lines: 170 Hz apart for radio amateurs (45.45 baud), 450 or 850 Hz for weather bulletins. A steady \"tidilidi\" (sheet 27).","r":[["Code","Baudot ITA2: 5 bits + start + 1.5 stop; mark 2125 Hz, space 2295 Hz"],["Text","RYRYRYRY CQ CQ DE F4ABC"],["Decoding","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 baud: APRS and packet","h":"Two audio tones, 1200 and 2200 Hz, sent into an FM transmitter.","l":"Seen after the FM receiver (loudspeaker sound): a band from 1200 to 2200 Hz, in short bursts. By ear, a one-second \"grrrt\" (sheets 29 and 30).","r":[["Frequency","144.800 MHz in Europe (APRS), FM"],["Frame","0x7E flags then AX.25 data in NRZI"],["Decoding","Direwolf, multimon-ng, KISS TNC"]]},"psk31":{"t":"PSK31: phase modulation","h":"The frequency does not move, the phase reverses; the amplitude dips at each reversal.","l":"A very thin line about 60 Hz wide, slightly \"braided\". Dozens of stations fit in 3 kHz (sheet 26).","r":[["Code","Varicode: 0 = phase reversal, 1 = no change; when idle, two twin lines"],["Where to hear it","14,070 kHz, 3,580 kHz"],["Decoding","fldigi"]]},"ft8":{"t":"MFSK / FT8: eight tones","h":"The frequency goes up and down in steps of 6.25 Hz, 0.16 s per step.","l":"Bands about 50 Hz wide lasting 12.6 s and coming back every 15 s, synchronised to the clock: several stations at once within 3 kHz, for example on 7.074 MHz (sheet 26).","r":[["Frame","79 symbols of 0.16 s, three Costas patterns (start, middle, end); here eight stations"],["Frequencies","14,074, 7,074, 3,573, 10,136, 21,074, 28,074 kHz"],["Decoding","WSJT-X, JTDX (exact PC clock)"]]},"ft4":{"t":"FT4: the contest FT8","h":"Four tones spaced 20.8 Hz, 20.8 baud: 105 symbols in 5 s, in 7.5 s time slots.","l":"Bands about 90 Hz wide, shorter and wider than FT8, coming back every 7.5 s. 14,080, 7,047.5 kHz (sheet 26)."},"olivia":{"t":"Olivia 8/250: eight tones","h":"Eight tones spaced 31.25 Hz, one at a time, jumping at random; Walsh coding and interleaving.","l":"A block of scattered dots over 250 Hz; decodes far below the noise. A small random melody to the ear (sheet 26)."},"hell":{"t":"Feld Hell: writing with a carrier","h":"The carrier is switched on and off dot by dot: each letter is made of columns of 14 dots, scanned from bottom to top (245 dots per second).","l":"On the waterfall, a chopped line; the software screen (fldigi) redraws the letters. A soft crackle to the ear (sheet 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Four frequency levels: each symbol carries two bits.","l":"A rectangular block 6 to 12.5 kHz wide, full like noise, often in bursts (DMR splits the channel into two time slots). A hoarse \"frrr\" to the ear (sheet 38)."},"mt63":{"t":"MT63: emergency messages (NBEMS)","h":"64 tones at once, each slowly modulated, with lots of redundancy.","l":"A flat block of 1 or 2 kHz centred on 1500 Hz, with sharp edges; a steady hiss. Even works through a microphone held to a loudspeaker (sheet 26 ter)."},"lora":{"t":"LoRa: frequency ramps (chirps)","h":"The frequency sweeps the whole width, then starts again from the bottom: the position of the jump carries the data.","l":"Parallel diagonals, easy to recognise: Meshtastic and MeshCore on 869.525 MHz or 433 MHz, LoRaWAN sensors (sheets 11, 20 and 21)."},"sstv":{"t":"SSTV: pictures in audio","h":"A sync pulse at 1200 Hz, then the frequency follows the brightness of the line, from 1500 (black) to 2300 Hz (white).","l":"Regular sync lines and a cloud that changes with the picture; a \"chirping\" sound for one to two minutes. 14.230 MHz, ISS on 145.800 MHz (sheet 31).","r":[["Frame","VIS header, then lines: 1200 Hz sync, green, blue, red; here 20 lines of a test pattern"],["Decoding","QSSTV, MMSSTV, Robot36 on a smartphone"]]},"fax":{"nm":"Weather fax","t":"Weather fax: 1500 Hz black, 2300 Hz white","h":"The frequency moves continuously from black to white, 120 lines per minute.","l":"Two fixed bands at 1500 and 2300 Hz (800 Hz apart), a steady \"tick-tock\". Published frequencies are carrier frequencies: listen in USB 1.9 kHz lower (sheet 32).","r":[["Frame","300 Hz start tone, phasing lines (white pulse), then the chart"],["Decoding","fldigi, JWX, HamFax"]]},"elt":{"nm":"ELT siren","t":"ELT / PLB siren on 121.5 MHz","h":"An AM signal whose tone falls from 1600 to 300 Hz, two to four times per second.","l":"A fixed carrier and sidebands sliding like a fan: the \"woo-woo\" of distress beacons, also on 121.375 MHz for exercises (sheets 24 and 25)."},"406":{"nm":"406 beacon","t":"406 MHz beacon: BPSK burst","h":"Half a second of transmission: 160 ms of pure carrier, then the phase swings by ±1.1 radian at 400 bit/s.","l":"A short little line coming back every 50 s, between 406.0 and 406.1 MHz; nothing useful to hear, a decoder is needed (EPIRB 406, sheet 25)."},"adsb":{"t":"ADS-B / Mode S (1090 MHz): pulses","h":"0.5 µs pulses whose position carries the bits (PPM); here the time scale is greatly slowed down.","l":"Very short horizontal lines across the whole width, hundreds per second near an airport; an SDR dongle is needed (sheet 13).","n":"time scale greatly slowed down"},"acars":{"t":"ACARS: AM and MSK data","h":"An AM signal carrying two tones, 1200 and 2400 Hz, at 2400 bit/s.","l":"Half-second bursts with carrier and sidebands, on 131.525, 131.725 or 131.825 MHz in Europe: a \"brrrt\" to the ear (sheet 14)."},"ais":{"t":"AIS: GMSK 9600 baud on two channels","h":"A smoothed FSK (GMSK) in 26 ms bursts, once on 161.975 MHz, once on 162.025 MHz (reduced scale).","l":"Two columns of short little lines, 50 kHz apart, a regular clicking; the more ships, the denser it gets (sheet 16).","n":"reduced scale"},"navtex":{"t":"NAVTEX and DSC on medium and short waves: 170 Hz FSK","h":"Like RTTY: two frequencies 170 Hz apart, but at 100 baud.","l":"Two parallel lines, continuous during the bulletin, on 518 and 490 kHz (NAVTEX) or 2187.5 kHz (digital selective calling) (sheet 17).","r":[["Code","SITOR-B, CCIR 476: 7 bits with four \"1\"s, with FEC repetition"],["Decoding","fldigi, YaND"]]},"hfdl":{"t":"HFDL: aircraft on shortwave","h":"A 1800 baud PSK on a 1440 Hz subcarrier.","l":"Bursts about 2.4 kHz wide between 2.9 and 22 MHz; a modem hiss that comes and goes (sheet 14 bis)."},"ctcss":{"t":"CTCSS: a sub-tone under the voice","h":"A low continuous tone (67 to 254 Hz, here 88.5 Hz) added to the voice.","l":"Seen in the FM receiver audio: a fixed line at the very bottom, under the voice; it opens the squelch of repeaters and walkie-talkies (sheet 8)."},"dtmf":{"sh":"2 tones","t":"DTMF: two tones per key","h":"Each keypad key sends a low tone (697 to 941 Hz) and a high one (1209 to 1633 Hz) at the same time.","l":"Pairs of dots aligned on eight fixed columns; the \"beep-beep\" of phone numbers and repeater commands (sheet 8).","r":[["Sequence","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tones","t":"CCIR Selcall: tones in sequence","h":"Five 100 ms tones one after the other, one per digit.","l":"A small staircase of dots, repeated; a quick \"tululululu\" to call one specific radio (sheet 28).","r":[["Sequence","1 2 3 4 5, twice; also decoded by the SelCall app of the UV-K1"]]},"pocsag":{"sh":"pagers","t":"POCSAG and FLEX: pagers","h":"An FSK at ±4.5 kHz; a 1010… preamble then the data (reduced scale).","l":"Two clean lines during the preamble, then a full band; a shrill \"brrrrt\". 466.075 MHz, DAPNET 439.9875 MHz (sheet 37).","n":"reduced scale"},"ale":{"sh":"8 tones","t":"ALE: automatic link establishment on shortwave","h":"Eight tones from 750 to 2500 Hz, 125 baud, in bursts.","l":"A block about 2 kHz wide made of small dots, one to two seconds, sometimes on several nearby frequencies; a high-pitched twitter (sheet 28 bis)."},"rs41":{"nm":"RS41 radiosonde","t":"RS41 radiosonde: continuous GFSK","h":"A smoothed FSK at 4800 baud, non-stop; the frequency drifts slowly as the sonde rises and cools down.","l":"A band about 10 kHz wide that slides at an angle during the whole flight, between 400 and 406 MHz (sheet 18)."},"ook":{"nm":"433 sensors","t":"433 MHz sensors: OOK","h":"The carrier switches on and off in short or long pulses (on-off keying); the message is repeated three times.","l":"Bursts of small dots, often in threes, on 433.92 MHz: weather stations, temperature probes, remote controls (sheet 19)."},"fhss":{"t":"Bluetooth: frequency hopping (FHSS)","h":"The frequency changes 1600 times per second among 79 channels (reduced scale).","l":"Small lines scattered everywhere over 80 MHz, never in the same place, around 2.4 GHz (sheet 22).","n":"reduced scale"},"wspr":{"t":"WSPR: propagation beacons","h":"Four tones spaced 1.46 Hz, 0.68 s per symbol, for 110.6 s.","l":"A very thin line about 6 Hz wide lasting almost two minutes, every even two minutes: you have to zoom in a lot (sheet 26).","n":"24 s excerpt (a transmission lasts 110.6 s)"},"qrss":{"t":"QRSS: very slow Morse","h":"A carrier switched on and off, with dots of 3 to 10 s, often on two nearby frequencies (DFCW).","l":"Lines a few Hz wide, read on a ten-minute screen; inaudible to the ear (sheet 26 bis).","n":"sped up: 0.6 s dot instead of 3 to 10 s"},"texte":{"nm":"Text in the waterfall","t":"Text in the waterfall","h":"Each line of a picture becomes a group of tones: the sound is like noise.","l":"The text or drawing appears directly on the SDR screen (sheet 33).","r":[["Note","Sent from the bottom of the picture: upright on the live waterfall, upside down in the footprint (read from top to bottom)"]]},"vara":{"t":"Modern HF data: VARA, Pactor, ARDOP","h":"Long full bursts (OFDM or PSK) and, in between, short replies from the other station.","l":"A rectangle about 2.4 kHz wide that stops and starts again, with a small acknowledgement in between; a chopped hiss (sheet 26)."},"chirp":{"nm":"Ionospheric sounder","t":"Ionospheric sounder (chirp sounder)","h":"A slow frequency ramp crossing the whole HF band; echoes from the ionosphere arrive a little later.","l":"A diagonal sweeping the screen, doubled by parallel lines (the echoes); a \"ffweet\" that passes in a fraction of a second."},"oth":{"nm":"Over-the-horizon radar","t":"Over-the-horizon radar (\"woodpecker\")","h":"Pulses repeated 10 to 50 times per second, each several kHz wide.","l":"A wide striped block covering whole bands; a very regular woodpecker knocking on shortwave."},"parasites":{"nm":"Interference","sh":"power supply","t":"Interference from a switching power supply","h":"A square wave: its frequency and all its harmonics come out at the same time.","l":"A comb of regular lines drifting together, on a noise background: look for it with NOISE FIND or a portable receiver (sheet K21b)."},"mpx":{"nm":"FM stereo and RDS","t":"FM stereo radio and RDS","h":"The demodulated sound (multiplex) contains the L+R channel, a 19 kHz pilot, the L-R channel around 38 kHz and RDS at 57 kHz.","l":"Seen from 0 to 60 kHz after demodulation: a low block, a thin line at 19 kHz, a weaker block in the middle and RDS at the very top (sheet 10).","n":"scale ÷ 20 for listening"},"dcf77":{"t":"DCF77 time signal (77.5 kHz)","h":"A carrier dropping to 15 % for 0.1 s (bit 0) or 0.2 s (bit 1), at the start of each second.","l":"A fixed line with a black gap every second; the 59th second has none, to mark the minute (sheet 10).","r":[["Note","Here the carrier is brought down to 1000 Hz; the 6th second has no gap, like the 59th second of each minute"]]},"ofdm":{"t":"OFDM: dozens of subcarriers","h":"Many tightly packed carriers, each slow: the sum looks like noise.","l":"A flat rectangle with sharp edges, always there: DRM on shortwave (10 kHz), DAB+ (1.5 MHz), DVB-T, Wi-Fi. A continuous hiss to the ear (sheets 10 and 22)."},"dsss":{"t":"Spread spectrum (DSSS): GPS, Wi-Fi 802.11b","h":"The data are mixed with a very fast code: the energy is spread over a wide band.","l":"A wide hump, barely above the noise; GPS is even below the noise and cannot be seen without processing (sheets 22 and 23)."},"hline":{"nm":"Hydrogen line","sh":"1420 MHz","t":"21 cm hydrogen line (1420.405 MHz)","h":"Cold hydrogen in the Milky Way emits a very faint hiss on 1420.405 MHz. The motion of the galaxy's arms shifts it by the Doppler effect: you see several small humps.","l":"Almost nothing in the waterfall from one second to the next: you have to average for a long time to see the humps rise out of the noise. Here, look at the average spectrum when stopped. A dish or a horn, a preamp and an SDR dongle are enough.","n":"signal greatly exaggerated"},"sun":{"nm":"Sun","sh":"bursts","t":"Sun: type III radio bursts","h":"Electrons thrown out by a flare cross the Sun's corona and make it emit at lower and lower frequencies as they move away.","l":"Lines falling diagonally from the top to the bottom of the spectrum in less than a second, over a background of solar noise; a swelling \"shhhh\". From about 10 to 400 MHz, also on shortwave around 20 MHz."},"jupiter":{"nm":"Jupiter","sh":"20 MHz","t":"Jupiter: decametric bursts (L and S)","h":"Jupiter's magnetic field and its moon Io produce powerful emissions between 15 and 40 MHz: slow L bursts and very short S bursts that slide down fast.","l":"First waves of hiss (L, like surf on a beach), then trains of little \"pops\" (S) in tight diagonals. Around 20.1 MHz at night, with a simple dipole, when Io is well placed."},"pulsar":{"nm":"Pulsar","sh":"B0329+54","t":"Pulsar PSR B0329+54","h":"A spinning neutron star sweeps the Earth with a radio beam, here every 0.714 s. Interstellar gas delays the low frequencies: each pulse arrives first at the top of the spectrum.","l":"A regular \"tick\"; in the waterfall each pulse is a curve sloping down (dispersion). The real signal is below the noise: you need a big antenna and must add up the pulses over their period.","n":"signal greatly exaggerated"},"meteor":{"nm":"Meteors","sh":"GRAVES","t":"Meteor echoes from the GRAVES radar (143.050 MHz)","h":"The French GRAVES radar transmits non-stop on 143.050 MHz. When a shooting star ionises the air, its trail reflects a little of that signal to your receiver, for a fraction of a second to a few seconds.","l":"In USB on 143.049 MHz: short \"pings\" around 1000 Hz, sometimes an echo that slides (the meteor head, Doppler effect) or one that lasts. Far more during showers (Perseids, Geminids) (sheet 1)."},"whistler":{"nm":"Whistlers","sh":"VLF","t":"VLF whistlers","h":"Lightning makes a radio click; part of it follows the Earth's magnetic field lines to the other hemisphere and back, high notes first.","l":"A \"pyooo\" falling from high to low in one or two seconds, right after a click; crackles (sferics) everywhere. Below 10 kHz, with a VLF receiver far from power lines."},"chorus":{"nm":"Dawn chorus","sh":"VLF","t":"Dawn chorus","h":"During a magnetic storm, electrons trapped in the magnetosphere emit small rising notes, mostly around sunrise.","l":"Overlapping rising chirps, like birds, from about 1 to 4 kHz. Same equipment as for whistlers."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"The first artificial satellite sent beeps of about 0.3 s on 20.005 and 40.002 MHz, alternately, for three weeks.","l":"A regularly broken line: \"beep… beep…\", the sound the whole world listened to in October 1957 (reconstruction)."},"doppler":{"nm":"Doppler effect","sh":"satellite","t":"Satellite beacon and Doppler effect","h":"A low-orbit satellite comes closer then moves away: the received frequency falls during the pass, by about ±3 kHz at 145 MHz and ±10 kHz at 435 MHz.","l":"A line falling in an S shape: slowly at first, fast when the satellite is closest, then slowly again (sheet 34).","n":"10 min pass squeezed into 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"NOAA satellites: APT images (historical)","h":"A 2400 Hz subcarrier amplitude-modulated by the picture, two lines per second, with a sync pulse at the start of each line. Stopped in 2025; Meteor-M satellites now transmit LRPT.","l":"A line at 2400 Hz with sidebands that change with the picture, and the famous \"tick-tock\" twice a second (sheet 34)."},"eme":{"nm":"Moon echo","sh":"EME","t":"Moon echo (EME)","h":"A signal sent to the Moon comes back about 2.5 s later, hugely weakened, slightly smeared and shifted by Doppler.","l":"You hear your own \"beep\", then its faint, slightly blurred echo 2.5 s later. Radio amateurs do it in CW or JT65, on 144 MHz and above (sheet 1).","n":"echo greatly exaggerated"}}},"es":{"ui":{"title":"Identificador de modos de radio","mystery":"Sonido misterioso","play":"▶ Escuchar","stop":"■ Parar","noise":"Ruido","volume":"Volumen","loop":"En bucle","specwf":"Espectro + Cascada","cursor":"cursor","footprint":"Huella","dur":"{s} s de arriba abajo","avg":"media de toda la señal","press":"Pulsa Escuchar: la señal se desplaza aquí","count":"{n} señales, en el orden de la ficha 5 bis","myst":"Modo misterioso","mystTags":"Escucha y observa, luego elige la respuesta correcta","quizH":"¿Qué señal es?","quizLead":"Pon la escucha, observa el espectro, la cascada y la huella, y responde.","score":"Puntuación","good":"¡Correcto!","bad":"Fallo: era {x}.","next":"Siguiente sonido misterioso","principle":"Principio","screen":"En pantalla","sheet":"ficha","book":"Libro: ficha {r}","lang":"Idioma","signals":"Señales","f1":"Señales simuladas en la página (12 000 muestras por segundo), según las señales de la ficha 5 bis del libro OpenBookRadio, más Olivia, FT4 y Feld Hell (ficha 26). Para las señales de radio (AM, FM, AIS, LoRa…) se ve la frecuencia intermedia simulada, como en la pantalla de un SDR; algunas están a escala reducida o acelerada, y se indica.","f2":"El tiempo baja en la cascada y en la huella. Licencia CC BY-NC-SA 4.0, gratis, prohibida la venta."},"groups":["Voz analógica","Telegrafía","Datos","Imágenes","Aviación, marina y rescate","Llamada, subtonos y mensajería","Radiosondas, sensores y objetos conectados","Modos HF y curiosidades","Radiodifusión y hora","Banda ancha","Bonus: sonidos del espacio"],"modes":{"am":{"sh":"voz","t":"AM: modulación de amplitud","h":"La fuerza de la portadora sigue al sonido: la curva se «hincha» y se «deshincha».","l":"Una raya fija en el centro (la portadora), con dos bandas laterales idénticas a cada lado. Unos 6 a 9 kHz de ancho. Radio en onda corta y onda media, aviación (fichas 10 y 12)."},"ssb":{"t":"BLU / SSB: banda lateral única","h":"Solo queda una banda lateral, sin portadora: nada cuando nadie habla.","l":"Sin raya central, una sola banda de unos 2,7 kHz que solo vive cuando se habla. USB por encima de 10 MHz, LSB por debajo (radioaficionados). Mal sintonizada, la voz suena a «pato» (fichas 9 y 26)."},"fm":{"sh":"voz","t":"FM: modulación de frecuencia","h":"La amplitud se mantiene fija; las oscilaciones se juntan o se separan con el sonido.","l":"La señal baila alrededor de su frecuencia, más ancha cuando el sonido es fuerte: 12,5 kHz por canal en FM estrecha (walkies, repetidores), 200 kHz en radio FM (fichas 2 y 11)."},"cw":{"t":"CW: Morse","h":"La portadora se enciende y se apaga: rayas y puntos.","l":"Una raya muy fina que se corta al ritmo del Morse; un pitido al oído. Aquí «CQ» (ficha 39).","r":[["Velocidad","20 palabras/min, punto de 60 ms, a 700 Hz: «CQ CQ CQ DE F4ABC K»"],["Al oído","Pitidos puros, largos y cortos, de una sola nota"],["Decodificación","De oído, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: dos frecuencias","h":"La frecuencia salta entre dos valores, uno para 0 y otro para 1.","l":"Dos rayas paralelas: 170 Hz de separación entre radioaficionados (45,45 baudios), 450 u 850 Hz para los boletines meteorológicos. Un «tidilidi» regular (ficha 27).","r":[["Código","Baudot ITA2: 5 bits + start + 1,5 stop; mark 2125 Hz, space 2295 Hz"],["Texto","RYRYRYRY CQ CQ DE F4ABC"],["Decodificación","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 baudios: APRS y packet","h":"Dos tonos de audio, 1200 y 2200 Hz, enviados a un transmisor FM.","l":"Vista tras el receptor FM (sonido del altavoz): una banda de 1200 a 2200 Hz, en ráfagas cortas. Al oído, un «grrrt» de un segundo (fichas 29 y 30).","r":[["Frecuencia","144,800 MHz en Europa (APRS), FM"],["Trama","Banderas 0x7E y datos AX.25 en NRZI"],["Decodificación","Direwolf, multimon-ng, TNC KISS"]]},"psk31":{"t":"PSK31: modulación de fase","h":"La frecuencia no se mueve, es la fase la que se invierte; la amplitud baja en cada inversión.","l":"Una raya muy fina de unos 60 Hz, algo «trenzada». Decenas de estaciones caben en 3 kHz (ficha 26).","r":[["Código","Varicode: 0 = inversión de fase, 1 = sin cambio; en reposo, dos rayas gemelas"],["Dónde oírla","14 070 kHz, 3580 kHz"],["Decodificación","fldigi"]]},"ft8":{"t":"MFSK / FT8: ocho tonos","h":"La frecuencia sube y baja en escalones de 6,25 Hz, 0,16 s por escalón.","l":"Bandas de unos 50 Hz que duran 12,6 s y vuelven cada 15 s, sincronizadas con la hora: varias estaciones a la vez en 3 kHz, por ejemplo en 7,074 MHz (ficha 26).","r":[["Trama","79 símbolos de 0,16 s, tres patrones Costas (inicio, centro, final); aquí ocho estaciones"],["Frecuencias","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Decodificación","WSJT-X, JTDX (hora del PC exacta)"]]},"ft4":{"t":"FT4: el FT8 de los concursos","h":"Cuatro tonos separados 20,8 Hz, 20,8 baudios: 105 símbolos en 5 s, en turnos de 7,5 s.","l":"Bandas de unos 90 Hz, más cortas y anchas que el FT8, que vuelven cada 7,5 s. 14 080, 7047,5 kHz (ficha 26)."},"olivia":{"t":"Olivia 8/250: ocho tonos","h":"Ocho tonos separados 31,25 Hz, uno cada vez, que saltan al azar; codificación Walsh y entrelazado.","l":"Un bloque de puntos dispersos sobre 250 Hz; decodifica muy por debajo del ruido. Una pequeña melodía aleatoria al oído (ficha 26)."},"hell":{"t":"Feld Hell: escribir con una portadora","h":"La portadora se enciende y se apaga punto a punto: cada letra son columnas de 14 puntos, barridas de abajo arriba (245 puntos por segundo).","l":"En la cascada, una raya entrecortada; la pantalla del programa (fldigi) redibuja las letras. Un crepitar suave al oído (ficha 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Cuatro niveles de frecuencia: cada símbolo lleva dos bits.","l":"Un bloque rectangular de 6 a 12,5 kHz, lleno como el ruido, a menudo en ráfagas (el DMR reparte el canal en dos intervalos). Un «frrr» ronco al oído (ficha 38)."},"mt63":{"t":"MT63: mensajes de emergencia (NBEMS)","h":"64 tonos a la vez, cada uno modulado lentamente, con mucha redundancia.","l":"Un bloque plano de 1 o 2 kHz centrado en 1500 Hz, de bordes nítidos; un soplido regular. Pasa incluso por un micrófono pegado a un altavoz (ficha 26 ter)."},"lora":{"t":"LoRa: rampas de frecuencia (chirps)","h":"La frecuencia barre todo el ancho y vuelve a empezar desde abajo: la posición del salto lleva los datos.","l":"Diagonales paralelas, fáciles de reconocer: Meshtastic y MeshCore en 869,525 MHz o 433 MHz, sensores LoRaWAN (fichas 11, 20 y 21)."},"sstv":{"t":"SSTV: imágenes en audio","h":"Un pulso de sincronía a 1200 Hz y luego la frecuencia sigue el brillo de la línea, de 1500 (negro) a 2300 Hz (blanco).","l":"Rayas de sincronía regulares y una nube que cambia con la imagen; un sonido que «gorjea» durante uno o dos minutos. 14,230 MHz, ISS en 145,800 MHz (ficha 31).","r":[["Trama","Cabecera VIS y luego líneas: sincronía 1200 Hz, verde, azul, rojo; aquí 20 líneas de una carta de ajuste"],["Decodificación","QSSTV, MMSSTV, Robot36 en el móvil"]]},"fax":{"nm":"Fax meteorológico","t":"Fax meteorológico: 1500 Hz negro, 2300 Hz blanco","h":"La frecuencia pasa del negro al blanco de forma continua, 120 líneas por minuto.","l":"Dos bandas fijas en 1500 y 2300 Hz (800 Hz de separación), un «tic-tac» regular. Las frecuencias publicadas son las de la portadora: escucha en USB 1,9 kHz más abajo (ficha 32).","r":[["Trama","Tono de inicio de 300 Hz, líneas de fase (pulso blanco) y luego el mapa"],["Decodificación","fldigi, JWX, HamFax"]]},"elt":{"nm":"Sirena ELT","t":"Sirena ELT / PLB en 121,5 MHz","h":"Una AM cuyo tono baja de 1600 a 300 Hz, de dos a cuatro veces por segundo.","l":"Una portadora fija y bandas laterales que se deslizan en abanico: el «uu-uu» de las radiobalizas de socorro, también en 121,375 MHz para ejercicios (fichas 24 y 25)."},"406":{"nm":"Baliza 406","t":"Baliza 406 MHz: ráfaga BPSK","h":"Medio segundo de emisión: 160 ms de portadora pura, luego la fase oscila ±1,1 radián a 400 bit/s.","l":"Una rayita corta que vuelve cada 50 s, entre 406,0 y 406,1 MHz; nada útil que oír, hace falta un decodificador (EPIRB 406, ficha 25)."},"adsb":{"t":"ADS-B / modo S (1090 MHz): impulsos","h":"Impulsos de 0,5 µs cuya posición lleva los bits (PPM); aquí la escala de tiempo está muy ralentizada.","l":"Rayas horizontales muy cortas en todo el ancho, cientos por segundo cerca de un aeropuerto; hace falta una llave SDR (ficha 13).","n":"escala de tiempo muy ralentizada"},"acars":{"t":"ACARS: AM y datos MSK","h":"Una AM que transporta dos tonos, 1200 y 2400 Hz, a 2400 bit/s.","l":"Ráfagas de medio segundo con portadora y bandas laterales, en 131,525, 131,725 o 131,825 MHz en Europa: un «brrrt» al oído (ficha 14)."},"ais":{"t":"AIS: GMSK 9600 baudios en dos canales","h":"Una FSK suavizada (GMSK) en ráfagas de 26 ms, una vez en 161,975 MHz, otra en 162,025 MHz (escala reducida).","l":"Dos columnas de rayitas breves, a 50 kHz, un chasquido regular; cuantos más barcos, más denso (ficha 16).","n":"escala reducida"},"navtex":{"t":"NAVTEX y LSD en onda media y corta: FSK 170 Hz","h":"Como el RTTY: dos frecuencias separadas 170 Hz, pero a 100 baudios.","l":"Dos rayas paralelas continuas durante el boletín, en 518 y 490 kHz (NAVTEX) o 2187,5 kHz (llamada selectiva digital) (ficha 17).","r":[["Código","SITOR-B, CCIR 476: 7 bits con cuatro «1», con repetición FEC"],["Decodificación","fldigi, YaND"]]},"hfdl":{"t":"HFDL: los aviones en onda corta","h":"Una PSK de 1800 baudios sobre una subportadora de 1440 Hz.","l":"Ráfagas de unos 2,4 kHz entre 2,9 y 22 MHz; un siseo de módem que va y viene (ficha 14 bis)."},"ctcss":{"t":"CTCSS: subtono bajo la voz","h":"Un tono grave y continuo (67 a 254 Hz, aquí 88,5 Hz) añadido a la voz.","l":"Visto en el sonido del receptor FM: una raya fija abajo del todo, bajo la voz; abre el silenciador de repetidores y walkies (ficha 8)."},"dtmf":{"sh":"2 tonos","t":"DTMF: dos tonos por tecla","h":"Cada tecla envía un tono grave (697 a 941 Hz) y uno agudo (1209 a 1633 Hz) a la vez.","l":"Pares de puntos alineados en ocho columnas fijas; el «bip-bip» de los números de teléfono y de los mandos de repetidores (ficha 8).","r":[["Secuencia","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 tonos","t":"Selcall CCIR: tonos en secuencia","h":"Cinco tonos de 100 ms uno tras otro, uno por cifra.","l":"Una pequeña escalera de puntos, repetida; un «tululululu» rápido para llamar a una radio concreta (ficha 28).","r":[["Secuencia","1 2 3 4 5, dos veces; también lo decodifica la app SelCall del UV-K1"]]},"pocsag":{"sh":"buscas","t":"POCSAG y FLEX: buscapersonas","h":"Una FSK a ±4,5 kHz; un preámbulo 1010… y luego los datos (escala reducida).","l":"Dos rayas nítidas durante el preámbulo y luego una banda llena; un «brrrrt» estridente. 466,075 MHz, DAPNET 439,9875 MHz (ficha 37).","n":"escala reducida"},"ale":{"sh":"8 tonos","t":"ALE: llamada automática en onda corta","h":"Ocho tonos de 750 a 2500 Hz, 125 baudios, en ráfagas.","l":"Un bloque de unos 2 kHz hecho de puntitos, de uno a dos segundos, a veces en varias frecuencias vecinas; un gorjeo agudo (ficha 28 bis)."},"rs41":{"nm":"Radiosonda RS41","t":"Radiosonda RS41: GFSK continua","h":"Una FSK suavizada a 4800 baudios, sin parar; la frecuencia deriva despacio cuando la sonda sube y se enfría.","l":"Una banda de unos 10 kHz que se desliza en diagonal durante todo el vuelo, entre 400 y 406 MHz (ficha 18)."},"ook":{"nm":"Sensores 433","t":"Sensores 433 MHz: OOK","h":"La portadora se enciende y se apaga en impulsos cortos o largos (todo o nada); el mensaje se repite tres veces.","l":"Ráfagas de puntitos, a menudo por triplicado, en 433,92 MHz: estaciones meteorológicas, sondas de temperatura, mandos a distancia (ficha 19)."},"fhss":{"t":"Bluetooth: saltos de frecuencia (FHSS)","h":"La frecuencia cambia 1600 veces por segundo entre 79 canales (escala reducida).","l":"Rayitas esparcidas por todas partes en 80 MHz de ancho, nunca en el mismo sitio, hacia 2,4 GHz (ficha 22).","n":"escala reducida"},"wspr":{"t":"WSPR: balizas de propagación","h":"Cuatro tonos separados 1,46 Hz, 0,68 s por símbolo, durante 110,6 s.","l":"Una raya muy fina de unos 6 Hz que dura casi dos minutos, cada dos minutos pares: hay que ampliar mucho (ficha 26).","n":"extracto de 24 s (una emisión dura 110,6 s)"},"qrss":{"t":"QRSS: Morse muy lento","h":"Una portadora encendida y apagada, con puntos de 3 a 10 s, a menudo en dos frecuencias vecinas (DFCW).","l":"Rayas de pocos Hz de ancho que se leen en una pantalla de diez minutos; inaudible al oído (ficha 26 bis).","n":"acelerado: punto de 0,6 s en lugar de 3 a 10 s"},"texte":{"nm":"Texto en la cascada","t":"Texto en la cascada","h":"Cada línea de una imagen se convierte en un grupo de tonos: el sonido parece ruido.","l":"El texto o el dibujo aparece directamente en la pantalla del SDR (ficha 33).","r":[["Nota","Emitido desde abajo de la imagen: al derecho en la cascada en directo, al revés en la huella (leída de arriba abajo)"]]},"vara":{"t":"Datos HF modernos: VARA, Pactor, ARDOP","h":"Largas ráfagas llenas (OFDM o PSK) y, entre ellas, respuestas cortas de la otra estación.","l":"Un rectángulo de unos 2,4 kHz que se para y vuelve a empezar, con un pequeño acuse de recibo en medio; un siseo entrecortado (ficha 26)."},"chirp":{"nm":"Sondeador ionosférico","t":"Sondeador ionosférico (chirp sounder)","h":"Una rampa de frecuencia lenta que cruza toda la banda HF; los ecos de la ionosfera llegan un poco después.","l":"Una diagonal que barre la pantalla, acompañada de rayas paralelas (los ecos); un «ffuit» que pasa en una fracción de segundo."},"oth":{"nm":"Radar transhorizonte","t":"Radar transhorizonte («woodpecker»)","h":"Impulsos repetidos de 10 a 50 veces por segundo, cada uno de varios kHz de ancho.","l":"Un bloque ancho y rayado que cubre bandas enteras; un golpeteo de pájaro carpintero muy regular en onda corta."},"parasites":{"nm":"Interferencias","sh":"fuente","t":"Interferencias de una fuente conmutada","h":"Una señal cuadrada: su frecuencia y todos sus armónicos salen a la vez.","l":"Un peine de rayas regulares que derivan juntas sobre un fondo de ruido: búscalo con NOISE FIND o con un receptor portátil (ficha K21b)."},"mpx":{"nm":"FM estéreo y RDS","t":"Radio FM estéreo y RDS","h":"El sonido demodulado (multiplex) contiene la vía L+R, un piloto a 19 kHz, la vía L-R alrededor de 38 kHz y el RDS a 57 kHz.","l":"Visto de 0 a 60 kHz tras la demodulación: un bloque grave, una raya fina a 19 kHz, un bloque más débil en el centro y el RDS arriba del todo (ficha 10).","n":"escala ÷ 20 para la escucha"},"dcf77":{"t":"Señal horaria DCF77 (77,5 kHz)","h":"Una portadora que baja al 15 % durante 0,1 s (bit 0) o 0,2 s (bit 1), al inicio de cada segundo.","l":"Una raya fija con un corte negro cada segundo; el segundo 59 no lo tiene, para marcar el minuto (ficha 10).","r":[["Nota","Aquí la portadora se lleva a 1000 Hz; el 6.º segundo no tiene corte, como el segundo 59 de cada minuto"]]},"ofdm":{"t":"OFDM: decenas de subportadoras","h":"Muchas portadoras muy juntas, cada una lenta: la suma parece ruido.","l":"Un rectángulo plano de bordes nítidos, siempre presente: DRM en onda corta (10 kHz), DAB+ (1,5 MHz), TDT, wifi. Un soplido continuo al oído (fichas 10 y 22)."},"dsss":{"t":"Espectro ensanchado (DSSS): GPS, wifi 802.11b","h":"Los datos se mezclan con un código muy rápido: la energía se reparte en un gran ancho.","l":"Una joroba ancha, apenas por encima del ruido; el GPS está incluso por debajo del ruido y no se ve sin tratamiento (fichas 22 y 23)."},"hline":{"nm":"Línea del hidrógeno","sh":"1420 MHz","t":"Línea del hidrógeno de 21 cm (1420,405 MHz)","h":"El hidrógeno frío de la Vía Láctea emite un soplido muy débil en 1420,405 MHz. El movimiento de los brazos de la galaxia lo desplaza por efecto Doppler: se ven varias jorobas pequeñas.","l":"Casi nada en la cascada de un segundo a otro: hay que promediar mucho tiempo para ver las jorobas salir del ruido. Aquí, mira el espectro medio en pausa. Basta una parábola o una bocina, un preamplificador y una llave SDR.","n":"señal muy exagerada"},"sun":{"nm":"Sol","sh":"ráfagas","t":"Sol: ráfagas de radio de tipo III","h":"Electrones lanzados por una erupción atraviesan la corona solar y la hacen emitir cada vez más bajo en frecuencia a medida que se alejan.","l":"Rayas que caen en diagonal de arriba abajo del espectro en menos de un segundo, sobre un fondo de ruido solar; un «chhhh» que crece. De unos 10 a 400 MHz, también en onda corta hacia 20 MHz."},"jupiter":{"nm":"Júpiter","sh":"20 MHz","t":"Júpiter: ráfagas decamétricas (L y S)","h":"El campo magnético de Júpiter y su luna Ío producen emisiones potentes entre 15 y 40 MHz: ráfagas L lentas y ráfagas S muy cortas que bajan deprisa.","l":"Primero olas de soplido (L, como la resaca del mar), luego trenes de pequeños «pops» (S) en diagonales apretadas. Hacia 20,1 MHz de noche, con un simple dipolo, cuando Ío está bien situada."},"pulsar":{"nm":"Púlsar","sh":"B0329+54","t":"Púlsar PSR B0329+54","h":"Una estrella de neutrones que gira barre la Tierra con un haz de radio, aquí cada 0,714 s. El gas interestelar retrasa las frecuencias bajas: cada impulso llega primero arriba del espectro.","l":"Un «tic» regular; en la cascada, cada impulso es una curva que baja (dispersión). La señal real está bajo el ruido: hace falta una gran antena y sumar los impulsos sobre su período.","n":"señal muy exagerada"},"meteor":{"nm":"Meteoros","sh":"GRAVES","t":"Ecos de meteoros del radar GRAVES (143,050 MHz)","h":"El radar francés GRAVES emite sin parar en 143,050 MHz. Cuando una estrella fugaz ioniza el aire, su estela devuelve un poco de esa señal a tu receptor, de una fracción de segundo a unos segundos.","l":"En USB en 143,049 MHz: «pings» breves hacia 1000 Hz, a veces un eco que se desliza (la cabeza del meteoro, efecto Doppler) o que dura. Muchos más durante las lluvias (Perseidas, Gemínidas) (ficha 1)."},"whistler":{"nm":"Silbidos","sh":"VLF","t":"Silbidos VLF (whistlers)","h":"Un rayo crea un chasquido de radio; una parte sigue las líneas del campo magnético terrestre hasta el otro hemisferio y vuelve, los agudos primero.","l":"Un «fiuuu» que baja de agudo a grave en uno o dos segundos, justo tras un chasquido; crujidos (sferics) por todas partes. Por debajo de 10 kHz, con un receptor VLF lejos de las líneas eléctricas."},"chorus":{"nm":"Coro del amanecer","sh":"VLF","t":"Coro del amanecer (dawn chorus)","h":"Durante una tormenta magnética, electrones atrapados en la magnetosfera emiten pequeñas notas ascendentes, sobre todo al amanecer.","l":"Gorjeos ascendentes que se solapan, como pájaros, de 1 a 4 kHz aproximadamente. El mismo equipo que para los silbidos."},"sputnik":{"nm":"Sputnik 1","sh":"1957","t":"Sputnik 1 (1957)","h":"El primer satélite artificial emitía pitidos de unos 0,3 s en 20,005 y 40,002 MHz, alternando, durante tres semanas.","l":"Una raya cortada con regularidad: «bip… bip…», el sonido que escuchó todo el mundo en octubre de 1957 (reconstrucción)."},"doppler":{"nm":"Efecto Doppler","sh":"satélite","t":"Baliza de satélite y efecto Doppler","h":"Un satélite en órbita baja se acerca y luego se aleja: la frecuencia recibida baja durante el pase, unos ±3 kHz en 145 MHz y ±10 kHz en 435 MHz.","l":"Una raya que baja en forma de S: despacio al principio, deprisa cuando el satélite pasa más cerca, y otra vez despacio (ficha 34).","n":"pase de 10 min reducido a 12 s"},"apt":{"nm":"NOAA APT","sh":"137 MHz","t":"Satélites NOAA: imágenes APT (histórico)","h":"Una subportadora de 2400 Hz modulada en amplitud por la imagen, dos líneas por segundo, con un pulso de sincronía al inicio de cada línea. Se apagó en 2025; hoy los Meteor-M emiten en LRPT.","l":"Una raya en 2400 Hz con bandas laterales que cambian con la imagen, y el famoso «tic-tac» dos veces por segundo (ficha 34)."},"eme":{"nm":"Eco de la Luna","sh":"EME","t":"Eco de la Luna (EME)","h":"Una señal enviada a la Luna vuelve unos 2,5 s después, muchísimo más débil, algo ensanchada y desplazada por el Doppler.","l":"Se oye el propio «bip» y luego su eco débil y algo borroso 2,5 s después. Los radioaficionados lo hacen en CW o JT65, en 144 MHz y más arriba (ficha 1).","n":"eco muy exagerado"}}},"de":{"ui":{"title":"Funkbetriebsarten-Erkenner","mystery":"Rätselton","play":"▶ Anhören","stop":"■ Stopp","noise":"Rauschen","volume":"Lautstärke","loop":"Schleife","specwf":"Spektrum + Wasserfall","cursor":"Cursor","footprint":"Abdruck","dur":"{s} s von oben nach unten","avg":"Mittelwert über das ganze Signal","press":"Drücke Anhören: das Signal läuft hier durch","count":"{n} Signale, in der Reihenfolge von Blatt 5 bis","myst":"Rätselmodus","mystTags":"Hören und schauen, dann die richtige Antwort wählen","quizH":"Welches Signal ist das?","quizLead":"Starte die Wiedergabe, beobachte Spektrum, Wasserfall und Abdruck, dann antworte.","score":"Punkte","good":"Richtig!","bad":"Leider nein: es war {x}.","next":"Nächster Rätselton","principle":"Prinzip","screen":"Auf dem Bildschirm","sheet":"Blatt","book":"Buch: Blatt {r}","lang":"Sprache","signals":"Signale","f1":"Im Browser simulierte Signale (12 000 Abtastwerte pro Sekunde), nach den Signalen von Blatt 5 bis des Buchs OpenBookRadio, dazu Olivia, FT4 und Feld Hell (Blatt 26). Bei Funksignalen (AM, FM, AIS, LoRa…) sieht man die simulierte Zwischenfrequenz wie auf einem SDR-Bildschirm; manche sind verkleinert oder beschleunigt, das ist angegeben.","f2":"Die Zeit läuft im Wasserfall und im Abdruck nach unten. Lizenz CC BY-NC-SA 4.0, kostenlos, nicht verkaufen."},"groups":["Analoge Sprache","Telegrafie","Daten","Bilder","Luftfahrt, Seefahrt und Rettung","Ruf, Subtöne und Funkruf","Radiosonden, Sensoren und vernetzte Geräte","KW-Betriebsarten und Kuriositäten","Rundfunk und Zeit","Breitband","Bonus: Klänge aus dem All"],"modes":{"am":{"sh":"Sprache","t":"AM: Amplitudenmodulation","h":"Die Stärke des Trägers folgt dem Ton: die Kurve „schwillt“ an und ab.","l":"Ein fester Strich in der Mitte (der Träger), mit zwei gleichen Seitenbändern links und rechts. Etwa 6 bis 9 kHz breit. Rundfunk auf Kurz- und Mittelwelle, Flugfunk (Blätter 10 und 12)."},"ssb":{"nm":"SSB / ESB","t":"SSB: Einseitenband","h":"Nur ein Seitenband bleibt, ohne Träger: nichts, wenn niemand spricht.","l":"Kein Mittelstrich, ein einziges Band von etwa 2,7 kHz, das nur beim Sprechen lebt. USB über 10 MHz, LSB darunter (Funkamateure). Falsch abgestimmt klingt die Stimme wie eine „Ente“ (Blätter 9 und 26)."},"fm":{"sh":"Sprache","t":"FM: Frequenzmodulation","h":"Die Amplitude bleibt gleich; die Schwingungen rücken mit dem Ton zusammen oder auseinander.","l":"Das Signal tanzt um seine Frequenz, breiter bei lautem Ton: 12,5 kHz pro Kanal bei Schmalband-FM (Handfunkgeräte, Relais), 200 kHz beim UKW-Rundfunk (Blätter 2 und 11)."},"cw":{"t":"CW: Morse","h":"Der Träger wird ein- und ausgeschaltet: Striche und Punkte.","l":"Ein sehr feiner Strich, der im Rhythmus des Morsecodes unterbrochen wird; ein Piepen im Ohr. Hier „CQ“ (Blatt 39).","r":[["Tempo","20 Wörter/min, Punkt 60 ms, auf 700 Hz: „CQ CQ CQ DE F4ABC K“"],["Mit dem Ohr","Reine Pieptöne, lang und kurz, auf einem Ton"],["Dekodierung","Nach Gehör, fldigi, CW Skimmer"]]},"rtty":{"t":"FSK / RTTY: zwei Frequenzen","h":"Die Frequenz springt zwischen zwei Werten, einem für 0, einem für 1.","l":"Zwei parallele Striche: 170 Hz Abstand bei Funkamateuren (45,45 Baud), 450 oder 850 Hz bei Wetterberichten. Ein regelmäßiges „tidilidi“ (Blatt 27).","r":[["Code","Baudot ITA2: 5 Bit + Start + 1,5 Stopp; Mark 2125 Hz, Space 2295 Hz"],["Text","RYRYRYRY CQ CQ DE F4ABC"],["Dekodierung","fldigi, MMTTY, 2Tone"]]},"afsk":{"t":"AFSK 1200 Baud: APRS und Packet","h":"Zwei Tonfrequenzen, 1200 und 2200 Hz, in einen FM-Sender gegeben.","l":"Hinter dem FM-Empfänger (Lautsprecherton): ein Band von 1200 bis 2200 Hz, in kurzen Paketen. Im Ohr ein einsekündiges „grrrt“ (Blätter 29 und 30).","r":[["Frequenz","144,800 MHz in Europa (APRS), FM"],["Rahmen","Flags 0x7E, dann AX.25-Daten in NRZI"],["Dekodierung","Direwolf, multimon-ng, KISS-TNC"]]},"psk31":{"t":"PSK31: Phasenmodulation","h":"Die Frequenz bleibt, die Phase kehrt sich um; bei jeder Umkehr sinkt die Amplitude.","l":"Ein sehr feiner Strich von etwa 60 Hz, leicht „geflochten“. Dutzende Stationen passen in 3 kHz (Blatt 26).","r":[["Code","Varicode: 0 = Phasenumkehr, 1 = keine Änderung; im Leerlauf zwei Zwillingsstriche"],["Wo hören","14 070 kHz, 3580 kHz"],["Dekodierung","fldigi"]]},"ft8":{"t":"MFSK / FT8: acht Töne","h":"Die Frequenz steigt und fällt in Stufen von 6,25 Hz, 0,16 s pro Stufe.","l":"Bänder von etwa 50 Hz, die 12,6 s dauern und alle 15 s wiederkommen, nach der Uhrzeit getaktet: mehrere Stationen gleichzeitig in 3 kHz, zum Beispiel auf 7,074 MHz (Blatt 26).","r":[["Rahmen","79 Symbole zu 0,16 s, drei Costas-Muster (Anfang, Mitte, Ende); hier acht Stationen"],["Frequenzen","14 074, 7074, 3573, 10 136, 21 074, 28 074 kHz"],["Dekodierung","WSJT-X, JTDX (genaue PC-Uhr)"]]},"ft4":{"t":"FT4: das FT8 für Conteste","h":"Vier Töne im Abstand von 20,8 Hz, 20,8 Baud: 105 Symbole in 5 s, in Zeitfenstern von 7,5 s.","l":"Bänder von etwa 90 Hz, kürzer und breiter als FT8, alle 7,5 s wieder. 14 080, 7047,5 kHz (Blatt 26)."},"olivia":{"t":"Olivia 8/250: acht Töne","h":"Acht Töne im Abstand von 31,25 Hz, immer nur einer, die zufällig springen; Walsh-Codierung und Verschachtelung.","l":"Ein Block verstreuter Punkte über 250 Hz; dekodiert weit unter dem Rauschen. Eine kleine Zufallsmelodie im Ohr (Blatt 26)."},"hell":{"t":"Feld Hell: Schreiben mit einem Träger","h":"Der Träger wird Punkt für Punkt ein- und ausgeschaltet: jeder Buchstabe besteht aus Spalten von 14 Punkten, von unten nach oben abgetastet (245 Punkte pro Sekunde).","l":"Im Wasserfall ein zerhackter Strich; erst der Programmbildschirm (fldigi) zeichnet die Buchstaben. Ein sanftes Knistern im Ohr (Blatt 26)."},"4fsk":{"t":"4FSK: DMR, C4FM (Fusion), NXDN, dPMR","h":"Vier Frequenzstufen: jedes Symbol trägt zwei Bit.","l":"Ein rechteckiger Block von 6 bis 12,5 kHz, voll wie Rauschen, oft in Paketen (DMR teilt den Kanal in zwei Zeitschlitze). Ein raues „frrr“ im Ohr (Blatt 38)."},"mt63":{"t":"MT63: Notfunknachrichten (NBEMS)","h":"64 Töne gleichzeitig, jeder langsam moduliert, mit viel Redundanz.","l":"Ein flacher Block von 1 oder 2 kHz um 1500 Hz, mit scharfen Kanten; ein gleichmäßiges Rauschen. Geht sogar über ein Mikrofon am Lautsprecher (Blatt 26 ter)."},"lora":{"t":"LoRa: Frequenzrampen (Chirps)","h":"Die Frequenz durchläuft die ganze Breite und beginnt dann wieder unten: die Lage des Sprungs trägt die Daten.","l":"Parallele Diagonalen, leicht zu erkennen: Meshtastic und MeshCore auf 869,525 MHz oder 433 MHz, LoRaWAN-Sensoren (Blätter 11, 20 und 21)."},"sstv":{"t":"SSTV: Bilder als Ton","h":"Ein Synchronimpuls auf 1200 Hz, dann folgt die Frequenz der Helligkeit der Zeile, von 1500 (schwarz) bis 2300 Hz (weiß).","l":"Regelmäßige Synchronstriche und eine Wolke, die sich mit dem Bild ändert; ein „zwitschernder“ Ton für ein bis zwei Minuten. 14,230 MHz, ISS auf 145,800 MHz (Blatt 31).","r":[["Rahmen","VIS-Kopf, dann Zeilen: Synchron 1200 Hz, Grün, Blau, Rot; hier 20 Zeilen eines Testbilds"],["Dekodierung","QSSTV, MMSSTV, Robot36 auf dem Smartphone"]]},"fax":{"nm":"Wetterfax","t":"Wetterfax: 1500 Hz schwarz, 2300 Hz weiß","h":"Die Frequenz geht stufenlos von Schwarz nach Weiß, 120 Zeilen pro Minute.","l":"Zwei feste Bänder auf 1500 und 2300 Hz (800 Hz Abstand), ein regelmäßiges „Tick-Tack“. Veröffentlicht wird die Trägerfrequenz: in USB 1,9 kHz tiefer hören (Blatt 32).","r":[["Rahmen","Startton 300 Hz, Phasenzeilen (weißer Impuls), dann die Karte"],["Dekodierung","fldigi, JWX, HamFax"]]},"elt":{"nm":"ELT-Sirene","t":"ELT- / PLB-Sirene auf 121,5 MHz","h":"Eine AM, deren Ton zwei- bis viermal pro Sekunde von 1600 auf 300 Hz fällt.","l":"Ein fester Träger und fächerartig gleitende Seitenbänder: das „Wu-wu“ der Notsender, auch auf 121,375 MHz für Übungen (Blätter 24 und 25)."},"406":{"nm":"406-Bake","t":"406-MHz-Bake: BPSK-Paket","h":"Eine halbe Sekunde Sendung: 160 ms reiner Träger, dann kippt die Phase um ±1,1 Radiant mit 400 bit/s.","l":"Ein kleiner kurzer Strich, der alle 50 s wiederkommt, zwischen 406,0 und 406,1 MHz; nichts Nützliches zu hören, ein Dekoder ist nötig (EPIRB 406, Blatt 25)."},"adsb":{"t":"ADS-B / Mode S (1090 MHz): Impulse","h":"Impulse von 0,5 µs, deren Lage die Bits trägt (PPM); hier ist die Zeitachse stark verlangsamt.","l":"Sehr kurze waagerechte Striche über die ganze Breite, Hunderte pro Sekunde nahe einem Flughafen; ein SDR-Stick ist nötig (Blatt 13).","n":"Zeitachse stark verlangsamt"},"acars":{"t":"ACARS: AM und MSK-Daten","h":"Eine AM, die zwei Töne trägt, 1200 und 2400 Hz, mit 2400 bit/s.","l":"Halbsekündige Pakete mit Träger und Seitenbändern, auf 131,525, 131,725 oder 131,825 MHz in Europa: ein „brrrt“ im Ohr (Blatt 14)."},"ais":{"t":"AIS: GMSK 9600 Baud auf zwei Kanälen","h":"Eine geglättete FSK (GMSK) in Paketen von 26 ms, einmal auf 161,975 MHz, einmal auf 162,025 MHz (verkleinert).","l":"Zwei Spalten kurzer Striche, 50 kHz auseinander, ein regelmäßiges Klacken; je mehr Schiffe, desto dichter (Blatt 16).","n":"verkleinert"},"navtex":{"t":"NAVTEX und DSC auf Mittel- und Kurzwelle: FSK 170 Hz","h":"Wie RTTY: zwei Frequenzen mit 170 Hz Abstand, aber mit 100 Baud.","l":"Zwei parallele Striche, durchgehend während der Meldung, auf 518 und 490 kHz (NAVTEX) oder 2187,5 kHz (digitaler Selektivruf) (Blatt 17).","r":[["Code","SITOR-B, CCIR 476: 7 Bit mit vier „1“, mit FEC-Wiederholung"],["Dekodierung","fldigi, YaND"]]},"hfdl":{"t":"HFDL: Flugzeuge auf Kurzwelle","h":"Eine PSK mit 1800 Baud auf einem 1440-Hz-Hilfsträger.","l":"Pakete von etwa 2,4 kHz zwischen 2,9 und 22 MHz; ein Modemrauschen, das kommt und geht (Blatt 14 bis)."},"ctcss":{"t":"CTCSS: Subton unter der Stimme","h":"Ein tiefer Dauerton (67 bis 254 Hz, hier 88,5 Hz) wird der Stimme hinzugefügt.","l":"Im Ton des FM-Empfängers: ein fester Strich ganz unten, unter der Stimme; er öffnet die Rauschsperre von Relais und Handfunkgeräten (Blatt 8)."},"dtmf":{"sh":"2 Töne","t":"DTMF: zwei Töne pro Taste","h":"Jede Taste sendet gleichzeitig einen tiefen (697 bis 941 Hz) und einen hohen Ton (1209 bis 1633 Hz).","l":"Punktpaare auf acht festen Spalten; das „Piep-Piep“ von Telefonnummern und Relaisbefehlen (Blatt 8).","r":[["Folge","0 6 1 2 3 4 5 7 8 9 * #"]]},"selcall":{"sh":"5 Töne","t":"Selcall CCIR: Tonfolge","h":"Fünf Töne von 100 ms nacheinander, einer pro Ziffer.","l":"Eine kleine Treppe aus Punkten, wiederholt; ein schnelles „tululululu“, um ein bestimmtes Gerät zu rufen (Blatt 28).","r":[["Folge","1 2 3 4 5, zweimal; auch von der SelCall-App des UV-K1 dekodiert"]]},"pocsag":{"sh":"Pager","t":"POCSAG und FLEX: Pager","h":"Eine FSK mit ±4,5 kHz; eine Präambel 1010…, dann die Daten (verkleinert).","l":"Zwei saubere Striche während der Präambel, dann ein volles Band; ein schrilles „brrrrt“. 466,075 MHz, DAPNET 439,9875 MHz (Blatt 37).","n":"verkleinert"},"ale":{"sh":"8 Töne","t":"ALE: automatischer Verbindungsaufbau auf Kurzwelle","h":"Acht Töne von 750 bis 2500 Hz, 125 Baud, in Paketen.","l":"Ein Block von etwa 2 kHz aus kleinen Punkten, ein bis zwei Sekunden, manchmal auf mehreren benachbarten Frequenzen; ein hohes Zwitschern (Blatt 28 bis)."},"rs41":{"nm":"Radiosonde RS41","t":"Radiosonde RS41: Dauer-GFSK","h":"Eine geglättete FSK mit 4800 Baud, ohne Pause; die Frequenz driftet langsam, wenn die Sonde steigt und abkühlt.","l":"Ein Band von etwa 10 kHz, das während des ganzen Flugs schräg wandert, zwischen 400 und 406 MHz (Blatt 18)."},"ook":{"nm":"433-Sensoren","t":"433-MHz-Sensoren: OOK","h":"Der Träger geht in kurzen oder langen Impulsen an und aus (Ein-Aus-Tastung); die Nachricht wird dreimal wiederholt.","l":"Pakete kleiner Punkte, oft dreifach, auf 433,92 MHz: Wetterstationen, Temperaturfühler, Fernbedienungen (Blatt 19)."},"fhss":{"t":"Bluetooth: Frequenzsprungverfahren (FHSS)","h":"Die Frequenz wechselt 1600-mal pro Sekunde unter 79 Kanälen (verkleinert).","l":"Kleine Striche überall verstreut auf 80 MHz Breite, nie an derselben Stelle, um 2,4 GHz (Blatt 22).","n":"verkleinert"},"wspr":{"t":"WSPR: Ausbreitungsbaken","h":"Vier Töne im Abstand von 1,46 Hz, 0,68 s pro Symbol, 110,6 s lang.","l":"Ein sehr feiner Strich von etwa 6 Hz, der fast zwei Minuten dauert, zu jeder geraden Minute: man muss stark heranzoomen (Blatt 26).","n":"Auszug von 24 s (eine Sendung dauert 110,6 s)"},"qrss":{"t":"QRSS: sehr langsames Morse","h":"Ein ein- und ausgeschalteter Träger mit Punkten von 3 bis 10 s, oft auf zwei benachbarten Frequenzen (DFCW).","l":"Striche von wenigen Hz Breite, auf einem Zehn-Minuten-Bildschirm gelesen; mit dem Ohr nicht hörbar (Blatt 26 bis).","n":"beschleunigt: Punkt 0,6 s statt 3 bis 10 s"},"texte":{"nm":"Text im Wasserfall","t":"Text im Wasserfall","h":"Jede Zeile eines Bildes wird zu einer Gruppe von Tönen: der Klang ähnelt Rauschen.","l":"Text oder
