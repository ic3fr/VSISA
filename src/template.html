<style>
/* Layout : un panneau de récepteur. Liste des signaux à gauche, spectre + waterfall en direct au centre, empreinte + fiche en dessous. */
:root{
  --odo-bg:#15110b;--odo-fg:#f3ead2;--odo-case:#0b0d10;
  --bg:#10141b; --panel:#171e28; --panel-2:#1d2633; --line:#2b3746;
  --fg:#e1e7ef; --muted:#8d9bad; --accent:#f2b544; --accent-ink:#1a1408;
  --ok:#5fcf8f; --bad:#ef6b6b;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html.night{--bg:#0a0000;--panel:#140202;--panel-2:#1e0404;--line:#3d0a08;--fg:#e2533f;--muted:#9c3428;--accent:#ff3b2f;--accent-ink:#140000;--ok:#ff8a6a;--bad:#c22a1c}
html.night .screen{background:#000}
html.night,html.phos{--odo-bg:#000;--odo-fg:var(--fg);--odo-case:var(--panel)}
html.phos{--glow:57,255,106;--bg:#010801;--panel:#031203;--panel-2:#052005;--line:#0e4a12;--fg:#39ff6a;--muted:#1fa83f;--accent:#7dff9a;--accent-ink:#011a04;--ok:#b6ffc6;--bad:#ffd84a;
  --f-display:"VT323",ui-monospace,Menlo,Consolas,monospace;--f-body:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
html.phos .screen{background:#000}
html.phos body{text-shadow:0 0 4px rgba(var(--glow),.45)}
html.phos h1,html.phos .now h2,html.phos .card h3{font-weight:400;letter-spacing:.03em}
html.phos h1{font-size:clamp(2.1rem,5vw,3rem)}
html.phos .btn,html.phos select,html.phos .mode,html.phos .ref,html.phos .screen,html.phos .card{border-radius:0}
html.phos body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px);box-shadow:inset 0 0 120px rgba(0,0,0,.65)}
html.phos canvas{filter:drop-shadow(0 0 2px rgba(var(--glow),.35))}
html.phos.blue{--glow:90,190,255;--bg:#00040a;--panel:#020a16;--panel-2:#041226;--line:#0c3058;--fg:#5ab8ff;--muted:#2d78b8;--accent:#9fd8ff;--accent-ink:#000c1a;--ok:#c8ecff;--bad:#ffd84a}
html.phos.amber{--glow:255,176,0;--bg:#0a0500;--panel:#140b00;--panel-2:#201200;--line:#4a2c00;--fg:#ffb000;--muted:#b07600;--accent:#ffd060;--accent-ink:#1a0e00;--ok:#ffe7a8;--bad:#ff6a4a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
h1 small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.btn{font:500 .9rem var(--f-body);border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:6px;padding:8px 14px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--muted)}
.hdr-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.btn.book{border-color:var(--accent);color:var(--accent)}
.btn.book:hover{background:var(--accent);color:var(--accent-ink)}
.ref{text-decoration:none}
a.ref:hover{border-color:var(--accent)}
@media (max-width:560px){.langlbl span{display:none}.hdr-ctl select{max-width:44vw}}
.langlbl{display:flex;align-items:center;gap:8px;font:400 .8rem var(--f-mono);color:var(--muted)}
select{font:500 .9rem var(--f-body);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:38px;cursor:pointer}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:focus-visible,.mode:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;padding-right:4px}
@media (max-width:820px){.grid{grid-template-columns:1fr}aside{position:static;max-height:38vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:10px}}
.count{font:400 .75rem var(--f-mono);color:var(--muted);margin:0}
.group h2{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){.group ul{flex-direction:row;flex-wrap:wrap}}
.mode{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:baseline;font:500 .9rem var(--f-body);color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 10px;cursor:pointer}
.mode span{font:400 .72rem var(--f-mono);color:var(--muted);white-space:nowrap}
.mode:hover{background:var(--panel)}
.mode[aria-pressed="true"]{background:var(--panel-2);border-color:var(--accent)}
.mode[aria-pressed="true"] span{color:var(--accent)}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.now{min-width:0}
.now h2{font-family:var(--f-display);font-weight:700;font-size:1.9rem;margin:0;line-height:1.1;text-wrap:balance}
.now p{margin:0;color:var(--muted);font-family:var(--f-mono);font-size:.8rem}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.controls label{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:110px}
input[type=checkbox]{accent-color:var(--accent)}
.screen{background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.screen-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);font:400 .74rem var(--f-mono);color:var(--muted);letter-spacing:.04em}
.screen-head b{color:var(--fg);font-weight:500;text-transform:uppercase;letter-spacing:.1em}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:crosshair}
.ruler{position:relative;height:22px;background:var(--panel);border-top:1px solid var(--line);font:400 .7rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden}
.ruler span{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
.ruler span::before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:4px;background:var(--muted)}
.ruler span.first{transform:none}.ruler span.first::before{left:0}
.ruler span.last{transform:translateX(-100%)}.ruler span.last::before{left:auto;right:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
.card h3{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0 0 4px;text-wrap:balance}
.card .lead{margin:0 0 12px;color:var(--fg);max-width:62ch}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:.9rem}
dt{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:3px}
dd{margin:0;min-width:0}
.ref{display:inline-block;margin-top:12px;font:500 .75rem var(--f-mono);color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.quiz{display:flex;flex-direction:column;gap:10px}
.quiz .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quiz .msg{font-weight:600}
.quiz .msg.ok{color:var(--ok)}.quiz .msg.bad{color:var(--bad)}
.score{font:500 .8rem var(--f-mono);color:var(--muted)}
.readout{font-variant-numeric:tabular-nums;color:var(--accent)}
footer{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
footer p{margin:0;max-width:110ch}
/* compteur à rouleaux, comme un compteur mécanique */
.odo-wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-left:auto}
.hdr-ctl{flex-basis:100%}
.odo{display:flex;align-items:center;gap:8px}
.odo-lbl{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.odo-num{display:inline-flex;gap:2px;padding:3px;background:var(--odo-case);border:1px solid var(--line);border-radius:5px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.odo-d{position:relative;width:1.1em;height:1.55em;overflow:hidden;border-radius:2px;background:var(--odo-bg);font:600 1.15rem var(--f-mono)}
.odo-d::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55);z-index:2}
.odo-d::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0) 32%,rgba(255,255,255,.06) 50%,rgba(0,0,0,0) 68%,rgba(0,0,0,.6))}
.odo-strip{display:flex;flex-direction:column;will-change:transform}
.odo-strip span{display:block;height:1.55em;line-height:1.55em;text-align:center;color:var(--odo-fg)}
@media (prefers-reduced-motion:reduce){.odo-strip{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1><small>VSISA · Virtual Simulator identification Signal Audio · OpenBookRadio</small><span id="tTitle">Identificateur de modes radio</span></h1>
    <div class="odo-wrap" id="odo" hidden>
      <div class="odo"><span class="odo-lbl" id="tOdoV">visites</span><span class="odo-num" id="odoV"></span></div>
      <div class="odo"><span class="odo-lbl" id="tOdoP">écoutes</span><span class="odo-num" id="odoP"></span></div>
    </div>
    <div class="hdr-ctl">
      <label class="langlbl" for="lang"><span id="tLang">Langue</span>
        <select id="lang"></select></label>
      <a class="btn book" id="tBook" href="https://github.com/ic3fr/OpenBookRadio/releases" target="_blank" rel="noopener">Télécharger le livre</a>
      <label class="langlbl" for="theme"><span id="tTheme">Affichage</span>
        <select id="theme"><option value="day">Jour</option><option value="night">Nuit (rouge)</option><option value="phos">Phosphore vert</option><option value="phosb">Phosphore bleu</option><option value="phosa">Phosphore orange</option></select></label>
      <button class="btn" id="mystery" type="button">Son mystère</button>
    </div>
  </header>

  <div class="grid">
    <aside id="modes" aria-label="Signaux"></aside>

    <main>
      <div class="bar">
        <div class="now">
          <h2 id="nowName">—</h2>
          <p id="nowTags">—</p>
        </div>
        <div class="controls">
          <button class="btn primary" id="play" type="button">▶ Écouter</button>
          <button class="btn" id="stop" type="button">■ Stop</button>
          <label for="noise"><span id="tNoise">Bruit</span> <input type="range" id="noise" min="0" max="100" value="15"></label>
          <label for="vol"><span id="tVol">Volume</span> <input type="range" id="vol" min="0" max="100" value="55"></label>
          <label for="loop"><input type="checkbox" id="loop" checked> <span id="tLoop">En boucle</span></label>
        </div>
      </div>

      <section class="screen" aria-label="Spectre et waterfall en direct">
        <div class="screen-head"><b id="tSpecwf">Spectre + Waterfall</b><span><span id="spanLbl">—</span> · <span id="tCursor">curseur</span> <span class="readout" id="ro1">—</span></span></div>
        <canvas id="sp" width="600" height="140" style="border-bottom:1px solid var(--line)"></canvas>
        <canvas id="wf" width="600" height="240"></canvas>
        <div class="ruler" id="ruler1"></div>
      </section>

      <div class="two">
        <section class="screen" aria-label="Empreinte du signal">
          <div class="screen-head"><b id="tFoot">Empreinte</b><span id="dur">—</span></div>
          <canvas id="fp" width="600" height="300"></canvas>
          <div class="ruler" id="ruler2"></div>
        </section>
        <section class="card" id="info" aria-live="polite"></section>
      </div>
    </main>
  </div>

  <footer>
    <p id="tF1"></p>
    <p id="tF2"></p>
    <p><a id="tBook2" href="https://github.com/ic3fr/OpenBookRadio/releases" target="_blank" rel="noopener" style="color:var(--accent)">Télécharger le livre</a></p>
  </footer>
</div>

<script>
(function(){
"use strict";
const SR = 12000, TAU = 2*Math.PI, FC = 3000;
const I18N = /*I18N*/{};
const LANGS=[["fr","Français","fr-FR"],["en","English","en-GB"],["es","Español","es-ES"],["de","Deutsch","de-DE"],["nl","Nederlands","nl-NL"],["cs","Čeština","cs-CZ"],["pt","Português","pt-PT"],["it","Italiano","it-IT"],["pl","Polski","pl-PL"],["ru","Русский","ru-RU"],["uk","Українська","uk-UA"],["zh","中文","zh-CN"],["ja","日本語","ja-JP"]];
let LG="fr", LOC="fr-FR";
function t(k){ return (I18N[LG]&&I18N[LG].ui[k])||I18N.fr.ui[k]||k; }
/* compteur de visites et d'écoutes : seulement sur la page en ligne (github.io), service Abacus sans cookie */
const CNT_NS="ic3fr-vsisa", CNT_ON=/(^|\.)github\.io$/.test(location.hostname);
let stV=null, stP=null;
function setOdo(el,value){ // chaque chiffre est un rouleau 0-9 (répété) qui tourne toujours vers l'avant
  const s=String(Math.max(0,Math.floor(value))).padStart(6,"0"), first=!el.children.length;
  while(el.children.length<s.length){ const d=document.createElement("span"); d.className="odo-d"; d.setAttribute("aria-hidden","true"); const st=document.createElement("span"); st.className="odo-strip";
    for(let k=0;k<40;k++){ const c=document.createElement("span"); c.textContent=k%10; st.appendChild(c); } d.appendChild(st); d._i=0; el.insertBefore(d,el.firstChild); }
  [...el.children].forEach((d,k)=>{ const pos=el.children.length-1-k, digit=+s[k], st=d.firstChild;
    if(d._i>=10){ st.style.transition="none"; d._i-=10; st.style.transform=`translateY(${-d._i*1.55}em)`; void st.offsetHeight; }
    let target=d._i+((digit-d._i%10)+10)%10; if(first&&pos<3) target+=10*(3-pos)-(target>=30?10:0);
    if(target===d._i) return;
    st.style.transition=`transform ${first?1.2+0.25*pos:0.7}s cubic-bezier(.25,.9,.3,1)`; st.style.transform=`translateY(${-target*1.55}em)`; d._i=target; });
  el.setAttribute("aria-label",Number(value).toLocaleString(LOC)); el.setAttribute("role","img"); }
function showStats(){ const box=document.getElementById("odo"); if(!box) return; if(stV==null){ box.hidden=true; return; }
  box.hidden=false; document.getElementById("tOdoV").textContent=t("visits"); document.getElementById("tOdoP").textContent=t("plays");
  setOdo(document.getElementById("odoV"),stV); if(stP!=null) setOdo(document.getElementById("odoP"),stP); }
function cnt(path){ return fetch("https://abacus.jasoncameron.dev/"+path).then(r=>r.ok?r.json():null).then(j=>j&&typeof j.value==="number"?j.value:null).catch(()=>null); }
if(CNT_ON){ let seen=false; try{ seen=sessionStorage.getItem("vsisa-seen")==="1"; sessionStorage.setItem("vsisa-seen","1"); }catch(e){}
  cnt((seen?"get/":"hit/")+CNT_NS+"/visits").then(v=>{ stV=v; showStats(); });
  cnt("get/"+CNT_NS+"/plays").then(v=>{ if(v!=null){ stP=v; showStats(); } }); }

/* ================= outils de synthèse ================= */
const rnd=Math.random;
function gauss(){ let u=0; for(let i=0;i<6;i++) u+=rnd(); return (u-3)*1.4142; }
function Z(n){ return new Float32Array(n); }
function tArr(n){ const t=Z(n); for(let i=0;i<n;i++) t[i]=i/SR; return t; }
function addNoise(x,l){ for(let i=0;i<x.length;i++) x[i]+=l*gauss(); return x; }
function fm(fi,amp){ amp=amp==null?1:amp; const x=Z(fi.length); let ph=0; for(let i=0;i<fi.length;i++){ ph+=TAU*fi[i]/SR; if(ph>1e6) ph%=TAU; x[i]=amp*Math.cos(ph); } return x; }
function bits(n){ const b=new Uint8Array(n); for(let i=0;i<n;i++) b[i]=rnd()<.5?0:1; return b; }
function ri(a){ return Math.floor(rnd()*a); }
function ramp(L,r){ r=r||0.005; const o=Z(L), w=r*SR; for(let k=0;k<L;k++) o[k]=Math.min(1,Math.min(k,L-1-k)/w); return o; }
function smooth(a,w){ // moyenne glissante centrée
  const o=Z(a.length); let s=0; const h=Math.floor(w/2);
  for(let i=0;i<a.length+h;i++){ if(i<a.length) s+=a[i]; if(i-w>=0) s-=a[i-w]; const j=i-h; if(j>=0&&j<a.length) o[j]=s/w; } return o; }
function hannK(n){ const w=Z(n); let s=0; for(let i=0;i<n;i++){ w[i]=0.5-0.5*Math.cos(TAU*(i+1)/(n+1)); s+=w[i]; } for(let i=0;i<n;i++) w[i]/=s; return w; }
function conv(a,k){ const o=Z(a.length), h=Math.floor(k.length/2); for(let i=0;i<a.length;i++){ let s=0; for(let j=0;j<k.length;j++){ const q=i+j-h; if(q>=0&&q<a.length) s+=a[q]*k[j]; } o[i]=s; } return o; }

/* ================= FFT ================= */
const fftCache={};
function fftPlan(n){ if(fftCache[n]) return fftCache[n]; const bitsN=Math.log2(n), rev=new Uint32Array(n);
  for(let i=0;i<n;i++){ let r=0; for(let b=0;b<bitsN;b++) r=(r<<1)|((i>>b)&1); rev[i]=r; }
  const k=new Float64Array(n); for(let i=0;i<n;i++){ const x=i/(n-1); k[i]=0.35875-0.48829*Math.cos(TAU*x)+0.14128*Math.cos(2*TAU*x)-0.01168*Math.cos(3*TAU*x); }
  let ws=0; for(let i=0;i<n;i++) ws+=k[i];
  return fftCache[n]={rev,win:k,ws,re:new Float64Array(n),im:new Float64Array(n)}; }
function fft(re,im,rev){ const n=re.length;
  for(let i=0;i<n;i++){ const j=rev[i]; if(j>i){ let t=re[i];re[i]=re[j];re[j]=t; t=im[i];im[i]=im[j];im[j]=t; } }
  for(let size=2;size<=n;size<<=1){ const h=size>>1, ang=-TAU/size, wr=Math.cos(ang), wi=Math.sin(ang);
    for(let s=0;s<n;s+=size){ let cr=1,ci=0; for(let k=0;k<h;k++){ const a=s+k,b=a+h, tr=re[b]*cr-im[b]*ci, ti=re[b]*ci+im[b]*cr;
      re[b]=re[a]-tr; im[b]=im[a]-ti; re[a]+=tr; im[a]+=ti; const nr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=nr; } } } }
function ssb(msg,fc){ // bande latérale supérieure par signal analytique (Hilbert par FFT)
  let n=1; while(n<msg.length) n<<=1; const P=fftPlan(n), re=new Float64Array(n), im=new Float64Array(n);
  for(let i=0;i<msg.length;i++) re[i]=msg[i]; fft(re,im,P.rev);
  for(let i=1;i<n/2;i++){ re[i]*=2; im[i]*=2; } for(let i=n/2+1;i<n;i++){ re[i]=0; im[i]=0; }
  for(let i=0;i<n;i++) im[i]=-im[i]; fft(re,im,P.rev); for(let i=0;i<n;i++){ re[i]/=n; im[i]=-im[i]/n; }

const W=600;
function spectrumRaw(sig,center,m){
  const n=m.nfft, P=fftPlan(n), re=P.re, im=P.im, st=center-(n>>1);
  for(let i=0;i<n;i++){ const j=st+i; re[i]=(j>=0&&j<sig.length?sig[j]:0)*P.win[i]; im[i]=0; }
  fft(re,im,P.rev); const binHz=SR/n, row=new Float32Array(W), [f0,f1]=m.span, norm=P.ws*P.ws;
  const pw=b=>(re[b]*re[b]+im[b]*im[b])/norm;
  for(let x=0;x<W;x++){ const fa=f0+(x/W)*(f1-f0), fb=f0+((x+1)/W)*(f1-f0), ba=fa/binHz, bb=fb/binHz; let p;
    if(bb-ba<1){ const c=(ba+bb)/2, i0=Math.floor(c), u=c-i0; p=pw(i0)*(1-u)+pw(Math.min(n/2,i0+1))*u; }
    else { p=0; for(let b=Math.floor(ba);b<=Math.floor(bb)&&b<=n/2;b++){ const v=pw(b); if(v>p) p=v; } }
    row[x]=10*Math.log10(p+1e-14); }
  return row;
}

  const H=sp.height; sctx.fillStyle=P().bg; sctx.fillRect(0,0,W,H); sctx.font="400 10px 'IBM Plex Mono',monospace"; sctx.textAlign="left"; sctx.lineWidth=1;
  for(let db=0;db>=-50;db-=10){ const y=Math.round(H-(db+DR)/DR*H)+.5; sctx.strokeStyle=P().grid; sctx.beginPath(); sctx.moveTo(0,y); sctx.lineTo(W,y); sctx.stroke(); sctx.fillStyle=P().lab; if(db<0) sctx.fillText(db+" dB",4,y-3); }
  for(const t of ticks(current)){ const x=Math.round(t.p*W)+.5; sctx.strokeStyle=P().grid2; sctx.beginPath(); sctx.moveTo(x,0); sctx.lineTo(x,H); sctx.stroke(); }
  if(peak){ sctx.strokeStyle=P().peak; sctx.beginPath(); for(let x=0;x<W;x++){ const y=H-peak[x]*H; x?sctx.lineTo(x,y):sctx.moveTo(x,y);} sctx.stroke(); }
  const g=sctx.createLinearGradient(0,0,0,H); g.addColorStop(0,P().f0); g.addColorStop(1,P().f1);
  sctx.beginPath(); sctx.moveTo(0,H); for(let x=0;x<W;x++) sctx.lineTo(x,H-row[x]*H); sctx.lineTo(W,H); sctx.closePath(); sctx.fillStyle=g; sctx.fill();
  sctx.beginPath(); for(let x=0;x<W;x++){ const y=H-row[x]*H; x?sctx.lineTo(x,y):sctx.moveTo(x,y);} sctx.strokeStyle=P().line; sctx.lineWidth=1.5; sctx.stroke(); sctx.lineWidth=1;
  if(label){ sctx.textAlign="right"; sctx.fillStyle=P().txt; sctx.fillText(label,W-6,13); }
}
function restSpectrum(){ peak=null; if(avgRow) drawSpectrum(avgRow,t("avg")); }
function blankWaterfall(msg){
  const img=wctx.createImageData(W,WH); for(let y=0;y<WH;y++){ const r=new Float32Array(W); for(let x=0;x<W;x++) r[x]=0.05+rnd()*0.08; paintRow(img,y,r); }
  wctx.putImageData(img,0,0); wctx.fillStyle=P().txt; wctx.font="500 15px 'IBM Plex Sans',system-ui,sans-serif"; wctx.textAlign="center"; wctx.fillText(msg,W/2,WH/2+5);
}

/* ================= règle des fréquences ================= */
function ticks(m){ if(!m) return []; const [a,b]=m.span, s=m.scale, w=(b-a)*s, raw=w/6, p=Math.pow(10,Math.floor(Math.log10(raw)));
  let step=p; for(const k of [1,2,2.5,5,10]) if(k*p>=raw){ step=k*p; break; }
  const out=[]; for(let v=Math.ceil(a*s/step)*step; v<=b*s+1e-9; v+=step) out.push({v,p:(v/s-a)/(b-a)}); return out; }
function fmtF(v,m){ const w=(m.span[1]-m.span[0])*m.scale; if(w>=4000) return (v/1000).toLocaleString(LOC,{maximumFractionDigits:2})+" k"; return v.toLocaleString(LOC,{maximumFractionDigits:1}); }
function ruler(id){ const el=document.getElementById(id); el.textContent="";
  for(const t of ticks(current)){ const s=document.createElement("span"); s.style.left=(t.p*100)+"%"; s.textContent=fmtF(t.v,current); if(t.p<0.04) s.className="first"; else if(t.p>0.96) s.className="last"; el.appendChild(s); } }

/* ================= sélection, fiche, quiz ================= */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function spanText(m,hide){ const u=(m.span[1]-m.span[0])*m.scale>=4000?"kHz":"Hz", d=u==="kHz"?1000:1;
  const f=v=>(v*m.scale/d).toLocaleString(LOC,{maximumFractionDigits:2}); const n=hide?"":tx(m).note; return f(m.span[0])+" – "+f(m.span[1])+" "+u+(n?" · "+n:""); }
function select(m,hidden){
  stop(); current=m; signal=buildSignal(m);
  document.querySelectorAll(".mode").forEach(b=>b.setAttribute("aria-pressed",String(!hidden&&b.dataset.id===m.id)));
  setNow(m,hidden);
  document.getElementById("spanLbl").textContent=spanText(m,hidden);
  ruler("ruler1"); ruler("ruler2"); analyse(); blankWaterfall(t("press"));
  hidden?renderQuiz():renderInfo(m);
  try{ if(!hidden) localStorage.setItem("idmr-mode",m.id); }catch(e){}
}
function setNow(m,hidden){ const x=tx(m);
  document.getElementById("nowName").textContent=hidden?t("myst"):x.title;
  document.getElementById("nowTags").textContent=hidden?t("mystTags"):x.group+(m.ref?" · "+t("sheet")+" "+m.ref:""); }
let lastPrefix="";
function renderInfo(m,prefix){ lastPrefix=prefix||""; const x=tx(m);
  const rows=[[t("principle"),x.how],[t("screen"),x.look]].concat(x.rows).filter(r=>r[1]);
  document.getElementById("info").innerHTML=lastPrefix+`<h3>${esc(x.title)}</h3><dl>${rows.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>`+
    (m.ref?`<a class="ref" href="https://github.com/ic3fr/OpenBookRadio/releases" target="_blank" rel="noopener">${esc(t("book").replace("{r}",m.ref))}</a>`:"");
  const ag=document.getElementById("again"); if(ag) ag.addEventListener("click",mystery);
}
function renderQuiz(){ const el=document.getElementById("info");
  el.innerHTML=`<div class="quiz"><h3>${esc(t("quizH"))}</h3><p class="lead">${esc(t("quizLead"))}</p>
    <div class="choices">${quiz.choices.map(c=>`<button class="btn" type="button" data-a="${c.id}">${esc(tx(c).name)}</button>`).join("")}</div><p class="score">${esc(t("score"))} : ${score.ok} / ${score.n}</p></div>`;
  el.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>answer(b.dataset.a))); }
function answer(id){ const good=id===quiz.mode.id; score.n++; if(good) score.ok++; const m=quiz.mode; quiz=null; document.getElementById("spanLbl").textContent=spanText(m);
  setNow(m,false);
  document.querySelectorAll(".mode").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.id===m.id)));
  renderInfo(m,`<div class="quiz" style="margin-bottom:14px"><p class="msg ${good?"ok":"bad"}">${good?esc(t("good")):esc(t("bad").replace("{x}",tx(m).name))}</p><p class="score">${esc(t("score"))} : ${score.ok} / ${score.n}</p><div><button class="btn primary" type="button" id="again">${esc(t("next"))}</button></div></div>`); }
function mystery(){ const m=MODES[ri(MODES.length)]; const others=MODES.filter(x=>x!==m).sort(()=>rnd()-.5).slice(0,3);
  quiz={mode:m,choices:[m,...others].sort(()=>rnd()-.5)}; select(m,true); play(); }

/* ================= audio ================= */
function play(){
  if(!signal) return; stop();
  try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  if(ctx.state==="suspended") ctx.resume();
  const chans=AUD?(AUD.R?[AUD.L,AUD.R]:[AUD.L]):[signal], n=chans[0].length; let buf;
  try{ buf=ctx.createBuffer(chans.length,n,SR); chans.forEach((c,ci)=>buf.getChannelData(ci).set(c)); }
  catch(e){ const k=Math.max(2,Math.round(ctx.sampleRate/SR)); buf=ctx.createBuffer(chans.length,n*k,SR*k);
    chans.forEach((c,ci)=>{ const o=buf.getChannelData(ci); for(let i=0;i<n;i++){ const a=c[i], b=c[i+1<n?i+1:i]; for(let j=0;j<k;j++) o[i*k+j]=a+(b-a)*j/k; } }); }
  src=ctx.createBufferSource(); src.buffer=buf; src.loop=document.getElementById("loop").checked;
  gain=ctx.createGain(); gain.gain.value=document.getElementById("vol").value/100*0.8; src.connect(gain).connect(ctx.destination);
  const me=src; src.onended=()=>{ if(playing&&src===me&&!me.loop){ playing=false; fctx.putImageData(fpImage,0,0); restSpectrum(); } };
  if(CNT_ON) cnt("hit/"+CNT_NS+"/plays").then(v=>{ if(v!=null){ stP=v; showStats(); } });
  t0=ctx.currentTime+0.05; src.start(t0); lastRow=0; playing=true; peak=null;
  const img=wctx.createImageData(W,WH); for(let y=0;y<WH;y++) paintRow(img,y,new Float32Array(W)); wctx.putImageData(img,0,0);
  requestAnimationFrame(tick);
}
function stop(){ playing=false; if(src){ try{src.stop();}catch(e){} src.disconnect(); src=null; } if(fpImage) fctx.putImageData(fpImage,0,0); restSpectrum(); }
function tick(){
  if(!playing||!ctx||!src) return;
  const m=current, dur=signal.length/SR, el=ctx.currentTime-t0;
  if(el>=0){ const target=Math.floor(el*m.rps); let added=0, last=null;
    while(lastRow<target&&added<8){ const tt=lastRow/m.rps, pos=src.loop?tt%dur:tt;
      const row=pos<dur?norm(spectrumRaw(signal,Math.round(pos*SR),m)):new Float32Array(W);
      wctx.drawImage(wf,0,0,W,WH-1,0,1,W,WH-1); const img=wctx.createImageData(W,1); paintRow(img,0,row); wctx.putImageData(img,0,0);
      lastRow++; added++; last=row; }
    if(added===8) lastRow=target;
    if(last){ if(!peak) peak=Float32Array.from(last); else for(let x=0;x<W;x++) peak[x]=Math.max(last[x],peak[x]-0.006); drawSpectrum(last); }
    const p=(src.loop?el%dur:Math.min(el,dur))/dur; fctx.putImageData(fpImage,0,0); fctx.fillStyle=P().head; fctx.fillRect(0,Math.round(p*fp.height),W,2); }
  requestAnimationFrame(tick);
}

/* ================= interface ================= */
[sp,wf,fp].forEach(cv=>{
  cv.addEventListener("pointermove",e=>{ if(!current) return; const r=cv.getBoundingClientRect(), u=(e.clientX-r.left)/r.width, m=current;
    const f=(m.span[0]+u*(m.span[1]-m.span[0]))*m.scale, w=(m.span[1]-m.span[0])*m.scale;
    document.getElementById("ro1").textContent=w>=4000?(f/1000).toLocaleString(LOC,{maximumFractionDigits:2})+" kHz":f.toLocaleString(LOC,{maximumFractionDigits:w<100?1:0})+" Hz"; });
  cv.addEventListener("pointerleave",()=>document.getElementById("ro1").textContent="—");
});
const aside=document.getElementById("modes");
function buildAside(){ aside.textContent=""; aside.setAttribute("aria-label",t("signals"));
  const cnt=document.createElement("p"); cnt.className="count"; cnt.textContent=MODES.length+" "+t("signals").toLocaleLowerCase(LOC); aside.appendChild(cnt);
  const groups=(I18N[LG]&&I18N[LG].groups)||I18N.fr.groups;
  groups.forEach((g,gi)=>{ const ms=MODES.filter(m=>m.gi===gi); if(!ms.length) return;
    const d=document.createElement("div"); d.className="group"; d.innerHTML=`<h2>${esc(g)}</h2><ul></ul>`;
    ms.forEach(m=>{ const x=tx(m), li=document.createElement("li");
      li.innerHTML=`<button class="mode" type="button" data-id="${m.id}" aria-pressed="${String(!quiz&&current===m)}">${esc(x.name)}<span>${esc(x.short)}</span></button>`;
      li.firstChild.addEventListener("click",()=>{ quiz=null; select(m); play(); }); d.querySelector("ul").appendChild(li); });
    aside.appendChild(d); }); }
function setLang(l,user){ if(!I18N[l]) l="fr"; LG=l; LOC=(LANGS.find(x=>x[0]===l)||LANGS[0])[2]; document.documentElement.lang=l;
  const sel=document.getElementById("lang"); sel.value=l;
  const T={tBook:"book_dl",tBook2:"book_dl2",tTitle:"title",tLang:"lang",mystery:"mystery",play:"play",stop:"stop",tNoise:"noise",tVol:"volume",tLoop:"loop",tSpecwf:"specwf",tCursor:"cursor",tFoot:"footprint",tF1:"f1",tF2:"f2"};
  for(const id in T) document.getElementById(id).textContent=t(T[id]);
  document.getElementById("tTheme").textContent=t("display"); document.getElementById("theme").setAttribute("aria-label",t("display")); sel.setAttribute("aria-label",t("lang"));
  [["day","theme_day"],["night","theme_night"],["phos","theme_phos"],["phosb","theme_phosb"],["phosa","theme_phosa"]].forEach(([v,k])=>{ document.querySelector('#theme option[value="'+v+'"]').textContent=t(k); });
  document.title=t("title")+" · VSISA"; showStats();
  if(user){ try{ localStorage.setItem("idmr-lang",l); }catch(e){} try{ history.replaceState(null,"","#"+l); }catch(e){} }
  buildAside();
  if(current){ setNow(current,!!quiz); document.getElementById("spanLbl").textContent=spanText(current,!!quiz); ruler("ruler1"); ruler("ruler2");
    if(quiz) renderQuiz(); else renderInfo(current,""); if(!playing){ restSpectrum(); blankWaterfall(t("press")); }
    const d=signal.length/SR; document.getElementById("dur").textContent=t("dur").replace("{s}",d.toLocaleString(LOC,{minimumFractionDigits:1,maximumFractionDigits:1})); } }
(function(){ const sel=document.getElementById("lang"); LANGS.forEach(([c,n])=>{ const o=document.createElement("option"); o.value=c; o.textContent=n; sel.appendChild(o); });
  sel.addEventListener("change",()=>setLang(sel.value,true)); })();
function setTheme(th){ if(!PALS[th]) th="day"; THEME=th; LUT=LUTS[th];
  const h=document.documentElement; h.classList.toggle("night",th==="night"); h.classList.toggle("phos",th.startsWith("phos")); h.classList.toggle("blue",th==="phosb"); h.classList.toggle("amber",th==="phosa");
  document.getElementById("theme").value=th;
  try{ localStorage.setItem("idmr-theme",th); }catch(e){}
  if(current&&signal){ analyse(); if(!playing) blankWaterfall(t("press")); } }
document.getElementById("theme").addEventListener("change",e=>setTheme(e.target.value));
document.getElementById("play").addEventListener("click",play);
document.getElementById("stop").addEventListener("click",stop);
document.getElementById("mystery").addEventListener("click",mystery);
document.getElementById("vol").addEventListener("input",e=>{ if(gain) gain.gain.value=e.target.value/100*0.8; });
document.getElementById("loop").addEventListener("change",e=>{ if(src) src.loop=e.target.checked; });
document.getElementById("noise").addEventListener("change",()=>{ if(!current) return; const was=playing, hidden=!!quiz; stop();
  signal=buildSignal(current); analyse(); if(was) play(); else blankWaterfall(t("press")); if(hidden) renderQuiz(); });

function browserLang(){ // langue du navigateur : on parcourt toute la liste de préférences (zh-TW, pt-BR, de-CH… comptent aussi)
  const alias={cz:"cs",ua:"uk",jp:"ja",cn:"zh",be:"ru"};
  const list=[].concat(navigator.languages||[],navigator.language||[],navigator.userLanguage||[]);
  for(const tag of list){ if(!tag) continue; const b=String(tag).toLowerCase().split(/[-_]/)[0], c=alias[b]||b; if(I18N[c]) return c; }
  return "en"; }
let lg0=location.hash.slice(1);
if(!I18N[lg0]){ try{ lg0=localStorage.getItem("idmr-lang")||""; }catch(e){ lg0=""; } }
if(!I18N[lg0]) lg0=browserLang();
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(I18N[h]&&h!==LG) setLang(h); });
let start=MODES.find(m=>m.id==="psk31");
try{ const s=localStorage.getItem("idmr-mode"); const f=MODES.find(m=>m.id===s); if(f) start=f; }catch(e){}
try{ THEME=localStorage.getItem("idmr-theme")||(localStorage.getItem("idmr-night")==="1"?"night":"day"); }catch(e){}
setLang(lg0);
setTheme(THEME);
select(start);
})();
</script>
